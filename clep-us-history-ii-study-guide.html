<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEP US History II</title>
<meta name="description" content="Self-paced study guide for the CLEP History of the United States II exam: lessons, quizzes, flashcards, practice exams.">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --surface2:#f2f0ea; --ink:#1d232a; --muted:#5d6670; --line:#dedad0;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --good:#24774a; --good-soft:#e2f2e8; --bad:#b03a2e; --bad-soft:#f8e3e0; --warn:#9a6a00; --warn-soft:#fbf0d4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
  --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
  --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
  --shadow:none; color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
    --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
    --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
    --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{max-width:860px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;text-decoration:none;color:var(--ink);font-size:1.02rem;letter-spacing:.01em}
.brand small{font-weight:500;color:var(--muted)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
nav.tabs{max-width:860px;margin:0 auto;padding:6px 12px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:999px;font-size:.9rem}
nav.tabs a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;line-height:1.25;margin:.2em 0 .5em}
h2{font-size:1.25rem;margin:1.6em 0 .5em}
h3{font-size:1.05rem;margin:1.3em 0 .4em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>span{background:var(--good)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:.92rem}
/* lesson */
.lesson{font-family:var(--serif);font-size:1.08rem;line-height:1.7}
.lesson h2{font-family:var(--sans)}
.lesson h3{font-family:var(--sans)}
.lesson p{margin:.7em 0}
.lesson strong{font-weight:700}
.lesson ul{padding-left:1.2em}
.cec{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin:14px 0;font-family:var(--sans);font-size:.88rem}
.cec div.b{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.cec div.b b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cec .ar{align-self:center;color:var(--muted)}
@media (max-width:600px){.cec{grid-template-columns:1fr}.cec .ar{transform:rotate(90deg);justify-self:center}}
.mustknow{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 16px}
.mustknow ol{margin:.3em 0;padding-left:1.3em}
.mustknow li{margin:.35em 0}
/* timeline */
.tl{position:relative;margin:10px 0 10px 6px;padding-left:22px;border-left:2px solid var(--line)}
.tl .ev{position:relative;margin:0 0 12px}
.tl .ev::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl .ev.key::before{background:var(--accent);border-color:var(--accent)}
.tl .yr{font-weight:700;font-variant-numeric:tabular-nums;margin-right:8px}
.tl .ev.key .yr{color:var(--accent)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stem{font-size:1.07rem;font-weight:500;margin:6px 0 12px}
.stim{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-family:var(--serif);font-size:1rem}
.stim table{font-family:var(--sans);font-size:.88rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;align-items:flex-start}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt .ex{display:block;font-size:.88rem;color:var(--muted);margin-top:4px}
.opt.right .ex,.opt.wrong .ex{color:var(--ink)}
.opt[disabled]{cursor:default}
.kbd{font:600 .75rem var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface2)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;margin-top:10px}
.navgrid button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:4px 0;font:inherit;font-size:.75rem;cursor:pointer}
.navgrid button.ans{background:var(--accent-soft);color:var(--ink)}
.navgrid button.cur{outline:2px solid var(--accent)}
.navgrid button.flag{border-color:var(--warn);border-width:2px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.timer.low{color:var(--bad)}
/* flashcards */
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;padding:28px 20px;cursor:pointer;user-select:none}
.fc .back{font-size:1.02rem;font-family:var(--serif);line-height:1.6}
.boxes{display:flex;gap:6px;align-items:flex-end;height:70px;margin:8px 0}
.boxes div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;position:relative;opacity:.85}
.boxlbl{display:flex;gap:6px}.boxlbl span{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
/* readiness */
.meter{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dial{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;flex:none}
.dial span{background:var(--surface);width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
.dial small{font-size:.65rem;color:var(--muted);font-weight:600;text-transform:uppercase}
/* cheat sheet */
.cheat{font-size:.82rem;line-height:1.35;columns:2 300px;column-gap:20px}
.cheat section{break-inside:avoid;margin:0 0 12px}
.cheat h3{margin:.2em 0 .3em;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.cheat table{font-size:.78rem}
.cheat td,.cheat th{padding:2px 4px}
.cheat ul{margin:0;padding-left:1em}
.cheat.memo .m{filter:blur(5px);cursor:pointer;transition:filter .15s}
.cheat.memo .m.show{filter:none}
.kbdhint{font-size:.8rem;color:var(--muted);margin-top:10px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.plan td:first-child{white-space:nowrap}
.tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media print{
  header.top,.noprint,.banner{display:none!important}
  body{background:#fff;color:#000;font-size:10pt}
  main{max-width:none;padding:0}
  .card{border:none;box-shadow:none;padding:0;margin:0}
  .cheat{columns:3;column-gap:12px;font-size:6.6pt;line-height:1.22}
  .cheat h3{font-size:7pt;color:#000;margin:0 0 1px}
  .cheat table{font-size:6.3pt}
  .cheat section{margin:0 0 5px}
  .cheat.memo .m{filter:none}
  .printhead{font-size:9pt;margin:0 0 4px}
  @page{size:letter;margin:.35in}
}
</style>

t":70,"status":"verified"}],"skills_tested":{"items":["Identify and describe historical phenomena","Analyze and interpret historical phenomena","Compare and contrast historical phenomena"],"status":"verified (listed without percentages)"},"unit_plan":[{"unit":1,"title":"Reconstruction and the New South","years":"1865-1900","period":"early","weight":8},{"unit":2,"title":"The Gilded Age: Industry, Labor, the West, and the Cities","years":"1865-1900","period":"early","weight":12},{"unit":3,"title":"Populism, Empire, and the Progressive Era","years":"1890-1914","period":"early","weight":10},{"unit":4,"title":"World War I and the 1920s","years":"1914-1929","period":"late","weight":10},{"unit":5,"title":"The Great Depression and the New Deal","years":"1929-1941","period":"late","weight":10},{"unit":6,"title":"World War II","years":"1939-1945","period":"late","weight":8},{"unit":7,"title":"Early Cold War and the 1950s","years":"1945-1960","period":"late","weight":11},{"unit":8,"title":"Civil Rights, the Great Society, and Vietnam","years":"1954-1975","period":"late","weight":13},{"unit":9,"title":"From Watergate to Reagan","years":"1968-1989","period":"late","weight":9},{"unit":10,"title":"Contemporary America","years":"1989-present","period":"late","weight":9}],"unit_plan_note":"The official outline is thematic (5 themes) plus chronological (2 periods). Units are chronological so the story can be learned in order; unit weights sum to the official 30% (1865-1914) / 70% (1915-present) split. Every question also carries a theme tag, and the bank is balanced to the official 30/30/10/20/10 theme weights."},"stats":{"total":318,"theme":{"cul":62,"dip":38,"eco":32,"pol":93,"soc":93},"period":{"early":120,"late":198},"diff":{"e":82,"m":169,"h":67},"pool":{"quiz":95,"diag":25,"A":99,"B":99}},"cheat":"<p>Cheat sheet coming soon.<\/p>","questions":[{"id":"u1q01","u":1,"th":"pol","d":"e","pool":"B","s":"Which constitutional amendment established that all persons born in the United States are citizens and guaranteed them \"equal protection of the laws\"?","st":"","o":["The Nineteenth Amendment","The Fifteenth Amendment","The Sixteenth Amendment","The Thirteenth Amendment","The Fourteenth Amendment"],"e":["The Nineteenth Amendment (1920) guaranteed women's suffrage.","The Fifteenth Amendment (1870) dealt with voting rights, not citizenship.","The Sixteenth Amendment (1913) authorized a federal income tax.","The Thirteenth Amendment (1865) abolished slavery but did not define citizenship.","Ratified in 1868, the Fourteenth Amendment defined national citizenship and barred states from denying due process or equal protection."],"a":4},{"id":"u1q02","u":1,"th":"pol","d":"e","pool":"A","s":"The Fifteenth Amendment (1870) prohibited states from denying the right to vote on the basis of","st":"","o":["sex","age, for citizens 18 or older","literacy","failure to pay a poll tax","race, color, or previous condition of servitude"],"e":["Sex was deliberately left out, which angered woman suffrage leaders. Women won the vote only with the Nineteenth Amendment in 1920.","The voting age was lowered to 18 by the Twenty-sixth Amendment (1971).","The Fifteenth Amendment said nothing about literacy, which is why southern states could later use literacy tests.","Poll taxes in federal elections were banned only by the Twenty-fourth Amendment (1964).","This is the amendment's exact wording. It aimed to protect Black men's suffrage."],"a":4},{"id":"u1q03","u":1,"th":"pol","d":"m","pool":"B","s":"Congress passed the Reconstruction Acts of 1867 mainly in response to which of the following?","st":"","o":["A Supreme Court ruling that the Thirteenth Amendment was unconstitutional","Southern states' passage of Black Codes and their refusal to ratify the Fourteenth Amendment","A wave of Black migration to Kansas","The disputed presidential election of 1876","The assassination of Abraham Lincoln"],"e":["No such ruling occurred. The Thirteenth Amendment was never struck down.","The Black Codes, the 1866 riots, and southern rejection of the Fourteenth Amendment convinced Congress to impose military reconstruction.","The Exoduster migration happened in 1879, after Reconstruction ended.","That election came almost a decade later and led to the end of Reconstruction, not its start.","Lincoln's death in 1865 brought Johnson to power, but the 1867 acts responded to what southern governments did under Johnson's lenient plan."],"a":1},{"id":"u1q04","u":1,"th":"pol","d":"m","pool":"diag","s":"The House of Representatives impeached President Andrew Johnson in 1868 chiefly because he had","st":"","o":["purchased Alaska without congressional approval","ordered federal troops out of the South","removed Secretary of War Edwin Stanton in apparent violation of the Tenure of Office Act","accepted bribes in the Crédit Mobilier scandal","refused to enforce the Fifteenth Amendment"],"e":["The Senate approved the Alaska treaty, and it was not a ground for impeachment.","Troops were withdrawn in 1877 under Hayes, not by Johnson.","The formal charges centered on Stanton's dismissal, though the real conflict was over Johnson's obstruction of Congressional Reconstruction.","Crédit Mobilier involved congressmen and Grant-era officials, not Johnson's impeachment.","The Fifteenth Amendment was not ratified until 1870, after Johnson left office."],"a":2},{"id":"u1q05","u":1,"th":"pol","d":"m","pool":"quiz","s":"Which of the following was a direct result of the Compromise of 1877?","st":"","o":["The Freedmen's Bureau was created.","Federal troops were withdrawn from the remaining Reconstruction governments in the South.","The Fifteenth Amendment was ratified.","Samuel Tilden became president.","Southern states were divided into five military districts."],"e":["The Freedmen's Bureau was created in 1865.","In return for Democrats accepting Hayes's election, the last federal troops left southern statehouses, ending Reconstruction.","The Fifteenth Amendment was ratified in 1870.","Tilden won the popular vote but lost the presidency to Hayes under the compromise.","Military districts were created by the Reconstruction Acts of 1867, the start of Radical Reconstruction rather than its end."],"a":1},{"id":"u1q06","u":1,"th":"pol","d":"h","pool":"quiz","s":"Which of the following occurred FIRST?","st":"","o":["The Fifteenth Amendment was ratified.","Andrew Johnson was impeached by the House.","Hiram Revels took his seat in the U.S. Senate.","Southern legislatures enacted Black Codes.","Rutherford B. Hayes became president."],"e":["The Fifteenth Amendment was ratified in 1870.","Johnson's impeachment came in 1868.","Revels was seated in 1870.","The Black Codes were passed in 1865–1866 under Presidential Reconstruction, before every other event listed.","Hayes took office in 1877."],"a":3},{"id":"u1q07","u":1,"th":"soc","d":"e","pool":"quiz","s":"Immediately after emancipation, which of the following was a top priority for many freedpeople?","st":"","o":["Moving to the Great Plains as cattle ranchers","Returning to work for their former owners for wages under the same conditions as slavery","Emigrating to Africa","Joining the Democratic Party","Reuniting families that had been separated by slavery"],"e":["A few moved West, but ranching was not a widespread priority.","Freedpeople resisted gang labor and conditions resembling slavery. This is why sharecropping emerged as a compromise.","Some emigration schemes existed, but very few freedpeople chose to leave.","Freedmen overwhelmingly supported the Republican Party, the party of Lincoln and Reconstruction.","Freedpeople traveled widely and placed newspaper ads searching for relatives sold away. Family reunification was a defining early goal."],"a":4},{"id":"u1q08","u":1,"th":"soc","d":"m","pool":"quiz","s":"The most lasting achievement of the Freedmen's Bureau was in the field of","st":"","o":["immigration control","railroad construction","voting rights enforcement","land redistribution","education"],"e":["Immigration had nothing to do with the Bureau's mission.","The Bureau did not build railroads.","Voting rights were enforced, briefly, by the army and the Enforcement Acts, not mainly by the Bureau.","Most confiscated land was returned to former owners after Johnson's pardons, so redistribution largely failed.","With northern aid societies, the Bureau set up thousands of schools and helped found Black colleges such as Howard and Fisk."],"a":4},{"id":"u1q09","u":1,"th":"soc","d":"m","pool":"A","s":"The Black Codes passed by southern states in 1865–1866 were designed primarily to","st":"","o":["provide public schools for Black children","redistribute plantation land to freedpeople","restrict the freedom of formerly enslaved people and keep them as a controlled labor force","implement the provisions of the Fourteenth Amendment","grant freedpeople limited voting rights"],"e":["The first southern public school systems came from Reconstruction governments, not the Black Codes.","The codes protected white landowners' interests rather than redistributing land.","Vagrancy laws, mandatory labor contracts, and limits on land ownership kept freedpeople working on plantations under white control.","The codes contradicted equal protection. Their passage helped prompt the amendment.","The Black Codes did not grant suffrage. Southern governments under Johnson refused Black voting."],"a":2},{"id":"u1q10","u":1,"th":"pol","d":"m","pool":"quiz","s":"Thaddeus Stevens and Charles Sumner are best known as leaders of which group?","st":"","o":["Populists who demanded free silver","Copperheads who opposed the Civil War","Radical Republicans in Congress who pushed for Black civil rights and strict terms for the South","Redeemer Democrats who ended Reconstruction","Liberal Republicans who opposed Grant in 1872"],"e":["Populism arose in the 1890s, after both men had died.","Copperheads were antiwar Democrats. Stevens and Sumner were firm Unionists.","Stevens (House) and Sumner (Senate) led the Radicals who took control of Reconstruction in 1867.","Redeemers were southern Democrats, opponents of the Radicals.","The Liberal Republicans of 1872 (Horace Greeley) wanted to end Reconstruction. Sumner did briefly side with them in 1872, but neither man is known as their leader."],"a":2},{"id":"u1q11","u":1,"th":"pol","d":"e","pool":"A","s":"The Supreme Court's decision in Plessy v. Ferguson (1896) is significant because it","st":"","o":["upheld state-mandated racial segregation under the \"separate but equal\" doctrine","outlawed segregation in public schools","established the right of the Court to review state laws","declared that Black Americans could not be citizens","struck down poll taxes in federal elections"],"e":["Plessy approved segregated railroad cars, giving constitutional cover to Jim Crow for nearly 60 years.","Segregated schools were struck down in Brown v. Board of Education (1954), which overturned Plessy's reasoning.","Judicial review dates to Marbury v. Madison (1803).","That was Dred Scott v. Sandford (1857), which the Fourteenth Amendment overturned.","Poll taxes in federal elections ended with the Twenty-fourth Amendment (1964)."],"a":0},{"id":"u1q12","u":1,"th":"pol","d":"h","pool":"A","s":"The statement above comes from","st":"<p>\"Our Constitution is color-blind, and neither knows nor tolerates classes among citizens.\"<\/p>","o":["the majority opinion in Plessy v. Ferguson","Booker T. Washington's Atlanta Compromise speech","Justice John Marshall Harlan's dissent in Plessy v. Ferguson","the majority opinion in the Civil Rights Cases","the text of the Fifteenth Amendment"],"e":["The majority upheld segregation, the opposite of this statement.","Washington's speech accepted social segregation for the time being. It did not attack it on constitutional grounds.","Harlan was the lone dissenter in Plessy. He argued that segregation violated the Fourteenth Amendment.","The majority in 1883 struck down the Civil Rights Act of 1875. (Harlan dissented there too, but this line is from Plessy.)","The Fifteenth Amendment concerns voting and does not contain this language."],"a":2},{"id":"u1q13","u":1,"th":"soc","d":"m","pool":"A","s":"In his 1895 Atlanta Compromise speech, Booker T. Washington urged Black Americans to","st":"","o":["demand immediate social and political equality through protest","focus on vocational training and economic progress while temporarily accepting segregation","support the Populist Party's alliance of Black and white farmers","emigrate to Africa to escape discrimination","form a separate political party to contest southern elections"],"e":["This was Du Bois's position, not Washington's.","Washington argued that economic self-help would earn respect and rights over time. Critics saw this as accommodation to Jim Crow.","Washington did not tie himself to the Populists.","Back-to-Africa ideas are associated with Marcus Garvey in the 1920s.","Washington avoided direct political confrontation."],"a":1},{"id":"u1q14","u":1,"th":"cul","d":"m","pool":"B","s":"W.E.B. Du Bois criticized Booker T. Washington chiefly because Du Bois believed that African Americans should","st":"","o":["separate completely from white society and return to Africa","demand full civil and political rights immediately and develop a college-educated \"Talented Tenth\"","move to the West to claim homesteads","avoid politics until they had achieved economic independence","concentrate on industrial and agricultural training"],"e":["Separatism is associated with Marcus Garvey, whom Du Bois opposed.","In <em>The Souls of Black Folk<\/em> (1903), Du Bois rejected accommodation and called for higher education and immediate equal rights.","Du Bois did not promote western migration.","This summarizes Washington's gradualism, which Du Bois opposed.","That was Washington's program at Tuskegee."],"a":1},{"id":"u1q15","u":1,"th":"soc","d":"e","pool":"A","s":"Ida B. Wells is best known for her","st":"","o":["leadership of the Exoduster migration to Kansas","service as the first African American U.S. senator","founding of Tuskegee Institute","journalism exposing and campaigning against lynching","novel <em>Uncle Tom's Cabin<\/em>"],"e":["The Exodusters are associated with Benjamin \"Pap\" Singleton.","That was Hiram Revels (1870).","Tuskegee was founded by Booker T. Washington.","Wells documented lynchings in works such as <em>Southern Horrors<\/em> (1892) and fought for federal anti-lynching action.","Harriet Beecher Stowe wrote <em>Uncle Tom's Cabin<\/em> (1852)."],"a":3},{"id":"u1q16","u":1,"th":"soc","d":"m","pool":"B","s":"Southern \"grandfather clauses\" of the 1890s were designed to","st":"","o":["require voters to have lived in the state for three generations","exempt white men from literacy tests and poll taxes if their ancestors could vote before 1867","guarantee voting rights to elderly freedmen","give land to the descendants of formerly enslaved people","let grandsons of Confederate veterans skip military service"],"e":["The clauses exempted voters from tests. They did not set residency requirements.","Since Black men could not vote before 1867, these clauses disfranchised Black voters while protecting poor whites' votes.","They did the opposite. They shielded white voters, not freedmen.","No such land policy existed.","The clauses concerned voting, not military service."],"a":1},{"id":"u1q17","u":1,"th":"eco","d":"m","pool":"quiz","s":"Under the crop-lien system that spread across the postwar South,","st":"","o":["farmers pooled crops in cooperatives to bypass middlemen","railroads guaranteed minimum prices for cotton","merchants supplied seed and goods on credit in exchange for a claim on the farmer's future crop","the federal government lent farmers money at low interest","landowners paid farm workers fixed daily wages"],"e":["Cooperatives were a Farmers' Alliance remedy against the crop-lien system, not the system itself.","Railroads set shipping rates. They did not guarantee crop prices.","High interest and falling cotton prices meant many farmers never got out of debt.","Federal farm credit programs came much later (Federal Farm Loan Act 1916, New Deal).","Wage labor was not the crop-lien arrangement. Credit secured by the crop was."],"a":2},{"id":"u1q18","u":1,"th":"eco","d":"m","pool":"A","s":"Henry Grady's idea of a \"New South\" called for the South to","st":"","o":["industrialize and diversify its economy by attracting northern investment","rely entirely on cotton exports to Britain","restore a plantation economy based on slave labor","secede again from the Union","redistribute land to freedpeople"],"e":["Grady, an Atlanta editor, promoted textile mills, railroads, and industry alongside reconciliation with the North.","Dependence on cotton was the problem the New South idea was meant to fix.","Slavery was abolished, and Grady looked forward rather than back.","Grady preached sectional reconciliation, not secession.","Grady did not advocate land redistribution."],"a":0},{"id":"u1q19","u":1,"th":"eco","d":"m","pool":"diag","s":"The arrangement described is best identified as","st":"<p>The following terms are typical of a contract signed in Georgia in 1867: The laborer agrees to cultivate the land and furnish his own labor. The owner furnishes land, a mule, tools, and seed. At harvest the owner receives one-half of the crop, and from the laborer's half are deducted all advances of food and supplies.<\/p>","o":["homesteading","indentured servitude","wage labor","sharecropping","the encomienda system"],"e":["Homesteaders got title to public land by living on and improving it.","Indentured servants worked a fixed term to repay passage. They were not paid a crop share.","Wage laborers receive fixed cash pay, not a share of the harvest.","The laborer works the owner's land and supplies and is paid with a share of the crop. That is the defining feature of sharecropping.","Encomienda was a Spanish colonial labor system."],"a":3},{"id":"u1q20","u":1,"th":"pol","d":"h","pool":"B","s":"Supreme Court decisions such as the Slaughterhouse Cases (1873) and United States v. Cruikshank (1876) affected Reconstruction by","st":"","o":["narrowing the protections of the Fourteenth Amendment and leaving the protection of Black citizens largely to the states","guaranteeing land to freedpeople as compensation for slavery","declaring the Reconstruction Acts unconstitutional","expanding federal power to prosecute private acts of violence","requiring the federal government to enforce desegregation of public schools"],"e":["These rulings read federal protections narrowly. In practice, that let southern states and private violence undermine Black rights.","No Supreme Court decision required land grants.","Neither case struck down the Reconstruction Acts.","Cruikshank did the reverse. It overturned federal convictions from the Colfax Massacre.","Court-ordered school desegregation began with Brown (1954)."],"a":0},{"id":"u1q21","u":1,"th":"pol","d":"m","pool":"B","s":"The Crédit Mobilier and Whiskey Ring scandals are associated with the presidency of","st":"","o":["Abraham Lincoln","Rutherford B. Hayes","Andrew Johnson","Ulysses S. Grant","Grover Cleveland"],"e":["Lincoln died in 1865. These scandals came to light in the 1870s.","Hayes came to office in 1877 promising reform after the Grant-era scandals.","Johnson's presidency was defined by his clashes with Congress, not these scandals.","Both scandals tarnished Grant's administration (1869–1877) and weakened northern support for Republican Reconstruction.","Cleveland was known for honesty and vetoes in the 1880s–1890s."],"a":3},{"id":"u1q22","u":1,"th":"soc","d":"m","pool":"A","s":"The Enforcement Acts and the Ku Klux Klan Act of 1870–1871 were passed in order to","st":"","o":["establish segregated public facilities","end military occupation of the South","grant amnesty to former Confederate officers","protect Black voters and officeholders from terrorist violence","prohibit Black men from serving on juries"],"e":["Segregation laws came from southern states later, not from these federal acts.","They expanded federal enforcement rather than ending it.","Amnesty came through presidential pardons and the Amnesty Act of 1872, not these acts.","These laws let federal courts and troops prosecute the Klan, which briefly broke the first Klan.","The acts aimed to protect, not restrict, Black civil rights."],"a":3},{"id":"u1q23","u":1,"th":"soc","d":"e","pool":"B","s":"Hiram Revels is historically significant as the","st":"","o":["first African American to serve in the U.S. Senate","head of the Freedmen's Bureau","author of <em>Up From Slavery<\/em>","founder of the NAACP","Supreme Court justice who dissented in Plessy"],"e":["Revels was elected from Mississippi and seated in 1870.","General Oliver O. Howard headed the Freedmen's Bureau.","<em>Up From Slavery<\/em> is Booker T. Washington's autobiography.","The NAACP was founded in 1909 by a multiracial group including Du Bois.","The Plessy dissenter was John Marshall Harlan."],"a":0},{"id":"u1q24","u":1,"th":"pol","d":"m","pool":"A","s":"Lincoln's Ten Percent Plan differed from the Wade-Davis Bill in that Lincoln's plan","st":"","o":["placed the South under military rule, while Wade-Davis did not","allowed a state to be restored once 10 percent of its 1860 voters took a loyalty oath, while Wade-Davis required a majority","required Black male suffrage, while Wade-Davis did not","was passed by Congress over a presidential veto","confiscated all plantations, while Wade-Davis protected property"],"e":["Military districts came in 1867 under Congress, not Lincoln's plan.","Lincoln favored a quick, lenient restoration. Congress's Wade-Davis Bill demanded 50 percent and an ironclad oath, and Lincoln pocket-vetoed it.","Neither plan required Black suffrage. That came with the 1867 Reconstruction Acts.","The Ten Percent Plan was an executive proclamation, not a law passed over a veto.","Lincoln's plan offered pardons and protected most property except enslaved people."],"a":1},{"id":"u1q25","u":1,"th":"dip","d":"e","pool":"quiz","s":"In 1867 the United States purchased Alaska from","st":"","o":["France","Russia","Great Britain","Mexico","Spain"],"e":["France sold Louisiana in 1803.","Secretary of State William Seward bought Alaska from Russia for $7.2 million, which critics mocked as \"Seward's Folly.\"","Britain controlled Canada, not Alaska.","Mexico ceded the Southwest in 1848. It never held Alaska.","Spain gave up Florida (1819) and later Puerto Rico and the Philippines (1898), not Alaska."],"a":1},{"id":"u1q26","u":1,"th":"soc","d":"h","pool":"A","s":"The \"Exodusters\" of 1879 were","st":"","o":["African Americans who left the South for Kansas to escape violence and economic oppression after Reconstruction","white farmers who abandoned the Dust Bowl for California","Chinese laborers expelled from California","former Confederates who emigrated to Brazil","Mormon settlers who moved from Illinois to Utah"],"e":["Thousands left after the troops were withdrawn, hoping for land and safety on the plains.","That describes the \"Okies\" of the 1930s.","Chinese exclusion is a separate story (1882 act). They were not called Exodusters.","Some Confederates did go to Brazil (the Confederados), but they were not called Exodusters.","The Mormon migration took place in the 1840s."],"a":0},{"id":"u1q27","u":1,"th":"cul","d":"e","pool":"quiz","s":"Booker T. Washington founded which institution in 1881 to provide industrial and agricultural education?","st":"","o":["Hull House","The NAACP","Harvard University","Howard University","Tuskegee Institute"],"e":["Hull House was Jane Addams's Chicago settlement house (1889).","The NAACP is a civil rights organization founded in 1909.","Harvard is a colonial-era university (1636). Du Bois earned his PhD there.","Howard was founded in 1867 with Freedmen's Bureau support and offered a liberal arts curriculum.","Washington built Tuskegee in Alabama into a model of vocational education."],"a":4},{"id":"u1q28","u":1,"th":"cul","d":"h","pool":"quiz","s":"The \"Lost Cause\" interpretation of the Civil War, widely promoted in the South after Reconstruction, held that","st":"","o":["the Confederacy had fought nobly for states' rights and honor rather than to preserve slavery","the North had been right to abolish slavery","the war had been lost because of Black soldiers' desertion","Reconstruction was a success that should be extended","the South should industrialize to compete with the North"],"e":["This myth shaped monuments, textbooks, and white southern memory, and it downplayed slavery's central role.","Lost Cause advocates minimized slavery rather than celebrating abolition.","That was not the Lost Cause argument. Black Union soldiers fought with distinction.","Lost Cause writers portrayed Reconstruction as a disastrous era of corruption.","That is the New South argument, a separate idea."],"a":0},{"id":"u1q29","u":1,"th":"pol","d":"m","pool":"quiz","s":"The southern Democrats who regained control of state governments in the 1870s and ended Reconstruction called themselves","st":"","o":["Mugwumps","Know-Nothings","Copperheads","Redeemers","Half-Breeds"],"e":["Mugwumps were reform-minded Republicans who backed Democrat Grover Cleveland in 1884.","The Know-Nothings were a nativist party of the 1850s.","Copperheads were northern Democrats who opposed the Civil War.","They claimed to \"redeem\" the South from Republican rule, then cut spending on schools and began rolling back Black rights.","Half-Breeds were a moderate Republican faction of the 1870s–80s that favored civil service reform."],"a":3},{"id":"u1q30","u":1,"th":"soc","d":"e","pool":"B","s":"During Reconstruction, white southerners who supported the Republican Party were called","st":"","o":["scalawags","carpetbaggers","Redeemers","doughfaces","Exodusters"],"e":["Opponents used the insult \"scalawag\" for white southerners who cooperated with Republican governments.","Carpetbaggers were northerners who moved South, not native southerners.","Redeemers were the Democrats who overthrew Republican rule.","Doughfaces were pre–Civil War northerners with southern sympathies.","Exodusters were Black migrants to Kansas."],"a":0},{"id":"u1q31","u":1,"th":"pol","d":"m","pool":"B","s":"In 1867 a former Confederate state that wanted its representatives seated in Congress first had to write a new constitution guaranteeing Black male suffrage and ratify the Fourteenth Amendment. This requirement came from","st":"","o":["Lincoln's Ten Percent Plan","the Compromise of 1877","the Reconstruction Acts passed by Congress","Andrew Johnson's amnesty proclamation","the Supreme Court's decision in Plessy v. Ferguson"],"e":["Lincoln's plan required only a 10 percent loyalty oath and made no mention of Black suffrage.","The Compromise ended Reconstruction. It set no readmission conditions.","The 1867 Reconstruction Acts set these conditions and placed the South under military supervision until they were met.","Johnson's plan readmitted states with few conditions.","Plessy (1896) concerned segregation, not readmission."],"a":2},{"id":"u1q32","u":1,"th":"pol","d":"h","pool":"B","s":"In the Civil Rights Cases (1883), the Supreme Court ruled that","st":"","o":["Black Codes were constitutional","the Fourteenth Amendment barred discrimination by states but not by private individuals and businesses","Congress could ban racial discrimination in hotels under its commerce power","the Fifteenth Amendment guaranteed voting rights to women","segregated public schools were unconstitutional"],"e":["The Black Codes had been superseded by the Civil Rights Act of 1866 and the Fourteenth Amendment. They were not the issue in 1883.","This \"state action\" reasoning struck down the Civil Rights Act of 1875's ban on discrimination in inns, theaters, and railroads.","That reasoning was upheld only in 1964 (Heart of Atlanta Motel v. U.S.).","The Court never read the Fifteenth Amendment to cover sex.","That was Brown v. Board of Education (1954)."],"a":1},{"id":"u1q33","u":1,"th":"cul","d":"m","pool":"quiz","s":"During and after Reconstruction, independent Black churches became important primarily because they","st":"","o":["opposed education for freedpeople","encouraged members to join the Democratic Party","served as centers of community life, education, and political organizing","were required by federal law in every southern county","were funded and controlled by the Freedmen's Bureau"],"e":["Churches were among the strongest supporters of Black education.","Black voters and leaders overwhelmingly backed the Republicans.","Free of white control, Black churches hosted schools and meetings and produced many Reconstruction-era leaders.","No federal law required churches. Establishing religion would violate the First Amendment.","The churches were independent institutions, not Bureau agencies."],"a":2},{"id":"u1q34","u":1,"th":"soc","d":"h","pool":"quiz","s":"Freedpeople's hopes of receiving \"forty acres and a mule\" were largely disappointed because","st":"","o":["Radical Republicans opposed any land redistribution","President Johnson's pardons restored most confiscated land to its former owners","the Fifteenth Amendment prohibited land grants to freedpeople","the Homestead Act of 1862 excluded all southern land","most freedpeople preferred to move to northern cities"],"e":["Thaddeus Stevens actually proposed confiscating planter land for freedpeople. Moderates and Johnson blocked it.","Sherman's Field Order No. 15 had set aside coastal land, but Johnson reversed it and returned land to pardoned planters.","The Fifteenth Amendment concerns voting and says nothing about land.","The Southern Homestead Act of 1866 opened some southern public land, but it was poor land and the program largely failed.","The Great Migration north came decades later. Most freedpeople wanted land in the South."],"a":1},{"id":"u2q01","u":2,"th":"pol","d":"m","pool":"quiz","s":"The Pendleton Civil Service Act of 1883 was passed largely in reaction to","st":"","o":["the Pullman Strike","the Crédit Mobilier railroad scandal","the Supreme Court's decision in Wabash v. Illinois","the Haymarket bombing in Chicago","the assassination of President Garfield by a disappointed office-seeker"],"e":["The Pullman Strike took place in 1894, after the Pendleton Act.","Crédit Mobilier (1872) involved bribery of congressmen and fed general reform sentiment, but it was not the trigger for the 1883 act.","Wabash (1886) led to the Interstate Commerce Act, not civil service reform.","Haymarket (1886) produced anti-labor and anti-immigrant backlash, not civil service reform.","Garfield's murder by Charles Guiteau dramatized the evils of the spoils system and pushed Congress to require merit exams for some federal jobs."],"a":4},{"id":"u2q02","u":2,"th":"pol","d":"m","pool":"B","s":"The Interstate Commerce Act of 1887 was significant because it","st":"","o":["nationalized the major railroads","granted public land to transcontinental railroads","broke up the Standard Oil Company","created the first federal regulatory agency to oversee railroad rates","established an eight-hour day for railroad workers"],"e":["The railroads stayed privately owned. The government briefly ran them only during World War I.","Land grants came earlier, in the Pacific Railway Acts of the 1860s.","Standard Oil was broken up by the Supreme Court in 1911 under the Sherman Act.","The ICC was meant to ensure \"reasonable and just\" rates. It was weak at first but set a precedent for federal regulation.","The eight-hour day for railroad workers came with the Adamson Act of 1916."],"a":3},{"id":"u2q03","u":2,"th":"pol","d":"h","pool":"diag","s":"In United States v. E.C. Knight Co. (1895), the Supreme Court weakened the Sherman Antitrust Act by ruling that","st":"","o":["states, not Congress, had the sole power to regulate railroads","manufacturing was not interstate commerce, so a sugar-refining monopoly was beyond the act's reach","labor unions could never be prosecuted as combinations in restraint of trade","the federal government could regulate railroad rates but not stock sales","the act violated the Fourteenth Amendment's due process clause"],"e":["Wabash (1886) said states could NOT regulate interstate railroads.","Although the company controlled about 98% of sugar refining, the Court said manufacturing was local. This gutted early antitrust enforcement.","The Sherman Act was actually used against unions in this era (e.g., the Pullman injunction upheld in In re Debs).","The case concerned manufacturing monopolies, not railroad rates or stocks.","The Court did not strike the act down. It narrowed it."],"a":1},{"id":"u2q04","u":2,"th":"pol","d":"e","pool":"A","s":"Thomas Nast's political cartoons helped bring down which of the following?","st":"","o":["William \"Boss\" Tweed and the Tammany Hall machine","Standard Oil's petroleum monopoly","The Knights of Labor","The Ku Klux Klan Act","The Populist Party"],"e":["Nast's cartoons in <em>Harper's Weekly<\/em> made Tweed's corruption visible even to voters who could not read. Tweed was convicted in the 1870s.","Standard Oil was later exposed by Ida Tarbell's writing, not Nast's cartoons.","Nast did not lead a campaign against the Knights.","The Klan Act was a federal law against the Klan, not a political machine.","The Populists arose in the 1890s and were not Nast's target."],"a":0},{"id":"u2q05","u":2,"th":"pol","d":"h","pool":"A","s":"Which of the following correctly shows cause and effect in railroad regulation?","st":"","o":["The Sherman Antitrust Act forced the Supreme Court to decide Munn v. Illinois.","Wabash v. Illinois barred states from regulating interstate rates, so Congress passed the Interstate Commerce Act.","Munn v. Illinois struck down all state Granger laws.","The Pullman Strike led Congress to abolish the Interstate Commerce Commission.","The Interstate Commerce Act created the Granger movement."],"e":["Munn (1877) came 13 years before the Sherman Act (1890).","After Wabash (1886) blocked state regulation of interstate traffic, Congress created the ICC in 1887 to fill the gap.","Munn upheld state regulation of grain elevators.","The ICC lasted until 1995.","The Grangers came first (1867 onward) and pushed for regulation."],"a":1},{"id":"u2q06","u":2,"th":"pol","d":"h","pool":"B","s":"The data above best support which generalization about Gilded Age politics?","st":"<p>Presidential election, 1880: Garfield (R) 48.3% of popular vote, Hancock (D) 48.2%. Voter turnout: about 80% of eligible voters.<\/p><p>Presidential election, 1884: Cleveland (D) 48.9%, Blaine (R) 48.3%. Voter turnout: about 78%.<\/p>","o":["Women's suffrage had greatly expanded the electorate.","Third parties regularly won a majority of the popular vote.","Most eligible voters did not participate in presidential elections.","Elections were extremely close and voter participation was very high.","One party dominated national politics throughout the era."],"e":["National women's suffrage came only in 1920.","The two major parties won almost all the votes in these elections.","Turnout near 80% is far higher than in most twentieth-century elections.","Popular-vote margins under one point and turnout around 80% characterized national elections in the period.","The near-even splits show intense two-party competition, not domination."],"a":3},{"id":"u2q07","u":2,"th":"pol","d":"m","pool":"A","s":"The \"Mugwumps\" of 1884 were","st":"","o":["farmers who founded the Grange","southern Democrats who overthrew Reconstruction governments","reform-minded Republicans who supported Democrat Grover Cleveland rather than their own party's tainted nominee","supporters of unlimited coinage of silver","labor activists who led the Haymarket rally"],"e":["The Grange was founded by Oliver Kelley in 1867.","Those were the Redeemers.","They objected to James G. Blaine's reputation for corruption and helped elect Cleveland.","Free-silver supporters were mostly Populists and western Democrats.","The Haymarket organizers were anarchists and labor radicals, not Mugwumps."],"a":2},{"id":"u2q08","u":2,"th":"pol","d":"m","pool":"B","s":"During the Pullman Strike of 1894, President Grover Cleveland","st":"","o":["sent federal troops to break the strike, citing interference with the U.S. mail","refused to intervene, citing laissez-faire principles","forced George Pullman to recognize the union","nationalized the railroads to keep trains running","signed a law guaranteeing workers the right to bargain collectively"],"e":["A federal court injunction against Debs's union and Cleveland's troops ended the strike. The Supreme Court upheld the injunction in In re Debs (1895).","Cleveland intervened decisively on the employers' side.","Pullman refused to negotiate, and the government sided with him.","There was no nationalization.","That right came with the Wagner Act in 1935."],"a":0},{"id":"u2q09","u":2,"th":"pol","d":"m","pool":"quiz","s":"The Dawes Severalty Act of 1887 attempted to","st":"","o":["assimilate Native Americans by dividing tribal reservations into individual family farms","restore tribal governments and communal landholding","relocate all Native Americans to Oklahoma Territory","pay compensation for land seized in violation of treaties","grant immediate full citizenship to all Native Americans"],"e":["Allotment aimed to make Native Americans into individual farmers and citizens. In practice, it cost them about two-thirds of their land.","That was the goal of the Indian Reorganization Act of 1934, which reversed Dawes.","Removal to Indian Territory was an earlier policy (the 1830s).","There was no compensation. The act opened \"surplus\" land to white settlers.","Citizenship was promised only to allottees after a 25-year trust period. All Native Americans became citizens in 1924."],"a":0},{"id":"u2q10","u":2,"th":"eco","d":"e","pool":"diag","s":"Andrew Carnegie's control of iron mines, coal fields, ore ships, railroads, and steel mills is the best example of","st":"","o":["vertical integration","laissez-faire regulation","horizontal integration","collective bargaining","the crop-lien system"],"e":["Owning every stage of production, from raw materials to the finished product, is vertical integration.","Laissez-faire means government non-interference, not a business structure.","Horizontal integration means buying competitors at the same stage, as Rockefeller did with refineries.","Collective bargaining is negotiation between unions and employers.","The crop-lien system was a southern agricultural credit arrangement."],"a":0},{"id":"u2q11","u":2,"th":"eco","d":"m","pool":"A","s":"John D. Rockefeller built Standard Oil into a near-monopoly mainly by","st":"","o":["receiving a government-granted monopoly","buying out or driving out competing oil refiners, an example of horizontal integration","inventing the internal combustion engine","refusing to use railroads for shipping","recognizing labor unions to avoid strikes"],"e":["Standard Oil's dominance came from business tactics, not a government charter.","Using rebates, price cutting, and buyouts, Standard Oil controlled about 90% of U.S. refining by the 1880s.","Rockefeller was a businessman, not an inventor of engines.","Rockefeller exploited railroads, winning secret rebates on shipping rates.","Rockefeller was not known for union recognition."],"a":1},{"id":"u2q12","u":2,"th":"eco","d":"m","pool":"B","s":"In the late nineteenth century, a \"trust\" was","st":"","o":["an arrangement in which stockholders of several companies gave control to a single board of trustees, reducing competition","a union of skilled workers","a government-insured savings account","a federal agency regulating interstate commerce","a cooperative store owned by farmers"],"e":["Standard Oil organized the first major trust in 1882. \"Trust\" became shorthand for any monopoly.","Craft unions are labor organizations, not business combinations.","Federal deposit insurance came in 1933 (FDIC).","That was the Interstate Commerce Commission.","Farmers' cooperatives aimed to escape middlemen and trusts."],"a":0},{"id":"u2q13","u":2,"th":"eco","d":"e","pool":"quiz","s":"The completion of the first transcontinental railroad in 1869 was celebrated at","st":"","o":["Pittsburgh, Pennsylvania, center of the steel industry","Abilene, Kansas, at the end of the Chisholm Trail","Promontory Point, Utah, where the Union Pacific and Central Pacific lines met","San Francisco, California, at the Pacific terminus","Chicago, Illinois, during the World's Columbian Exposition"],"e":["Pittsburgh was the steel hub, not the railroad's meeting point.","Abilene was a cattle town, not the meeting point.","The \"golden spike\" ceremony joined the two lines, built largely by Irish and Chinese labor.","The Central Pacific began in Sacramento, and the lines met in Utah.","The Exposition took place in 1893."],"a":2},{"id":"u2q14","u":2,"th":"eco","d":"m","pool":"A","s":"Banker J.P. Morgan's purchase of Carnegie Steel in 1901 led to the creation of","st":"","o":["the Standard Oil Trust","the American Federation of Labor","the Interstate Commerce Commission","U.S. Steel, the first billion-dollar corporation","the Federal Reserve System"],"e":["Standard Oil was Rockefeller's company, organized as a trust in 1882.","The AFL was a labor federation founded by Samuel Gompers.","The ICC was a government agency created in 1887.","Morgan merged Carnegie's company with others, creating a giant capitalized at about $1.4 billion.","The Federal Reserve was created by Congress in 1913."],"a":3},{"id":"u2q15","u":2,"th":"eco","d":"m","pool":"A","s":"One important economic effect of the expansion of railroads after 1865 was the","st":"","o":["reduction of immigration to the United States","decline of coal and steel production","creation of a national market that a ed rapidly after 1886.","The Knights supported the eight-hour day."],"a":2},{"id":"u2q21","u":2,"th":"soc","d":"e","pool":"B","s":"Samuel Gompers and the American Federation of Labor focused primarily on","st":"","o":["forming a national labor political party","\"bread-and-butter\" goals such as higher wages and shorter hours for skilled workers","organizing all workers regardless of skill into a single union","overthrowing capitalism through revolution","promoting immigration of unskilled laborers"],"e":["Gompers kept the AFL out of third-party politics.","The AFL avoided radical politics and concentrated on practical gains through collective bargaining.","That inclusive approach was the Knights of Labor's.","That was the goal of radicals such as the later IWW, not the AFL.","The AFL generally favored restricting immigration."],"a":1},{"id":"u2q22","u":2,"th":"soc","d":"m","pool":"quiz","s":"The Haymarket Square incident of 1886 had which of the following effects?","st":"","o":["It ended the use of federal troops in labor disputes.","It led directly to passage of an eight-hour-day law for all workers.","It united skilled and unskilled workers in a single successful union.","It increased public hostility toward labor unions and immigrants, contributing to the decline of the Knights of Labor.","It caused Congress to pass the Sherman Antitrust Act."],"e":["Troops were used again at Pullman in 1894.","No such law followed. The eight-hour day for most workers came with the Fair Labor Standards Act (1938).","The reverse happened. The inclusive Knights collapsed.","Although its leaders were not involved, the Knights were associated in the public mind with the bombing and lost members rapidly.","The Sherman Act (1890) targeted business combinations and was not a response to Haymarket."],"a":3},{"id":"u2q23","u":2,"th":"soc","d":"m","pool":"quiz","s":"The Homestead Strike of 1892 ended when","st":"","o":["Congress passed a law banning private police forces","Pinkerton guards and then the state militia broke the strike at Carnegie's steel works, crushing the union","Carnegie agreed to all of the union's demands","the Knights of Labor negotiated an eight-hour day","President Cleveland seized the steel mills"],"e":["No such federal law was passed.","Frick's hiring of Pinkertons led to a deadly battle. The militia then reopened the plant with nonunion workers.","The union was destroyed, not victorious.","The Knights had largely collapsed by 1892, and no eight-hour deal was made.","Cleveland intervened in Pullman (1894), not Homestead. (Truman tried to seize steel mills in 1952.)"],"a":1},{"id":"u2q24","u":2,"th":"soc","d":"h","pool":"B","s":"The Great Railroad Strike of 1877 was significant because it","st":"","o":["was the first nationwide strike and led the president to use federal troops against strikers","was led by Eugene V. Debs and the American Railway Union","won the eight-hour day for railroad workers","ended in a negotiated settlement that recognized unions","took place at Carnegie's Homestead steel works"],"e":["Wage cuts after the Panic of 1873 sparked the walkout. Hayes sent troops, a pattern repeated in later strikes.","Debs's union led the 1894 Pullman Strike.","Railroad workers got the eight-hour day only in 1916 (Adamson Act).","The strike was suppressed, not settled with recognition.","The Homestead Strike was in 1892."],"a":0},{"id":"u2q25","u":2,"th":"soc","d":"e","pool":"A","s":"Most of the \"New Immigrants\" who arrived in the United States between 1880 and 1920 came from","st":"","o":["Latin America","Canada and Great Britain","sub-Saharan Africa","southern and eastern Europe","Ireland and Germany"],"e":["Large-scale Latin American immigration came later in the twentieth century.","These were older and smaller sources.","Voluntary African immigration was very small in this period.","Italians, Poles, Russian Jews, Greeks, and Slavs made up most of this wave, unlike earlier immigrants from northern and western Europe.","Irish and German immigrants dominated the pre–Civil War \"old\" immigration."],"a":3},{"id":"u2q26","u":2,"th":"soc","d":"e","pool":"quiz","s":"The Chinese Exclusion Act of 1882 was historically significant because it","st":"","o":["established a quota system based on national origins","created Ellis Island as an immigration station","granted citizenship to Chinese railroad workers","was the first federal law to bar immigration on the basis of nationality","ended immigration from all of Asia"],"e":["National-origins quotas came in the 1920s (Emergency Quota Act of 1921, Immigration Act of 1924).","Ellis Island opened in 1892.","The act barred Chinese immigrants from naturalization.","It suspended Chinese labor immigration, was renewed and made permanent, and was not repealed until 1943.","It applied to China. Broader Asian exclusion came with the 1917 and 1924 laws."],"a":3},{"id":"u2q27","u":2,"th":"soc","d":"e","pool":"B","s":"Jacob Riis's <em>How the Other Half Lives<\/em> (1890) used photographs and text to expose","st":"","o":["the treatment of Native Americans on reservations","the squalid conditions of New York City tenements","the corruption of the Standard Oil Company","the meatpacking industry in Chicago","the lives of southern sharecroppers"],"e":["That was Helen Hunt Jackson's <em>A Century of Dishonor<\/em>.","Riis's images of crowded, dark tenements spurred housing reform.","Ida Tarbell exposed Standard Oil (1904).","Upton Sinclair's <em>The Jungle<\/em> (1906) targeted meatpacking.","Riis focused on urban immigrants in New York."],"a":1},{"id":"u2q28","u":2,"th":"soc","d":"e","pool":"A","s":"Jane Addams's Hull House in Chicago was an example of a","st":"","o":["political machine that traded favors for votes","factory that employed child laborers","settlement house that provided services to immigrants and pushed for social reform","labor union for garment workers","religious revival center in the West"],"e":["Machines like Tammany Hall were partisan
