<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEP US History II</title>
<meta name="description" content="Self-paced study guide for the CLEP History of the United States II exam: lessons, quizzes, flashcards, practice exams.">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --surface2:#f2f0ea; --ink:#1d232a; --muted:#5d6670; --line:#dedad0;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --good:#24774a; --good-soft:#e2f2e8; --bad:#b03a2e; --bad-soft:#f8e3e0; --warn:#9a6a00; --warn-soft:#fbf0d4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
  --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
  --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
  --shadow:none; color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
    --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
    --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
    --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{max-width:860px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;text-decoration:none;color:var(--ink);font-size:1.02rem;letter-spacing:.01em}
.brand small{font-weight:500;color:var(--muted)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
nav.tabs{max-width:860px;margin:0 auto;padding:6px 12px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:999px;font-size:.9rem}
nav.tabs a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;line-height:1.25;margin:.2em 0 .5em}
h2{font-size:1.25rem;margin:1.6em 0 .5em}
h3{font-size:1.05rem;margin:1.3em 0 .4em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>span{background:var(--good)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:.92rem}
/* lesson */
.lesson{font-family:var(--serif);font-size:1.08rem;line-height:1.7}
.lesson h2{font-family:var(--sans)}
.lesson h3{font-family:var(--sans)}
.lesson p{margin:.7em 0}
.lesson strong{font-weight:700}
.lesson ul{padding-left:1.2em}
.cec{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin:14px 0;font-family:var(--sans);font-size:.88rem}
.cec div.b{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.cec div.b b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cec .ar{align-self:center;color:var(--muted)}
@media (max-width:600px){.cec{grid-template-columns:1fr}.cec .ar{transform:rotate(90deg);justify-self:center}}
.mustknow{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 16px}
.mustknow ol{margin:.3em 0;padding-left:1.3em}
.mustknow li{margin:.35em 0}
/* timeline */
.tl{position:relative;margin:10px 0 10px 6px;padding-left:22px;border-left:2px solid var(--line)}
.tl .ev{position:relative;margin:0 0 12px}
.tl .ev::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl .ev.key::before{background:var(--accent);border-color:var(--accent)}
.tl .yr{font-weight:700;font-variant-numeric:tabular-nums;margin-right:8px}
.tl .ev.key .yr{color:var(--accent)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stem{font-size:1.07rem;font-weight:500;margin:6px 0 12px}
.stim{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-family:var(--serif);font-size:1rem}
.stim table{font-family:var(--sans);font-size:.88rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;align-items:flex-start}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt .ex{display:block;font-size:.88rem;color:var(--muted);margin-top:4px}
.opt.right .ex,.opt.wrong .ex{color:var(--ink)}
.opt[disabled]{cursor:default}
.kbd{font:600 .75rem var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface2)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;margin-top:10px}
.navgrid button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:4px 0;font:inherit;font-size:.75rem;cursor:pointer}
.navgrid button.ans{background:var(--accent-soft);color:var(--ink)}
.navgrid button.cur{outline:2px solid var(--accent)}
.navgrid button.flag{border-color:var(--warn);border-width:2px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.timer.low{color:var(--bad)}
/* flashcards */
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;padding:28px 20px;cursor:pointer;user-select:none}
.fc .back{font-size:1.02rem;font-family:var(--serif);line-height:1.6}
.boxes{display:flex;gap:6px;align-items:flex-end;height:70px;margin:8px 0}
.boxes div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;position:relative;opacity:.85}
.boxlbl{display:flex;gap:6px}.boxlbl span{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
/* readiness */
.meter{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dial{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;flex:none}
.dial span{background:var(--surface);width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
.dial small{font-size:.65rem;color:var(--muted);font-weight:600;text-transform:uppercase}
/* cheat sheet */
.cheat{font-size:.82rem;line-height:1.35;columns:2 300px;column-gap:20px}
.cheat section{break-inside:avoid;margin:0 0 12px}
.cheat h3{margin:.2em 0 .3em;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.cheat table{font-size:.78rem}
.cheat td,.cheat th{padding:2px 4px}
.cheat ul{margin:0;padding-left:1em}
.cheat.memo .m{filter:blur(5px);cursor:pointer;transition:filter .15s}
.cheat.memo .m.show{filter:none}
.kbdhint{font-size:.8rem;color:var(--muted);margin-top:10px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.plan td:first-child{white-space:nowrap}
.tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media print{
  header.top,.noprint,.banner{display:none!important}
  body{background:#fff;color:#000;font-size:10pt}
  main{max-width:none;padding:0}
  .card{border:none;box-shadow:none;padding:0;margin:0}
  .cheat{columns:3;column-gap:12px;font-size:6.6pt;line-height:1.22}
  .cheat h3{font-size:7pt;color:#000;margin:0 0 1px}
  .cheat table{font-size:6.3pt}
  .cheat section{margin:0 0 5px}
  .cheat.memo .m{filter:none}
  .printhead{font-size:9pt;margin:0 0 4px}
  @page{size:letter;margin:.35in}
}
</style>
</head>

t":70,"status":"verified"}],"skills_tested":{"items":["Identify and describe historical phenomena","Analyze and interpret historical phenomena","Compare and contrast historical phenomena"],"status":"verified (listed without percentages)"},"unit_plan":[{"unit":1,"title":"Reconstruction and the New South","years":"1865-1900","period":"early","weight":8},{"unit":2,"title":"The Gilded Age: Industry, Labor, the West, and the Cities","years":"1865-1900","period":"early","weight":12},{"unit":3,"title":"Populism, Empire, and the Progressive Era","years":"1890-1914","period":"early","weight":10},{"unit":4,"title":"World War I and the 1920s","years":"1914-1929","period":"late","weight":10},{"unit":5,"title":"The Great Depression and the New Deal","years":"1929-1941","period":"late","weight":10},{"unit":6,"title":"World War II","years":"1939-1945","period":"late","weight":8},{"unit":7,"title":"Early Cold War and the 1950s","years":"1945-1960","period":"late","weight":11},{"unit":8,"title":"Civil Rights, the Great Society, and Vietnam","years":"1954-1975","period":"late","weight":13},{"unit":9,"title":"From Watergate to Reagan","years":"1968-1989","period":"late","weight":9},{"unit":10,"title":"Contemporary America","years":"1989-present","period":"late","weight":9}],"unit_plan_note":"The official outline is thematic (5 themes) plus chronological (2 periods). Units are chronological so the story can be learned in order; unit weights sum to the official 30% (1865-1914) / 70% (1915-present) split. Every question also carries a theme tag, and the bank is balanced to the official 30/30/10/20/10 theme weights."},"stats":{"total":268,"theme":{"cul":52,"dip":33,"eco":30,"pol":77,"soc":76},"period":{"early":120,"late":148},"diff":{"e":68,"m":143,"h":57},"pool":{"quiz":81,"diag":21,"A":83,"B":83}},"cheat":"<p>Cheat sheet coming soon.<\/p>","questions":[{"id":"u1q01","u":1,"th":"pol","d":"e","pool":"B","s":"Which constitutional amendment established that all persons born in the United States are citizens and guaranteed them \"equal protection of the laws\"?","st":"","o":["The Fifteenth Amendment","The Nineteenth Amendment","The Thirteenth Amendment","The Fourteenth Amendment","The Sixteenth Amendment"],"e":["The Fifteenth Amendment (1870) dealt with voting rights, not citizenship.","The Nineteenth Amendment (1920) guaranteed women's suffrage.","The Thirteenth Amendment (1865) abolished slavery but did not define citizenship.","Ratified in 1868, the Fourteenth Amendment defined national citizenship and barred states from denying due process or equal protection.","The Sixteenth Amendment (1913) authorized a federal income tax."],"a":3},{"id":"u1q02","u":1,"th":"pol","d":"e","pool":"A","s":"The Fifteenth Amendment (1870) prohibited states from denying the right to vote on the basis of","st":"","o":["literacy","sex","failure to pay a poll tax","age, for citizens 18 or older","race, color, or previous condition of servitude"],"e":["The Fifteenth Amendment said nothing about literacy, which is why southern states could later use literacy tests.","Sex was deliberately left out, which angered woman suffrage leaders. Women won the vote only with the Nineteenth Amendment in 1920.","Poll taxes in federal elections were banned only by the Twenty-fourth Amendment (1964).","The voting age was lowered to 18 by the Twenty-sixth Amendment (1971).","This is the amendment's exact wording. It aimed to protect Black men's suffrage."],"a":4},{"id":"u1q03","u":1,"th":"pol","d":"m","pool":"B","s":"Congress passed the Reconstruction Acts of 1867 mainly in response to which of the following?","st":"","o":["Southern states' passage of Black Codes and their refusal to ratify the Fourteenth Amendment","A Supreme Court ruling that the Thirteenth Amendment was unconstitutional","A wave of Black migration to Kansas","The disputed presidential election of 1876","The assassination of Abraham Lincoln"],"e":["The Black Codes, the 1866 riots, and southern rejection of the Fourteenth Amendment convinced Congress to impose military reconstruction.","No such ruling occurred. The Thirteenth Amendment was never struck down.","The Exoduster migration happened in 1879, after Reconstruction ended.","That election came almost a decade later and led to the end of Reconstruction, not its start.","Lincoln's death in 1865 brought Johnson to power, but the 1867 acts responded to what southern governments did under Johnson's lenient plan."],"a":0},{"id":"u1q04","u":1,"th":"pol","d":"m","pool":"diag","s":"The House of Representatives impeached President Andrew Johnson in 1868 chiefly because he had","st":"","o":["purchased Alaska without congressional approval","refused to enforce the Fifteenth Amendment","ordered federal troops out of the South","accepted bribes in the Crédit Mobilier scandal","removed Secretary of War Edwin Stanton in apparent violation of the Tenure of Office Act"],"e":["The Senate approved the Alaska treaty, and it was not a ground for impeachment.","The Fifteenth Amendment was not ratified until 1870, after Johnson left office.","Troops were withdrawn in 1877 under Hayes, not by Johnson.","Crédit Mobilier involved congressmen and Grant-era officials, not Johnson's impeachment.","The formal charges centered on Stanton's dismissal, though the real conflict was over Johnson's obstruction of Congressional Reconstruction."],"a":4},{"id":"u1q05","u":1,"th":"pol","d":"m","pool":"quiz","s":"Which of the following was a direct result of the Compromise of 1877?","st":"","o":["The Fifteenth Amendment was ratified.","The Freedmen's Bureau was created.","Samuel Tilden became president.","Southern states were divided into five military districts.","Federal troops were withdrawn from the remaining Reconstruction governments in the South."],"e":["The Fifteenth Amendment was ratified in 1870.","The Freedmen's Bureau was created in 1865.","Tilden won the popular vote but lost the presidency to Hayes under the compromise.","Military districts were created by the Reconstruction Acts of 1867, the start of Radical Reconstruction rather than its end.","In return for Democrats accepting Hayes's election, the last federal troops left southern statehouses, ending Reconstruction."],"a":4},{"id":"u1q06","u":1,"th":"pol","d":"h","pool":"quiz","s":"Which of the following occurred FIRST?","st":"","o":["Rutherford B. Hayes became president.","The Fifteenth Amendment was ratified.","Southern legislatures enacted Black Codes.","Andrew Johnson was impeached by the House.","Hiram Revels took his seat in the U.S. Senate."],"e":["Hayes took office in 1877.","The Fifteenth Amendment was ratified in 1870.","The Black Codes were passed in 1865–1866 under Presidential Reconstruction, before every other event listed.","Johnson's impeachment came in 1868.","Revels was seated in 1870."],"a":2},{"id":"u1q07","u":1,"th":"soc","d":"e","pool":"quiz","s":"Immediately after emancipation, which of the following was a top priority for many freedpeople?","st":"","o":["Emigrating to Africa","Joining the Democratic Party","Reuniting families that had been separated by slavery","Moving to the Great Plains as cattle ranchers","Returning to work for their former owners for wages under the same conditions as slavery"],"e":["Some emigration schemes existed, but very few freedpeople chose to leave.","Freedmen overwhelmingly supported the Republican Party, the party of Lincoln and Reconstruction.","Freedpeople traveled widely and placed newspaper ads searching for relatives sold away. Family reunification was a defining early goal.","A few moved West, but ranching was not a widespread priority.","Freedpeople resisted gang labor and conditions resembling slavery. This is why sharecropping emerged as a compromise."],"a":2},{"id":"u1q08","u":1,"th":"soc","d":"m","pool":"quiz","s":"The most lasting achievement of the Freedmen's Bureau was in the field of","st":"","o":["voting rights enforcement","education","railroad construction","immigration control","land redistribution"],"e":["Voting rights were enforced, briefly, by the army and the Enforcement Acts, not mainly by the Bureau.","With northern aid societies, the Bureau set up thousands of schools and helped found Black colleges such as Howard and Fisk.","The Bureau did not build railroads.","Immigration had nothing to do with the Bureau's mission.","Most confiscated land was returned to former owners after Johnson's pardons, so redistribution largely failed."],"a":1},{"id":"u1q09","u":1,"th":"soc","d":"m","pool":"A","s":"The Black Codes passed by southern states in 1865–1866 were designed primarily to","st":"","o":["redistribute plantation land to freedpeople","restrict the freedom of formerly enslaved people and keep them as a controlled labor force","implement the provisions of the Fourteenth Amendment","provide public schools for Black children","grant freedpeople limited voting rights"],"e":["The codes protected white landowners' interests rather than redistributing land.","Vagrancy laws, mandatory labor contracts, and limits on land ownership kept freedpeople working on plantations under white control.","The codes contradicted equal protection. Their passage helped prompt the amendment.","The first southern public school systems came from Reconstruction governments, not the Black Codes.","The Black Codes did not grant suffrage. Southern governments under Johnson refused Black voting."],"a":1},{"id":"u1q10","u":1,"th":"pol","d":"m","pool":"quiz","s":"Thaddeus Stevens and Charles Sumner are best known as leaders of which group?","st":"","o":["Liberal Republicans who opposed Grant in 1872","Populists who demanded free silver","Copperheads who opposed the Civil War","Redeemer Democrats who ended Reconstruction","Radical Republicans in Congress who pushed for Black civil rights and strict terms for the South"],"e":["The Liberal Republicans of 1872 (Horace Greeley) wanted to end Reconstruction. Sumner did briefly side with them in 1872, but neither man is known as their leader.","Populism arose in the 1890s, after both men had died.","Copperheads were antiwar Democrats. Stevens and Sumner were firm Unionists.","Redeemers were southern Democrats, opponents of the Radicals.","Stevens (House) and Sumner (Senate) led the Radicals who took control of Reconstruction in 1867."],"a":4},{"id":"u1q11","u":1,"th":"pol","d":"e","pool":"A","s":"The Supreme Court's decision in Plessy v. Ferguson (1896) is significant because it","st":"","o":["struck down poll taxes in federal elections","outlawed segregation in public schools","declared that Black Americans could not be citizens","established the right of the Court to review state laws","upheld state-mandated racial segregation under the \"separate but equal\" doctrine"],"e":["Poll taxes in federal elections ended with the Twenty-fourth Amendment (1964).","Segregated schools were struck down in Brown v. Board of Education (1954), which overturned Plessy's reasoning.","That was Dred Scott v. Sandford (1857), which the Fourteenth Amendment overturned.","Judicial review dates to Marbury v. Madison (1803).","Plessy approved segregated railroad cars, giving constitutional cover to Jim Crow for nearly 60 years."],"a":4},{"id":"u1q12","u":1,"th":"pol","d":"h","pool":"A","s":"The statement above comes from","st":"<p>\"Our Constitution is color-blind, and neither knows nor tolerates classes among citizens.\"<\/p>","o":["the majority opinion in the Civil Rights Cases","the text of the Fifteenth Amendment","the majority opinion in Plessy v. Ferguson","Justice John Marshall Harlan's dissent in Plessy v. Ferguson","Booker T. Washington's Atlanta Compromise speech"],"e":["The majority in 1883 struck down the Civil Rights Act of 1875. (Harlan dissented there too, but this line is from Plessy.)","The Fifteenth Amendment concerns voting and does not contain this language.","The majority upheld segregation, the opposite of this statement.","Harlan was the lone dissenter in Plessy. He argued that segregation violated the Fourteenth Amendment.","Washington's speech accepted social segregation for the time being. It did not attack it on constitutional grounds."],"a":3},{"id":"u1q13","u":1,"th":"soc","d":"m","pool":"A","s":"In his 1895 Atlanta Compromise speech, Booker T. Washington urged Black Americans to","st":"","o":["focus on vocational training and economic progress while temporarily accepting segregation","emigrate to Africa to escape discrimination","demand immediate social and political equality through protest","support the Populist Party's alliance of Black and white farmers","form a separate political party to contest southern elections"],"e":["Washington argued that economic self-help would earn respect and rights over time. Critics saw this as accommodation to Jim Crow.","Back-to-Africa ideas are associated with Marcus Garvey in the 1920s.","This was Du Bois's position, not Washington's.","Washington did not tie himself to the Populists.","Washington avoided direct political confrontation."],"a":0},{"id":"u1q14","u":1,"th":"cul","d":"m","pool":"B","s":"W.E.B. Du Bois criticized Booker T. Washington chiefly because Du Bois believed that African Americans should","st":"","o":["avoid politics until they had achieved economic independence","move to the West to claim homesteads","concentrate on industrial and agricultural training","demand full civil and political rights immediately and develop a college-educated \"Talented Tenth\"","separate completely from white society and return to Africa"],"e":["This summarizes Washington's gradualism, which Du Bois opposed.","Du Bois did not promote western migration.","That was Washington's program at Tuskegee.","In <em>The Souls of Black Folk<\/em> (1903), Du Bois rejected accommodation and called for higher education and immediate equal rights.","Separatism is associated with Marcus Garvey, whom Du Bois opposed."],"a":3},{"id":"u1q15","u":1,"th":"soc","d":"e","pool":"A","s":"Ida B. Wells is best known for her","st":"","o":["founding of Tuskegee Institute","journalism exposing and campaigning against lynching","service as the first African American U.S. senator","leadership of the Exoduster migration to Kansas","novel <em>Uncle Tom's Cabin<\/em>"],"e":["Tuskegee was founded by Booker T. Washington.","Wells documented lynchings in works such as <em>Southern Horrors<\/em> (1892) and fought for federal anti-lynching action.","That was Hiram Revels (1870).","The Exodusters are associated with Benjamin \"Pap\" Singleton.","Harriet Beecher Stowe wrote <em>Uncle Tom's Cabin<\/em> (1852)."],"a":1},{"id":"u1q16","u":1,"th":"soc","d":"m","pool":"B","s":"Southern \"grandfather clauses\" of the 1890s were designed to","st":"","o":["require voters to have lived in the state for three generations","guarantee voting rights to elderly freedmen","give land to the descendants of formerly enslaved people","exempt white men from literacy tests and poll taxes if their ancestors could vote before 1867","let grandsons of Confederate veterans skip military service"],"e":["The clauses exempted voters from tests. They did not set residency requirements.","They did the opposite. They shielded white voters, not freedmen.","No such land policy existed.","Since Black men could not vote before 1867, these clauses disfranchised Black voters while protecting poor whites' votes.","The clauses concerned voting, not military service."],"a":3},{"id":"u1q17","u":1,"th":"eco","d":"m","pool":"quiz","s":"Under the crop-lien system that spread across the postwar South,","st":"","o":["merchants supplied seed and goods on credit in exchange for a claim on the farmer's future crop","landowners paid farm workers fixed daily wages","the federal government lent farmers money at low interest","farmers pooled crops in cooperatives to bypass middlemen","railroads guaranteed minimum prices for cotton"],"e":["High interest and falling cotton prices meant many farmers never got out of debt.","Wage labor was not the crop-lien arrangement. Credit secured by the crop was.","Federal farm credit programs came much later (Federal Farm Loan Act 1916, New Deal).","Cooperatives were a Farmers' Alliance remedy against the crop-lien system, not the system itself.","Railroads set shipping rates. They did not guarantee crop prices."],"a":0},{"id":"u1q18","u":1,"th":"eco","d":"m","pool":"A","s":"Henry Grady's idea of a \"New South\" called for the South to","st":"","o":["secede again from the Union","rely entirely on cotton exports to Britain","redistribute land to freedpeople","industrialize and diversify its economy by attracting northern investment","restore a plantation economy based on slave labor"],"e":["Grady preached sectional reconciliation, not secession.","Dependence on cotton was the problem the New South idea was meant to fix.","Grady did not advocate land redistribution.","Grady, an Atlanta editor, promoted textile mills, railroads, and industry alongside reconciliation with the North.","Slavery was abolished, and Grady looked forward rather than back."],"a":3},{"id":"u1q19","u":1,"th":"eco","d":"m","pool":"diag","s":"The arrangement described is best identified as","st":"<p>The following terms are typical of a contract signed in Georgia in 1867: The laborer agrees to cultivate the land and furnish his own labor. The owner furnishes land, a mule, tools, and seed. At harvest the owner receives one-half of the crop, and from the laborer's half are deducted all advances of food and supplies.<\/p>","o":["homesteading","the encomienda system","indentured servitude","sharecropping","wage labor"],"e":["Homesteaders got title to public land by living on and improving it.","Encomienda was a Spanish colonial labor system.","Indentured servants worked a fixed term to repay passage. They were not paid a crop share.","The laborer works the owner's land and supplies and is paid with a share of the crop. That is the defining feature of sharecropping.","Wage laborers receive fixed cash pay, not a share of the harvest."],"a":3},{"id":"u1q20","u":1,"th":"pol","d":"h","pool":"B","s":"Supreme Court decisions such as the Slaughterhouse Cases (1873) and United States v. Cruikshank (1876) affected Reconstruction by","st":"","o":["narrowing the protections of the Fourteenth Amendment and leaving the protection of Black citizens largely to the states","expanding federal power to prosecute private acts of violence","requiring the federal government to enforce desegregation of public schools","guaranteeing land to freedpeople as compensation for slavery","declaring the Reconstruction Acts unconstitutional"],"e":["These rulings read federal protections narrowly. In practice, that let southern states and private violence undermine Black rights.","Cruikshank did the reverse. It overturned federal convictions from the Colfax Massacre.","Court-ordered school desegregation began with Brown (1954).","No Supreme Court decision required land grants.","Neither case struck down the Reconstruction Acts."],"a":0},{"id":"u1q21","u":1,"th":"pol","d":"m","pool":"B","s":"The Crédit Mobilier and Whiskey Ring scandals are associated with the presidency of","st":"","o":["Rutherford B. Hayes","Abraham Lincoln","Andrew Johnson","Ulysses S. Grant","Grover Cleveland"],"e":["Hayes came to office in 1877 promising reform after the Grant-era scandals.","Lincoln died in 1865. These scandals came to light in the 1870s.","Johnson's presidency was defined by his clashes with Congress, not these scandals.","Both scandals tarnished Grant's administration (1869–1877) and weakened northern support for Republican Reconstruction.","Cleveland was known for honesty and vetoes in the 1880s–1890s."],"a":3},{"id":"u1q22","u":1,"th":"soc","d":"m","pool":"A","s":"The Enforcement Acts and the Ku Klux Klan Act of 1870–1871 were passed in order to","st":"","o":["protect Black voters and officeholders from terrorist violence","prohibit Black men from serving on juries","grant amnesty to former Confederate officers","end military occupation of the South","establish segregated public facilities"],"e":["These laws let federal courts and troops prosecute the Klan, which briefly broke the first Klan.","The acts aimed to protect, not restrict, Black civil rights.","Amnesty came through presidential pardons and the Amnesty Act of 1872, not these acts.","They expanded federal enforcement rather than ending it.","Segregation laws came from southern states later, not from these federal acts."],"a":0},{"id":"u1q23","u":1,"th":"soc","d":"e","pool":"B","s":"Hiram Revels is historically significant as the","st":"","o":["first African American to serve in the U.S. Senate","head of the Freedmen's Bureau","founder of the NAACP","author of <em>Up From Slavery<\/em>","Supreme Court justice who dissented in Plessy"],"e":["Revels was elected from Mississippi and seated in 1870.","General Oliver O. Howard headed the Freedmen's Bureau.","The NAACP was founded in 1909 by a multiracial group including Du Bois.","<em>Up From Slavery<\/em> is Booker T. Washington's autobiography.","The Plessy dissenter was John Marshall Harlan."],"a":0},{"id":"u1q24","u":1,"th":"pol","d":"m","pool":"A","s":"Lincoln's Ten Percent Plan differed from the Wade-Davis Bill in that Lincoln's plan","st":"","o":["required Black male suffrage, while Wade-Davis did not","allowed a state to be restored once 10 percent of its 1860 voters took a loyalty oath, while Wade-Davis required a majority","placed the South under military rule, while Wade-Davis did not","confiscated all plantations, while Wade-Davis protected property","was passed by Congress over a presidential veto"],"e":["Neither plan required Black suffrage. That came with the 1867 Reconstruction Acts.","Lincoln favored a quick, lenient restoration. Congress's Wade-Davis Bill demanded 50 percent and an ironclad oath, and Lincoln pocket-vetoed it.","Military districts came in 1867 under Congress, not Lincoln's plan.","Lincoln's plan offered pardons and protected most property except enslaved people.","The Ten Percent Plan was an executive proclamation, not a law passed over a veto."],"a":1},{"id":"u1q25","u":1,"th":"dip","d":"e","pool":"quiz","s":"In 1867 the United States purchased Alaska from","st":"","o":["France","Russia","Great Britain","Mexico","Spain"],"e":["France sold Louisiana in 1803.","Secretary of State William Seward bought Alaska from Russia for $7.2 million, which critics mocked as \"Seward's Folly.\"","Britain controlled Canada, not Alaska.","Mexico ceded the Southwest in 1848. It never held Alaska.","Spain gave up Florida (1819) and later Puerto Rico and the Philippines (1898), not Alaska."],"a":1},{"id":"u1q26","u":1,"th":"soc","d":"h","pool":"A","s":"The \"Exodusters\" of 1879 were","st":"","o":["white farmers who abandoned the Dust Bowl for California","African Americans who left the South for Kansas to escape violence and economic oppression after Reconstruction","Chinese laborers expelled from California","former Confederates who emigrated to Brazil","Mormon settlers who moved from Illinois to Utah"],"e":["That describes the \"Okies\" of the 1930s.","Thousands left after the troops were withdrawn, hoping for land and safety on the plains.","Chinese exclusion is a separate story (1882 act). They were not called Exodusters.","Some Confederates did go to Brazil (the Confederados), but they were not called Exodusters.","The Mormon migration took place in the 1840s."],"a":1},{"id":"u1q27","u":1,"th":"cul","d":"e","pool":"quiz","s":"Booker T. Washington founded which institution in 1881 to provide industrial and agricultural education?","st":"","o":["Tuskegee Institute","Howard University","The NAACP","Harvard University","Hull House"],"e":["Washington built Tuskegee in Alabama into a model of vocational education.","Howard was founded in 1867 with Freedmen's Bureau support and offered a liberal arts curriculum.","The NAACP is a civil rights organization founded in 1909.","Harvard is a colonial-era university (1636). Du Bois earned his PhD there.","Hull House was Jane Addams's Chicago settlement house (1889)."],"a":0},{"id":"u1q28","u":1,"th":"cul","d":"h","pool":"quiz","s":"The \"Lost Cause\" interpretation of the Civil War, widely promoted in the South after Reconstruction, held that","st":"","o":["the South should industrialize to compete with the North","the North had been right to abolish slavery","Reconstruction was a success that should be extended","the Confederacy had fought nobly for states' rights and honor rather than to preserve slavery","the war had been lost because of Black soldiers' desertion"],"e":["That is the New South argument, a separate idea.","Lost Cause advocates minimized slavery rather than celebrating abolition.","Lost Cause writers portrayed Reconstruction as a disastrous era of corruption.","This myth shaped monuments, textbooks, and white southern memory, and it downplayed slavery's central role.","That was not the Lost Cause argument. Black Union soldiers fought with distinction."],"a":3},{"id":"u1q29","u":1,"th":"pol","d":"m","pool":"quiz","s":"The southern Democrats who regained control of state governments in the 1870s and ended Reconstruction called themselves","st":"","o":["Half-Breeds","Know-Nothings","Mugwumps","Copperheads","Redeemers"],"e":["Half-Breeds were a moderate Republican faction of the 1870s–80s that favored civil service reform.","The Know-Nothings were a nativist party of the 1850s.","Mugwumps were reform-minded Republicans who backed Democrat Grover Cleveland in 1884.","Copperheads were northern Democrats who opposed the Civil War.","They claimed to \"redeem\" the South from Republican rule, then cut spending on schools and began rolling back Black rights."],"a":4},{"id":"u1q30","u":1,"th":"soc","d":"e","pool":"B","s":"During Reconstruction, white southerners who supported the Republican Party were called","st":"","o":["Redeemers","Exodusters","carpetbaggers","scalawags","doughfaces"],"e":["Redeemers were the Democrats who overthrew Republican rule.","Exodusters were Black migrants to Kansas.","Carpetbaggers were northerners who moved South, not native southerners.","Opponents used the insult \"scalawag\" for white southerners who cooperated with Republican governments.","Doughfaces were pre–Civil War northerners with southern sympathies."],"a":3},{"id":"u1q31","u":1,"th":"pol","d":"m","pool":"B","s":"In 1867 a former Confederate state that wanted its representatives seated in Congress first had to write a new constitution guaranteeing Black male suffrage and ratify the Fourteenth Amendment. This requirement came from","st":"","o":["the Compromise of 1877","Lincoln's Ten Percent Plan","Andrew Johnson's amnesty proclamation","the Supreme Court's decision in Plessy v. Ferguson","the Reconstruction Acts passed by Congress"],"e":["The Compromise ended Reconstruction. It set no readmission conditions.","Lincoln's plan required only a 10 percent loyalty oath and made no mention of Black suffrage.","Johnson's plan readmitted states with few conditions.","Plessy (1896) concerned segregation, not readmission.","The 1867 Reconstruction Acts set these conditions and placed the South under military supervision until they were met."],"a":4},{"id":"u1q32","u":1,"th":"pol","d":"h","pool":"B","s":"In the Civil Rights Cases (1883), the Supreme Court ruled that","st":"","o":["segregated public schools were unconstitutional","the Fifteenth Amendment guaranteed voting rights to women","Black Codes were constitutional","Congress could ban racial discrimination in hotels under its commerce power","the Fourteenth Amendment barred discrimination by states but not by private individuals and businesses"],"e":["That was Brown v. Board of Education (1954).","The Court never read the Fifteenth Amendment to cover sex.","The Black Codes had been superseded by the Civil Rights Act of 1866 and the Fourteenth Amendment. They were not the issue in 1883.","That reasoning was upheld only in 1964 (Heart of Atlanta Motel v. U.S.).","This \"state action\" reasoning struck down the Civil Rights Act of 1875's ban on discrimination in inns, theaters, and railroads."],"a":4},{"id":"u1q33","u":1,"th":"cul","d":"m","pool":"quiz","s":"During and after Reconstruction, independent Black churches became important primarily because they","st":"","o":["opposed education for freedpeople","were required by federal law in every southern county","were funded and controlled by the Freedmen's Bureau","served as centers of community life, education, and political organizing","encouraged members to join the Democratic Party"],"e":["Churches were among the strongest supporters of Black education.","No federal law required churches. Establishing religion would violate the First Amendment.","The churches were independent institutions, not Bureau agencies.","Free of white control, Black churches hosted schools and meetings and produced many Reconstruction-era leaders.","Black voters and leaders overwhelmingly backed the Republicans."],"a":3},{"id":"u1q34","u":1,"th":"soc","d":"h","pool":"quiz","s":"Freedpeople's hopes of receiving \"forty acres and a mule\" were largely disappointed because","st":"","o":["President Johnson's pardons restored most confiscated land to its former owners","the Homestead Act of 1862 excluded all southern land","the Fifteenth Amendment prohibited land grants to freedpeople","Radical Republicans opposed any land redistribution","most freedpeople preferred to move to northern cities"],"e":["Sherman's Field Order No. 15 had set aside coastal land, but Johnson reversed it and returned land to pardoned planters.","The Southern Homestead Act of 1866 opened some southern public land, but it was poor land and the program largely failed.","The Fifteenth Amendment concerns voting and says nothing about land.","Thaddeus Stevens actually proposed confiscating planter land for freedpeople. Moderates and Johnson blocked it.","The Great Migration north came decades later. Most freedpeople wanted land in the South."],"a":0},{"id":"u2q01","u":2,"th":"pol","d":"m","pool":"quiz","s":"The Pendleton Civil Service Act of 1883 was passed largely in reaction to","st":"","o":["the Crédit Mobilier railroad scandal","the assassination of President Garfield by a disappointed office-seeker","the Supreme Court's decision in Wabash v. Illinois","the Pullman Strike","the Haymarket bombing in Chicago"],"e":["Crédit Mobilier (1872) involved bribery of congressmen and fed general reform sentiment, but it was not the trigger for the 1883 act.","Garfield's murder by Charles Guiteau dramatized the evils of the spoils system and pushed Congress to require merit exams for some federal jobs.","Wabash (1886) led to the Interstate Commerce Act, not civil service reform.","The Pullman Strike took place in 1894, after the Pendleton Act.","Haymarket (1886) produced anti-labor and anti-immigrant backlash, not civil service reform."],"a":1},{"id":"u2q02","u":2,"th":"pol","d":"m","pool":"B","s":"The Interstate Commerce Act of 1887 was significant because it","st":"","o":["nationalized the major railroads","granted public land to transcontinental railroads","created the first federal regulatory agency to oversee railroad rates","established an eight-hour day for railroad workers","broke up the Standard Oil Company"],"e":["The railroads stayed privately owned. The government briefly ran them only during World War I.","Land grants came earlier, in the Pacific Railway Acts of the 1860s.","The ICC was meant to ensure \"reasonable and just\" rates. It was weak at first but set a precedent for federal regulation.","The eight-hour day for railroad workers came with the Adamson Act of 1916.","Standard Oil was broken up by the Supreme Court in 1911 under the Sherman Act."],"a":2},{"id":"u2q03","u":2,"th":"pol","d":"h","pool":"diag","s":"In United States v. E.C. Knight Co. (1895), the Supreme Court weakened the Sherman Antitrust Act by ruling that","st":"","o":["states, not Congress, had the sole power to regulate railroads","the act violated the Fourteenth Amendment's due process clause","manufacturing was not interstate commerce, so a sugar-refining monopoly was beyond the act's reach","labor unions could never be prosecuted as combinations in restraint of trade","the federal government could regulate railroad rates but not stock sales"],"e":["Wabash (1886) said states could NOT regulate interstate railroads.","The Court did not strike the act down. It narrowed it.","Although the company controlled about 98% of sugar refining, the Court said manufacturing was local. This gutted early antitrust enforcement.","The Sherman Act was actually used against unions in this era (e.g., the Pullman injunction upheld in In re Debs).","The case concerned manufacturing monopolies, not railroad rates or stocks."],"a":2},{"id":"u2q04","u":2,"th":"pol","d":"e","pool":"A","s":"Thomas Nast's political cartoons helped bring down which of the following?","st":"","o":["The Populist Party","The Knights of Labor","Standard Oil's petroleum monopoly","The Ku Klux Klan Act","William \"Boss\" Tweed and the Tammany Hall machine"],"e":["The Populists arose in the 1890s and were not Nast's target.","Nast did not lead a campaign against the Knights.","Standard Oil was later exposed by Ida Tarbell's writing, not Nast's cartoons.","The Klan Act was a federal law against the Klan, not a political machine.","Nast's cartoons in <em>Harper's Weekly<\/em> made Tweed's corruption visible even to voters who could not read. Tweed was convicted in the 1870s."],"a":4},{"id":"u2q05","u":2,"th":"pol","d":"h","pool":"A","s":"Which of the following correctly shows cause and effect in railroad regulation?","st":"","o":["Munn v. Illinois struck down all state Granger laws.","The Interstate Commerce Act created the Granger movement.","The Sherman Antitrust Act forced the Supreme Court to decide Munn v. Illinois.","The Pullman Strike led Congress to abolish the Interstate Commerce Commission.","Wabash v. Illinois barred states from regulating interstate rates, so Congress passed the Interstate Commerce Act."],"e":["Munn upheld state regulation of grain elevators.","The Grangers came first (1867 onward) and pushed for regulation.","Munn (1877) came 13 years before the Sherman Act (1890).","The ICC lasted until 1995.","After Wabash (1886) blocked state regulation of interstate traffic, Congress created the ICC in 1887 to fill the gap."],"a":4},{"id":"u2q06","u":2,"th":"pol","d":"h","pool":"B","s":"The data above best support which generalization about Gilded Age politics?","st":"<p>Presidential election, 1880: Garfield (R) 48.3% of popular vote, Hancock (D) 48.2%. Voter turnout: about 80% of eligible voters.<\/p><p>Presidential election, 1884: Cleveland (D) 48.9%, Blaine (R) 48.3%. Voter turnout: about 78%.<\/p>","o":["One party dominated national politics throughout the era.","Women's suffrage had greatly expanded the electorate.","Most eligible voters did not participate in presidential elections.","Elections were extremely close and voter participation was very high.","Third parties regularly won a majority of the popular vote."],"e":["The near-even splits show intense two-party competition, not domination.","National women's suffrage came only in 1920.","Turnout near 80% is far higher than in most twentieth-century elections.","Popular-vote margins under one point and turnout around 80% characterized national elections in the period.","The two major parties won almost all the votes in these elections."],"a":3},{"id":"u2q07","u":2,"th":"pol","d":"m","pool":"A","s":"The \"Mugwumps\" of 1884 were","st":"","o":["farmers who founded the Grange","reform-minded Republicans who supported Democrat Grover Cleveland rather than their own party's tainted nominee","labor activists who led the Haymarket rally","supporters of unlimited coinage of silver","southern Democrats who overthrew Reconstruction governments"],"e":["The Grange was founded by Oliver Kelley in 1867.","They objected to James G. Blaine's reputation for corruption and helped elect Cleveland.","The Haymarket organizers were anarchists and labor radicals, not Mugwumps.","Free-silver supporters were mostly Populists and western Democrats.","Those were the Redeemers."],"a":1},{"id":"u2q08","u":2,"th":"pol","d":"m","pool":"B","s":"During the Pullman Strike of 1894, President Grover Cleveland","st":"","o":["forced George Pullman to recognize the union","nationalized the railroads to keep trains running","refused to intervene, citing laissez-faire principles","signed a law guaranteeing workers the right to bargain collectively","sent federal troops to break the strike, citing interference with the U.S. mail"],"e":["Pullman refused to negotiate, and the government sided with him.","There was no nationalization.","Cleveland intervened decisively on the employers' side.","That right came with the Wagner Act in 1935.","A federal court injunction against Debs's union and Cleveland's troops ended the strike. The Supreme Court upheld the injunction in In re Debs (1895)."],"a":4},{"id":"u2q09","u":2,"th":"pol","d":"m","pool":"quiz","s":"The Dawes Severalty Act of 1887 attempted to","st":"","o":["grant immediate full citizenship to all Native Americans","assimilate Native Americans by dividing tribal reservations into individual family farms","restore tribal governments and communal landholding","relocate all Native Americans to Oklahoma Territory","pay compensation for land seized in violation of treaties"],"e":["Citizenship was promised only to allottees after a 25-year trust period. All Native Americans became citizens in 1924.","Allotment aimed to make Native Americans into individual farmers and citizens. In practice, it cost them about two-thirds of their land.","That was the goal of the Indian Reorganization Act of 1934, which reversed Dawes.","Removal to Indian Territory was an earlier policy (the 1830s).","There was no compensation. The act opened \"surplus\" land to white settlers."],"a":1},{"id":"u2q10","u":2,"th":"eco","d":"e","pool":"diag","s":"Andrew Carnegie's control of iron mines, coal fields, ore ships, railroads, and steel mills is the best example of","st":"","o":["horizontal integration","collective bargaining","the crop-lien system","vertical integration","laissez-faire regulation"],"e":["Horizontal integration means buying competitors at the same stage, as Rockefeller did with refineries.","Collective bargaining is negotiation between unions and employers.","The crop-lien system was a southern agricultural credit arrangement.","Owning every stage of production, from raw materials to the finished product, is vertical integration.","Laissez-faire means government non-interference, not a business structure."],"a":3},{"id":"u2q11","u":2,"th":"eco","d":"m","pool":"A","s":"John D. Rockefeller built Standard Oil into a near-monopoly mainly by","st":"","o":["receiving a government-granted monopoly","inventing the internal combustion engine","refusing to use railroads for shipping","recognizing labor unions to avoid strikes","buying out or driving out competing oil refiners, an example of horizontal integration"],"e":["Standard Oil's dominance came from business tactics, not a government charter.","Rockefeller was a businessman, not an inventor of engines.","Rockefeller exploited railroads, winning secret rebates on shipping rates.","Rockefeller was not known for union recognition.","Using rebates, price cutting, and buyouts, Standard Oil controlled about 90% of U.S. refining by the 1880s."],"a":4},{"id":"u2q12","u":2,"th":"eco","d":"m","pool":"B","s":"In the late nineteenth century, a \"trust\" was","st":"","o":["a federal agency regulating interstate commerce","an arrangement in which stockholders of several companies gave control to a single board of trustees, reducing competition","a cooperative store owned by farmers","a union of skilled workers","a government-insured savings account"],"e":["That was the Interstate Commerce Commission.","Standard Oil organized the first major trust in 1882. \"Trust\" became shorthand for any monopoly.","Farmers' cooperatives aimed to escape middlemen and trusts.","Craft unions are labor organizations, not business combinations.","Federal deposit insurance came in 1933 (FDIC)."],"a":1},{"id":"u2q13","u":2,"th":"eco","d":"e","pool":"quiz","s":"The completion of the first transcontinental railroad in 1869 was celebrated at","st":"","o":["Pittsburgh, Pennsylvania, center of the steel industry","Abilene, Kansas, at the end of the Chisholm Trail","Chicago, Illinois, during the World's Columbian Exposition","Promontory Point, Utah, where the Union Pacific and Central Pacific lines met","San Francisco, California, at the Pacific terminus"],"e":["Pittsburgh was the steel hub, not the railroad's meeting point.","Abilene was a cattle town, not the meeting point.","The Exposition took place in 1893.","The \"golden spike\" ceremony joined the two lines, built largely by Irish and Chinese labor.","The Central Pacific began in Sacramento, and the lines met in Utah."],"a":3},{"id":"u2q14","u":2,"th":"eco","d":"m","pool":"A","s":"Banker J.P. Morgan's purchase of Carnegie Steel in 1901 led to the creation of","st":"","o":["the Federal Reserve System","the Interstate Commerce Commission","the Standard Oil Trust","the American Federation of Labor","U.S. Steel, the first billion-dollar corporation"],"e":["The Federal Reserve was created by Congress in 1913.","The ICC was a government agency created in 1887.","Standard Oil was Rockefeller's company, organized as a trust in 1882.","The AFL was a labor federation founded by Samuel Gompers.","Morgan merged Carnegie's company with others, creating a giant capitalized at about $1.4 billion."],"a":4},{"id":"u2q15","u":2,"th":"eco","d":"m","pool":"A","s":"One important economic effect of the expansion of railroads after 1865 was the","st":"","o":["creation of a national market that allowed goods to be mass-produced and sold across the country","decline of coal and steel production","end of federal involvement in the economy","reduction of immigration to the United States","collapse of agriculture on the Great Plains"],"e":["Railroads linked regions, cut shipping costs, and spurred demand for steel and coal, which knitted together a national economy.","Railroads greatly increased demand for coal and steel.","The government heavily subsidized railroads with land grants and loans.","Railroads recruited immigrant labor and settlers.","Railroads opened the Plains to commercial farming."],"a":0},{"id":"u2q16","u":2,"th":"eco","d":"m","pool":"B","s":"The invention of barbed wire in the 1870s contributed most directly to the","st":"","o":["end of the open range and the long cattle drives","decline of farming on the Great Plains","passage of the Homestead Act","growth of the steel industry in the South","rise of the Knights of Labor"],"e":["Fenced land blocked trails and ended open grazing, transforming the cattle industry.","Barbed wire helped farmers fence land on the treeless Plains.","The Homestead Act (1862) came before barbed wire (1874).","Barbed wire was a minor steel product. Its key effect was on ranching.","Barbed wire had no direct connection to the Knights."],"a":0},{"id":"u2q17","u":2,"th":"eco","d":"e","pool":"quiz","s":"Thomas Edison's laboratory at Menlo Park, New Jersey, is best known for developing","st":"","o":["a practical incandescent electric light bulb","the Bessemer steel process","the airplane","the assembly line for automobiles","the telephone"],"e":["Edison's lab produced the commercial light bulb in 1879 along with other inventions such as the phonograph.","Henry Bessemer, an Englishman, developed it.","The Wright brothers flew in 1903.","Henry Ford introduced the moving assembly line in 1913.","Alexander Graham Bell patented the telephone in 1876."],"a":0},{"id":"u2q18","u":2,"th":"eco","d":"m","pool":"quiz","s":"The Bessemer process was important to industrialization because it","st":"","o":["made it possible to produce steel cheaply and in large quantities","connected the East and West Coasts by telegraph","allowed oil to be refined into kerosene","generated alternating-current electricity","mechanized cotton picking"],"e":["By blasting air through molten iron to remove impurities, the process made steel affordable for rails, bridges, and buildings.","The transcontinental telegraph was completed in 1861.","That is oil refining, Rockefeller's business.","AC power is associated with Westinghouse and Tesla.","Mechanical cotton pickers spread in the 1940s."],"a":0},{"id":"u2q19","u":2,"th":"eco","d":"h","pool":"B","s":"In Munn v. Illinois (1877), the Supreme Court ruled that","st":"","o":["states could regulate private businesses, such as grain elevators, that were \"clothed with a public interest\"","the federal income tax was unconstitutional","labor unions were illegal conspiracies","monopolies in manufacturing were exempt from federal law","states could not regulate any railroad rates"],"e":["Munn was a victory for the Granger movement. Later cases such as Wabash (1886) limited it for interstate traffic.","That was Pollock v. Farmers' Loan and Trust (1895).","Munn did not concern unions.","That was the reasoning of E.C. Knight (1895).","That conclusion came later and applied only to interstate rates (Wabash, 1886)."],"a":0},{"id":"u2q20","u":2,"th":"soc","d":"m","pool":"diag","s":"Compared with the American Federation of Labor, the Knights of Labor was distinctive because it","st":"","o":["was founded by Samuel Gompers","welcomed unskilled workers, women, and African Americans into one large organization","lasted far longer and became the largest union of the twentieth century","organized only skilled craftsmen into separate trade unions","refused to support the eight-hour day"],"e":["Gompers founded the AFL. Terence Powderly led the Knights.","The Knights' inclusiveness set them apart from the AFL's skilled craft unions.","The Knights declined rapidly after 1886.","That describes the AFL.","The Knights supported the eight-hour day."],"a":1},{"id":"u2q21","u":2,"th":"soc","d":"e","pool":"B","s":"Samuel Gompers and the American Federation of Labor focused primarily on","st":"","o":["\"bread-and-butter\" goals such as higher wages and shorter hours for skilled workers","promoting immigration of unskilled laborers","overthrowing capitalism through revolution","organizing all workers regardless of skill into a single union","forming a national labor political party"],"e":["The AFL avoided radical politics and concentrated on practical gains through collective bargaining.","The AFL generally favored restricting immigration.","That was the goal of radicals such as the later IWW, not the AFL.","That inclusive approach was the Knights of Labor's.","Gompers kept the AFL out of third-party politics."],"a":0},{"id":"u2q22","u":2,"th":"soc","d":"m","pool":"quiz","s":"The Haymarket Square incident of 1886 had which of the following effects?","st":"","o":["It ended the use of federal troops in labor disputes.","It caused Congress to pass the Sherman Antitrust Act.","It united skilled and unskilled workers in a single successful union.","It increased public hostility toward labor unions and immigrants, contributing to the decline of the Knights of Labor.","It led directly to passage of an eight-hour-day law for all workers."],"e":["Troops were used again at Pullman in 1894.","The Sherman Act (1890) targeted business combinations and was not a response to Haymarket.","The reverse happened. The inclusive Knights collapsed.","Although its leaders were not involved, the Knights were associated in the public mind with the bombing and lost members rapidly.","No such law followed. The eight-hour day for most workers came with the Fair Labor Standards Act (1938)."],"a":3},{"id":"u2q23","u":2,"th":"soc","d":"m","pool":"quiz","s":"The Homestead Strike of 1892 ended when","st":"","o":["Carnegie agreed to all of the union's demands","President Cleveland seized the steel mills","Congress passed a law banning private police forces","Pinkerton guards and then the state militia broke the strike at Carnegie's steel works, crushing the union","the Knights of Labor negotiated an eight-hour day"],"e":["The union was destroyed, not victorious.","Cleveland intervened in Pullman (1894), not Homestead. (Truman tried to seize steel mills in 1952.)","No such federal law was passed.","Frick's hiring of Pinkertons led to a deadly battle. The militia then reopened the plant with nonunion workers.","The Knights had largely collapsed by 1892, and no eight-hour deal was made."],"a":3},{"id":"u2q24","u":2,"th":"soc","d":"h","pool":"B","s":"The Great Railroad Strike of 1877 was significant because it","st":"","o":["was led by Eugene V. Debs and the American Railway Union","won the eight-hour day for railroad workers","was the first nationwide strike and led the president to use federal troops against strikers","took place at Carnegie's Homestead steel works","ended in a negotiated settlement that recognized unions"],"e":["Debs's union led the 1894 Pullman Strike.","Railroad workers got the eight-hour day only in 1916 (Adamson Act).","Wage cuts after the Panic of 1873 sparked the walkout. Hayes sent troops, a pattern repeated in later strikes.","The Homestead Strike was in 1892.","The strike was suppressed, not settled with recognition."],"a":2},{"id":"u2q25","u":2,"th":"soc","d":"e","pool":"A","s":"Most of the \"New Immigrants\" who arrived in the United States between 1880 and 1920 came from","st":"","o":["Latin America","Canada and Great Britain","sub-Saharan Africa","Ireland and Germany","southern and eastern Europe"],"e":["Large-scale Latin American immigration came later in the twentieth century.","These were older and smaller sources.","Voluntary African immigration was very small in this period.","Irish and German immigrants dominated the pre–Civil War \"old\" immigration.","Italians, Poles, Russian Jews, Greeks, and Slavs made up most of this wave, unlike earlier immigrants from northern and western Europe."],"a":4},{"id":"u2q26","u":2,"th":"soc","d":"e","pool":"quiz","s":"The Chinese Exclusion Act of 1882 was historically significant because it","st":"","o":["created Ellis Island as an immigration station","ended immigration from all of Asia","was the first federal law to bar immigration on the basis of nationality","established a quota system based on national origins","granted citizenship to Chinese railroad workers"],"e":["Ellis Island opened in 1892.","It applied to China. Broader Asian exclusion came with the 1917 and 1924 laws.","It suspended Chinese labor immigration, was renewed and made permanent, and was not repealed until 1943.","National-origins quotas came in the 1920s (Emergency Quota Act of 1921, Immigration Act of 1924).","The act barred Chinese immigrants from naturalization."],"a":2},{"id":"u2q27","u":2,"th":"soc","d":"e","pool":"B","s":"Jacob Riis's <em>How the Other Half Lives<\/em> (1890) used photographs and text to expose","st":"","o":["the corruption of the Standard Oil Company","the squalid conditions of New York City tenements","the meatpacking industry in Chicago","the lives of southern sharecroppers","the treatment of Native Americans on reservations"],"e":["Ida Tarbell exposed Standard Oil (1904).","Riis's images of crowded, dark tenements spurred housing reform.","Upton Sinclair's <em>The Jungle<\/em> (1906) targeted meatpacking.","Riis focused on urban immigrants in New York.","That was Helen Hunt Jackson's <em>A Century of Dishonor<\/em>."],"a":1},{"id":"u2q28","u":2,"th":"soc","d":"e","pool":"A","s":"Jane Addams's Hull House in Chicago was an example of a","st":"","o":["labor union for garment workers","political machine that traded favors for votes","settlement house that provided services to immigrants and pushed for social reform","religious revival center in the West","factory that employed child laborers"],"e":["The International Ladies' Garment Workers' Union (1900) was a union, not a settlement house.","Machines like Tammany Hall were partisan organizations.","Middle-class reformers lived among the poor and offered classes, child care, and English instruction.","Hull House was urban and secular in its programs.","Hull House reformers fought child labor."],"a":2},{"id":"u2q29","u":2,"th":"soc","d":"m","pool":"B","s":"The Ghost Dance movement and the massacre at Wounded Knee in 1890 are significant because","st":"","o":["Wounded Knee forced the government to restore tribal lands","the Ghost Dance was a federal program to assimilate Native Americans","the Ghost Dance led Congress to pass the Dawes Act","Wounded Knee was the Lakota's greatest military victory","Wounded Knee marked the effective end of armed Native American resistance on the Plains"],"e":["No land was restored. Allotment continued.","It was a Native religious movement promising renewal.","The Dawes Act came three years before Wounded Knee.","That was Little Bighorn (1876).","The army killed about 250 Lakota after alarm over the Ghost Dance. It is seen as the close of the Indian wars."],"a":4},{"id":"u2q30","u":2,"th":"soc","d":"h","pool":"A","s":"This 1877 statement was made by","st":"<p>\"Hear me, my chiefs! I am tired; my heart is sick and sad. From where the sun now stands I will fight no more forever.\"<\/p>","o":["Geronimo after his final surrender in 1886","Sitting Bull after the Battle of Little Bighorn","Chief Joseph of the Nez Perce after a long retreat toward Canada","Tecumseh before the War of 1812","Crazy Horse at Wounded Knee"],"e":["Geronimo was an Apache leader in the Southwest. This is not his statement.","Sitting Bull fled to Canada after 1876 and surrendered in 1881. These are not his words.","Joseph surrendered just short of the Canadian border after a long pursuit.","Tecumseh lived decades earlier.","Crazy Horse was killed in 1877 and was not at Wounded Knee (1890)."],"a":2},{"id":"u2q31","u":2,"th":"soc","d":"m","pool":"A","s":"
