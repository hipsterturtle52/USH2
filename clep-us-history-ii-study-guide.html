rong>On what terms would the eleven Confederate states rejoin the Union?<\/strong> And <strong>what would freedom actually mean for formerly enslaved people?<\/strong> The struggle over these questions is called <strong>Reconstruction<\/strong> (1865–1877). The short version: freedpeople won major constitutional rights during Reconstruction. Then the North lost interest, white southern Democrats retook power, and most of those rights were stripped away by 1900.<\/p>\n<h2>Presidential Reconstruction (1865–1866)<\/h2>\n<p>Lincoln had planned a lenient restoration. Under his <strong>Ten Percent Plan<\/strong> (1863), a state could form a new government once 10% of its 1860 voters swore loyalty to the Union. Congress pushed back with the harsher <strong>Wade-Davis Bill<\/strong>, which required 50% and an \"ironclad oath,\" but Lincoln pocket-vetoed it. Lincoln was assassinated in April 1865, and <strong>Andrew Johnson<\/strong>, a pro-Union Democrat from Tennessee, became president.<\/p>\n<p>Johnson pardoned thousands of ex-Confederates and let the old southern elite rebuild state governments. Those governments passed <strong>Black Codes<\/strong>. These laws limited freedpeople's right to own or rent land, required them to sign yearly labor contracts, and let authorities arrest unemployed Black men for \"vagrancy\" and hire them out. Johnson also returned land confiscated during the war to its prewar owners. That ended the hopes raised by General Sherman's Field Order No. 15 that freedpeople would get <strong>\"forty acres and a mule.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Johnson's lenient pardons; old elites back in power<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Southern states pass Black Codes; anti-Black riots in Memphis and New Orleans (1866)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Northern voters elect a Republican supermajority in 1866; Congress takes over Reconstruction<\/div><\/div>\n<p>The <strong>Thirteenth Amendment<\/strong> (ratified December 1865) abolished slavery. Congress also created the <strong>Freedmen's Bureau<\/strong> (1865). It provided food and medical care and supervised labor contracts. Its most lasting work was <strong>education<\/strong>: with northern missionary societies, it helped found schools and colleges such as <strong>Howard<\/strong> and <strong>Fisk<\/strong>.<\/p>\n<h2>Congressional (Radical) Reconstruction (1867–1877)<\/h2>\n<p>The <strong>Radical Republicans<\/strong>, led by <strong>Thaddeus Stevens<\/strong> in the House and <strong>Charles Sumner<\/strong> in the Senate, wanted to remake southern society and protect Black rights. Congress passed the <strong>Civil Rights Act of 1866<\/strong> over Johnson's veto. Then, to put those rights beyond the reach of future majorities, it wrote the <strong>Fourteenth Amendment<\/strong> (ratified 1868). The amendment made everyone born in the U.S. a <strong>citizen<\/strong> and barred states from denying anyone <strong>\"due process\"<\/strong> or <strong>\"equal protection of the laws.\"<\/strong> It later became the foundation of the twentieth-century civil rights revolution.<\/p>\n<p>When southern states refused to ratify it, Congress passed the <strong>Reconstruction Acts of 1867<\/strong>. These acts divided the former Confederacy (except Tennessee, already readmitted) into <strong>five military districts<\/strong>. To be readmitted, a state had to write a new constitution guaranteeing <strong>Black male suffrage<\/strong> and ratify the Fourteenth Amendment.<\/p>\n<p>Congress also passed the <strong>Tenure of Office Act<\/strong>, which barred the president from removing certain officials without Senate approval. Johnson fired Secretary of War Edwin Stanton anyway, and in 1868 the House <strong>impeached<\/strong> him. The Senate fell <strong>one vote<\/strong> short of removing him. Johnson finished his term with little power left.<\/p>\n<p><strong>Ulysses S. Grant<\/strong> won the presidency in 1868. The <strong>Fifteenth Amendment<\/strong> (1870) barred denying the vote on account of <strong>\"race, color, or previous condition of servitude.\"<\/strong> It did not mention sex, which angered woman suffrage leaders and split their movement.<\/p>\n<h3>Reconstruction governments in the South<\/h3>\n<p>Southern Republican governments drew support from three groups:<\/p>\n<ul><li>freedmen, who voted in large numbers<\/li><li><strong>\"carpetbaggers\"<\/strong>, northerners who moved South<\/li><li><strong>\"scalawags\"<\/strong>, white southerners who joined the Republicans<\/li><\/ul>\n<p>About 2,000 Black men held office. <strong>Hiram Revels<\/strong> of Mississippi became the <strong>first African American U.S. senator<\/strong> (1870). These governments created the South's first <strong>public school systems<\/strong> and rebuilt railroads, but they also ran up debt and suffered some corruption, which opponents exaggerated.<\/p>\n<p>Freedpeople built independent lives. They <strong>reunited families<\/strong>, legalized marriages, and founded <strong>Black churches<\/strong>, which became the center of community and political life. They also flocked to schools.<\/p>\n<h3>Violence and retreat<\/h3>\n<p>The <strong>Ku Klux Klan<\/strong> (founded 1866) and similar groups used terror to keep Black men from voting. Congress answered with the <strong>Enforcement Acts<\/strong> and the <strong>Ku Klux Klan Act<\/strong> (1870–71), which let federal troops and courts crush the first Klan. But northern commitment faded for several reasons:<\/p>\n<ul><li>the <strong>Panic of 1873<\/strong> turned voters' attention to the economy<\/li><li>scandals in Grant's administration, including the <strong>Crédit Mobilier<\/strong> railroad bribery scheme and the <strong>Whiskey Ring<\/strong> tax fraud, discredited Republican rule<\/li><li>northern racism made voters weary of the \"southern question\"<\/li><\/ul>\n<p>The Supreme Court also narrowed the new amendments. In the <strong>Slaughterhouse Cases<\/strong> (1873), the Court read the Fourteenth Amendment's protections narrowly. <strong>U.S. v. Cruikshank<\/strong> (1876) overturned convictions from the <strong>Colfax Massacre<\/strong> and left protection of Black citizens mostly to the states.<\/p>\n<h2>The end of Reconstruction: the Compromise of 1877<\/h2>\n<p>The <strong>election of 1876<\/strong> between <strong>Rutherford B. Hayes<\/strong> (Republican) and <strong>Samuel Tilden<\/strong> (Democrat) hinged on disputed electoral votes from three southern states. In the informal <strong>Compromise of 1877<\/strong>, Democrats accepted Hayes as president, and Hayes <strong>withdrew the last federal troops<\/strong> from southern statehouses. Southern Democrats who called themselves <strong>\"Redeemers\"<\/strong> took over every southern state.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Northern fatigue, depression, violence, court rulings<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Compromise of 1877 removes federal troops<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>\"Redeemer\" Democrats rule the South; Black rights erode<\/div><\/div>\n<h2>The \"New South\" and Jim Crow (1877–1900)<\/h2>\n<p>Atlanta editor <strong>Henry Grady<\/strong> promoted a <strong>\"New South\"<\/strong> of factories, railroads, and diversified farming. Some industry did grow: <strong>textile mills<\/strong>, <strong>Birmingham steel<\/strong>, and <strong>tobacco<\/strong> (James B. Duke's American Tobacco Company). But the South stayed poor and mostly agricultural, and northern capital often owned its industry.<\/p>\n<h3>The farm trap<\/h3>\n<p>Without land, most freedpeople, and many poor whites, became <strong>sharecroppers<\/strong>. They farmed a landowner's land in exchange for a share of the crop, often half. Others were <strong>tenant farmers<\/strong> who rented land. Under the <strong>crop-lien system<\/strong>, local merchants supplied seed and food on credit, secured by a lien on the coming crop. High interest and low cotton prices kept families in <strong>permanent debt<\/strong>.<\/p>\n<h3>Jim Crow and disfranchisement<\/h3>\n<p>By the 1890s southern states built a system of legal segregation known as <strong>Jim Crow<\/strong>. To get around the Fifteenth Amendment, they used:<\/p>\n<ul><li><strong>poll taxes<\/strong><\/li><li><strong>literacy tests<\/strong>, applied unfairly by white registrars<\/li><li><strong>white primaries<\/strong><\/li><li><strong>grandfather clauses<\/strong>, which excused a man from these tests if his grandfather could vote before 1867, so poor whites kept the vote<\/li><\/ul>\n<p>The Supreme Court went along:<\/p>\n<ul><li><strong>Civil Rights Cases (1883):<\/strong> struck down the Civil Rights Act of 1875, holding that the Fourteenth Amendment limits <em>state<\/em> action, not private businesses.<\/li><li><strong>Plessy v. Ferguson (1896):<\/strong> upheld segregated railroad cars under the doctrine of <strong>\"separate but equal.\"<\/strong> Justice <strong>John Marshall Harlan<\/strong> dissented alone: \"Our Constitution is color-blind.\"<\/li><\/ul>\n<p><strong>Lynching<\/strong> peaked in the 1890s. Journalist <strong>Ida B. Wells<\/strong> exposed it in pamphlets such as <em>Southern Horrors<\/em> (1892). Some Black southerners left. The <strong>Exodusters<\/strong> moved to Kansas in 1879.<\/p>\n<h3>Two Black strategies<\/h3>\n<p><strong>Booker T. Washington<\/strong> founded the <strong>Tuskegee Institute<\/strong> (1881). In his <strong>Atlanta Compromise<\/strong> speech (1895), he urged Black southerners to accept segregation for now and focus on <strong>vocational education<\/strong> and economic self-help. <strong>W.E.B. Du Bois<\/strong> answered in <em>The Souls of Black Folk<\/em> (1903). He demanded <strong>full civil and political rights now<\/strong> and higher education for a <strong>\"Talented Tenth\"<\/strong> of leaders. (Du Bois's later work is in Unit 3.)<\/p>\n<p>Meanwhile, white southerners built the <strong>\"Lost Cause\"<\/strong> memory of the war. It cast the Confederacy as a noble fight for states' rights rather than slavery. Monuments and textbooks spread this view for generations.<\/p>\n<h3>One diplomatic footnote<\/h3>\n<p>In 1867 Secretary of State <strong>William Seward<\/strong> bought <strong>Alaska<\/strong> from Russia for $7.2 million. Critics mocked it as \"Seward's Folly.\"<\/p>","mustknow":["<strong>13th Amendment<\/strong> (1865) abolished slavery. <strong>14th<\/strong> (1868) gave citizenship plus <strong>equal protection<\/strong> and <strong>due process<\/strong>. <strong>15th<\/strong> (1870) barred race-based denial of the vote.","<strong>Black Codes<\/strong> (1865–66): southern laws restricting freedpeople's labor and movement. They provoked <strong>Radical Reconstruction<\/strong>.","<strong>Reconstruction Acts of 1867<\/strong>: five military districts; readmission required Black male suffrage and ratifying the 14th Amendment.","<strong>Johnson's impeachment<\/strong> (1868) came from firing Stanton in violation of the <strong>Tenure of Office Act<\/strong>. He was acquitted by one vote.","<strong>Freedmen's Bureau<\/strong>: aid, labor contracts, and especially <strong>schools<\/strong> (Howard, Fisk).","<strong>Sharecropping + crop-lien<\/strong> = a cycle of debt for Black and poor white farmers.","<strong>Compromise of 1877<\/strong>: Hayes becomes president and federal troops leave the South. Reconstruction ends.","<strong>Plessy v. Ferguson<\/strong> (1896) = \"separate but equal.\" Harlan's dissent: \"color-blind.\"","Disfranchisement tools: <strong>poll tax, literacy test, grandfather clause, white primary<\/strong>.","<strong>Booker T. Washington<\/strong> (accommodation, Tuskegee, Atlanta Compromise) vs. <strong>W.E.B. Du Bois<\/strong> (immediate rights, Talented Tenth)."],"timeline":[{"y":"1863","t":"Lincoln's Ten Percent Plan","key":false},{"y":"1865","t":"Lincoln assassinated; Freedmen's Bureau created; 13th Amendment ratified; Black Codes begin","key":true},{"y":"1866","t":"Civil Rights Act passed over Johnson's veto; Ku Klux Klan founded","key":false},{"y":"1867","t":"Reconstruction Acts (military districts); Tenure of Office Act; Alaska purchased","key":true},{"y":"1868","t":"Johnson impeached and acquitted; 14th Amendment ratified; Grant elected","key":true},{"y":"1870","t":"15th Amendment; Hiram Revels first Black U.S. senator","key":true},{"y":"1870–71","t":"Enforcement Acts and Ku Klux Klan Act","key":false},{"y":"1873","t":"Panic of 1873; Slaughterhouse Cases; Colfax Massacre","key":false},{"y":"1876","t":"Disputed Hayes–Tilden election; U.S. v. Cruikshank","key":false},{"y":"1877","t":"Compromise of 1877: troops withdrawn, Reconstruction ends","key":true},{"y":"1879","t":"Exoduster migration to Kansas","key":false},{"y":"1881","t":"Booker T. Washington opens Tuskegee Institute","key":false},{"y":"1883","t":"Civil Rights Cases strike down Civil Rights Act of 1875","key":false},{"y":"1890","t":"Mississippi constitution adds poll tax and literacy test","key":false},{"y":"1892","t":"Ida B. Wells publishes <em>Southern Horrors<\/em>","key":false},{"y":"1895","t":"Washington's Atlanta Compromise speech","key":false},{"y":"1896","t":"Plessy v. Ferguson: \"separate but equal\"","key":true}],"cards":[{"id":"u1c01","f":"Thirteenth Amendment (1865)","b":"Abolished slavery and involuntary servitude, except as punishment for a crime."},{"id":"u1c02","f":"Fourteenth Amendment (1868)","b":"Citizenship for all persons born in the U.S.; states may not deny \"due process\" or \"equal protection of the laws.\" The basis of later civil rights rulings."},{"id":"u1c03","f":"Fifteenth Amendment (1870)","b":"The right to vote cannot be denied because of \"race, color, or previous condition of servitude.\" It left out women."},{"id":"u1c04","f":"Ten Percent Plan vs. Wade-Davis Bill","b":"Lincoln: a state is restored once 10% of 1860 voters swear loyalty. Congress (Wade-Davis): 50% plus an ironclad oath. Lincoln pocket-vetoed it."},{"id":"u1c05","f":"Freedmen's Bureau (1865)","b":"Federal agency that gave freedpeople food and medical care and supervised labor contracts. Its biggest legacy was schools and colleges (Howard, Fisk)."},{"id":"u1c06","f":"Black Codes","b":"Laws passed by southern states in 1865–66 restricting freedpeople's labor, movement, and property rights. They sparked Radical Reconstruction."},{"id":"u1c07","f":"Radical Republicans","b":"Congressional faction (Thaddeus Stevens, Charles Sumner) that pushed for Black civil and voting rights and tough terms for the South."},{"id":"u1c08","f":"Reconstruction Acts of 1867","b":"Split the South into five military districts. Readmission required new constitutions with Black male suffrage and ratification of the 14th Amendment."},{"id":"u1c09","f":"Impeachment of Andrew Johnson (1868)","b":"The House impeached him for firing Secretary of War Stanton in violation of the Tenure of Office Act. The Senate acquitted by one vote."},{"id":"u1c10","f":"Carpetbaggers / Scalawags","b":"Carpetbaggers were northerners who moved South during Reconstruction. Scalawags were white southerners who supported the Republicans."},{"id":"u1c11","f":"Sharecropping","b":"Landless farmers worked a landowner's land in exchange for a share of the crop. It was the dominant labor system for freedpeople."},{"id":"u1c12","f":"Crop-lien system","b":"Merchants advanced seed and supplies on credit, secured by the future crop. High interest kept farmers in endless debt."},{"id":"u1c13","f":"Enforcement Acts / Ku Klux Klan Act (1870–71)","b":"Federal laws that let the government use courts and troops against Klan terror aimed at Black voters."},{"id":"u1c14","f":"Compromise of 1877","b":"Settled the disputed Hayes–Tilden election. Hayes became president and withdrew the last federal troops from the South, ending Reconstruction."},{"id":"u1c15","f":"Redeemers","b":"Southern white Democrats who took back state governments from Republicans in the 1870s and rolled back Reconstruction."},{"id":"u1c16","f":"New South","b":"Henry Grady's vision of an industrialized, diversified southern economy (textiles, steel, tobacco). Only partly achieved."},{"id":"u1c17","f":"Jim Crow disfranchisement tools","b":"Poll taxes, literacy tests, white primaries, and grandfather clauses, used to strip Black men of the vote despite the 15th Amendment."},{"id":"u1c18","f":"Plessy v. Ferguson (1896)","b":"Supreme Court upheld segregated railroad cars under \"separate but equal.\" Justice Harlan dissented: \"Our Constitution is color-blind.\""},{"id":"u1c19","f":"Atlanta Compromise (1895)","b":"Booker T. Washington's speech urging Black southerners to accept segregation for now and pursue vocational education and economic progress."},{"id":"u1c20","f":"Ida B. Wells","b":"Black journalist who led the crusade against lynching (<em>Southern Horrors<\/em>, 1892)."},{"id":"u1c21","f":"Exodusters (1879)","b":"Black southerners who migrated to Kansas to escape the post-Reconstruction South."}]},{"n":2,"title":"The Gilded Age: Industry, Labor, the West, and the Cities","years":"1865–1900","period":"early","weight":12,"minutes":12,"lesson":"<h2>The big picture<\/h2>\n<p>Between the Civil War and 1900 the United States became the world's leading <strong>industrial economy<\/strong>. Railroads, steel, oil, and electricity built enormous fortunes. They also brought dangerous factories, crowded cities, and violent strikes. Mark Twain and Charles Dudley Warner called it <strong>\"The Gilded Age\"<\/strong> (1873): a thin layer of gold over serious problems. This unit has four pieces: <strong>big business<\/strong>, <strong>labor<\/strong>, <strong>immigrants and cities<\/strong>, and <strong>the West<\/strong>. A short section on <strong>politics<\/strong> follows.<\/p>\n<h2>1. Railroads and big business<\/h2>\n<p>The <strong>transcontinental railroad<\/strong> was finished at <strong>Promontory Point, Utah, in 1869<\/strong>. The Union Pacific was built largely by Irish workers and the Central Pacific by Chinese workers. Congress subsidized railroads with huge <strong>land grants<\/strong>. Railroads created a <strong>national market<\/strong> and drove demand for steel and coal. They even led to <strong>standard time zones<\/strong> (1883).<\/p>\n<p>New business strategies created giant corporations:<\/p>\n<ul><li><strong>Andrew Carnegie<\/strong> (steel) used the <strong>Bessemer process<\/strong> and <strong>vertical integration<\/strong>: he owned every stage of production, from iron mines and ore ships to mills and railroads. In 1901 he sold to banker <strong>J.P. Morgan<\/strong>, who created <strong>U.S. Steel<\/strong>, the first <strong>billion-dollar corporation<\/strong>.<\/li><li><strong>John D. Rockefeller<\/strong> (<strong>Standard Oil<\/strong>) used <strong>horizontal integration<\/strong>. He bought out or crushed competing refiners until he controlled about 90% of U.S. refining. He organized the business as a <strong>trust<\/strong> (1882), in which stockholders of many companies handed control to one board of trustees. Later, <strong>holding companies<\/strong> did the same job.<\/li><li>Critics called these men <strong>\"robber barons\"<\/strong>. Admirers called them <strong>\"captains of industry.\"<\/strong><\/li><\/ul>\n<p>New inventions remade daily life. <strong>Alexander Graham Bell<\/strong> invented the telephone (1876). <strong>Thomas Edison<\/strong> set up a research lab at Menlo Park and produced a practical <strong>light bulb<\/strong> (1879). <strong>George Westinghouse<\/strong> promoted alternating current.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Railroads + new technology + cheap immigrant labor + government support<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Rise of giant corporations and trusts<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Huge wealth gap, monopoly power, and a backlash from farmers and workers<\/div><\/div>\n<h3>Ideas that justified (and challenged) big business<\/h3>\n<p><strong>Social Darwinism<\/strong> applied \"survival of the fittest\" to society. <strong>Herbert Spencer<\/strong> and Yale's <strong>William Graham Sumner<\/strong> argued that the rich had earned their place and government should not help the poor. This fit with <strong>laissez-faire<\/strong> economics. <strong>Horatio Alger<\/strong> novels sold the \"rags to riches\" dream.<\/p>\n<p>Carnegie's <strong>\"Gospel of Wealth\"<\/strong> (1889) argued that the rich had a duty to give their fortunes away for the public good, through libraries, universities, and concert halls. \"The man who dies thus rich dies disgraced.\"<\/p>\n<p>Critics pushed back:<\/p>\n<ul><li><strong>Henry George<\/strong>, <em>Progress and Poverty<\/em> (1879), proposed a <strong>\"single tax\"<\/strong> on land values.<\/li><li><strong>Edward Bellamy<\/strong>, <em>Looking Backward<\/em> (1888), imagined a cooperative socialist utopia in the year 2000.<\/li><li><strong>Thorstein Veblen<\/strong> coined <strong>\"conspicuous consumption\"<\/strong> for the wasteful display of the rich (<em>The Theory of the Leisure Class<\/em>, 1899).<\/li><\/ul>\n<h3>First steps at regulation<\/h3>\n<p>Farmers angry at railroad rates won state <strong>\"Granger laws.\"<\/strong> In <strong>Munn v. Illinois<\/strong> (1877), the Supreme Court upheld state regulation of businesses \"clothed with a public interest,\" in that case grain elevators. But <strong>Wabash v. Illinois<\/strong> (1886) ruled that states could not regulate <strong>interstate<\/strong> commerce. Congress responded with two laws:<\/p>\n<ul><li>the <strong>Interstate Commerce Act<\/strong> (1887), which created the <strong>Interstate Commerce Commission<\/strong>, the first federal regulatory agency<\/li><li>the <strong>Sherman Antitrust Act<\/strong> (1890), which outlawed combinations \"in restraint of trade\"<\/li><\/ul>\n<p>Both were weak at first. In <strong>U.S. v. E.C. Knight<\/strong> (1895), the Court ruled that a sugar trust controlling 98% of refining was <em>manufacturing<\/em>, not <em>commerce<\/em>, so the Sherman Act did not reach it. Ironically, the Sherman Act was used more against <strong>labor unions<\/strong> than against trusts in the 1890s.<\/p>\n<h2>2. Labor<\/h2>\n<p>Factory work meant <strong>12-hour days<\/strong>, six-day weeks, child labor, dangerous machines, and no compensation for injuries. Workers organized in two main ways:<\/p>\n<ul><li>The <strong>Knights of Labor<\/strong> (led by <strong>Terence Powderly<\/strong>) welcomed nearly everyone: skilled and unskilled workers, women, and Black workers. It favored the <strong>eight-hour day<\/strong> and cooperatives. It collapsed after being blamed for the Haymarket bombing.<\/li><li>The <strong>American Federation of Labor (AFL, 1886)<\/strong>, led by <strong>Samuel Gompers<\/strong>, was a federation of <strong>skilled craft unions<\/strong>. It practiced <strong>\"bread-and-butter\" unionism<\/strong>: higher wages, shorter hours, better conditions. It used strikes and collective bargaining and avoided radical politics. The AFL survived and grew.<\/li><\/ul>\n<p>The great strikes are tested often. Know who, what, and the result:<\/p>\n<ul><li><strong>Great Railroad Strike (1877):<\/strong> the first nationwide strike, set off by wage cuts. President Hayes sent <strong>federal troops<\/strong>.<\/li><li><strong>Haymarket Square (Chicago, 1886):<\/strong> a bomb exploded at a rally for the eight-hour day. Anarchists were blamed, and a wave of <strong>anti-union, anti-immigrant<\/strong> feeling followed.<\/li><li><strong>Homestead Strike (1892):<\/strong> at Carnegie's steel works, manager <strong>Henry Clay Frick<\/strong> hired <strong>Pinkerton<\/strong> guards. A gun battle followed, the state militia broke the strike, and the steelworkers' union was crushed.<\/li><li><strong>Pullman Strike (1894):<\/strong> <strong>Eugene V. Debs's American Railway Union<\/strong> boycotted Pullman cars and paralyzed the railroads. President <strong>Cleveland<\/strong> sent troops, using a federal court <strong>injunction<\/strong>, on the grounds that the strike interfered with the mail. Debs went to jail and later became a <strong>Socialist<\/strong>.<\/li><\/ul>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Wage cuts and harsh conditions<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Major strikes (1877, 1886, 1892, 1894)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Government sides with employers: troops, injunctions; public links unions to radicalism<\/div><\/div>\n<h2>3. Immigrants and cities<\/h2>\n<p>After about 1880, the <strong>\"New Immigrants\"<\/strong> came mostly from <strong>southern and eastern Europe<\/strong>: Italians, Poles, Russian Jews, Greeks, and Slavs. Most were Catholic, Orthodox, or Jewish, and many were poor. They entered through <strong>Ellis Island<\/strong> (opened 1892). Asian immigrants on the West Coast later passed through <strong>Angel Island<\/strong> (1910).<\/p>\n<p><strong>Nativism<\/strong> (hostility to immigrants) grew. The <strong>Chinese Exclusion Act (1882)<\/strong> was the <strong>first federal law to bar immigrants by nationality<\/strong>. The anti-Catholic <strong>American Protective Association<\/strong> (1887) organized against the newcomers.<\/p>\n<p>Cities exploded. In 1870 about one American in four lived in an urban area. By 1920 it was more than half. Skyscrapers (architect <strong>Louis Sullivan<\/strong>: \"form follows function\"), electric streetcars, and the <strong>Brooklyn Bridge<\/strong> (1883) changed the landscape. The poor crowded into <strong>tenements<\/strong>. Photojournalist <strong>Jacob Riis<\/strong> exposed them in <em>How the Other Half Lives<\/em> (1890).<\/p>\n<p><strong>Political machines<\/strong> such as New York's <strong>Tammany Hall<\/strong>, run by <strong>\"Boss\" William Tweed<\/strong>, traded jobs, food, and favors for immigrant votes, and stole millions. Cartoonist <strong>Thomas Nast<\/strong> helped bring Tweed down.<\/p>\n<p>Reformers responded:<\/p>\n<ul><li><strong>Settlement houses<\/strong>, above all <strong>Jane Addams's Hull House<\/strong> (Chicago, 1889), offered classes, child care, and English lessons, and pushed for reform laws.<\/li><li>The <strong>Social Gospel<\/strong> movement (<strong>Walter Rauschenbusch<\/strong>, Washington Gladden) urged churches to fix social problems on earth.<\/li><li>The <strong>Woman's Christian Temperance Union<\/strong> (<strong>Frances Willard<\/strong>) fought alcohol and became the largest women's organization of the era.<\/li><\/ul>\n<h2>4. The West<\/h2>\n<p>The <strong>Homestead Act<\/strong> (1862) offered <strong>160 acres<\/strong> of public land to settlers who farmed it for five years. The <strong>Morrill Land-Grant Act<\/strong> (1862) funded state agricultural and technical colleges. Mining booms, <strong>cattle drives<\/strong> up trails such as the Chisholm Trail (many cowboys were Black or Mexican), and finally <strong>barbed wire<\/strong> (1874) closed the open range.<\/p>\n<p>The cost fell on Plains Indians. Hunters slaughtered the <strong>buffalo<\/strong>, the base of Plains life, and the herds nearly vanished by the late 1880s. The wars ran from the <strong>Sand Creek Massacre<\/strong> (1864) through these events:<\/p>\n<ul><li><strong>Little Bighorn (1876):<\/strong> Lakota and Cheyenne under <strong>Sitting Bull<\/strong> and <strong>Crazy Horse<\/strong> wiped out <strong>Custer's<\/strong> force.<\/li><li><strong>Chief Joseph<\/strong> and the Nez Perce attempted a long flight toward Canada and surrendered in 1877: \"I will fight no more forever.\"<\/li><li><strong>Wounded Knee (1890):<\/strong> the army massacred about 250 Lakota after alarm over the <strong>Ghost Dance<\/strong> religion. It marked the end of armed resistance.<\/li><\/ul>\n<p>Writer <strong>Helen Hunt Jackson<\/strong> condemned federal treatment of Native peoples in <em>A Century of Dishonor<\/em> (1881). But reformers' main answer was <strong>assimilation<\/strong>. The <strong>Dawes Severalty Act (1887)<\/strong> broke up reservations into <strong>individual allotments<\/strong> (160 acres per family head) and promised citizenship. \"Surplus\" land was sold to whites, and Native Americans lost about <strong>two-thirds<\/strong> of their land by 1934. Boarding schools such as <strong>Carlisle<\/strong> (founded by Richard Henry Pratt) forced Native children to give up their languages and cultures.<\/p>\n<p>In 1893 historian <strong>Frederick Jackson Turner<\/strong> argued in his <strong>\"frontier thesis\"<\/strong> that the frontier had shaped American democracy and individualism. The 1890 census had just declared the frontier <strong>closed<\/strong>.<\/p>\n<h2>5. Gilded Age politics<\/h2>\n<p>Politics was a close, intense game. Elections were narrow, <strong>voter turnout was very high<\/strong> (often about 80%), and the two parties differed less on policy than on loyalty, region, religion, and <strong>patronage<\/strong>. Debate focused on <strong>tariffs<\/strong>, <strong>currency<\/strong>, and <strong>civil service<\/strong>.<\/p>\n<p>In 1881 a disappointed office-seeker assassinated President <strong>James Garfield<\/strong>. This led to the <strong>Pendleton Civil Service Act (1883)<\/strong>, which filled some federal jobs by <strong>merit exams<\/strong> instead of the <strong>spoils system<\/strong>. In 1884, reform Republicans called <strong>\"Mugwumps\"<\/strong> bolted to Democrat <strong>Grover Cleveland<\/strong>, the only president to serve two <strong>non-consecutive<\/strong> terms (1885–89, 1893–97) until Donald Trump repeated the feat in 2025.<\/p>\n<p>Diplomacy was quiet. The <strong>Treaty of Washington<\/strong> (1871) sent the <strong>Alabama claims<\/strong> against Britain (over damage by Confederate raiders built in British shipyards) to arbitration, which awarded the U.S. $15.5 million. Secretary of State <strong>James G. Blaine<\/strong> hosted the first <strong>Pan-American Conference<\/strong> (1889) to expand U.S. influence and trade in Latin America.<\/p>\n<h2>Culture in brief<\/h2>\n<p>Writers turned to <strong>realism<\/strong>: <strong>Mark Twain<\/strong> (<em>Adventures of Huckleberry Finn<\/em>, 1884), William Dean Howells, and Henry James. Then came <strong>naturalism<\/strong>, which showed people at the mercy of their environment: <strong>Stephen Crane<\/strong> (<em>Maggie: A Girl of the Streets<\/em>), Jack London, and <strong>Theodore Dreiser<\/strong> (<em>Sister Carrie<\/em>). Painters <strong>Winslow Homer<\/strong> and <strong>Thomas Eakins<\/strong> worked in a realist style. <strong>Public high schools<\/strong>, land-grant colleges, research universities such as <strong>Johns Hopkins<\/strong> (1876), and women's colleges expanded quickly. The <strong>Chautauqua<\/strong> movement brought adult education to small towns. Mass leisure arrived: <strong>baseball<\/strong>, vaudeville, amusement parks, department stores, and mail-order catalogs from <strong>Montgomery Ward<\/strong> and <strong>Sears<\/strong>.<\/p>","mustknow":["<strong>Vertical integration<\/strong> (Carnegie, steel) vs. <strong>horizontal integration<\/strong> (Rockefeller, Standard Oil). A <strong>trust<\/strong> concentrates control of many companies.","<strong>Social Darwinism<\/strong> (Spencer, Sumner) justified inequality. The <strong>Gospel of Wealth<\/strong> (Carnegie) urged philanthropy. <strong>Henry George<\/strong> proposed a single tax. <strong>Bellamy<\/strong> wrote a socialist utopia.","<strong>Interstate Commerce Act<\/strong> (1887) regulated railroads. <strong>Sherman Antitrust Act<\/strong> (1890) banned trusts but was weakened by <strong>E.C. Knight<\/strong> (1895).","<strong>Knights of Labor<\/strong>: open to all, faded after Haymarket. <strong>AFL (Gompers)<\/strong>: skilled crafts, \"bread and butter.\"","Strikes: <strong>1877 railroad<\/strong>, <strong>Haymarket 1886<\/strong>, <strong>Homestead 1892<\/strong> (Carnegie/Frick), <strong>Pullman 1894<\/strong> (Debs; Cleveland sent troops via injunction).","<strong>New Immigrants<\/strong> came from southern and eastern Europe. <strong>Chinese Exclusion Act<\/strong> (1882) was the first nationality-based ban.","<strong>Jacob Riis<\/strong> (<em>How the Other Half Lives<\/em>), <strong>Jane Addams<\/strong> (Hull House), <strong>Tammany Hall / Boss Tweed<\/strong> (Nast cartoons).","<strong>Dawes Act<\/strong> (1887) broke up reservations into allotments. <strong>Wounded Knee<\/strong> (1890) ended the Indian wars. <strong>Little Bighorn<\/strong> (1876).","<strong>Turner's frontier thesis<\/strong> (1893): the frontier shaped American democracy, and it was now closed.","<strong>Pendleton Act<\/strong> (1883) came after Garfield's assassination and created merit-based civil service."],"timeline":[{"y":"1862","t":"Homestead Act; Morrill Land-Grant Act; Pacific Railway Act","key":false},{"y":"1869","t":"Transcontinental railroad completed at Promontory Point","key":true},{"y":"1871","t":"Treaty of Washington sends the Alabama claims to arbitration","key":false},{"y":"1873","t":"Twain and Warner publish <em>The Gilded Age<\/em>","key":false},{"y":"1876","t":"Battle of Little Bighorn; Bell's telephone","key":false},{"y":"1877","t":"Great Railroad Strike; Munn v. Illinois; Chief Joseph surrenders","key":true},{"y":"1879","t":"Edison's light bulb; Henry George's <em>Progress and Poverty<\/em>","key":false},{"y":"1881","t":"Garfield assassinated; <em>A Century of Dishonor<\/em>","key":false},{"y":"1882","t":"Chinese Exclusion Act; Standard Oil Trust organized","key":true},{"y":"1883","t":"Pendleton Civil Service Act; Brooklyn Bridge; standard time zones","key":true},{"y":"1886","t":"Haymarket bombing; AFL founded; Wabash v. Illinois","key":true},{"y":"1887","t":"Interstate Commerce Act; Dawes Severalty Act","key":true},{"y":"1889","t":"Hull House founded; Carnegie's \"Gospel of Wealth\"; Pan-American Conference","key":false},{"y":"1890","t":"Sherman Antitrust Act; Wounded Knee; <em>How the Other Half Lives<\/em>; census declares the frontier closed","key":true},{"y":"1892","t":"Homestead Strike; Ellis Island opens","key":false},{"y":"1893","t":"Turner's frontier thesis; Chicago World's Fair","key":false},{"y":"1894","t":"Pullman Strike","key":true},{"y":"1895","t":"U.S. v. E.C. Knight weakens the Sherman Act","key":false},{"y":"1901","t":"J.P. Morgan forms U.S. Steel","key":false}],"cards":[{"id":"u2c01","f":"Vertical integration","b":"Controlling every stage of production, from raw materials to the finished product. Carnegie Steel is the classic example."},{"id":"u2c02","f":"Horizontal integration","b":"Buying up or merging with competitors in the same industry. Rockefeller's Standard Oil is the classic example."},{"id":"u2c03","f":"Trust","b":"Stockholders of competing firms hand control to one board of trustees, creating a near-monopoly (Standard Oil, 1882)."},{"id":"u2c04","f":"Social Darwinism","b":"Herbert Spencer and William Graham Sumner applied \"survival of the fittest\" to society. Wealth was proof of fitness, so government should not help the poor."},{"id":"u2c05","f":"Gospel of Wealth (1889)","b":"Carnegie's essay: the rich are trustees of their wealth and should give it away for public good. \"The man who dies thus rich dies disgraced.\""},{"id":"u2c06","f":"Henry George, <em>Progress and Poverty<\/em> (1879)","b":"Argued that poverty grows alongside progress. Proposed a \"single tax\" on land values."},{"id":"u2c07","f":"Edward Bellamy, <em>Looking Backward<\/em> (1888)","b":"Utopian novel of a cooperative socialist America in 2000. Inspired Nationalist Clubs."},{"id":"u2c08","f":"Thorstein Veblen","b":"Economist who coined \"conspicuous consumption\" (<em>The Theory of the Leisure Class<\/em>, 1899)."},{"id":"u2c09","f":"Munn v. Illinois (1877)","b":"States may regulate private businesses that serve the public interest (grain elevators). A Granger victory."},{"id":"u2c10","f":"Wabash v. Illinois (1886)","b":"States cannot regulate interstate railroad rates. This led to the Interstate Commerce Act."},{"id":"u2c11","f":"Interstate Commerce Act (1887)","b":"Required \"reasonable and just\" railroad rates. Created the ICC, the first federal regulatory agency."},{"id":"u2c12","f":"Sherman Antitrust Act (1890)","b":"Banned combinations \"in restraint of trade.\" Weakened by U.S. v. E.C. Knight (1895) and used against unions."},{"id":"u2c13","f":"Knights of Labor","b":"Terence Powderly's inclusive union (unskilled, women, Black workers). Declined after Haymarket (1886)."},{"id":"u2c14","f":"American Federation of Labor (1886)","b":"Samuel Gompers. Skilled craft unions focused on \"bread and butter\": wages, hours, conditions."},{"id":"u2c15","f":"Haymarket Riot (1886)","b":"A bomb exploded at a Chicago eight-hour-day rally. Anarchists were blamed, and anti-union backlash followed."},{"id":"u2c16","f":"Homestead Strike (1892)","b":"Carnegie Steel lockout. Frick hired Pinkertons, militia crushed the union."},{"id":"u2c17","f":"Pullman Strike (1894)","b":"Debs's American Railway Union boycott. Cleveland sent federal troops using a court injunction. Debs jailed."},{"id":"u2c18","f":"New Immigrants","b":"Post-1880 immigrants from southern and eastern Europe (Italians, Poles, Russian Jews). Mostly Catholic, Jewish, or Orthodox."},{"id":"u2c19","f":"Chinese Exclusion Act (1882)","b":"First federal law barring immigration by nationality. Renewed and made permanent until 1943."},{"id":"u2c20","f":"Political machine","b":"Urban party organization (Tammany Hall, Boss Tweed) trading jobs and services for votes. Riddled with graft."},{"id":"u2c21","f":"Jacob Riis","b":"Photojournalist whose <em>How the Other Half Lives<\/em> (1890) exposed New York tenement life."},{"id":"u2c22","f":"Settlement houses","b":"Community centers in immigrant neighborhoods run by middle-class reformers (Jane Addams's Hull House, 1889)."},{"id":"u2c23","f":"Social Gospel","b":"Protestant movement (Walter Rauschenbusch) applying Christian ethics to urban poverty and labor problems."},{"id":"u2c24","f":"Pendleton Act (1883)","b":"After Garfield's assassination by an office-seeker. Created the merit-based civil service and competitive exams."},{"id":"u2c25","f":"Mugwumps","b":"Reform Republicans who backed Democrat Grover Cleveland in 1884 over the scandal-tainted Blaine."},{"id":"u2c26","f":"Dawes Severalty Act (1887)","b":"Divided reservations into individual allotments to assimilate Native Americans. They lost about two-thirds of their land."},{"id":"u2c27","f":"Battle of Little Bighorn (1876)","b":"Lakota and Cheyenne under Sitting Bull and Crazy Horse defeated Custer's 7th Cavalry."},{"id":"u2c28","f":"Wounded Knee (1890)","b":"Army massacre of about 250 Lakota after alarm over the Ghost Dance. Ended armed Plains resistance."},{"id":"u2c29","f":"Helen Hunt Jackson","b":"Author of <em>A Century of Dishonor<\/em> (1881), an exposé of U.S. broken treaties with Native Americans."},{"id":"u2c30","f":"Frederick Jackson Turner","b":"\"Frontier thesis\" (1893): the frontier experience shaped American democracy and individualism, and it had now closed."},{"id":"u2c31","f":"Realism / Naturalism","b":"Realism showed everyday life (Twain, Howells). Naturalism showed people shaped by harsh forces (Crane, Dreiser, London)."}]}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const UNITS = D.units;
const QS = D.questions;
const QMAP = Object.fromEntries(QS.map(q => [q.id, q]));
const CARDS = UNITS.flatMap(u => u.cards.map(c => Object.assign({u: u.n}, c)));
const CMAP = Object.fromEntries(CARDS.map(c => [c.id, c]));
const THEMES = Object.fromEntries(D.meta.thematic_weights.map(t => [t.id, t]));
const LETTERS = ['A','B','C','D','E'];
const DAY = 86400000;
const $ = s => document.querySelector(s);
const main = document.getElementById('main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => Math.round(x * 100) + '%';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

/* ---------- storage (safe) ---------- */
const KEY = 'clep-ush2-v1';
let storageOK = true;
function blankState(){ return {v:1, theme:null, lessonsRead:{}, quiz:{}, diag:null, exams:{}, examRun:null, cards:{}, mistakes:{}, plan:null}; }
function loadState(){
  try { const raw = localStorage.getItem(KEY); if (!raw) return blankState(); return sanitize(JSON.parse(raw)); }
  catch(e){ storageOK = false; return blankState(); }
}
function sanitize(o){
  const s = blankState();
  if (!o || typeof o !== 'object') return s;
  for (const k of Object.keys(s)) if (o[k] !== undefined && typeof o[k] === typeof s[k] || (s[k] === null && o[k] && typeof o[k] === 'object')) s[k] = o[k];
  if (o.theme === 'light' || o.theme === 'dark') s.theme = o.theme;
  return s;
}
let S = loadState();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e){ storageOK = false; } }

/* ---------- theme ---------- */
function applyTheme(){ if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
$('#themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
applyTheme();

/* ---------- keyboard ---------- */
let keyHandler = null;
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (keyHandler && keyHandler(e) === true) e.preventDefault();
});

/* ---------- derived progress ---------- */
const unitQs = (n, pool) => QS.filter(q => q.u === n && (!pool || q.pool === pool));
const diagLabel = n => {
  if (!S.diag || !S.diag.byUnit || !S.diag.byUnit[n]) return null;
  const r = S.diag.byUnit[n]; const p = r.c / r.n;
  return p >= 0.75 ? 'skim' : p >= 0.5 ? 'study' : 'must';
};
const labelPill = l => l === 'skim' ? '<span class="pill good">Skim</span>' : l === 'study' ? '<span class="pill warn">Study</span>' : l === 'must' ? '<span class="pill bad">Must study</span>' : '';
const unitDone = n => !!S.lessonsRead[n] && S.quiz[n] && S.quiz[n].best >= 0.7;
const cardState = id => S.cards[id] || null;
function cardMastery(n){ const cs = CARDS.filter(c => !n || c.u === n); if (!cs.length) return 0; return cs.filter(c => (S.cards[c.id] || {}).box >= 3).length / cs.length; }
function dueCards(n){ const now = Date.now(); return CARDS.filter(c => (!n || c.u === n) && (!S.cards[c.id] || S.cards[c.id].due <= now)); }
function openMistakes(){ return Object.keys(S.mistakes).filter(id => QMAP[id] && !S.mistakes[id].ok); }

/* time model (minutes) */
function unitTasks(n){
  const u = UNITS[n-1]; const lab = diagLabel(n); const f = lab === 'skim' ? 0.5 : 1;
  const qn = unitQs(n, 'quiz').length;
  return [
    {id:'lesson'+n, unit:n, kind:'lesson', label:`Unit ${n}: read lesson + must-know + timeline`, min: Math.round((u.minutes + 10) * f), done: !!S.lessonsRead[n]},
    {id:'quiz'+n, unit:n, kind:'quiz', label:`Unit ${n}: quiz (${qn} Q) + review explanations`, min: Math.round(qn * 1.5), done: !!S.quiz[n]},
    {id:'cards'+n, unit:n, kind:'cards', label:`Unit ${n}: learn flashcards (${u.cards.length})`, min: Math.round(u.cards.length * 1.0), done: cardMastery(n) >= 0.8, frac: cardMastery(n)}
  ];
}
function allTasks(){
  const t = [{id:'diag', kind:'diag', label:'Diagnostic test (30 Q)', min:45, done: !!S.diag}];
  const order = UNITS.map(u => u.n).sort((a,b) => { const r = l => ({must:0, study:1, skim:2})[diagLabel(l)] ?? 1; return r(a) - r(b) || a - b; });
  for (const n of order) t.push(...unitTasks(n));
  t.push({id:'review', kind:'review', label:'Spaced flashcard reviews (ongoing)', min: Math.round(CARDS.length * 0.9 * (1 - cardMastery())), done: cardMastery() >= 0.9});
  t.push({id:'mist', kind:'mist', label:'Drill the mistake log', min: Math.max(30, openMistakes().length * 2), done: false, always:true});
  t.push({id:'cheat', kind:'cheat', label:'Cheat sheet: redraw from memory', min:60, done:false, always:true});
  t.push({id:'examA', kind:'exam', label:'Practice Exam 1 (90 min) + review', min:150, done: !!(S.exams.A && S.exams.A.attempts)});
  t.push({id:'examB', kind:'exam', label:'Practice Exam 2 (90 min) + review', min:150, done: !!(S.exams.B && S.exams.B.attempts)});
  return t;
}
function hoursLeft(){
  let m = 0; for (const t of allTasks()) { if (t.done) continue; m += t.frac ? t.min * (1 - t.frac) : t.min; }
  return m / 60;
}
function totalHours(){ return allTasks().reduce((a,t) => a + t.min, 0) / 60; }

/* ---------- nav / router ---------- */
const NAV = [['#/','Home'],['#/diagnostic','Diagnostic'],['#/units','Units'],['#/cards','Flashcards'],['#/mistakes','Mistakes'],['#/exams','Practice exams'],['#/cheatsheet','Cheat sheet'],['#/plan','Study plan'],['#/about','About & data']];
function renderNav(){
  const h = location.hash || '#/';
  $('#nav').innerHTML = NAV.map(([href, l]) => {
    const on = href === '#/' ? (h === '#/' || h === '' || h === '#') : h.startsWith(href) || (href === '#/units' && h.startsWith('#/unit/')) || (href === '#/exams' && h.startsWith('#/exam/'));
    return `<a href="${href}" class="${on ? 'on' : ''}">${l}</a>`;
  }).join('');
}
const ROUTES = [
  [/^#?\/?$/, viewHome], [/^#\/diagnostic$/, viewDiag], [/^#\/units$/, viewUnits],
  [/^#\/unit\/(\d+)(?:\/(\w+))?$/, viewUnit], [/^#\/cards$/, viewCards], [/^#\/mistakes$/, viewMistakes],
  [/^#\/exams$/, viewExams], [/^#\/exam\/(A|B)$/, viewExam], [/^#\/cheatsheet$/, viewCheat],
  [/^#\/plan$/, viewPlan], [/^#\/about$/, viewAbout]
];
let timerIv = null;
function route(){
  keyHandler = null; if (timerIv) { clearInterval(timerIv); timerIv = null; }
  renderNav();
  const h = location.hash || '#/';
  for (const [re, fn] of ROUTES) { const m = h.match(re); if (m) { fn(...m.slice(1)); window.scrollTo(0,0); return; } }
  viewHome();
}
window.addEventListener('hashchange', route);
function banners(){
  let b = '';
  if (!storageOK) b += `<div class="banner">Your browser is blocking storage, so progress will not be saved between visits. Use <a href="#/about">Export progress</a> to keep a copy.</div>`;
  if (S.examRun && !location.hash.startsWith('#/exam/')) b += `<div class="banner"><b>A practice exam is in progress and its timer is still running.</b> <a href="#/exam/${S.examRun.exam}">Return to the exam</a></div>`;
  return b;
}

/* ---------- HOME ---------- */
function readiness(){
  const a = S.exams.A ? S.exams.A.best : null, b = S.exams.B ? S.exams.B.best : null;
  const ready = a != null && b != null && a >= 0.75 && b >= 0.75;
  return {a, b, ready};
}
function readinessCard(){
  const {a, b, ready} = readiness();
  const taken = [a, b].filter(x => x != null).length;
  const score = Math.min(a || 0, b || 0); // the lower exam is what gates booking (untaken = 0)
  const col = ready ? 'var(--good)' : 'var(--accent)';
  const deg = Math.round(Math.min(1, score / 0.75) * 360);
  const status = ready ? '<span class="pill good">Ready to book</span>' : '<span class="pill warn">Not ready yet</span>';
  const line = x => x == null ? '<span class="muted">not taken</span>' : `<b>${pct(x)}</b> ${x >= 0.75 ? '<span class="pill good">≥75%</span>' : '<span class="pill bad">below 75%</span>'}`;
  return `<div class="card"><div class="meter">
    <div class="dial" style="background:conic-gradient(${col} ${deg}deg, var(--surface2) 0)"><span>${taken ? pct(score) : '—'}<small>lower exam</small></span></div>
    <div><h3 style="margin:0 0 6px">Readiness ${status}</h3>
    <div class="small">Practice Exam 1 (best): ${line(a)}<br>Practice Exam 2 (best): ${line(b)}</div>
    <div class="small muted" style="margin-top:6px">“Ready to book” turns on only when <b>both</b> practice exams are at 75% or higher. The dial fills as your <b>lower</b> score approaches 75%.</div></div>
  </div></div>`;
}
function nextStep(){
  if (S.examRun) return [`Finish your practice exam`, `#/exam/${S.examRun.exam}`];
  if (!S.diag) return ['Take the 30-question diagnostic', '#/diagnostic'];
  const t = allTasks().find(t => !t.done && !t.always);
  if (!t) return ['Drill your mistakes and redraw the cheat sheet', '#/mistakes'];
  if (t.kind === 'lesson') return [t.label, `#/unit/${t.unit}/lesson`];
  if (t.kind === 'quiz') return [t.label, `#/unit/${t.unit}/quiz`];

/* ---------- QUIZ ENGINE (practice / diagnostic / drill) ---------- */
function recordMistake(id, correct, mode){
  if (!correct) { const m = S.mistakes[id] || {n:0}; m.n++; m.t = Date.now(); m.ok = false; S.mistakes[id] = m; }
  else if (mode === 'drill' && S.mistakes[id]) { S.mistakes[id].ok = true; }
}
function stimHTML(q){ return q.st ? `<div class="stim">${q.st}</div>` : ''; }
function qMeta(q){ return `<span class="pill">Unit ${q.u}</span> <span class="pill">${esc(THEMES[q.th].short)}</span>`; }
function runQuiz(opts){
  const {qs, mode} = opts; let i = 0, sel = null, revealed = false; const res = [];
  const feedback = mode !== 'diag';
  function render(){
    const q = qs[i];
    main.innerHTML = banners() + `<div class="qhead"><b>${esc(opts.title)}</b><span class="muted small">Question ${i+1} of ${qs.length}</span></div>
    <div class="bar"><span style="width:${(i)/qs.length*100}%"></span></div>
    <div class="card">${feedback ? `<div class="row small" style="margin-bottom:6px">${qMeta(q)}</div>` : ''}${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o, k) => {
      let cls = '';
      if (revealed) cls = k === q.a ? 'right' : (k === sel ? 'wrong' : '');
      else if (k === sel) cls = 'sel';
      return `<button class="opt ${cls}" data-k="${k}" ${revealed ? 'disabled' : ''}><span class="k">${LETTERS[k]}</span><span>${o}${revealed ? `<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span>` : ''}</span></button>`;
    }).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <a href="${opts.back}" class="small muted">Quit</a>
      <button class="btn" id="nx" ${sel == null ? 'disabled' : ''}>${!feedback ? (i === qs.length-1 ? 'Finish' : 'Next') : revealed ? (i === qs.length-1 ? 'See results' : 'Next') : 'Check'}</button></div>
    <div class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> ${feedback ? 'answer' : 'select'} · <span class="kbd">Enter</span> ${feedback ? 'next' : 'confirm'}</div></div>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
    $('#nx').onclick = next;
  }
  function choose(k){ if (revealed) return; sel = k; if (feedback) reveal(); else render(); }
  function reveal(){ revealed = true; const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); render(); }
  function next(){
    if (sel == null) return;
    if (feedback && !revealed) { reveal(); return; }
    if (!feedback) { const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); }
    if (i < qs.length - 1) { i++; sel = null; revealed = false; render(); window.scrollTo(0,0); }
    else finish();
  }
  function finish(){
    keyHandler = null;
    const r = {total: res.length, correct: res.filter(x => x.ok).length, res};
    if (opts.onDone) opts.onDone(r);
    if (opts.renderResults) return opts.renderResults(r);
    main.innerHTML = banners() + `<h1>${esc(opts.title)}: results</h1><div class="card"><div style="font-size:2rem;font-weight:700">${r.correct} / ${r.total} <span class="muted" style="font-size:1rem">(${pct(r.correct/r.total)})</span></div>
    <p class="muted">${r.correct/r.total >= 0.75 ? 'Solid. Keep the flashcards going.' : 'Missed questions are now in your mistake log. Re-read the bold terms in the lesson, then drill them.'}</p>
    <div class="row"><a class="btn" href="${opts.back}">Done</a><a class="btn ghost" href="#/mistakes">Mistake log</a></div></div>${reviewList(res.filter(x => !x.ok))}`;
  }
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { choose(+e.key - 1); return true; }
    const L = e.key.toUpperCase(); if (!revealed && LETTERS.includes(L) && e.key.length === 1) { choose(LETTERS.indexOf(L)); return true; }
    if (e.key === 'Enter') { next(); return true; }
  };
  render();
}
function reviewList(items, title){
  if (!items.length) return '';
  return `<h2>${title || 'Review what you missed'}</h2>` + items.map(x => { const q = QMAP[x.id]; return `<div class="card"><div class="row small">${qMeta(q)}</div>${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o,k) => `<div class="opt ${k === q.a ? 'right' : k === x.sel ? 'wrong' : ''}"><span class="k">${LETTERS[k]}</span><span>${o}<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span></span></div>`).join('')}</div></div>`; }).join('');
}

/* ---------- FLASHCARDS (Leitner) ---------- */
const INTERVALS = [0, 1, 3, 7, 14]; // days for boxes 1..5
function viewCards(){
  main.innerHTML = banners() + `<h1>Flashcards</h1><p class="muted">These are Leitner boxes. A card you get right moves up a box and comes back later (box 1 = today, then 1, 3, 7, and 14 days). A card you miss drops to box 1 and comes back in this same session.</p>

  <label class="f">Mode<select id="fm"><option value="due">Due now</option><option value="missed">Review missed only</option><option value="all">All cards (cram)</option></select></label></div>
  ${boxChart()}</div><div id="fcwrap"></div>`;
  const go = () => flashSession($('#fcwrap'), {unit: +$('#fu').value, mode: $('#fm').value});
  $('#fu').onchange = go; $('#fm').onchange = go; go();
}
function boxChart(n){
  const cs = CARDS.filter(c => !n || c.u === n); const counts = [0,0,0,0,0,0];
  for (const c of cs) { const s = S.cards[c.id]; counts[s ? s.box : 0]++; }
  const mx = Math.max(1, ...counts);
  const lbl = ['New','Box 1','Box 2','Box 3','Box 4','Box 5'];
  return `<div class="boxes">${counts.map(v => `<div title="${v}" style="height:${v/mx*100}%"></div>`).join('')}</div><div class="boxlbl">${counts.map((v,k) => `<span>${lbl[k]}<br><b>${v}</b></span>`).join('')}</div>`;
}
function flashSession(el, {unit, mode}){
  const pool = CARDS.filter(c => !unit || c.u === unit);
  let queue;
  if (mode === 'missed') queue = pool.filter(c => S.cards[c.id] && S.cards[c.id].lastMiss);
  else if (mode === 'all') queue = pool.slice();
  else { const now = Date.now(); const seen = pool.filter(c => S.cards[c.id] && S.cards[c.id].due <= now); const fresh = pool.filter(c => !S.cards[c.id]); queue = seen.concat(fresh.slice(0, Math.max(0, 30 - seen.length))); }
  queue = shuffle(queue); let flipped = false, got = 0, missed = 0; const total = queue.length;
  function render(){
    if (!queue.length) {
      el.innerHTML = `<div class="card"><b>${total ? 'Session complete.' : mode === 'missed' ? 'No missed cards here. Nice.' : 'Nothing due right now.'}</b> ${total ? `<span class="muted">${got} right first time, ${missed} misses.</span>` : ''}<div class="small muted" style="margin-top:6px">${dueCards(unit || 0).length} cards due in this set now.</div>${unit ? boxChart(unit) : ''}<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="again">Cram all cards in this set</button></div></div>`;
      $('#again').onclick = () => flashSession(el, {unit, mode:'all'}); keyHandler = null; return;
    }
    const c = queue[0]; const st = S.cards[c.id];
    el.innerHTML = `<div class="row small muted" style="justify-content:space-between;margin-top:10px"><span>${queue.length} left in session · Unit ${c.u}</span><span>${st ? 'Box ' + st.box : 'New card'}</span></div>
    <div class="card fc" id="fc">${flipped ? `<div><div style="font-weight:700;margin-bottom:8px">${c.f}</div><div class="back">${c.b}</div></div>` : `<div>${c.f}<div class="small muted" style="margin-top:12px">tap or press Space to flip</div></div>`}</div>
    <div class="row" style="justify-content:center">${flipped ? `<button class="btn ghost" id="miss">✗ Missed <span class="kbd">1</span></button><button class="btn" id="hit">✓ Got it <span class="kbd">2</span></button>` : `<button class="btn" id="flip">Flip <span class="kbd">Space</span></button>`}</div>`;
    $('#fc').onclick = () => { flipped = !flipped; render(); };
    if (flipped) { $('#miss').onclick = () => grade(false); $('#hit').onclick = () => grade(true); } else $('#flip').onclick = () => { flipped = true; render(); };
  }
  function grade(ok){
    const c = queue.shift(); const st = S.cards[c.id] || {box:0, miss:0};
    if (ok) { st.box = Math.min(5, Math.max(1, st.box + 1)); st.due = Date.now() + INTERVALS[st.box - 1] * DAY; st.lastMiss = false; if (!c._m) got++; }
    else { st.box = 1; st.due = Date.now(); st.miss = (st.miss || 0) + 1; st.lastMiss = true; missed++; c._m = true; queue.splice(Math.min(queue.length, 3), 0, c); }
    if (ok && st.box === 1) st.due = Date.now() + 10 * 60000; // learned today, show again later
    S.cards[c.id] = st; save(); flipped = false; render();
  }
  keyHandler = e => {
    if (!queue.length) return;
    if (e.key === ' ' || e.key === 'Enter' && !flipped) { flipped = !flipped; render(); return true; }
    if (flipped && e.key === '1') { grade(false); return true; }
    if (flipped && (e.key === '2' || e.key === 'Enter')) { grade(true); return true; }
  };
  pool.forEach(c => delete c._m);
  render();
}

  if (!S.examRun || S.examRun.exam !== k) {
    if (S.examRun) { main.innerHTML = banners() + `<div class="card">Finish your other exam first.</div>`; return; }
    main.innerHTML = banners() + `<h1>Practice Exam ${k === 'A' ? 1 : 2}</h1><div class="card"><ul><li>${qs.length} questions, ${EXAM_MIN} minutes. That's 45 seconds per question.</li><li><b>No pausing.</b> Once you start, the clock runs even if you close the tab.</li><li>You can skip, flag, and go back. At 0:00 the exam is submitted automatically.</li><li>There's no penalty for guessing on CLEP, so never leave a question blank.</li></ul>
    <p class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> answer · <span class="kbd">Enter</span>/<span class="kbd">→</span> next · <span class="kbd">←</span> back · <span class="kbd">F</span> flag</p>
    <button class="btn" id="go">Start the clock</button> <a href="#/exams" class="btn ghost">Not now</a></div>`;
    $('#go').onclick = () => { S.examRun = {exam:k, order: shuffle(qs.map(q => q.id)), ans:{}, flag:{}, start: Date.now(), cur:0}; save(); viewExam(k); };
    return;
  }
  const R = S.examRun;
  const left = () => EXAM_MIN * 60000 - (Date.now() - R.start);
  if (left() <= 0) return submitExam();
  function fmt(ms){ ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  function render(){
    const q = QMAP[R.order[R.cur]]; const a = R.ans[q.id];
    const answered = Object.keys(R.ans).length;
    main.innerHTML = `<div class="qhead"><b>Practice Exam ${k === 'A' ? 1 : 2}</b><span class="timer" id="tm">${fmt(left())}</span></div>
    <div class="small muted">Question ${R.cur+1} of ${R.order.length} · ${answered} answered</div>
    <div class="card">${stimHTML(q)}<div class="stem">${q.s}</div><div class="opts">${q.o.map((o,j) => `<button class="opt ${a === j ? 'sel' : ''}" data-k="${j}"><span class="k">${LETTERS[j]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><div class="row"><button class="btn ghost sm" id="pv" ${R.cur === 0 ? 'disabled' : ''}>← Back</button><button class="btn ghost sm" id="fl">${R.flag[q.id] ? '★ Flagged' : '☆ Flag'}</button></div>
    <div class="row">${R.cur < R.order.length - 1 ? '<button class="btn sm" id="nx">Next →</button>' : ''}<button class="btn sm ${R.cur < R.order.length - 1 ? 'ghost' : ''}" id="sb">Submit exam</button></div></div></div>
    <details class="card"><summary class="small">Question navigator (flagged = gold border)</summary><div class="navgrid">${R.order.map((id,j) => `<button data-j="${j}" class="${R.ans[id] != null ? 'ans' : ''} ${j === R.cur ? 'cur' : ''} ${R.flag[id] ? 'flag' : ''}">${j+1}</button>`).join('')}</div></details>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
    main.querySelectorAll('.navgrid button').forEach(b => b.onclick = () => go(+b.dataset.j));
    $('#pv').onclick = () => go(R.cur - 1); if ($('#nx')) $('#nx').onclick = () => go(R.cur + 1);
    $('#fl').onclick = () => { R.flag[q.id] = !R.flag[q.id]; save(); render(); };
    $('#sb').onclick = () => { const un = R.order.length - Object.keys(R.ans).length; if (confirm(un ? `${un} question(s) unanswered. Submit anyway?` : 'Submit the exam?')) submitExam(); };
  }
  function pick(j){ R.ans[R.order[R.cur]] = j; save(); render(); }
  function go(j){ if (j < 0 || j >= R.order.length) return; R.cur = j; save(); render(); window.scrollTo(0,0); }
  timerIv = setInterval(() => { const l = left(); const t = $('#tm'); if (t) { t.textContent = fmt(l); t.classList.toggle('low', l < 5 * 60000); } if (l <= 0) { clearInterval(timerIv); timerIv = null; submitExam(true); } }, 1000);
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { pick(+e.key - 1); return true; }
    if (e.key === 'Enter' || e.key === 'ArrowRight') { go(R.cur + 1); return true; }
    if (e.key === 'ArrowLeft') { go(R.cur - 1); return true; }
    if (e.key === 'f' || e.key === 'F') { const id = R.order[R.cur]; R.flag[id] = !R.flag[id]; save(); render(); return true; }
  };
  render();
}
function tally(res){
  const by = (f) => { const o = {}; for (const x of res) { const q = QMAP[x.id]; const key = f(q); o[key] = o[key] || {c:0, n:0}; o[key].n++; if (x.ok) o[key].c++; } return o; };
  return {unit: by(q => q.u), theme: by(q => q.th), period: by(q => UNITS[q.u-1].period)};
}
function submitExam(timeout){
  const R = S.examRun; if (!R) return; if (timerIv) { clearInterval(timerIv); timerIv = null; }
  const res = R.order.map(id => ({id, sel: R.ans[id] != null ? R.ans[id] : null, ok: R.ans[id] === QMAP[id].a}));
  for (const x of res) recordMistake(x.id, x.ok, 'exam');
  const sc = res.filter(x => x.ok).length / res.length;
  const t = tally(res);
  const rec = {date: todayStr(), score: sc, mins: Math.min(EXAM_MIN, Math.round((Date.now() - R.start) / 60000)), ...t};
  const p = S.exams[R.exam] || {best:0, attempts:0, history:[]};
  S.exams[R.exam] = {best: Math.max(p.best, sc), last: sc, attempts: p.attempts + 1, history: (p.history || []).concat([rec]).slice(-5)};
  const k = R.exam; S.examRun = null; save();
  keyHandler = null;
  main.innerHTML = `<h1>Practice Exam ${k === 'A' ? 1 : 2}: results</h1>${timeout ? '<div class="banner">Time ran out, so the exam was submitted automatically.</div>' : ''}
  <div class="card"><div style="font-size:2.2rem;font-weight:700">${pct(sc)} <span class="muted" style="font-size:1rem">${res.filter(x => x.ok).length} / ${res.length} · ${rec.mins} min</span></div>
  <p>${sc >= 0.75 ? '<span class="pill good">Meets the 75% readiness bar</span>' : '<span class="pill bad">Below the 75% readiness bar</span>'} <span class="small muted">CLEP doesn't publish a percent-to-score conversion. The 75% bar is a deliberately safe margin above a typical passing raw score <span class="pill">unverified</span>.</span></p>
  ${breakdownHTML(rec)}<div class="row"><a class="btn" href="#/mistakes">Drill the misses</a><a class="btn ghost" href="#/exams">Back to exams</a></div></div>
  ${reviewList(res.filter(x => !x.ok))}`;
  window.scrollTo(0,0);
}
function breakdownHTML(rec){
  const rows = (obj, name) => Object.entries(obj).sort((a,b) => (isNaN(a[0]) ? 0 : a[0] - b[0])).map(([k, v]) => { const p = v.c / v.n; return `<tr><td>${name(k)}</td><td>${v.c}/${v.n}</td><td style="width:40%"><div class="bar ${p >= 0.75 ? 'good' : ''}"><span style="width:${p*100}%"></span></div></td><td>${pct(p)}</td></tr>`; }).join('');
  return `<div class="tablewrap"><table><thead><tr><th>By unit</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.unit, k => `${k}. ${esc(UNITS[k-1].title)}`)}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>By official theme</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.theme, k => esc(THEMES[k].short) + ` <span class="muted small">(${THEMES[k].percent}% of exam)</span>`)}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>By period</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.period, k => k === 'early' ? '1865–1914' : '1915–present')}</tbody></table></div>`;
}

/* ---------- CHEAT SHEET ---------- */
function viewCheat(){
  main.innerHTML = banners() + `<div class="noprint"><h1>Cheat sheet</h1><p class="muted">One printable page. Print it (it fits one letter page), then redraw it from memory on a blank sheet. <b>Memory mode</b> blurs the answers, and you tap one to check it.</p>
  <div class="row" style="margin-bottom:10px"><button class="btn" onclick="window.print()">Print</button><button class="btn ghost" id="memo">Memory mode: off</button></div></div>
  <div class="printhead"><b>CLEP US History II · one-page review</b></div>
  <div class="card"><div class="cheat" id="cheat">${D.cheat}</div></div>`;
  const ch = $('#cheat');
  $('#memo').onclick = e => { ch.classList.toggle('memo'); e.target.textContent = 'Memory mode: ' + (ch.classList.contains('memo') ? 'on' : 'off'); };
  ch.addEventListener('click', e => { const m = e.target.closest('.m'); if (m && ch.classList.contains('memo')) m.classList.toggle('show'); });
}

/* ---------- STUDY PLAN ---------- */
function viewPlan(){
  const p = S.plan || {hours: 1.5, date: '', start: todayStr()};
  main.innerHTML = banners() + `<h1>Study plan</h1><p class="muted">Enter your daily hours and exam date. The plan puts must-study units first and short flashcard reviews every day. It schedules Practice Exam 1 two days before the exam and Practice Exam 2 the day before. Re-generate it any time; it uses what you've already finished.</p>
  <div class="card noprint"><div class="row"><label class="f">Hours per day<input id="ph" type="number" min="0.5" max="12" step="0.5" value="${esc(p.hours)}"></label>
  <label class="f">Start date<input id="ps" type="date" value="${esc(p.start || todayStr())}"></label>
  <label class="f">Exam date<input id="pd" type="date" value="${esc(p.date)}"></label>
  <button class="btn" id="gen" style="align-self:flex-end">Generate</button><button class="btn ghost" style="align-self:flex-end" onclick="window.print()">Print</button></div></div><div id="planOut"></div>`;
  const gen = () => {
    const hours = Math.max(0.5, Math.min(12, parseFloat($('#ph').value) || 1.5)); const date = $('#pd').value; const start = $('#ps').value || todayStr();
    S.plan = {hours, date, start}; save();
    $('#planOut').innerHTML = date ? planHTML(hours, start, date) : '<p class="muted">Pick an exam date.</p>';
  };
  $('#gen').onclick = gen; if (p.date) gen();
}
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtD(d){ return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}); }
function planHTML(hours, startS, examS){
  const start = parseD(startS), exam = parseD(examS);
  const days = Math.round((exam - start) / DAY);
  if (days < 1) return '<div class="banner">The exam date must be after the start date.</div>';
  const cap = hours * 60;
  const tasks = allTasks().filter(t => !t.done && !['examA','examB','review','mist','cheat'].includes(t.id))
    .map(t => ({label: t.label, min: Math.max(10, Math.round(t.frac ? t.min * (1 - t.frac) : t.min))}));
  const studyDays = Math.max(0, days - 2); // last 2 days before exam reserved for practice exams
  const daily = Math.min(20, Math.round(cap * 0.2)); // flashcard review slot
  const plan = [];
  for (let i = 0; i < studyDays; i++) plan.push({d: new Date(start.getTime() + i * DAY), items: [], used: 0});
  let ti = 0, rem = tasks.length ? tasks[0].min : 0, part = 1;
  for (const day of plan) {
    if (ti > 0 || plan.indexOf(day) > 0) { day.items.push(`Flashcards: due cards (${daily} min)`); day.used += daily; }
    while (ti < tasks.length && day.used < cap - 5) {
      const take = Math.min(rem, cap - day.used);
      const t = tasks[ti];
      day.items.push(`${t.label}${take < rem || part > 1 ? ` (part ${part})` : ''} · ${Math.round(take)} min`);
      day.used += take; rem -= take;
      if (rem <= 0.5) { ti++; part = 1; rem = ti < tasks.length ? tasks[ti].min : 0; } else part++;
    }
    if (ti >= tasks.length && day.used < cap - 15) { day.items.push(`Mistake log drill + cheat-sheet redraw · ${Math.round(cap - day.used)} min`); day.used = cap; }
  }
  const leftover = tasks.slice(ti).reduce((a,t,k) => a + (k === 0 ? rem : t.min), 0);
  const e2 = new Date(exam.getTime() - DAY), e1 = new Date(exam.getTime() - 2 * DAY);
  if (days >= 2) plan.push({d: e1, items: ['<b>Practice Exam 1</b> (90 min, timed) · then review every miss (60 min)', 'Flashcards: missed only']});
  plan.push({d: e2, items: [`<b>Practice Exam ${days >= 2 ? 2 : '1 and 2 (split if you must)'}</b> (90 min, timed) · then review every miss`, 'Redraw the cheat sheet from memory once', 'If either exam is below 75%, consider moving your test date']});
  plan.push({d: exam, items: ['<b>EXAM DAY</b>. 20 min: skim the cheat sheet and run due flashcards. Then go take it. Pace: 45 s per question; guess and flag rather than stall.']});
  const need = (tasks.reduce((a,t) => a + t.min, 0) + studyDays * daily) / Math.max(1, studyDays) / 60;
  return `${leftover > 0 ? `<div class="banner">Not enough time: about ${(leftover/60).toFixed(1)} h of material doesn't fit. You'd need about <b>${need.toFixed(1)} h/day</b>, or a later exam date. The schedule below covers the highest-priority units first.</div>` : ''}
  <div class="card tablewrap plan"><table><thead><tr><th>Day</th><th>Do this</th></tr></thead><tbody>${plan.map((p, k) => `<tr><td><b>${fmtD(p.d)}</b><div class="small muted">Day ${k+1}</div></td><td><ul style="margin:0;padding-left:1.1em">${p.items.map(i => `<li>${i}</li>`).join('') || '<li class="muted">Rest / catch-up</li>'}</ul></td></tr>`).join('')}</tbody></table></div>`;
}

/* ---------- ABOUT / DATA ---------- */
function viewAbout(){
  const M = D.meta; const st = D.stats;
  main.innerHTML = banners() + `<h1>About this guide</h1>
  <div class="card"><h3 style="margin-top:0">Official exam facts</h3>
  <p>Source: <a href="${esc(M.source_url)}" target="_blank" rel="noopener">${esc(M.source_url)}</a> (College Board, CLEP History of the United States II), plus the official <a href="${esc(M.supporting_urls[0])}" target="_blank" rel="noopener">At-a-Glance fact sheet</a>. Retrieved ${esc(M.retrieved)}.</p>
  <ul><li><b>Questions:</b> ${esc(M.format.questions)} <span class="pill good">verified</span></li><li><b>Time:</b> ${M.format.time_limit_minutes} minutes <span class="pill good">verified</span></li>
  <li><b>Scoring:</b> scaled ${esc(M.scoring.scale)}; ACE-recommended passing score ${M.scoring.ace_recommended_passing_score}; ${esc(M.scoring.credit_recommendation)} <span class="pill warn">unverified</span></li>
  <li><b>Practice exam → real score conversion:</b> not published <span class="pill warn">unverified</span>; the 75% readiness bar is a conservative target set by this guide</li></ul>
  <p class="small muted">${esc(M.verification_note)}</p></div>
  <div class="card tablewrap"><h3 style="margin-top:0">Official weights vs. this guide</h3>
  <table><thead><tr><th>Official theme</th><th>Exam</th><th>Bank questions</th><th>Share</th></tr></thead><tbody>${M.thematic_weights.map(t => `<tr><td>${esc(t.name)}</td><td>${t.percent}%</td><td>${st.theme[t.id]}</td><td>${pct(st.theme[t.id]/st.total)}</td></tr>`).join('')}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>Official period</th><th>Exam</th><th>Bank questions</th><th>Share</th></tr></thead><tbody>${M.chronological_weights.map(t => `<tr><td>${esc(t.name)}</td><td>${t.percent}%</td><td>${st.period[t.id]}</td><td>${pct(st.period[t.id]/st.total)}</td></tr>`).join('')}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>Unit</th><th>Weight</th><th>Lesson min</th><th>Questions</th><th>Cards</th></tr></thead><tbody>${UNITS.map(u => `<tr><td>${u.n}. ${esc(u.title)}</td><td>${u.weight}%</td><td>${u.minutes}</td><td>${unitQs(u.n).length} (${pct(unitQs(u.n).length/st.total)})</td><td>${u.cards.length} (${pct(u.cards.length/CARDS.length)})</td></tr>`).join('')}</tbody></table>
  <p class="small muted">${st.total} original questions (${st.diff.e} easy / ${st.diff.m} medium / ${st.diff.h} hard). Pools: ${st.pool.quiz} in unit quizzes, ${st.pool.diag} in the diagnostic, ${st.pool.A} in Practice Exam 1, and ${st.pool.B} in Practice Exam 2. No question appears in more than one pool. Correct answers are spread evenly across A–E.</p></div>
  <div class="card"><h3 style="margin-top:0">Your data</h3><p class="small muted">Progress is saved in this browser only (localStorage). ${storageOK ? '' : '<b>Storage is currently blocked, so export your progress before closing.</b>'}</p>
  <div class="row"><button class="btn" id="exp">Export progress (JSON)</button><label class="btn ghost">Import progress<input type="file" id="imp" accept="application/json,.json" style="display:none"></label><button class="btn ghost" id="rst">Reset everything</button></div><div id="msg" class="small" style="margin-top:8px"></div></div>
  <p class="small muted">The questions are original practice items written for this guide. They are not College Board questions.</p>`;
  $('#exp').onclick = () => { const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `clep-ush2-progress-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o || o.v !== 1) throw new Error('not a progress file'); S = sanitize(o); save(); applyTheme(); $('#msg').textContent = 'Imported.'; } catch(err){ $('#msg').textContent = 'Could not import: ' + err.message; } }; r.readAsText(f); };
  $('#rst').onclick = () => { if (confirm('Erase all progress? This cannot be undone. (Export first if unsure.)')) { S = blankState(); save(); applyTheme(); route(); } };
}

route();
</script>
