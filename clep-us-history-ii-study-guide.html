/* ---------- STUDY PLAN ---------- */
function viewPlan(){
  const p = S.plan || {hours: 1.5, date: '', start: todayStr()};
  main.innerHTML = banners() + `<h1>Study plan</h1><p class="muted">Enter your daily hours and exam date. The plan puts must-study units first and short flashcard reviews every day. It schedules Practice Exam 1 two days before the exam and Practice Exam 2 the day before. Re-generate it any time; it uses what you've already finished.</p>
  <div class="card noprint"><div class="row"><label class="f">Hours per day<input id="ph" type="number" min="0.5" max="12" step="0.5" value="${esc(p.hours)}"></label>
  <label class="f">Start date<input id="ps" type="date" value="${esc(p.start || todayStr())}"></label>
  <label class="f">Exam date<input id="pd" type="date" value="${esc(p.date)}"></label>
  <button class="btn" id="gen" style="align-self:flex-end">Generate</button><button class="btn ghost" style="align-self:flex-end" onclick="window.print()">Print</button></div></div><div id="planOut"></div>`;
  const gen = () => {
    const hours = Math.max(0.5, Math.min(12, parseFloat($('#ph').value) || 1.5)); const date = $('#pd').value; const start = $('#ps').value || todayStr();
    S.plan = {hours, date, start}; save();
    $('#planOut').innerHTML = date ? planHTML(hours, start, date) : '<p class="muted">Pick an exam date.</p>';
  };
  $('#gen').onclick = gen; if (p.date) gen();
}
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtD(d){ return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}); }
function planHTML(hours, startS, examS){
  const start = parseD(startS), exam = parseD(examS);
  const days = Math.round((exam - start) / DAY);
  if (days < 1) return '<div class="banner">The exam date must be after the start date.</div>';
  const cap = hours * 60;
  const tasks = allTasks().filter(t => !t.done && !['examA','examB','review','mist','cheat'].includes(t.id))
    .map(t => ({label: t.label, min: Math.max(10, Math.round(t.frac ? t.min * (1 - t.frac) : t.min))}));
  const studyDays = Math.max(0, days - 2); // last 2 days before exam reserved for practice exams
  const daily = Math.min(20, Math.round(cap * 0.2)); // flashcard review slot
  const plan = [];
  for (let i = 0; i < studyDays; i++) plan.push({d: new Date(start.getTime() + i * DAY), items: [], used: 0});
  let ti = 0, rem = tasks.length ? tasks[0].min : 0, part = 1;
  for (const day of plan) {
    if (ti > 0 || plan.indexOf(day) > 0) { day.items.push(`Flashcards: due cards (${daily} min)`); day.used += daily; }
    while (ti < tasks.length && day.used < cap - 5) {
      const take = Math.min(rem, cap - day.used);
      const t = tasks[ti];
      day.items.push(`${t.label}${take < rem || part > 1 ? ` (part ${part})` : ''} · ${Math.round(take)} min`);
      day.used += take; rem -= take;
      if (rem <= 0.5) { ti++; part = 1; rem = ti < tasks.length ? tasks[ti].min : 0; } else part++;
    }
    if (ti >= tasks.length && day.used < cap - 15) { day.items.push(`Mistake log drill + cheat-sheet redraw · ${Math.round(cap - day.used)} min`); day.used = cap; }
  }
  const leftover = tasks.slice(ti).reduce((a,t,k) => a + (k === 0 ? rem : t.min), 0);
  const e2 = new Date(exam.getTime() - DAY), e1 = new Date(exam.getTime() - 2 * DAY);
  if (days >= 2) plan.push({d: e1, items: ['<b>Practice Exam 1</b> (90 min, timed) · then review every miss (60 min)', 'Flashcards: missed only']});
  plan.push({d: e2, items: [`<b>Practice Exam ${days >= 2 ? 2 : '1 and 2 (split if you must)'}</b> (90 min, timed) · then review every miss`, 'Redraw the cheat sheet from memory once', 'If either exam is below 75%, consider moving your test date']});
  plan.push({d: exam, items: ['<b>EXAM DAY</b>. 20 min: skim the cheat sheet and run due flashcards. Then go take it. Pace: 45 s per question; guess and flag rather than stall.']});
  const need = (tasks.reduce((a,t) => a + t.min, 0) + studyDays * daily) / Math.max(1, studyDays) / 60;
  return `${leftover > 0 ? `<div class="banner">Not enough time: about ${(leftover/60).toFixed(1)} h of material doesn't fit. You'd need about <b>${need.toFixed(1)} h/day</b>, or a later exam date. The schedule below covers the highest-priority units first.</div>` : ''}
  <div class="card tablewrap plan"><table><thead><tr><th>Day</th><th>Do this</th></tr></thead><tbody>${plan.map((p, k) => `<tr><td><b>${fmtD(p.d)}</b><div class="small muted">Day ${k+1}</div></td><td><ul style="margin:0;padding-left:1.1em">${p.items.map(i => `<li>${i}</li>`).join('') || '<li class="muted">Rest / catch-up</li>'}</ul></td></tr>`).join('')}</tbody></table></div>`;
}

  <p class="small muted">${st.total} original questions (${st.diff.e} easy / ${st.diff.m} medium / ${st.diff.h} hard). Pools: ${st.pool.quiz} in unit quizzes, ${st.pool.diag} in the diagnostic, ${st.pool.A} in Practice Exam 1, and ${st.pool.B} in Practice Exam 2. No question appears in more than one pool. Correct answers are spread evenly across A–E.</p></div>
  <div class="card"><h3 style="margin-top:0">Your data</h3><p class="small muted">Progress is saved in this browser only (localStorage). ${storageOK ? '' : '<b>Storage is currently blocked, so export your progress before closing.</b>'}</p>
  <div class="row"><button class="btn" id="exp">Export progress (JSON)</button><label class="btn ghost">Import progress<input type="file" id="imp" accept="application/json,.json" style="display:none"></label><button class="btn ghost" id="rst">Reset everything</button></div><div id="msg" class="small" style="margin-top:8px"></div></div>
  <p class="small muted">The questions are original practice items written for this guide. They are not College Board questions.</p>`;
  $('#exp').onclick = () => { const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `clep-ush2-progress-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o || o.v !== 1) throw new Error('not a progress file'); S = sanitize(o); save(); applyTheme(); $('#msg').textContent = 'Imported.'; } catch(err){ $('#msg').textContent = 'Could not import: ' + err.message; } }; r.readAsText(f); };
  $('#rst').onclick = () => { if (confirm('Erase all progress? This cannot be undone. (Export first if unsure.)')) { S = blankState(); save(); applyTheme(); route(); } };
}
