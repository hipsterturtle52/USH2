vel attacked competitive capitalism.","That is Sinclair's <em>The Jungle<\/em> (1906).","That is Twain's <em>Adventures of Huckleberry Finn<\/em>."],"a":1},{"id":"u2q41","u":2,"th":"cul","d":"m","pool":"B","s":"Frederick Jackson Turner's \"frontier thesis\" (1893) argued that","st":"","o":["the frontier had been settled mainly by European aristocrats","Native Americans had been treated justly on the frontier","the United States should avoid overseas expansion","cities, not the frontier, were the true source of American values","the frontier experience had shaped American democracy and individualism, and its closing marked the end of an era"],"e":["Turner emphasized ordinary settlers and democratic leveling.","Turner largely ignored Native perspectives. He did not argue this.","Some read Turner as implying that new frontiers abroad were needed. He did not argue for avoiding expansion.","Turner stressed the frontier, not cities.","Turner's essay, prompted by the 1890 census, was among the most influential interpretations of American history."],"a":4},{"id":"u2q42","u":2,"th":"cul","d":"m","pool":"quiz","s":"Stephen Crane's <em>Maggie: A Girl of the Streets<\/em> and Theodore Dreiser's <em>Sister Carrie<\/em> are examples of literary","st":"","o":["naturalism, which portrayed characters shaped by harsh social and economic forces","romanticism, which celebrated nature and the individual spirit","the Harlem Renaissance","modernism of the Lost Generation","Transcendentalism, which sought spiritual truth in nature"],"e":["Naturalist writers showed people trapped by environment and heredity, often in urban poverty.","Romanticism (Emerson, Thoreau) was the pre–Civil War style.","The Harlem Renaissance was a 1920s African American cultural movement.","The Lost Generation wrote in the 1920s.","Transcendentalism was an 1830s–1850s movement."],"a":0},{"id":"u2q43","u":2,"th":"cul","d":"m","pool":"quiz","s":"The Social Gospel movement of the late nineteenth century urged","st":"","o":["Christians to withdraw from politics and focus on the afterlife","businesses to follow Social Darwinist principles","the government to establish an official national church","missionaries to convert Native Americans by force","churches and Christians to address urban poverty, labor exploitation, and other social problems"],"e":["The Social Gospel urged social engagement.","The Social Gospel criticized Social Darwinism.","The movement did not seek an established church.","The Social Gospel focused on urban industrial problems.","Ministers like Walter Rauschenbusch argued that Christianity required reforming society, not just saving individual souls."],"a":4},{"id":"u2q44","u":2,"th":"cul","d":"h","pool":"A","s":"Helen Hunt Jackson's <em>A Century of Dishonor<\/em> (1881) helped shape federal policy by","st":"","o":["convincing Americans to annex Hawaii","leading directly to restoration of all treaty lands","building public sympathy for Native Americans, which reformers channeled into the assimilationist Dawes Act","persuading Congress to restrict Chinese immigration","exposing tenement conditions and leading to housing codes"],"e":["The book concerned Native Americans.","No lands were restored. Allotment cost Native nations more land.","Jackson exposed broken treaties. Reformers then pursued allotment and assimilation, which proved disastrous for Native landholding.","Chinese exclusion had separate origins.","That was Riis's work."],"a":2},{"id":"u2q45","u":2,"th":"cul","d":"h","pool":"quiz","s":"Thorstein Veblen's phrase \"conspicuous consumption\" refers to","st":"","o":["government purchases during wartime","workers' spending on necessities such as food and rent","farmers' purchases through mail-order catalogs","the buying of goods on credit in the 1920s","the lavish display of wealth by the rich to signal social status"],"e":["The term concerns private status display.","Veblen's term described waste by the wealthy, not workers' necessities.","Catalog shopping was a practical rural convenience, not Veblen's concept.","Installment buying spread in the 1920s. Veblen's phrase came earlier and meant something different.","Veblen's <em>The Theory of the Leisure Class<\/em> (1899) satirized the extravagant lifestyles of the Gilded Age elite."],"a":4},{"id":"u2q46","u":2,"th":"dip","d":"h","pool":"quiz","s":"The Treaty of Washington (1871) between the United States and Great Britain is significant because it","st":"","o":["set the border between Canada and Oregon at the 49th parallel","ended the War of 1812","established an alliance against Spain","submitted the Alabama claims, over damage done by British-built Confederate raiders, to international arbitration","transferred Alaska to the United States"],"e":["That was the Oregon Treaty of 1846.","That was the Treaty of Ghent (1814).","No such alliance existed. The U.S. fought Spain alone in 1898.","The arbitration awarded the U.S. $15.5 million and eased Anglo-American tensions.","Alaska was bought from Russia in 1867."],"a":3},{"id":"u2q47","u":2,"th":"dip","d":"h","pool":"quiz","s":"Secretary of State James G. Blaine organized the first Pan-American Conference in 1889 primarily to","st":"","o":["negotiate the purchase of the Panama Canal Zone","create a military alliance against Germany","end the Spanish-American War","annex Cuba and Puerto Rico","expand U.S. trade and influence in Latin America"],"e":["The Canal Zone was acquired in 1903–1904.","No such alliance came out of the conference.","That war took place in 1898.","Puerto Rico was acquired in 1898, and Cuba was never annexed.","The conference reflected growing U.S. interest in hemispheric markets and leadership, a prelude to 1890s expansionism."],"a":4},{"id":"u3q01","u":3,"th":"pol","d":"e","pool":"A","s":"Which of the following was a demand of the Populist Party's Omaha Platform of 1892?","st":"","o":["Repeal of the Fifteenth Amendment","Private ownership of the telegraph system","Higher protective tariffs on manufactured goods","Return to the gold standard","Free and unlimited coinage of silver"],"e":["The Platform did not call for repeal of any amendment.","Populists demanded government ownership of railroads and telegraphs.","Populists opposed high tariffs, which raised the prices farmers paid.","Populists opposed the gold standard. Its defenders were bankers and Republicans.","Populists wanted to inflate the currency to raise crop prices and ease farm debts."],"a":4},{"id":"u3q02","u":3,"th":"pol","d":"e","pool":"diag","s":"William Jennings Bryan's \"Cross of Gold\" speech of 1896 attacked","st":"","o":["the gold standard, which Bryan said crushed debtors and farmers","prohibition of alcohol","the creation of the Federal Reserve","the Pullman Strike's labor leaders","the annexation of the Philippines"],"e":["Bryan argued that tying the currency to gold kept money scarce and prices low, hurting producers.","Bryan later backed prohibition, but the Cross of Gold speech concerned currency.","The Federal Reserve was created in 1913.","The speech was not about Pullman.","Bryan did oppose imperialism, but in 1900. The 1896 speech was about money."],"a":0},{"id":"u3q03","u":3,"th":"pol","d":"m","pool":"quiz","s":"The presidential election of 1896 is considered a turning point because it","st":"","o":["was decided by the House of Representatives","began a long period of Republican dominance and effectively ended the Populist Party as an independent force","was the first election in which women voted nationally","brought the Populists to power in Congress","established free silver as national policy"],"e":["That happened in 1800 and 1824, not 1896.","McKinley's victory realigned politics. Fusion with the Democrats absorbed the Populists, and Republicans controlled the White House for most years until 1932.","Women voted nationally first in 1920.","The Populists faded after 1896.","McKinley's victory led to the Gold Standard Act (1900)."],"a":1},{"id":"u3q04","u":3,"th":"pol","d":"m","pool":"quiz","s":"The Seventeenth Amendment (1913) changed the federal government by","st":"","o":["granting women the right to vote","prohibiting the manufacture and sale of alcohol","requiring the direct popular election of U.S. senators","limiting presidents to two terms","authorizing a federal income tax"],"e":["That was the Nineteenth Amendment.","That was the Eighteenth Amendment.","Before 1913, state legislatures chose senators, a system Progressives and Populists saw as corrupt.","That was the Twenty-second Amendment (1951).","That was the Sixteenth Amendment."],"a":2},{"id":"u3q05","u":3,"th":"pol","d":"m","pool":"A","s":"The initiative, referendum, and recall were Progressive reforms designed to","st":"","o":["regulate interstate railroads","increase the president's power over Congress","give voters more direct control over legislation and officeholders","restrict voting to property owners","strengthen the power of political machines"],"e":["Railroad regulation came through the ICC and the Hepburn Act.","These were mainly state and local reforms.","They let citizens propose laws, vote on them directly, and remove officials, bypassing machine-controlled legislatures.","Progressives sought broader (if not universal) popular control.","They were aimed against machines."],"a":2},{"id":"u3q06","u":3,"th":"pol","d":"m","pool":"A","s":"Theodore Roosevelt earned the nickname \"trust buster\" largely because his administration","st":"","o":["broke up Standard Oil in 1911","abolished all large corporations","created the Federal Reserve System","successfully prosecuted the Northern Securities Company under the Sherman Antitrust Act","passed the Clayton Antitrust Act"],"e":["The Standard Oil breakup came under Taft.","Roosevelt distinguished \"good\" trusts from \"bad\" ones and regulated rather than abolished most.","Wilson signed the Federal Reserve Act in 1913.","The 1904 Supreme Court decision dissolving the railroad holding company revived antitrust enforcement.","Clayton came in 1914 under Wilson."],"a":3},{"id":"u3q07","u":3,"th":"pol","d":"m","pool":"B","s":"In the anthracite coal strike of 1902, President Theodore Roosevelt broke with earlier practice by","st":"","o":["signing the Wagner Act","pressuring the mine owners to accept arbitration rather than sending troops to crush the strike","outlawing unions in the coal industry","sending troops to protect strikebreakers","nationalizing the coal mines permanently"],"e":["The Wagner Act came in 1935.","It was the first time a president intervened as a neutral broker rather than on management's side.","He did not outlaw unions.","Earlier presidents (Hayes 1877, Cleveland 1894) used troops. TR did not.","Roosevelt threatened a takeover but did not nationalize the mines."],"a":1},{"id":"u3q08","u":3,"th":"pol","d":"h","pool":"B","s":"In the election of 1912, Theodore Roosevelt's \"New Nationalism\" differed from Woodrow Wilson's \"New Freedom\" in that Roosevelt","st":"","o":["ran as the Republican nominee, while Wilson ran as a Socialist","favored laissez-faire policies, while Wilson favored regulation","supported the gold standard, while Wilson supported free silver","accepted big business as inevitable but called for strong federal regulation of it, while Wilson sought to break up trusts and restore competition","opposed women's suffrage, while Wilson endorsed it in 1912"],"e":["TR ran as a Progressive (\"Bull Moose\"). Taft was the Republican, Wilson the Democrat, and Debs the Socialist.","Both favored government action. Roosevelt favored more federal power.","The money question was settled by 1900 and was not the 1912 issue.","This is the core contrast. Ironically, Wilson's presidency ended up creating powerful regulatory bodies (the FTC, the Federal Reserve).","Roosevelt's Progressive Party endorsed woman suffrage in 1912. Wilson came around only in 1918."],"a":3},{"id":"u3q09","u":3,"th":"pol","d":"m","pool":"A","s":"The Federal Reserve Act of 1913 was intended to","st":"","o":["create a central banking system that could manage the nation's money supply and credit","regulate the stock market","establish the gold standard","insure individual bank deposits","break up large corporations"],"e":["Twelve regional banks under a Federal Reserve Board could adjust currency and lend to banks, addressing recurring panics.","The SEC was created in 1934.","The Gold Standard Act was passed in 1900.","Deposit insurance (FDIC) came in 1933.","Antitrust was handled by the Clayton Act and the FTC."],"a":0},{"id":"u3q10","u":3,"th":"pol","d":"m","pool":"A","s":"Samuel Gompers called the Clayton Antitrust Act of 1914 labor's \"Magna Carta\" because it","st":"","o":["established the minimum wage","ended child labor nationwide","guaranteed the right to collective bargaining","created the Department of Labor","exempted labor unions from prosecution as illegal combinations under antitrust law"],"e":["The federal minimum wage came in 1938.","Federal child labor bans were struck down until 1938/1941.","That came with the Wagner Act (1935).","The Department of Labor was created in 1913 by separate legislation.","Unions had been hit with injunctions under the Sherman Act. Clayton declared that labor is not a commodity. (Courts later weakened this protection.)"],"a":4},{"id":"u3q11","u":3,"th":"pol","d":"h","pool":"A","s":"Which of the following was a constitutional amendment ratified during the Progressive Era?","st":"","o":["The Sixteenth Amendment, authorizing a federal income tax (1913)","The Twenty-first Amendment, repealing Prohibition","The Twenty-fourth Amendment, banning poll taxes in federal elections","The Fifteenth Amendment, protecting voting rights regardless of race","The Twenty-second Amendment, limiting presidential terms"],"e":["The Sixteenth, Seventeenth, Eighteenth, and Nineteenth Amendments (1913–1920) are all products of Progressive reform.","The Twenty-first was ratified in 1933.","The Twenty-fourth was ratified in 1964.","The Fifteenth Amendment dates from Reconstruction (1870).","The Twenty-second was ratified in 1951."],"a":0},{"id":"u3q12","u":3,"th":"pol","d":"m","pool":"A","s":"Robert La Follette's \"Wisconsin Idea\" is best described as","st":"","o":["a Populist demand for free silver","a program of state-level Progressive reform that used university experts to draft and administer policy","a scheme to build canals linking the Great Lakes","a plan for Wisconsin to secede from the Union","an agricultural cooperative for dairy farmers"],"e":["Free silver was a separate monetary issue.","La Follette made Wisconsin a \"laboratory of democracy\" with direct primaries, railroad regulation, and expert commissions.","The Wisconsin Idea did not concern canals.","No such plan existed.","The Wisconsin Idea was about government reform."],"a":1},{"id":"u3q13","u":3,"th":"pol","d":"e","pool":"quiz","s":"The muckraker Upton Sinclair's novel <em>The Jungle<\/em> (1906) led most directly to the passage of","st":"","o":["the Seventeenth Amendment","the Sherman Antitrust Act","the Meat Inspection Act and the Pure Food and Drug Act","the Clayton Antitrust Act","the Social Security Act"],"e":["Direct election of senators was not Sinclair's subject.","The Sherman Act came in 1890.","Public disgust at the meatpacking descriptions pushed Congress to act in 1906.","Clayton was passed in 1914.","Social Security came in 1935."],"a":2},{"id":"u3q14","u":3,"th":"pol","d":"h","pool":"B","s":"In Lochner v. New York (1905), the Supreme Court","st":"","o":["broke up the Northern Securities Company","upheld a law limiting women's working hours","upheld the federal income tax","struck down a state law limiting bakers' working hours as a violation of \"liberty of contract\"","ruled that separate but equal facilities were constitutional"],"e":["That was Northern Securities Co. v. U.S. (1904).","That was Muller v. Oregon (1908).","The income tax came by constitutional amendment in 1913.","Lochner represents the Court's hostility to economic regulation, an era that lasted until 1937.","That was Plessy (1896)."],"a":3},{"id":"u3q15","u":3,"th":"soc","d":"e","pool":"B","s":"Lincoln Steffens, Ida Tarbell, and Upton Sinclair are best described as","st":"","o":["Supreme Court justices of the Progressive Era","leaders of the Populist Party","muckrakers who exposed corruption and abuses in American society","leaders of the Anti-Imperialist League","members of the Lost Generation of the 1920s"],"e":["None served on the Court.","They were journalists, not Populist politicians.","Steffens (city politics), Tarbell (Standard Oil), and Sinclair (meatpacking) shaped Progressive opinion.","Twain and Carnegie are the best-known anti-imperialists.","The Lost Generation came later (Hemingway, Fitzgerald)."],"a":2},{"id":"u3q16","u":3,"th":"soc","d":"e","pool":"A","s":"The Triangle Shirtwaist Factory fire of 1911 led to","st":"","o":["the end of immigration from southern Europe","new state laws improving workplace safety and labor conditions in New York","the Pullman Strike","a Supreme Court decision banning child labor","the founding of the American Federation of Labor"],"e":["Immigration restriction came in the 1920s.","The deaths of 146 workers, many trapped behind locked doors, prompted New York's factory investigating commission and a wave of safety laws.","The Pullman Strike took place in 1894.","The Court struck down federal child labor laws in 1918 (Hammer v. Dagenhart).","The AFL was founded in 1886."],"a":1},{"id":"u3q17","u":3,"th":"soc","d":"m","pool":"A","s":"The Supreme Court's decision in Muller v. Oregon (1908) is notable because it","st":"","o":["granted women the right to vote in Oregon","outlawed child labor in factories","struck down all state labor laws as unconstitutional","upheld a law limiting women's working hours, relying on sociological evidence presented by Louis Brandeis","established a federal minimum wage for women"],"e":["Suffrage was not the issue.","Muller concerned women's hours.","Muller upheld a labor law.","The \"Brandeis brief\" used data on health effects. It was a Progressive success, though it rested on ideas about women's physical weakness.","There was no federal minimum wage until 1938."],"a":3},{"id":"u3q18","u":3,"th":"soc","d":"m","pool":"diag","s":"The NAACP, founded in 1909, differed from Booker T. Washington's approach by","st":"","o":["urging African Americans to accept segregation temporarily","promoting emigration to Africa","refusing all white members","using lawsuits, publicity, and political pressure to demand equal rights","focusing exclusively on vocational education"],"e":["That was Washington's Atlanta Compromise strategy.","That was Marcus Garvey's later movement.","The NAACP was interracial from its founding.","The NAACP (Du Bois, Ida B. Wells, white progressives) challenged discrimination directly, especially in the courts.","Vocational emphasis was Washington's program."],"a":3},{"id":"u3q19","u":3,"th":"soc","d":"m","pool":"B","s":"Which statement best describes the Progressive Era's record on race?","st":"","o":["Most white Progressives did little to challenge segregation, and Wilson's administration segregated federal offices.","Progressives successfully abolished poll taxes.","The Seventeenth Amendment restored Black voting rights in the South.","Progressives passed federal laws ending segregation in the South.","Progressive presidents ended lynching through federal legislation."],"e":["Disfranchisement and Jim Crow expanded during the era, which is why Black activists organized the Niagara Movement and the NAACP.","The poll tax in federal elections was abolished in 1964.","The Seventeenth Amendment concerned senators' election, not race.","No such federal laws passed until the 1960s.","Federal anti-lynching bills failed repeatedly."],"a":0},{"id":"u3q20","u":3,"th":"soc","d":"h","pool":"quiz","s":"The Industrial Workers of the World (IWW), founded in 1905, differed from the American Federation of Labor in that the IWW","st":"","o":["rejected strikes as a tactic","was closely allied with large employers","sought to organize all workers, including the unskilled, into \"one big union\" with radical goals","became the largest union in the country by 1920","organized only skilled craftsmen"],"e":["The IWW used strikes heavily (e.g., Lawrence, 1912).","The IWW was militantly anti-capitalist.","The \"Wobblies\" (Big Bill Haywood) rejected the AFL's craft focus and aimed to replace capitalism.","Wartime repression crushed the IWW. The AFL remained much larger.","That was the AFL's approach."],"a":2},{"id":"u3q21","u":3,"th":"soc","d":"m","pool":"quiz","s":"Coxey's Army of 1894 consisted of","st":"","o":["veterans demanding early payment of a bonus","unemployed workers who marched on Washington to demand federal jobs programs during the depression of the 1890s","Rough Riders who fought in Cuba","federal troops sent to break the Pullman Strike","farmers who founded the Grange"],"e":["That was the Bonus Army of 1932.","Jacob Coxey led the march to call for public works. Leaders were arrested for walking on the Capitol lawn.","The Rough Riders fought in 1898.","Coxey's followers were protesters, not soldiers.","The Grange was founded in 1867."],"a":1},{"id":"u3q22","u":3,"th":"soc","d":"m","pool":"A","s":"Progressive-Era reformers such as Florence Kelley and the National Child Labor Committee worked primarily to","st":"","o":["restrict women's right to vote","expand the crop-lien system","promote the spoils system in government","end child labor and improve conditions for working women and children","abolish public schools"],"e":["Most social-justice Progressives supported suffrage.","The crop-lien system was a southern farm credit problem, not their goal.","Progressives opposed the spoils system.","Reformers won many state child-labor laws, and Lewis Hine's photographs supported the campaign.","Progressives expanded public schooling."],"a":3},{"id":"u3q23","u":3,"th":"soc","d":"h","pool":"diag","s":"Which statement best characterizes the typical Progressive reformer?","st":"","o":["A wealthy industrialist opposed to all regulation","An urban, middle-class, educated professional who believed experts and government could fix social problems","A southern sharecropper seeking free silver","A radical seeking to overthrow capitalism","A rural evangelical opposing public schools"],"e":["Most industrialists resisted Progressive regulation.","Progressives drew heavily from the new professional middle class: lawyers, journalists, teachers, and social workers.","That profile fits the Populist base better.","That describes the IWW or revolutionary socialists, not mainstream Progressives.","Progressives championed public education."],"a":1},{"id":"u3q24","u":3,"th":"eco","d":"e","pool":"A","s":"The main economic grievance behind the farmers' protest movements of the 1880s and 1890s was","st":"","o":["falling crop prices combined with high debts and high railroad rates","the high wages paid to farm laborers","the federal government's heavy taxation of farmland","a shortage of available land in the West","rapidly rising crop prices that hurt urban consumers"],"e":["Deflation made debts harder to pay, while railroads and middlemen took a large share of farm income.","Farm wages were not the central grievance.","There was no federal land tax. Farmers wanted an income tax instead.","Land was abundant. Prices and credit were the problem.","Prices were falling, not rising."],"a":0},{"id":"u3q25","u":3,"th":"eco","d":"m","pool":"B","s":"Farmers supported \"free silver\" in the 1890s mainly because they believed it would","st":"","o":["increase the money supply, raise crop prices, and make debts easier to repay","strengthen the gold standard","reduce the national debt","encourage foreign investment in railroads","lower the prices of their crops to boost exports"],"e":["Inflation would help debtors. Creditors and bankers opposed it for the same reason.","Free silver would effectively replace strict gold backing.","The aim was easing private farm debt, not the national debt.","Free silver was expected to discourage foreign investors, which is one reason bankers opposed it.","Farmers wanted higher prices."],"a":0},{"id":"u3q26","u":3,"th":"eco","d":"m","pool":"B","s":"The Panic of 1893 had which of the following effects?","st":"","o":["It triggered a severe depression with mass unemployment that intensified the debate over currency","It ended the Populist movement immediately","It led to the immediate creation of the Federal Reserve","It caused the Spanish-American War","It brought a period of rapid inflation"],"e":["Bank failures and unemployment fueled Coxey's Army, the Pullman Strike, and the 1896 silver campaign.","The depression actually strengthened the silver crusade through 1896.","The Federal Reserve came twenty years later, after the Panic of 1907.","The war's causes were the Cuban revolt, the Maine, and the yellow press.","The 1890s were deflationary."],"a":0},{"id":"u3q27","u":3,"th":"eco","d":"h","pool":"quiz","s":"Taft's \"Dollar Diplomacy\" in Latin America and Asia aimed to","st":"","o":["create a common currency for the Western Hemisphere","pay reparations to Colombia for the Panama Canal","withdraw American businesses from Latin America","abandon the Monroe Doctrine","expand U.S. influence by encouraging and protecting American investment abroad"],"e":["No such currency was proposed.","A $25 million payment came under Wilson's treaty, ratified in 1921, not Taft's policy.","The policy encouraged business involvement.","Dollar Diplomacy built on U.S. regional dominance.","Taft hoped loans and investment would bring stability and influence, though Marines still landed in Nicaragua."],"a":4},{"id":"u3q28","u":3,"th":"cul","d":"e","pool":"B","s":"In the 1890s, newspaper publishers William Randolph Hearst and Joseph Pulitzer contributed to war with Spain by","st":"","o":["negotiating the Treaty of Paris","opposing any U.S. involvement in Cuba","revealing the Zimmermann Telegram","writing the Teller Amendment","printing sensational \"yellow journalism\" about Spanish atrocities in Cuba"],"e":["Diplomats negotiated the treaty.","Their papers pushed for intervention.","The Zimmermann Telegram came in 1917, during WWI.","Senator Henry Teller authored the amendment.","Exaggerated stories stirred public demand for war, especially after the Maine exploded."],"a":4},{"id":"u3q29","u":3,"th":"cul","d":"m","pool":"quiz","s":"Alfred Thayer Mahan's <em>The Influence of Sea Power upon History<\/em> (1890) argued that","st":"","o":["national greatness depended on a powerful navy supported by overseas bases and colonies","colonies were immoral and should be abandoned","the United States should disband its navy to save money","the frontier shaped American democracy","railroads were more important than ships for national defense"],"e":["Mahan's ideas influenced Theodore Roosevelt and the push for a modern navy, Hawaii, and an isthmian canal.","That was the anti-imperialists' view.","Mahan argued the opposite.","That was Turner's thesis.","Mahan emphasized sea power."],"a":0},{"id":"u3q30","u":3,"th":"cul","d":"m","pool":"quiz","s":"Opponents of annexing the Philippines, including members of the Anti-Imperialist League such as Mark Twain, argued that","st":"","o":["ruling colonies without the consent of their people violated American principles of self-government","the navy needed more coaling stations in Asia","the United States should seize Cuba as well","Spain should keep the Philippines","the Philippines should be annexed as a state immediately"],"e":["Anti-imperialists invoked the Declaration of Independence. Some also used racist arguments against incorporating nonwhite peoples.","That was an imperialist argument.","The Teller Amendment had already ruled out annexing Cuba, and anti-imperialists opposed new colonies.","They favored Philippine independence, not Spanish rule.","Anti-imperialists opposed annexation."],"a":0},{"id":"u3q31","u":3,"th":"cul","d":"m","pool":"quiz","s":"The philosopher John Dewey is best known for promoting","st":"","o":["Social Darwinism and laissez-faire economics","progressive education emphasizing learning by doing and preparation for democratic citizenship","the Gospel of Wealth","the theory of conspicuous consumption","the frontier thesis"],"e":["Dewey rejected Social Darwinism.","Dewey's pragmatism shaped schools that stressed experience, problem-solving, and social participation.","That was Carnegie.","That was Veblen.","That was Turner."],"a":1},{"id":"u3q32","u":3,"th":"cul","d":"h","pool":"B","s":"Pragmatism, as developed by William James and John Dewey, held that","st":"","o":["art should depict only idealized beauty","society should be governed by unchanging natural laws of competition","ideas should be judged by their practical consequences rather than by fixed absolute truths","religion is the only source of truth","government should never intervene in the economy"],"e":["Pragmatism is a philosophy of knowledge, not an artistic doctrine.","That is closer to Social Darwinism.","This flexible, experimental outlook suited Progressive reformers who wanted to test solutions to social problems.","Pragmatism tested beliefs by results, not by authority alone.","Pragmatism supported experimentation, including government action."],"a":2},{"id":"u3q33","u":3,"th":"cul","d":"e","pool":"B","s":"Theodore Roosevelt's conservation policy, carried out with Gifford Pinchot, emphasized","st":"","o":["opening Alaska to unrestricted oil drilling","ending federal involvement in irrigation","preserving all wilderness completely untouched by human use","selling all federal lands to private developers","scientific management and \"wise use\" of natural resources, along with setting aside national forests and parks"],"e":["That was not TR's policy.","The Newlands Act (1902) expanded federal irrigation projects.","That was John Muir's preservationist view. Pinchot favored managed use.","TR expanded public lands.","TR added millions of acres to national forests and created monuments and wildlife refuges."],"a":4},{"id":"u3q34","u":3,"th":"cul","d":"h","pool":"A","s":"The 1913 Armory Show in New York City was significant because it","st":"","o":["featured the first motion pictures shown in the United States","displayed new military weapons before World War I","introduced many Americans to European modernist art such as Cubism","marked the beginning of the Harlem Renaissance","celebrated the end of the Spanish-American War"],"e":["Motion pictures had been shown since the 1890s.","The show displayed art, not weapons.","Works by Picasso, Matisse, and Duchamp shocked viewers and helped launch modern art in America.","The Harlem Renaissance flourished in the 1920s.","The Armory Show was an art exhibition, not a war celebration."],"a":2},{"id":"u3q35","u":3,"th":"dip","d":"e","pool":"quiz","s":"As a result of the Spanish-American War, the United States acquired","st":"","o":["Hawaii and Samoa","Puerto Rico, Guam, and the Philippines","Cuba as a state of the Union","the Panama Canal Zone","Alaska and the Aleutian Islands"],"e":["Hawaii was annexed separately in 1898, and part of Samoa in 1899, but not from Spain.","The Treaty of Paris (1898) transferred these from Spain. Cuba became nominally independent.","The Teller Amendment barred annexing Cuba.","The Canal Zone came from Panama in 1903–1904.","Alaska was bought from Russia in 1867."],"a":1},{"id":"u3q36","u":3,"th":"dip","d":"m","pool":"quiz","s":"The Platt Amendment (1901) made Cuba a U.S. protectorate by","st":"","o":["allowing the United States to intervene in Cuban affairs and to lease a naval base at Guantánamo Bay","giving Cuba control of the Panama Canal","promising never to interfere in Cuba","making Cuba a U.S. state","requiring Cuba to adopt English as its official language"],"e":["Cuba had to add these terms to its constitution, limiting its sovereignty until 1934.","Cuba had no role in the canal.","That pledge is closer to the Teller Amendment, which the Platt Amendment effectively undercut.","Cuba was never annexed.","No such requirement existed."],"a":0},{"id":"u3q37","u":3,"th":"dip","d":"m","pool":"B","s":"John Hay's Open Door Notes (1899–1900) called for","st":"","o":["an end to Japanese immigration to the U.S.","closing Chinese ports to European trade","equal trading rights for all nations in China and respect for China's territorial integrity","the United States to annex Chinese territory","U.S. control of the Panama Canal"],"e":["That was addressed by the Gentlemen's Agreement (1907).","The notes called for open, equal access.","The U.S., with no sphere of its own, wanted access to Chinese markets without colonizing China.","The U.S. did not seek territory in China.","The canal was a separate issue."],"a":2},{"id":"u3q38","u":3,"th":"dip","d":"m","pool":"B","s":"The Roosevelt Corollary to the Monroe Doctrine (1904) asserted that the United States would","st":"","o":["support Latin American independence from the United States","act as an \"international police power\" in Latin America to prevent European intervention","abandon the Monroe Doctrine","withdraw all troops from Latin America","allow European nations to collect debts by force in the Americas"],"e":["It asserted U.S. authority.","TR first applied it in the Dominican Republic, taking over customs collection to pay its debts.","It expanded the Monroe Doctrine.","The Corollary justified more intervention.","It aimed to keep Europeans out by having the U.S. intervene itself."],"a":1},{"id":"u3q39","u":3,"th":"dip","d":"h","pool":"quiz","s":"The United States acquired rights to build the Panama Canal after","st":"","o":["Great Britain transferred the region in the Treaty of Washington","a vote of the Colombian Senate approved the original treaty","it purchased the region from Spain in the Treaty of Paris","it supported a revolution in which Panama broke away from Colombia in 1903","Mexico ceded it at the end of the Mexican-American War"],"e":["The Hay-Pauncefote Treaty (1901) gave Britain's consent to a U.S. canal but transferred no territory.","The Colombian Senate rejected the treaty, which is why the U.S. backed Panama's revolt.","Panama was part of Colombia, not a Spanish colony in 1898.","When Colombia rejected a treaty, Roosevelt backed Panama's revolt and quickly signed the Hay-Bunau-Varilla Treaty with the new nation.","Mexico never controlled Panama."],"a":3},{"id":"u4q01","u":4,"th":"dip","d":"e","pool":"A","s":"The Zimmermann Telegram (1917) angered Americans because it revealed that Germany had","st":"","o":["proposed that Mexico ally with Germany against the United States in return for recovering lost territory","offered to buy the Philippines","signed a peace treaty with Russia","sunk the Lusitania","refused to pay reparations"],"e":["Germany offered Mexico Texas, New Mexico, and Arizona. Published in March 1917, the telegram pushed opinion toward war.","No such offer existed.","Brest-Litovsk (1918) came after U.S. entry.","The Lusitania was sunk in 1915. The telegram came two years later.","Reparations were imposed after the war."],"a":0},{"id":"u4q02","u":4,"th":"dip","d":"e","pool":"quiz","s":"Wilson's Fourteen Points included all of the following goals EXCEPT","st":"","o":["a League of Nations","reduction of armaments","national self-determination","freedom of the seas","the annexation of German colonies by the United States"],"e":["The League was the fourteenth point and Wilson's top priority.","Arms reduction was Point IV.","Self-determination ran through the points on Europe's borders.","Freedom of navigation was Point II.","Wilson opposed territorial grabs. The Fourteen Points called for impartial adjustment of colonial claims."],"a":4},{"id":"u4q03","u":4,"th":"dip","d":"m","pool":"quiz","s":"Senate opponents of the Treaty of Versailles, led by Henry Cabot Lodge arks","the frontier had closed and the economy would stagnate","Social Darwinism explained American success","government spending should be eliminated entirely","the United States was in a deep economic depression"],"e":["Galbraith criticized the imbalance between private consumption and public investment.","That echoes Turner's frontier thesis.","Galbraith was a liberal critic of unregulated markets.","Galbraith favored more public investment.","The 1950s were prosperous."],"a":0},{"id":"u7q31","u":7,"th":"cul","d":"e","pool":"quiz","s":"Jack Kerouac's <em>On the Road<\/em> and Allen Ginsberg's <em>Howl<\/em> are associated with the","st":"","o":["New Deal Federal Writers' Project","Beat Generation, which rejected 1950s conformity and materialism","Harlem Renaissance","muckrakers","Lost Generation"],"e":["The Beats came after the New Deal.","The Beats celebrated spontaneity, jazz, and personal freedom, foreshadowing the 1960s counterculture.","The Harlem Renaissance was a 1920s movement.","The muckrakers were Progressive Era journalists.","The Lost Generation wrote in the 1920s."],"a":1},{"id":"u7q32","u":7,"th":"cul","d":"e","pool":"B","s":"The Soviet launch of Sputnik in 1957 led the United States to","st":"","o":["end the Cold War","sign a treaty banning all satellites","create NASA and increase federal funding for science and math education","withdraw from the space race","cut defense spending sharply"],"e":["The Cold War intensified.","No such treaty was signed.","The National Defense Education Act (1958) funded science, math, and language programs.","The U.S. accelerated its space program.","Defense and missile spending rose."],"a":2},{"id":"u7q33","u":7,"th":"cul","d":"m","pool":"quiz","s":"David Riesman's <em>The Lonely Crowd<\/em> and William Whyte's <em>The Organization Man<\/em> criticized 1950s America for","st":"","o":["the failure of the New Deal","excessive individualism and rebellion","the poverty of the Dust Bowl","conformity and the pressure to fi e in 1964.","The MFDP challenge was about representation, not Vietnam."],"a":2},{"id":"u8q33","u":8,"th":"soc","d":"e","pool":"quiz","s":"The Kent State shootings of 1970 occurred during protests against","st":"","o":["the U.S. invasion of Cambodia during the Vietnam War","the end of the military draft","the Civil Rights Act of 1964","the Watergate scandal","the assassination of Martin Luther King Jr."],"e":["National Guardsmen killed four students, and campuses across the nation shut down in protest.","The draft ended in 1973, and protesters favored ending it.","Kent State students were protesting the war.","Watergate broke in 1972.","That was 1968."],"a":0},{"id":"u8q34","u":8,"th":"dip","d":"e","pool":"quiz","s":"The Cuban Missile Crisis of 1962 ended when","st":"","o":["the Soviet Union agreed to remove its missiles from Cuba in exchange for a U.S. pledge not to invade Cuba","the United Nations took control of Cuba","the United States invaded Cuba and overthrew Castro","Kennedy agreed to withdraw U.S. troops from West Berlin","the Soviets launched Sputnik"],"e":["A secret part of the deal also removed U.S. missiles from Turkey. It was the closest the superpowers came to nuclear war.","The crisis was resolved by U.S.–Soviet negotiation.","There was no invasion. The 1961 Bay of Pigs attempt had failed.","Berlin was not traded away.","Sputnik was in 1957."],"a":0},{"id":"u8q35","u":8,"th":"dip","d":"m","pool":"B","s":"The Tet Offensive of 1968 was a turning point in the Vietnam War because","st":"","o":["it caused the immediate withdrawal of all U.S. troops","it led Congress to pass the Gulf of Tonkin Resolution","it was a decisive North Vietnamese military victory that captured Saigon","it ended American bombing of North Vietnam permanently","although a military defeat for the communists, it convinced many Americans that the war could not be won soon"],"e":["Withdrawal took five more years.","That resolution came in 1964.","Saigon did not fall until 1975.","Bombing resumed under Nixon.","Tet shattered official optimism, widened the credibility gap, and led LBJ to withdraw from the 1968 race."],"a":4},{"id":"u8q36","u":8,"th":"dip","d":"m","pool":"quiz","s":"President Nixon's policy of \"Vietnamization\" called for","st":"","o":["immediately recognizing North Vietnam","sending more American ground troops to win a decisive victory","ending the war by invading North Vietnam","turning the war over to the United Nations","gradually withdrawing American troops while training and equipping South Vietnamese forces to take over the fighting"],"e":["Recognition came much later (1995).","Nixon reduced U.S. ground forces.","Nixon did not invade North Vietnam.","The UN did not take over.","Troop levels fell from over 500,000 to near zero by 1973, though bombing continued."],"a":4},{"id":"u8q37","u":8,"th":"dip","d":"h","pool":"diag","s":"The Pentagon Papers, published in 1971, revealed that","st":"","o":["Nixon had ordered the Watergate break-in","the U.S. had won the Tet Offensive militarily","successive administrations had misled the public about the conduct and prospects of the Vietnam War","North Vietnam had agreed to peace in 1965","the Soviet Union had placed missiles in Cuba"],"e":["Watergate was a separate scandal (1972–74).","The papers concerned decision-making from 1945 to 1967.","Daniel Ellsberg leaked the secret history. The Supreme Court rejected the government's attempt to stop publication.","No such agreement existed.","That was discovered in 1962 by aerial photos."],"a":2},{"id":"u8q38","u":8,"th":"dip","d":"m","pool":"quiz","s":"John F. Kennedy's \"flexible response\" defense strategy differed from Eisenhower's in that it","st":"","o":["eliminated the CIA","abandoned the policy of containment","withdrew U.S. forces from Europe","relied almost entirely on the threat of massive nuclear retaliation","expanded conventional and counterinsurgency forces so the U.S. had options other than nuclear war"],"e":["The CIA remained.","Flexible response was a tool of containment.","Kennedy reinforced commitments in Europe.","That was Eisenhower's New Look.","Kennedy built up special forces such as the Green Berets."],"a":4},{"id":"u8q39","u":8,"th":"cul","d":"e","pool":"quiz","s":"Rachel Carson's <em>Silent Spring<\/em> (1962) helped launch the modern environmental movement by","st":"","o":["describing the Dust Bowl migration","exposing the dangers of pesticides such as DDT to wildlife and human health","exposing unsafe automobiles","criticizing suburban conformity","calling for the conservation of national forests"],"e":["That is <em>The Grapes of Wrath<\/em>.","Her book led to the DDT ban and to broader environmental laws.","That was Ralph Nader's <em>Unsafe at Any Speed<\/em>.","That was <em>The Lonely Crowd<\/em> or <em>The Organization Man<\/em>.","TR and Pinchot pursued conservation decades earlier."],"a":1},{"id":"u8q40","u":8,"th":"cul","d":"e","pool":"A","s":"Martin Luther King Jr.'s \"Letter from Birmingham Jail\" (1963) defended","st":"","o":["nonviolent civil disobedience against unjust laws and rejected calls to wait patiently for change","Booker T. Washington's accommodationism","the Vietnam War","the use of armed self-defense against police","the Southern Manifesto"],"e":["King replied to white clergy who called the protests \"unwise and untimely.\"","King rejected waiting for gradual change.","King later opposed the war (1967).","That was closer to Malcolm X or the Panthers.","The Southern Manifesto opposed desegregation."],"a":0},{"id":"u8q41","u":8,"th":"cul","d":"m","pool":"B","s":"The Port Huron Statement (1962), issued by Students for a Democratic Society, called for","st":"","o":["an expanded war in Vietnam","abolition of all universities","support for McCarthyism","a return to traditional family values","\"participatory democracy\" and criticized Cold War militarism, racism, and corporate power"],"e":["SDS became a leading antiwar group.","SDS sought to reform universities and society.","SDS rejected Cold War anti-communism.","That fits the later New Right, not SDS.","It became a founding document of the New Left."],"a":4},{"id":"u8q42","u":8,"th":"cul","d":"m","pool":"A","s":"Michael Harrington's <em>The Other America<\/em> (1962) influenced the Great Society by","st":"","o":["exposing pesticide dangers","arguing that poverty had been eliminated in the U.S.","promoting the counterculture lifestyle","describing suburban conformity","revealing the extent of poverty hidden amid postwar prosperity"],"e":["That was Rachel Carson.","Harrington showed the opposite.","The book was a social analysis of poverty.","That was Riesman and Whyte.","The book helped persuade Kennedy and Johnson to launch the War on Poverty."],"a":4},{"id":"u8q43","u":8,"th":"cul","d":"m","pool":"B","s":"The counterculture of the late 1960s was characterized by","st":"","o":["the founding of the Moral Majority","strong support for the Vietnam War","a revival of 1950s suburban conformity","the temperance movement","rejection of middle-class values through communal living, rock music, experimentation with drugs, and new styles of dress"],"e":["That was a conservative religious group (1979).","The counterculture was largely antiwar.","It rejected 1950s conformity.","Temperance belongs to an earlier era.","Events like Woodstock (1969) and the Summer of Love (1967) symbolized it."],"a":4},{"id":"u8q44","u":8,"th":"cul","d":"m","pool":"quiz","s":"The Free Speech Movement at the University of California, Berkeley, in 1964 began as a protest over","st":"","o":["the Scopes Trial","the Pentagon Papers","university restrictions on political activity and advocacy on campus","Prohibition","the Kent State shootings"],"e":["The Scopes Trial was in 1925.","The Pentagon Papers were published in 1971.","Students demanding the right to organize for civil rights causes launched a wave of campus activism.","Prohibition ended in 1933.","Kent State occurred in 1970."],"a":2},{"id":"u8q45","u":8,"th":"cul","d":"m","pool":"diag","s":"The Supreme Court's decision in Engel v. Vitale (1962) angered many religious conservatives because it","st":"","o":["required the Pledge of Allegiance in schools","legalized abortion","allowed states to ban the teaching of evolution","upheld segregation in religious schools","ruled that official prayer in public schools violated the First Amendment's Establishment Clause"],"e":["Engel concerned prayer, not the Pledge.","That was Roe v. Wade (1973).","The Court struck down such a ban in 1968.","Engel did not concern segregation.","The ruling became a rallying point for later religious conservative movements."],"a":4},{"id":"u8q46","u":8,"th":"cul","d":"h","pool":"B","s":"Folk musician Bob Dylan's songs, such as \"The Times They Are a-Changin',\" are associated with","st":"","o":["the swing era of the 1930s","the protest and youth culture of the 1960s civil rights and antiwar era","the Harlem Renaissance of the 1920s","World War II propaganda","the Federal Music Project of the New Deal"],"e":["Swing preceded Dylan by decades.","Dylan's songs voiced generational change and social protest.","Dylan emerged in the early 1960s.","Dylan's work came after the war.","Dylan was not part of the WPA."],"a":1},{"id":"u8q47","u":8,"th":"cul","d":"h","pool":"A","s":"Ralph Nader's <em>Unsafe at Any Speed<\/em> (1965) is significant because it","st":"","o":["sparked the consumer protection movement and led to federal auto safety regulation","launched the environmental movement","celebrated 1950s car culture","argued for deregulation of the auto industry","exposed the Watergate cover-up"],"e":["Nader's attack on the auto industry helped produce the National Traffic and Motor Vehicle Safety Act (1966).","That is credited to Carson's <em>Silent Spring<\/em>.","The book criticized automakers.","Nader argued for more regulation.","Woodward and Bernstein's reporting exposed Watergate."],"a":0},{"id":"u8q48","u":8,"th":"cul","d":"m","pool":"A","s":"The Warren Court's decisions in Mapp, Gideon, and Miranda all expanded","st":"","o":["restrictions on free speech in wartime","the rights of people accused of crimes","the power of the president in foreign affairs","the government's power to regulate business","the rights of states to segregate schools"],"e":["They concerned criminal justice, not speech.","These rulings applied Bill of Rights protections to state criminal proceedings.","They concerned criminal procedure.","They concerned individual rights.","The Warren Court ended school segregation."],"a":1},{"id":"u8q49","u":8,"th":"eco","d":"m","pool":"B","s":"Medicare and Medicaid, created in 1965, provided","st":"","o":["pensions for retired workers","health insurance for all Americans","health insurance for the elderly (Medicare) and health coverage for low-income Americans (Medicaid)","unemployment insurance for laid-off workers","subsidies for farmers"],"e":["Pensions came under Social Security (1935).","Universal coverage was not enacted.","These programs vastly expanded federal health spending and remain central today.","Unemployment insurance came with the Social Security Act.","Farm programs are separate."],"a":2},{"id":"u8q50","u":8,"th":"eco","d":"h","pool":"A","s":"Critics have argued that the Vietnam War undermined Johnson's Great Society chiefly because","st":"","o":["the war caused a deep depression in 1967","Medicare was declared unconstitutional","the Great Society was repealed by Congress in 1966","war spending drained resources and political support from domestic programs and fueled inflation","the war forced the U.S. to return to the gold standard"],"e":["The economy grew in the late 1960s, with rising inflation.","Medicare was never struck down.","Most programs survived, and many still exist.","LBJ tried to fund \"guns and butter,\" which contributed to inflation and budget strains by the late 1960s.","The U.S. moved away from gold, ending convertibility in 1971."],"a":3}],"units":[{"n":1,"title":"Reconstruction and the New South","years":"1865–1900","period":"early","weight":8,"minutes":10,"lesson":"<h2>The big question<\/h2>\n<p>In 1865 the Union had won the war, and about four million enslaved people were free. Two questions followed. <strong>On what terms would the eleven Confederate states rejoin the Union?<\/strong> And <strong>what would freedom actually mean for formerly enslaved people?<\/strong> The struggle over these questions is called <strong>Reconstruction<\/strong> (1865–1877). The short version: freedpeople won major constitutional rights during Reconstruction. Then the North lost interest, white southern Democrats retook power, and most of those rights were stripped away by 1900.<\/p>\n<h2>Presidential Reconstruction (1865–1866)<\/h2>\n<p>Lincoln had planned a lenient restoration. Under his <strong>Ten Percent Plan<\/strong> (1863), a state could form a new government once 10% of its 1860 voters swore loyalty to the Union. Congress pushed back with the harsher <strong>Wade-Davis Bill<\/strong>, which required 50% and an \"ironclad oath,\" but Lincoln pocket-vetoed it. Lincoln was assassinated in April 1865, and <strong>Andrew Johnson<\/strong>, a pro-Union Democrat from Tennessee, became president.<\/p>\n<p>Johnson pardoned thousands of ex-Confederates and let the old southern elite rebuild state governments. Those governments passed <strong>Black Codes<\/strong>. These laws limited freedpeople's right to own or rent land, required them to sign yearly labor contracts, and let authorities arrest unemployed Black men for \"vagrancy\" and hire them out. Johnson also returned land confiscated during the war to its prewar owners. That ended the hopes raised by General Sherman's Field Order No. 15 that freedpeople would get <strong>\"forty acres and a mule.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Johnson's lenient pardons; old elites back in power<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Southern states pass Black Codes; anti-Black riots in Memphis and New Orleans (1866)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Northern voters elect a Republican supermajority in 1866; Congress takes over Reconstruction<\/div><\/div>\n<p>The <strong>Thirteenth Amendment<\/strong> (ratified December 1865) abolished slavery. Congress also created the <strong>Freedmen's Bureau<\/strong> (1865). It provided food and medical care and supervised labor contracts. Its most lasting work was <strong>education<\/strong>: with northern missionary societies, it helped found schools and colleges such as <strong>Howard<\/strong> and <strong>Fisk<\/strong>.<\/p>\n<h2>Congressional (Radical) Reconstruction (1867–1877)<\/h2>\n<p>The <strong>Radical Republicans<\/strong>, led by <strong>Thaddeus Stevens<\/strong> in the House and <strong>Charles Sumner<\/strong> in the Senate, wanted to remake southern society and protect Black rights. Congress passed the <strong>Civil Rights Act of 1866<\/strong> over Johnson's veto. Then, to put those rights beyond the reach of future majorities, it wrote the <strong>Fourteenth Amendment<\/strong> (ratified 1868). The amendment made everyone born in the U.S. a <strong>citizen<\/strong> and barred states from denying anyone <strong>\"due process\"<\/strong> or <strong>\"equal protection of the laws.\"<\/strong> It later became the foundation of the twentieth-century civil rights revolution.<\/p>\n<p>When southern states refused to ratify it, Congress passed the <strong>Reconstruction Acts of 1867<\/strong>. These acts divided the former Confederacy (except Tennessee, already readmitted) into <strong>five military districts<\/strong>. To be readmitted, a state had to write a new constitution guaranteeing <strong>Black male suffrage<\/strong> and ratify the Fourteenth Amendment.<\/p>\n<p>Congress also passed the <strong>Tenure of Office Act<\/strong>, which barred the president from removing certain officials without Senate approval. Johnson fired Secretary of War Edwin Stanton anyway, and in 1868 the House <strong>impeached<\/strong> him. The Senate fell <strong>one vote<\/strong> short of removing him. Johnson finished his term with little power left.<\/p>\n<p><strong>Ulysses S. Grant<\/strong> won the presidency in 1868. The <strong>Fifteenth Amendment<\/strong> (1870) barred denying the vote on account of <strong>\"race, color, or previous condition of servitude.\"<\/strong> It did not mention sex, which angered woman suffrage leaders and split their movement.<\/p>\n<h3>Reconstruction governments in the South<\/h3>\n<p>Southern Republican governments drew support from three groups:<\/p>\n<ul><li>freedmen, who voted in large numbers<\/li><li><strong>\"carpetbaggers\"<\/strong>, northerners who moved South<\/li><li><strong>\"scalawags\"<\/strong>, white southerners who joined the Republicans<\/li><\/ul>\n<p>About 2,000 Black men held office. <strong>Hiram Revels<\/strong> of Mississippi became the <strong>first African American U.S. senator<\/strong> (1870). These governments created the South's first <strong>public school systems<\/strong> and rebuilt railroads, but they also ran up debt and suffered some corruption, which opponents exaggerated.<\/p>\n<p>Freedpeople built independent lives. They <strong>reunited families<\/strong>, legalized marriages, and founded <strong>Black churches<\/strong>, which became the center of community and political life. They also flocked to schools.<\/p>\n<h3>Violence and retreat<\/h3>\n<p>The <strong>Ku Klux Klan<\/strong> (founded 1866) and similar groups used terror to keep Black men from voting. Congress answered with the <strong>Enforcement Acts<\/strong> and the <strong>Ku Klux Klan Act<\/strong> (1870–71), which let federal troops and courts crush the first Klan. But northern commitment faded for several reasons:<\/p>\n<ul><li>the <strong>Panic of 1873<\/strong> turned voters' attention to the economy<\/li><li>scandals in Grant's administration, including the <strong>Crédit Mobilier<\/strong> railroad bribery scheme and the <strong>Whiskey Ring<\/strong> tax fraud, discredited Republican rule<\/li><li>northern racism made voters weary of the \"southern question\"<\/li><\/ul>\n<p>The Supreme Court also narrowed the new amendments. In the <strong>Slaughterhouse Cases<\/strong> (1873), the Court read the Fourteenth Amendment's protections narrowly. <strong>U.S. v. Cruikshank<\/strong> (1876) overturned convictions from the <strong>Colfax Massacre<\/strong> and left protection of Black citizens mostly to the states.<\/p>\n<h2>The end of Reconstruction: the Compromise of 1877<\/h2>\n<p>The <strong>election of 1876<\/strong> between <strong>Rutherford B. Hayes<\/strong> (Republican) and <strong>Samuel Tilden<\/strong> (Democrat) hinged on disputed electoral votes from three southern states. In the informal <strong>Compromise of 1877<\/strong>, Democrats accepted Hayes as president, and Hayes <strong>withdrew the last federal troops<\/strong> from southern statehouses. Southern Democrats who called themselves <strong>\"Redeemers\"<\/strong> took over every southern state.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Northern fatigue, depression, violence, court rulings<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Compromise of 1877 removes federal troops<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>\"Redeemer\" Democrats rule the South; Black rights erode<\/div><\/div>\n<h2>The \"New South\" and Jim Crow (1877–1900)<\/h2>\n<p>Atlanta editor <strong>Henry Grady<\/strong> promoted a <strong>\"New South\"<\/strong> of factories, railroads, and diversified farming. Some industry did grow: <strong>textile mills<\/strong>, <strong>Birmingham steel<\/strong>, and <strong>tobacco<\/strong> (James B. Duke's American Tobacco Company). But the South stayed poor and mostly agricultural, and northern capital often owned its industry.<\/p>\n<h3>The farm trap<\/h3>\n<p>Without land, most freedpeople, and many poor whites, became <strong>sharecroppers<\/strong>. They farmed a landowner's land in exchange for a share of the crop, often half. Others were <strong>tenant farmers<\/strong> who rented land. Under the <strong>crop-lien system<\/strong>, local merchants supplied seed and food on credit, secured by a lien on the coming crop. High interest and low cotton prices kept families in <strong>permanent debt<\/strong>.<\/p>\n<h3>Jim Crow and disfranchisement<\/h3>\n<p>By the 1890s southern states built a system of legal segregation known as <strong>Jim Crow<\/strong>. To get around the Fifteenth Amendment, they used:<\/p>\n<ul><li><strong>poll taxes<\/strong><\/li><li><strong>literacy tests<\/strong>, applied unfairly by white registrars<\/li><li><strong>white primaries<\/strong><\/li><li><strong>grandfather clauses<\/strong>, which excused a man from these tests if his grandfather could vote before 1867, so poor whites kept the vote<\/li><\/ul>\n<p>The Supreme Court went along:<\/p>\n<ul><li><strong>Civil Rights Cases (1883):<\/strong> struck down the Civil Rights Act of 1875, holding that the Fourteenth Amendment limits <em>state<\/em> action, not private businesses.<\/li><li><strong>Plessy v. Ferguson (1896):<\/strong> upheld segregated railroad cars under the doctrine of <strong>\"separate but equal.\"<\/strong> Justice <strong>John Marshall Harlan<\/strong> dissented alone: \"Our Constitution is color-blind.\"<\/li><\/ul>\n<p><strong>Lynching<\/strong> peaked in the 1890s. Journalist <strong>Ida B. Wells<\/strong> exposed it in pamphlets such as <em>Southern Horrors<\/em> (1892). Some Black southerners left. The <strong>Exodusters<\/strong> moved to Kansas in 1879.<\/p>\n<h3>Two Black strategies<\/h3>\n<p><strong>Booker T. Washington<\/strong> founded the <strong>Tuskegee Institute<\/strong> (1881). In his <strong>Atlanta Compromise<\/strong> speech (1895), he urged Black southerners to accept segregation for now and focus on <strong>vocational education<\/strong> and economic self-help. <strong>W.E.B. Du Bois<\/strong> answered in <em>The Souls of Black Folk<\/em> (1903). He demanded <strong>full civil and political rights now<\/strong> and higher education for a <strong>\"Talented Tenth\"<\/strong> of leaders. (Du Bois's later work is in Unit 3.)<\/p>\n<p>Meanwhile, white southerners built the <strong>\"Lost Cause\"<\/strong> memory of the war. It cast the Confederacy as a noble fight for states' rights rather than slavery. Monuments and textbooks spread this view for generations.<\/p>\n<h3>One diplomatic footnote<\/h3>\n<p>In 1867 Secretary of State <strong>William Seward<\/strong> bought <strong>Alaska<\/strong> from Russia for $7.2 million. Critics mocked it as \"Seward's Folly.\"<\/p>","mustknow":["<strong>13th Amendment<\/strong> (1865) abolished slavery. <strong>14th<\/strong> (1868) gave citizenship plus <strong>equal protection<\/strong> and <strong>due process<\/strong>. <strong>15th<\/strong> (1870) barred race-based denial of the vote.","<strong>Black Codes<\/strong> (1865–66): southern laws restricting freedpeople's labor and movement. They provoked <strong>Radical Reconstruction<\/strong>.","<strong>Reconstruction Acts of 1867<\/strong>: five military districts; readmission required Black male suffrage and ratifying the 14th Amendment.","<strong>Johnson's impeachment<\/strong> (1868) came from firing Stanton in violation of the <strong>Tenure of Office Act<\/strong>. He was acquitted by one vote.","<strong>Freedmen's Bureau<\/strong>: aid, labor contracts, and especially <strong>schools<\/strong> (Howard, Fisk).","<strong>Sharecropping + crop-lien<\/strong> = a cycle of debt for Black and poor white farmers.","<strong>Compromise of 1877<\/strong>: Hayes becomes president and federal troops leave the South. Reconstruction ends.","<strong>Plessy v. Ferguson<\/strong> (1896) = \"separate but equal.\" Harlan's dissent: \"color-blind.\"","Disfranchisement tools: <strong>poll tax, literacy test, grandfather clause, white primary<\/strong>.","<strong>Booker T. Washington<\/strong> (accommodation, Tuskegee, Atlanta Compromise) vs. <strong>W.E.B. Du Bois<\/strong> (immediate rights, Talented Tenth)."],"timeline":[{"y":"1863","t":"Lincoln's Ten Percent Plan","key":false},{"y":"1865","t":"Lincoln assassinated; Freedmen's Bureau created; 13th Amendment ratified; Black Codes begin","key":true},{"y":"1866","t":"Civil Rights Act passed over Johnson's veto; Ku Klux Klan founded","key":false},{"y":"1867","t":"Reconstruction Acts (military districts); Tenure of Office Act; Alaska purchased","key":true},{"y":"1868","t":"Johnson impeached and acquitted; 14th Amendment ratified; Grant elected","key":true},{"y":"1870","t":"15th Amendment; Hiram Revels first Black U.S. senator","key":true},{"y":"1870–71","t":"Enforcement Acts and Ku Klux Klan Act","key":false},{"y":"1873","t":"Panic of 1873; Slaughterhouse Cases; Colfax Massacre","key":false},{"y":"1876","t":"Disputed Hayes–Tilden election; U.S. v. Cruikshank","key":false},{"y":"1877","t":"Compromise of 1877: troops withdrawn, Reconstruction ends","key":true},{"y":"1879","t":"Exoduster migration to Kansas","key":false},{"y":"1881","t":"Booker T. Washington opens Tuskegee Institute","key":false},{"y":"1883","t":"Civil Rights Cases strike down Civil Rights Act of 1875","key":false},{"y":"1890","t":"Mississippi constitution adds poll tax and literacy test","key":false},{"y":"1892","t":"Ida B. Wells publishes <em>Southern Horrors<\/em>","key":false},{"y":"1895","t":"Washington's Atlanta Compromise speech","key":false},{"y":"1896","t":"Plessy v. Ferguson: \"separate but equal\"","key":true}],"cards":[{"id":"u1c01","f":"Thirteenth Amendment (1865)","b":"Abolished slavery and involuntary servitude, except as punishment for a crime."},{"id":"u1c02","f":"Fourteenth Amendment (1868)","b":"Citizenship for all persons born in the U.S.; states may not deny \"due process\" or \"equal protection of the laws.\" The basis of later civil rights rulings."},{"id":"u1c03","f":"Fifteenth Amendment (1870)","b":"The right to vote cannot be denied because of \"race, color, or previous condition of servitude.\" It left out women."},{"id":"u1c04","f":"Ten Percent Plan vs. Wade-Davis Bill","b":"Lincoln: a state is restored once 10% of 1860 voters swear loyalty. Congress (Wade-Davis): 50% plus an ironclad oath. Lincoln pocket-vetoed it."},{"id":"u1c05","f":"Freedmen's Bureau (1865)","b":"Federal agency that gave freedpeople food and medical care and supervised labor contracts. Its biggest legacy was schools and colleges (Howard, Fisk)."},{"id":"u1c06","f":"Black Codes","b":"Laws passed by southern states in 1865–66 restricting freedpeople's labor, movement, and property rights. They sparked Radical Reconstruction."},{"id":"u1c07","f":"Radical Republicans","b":"Congressional faction (Thaddeus Stevens, Charles Sumner) that pushed for Black civil and voting rights and tough terms for the South."},{"id":"u1c08","f":"Reconstruction Acts of 1867","b":"Split the South into five military districts. Readmission required new constitutions with Black male suffrage and ratification of the 14th Amendment."},{"id":"u1c09","f":"Impeachment of Andrew Johnson (1868)","b":"The House impeached him for firing Secretary of War Stanton in violation of the Tenure of Office Act. The Senate acquitted by one vote."},{"id":"u1c10","f":"Carpetbaggers / Scalawags","b":"Carpetbaggers were northerners who moved South during Reconstruction. Scalawags were white southerners who supported the Republicans."},{"id":"u1c11","f":"Sharecropping","b":"Landless farmers worked a landowner's land in exchange for a share of the crop. It was the dominant labor system for freedpeople."},{"id":"u1c12","f":"Crop-lien system","b":"Merchants advanced seed and supplies on credit, secured by the future crop. High interest kept farmers in endless debt."},{"id":"u1c13","f":"Enforcement Acts / Ku Klux Klan Act (1870–71)","b":"Federal laws that let the government use courts and troops against Klan terror aimed at Black voters."},{"id":"u1c14","f":"Compromise of 1877","b":"Settled the disputed Hayes–Tilden election. Hayes became president and withdrew the last federal troops from the South, ending Reconstruction."},{"id":"u1c15","f":"Redeemers","b":"Southern white Democrats who took back state governments from Republicans in the 1870s and rolled back Reconstruction."},{"id":"u1c16","f":"New South","b":"Henry Grady's vision of an industrialized, diversified southern economy (textiles, steel, tobacco). Only partly achieved."},{"id":"u1c17","f":"Jim Crow disfranchisement tools","b":"Poll taxes, literacy tests, white primaries, and grandfather clauses, used to strip Black men of the vote despite the 15th Amendment."},{"id":"u1c18","f":"Plessy v. Ferguson (1896)","b":"Supreme Court upheld segregated railroad cars under \"separate but equal.\" Justice Harlan dissented: \"Our Constitution is color-blind.\""},{"id":"u1c19","f":"Atlanta Compromise (1895)","b":"Booker T. Washington's speech urging Black southerners to accept segregation for now and pursue vocational education and economic progress."},{"id":"u1c20","f":"Ida B. Wells","b":"Black journalist who led the crusade against lynching (<em>Southern Horrors<\/em>, 1892)."},{"id":"u1c21","f":"Exodusters (1879)","b":"Black southerners who migrated to Kansas to escape the post-Reconstruction South."}]},{"n":2,"title":"The Gilded Age: Industry, Labor, the West, and the Cities","years":"1865–1900","period":"early","weight":12,"minutes":12,"lesson":"<h2>The big picture<\/h2>\n<p>Between the Civil War and 1900 the United States became the world's leading <strong>industrial economy<\/strong>. Railroads, steel, oil, and electricity built enormous fortunes. They also brought dangerous factories, crowded cities, and violent strikes. Mark Twain and Charles Dudley Warner called it <strong>\"The Gilded Age\"<\/strong> (1873): a thin layer of gold over serious problems. This unit has four pieces: <strong>big business<\/strong>, <strong>labor<\/strong>, <strong>immigrants and cities<\/strong>, and <strong>the West<\/strong>. A short section on <strong>politics<\/strong> follows.<\/p>\n<h2>1. Railroads and big business<\/h2>\n<p>The <strong>transcontinental railroad<\/strong> was finished at <strong>Promontory Point, Utah, in 1869<\/strong>. The Union Pacific was built largely by Irish workers and the Central Pacific by Chinese workers. Congress subsidized railroads with huge <strong>land grants<\/strong>. Railroads created a <strong>national market<\/strong> and drove demand for steel and coal. They even led to <strong>standard time zones<\/strong> (1883).<\/p>\n<p>New business strategies created giant corporations:<\/p>\n<ul><li><strong>Andrew Carnegie<\/strong> (steel) used the <strong>Bessemer process<\/strong> and <strong>vertical integration<\/strong>: he owned every stage of production, from iron mines and ore ships to mills and railroads. In 1901 he sold to banker <strong>J.P. Morgan<\/strong>, who created <strong>U.S. Steel<\/strong>, the first <strong>billion-dollar corporation<\/strong>.<\/li><li><strong>John D. Rockefeller<\/strong> (<strong>Standard Oil<\/strong>) used <strong>horizontal integration<\/strong>. He bought out or crushed competing refiners until he controlled about 90% of U.S. refining. He organized the business as a <strong>trust<\/strong> (1882), in which stockholders of many companies handed control to one board of trustees. Later, <strong>holding companies<\/strong> did the same job.<\/li><li>Critics called these men <strong>\"robber barons\"<\/strong>. Admirers called them <strong>\"captains of industry.\"<\/strong><\/li><\/ul>\n<p>New inventions remade daily life. <strong>Alexander Graham Bell<\/strong> invented the telephone (1876). <strong>Thomas Edison<\/strong> set up a research lab at Menlo Park and produced a practical <strong>light bulb<\/strong> (1879). <strong>George Westinghouse<\/strong> promoted alternating current.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Railroads + new technology + cheap immigrant labor + government support<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Rise of giant corporations and trusts<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Huge wealth gap, monopoly power, and a backlash from farmers and workers<\/div><\/div>\n<h3>Ideas that justified (and challenged) big business<\/h3>\n<p><strong>Social Darwinism<\/strong> applied \"survival of the fittest\" to society. <strong>Herbert Spencer<\/strong> and Yale's <strong>William Graham Sumner<\/strong> argued that the rich had earned their place and government should not help the poor. This fit with <strong>laissez-faire<\/strong> economics. <strong>Horatio Alger<\/strong> novels sold the \"rags to riches\" dream.<\/p>\n<p>Carnegie's <strong>\"Gospel of Wealth\"<\/strong> (1889) argued that the rich had a duty to give their fortunes away for the public good, through libraries, universities, and concert halls. \"The man who dies thus rich dies disgraced.\"<\/p>\n<p>Critics pushed back:<\/p>\n<ul><li><strong>Henry George<\/strong>, <em>Progress and Poverty<\/em> (1879), proposed a <strong>\"single tax\"<\/strong> on land values.<\/li><li><strong>Edward Bellamy<\/strong>, <em>Looking Backward<\/em> (1888), imagined a cooperative socialist utopia in the year 2000.<\/li><li><strong>Thorstein Veblen<\/strong> coined <strong>\"conspicuous consumption\"<\/strong> for the wasteful display of the rich (<em>The Theory of the Leisure Class<\/em>, 1899).<\/li><\/ul>\n<h3>First steps at regulation<\/h3>\n<p>Farmers angry at railroad rates won state <strong>\"Granger laws.\"<\/strong> In <strong>Munn v. Illinois<\/strong> (1877), the Supreme Court upheld state regulation of businesses \"clothed with a public interest,\" in that case grain elevators. But <strong>Wabash v. Illinois<\/strong> (1886) ruled that states could not regulate <strong>interstate<\/strong> commerce. Congress responded with two laws:<\/p>\n<ul><li>the <strong>Interstate Commerce Act<\/strong> (1887), which created the <strong>Interstate Commerce Commission<\/strong>, the first federal regulatory agency<\/li><li>the <strong>Sherman Antitrust Act<\/strong> (1890), which outlawed combinations \"in restraint of trade\"<\/li><\/ul>\n<p>Both were weak at first. In <strong>U.S. v. E.C. Knight<\/strong> (1895), the Court ruled that a sugar trust controlling 98% of refining was <em>manufacturing<\/em>, not <em>commerce<\/em>, so the Sherman Act did not reach it. Ironically, the Sherman Act was used more against <strong>labor unions<\/strong> than against trusts in the 1890s.<\/p>\n<h2>2. Labor<\/h2>\n<p>Factory work meant <strong>12-hour days<\/strong>, six-day weeks, child labor, dangerous machines, and no compensation for injuries. Workers organized in two main ways:<\/p>\n<ul><li>The <strong>Knights of Labor<\/strong> (led by <strong>Terence Powderly<\/strong>) welcomed nearly everyone: skilled and unskilled workers, women, and Black workers. It favored the <strong>eight-hour day<\/strong> and cooperatives. It collapsed after being blamed for the Haymarket bombing.<\/li><li>The <strong>American Federation of Labor (AFL, 1886)<\/strong>, led by <strong>Samuel Gompers<\/strong>, was a federation of <strong>skilled craft unions<\/strong>. It practiced <strong>\"bread-and-butter\" unionism<\/strong>: higher wages, shorter hours, better conditions. It used strikes and collective bargaining and avoided radical politics. The AFL survived and grew.<\/li><\/ul>\n<p>The great strikes are tested often. Know who, what, and the result:<\/p>\n<ul><li><strong>Great Railroad Strike (1877):<\/strong> the first nationwide strike, set off by wage cuts. President Hayes sent <strong>federal troops<\/strong>.<\/li><li><strong>Haymarket Square (Chicago, 1886):<\/strong> a bomb exploded at a rally for the eight-hour day. Anarchists were blamed, and a wave of <strong>anti-union, anti-immigrant<\/strong> feeling followed.<\/li><li><strong>Homestead Strike (1892):<\/strong> at Carnegie's steel works, manager <strong>Henry Clay Frick<\/strong> hired <strong>Pinkerton<\/strong> guards. A gun battle followed, the state militia broke the strike, and the steelworkers' union was crushed.<\/li><li><strong>Pullman Strike (1894):<\/strong> <strong>Eugene V. Debs's American Railway Union<\/strong> boycotted Pullman cars and paralyzed the railroads. President <strong>Cleveland<\/strong> sent troops, using a federal court <strong>injunction<\/strong>, on the grounds that the strike interfered with the mail. Debs went to jail and later became a <strong>Socialist<\/strong>.<\/li><\/ul>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Wage cuts and harsh conditions<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Major strikes (1877, 1886, 1892, 1894)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Government sides with employers: troops, injunctions; public links unions to radicalism<\/div><\/div>\n<h2>3. Immigrants and cities<\/h2>\n<p>After about 1880, the <strong>\"New Immigrants\"<\/strong> came mostly from <strong>southern and eastern Europe<\/strong>: Italians, Poles, Russian Jews, Greeks, and Slavs. Most were Catholic, Orthodox, or Jewish, and many were poor. They entered through <strong>Ellis Island<\/strong> (opened 1892). Asian immigrants on the West Coast later passed through <strong>Angel Island<\/strong> (1910).<\/p>\n<p><strong>Nativism<\/strong> (hostility to immigrants) grew. The <strong>Chinese Exclusion Act (1882)<\/strong> was the <strong>first federal law to bar immigrants by nationality<\/strong>. The anti-Catholic <strong>American Protective Association<\/strong> (1887) organized against the newcomers.<\/p>\n<p>Cities exploded. In 1870 about one American in four lived in an urban area. By 1920 it was more than half. Skyscrapers (architect <strong>Louis Sullivan<\/strong>: \"form follows function\"), electric streetcars, and the <strong>Brooklyn Bridge<\/strong> (1883) changed the landscape. The poor crowded into <strong>tenements<\/strong>. Photojournalist <strong>Jacob Riis<\/strong> exposed them in <em>How the Other Half Lives<\/em> (1890).<\/p>\n<p><strong>Political machines<\/strong> such as New York's <strong>Tammany Hall<\/strong>, run by <strong>\"Boss\" William Tweed<\/strong>, traded jobs, food, and favors for immigrant votes, and stole millions. Cartoonist <strong>Thomas Nast<\/strong> helped bring Tweed down.<\/p>\n<p>Reformers responded:<\/p>\n<ul><li><strong>Settlement houses<\/strong>, above all <strong>Jane Addams's Hull House<\/strong> (Chicago, 1889), offered classes, child care, and English lessons, and pushed for reform laws.<\/li><li>The <strong>Social Gospel<\/strong> movement (<strong>Walter Rauschenbusch<\/strong>, Washington Gladden) urged churches to fix social problems on earth.<\/li><li>The <strong>Woman's Christian Temperance Union<\/strong> (<strong>Frances Willard<\/strong>) fought alcohol and became the largest women's organization of the era.<\/li><\/ul>\n<h2>4. The West<\/h2>\n<p>The <strong>Homestead Act<\/strong> (1862) offered <strong>160 acres<\/strong> of public land to settlers who farmed it for five years. The <strong>Morrill Land-Grant Act<\/strong> (1862) funded state agricultural and technical colleges. Mining booms, <strong>cattle drives<\/strong> up trails such as the Chisholm Trail (many cowboys were Black or Mexican), and finally <strong>barbed wire<\/strong> (1874) closed the open range.<\/p>\n<p>The cost fell on Plains Indians. Hunters slaughtered the <strong>buffalo<\/strong>, the base of Plains life, and the herds nearly vanished by the late 1880s. The wars ran from the <strong>Sand Creek Massacre<\/strong> (1864) through these events:<\/p>\n<ul><li><strong>Little Bighorn (1876):<\/strong> Lakota and Cheyenne under <strong>Sitting Bull<\/strong> and <strong>Crazy Horse<\/strong> wiped out <strong>Custer's<\/strong> force.<\/li><li><strong>Chief Joseph<\/strong> and the Nez Perce attempted a long flight toward Canada and surrendered in 1877: \"I will fight no more forever.\"<\/li><li><strong>Wounded Knee (1890):<\/strong> the army massacred about 250 Lakota after alarm over the <strong>Ghost Dance<\/strong> religion. It marked the end of armed resistance.<\/li><\/ul>\n<p>Writer <strong>Helen Hunt Jackson<\/strong> condemned federal treatment of Native peoples in <em>A Century of Dishonor<\/em> (1881). But reformers' main answer was <strong>assimilation<\/strong>. The <strong>Dawes Severalty Act (1887)<\/strong> broke up reservations into <strong>individual allotments<\/strong> (160 acres per family head) and promised citizenship. \"Surplus\" land was sold to whites, and Native Americans lost about <strong>two-thirds<\/strong> of their land by 1934. Boarding schools such as <strong>Carlisle<\/strong> (founded by Richard Henry Pratt) forced Native children to give up their languages and cultures.<\/p>\n<p>In 1893 historian <strong>Frederick Jackson Turner<\/strong> argued in his <strong>\"frontier thesis\"<\/strong> that the frontier had shaped American democracy and individualism. The 1890 census had just declared the frontier <strong>closed<\/strong>.<\/p>\n<h2>5. Gilded Age politics<\/h2>\n<p>Politics was a close, intense game. Elections were narrow, <strong>voter turnout was very high<\/strong> (often about 80%), and the two parties differed less on policy than on loyalty, region, religion, and <strong>patronage<\/strong>. Debate focused on <strong>tariffs<\/strong>, <strong>currency<\/strong>, and <strong>civil service<\/strong>.<\/p>\n<p>In 1881 a disappointed office-seeker assassinated President <strong>James Garfield<\/strong>. This led to the <strong>Pendleton Civil Service Act (1883)<\/strong>, which filled some federal jobs by <strong>merit exams<\/strong> instead of the <strong>spoils system<\/strong>. In 1884, reform Republicans called <strong>\"Mugwumps\"<\/strong> bolted
