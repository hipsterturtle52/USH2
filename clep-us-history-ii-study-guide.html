By 1920, for the first time, a majority of Americans lived in urban areas.","Urbanization slowed sharply after 1900."],"e":["The data don't address causes. In fact, immigration was a major driver of urban growth.","In 1870 only about a quarter lived in urban areas.","The data show shares, not absolute numbers. Rural population actually still grew for much of this period.","The census of 1920 recorded urban residents at just over half the population, the culmination of the trend shown.","The share kept rising quickly between 1900 and 1920."],"a":3},{"id":"u2q34","u":2,"th":"soc","d":"h","pool":"B","s":"The American Protective Association, founded in 1887, is best described as","st":"","o":["an agency that inspected immigrants at Ellis Island","a group that protected Native American land rights","a union representing railroad workers","a trust of insurance companies","a nativist organization hostile to Catholic immigrants"],"e":["Federal officials did the inspections.","Groups like the Indian Rights Association took a different, assimilationist approach. The APA was nativist.","That was Debs's American Railway Union.","The APA was a political-social organization, not a business.","The APA spread anti-Catholic suspicion as Italian, Polish, and other Catholic immigrants arrived."],"a":4},{"id":"u2q35","u":2,"th":"soc","d":"m","pool":"quiz","s":"The Woman's Christian Temperance Union under Frances Willard is significant because it","st":"","o":["became the largest women's organization of the era and drew women into broader reform, including suffrage","founded the first settlement house","opposed women's right to vote","successfully banned alcohol nationwide in the 1880s","led the Pullman Strike"],"e":["Willard's \"Do Everything\" policy linked temperance to suffrage, labor, and other causes.","Settlement houses are associated with Jane Addams and others.","Under Willard, the WCTU endorsed suffrage.","National prohibition came with the Eighteenth Amendment in 1919/1920.","Debs's American Railway Union led Pullman."],"a":0},{"id":"u2q36","u":2,"th":"soc","d":"m","pool":"B","s":"The near-extermination of the buffalo by the late 1880s affected Plains Indians chiefly by","st":"","o":["encouraging them to become cattle ranchers on the open range","giving them a new source of income from the hide trade","having little effect because they had already switched to farming","destroying the foundation of their food supply, economy, and way of life, which forced many onto reservations","leading Congress to grant them full citizenship"],"e":["Few Plains tribes became commercial ranchers.","Hide profits went mainly to white hunters, and the collapse left tribes destitute.","Most Plains peoples depended heavily on the buffalo.","Commercial hunting (aided by railroads and the army) wiped out the herds that sustained Plains peoples.","Citizenship for all Native Americans came in 1924."],"a":3},{"id":"u2q37","u":2,"th":"cul","d":"m","pool":"A","s":"Herbert Spencer and William Graham Sumner are associated with which idea?","st":"","o":["pragmatism, which judged ideas by their practical results","Social Darwinism, the view that competition rewards the \"fittest\" and government should not aid the poor","the single tax on land","the frontier thesis about American democracy","the Social Gospel, which called on churches to address poverty"],"e":["Pragmatism is associated with William James and John Dewey.","They applied \"survival of the fittest\" to society to justify inequality and laissez-faire.","That was Henry George.","That was Frederick Jackson Turner.","The Social Gospel (Rauschenbusch) rejected Social Darwinist indifference."],"a":1},{"id":"u2q38","u":2,"th":"cul","d":"m","pool":"A","s":"The author of this passage most likely believed that","st":"<p>\"The man who dies thus rich dies disgraced... The true antidote for the temporary unequal distribution of wealth is the reconciliation of the rich and the poor.\"<\/p>","o":["the government should confiscate large fortunes through taxation","workers should seize control of factories","wealth should be passed intact to one's children","the wealthy had a duty to use their fortunes for the public good through philanthropy","poverty was caused by a lack of religious faith"],"e":["Carnegie favored voluntary giving rather than government redistribution.","That would be a socialist or anarchist view, not Carnegie's.","Carnegie explicitly opposed leaving vast fortunes to heirs.","This is from Carnegie's \"Gospel of Wealth\" (1889), which urged giving fortunes away for libraries, universities, and other public goods.","The passage concerns the duties of wealth, not religion."],"a":3},{"id":"u2q39","u":2,"th":"cul","d":"h","pool":"quiz","s":"Henry George's <em>Progress and Poverty<\/em> (1879) argued that poverty could be reduced by","st":"","o":["unlimited coinage of silver","a graduated federal income tax","immigration restriction","government ownership of all factories","a single tax on the rising value of land"],"e":["Free silver was the Populists' monetary remedy.","The income tax was a Populist and Progressive demand, adopted in 1913.","George's analysis centered on land, not immigration.","George was not a socialist. That idea is closer to Bellamy's utopia.","George argued that land speculation captured wealth created by society, and that taxing land values would make other taxes unnecessary."],"a":4},{"id":"u2q40","u":2,"th":"cul","d":"m","pool":"B","s":"Edward Bellamy's novel <em>Looking Backward<\/em> (1888) presented","st":"","o":["a defense of Social Darwinism","a utopian vision of a cooperative, socialist society in the year 2000","the life of a riverboat boy on the Mississippi","the struggles of immigrants in Chicago's meatpacking plants","an account of broken treaties with Native Americans"],"e":["Bellamy's novel attacked competitive capitalism.","The bestseller imagined the end of competition and inspired \"Nationalist\" clubs.","That is Twain's <em>Adventures of Huckleberry Finn<\/em>.","That is Sinclair's <em>The Jungle<\/em> (1906).","That is Helen Hunt Jackson's <em>A Century of Dishonor<\/em>."],"a":1},{"id":"u2q41","u":2,"th":"cul","d":"m","pool":"B","s":"Frederick Jackson Turner's \"frontier thesis\" (1893) argued that","st":"","o":["the frontier had been settled mainly by European aristocrats","cities, not the frontier, were the true source of American values","the United States should avoid overseas expansion","Native Americans had been treated justly on the frontier","the frontier experience had shaped American democracy and individualism, and its closing marked the end of an era"],"e":["Turner emphasized ordinary settlers and democratic leveling.","Turner stressed the frontier, not cities.","Some read Turner as implying that new frontiers abroad were needed. He did not argue for avoiding expansion.","Turner largely ignored Native perspectives. He did not argue this.","Turner's essay, prompted by the 1890 census, was among the most influential interpretations of American history."],"a":4},{"id":"u2q42","u":2,"th":"cul","d":"m","pool":"quiz","s":"Stephen Crane's <em>Maggie: A Girl of the Streets<\/em> and Theodore Dreiser's <em>Sister Carrie<\/em> are examples of literary","st":"","o":["the Harlem Renaissance","naturalism, which portrayed characters shaped by harsh social and economic forces","romanticism, which celebrated nature and the individual spirit","modernism of the Lost Generation","Transcendentalism, which sought spiritual truth in nature"],"e":["The Harlem Renaissance was a 1920s African American cultural movement.","Naturalist writers showed people trapped by environment and heredity, often in urban poverty.","Romanticism (Emerson, Thoreau) was the pre–Civil War style.","The Lost Generation wrote in the 1920s.","Transcendentalism was an 1830s–1850s movement."],"a":1},{"id":"u2q43","u":2,"th":"cul","d":"m","pool":"quiz","s":"The Social Gospel movement of the late nineteenth century urged","st":"","o":["businesses to follow Social Darwinist principles","Christians to withdraw from politics and focus on the afterlife","churches and Christians to address urban poverty, labor exploitation, and other social problems","missionaries to convert Native Americans by force","the government to establish an official national church"],"e":["The Social Gospel criticized Social Darwinism.","The Social Gospel urged social engagement.","Ministers like Walter Rauschenbusch argued that Christianity required reforming society, not just saving individual souls.","The Social Gospel focused on urban industrial problems.","The movement did not seek an established church."],"a":2},{"id":"u2q44","u":2,"th":"cul","d":"h","pool":"A","s":"Helen Hunt Jackson's <em>A Century of Dishonor<\/em> (1881) helped shape federal policy by","st":"","o":["persuading Congress to restrict Chinese immigration","leading directly to restoration of all treaty lands","building public sympathy for Native Americans, which reformers channeled into the assimilationist Dawes Act","convincing Americans to annex Hawaii","exposing tenement conditions and leading to housing codes"],"e":["Chinese exclusion had separate origins.","No lands were restored. Allotment cost Native nations more land.","Jackson exposed broken treaties. Reformers then pursued allotment and assimilation, which proved disastrous for Native landholding.","The book concerned Native Americans.","That was Riis's work."],"a":2},{"id":"u2q45","u":2,"th":"cul","d":"h","pool":"quiz","s":"Thorstein Veblen's phrase \"conspicuous consumption\" refers to","st":"","o":["the buying of goods on credit in the 1920s","the lavish display of wealth by the rich to signal social status","workers' spending on necessities such as food and rent","government purchases during wartime","farmers' purchases through mail-order catalogs"],"e":["Installment buying spread in the 1920s. Veblen's phrase came earlier and meant something different.","Veblen's <em>The Theory of the Leisure Class<\/em> (1899) satirized the extravagant lifestyles of the Gilded Age elite.","Veblen's term described waste by the wealthy, not workers' necessities.","The term concerns private status display.","Catalog shopping was a practical rural convenience, not Veblen's concept."],"a":1},{"id":"u2q46","u":2,"th":"dip","d":"h","pool":"quiz","s":"The Treaty of Washington (1871) between the United States and Great Britain is significant because it","st":"","o":["set the border between Canada and Oregon at the 49th parallel","ended the War of 1812","transferred Alaska to the United States","submitted the Alabama claims, over damage done by British-built Confederate raiders, to international arbitration","established an alliance against Spain"],"e":["That was the Oregon Treaty of 1846.","That was the Treaty of Ghent (1814).","Alaska was bought from Russia in 1867.","The arbitration awarded the U.S. $15.5 million and eased Anglo-American tensions.","No such alliance existed. The U.S. fought Spain alone in 1898."],"a":3},{"id":"u2q47","u":2,"th":"dip","d":"h","pool":"quiz","s":"Secretary of State James G. Blaine organized the first Pan-American Conference in 1889 primarily to","st":"","o":["end the Spanish-American War","negotiate the purchase of the Panama Canal Zone","expand U.S. trade and influence in Latin America","annex Cuba and Puerto Rico","create a military alliance against Germany"],"e":["That war took place in 1898.","The Canal Zone was acquired in 1903–1904.","The conference reflected growing U.S. interest in hemispheric markets and leadership, a prelude to 1890s expansionism.","Puerto Rico was acquired in 1898, and Cuba was never annexed.","No such alliance came out of the conference."],"a":2},{"id":"u3q01","u":3,"th":"pol","d":"e","pool":"A","s":"Which of the following was a demand of the Populist Party's Omaha Platform of 1892?","st":"","o":["Repeal of the Fifteenth Amendment","Free and unlimited coinage of silver","Return to the gold standard","Private ownership of the telegraph system","Higher protective tariffs on manufactured goods"],"e":["The Platform did not call for repeal of any amendment.","Populists wanted to inflate the currency to raise crop prices and ease farm debts.","Populists opposed the gold standard. Its defenders were bankers and Republicans.","Populists demanded government ownership of railroads and telegraphs.","Populists opposed high tariffs, which raised the prices farmers paid."],"a":1},{"id":"u3q02","u":3,"th":"pol","d":"e","pool":"diag","s":"William Jennings Bryan's \"Cross of Gold\" speech of 1896 attacked","st":"","o":["prohibition of alcohol","the annexation of the Philippines","the Pullman Strike's labor leaders","the creation of the Federal Reserve","the gold standard, which Bryan said crushed debtors and farmers"],"e":["Bryan later backed prohibition, but the Cross of Gold speech concerned currency.","Bryan did oppose imperialism, but in 1900. The 1896 speech was about money.","The speech was not about Pullman.","The Federal Reserve was created in 1913.","Bryan argued that tying the currency to gold kept money scarce and prices low, hurting producers."],"a":4},{"id":"u3q03","u":3,"th":"pol","d":"m","pool":"quiz","s":"The presidential election of 1896 is considered a turning point because it","st":"","o":["brought the Populists to power in Congress","was the first election in which women voted nationally","established free silver as national policy","was decided by the House of Representatives","began a long period of Republican dominance and effectively ended the Populist Party as an independent force"],"e":["The Populists faded after 1896.","Women voted nationally first in 1920.","McKinley's victory led to the Gold Standard Act (1900).","That happened in 1800 and 1824, not 1896.","McKinley's victory realigned politics. Fusion with the Democrats absorbed the Populists, and Republicans controlled the White House for most years until 1932."],"a":4},{"id":"u3q04","u":3,"th":"pol","d":"m","pool":"quiz","s":"The Seventeenth Amendment (1913) changed the federal government by","st":"","o":["authorizing a federal income tax","requiring the direct popular election of U.S. senators","limiting presidents to two terms","prohibiting the manufacture and sale of alcohol","granting women the right to vote"],"e":["That was the Sixteenth Amendment.","Before 1913, state legislatures chose senators, a system Progressives and Populists saw as corrupt.","That was the Twenty-second Amendment (1951).","That was the Eighteenth Amendment.","That was the Nineteenth Amendment."],"a":1},{"id":"u3q05","u":3,"th":"pol","d":"m","pool":"A","s":"The initiative, referendum, and recall were Progressive reforms designed to","st":"","o":["restrict voting to property owners","give voters more direct control over legislation and officeholders","increase the president's power over Congress","strengthen the power of political machines","regulate interstate railroads"],"e":["Progressives sought broader (if not universal) popular control.","They let citizens propose laws, vote on them directly, and remove officials, bypassing machine-controlled legislatures.","These were mainly state and local reforms.","They were aimed against machines.","Railroad regulation came through the ICC and the Hepburn Act."],"a":1},{"id":"u3q06","u":3,"th":"pol","d":"m","pool":"A","s":"Theodore Roosevelt earned the nickname \"trust buster\" largely because his administration","st":"","o":["broke up Standard Oil in 1911","successfully prosecuted the Northern Securities Company under the Sherman Antitrust Act","abolished all large corporations","passed the Clayton Antitrust Act","created the Federal Reserve System"],"e":["The Standard Oil breakup came under Taft.","The 1904 Supreme Court decision dissolving the railroad holding company revived antitrust enforcement.","Roosevelt distinguished \"good\" trusts from \"bad\" ones and regulated rather than abolished most.","Clayton came in 1914 under Wilson.","Wilso deral minimum wage until 1938.","Muller upheld a labor law.","Suffrage was not the issue.","The \"Brandeis brief\" used data on health effects. It was a Progressive success, though it rested on ideas about women's physical weakness."],"a":4},{"id":"u3q18","u":3,"th":"soc","d":"m","pool":"diag","s":"The NAACP, founded in 1909, differed from Booker T. Washington's approach by","st":"","o":["focusing exclusively on vocational education","promoting emigration to Africa","using lawsuits, publicity, and political pressure to demand equal rights","urging African Americans to accept segregation temporarily","refusing all white members"],"e":["Vocational emphasis was Washington's program.","That was Marcus Garvey's later movement.","The NAACP (Du Bois, Ida B. Wells, white progressives) challenged discrimination directly, especially in the courts.","That was Washington's Atlanta Compromise strategy.","The NAACP was interracial from its founding."],"a":2},{"id":"u3q19","u":3,"th":"soc","d":"m","pool":"B","s":"Which statement best describes the Progressive Era's record on race?","st":"","o":["Progressives successfully abolished poll taxes.","Most white Progressives did little to challenge segregation, and Wilson's administration segregated federal offices.","The Seventeenth Amendment restored Black voting rights in the South.","Progressives passed federal laws ending segregation in the South.","Progressive presidents ended lynching through federal legislation."],"e":["The poll tax in federal elections was abolished in 1964.","Disfranchisement and Jim Crow expanded during the era, which is why Black activists organized the Niagara Movement and the NAACP.","The Seventeenth Amendment concerned senators' election, not race.","No such federal laws passed until the 1960s.","Federal anti-lynching bills failed repeatedly."],"a":1},{"id":"u3q20","u":3,"th":"soc","d":"h","pool":"quiz","s":"The Industrial Workers of the World (IWW), founded in 1905, differed from the American Federation o :"Which of the following best describes how federal housing policy shaped postwar suburbs?","st":"","o":["Suburbs grew only in the Northeast.","FHA and VA mortgages made homes affordable for many white families, while redlining and restrictive covenants excluded most Black families.","Federal policy required all new suburbs to be racially integrated.","The government built most suburban homes directly.","Federal programs discouraged home ownership in favor of renting."],"e":["Suburbs grew nationwide, especially in the Sun Belt.","Federal policy subsidized suburbanization and deepened residential segregation.","Integration was not required. Discrimination was often built into the policy.","Private builders built them, with federal mortgage backing.","Federal programs strongly encouraged home ownership."],"a":1},{"id":"u7q23","u":7,"th":"soc","d":"m","pool":"B","s":"In the 1950s, the federal \"termination\" policy toward Native Americans aimed to","st":"","o":["strengthen tribal self-government","restore tribal lands taken under the Dawes Act","grant Native Americans citizenship for the first time","end federal recognition of tribes and encourage relocation to cities","create new reservations in the West"],"e":["That was the 1934 Indian Reorganization Act's aim.","Termination took away federal support.","Citizenship came in 1924.","Termination reversed the Indian New Deal. It was abandoned in the 1960s–70s as tribes pushed for self-determination.","Termination sought to end the reservation system's federal role."],"a":3},{"id":"u7q24","u":7,"th":"soc","d":"m","pool":"quiz","s":"Jackie Robinson's joining the Brooklyn Dodgers in 1947 was significant because it","st":"","o":["broke the color line in Major League Baseball and became an early symbol of postwar integration","ended segregation in the armed forces","was ordered by the Supreme Court","was opposed by the NAACP","led to the Brown v. Board decision"],"e":["Robinson's success under intense abuse foreshadowed the civil rights movement.","Military desegregation came through Truman's 1948 order.","It was a decision by Dodgers executive Branch Rickey.","The NAACP celebrated it.","Brown came out of NAACP legal work on schools."],"a":0},{"id":"u7q25","u":7,"th":"soc","d":"m","pool":"A","s":"A major social consequence of the growth of suburbs in the 1950s was","st":"","o":["the decline of many inner cities as middle-class residents and businesses moved out","a sharp drop in home ownership","a decline in church membership","the end of automobile commuting","a decrease in racial segregation in housing"],"e":["Lost tax bases and segregated housing left cities with concentrated poverty.","Home ownership rose to historic highs.","Church membership rose in the 1950s.","Suburbs depended on cars.","Segregation hardened through suburban exclusion."],"a":0},{"id":"u7q26","u":7,"th":"soc","d":"h","pool":"B","s":"The Second Red Scare differed from the first Red Scare (1919–1920) in that the Second Red Scare","st":"","o":["was opposed by both major political parties from the start","targeted mainly southern and eastern European immigrants","lasted only a few months","was tied to Cold War espionage cases and focused heavily on government employees and Hollywood","led to the deportation of Sacco and Vanzetti"],"e":["Politicians of both parties participated.","That describes the first Red Scare's Palmer Raids.","It ran from about 1947 into the mid-1950s.","Unlike the immigrant-focused Palmer Raids, the 1940s–50s scare targeted federal workers, entertainers, and intellectuals amid real Soviet spying cases.","Sacco and Vanzetti were executed in 1927."],"a":3},{"id":"u7q27","u":7,"th":"soc","d":"m","pool":"A","s":"The 1950s ideal of family life, as presented in television shows and magazines, emphasized","st":"","o":["the flapper's independence","communal living and rejection of consumer goods","women's leadership in corporate and political life","urban apartment living for large extended families","a suburban household with a breadwinner father and a homemaker mother"],"e":["The flapper was a 1920s image.","Communes were part of the 1960s counterculture.","Women's leadership was not the 1950s ideal.","The ideal was the suburban nuclear family.","The image ignored the growing number of married women in paid work and the diversity of families."],"a":4},{"id":"u7q28","u":7,"th":"eco","d":"e","pool":"quiz","s":"Which of the following contributed to American economic prosperity in the 1950s?","st":"","o":["High consumer demand, government spending on defense and highways, and the GI Bill","Severe shortages of oil and gasoline","Heavy competition from rebuilt European and Japanese industries","A sharp decline in the birth rate","The collapse of labor unions"],"e":["Pent-up savings, the baby boom, and federal spending all fueled growth.","Cheap energy, not shortages, marked the 1950s. The shortages came in the 1970s.","Foreign competition was limited in the 1950s.","The birth rate soared during the baby boom.","Unions were at peak strength in the 1950s."],"a":0},{"id":"u7q29","u":7,"th":"eco","d":"m","pool":"B","s":"The Employment Act of 1946 committed the federal government to","st":"","o":["return to the gold standard","abolish the minimum wage","promote maximum employment, production, and purchasing power, and created the Council of Economic Advisers","end all government spending on public works","guarantee a job to every adult citizen"],"e":["The gold standard was not restored.","The act did not affect the minimum wage.","The act made economic management a permanent federal responsibility, reflecting Keynesian ideas.","The act did not limit spending in that way.","A guaranteed-jobs version was proposed but rejected."],"a":2},{"id":"u7q30","u":7,"th":"eco","d":"h","pool":"B","s":"Economist John Kenneth Galbraith's <em>The Affluent Society<\/em> (1958) argued that","st":"","o":["government spending should be eliminated entirely","Social Darwinism explained American success","the frontier had closed and the economy would stagnate","the United States was in a deep economic depression","America's private wealth existed alongside neglected public needs such as schools and parks"],"e":["Galbraith favored more public investment.","Galbraith was a liberal critic of unregulated markets.","That echoes Turner's frontier thesis.","The 1950s were prosperous.","Galbraith criticized the imbalance between private consumption and public investment."],"a":4},{"id":"u7q31","u":7,"th":"cul","d":"e","pool":"quiz","s":"Jack Kerouac's <em>On the Road<\/em> and Allen Ginsberg's <em>Howl<\/em> are associated with the","st":"","o":["Beat Generation, which rejected 1950s conformity and materialism","muckrakers","New Deal Federal Writers' Project","Harlem Renaissance","Lost Generation"],"e":["The Beats celebrated spontaneity, jazz, and personal freedom, foreshadowing the 1960s counterculture.","The muckrakers were Progressive Era journalists.","The Beats came after the New Deal.","The Harlem Renaissance was a 1920s movement.","The Lost Generation wrote in the 1920s."],"a":0},{"id":"u7q32","u":7,"th":"cul","d":"e","pool":"B","s":"The Soviet launch of Sputnik in 1957 led the United States to","st":"","o":["end the Cold War","cut defense spending sharply","withdraw from the space race","sign a treaty banning all satellites","create NASA and increase federal funding for science and math education"],"e":["The Cold War intensified.","Defense and missile spending rose.","The U.S. accelerated its space program.","No such treaty was signed.","The National Defense Education Act (1958) funded science, math, and language programs."],"a":4},{"id":"u7q33","u":7,"th":"cul","d":"m","pool":"quiz","s":"David Riesman's <em>The Lonely Crowd<\/em> and William Whyte's <em>The Organization Man<\/em> criticized 1950s America for","st":"","o":["the spread of communism in labor unions","the poverty of the Dust Bowl","excessive individualism and rebellion","the failure of the New Deal","conformity and the pressure to fit in with peers and corporate expectations"],"e":["They wrote about middle-class culture.","That was a 1930s theme.","They argued the reverse: too little individualism.","Their focus was social character, not the New Deal.","Riesman described \"other-directed\" people. Whyte described employees who subordinated themselves to corporations."],"a":4},{"id":"u7q34","u":7,"th":"cul","d":"m","pool":"quiz","s":"Early rock and roll music in the 1950s drew heavily on","st":"","o":["Native American ceremonial music","African American rhythm and blues, combined with country music","government propaganda songs","Big Band swing exclusively","European classical opera"],"e":["That was not a major source.","Artists like Chuck Berry, Little Richard, and Elvis Presley blended these traditions, crossing racial lines in popular culture.","Rock developed commercially.","Swing influenced popular music, but rock drew mostly on R&amp;B and country.","Rock's roots were American popular music."],"a":1},{"id":"u7q35","u":7,"th":"cul","d":"m","pool":"B","s":"Arthur Miller's play <em>The Crucible<\/em> (1953), set during the Salem witch trials, was widely understood as a commentary on","st":"","o":["the civil rights movement","McCarthyism and the anti-communist hunts of the early 1950s","the Vietnam War","the Great Depression","the Scopes Trial"],"e":["The allegory centered on the Red Scare.","Miller drew parallels between the witch hunts and contemporary loyalty investigations.","Vietnam was not yet a U.S. war in 1953.","The play's allegory concerned 1950s politics.","The parallel was to McCarthyism."],"a":1},{"id":"u7q36","u":7,"th":"cul","d":"m","pool":"B","s":"During the 1950s, the addition of \"under God\" to the Pledge of Allegiance reflected","st":"","o":["a decline in American religious life","a Supreme Court ruling requiring school prayer","a religious revival linked to Cold War contrasts with \"godless\" communism","the influence of the Beat Generation","the end of the Cold War"],"e":["Religious participation rose.","In 1962 the Court ruled against official school prayer.","Church membership rose, and leaders like Billy Graham drew huge crowds.","The Beats were not part of this mainstream religiosity.","The Cold War was intensifying."],"a":2},{"id":"u7q37","u":7,"th":"cul","d":"m","pool":"A","s":"By 1960, television had become a dominant force in American culture, which","st":"","o":["spread a common national popular culture and expanded the reach of advertising","caused radio to disappear entirely","had no effect on politics","was available only in cities","was controlled directly by the federal government"],"e":["Nearly 90% of households had a set, and television shaped consumer tastes and politics.","Radio adapted with music formats.","TV mattered greatly in the McCarthy hearings and the 1960 debates.","TV spread to suburbs and rural areas.","Networks were private companies regulated by the FCC."],"a":0},{"id":"u7q38","u":7,"th":"cul","d":"h","pool":"A","s":"J.D. Salinger's <em>The Catcher in the Rye<\/em> (1951) resonated with young readers because its narrator, Holden Caulfield,","st":"","o":["became a successful corporate executive","expressed alienation from adult \"phoniness\" and conformity","fought in the Korean War","celebrated suburban family life","led a civil rights protest"],"e":["Holden is a troubled teenager.","The novel became a touchstone for postwar youth disaffection.","The novel is not about the war.","Holden rejects conventional adult society.","The novel does not deal with civil rights activism."],"a":1},{"id":"u7q39","u":7,"th":"cul","d":"h","pool":"A","s":"Abstract Expressionist painters such as Jackson Pollock are significant in American cultural history because they","st":"","o":["produced Pop Art based on consumer products","were employed by the WPA to paint post office murals","led the Ashcan School","helped shift the center of the Western art world from Paris to New York after World War II","painted realistic scenes of rural Midwestern life"],"e":["Pop Art (Warhol) came in the 1960s.","Some had WPA backgrounds, but their postwar fame came from abstract work.","The Ashcan School was early-twentieth-century urban realism.","Pollock's \"drip\" paintings made New York the capital of avant-garde art.","That was Regionalism (Grant Wood, Thomas Hart Benton)."],"a":3},{"id":"u7q40","u":7,"th":"cul","d":"m","pool":"quiz","s":"Jonas Salk's development of a polio vaccine in the mid-1950s was celebrated as","st":"","o":["a Soviet achievement copied by the U.S.","a government program that failed","a triumph of American medical science that conquered a feared childhood disease","a product of the Manhattan Project","the reason for the baby boom"],"e":["Salk was an American researcher.","The vaccine was a major success.","Mass vaccination dramatically cut polio cases.","Salk's work was medical research funded largely by the March of Dimes.","The baby boom began earlier, in 1946."],"a":2}],"units":[{"n":1,"title":"Reconstruction and the New South","years":"1865–1900","period":"early","weight":8,"minutes":10,"lesson":"<h2>The big question<\/h2>\n<p>In 1865 the Union had won the war, and about four million enslaved people were free. Two questions followed. <strong>On what terms would the eleven Confederate states rejoin the Union?<\/strong> And <strong>what would freedom actually mean for formerly enslaved people?<\/strong> The struggle over these questions is called <strong>Reconstruction<\/strong> (1865–1877). The short version: freedpeople won major constitutional rights during Reconstruction. Then the North lost interest, white southern Democrats retook power, and most of those rights were stripped away by 1900.<\/p>\n<h2>Presidential Reconstruction (1865–1866)<\/h2>\n<p>Lincoln had planned a lenient restoration. Under his <strong>Ten Percent Plan<\/strong> (1863), a state could form a new government once 10% of its 1860 voters swore loyalty to the Union. Congress pushed back with the harsher <strong>Wade-Davis Bill<\/strong>, which required 50% and an \"ironclad oath,\" but Lincoln pocket-vetoed it. Lincoln was assassinated in April 1865, and <strong>Andrew Johnson<\/strong>, a pro-Union Democrat from Tennessee, became president.<\/p>\n<p>Johnson pardoned thousands of ex-Confederates and let the old southern elite rebuild state governments. Those governments passed <strong>Black Codes<\/strong>. These laws limited freedpeople's right to own or rent land, required them to sign yearly labor contracts, and let authorities arrest unemployed Black men for \"vagrancy\" and hire them out. Johnson also returned land confiscated during the war to its prewar owners. That ended the hopes raised by General Sherman's Field Order No. 15 that freedpeople would get <strong>\"forty acres and a mule.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Johnson's lenient pardons; old elites back in power<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Southern states pass Black Codes; anti-Black riots in Memphis and New Orleans (1866)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Northern voters elect a Republican supermajority in 1866; Congress takes over Reconstruction<\/div><\/div>\n<p>The <strong>Thirteenth Amendment<\/strong> (ratified December 1865) abolished slavery. Congress also created the <strong>Freedmen's Bureau<\/strong> (1865). It provided food and medical care and supervised labor contracts. Its most lasting work was <strong>education<\/strong>: with northern missionary societies, it helped found schools and colleges such as <strong>Howard<\/strong> and <strong>Fisk<\/strong>.<\/p>\n<h2>Congressional (Radical) Reconstruction (1867–1877)<\/h2>\n<p>The <strong>Radical Republicans<\/strong>, led by <strong>Thaddeus Stevens<\/strong> in the House and <strong>Charles Sumner<\/strong> in the Senate, wanted to remake southern society and protect Black rights. Congress passed the <strong>Civil Rights Act of 1866<\/strong> over Johnson's veto. Then, to put those rights beyond the reach of future majorities, it wrote the <strong>Fourteenth Amendment<\/strong> (ratified 1868). The amendment made everyone born in the U.S. a <strong>citizen<\/strong> and barred states from denying anyone <strong>\"due process\"<\/strong> or <strong>\"equal protection of the laws.\"<\/strong> It later became the foundation of the twentieth-century civil rights revolution.<\/p>\n<p>When southern states refused to ratify it, Congress passed the <strong>Reconstruction Acts of 1867<\/strong>. These acts divided the former Confederacy (except Tennessee, already readmitted) into <strong>five military districts<\/strong>. To be readmitted, a state had to write a new constitution guaranteeing <strong>Black male suffrage<\/strong> and ratify the Fourteenth Amendment.<\/p>\n<p>Congress also passed the <strong>Tenure of Office Act<\/strong>, which barred the president from removing certain officials without Senate approval. Johnson fired Secretary of War Edwin Stanton anyway, and in 1868 the House <strong>impeached<\/strong> him. The Senate fell <strong>one vote<\/strong> short of removing him. Johnson finished his term with little power left.<\/p>\n<p><strong>Ulysses S. Grant<\/strong> won the presidency in 1868. The <strong>Fifteenth Amendment<\/strong> (1870) barred denying the vote on account of <strong>\"race, color, or previous condition of servitude.\"<\/strong> It did not mention sex, which angered woman suffrage leaders and split their movement.<\/p>\n<h3>Reconstruction governments in the South<\/h3>\n<p>Southern Republican governments drew support from three groups:<\/p>\n<ul><li>freedmen, who voted in large numbers<\/li><li><strong>\"carpetbaggers\"<\/strong>, northerners who moved South<\/li><li><strong>\"scalawags\"<\/strong>, white southerners who joined the Republicans<\/li><\/ul>\n<p>About 2,000 Black men held office. <strong>Hiram Revels<\/strong> of Mississippi became the <strong>first African American U.S. senator<\/strong> (1870). These governments created the South's first <strong>public school systems<\/strong> and rebuilt railroads, but they also ran up debt and suffered some corruption, which opponents exaggerated.<\/p>\n<p>Freedpeople built independent lives. They <strong>reunited families<\/strong>, legalized marriages, and founded <strong>Black churches<\/strong>, which became the center of community and political life. They also flocked to schools.<\/p>\n<h3>Violence and retreat<\/h3>\n<p>The <strong>Ku Klux Klan<\/strong> (founded 1866) and similar groups used terror to keep Black men from voting. Congress answered with the <strong>Enforcement Acts<\/strong> and the <strong>Ku Klux Klan Act<\/strong> (1870–71), which let federal troops and courts crush the first Klan. But northern commitment faded for several reasons:<\/p>\n<ul><li>the <strong>Panic of 1873<\/strong> turned voters' attention to the economy<\/li><li>scandals in Grant's administration, including the <strong>Crédit Mobilier<\/strong> railroad bribery scheme and the <strong>Whiskey Ring<\/strong> tax fraud, discredited Republican rule<\/li><li>northern racism made voters weary of the \"southern question\"<\/li><\/ul>\n<p>The Supreme Court also narrowed the new amendments. In the <strong>Slaughterhouse Cases<\/strong> (1873), the Court read the Fourteenth Amendment's protections narrowly. <strong>U.S. v. Cruikshank<\/strong> (1876) overturned convictions from the <strong>Colfax Massacre<\/strong> and left protection of Black citizens mostly to the states.<\/p>\n<h2>The end of Reconstruction: the Compromise of 1877<\/h2>\n<p>The <strong>election of 1876<\/strong> between <strong>Rutherford B. Hayes<\/strong> (Republican) and <strong>Samuel Tilden<\/strong> (Democrat) hinged on disputed electoral votes from three southern states. In the informal <strong>Compromise of 1877<\/strong>, Democrats accepted Hayes as president, and Hayes <strong>withdrew the last federal troops<\/strong> from southern statehouses. Southern Democrats who called themselves <strong>\"Redeemers\"<\/strong> took over every southern state.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Northern fatigue, depression, violence, court rulings<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Compromise of 1877 removes federal troops<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>\"Redeemer\" Democrats rule the South; Black rights erode<\/div><\/div>\n<h2>The \"New South\" and Jim Crow (1877–1900)<\/h2>\n<p>Atlanta editor <strong>Henry Grady<\/strong> promoted a <strong>\"New South\"<\/strong> of factories, railroads, and diversified farming. Some industry did grow: <strong>textile mills<\/strong>, <strong>Birmingham steel<\/strong>, and <strong>tobacco<\/strong> (James B. Duke's American Tobacco Company). But the South stayed poor and mostly agricultural, and northern capital often owned its industry.<\/p>\n<h3>The farm trap<\/h3>\n<p>Without land, most freedpeople, and many poor whites, became <strong>sharecroppers<\/strong>. They farmed a landowner's land in exchange for a share of the crop, often half. Others were <strong>tenant farmers<\/strong> who rented land. Under the <strong>crop-lien system<\/strong>, local merchants supplied seed and food on credit, secured by a lien on the coming crop. High interest and low cotton prices kept families in <strong>permanent debt<\/strong>.<\/p>\n<h3>Jim Crow and disfranchisement<\/h3>\n<p>By the 1890s southern states built a system of legal segregation known as <strong>Jim Crow<\/strong>. To get around the Fifteenth Amendment, they used:<\/p>\n<ul><li><strong>poll taxes<\/strong><\/li><li><strong>literacy tests<\/strong>, applied unfairly by white registrars<\/li><li><strong>white primaries<\/strong><\/li><li><strong>grandfather clauses<\/strong>, which excused a man from these tests if his grandfather could vote before 1867, so poor whites kept the vote<\/li><\/ul>\n<p>The Supreme Court went along:<\/p>\n<ul><li><strong>Civil Rights Cases (1883):<\/strong> struck down the Civil Rights Act of 1875, holding that the Fourteenth Amendment limits <em>state<\/em> action, not private businesses.<\/li><li><strong>Plessy v. Ferguson (1896):<\/strong> upheld segregated railroad cars under the doctrine of <strong>\"separate but equal.\"<\/strong> Justice <strong>John Marshall Harlan<\/strong> dissented alone: \"Our Constitution is color-blind.\"<\/li><\/ul>\n<p><strong>Lynching<\/strong> peaked in the 1890s. Journalist <strong>Ida B. Wells<\/strong> exposed it in pamphlets such as <em>Southern Horrors<\/em> (1892). Some Black southerners left. The <strong>Exodusters<\/strong> moved to Kansas in 1879.<\/p>\n<h3>Two Black strategies<\/h3>\n<p><strong>Booker T. Washington<\/strong> founded the <strong>Tuskegee Institute<\/strong> (1881). In his <strong>Atlanta Compromise<\/strong> speech (1895), he urged Black southerners to accept segregation for now and focus on <strong>vocational education<\/strong> and economic self-help. <strong>W.E.B. Du Bois<\/strong> answered in <em>The Souls of Black Folk<\/em> (1903). He demanded <strong>full civil and political rights now<\/strong> and higher education for a <strong>\"Talented Tenth\"<\/strong> of leaders. (Du Bois's later work is in Unit 3.)<\/p>\n<p>Meanwhile, white southerners built the <strong>\"Lost Cause\"<\/strong> memory of the war. It cast the Confederacy as a noble fight for states' rights rather than slavery. Monuments and textbooks spread this view for generations.<\/p>\n<h3>One diplomatic footnote<\/h3>\n<p>In 1867 Secretary of State <strong>William Seward<\/strong> bought <strong>Alaska<\/strong> from Russia for $7.2 million. Critics mocked it as \"Seward's Folly.\"<\/p>","mustknow":["<strong>13th Amendment<\/strong> (1865) abolished slavery. <strong>14th<\/strong> (1868) gave citizenship plus <strong>equal protection<\/strong> and <strong>due process<\/strong>. <strong>15th<\/strong> (1870) barred race-based denial of the vote.","<strong>Black Codes<\/strong> (1865–66): southern laws restricting freedpeople's labor and movement. They provoked <strong>Radical Reconstruction<\/strong>.","<strong>Reconstruction Acts of 1867<\/strong>: five military districts; readmission required Black male suffrage and ratifying the 14th Amendment.","<strong>Johnson's impeachment<\/strong> (1868) came from firing Stanton in violation of the <strong>Tenure of Office Act<\/strong>. He was acquitted by one vote.","<strong>Freedmen's Bureau<\/strong>: aid, labor contracts, and especially <strong>schools<\/strong> (Howard, Fisk).","<strong>Sharecropping + crop-lien<\/strong> = a cycle of debt for Black and poor white farmers.","<strong>Compromise of 1877<\/strong>: Hayes becomes president and federal troops leave the South. Reconstruction ends.","<strong>Plessy v. Ferguson<\/strong> (1896) = \"separate but equal.\" Harlan's dissent: \"color-blind.\"","Disfranchisement tools: <strong>poll tax, literacy test, grandfather clause, white primary<\/strong>.","<strong>Booker T. Washington<\/strong> (accommodation, Tuskegee, Atlanta Compromise) vs. <strong>W.E.B. Du Bois<\/strong> (immediate rights, Talented Tenth)."],"timeline":[{"y":"1863","t":"Lincoln's Ten Percent Plan","key":false},{"y":"1865","t":"Lincoln assassinated; Freedmen's Bureau created; 13th Amendment ratified; Black Codes begin","key":true},{"y":"1866","t":"Civil Rights Act passed over Johnson's veto; Ku Klux Klan founded","key":false},{"y":"1867","t":"Reconstruction Acts (military districts); Tenure of Office Act; Alaska purchased","key":true},{"y":"1868","t":"Johnson impeached and acquitted; 14th Amendment ratified; Grant elected","key":true},{"y":"1870","t":"15th Amendment; Hiram Revels first Black U.S. senator","key":true},{"y":"1870–71","t":"Enforcement Acts and Ku Klux Klan Act","key":false},{"y":"1873","t":"Panic of 1873; Slaughterhouse Cases; Colfax Massacre","key":false},{"y":"1876","t":"Disputed Hayes–Tilden election; U.S. v. Cruikshank","key":false},{"y":"1877","t":"Compromise of 1877: troops withdrawn, Reconstruction ends","key":true},{"y":"1879","t":"Exoduster migration to Kansas","key":false},{"y":"1881","t":"Booker T. Washington opens Tuskegee Institute","key":false},{"y":"1883","t":"Civil Rights Cases strike down Civil Rights Act of 1875","key":false},{"y":"1890","t":"Mississippi constitution adds poll tax and literacy test","key":false},{"y":"1892","t":"Ida B. Wells publishes <em>Southern Horrors<\/em>","key":false},{"y":"1895","t":"Washington's Atlanta Compromise speech","key":false},{"y":"1896","t":"Plessy v. Ferguson: \"separate but equal\"","key":true}],"cards":[{"id":"u1c01","f":"Thirteenth Amendment (1865)","b":"Abolished slavery and involuntary servitude, except as punishment for a crime."},{"id":"u1c02","f":"Fourteenth Amendment (1868)","b":"Citizenship for all persons born in the U.S.; states may not deny \"due process\" or \"equal protection of the laws.\" The basis of later civil rights rulings."},{"id":"u1c03","f":"Fifteenth Amendment (1870)","b":"The right to vote cannot be denied because of \"race, color, or previous condition of servitude.\" It left out women."},{"id":"u1c04","f":"Ten Percent Plan vs. Wade-Davis Bill","b":"Lincoln: a state is restored once 10% of 1860 voters swear loyalty. Congress (Wade-Davis): 50% plus an ironclad oath. Lincoln pocket-vetoed it."},{"id":"u1c05","f":"Freedmen's Bureau (1865)","b":"Federal agency that gave freedpeople food and medical care and supervised labor contracts. Its biggest legacy was schools and colleges (Howard, Fisk)."},{"id":"u1c06","f":"Black Codes","b":"Laws passed by southern states in 1865–66 restricting freedpeople's labor, movement, and property rights. They sparked Radical Reconstruction."},{"id":"u1c07","f":"Radical Republicans","b":"Congressional faction (Thaddeus Stevens, Charles Sumner) that pushed for Black civil and voting rights and tough terms for the South."},{"id":"u1c08","f":"Reconstruction Acts of 1867","b":"Split the South into five military districts. Readmission required new constitutions with Black male suffrage and ratification of the 14th Amendment."},{"id":"u1c09","f":"Impeachment of Andrew Johnson (1868)","b":"The House impeached him for firing Secretary of War Stanton in violation of the Tenure of Office Act. The Senate acquitted by one vote."},{"id":"u1c10","f":"Carpetbaggers / Scalawags","b":"Carpetbaggers were northerners who moved South during Reconstruction. Scalawags were white southerners who supported the Republicans."},{"id":"u1c11","f":"Sharecropping","b":"Landless farmers worked a landowner's land in exchange for a share of the crop. It was the dominant labor system for freedpeople."},{"id":"u1c12","f":"Crop-lien system","b":"Merchants advanced seed and supplies on credit, secured by the future crop. High interest kept farmers in endless debt."},{"id":"u1c13","f":"Enforcement Acts / Ku Klux Klan Act (1870–71)","b":"Federal laws that let the government use courts and troops against Klan terror aimed at Black voters."},{"id":"u1c14","f":"Compromise of 1877","b":"Settled the disputed Hayes–Tilden election. Hayes became president and withdrew the last federal troops from the South, ending Reconstruction."},{"id":"u1c15","f":"Redeemers","b":"Southern white Democrats who took back state governments from Republicans in the 1870s and rolled back Reconstruction."},{"id":"u1c16","f":"New South","b":"Henry Grady's vision of an industrialized, diversified southern economy (textiles, steel, tobacco). Only partly achieved."},{"id":"u1c17","f":"Jim Crow disfranchisement tools","b":"Poll taxes, literacy tests, white primaries, and grandfather clauses, used to strip Black men of the vote despite the 15th Amendment."},{"id":"u1c18","f":"Plessy v. Ferguson (1896)","b":"Supreme Court upheld segregated railroad cars under \"separate but equal.\" Justice Harlan dissented: \"Our Constitution is color-blind.\""},{"id":"u1c19","f":"Atlanta Compromise (1895)","b":"Booker T. Washington's speech urging Black southerners to accept segregation for now and pursue vocational education and economic progress."},{"id":"u1c20","f":"Ida B. Wells","b":"Black journalist who led the crusade against lynching (<em>Southern Horrors<\/em>, 1892)."},{"id":"u1c21","f":"Exodusters (1879)","b":"Black southerners who migrated to Kansas to escape the post-Reconstruction South."}]},{"n":2,"title":"The Gilded Age: Industry, Labor, the West, and the Cities","years":"1865–1900","period":"early","weight":12,"minutes":12,"lesson":"<h2>The big picture<\/h2>\n<p>Between the Civil War and 1900 the United States became the world's leading <strong>industrial economy<\/strong>. Railroads, steel, oil, and electricity built enormous fortunes. They also brought dangerous factories, crowded cities, and violent strikes. Mark Twain and Charles Dudley Warner called it <strong>\"The Gilded Age\"<\/strong> (1873): a thin layer of gold over serious problems. This unit has four pieces: <strong>big business<\/strong>, <strong>labor<\/strong>, <strong>immigrants and cities<\/strong>, and <strong>the West<\/strong>. A short section on <strong>politics<\/strong> follows.<\/p>\n<h2>1. Railroads and big business<\/h2>\n<p>The <strong>transcontinental railroad<\/strong> was finished at <strong>Promontory Point, Utah, in 1869<\/strong>. The Union Pacific was built largely by Irish workers and the Central Pacific by Chinese workers. Congress subsidized railroads with huge <strong>land grants<\/strong>. Railroads created a <strong>national market<\/strong> and drove demand for steel and coal. They even led to <strong>standard time zones<\/strong> (1883).<\/p>\n<p>New business strategies created giant corporations:<\/p>\n<ul><li><strong>Andrew Carnegie<\/strong> (steel) used the <strong>Bessemer process<\/strong> and <strong>vertical integration<\/strong>: he owned every stage of production, from iron mines and ore ships to mills and railroads. In 1901 he sold to banker <strong>J.P. Morgan<\/strong>, who created <strong>U.S. Steel<\/strong>, the first <strong>billion-dollar corporation<\/strong>.<\/li><li><strong>John D. Rockefeller<\/strong> (<strong>Standard Oil<\/strong>) used <strong>horizontal integration<\/strong>. He bought out or crushed competing refiners until he controlled about 90% of U.S. refining. He organized the business as a <strong>trust<\/strong> (1882), in which stockholders of many companies handed control to one board of trustees. Later, <strong>holding companies<\/strong> did the same job.<\/li><li>Critics called these men <strong>\"robber barons\"<\/strong>. Admirers called them <strong>\"captains of industry.\"<\/strong><\/li><\/ul>\n<p>New inventions remade daily life. <strong>Alexander Graham Bell<\/strong> invented the telephone (1876). <strong>Thomas Edison<\/strong> set up a research lab at Menlo Park and produced a practical <strong>light bulb<\/strong> (1879). <strong>George Westinghouse<\/strong> promoted alternating current.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Railroads + new technology + cheap immigrant labor + government support<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Rise of giant corporations and trusts<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Huge wealth gap, monopoly power, and a backlash from farmers and workers<\/div><\/div>\n<h3>Ideas that justified (and challenged) big business<\/h3>\n<p><strong>Social Darwinism<\/strong> applied \"survival of the fittest\" to society. <strong>Herbert Spencer<\/strong> and Yale's <strong>William Graham Sumner<\/strong> argued that the rich had earned their place and government should not help the poor. This fit with <strong>laissez-faire<\/strong> economics. <strong>Horatio Alger<\/strong> novels sold the \"rags to riches\" dream.<\/p>\n<p>Carnegie's <strong>\"Gospel of Wealth\"<\/strong> (1889) argued that the rich had a duty to give their fortunes away for the public good, through libraries, universities, and concert halls. \"The man who dies thus rich dies disgraced.\"<\/p>\n<p>Critics pushed back:<\/p>\n<ul><li><strong>Henry George<\/strong>, <em>Progress and Poverty<\/em> (1879), proposed a <strong>\"single tax\"<\/strong> on land values.<\/li><li><strong>Edward Bellamy<\/strong>, <em>Looking Backward<\/em> (1888), imagined a cooperative socialist utopia in the year 2000.<\/li><li><strong>Thorstein Veblen<\/strong> coined <strong>\"conspicuous consumption\"<\/strong> for the wasteful display of the rich (<em>The Theory of the Leisure Class<\/em>, 1899).<\/li><\/ul>\n<h3>First steps at regulation<\/h3>\n<p>Farmers angry at railroad rates won state <strong>\"Granger laws.\"<\/strong> In <strong>Munn v. Illinois<\/strong> (1877), the Supreme Court upheld state regulation of businesses \"clothed with a public interest,\" in that case grain elevators. But <strong>Wabash v. Illinois<\/strong> (1886) ruled that states could not regulate <strong>interstate<\/strong> commerce. Congress responded with two laws:<\/p>\n<ul><li>the <strong>Interstate Commerce Act<\/strong> (1887), which created the <strong>Interstate Commerce Commission<\/strong>, the first federal regulatory agency<\/li><li>the <strong>Sherman Antitrust Act<\/strong> (1890), which outlawed combinations \"in restraint of trade\"<\/li><\/ul>\n<p>Both were weak at first. In <strong>U.S. v. E.C. Knight<\/strong> (1895), the Court ruled that a sugar trust controlling 98% of refining was <em>manufacturing<\/em>, not <em>commerce<\/em>, so the Sherman Act did not reach it. Ironically, the Sherman Act was used more against <strong>labor unions<\/strong> than against trusts in the 1890s.<\/p>\n<h2>2. Labor<\/h2>\n<p>Factory work meant <strong>12-hour days<\/strong>, six-day weeks, child labor, dangerous machines, and no compensation for injuries. Workers organized in two main ways:<\/p>\n<ul><li>The <strong>Knights of Labor<\/strong> (led by <strong>Terence Powderly<\/strong>) welcomed nearly everyone: skilled and unskilled workers, women, and Black workers. It favored the <strong>eight-hour day<\/strong> and cooperatives. It collapsed after being blamed for the Haymarket bombing.<\/li><li>The <strong>American Federation of Labor (AFL, 1886)<\/strong>, led by <strong>Samuel Gompers<\/strong>, was a federation of <strong>skilled craft unions<\/strong>. It practiced <strong>\"bread-and-butter\" unionism<\/strong>: higher wages, shorter hours, better conditions. It used strikes and collective bargaining and avoided radical politics. The AFL survived and grew.<\/li><\/ul>\n<p>The great strikes are tested often. Know who, what, and the result:<\/p>\n<ul><li><strong>Great Railroad Strike (1877):<\/strong> the first nationwide strike, set off by wage cuts. President Hayes sent <strong>federal troops<\/strong>.<\/li><li><strong>Haymarket Square (Chicago, 1886):<\/strong> a bomb exploded at a rally for the eight-hour day. Anarchists were blamed, and a wave of <strong>anti-union, anti-immigrant<\/strong> feeling followed.<\/li><li><strong>Homestead Strike (1892):<\/strong> at Carnegie's steel works, manager <strong>Henry Clay Frick<\/strong> hired <strong>Pinkerton<\/strong> guards. A gun battle followed, the state militia broke the strike, and the steelworkers' union was crushed.<\/li><li><strong>Pullman Strike (1894):<\/strong> <strong>Eugene V. Debs's American Railway Union<\/strong> boycotted Pullman cars and paralyzed the railroads. President <strong>Cleveland<\/strong> sent troops, using a federal court <strong>injunction<\/strong>, on the grounds that the strike interfered with the mail. Debs went to jail and later became a <strong>Socialist<\/strong>.<\/li><\/ul>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Wage cuts and harsh conditions<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Major strikes (1877, 1886, 1892, 1894)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Government sides with employers: troops, injunctions; public links unions to radicalism<\/div><\/div>\n<h2>3. Immigrants and cities<\/h2>\n<p>After about 1880, the <strong>\"New Immigrants\"<\/strong> came mostly from <strong>southern and eastern Europe<\/strong>: Italians, Poles, Russian Jews, Greeks, and Slavs. Most were Catholic, Orthodox, or Jewish, and many were poor. They entered through <strong>Ellis Island<\/strong> (opened 1892). Asian immigrants on the West Coast later passed through <strong>Angel Island<\/strong> (1910).<\/p>\n<p><strong>Nativism<\/strong> (hostility to immigrants) grew. The <strong>Chinese Exclusion Act (1882)<\/strong> was the <strong>first federal law to bar immigrants by nationality<\/strong>. The anti-Catholic <strong>American Protective Association<\/strong> (1887) organized against the newcomers.<\/p>\n<p>Cities exploded. In 1870 about one American in four lived in an urban area. By 1920 it was more than half. Skyscrapers (architect <strong>Louis Sullivan<\/strong>: \"form follows function\"), electric streetcars, and the <strong>Brooklyn Bridge<\/strong> (1883) changed the landscape. The poor crowded into <strong>tenements<\/strong>. Photojournalist <strong>Jacob Riis<\/strong> exposed them in <em>How the Other Half Lives<\/em> (1890).<\/p>\n<p><strong>Political machines<\/strong> such as New York's <strong>Tammany Hall<\/strong>, run by <strong>\"Boss\" William Tweed<\/strong>, traded jobs, food, and favors for immigrant votes, and stole millions. Cartoonist <strong>Thomas Nast<\/strong> helped bring Tweed down.<\/p>\n<p>Reformers responded:<\/p>\n<ul><li><strong>Settlement houses<\/strong>, above all <strong>Jane Addams's Hull House<\/strong> (Chicago, 1889), offered classes, child care, and English lessons, and pushed for reform laws.<\/li><li>The <strong>Social Gospel<\/strong> movement (<strong>Walter Rauschenbusch<\/strong>, Washington Gladden) urged churches to fix social problems on earth.<\/li><li>The <strong>Woman's Christian Temperance Union<\/strong> (<strong>Frances Willard<\/strong>) fought alcohol and became the largest women's organization of the era.<\/li><\/ul>\n<h2>4. The West<\/h2>\n<p>The <strong>Homestead Act<\/strong> (1862) offered <strong>160 acres<\/strong> of public land to settlers who farmed it for five years. The <strong>Morrill Land-Grant Act<\/strong> (1862) funded state agricultural and technical colleges. Mining booms, <strong>cattle drives<\/strong> up trails such as the Chisholm Trail (many cowboys were Black or Mexican), and finally <strong>barbed wire<\/strong> (1874) closed the open range.<\/p>\n<p>The cost fell on Plains Indians. Hunters slaughtered the <strong>buffalo<\/strong>, the base of Plains life, and the herds nearly vanished by the late 1880s. The wars ran from the <strong>Sand Creek Massacre<\/strong> (1864) through these events:<\/p>\n<ul><li><strong>Little Bighorn (1876):<\/strong> Lakota and Cheyenne under <strong>Sitting Bull<\/strong> and <strong>Crazy Horse<\/strong> wiped out <strong>Custer's<\/strong> force.<\/li><li><strong>Chief Joseph<\/strong> and the Nez Perce attempted a long flight toward Canada and surrendered in 1877: \"I will fight no more forever.\"<\/li><li><strong>Wounded Knee (1890):<\/strong> the army massacred about 250 Lakota after alarm over the <strong>Ghost Dance<\/strong> religion. It marked the end of armed resistance.<\/li><\/ul>\n<p>Writer <strong>Helen Hunt Jackson<\/strong> condemned federal treatment of Native peoples in <em>A Century of Dishonor<\/em> (1881). But reformers' main answer was <strong>assimilation<\/strong>. The <strong>Dawes Severalty Act (1887)<\/strong> broke up reservations into <strong>individual allotments<\/strong> (160 acres per family head) and promised citizenship. \"Surplus\" land was sold to whites, and Native Americans lost about <strong>two-thirds<\/strong> of their land by 1934. Boarding schools such as <strong>Carlisle<\/strong> (founded by Richard Henry Pratt) forced Native children to give up their languages and cultures.<\/p>\n<p>In 1893 historian <strong>Frederick Jackson Turner<\/strong> argued in his <strong>\"frontier thesis\"<\/strong> that the frontier had shaped American democracy and individualism. The 1890 census had just declared the frontier <strong>closed<\/strong>.<\/p>\n<h2>5. Gilded Age politics<\/h2>\n<p>Politics was a close, intense game. Elections were narrow, <strong>voter turnout was very high<\/strong> (often about 80%), and the two parties differed less on policy than on loyalty, region, religion, and <strong>patronage<\/strong>. Debate focused on <strong>tariffs<\/strong>, <strong>currency<\/strong>, and <strong>civil service<\/strong>.<\/p>\n<p>In 1881 a disappointed office-seeker assassinated President <strong>James Garfield<\/strong>. This led to the <strong>Pendleton Civil Service Act (1883)<\/strong>, which filled some federal jobs by <strong>merit exams<\/strong> instead of the <strong>spoils system<\/strong>. In 1884, reform Republicans called <strong>\"Mugwumps\"<\/strong> bolted to Democrat <strong>Grover Cleveland<\/strong>, the only president to serve two <strong>non-consecutive<\/strong> terms (1885–89, 1893–97) until Donald Trump repeated the feat in 2025.<\/p>\n<p>Diplomacy was quiet. The <strong>Treaty of Washington<\/strong> (1871) sent the <strong>Alabama claims<\/strong> against Britain (over damage by Confederate raiders built in British shipyards) to arbitration, which awarded the U.S. $15.5 million. Secretary of State <strong>James G. Blaine<\/strong> hosted the first <strong>Pan-American Conference<\/strong> (1889) to expand U.S. influence and trade in Latin America.<\/p>\n<h2>Culture in brief<\/h2>\n<p>Writers turned to <strong>realism<\/strong>: <strong>Mark Twain<\/strong> (<em>Adventures of Huckleberry Finn<\/em>, 1884), William Dean Howells, and Henry James. Then came <strong>naturalism<\/strong>, which showed people at the mercy of their environment: <strong>Stephen Crane<\/strong> (<em>Maggie: A Girl of the Streets<\/em>), Jack London, and <strong>Theodore Dreiser<\/strong> (<em>Sister Carrie<\/em>). Painters <strong>Winslow Homer<\/strong> and <strong>Thomas Eakins<\/strong> worked in a realist style. <strong>Public high schools<\/strong>, land-grant colleges, research universities such as <strong>Johns Hopkins<\/strong> (1876), and women's colleges expanded quickly. The <strong>Chautauqua<\/strong> movement brought adult education to small towns. Mass leisure arrived: <strong>baseball<\/strong>, vaudeville, amusement parks, department stores, and mail-order catalogs from <strong>Montgomery Ward<\/strong> and <strong>Sears<\/strong>.<\/p>","mustknow":["<strong>Vertical integration<\/strong> (Carnegie, steel) vs. <strong>horizontal integration<\/strong> (Rockefeller, Standard Oil). A <strong>trust<\/strong> concentrates control of many companies.","<strong>Social Darwinism<\/strong> (Spencer, Sumner) justified inequality. The <strong>Gospel of Wealth<\/strong> (Carnegie) urged philanthropy. <strong>Henry George<\/strong> proposed a single tax. <strong>Bellamy<\/strong> wrote a socialist utopia.","<strong>Interstate Commerce Act<\/strong> (1887) regulated railroads. <strong>Sherman Antitrust Act<\/strong> (1890) banned trusts but was weakened by <strong>E.C. Knight<\/strong> (1895).","<strong>Knights of Labor<\/strong>: open to all, faded after Haymarket. <strong>AFL (Gompers)<\/strong>: skilled crafts, \"bread and butter.\"","Strikes: <strong>1877 railroad<\/strong>, <strong>Haymarket 1886<\/strong>, <strong>Homestead 1892<\/strong> (Carnegie/Frick), <strong>Pullman 1894<\/strong> (Debs; Cleveland sent troops via injunction).","<strong>New Immigrants<\/strong> came from southern and eastern Europe. <strong>Chinese Exclusion Act<\/strong> (1882) was the first nationality-based ban.","<strong>Jacob Riis<\/strong> (<em>How the Other Half Lives<\/em>), <strong>Jane Addams<\/strong> (Hull House), <strong>Tammany Hall / Boss Tweed<\/strong> (Nast cartoons).","<strong>Dawes Act<\/strong> (1887) broke up reservations into allotments. <strong>Wounded Knee<\/strong> (1890) ended the Indian wars. <strong>Little Bighorn<\/strong> (1876).","<strong>Turner's frontier thesis<\/strong> (1893): the frontier shaped American democracy, and it was now closed.","<strong>Pendleton Act<\/strong> (1883) came after Garfield's assassination and created merit-based civil service."],"timeline":[{"y":"1862","t":"Homestead Act; Morrill Land-Grant Act; Pacific Railway Act","key":false},{"y":"1869","t":"Transcontinental railroad completed at Promontory Point","key":true},{"y":"1871","t":"Treaty of Washington sends the Alabama claims to arbitration","key":false},{"y":"1873","t":"Twain and Warner publish <em>The Gilded Age<\/em>","key":false},{"y":"1876","t":"Battle of Little Bighorn; Bell's telephone","key":false},{"y":"1877","t":"Great Railroad Strike; Munn v. Illinois; Chief Joseph surrenders","key":true},{"y":"1879","t":"Edison's light bulb; Henry George's <em>Progress and Poverty<\/em>","key":false},{"y":"1881","t":"Garfield assassinated; <em>A Century of Dishonor<\/em>","key":false},{"y":"1882","t":"Chinese Exclusion Act; Standard Oil Trust organized","key":true},{"y":"1883","t":"Pendleton Civil Service Act; Brooklyn Bridge; standard time zones","key":true},{"y":"1886","t":"Haymarket bombing; AFL founded; Wabash v. Illinois","key":true},{"y":"1887","t":"Interstate Commerce Act; Dawes Severalty Act","key":true},{"y":"1889","t":"Hull House founded; Carnegie's \"Gospel of Wealth\"; Pan-American Conference","key":false},{"y":"1890","t":"Sherman Antitrust Act; Wounded Knee; <em>How the Other Half Lives<\/em>; census declares the frontier closed","key":true},{"y":"1892","t":"Homestead Strike; Ellis Island opens","key":false},{"y":"1893","t":"Turner's frontier thesis; Chicago World's Fair","key":false},{"y":"1894","t":"Pullman Strike","key":true},{"y":"1895","t":"U.S. v. E.C. Knight weakens the Sherman Act","key":false},{"y":"1901","t":"J.P. Morgan forms U.S. Steel","key":false}],"cards":[{"id":"u2c01","f":"Vertical integration","b":"Controlling every stage of production, from raw materials to the finished product. Carnegie Steel is the classic example."},{"id":"u2c02","f":"Horizontal integration","b":"Buying up or merging with competitors in the same industry. Rockefeller's Standard Oil is the classic example."},{"id":"u2c03","f":"Trust","b":"Stockholders of competing firms hand control to one board of trustees, creating a near-monopoly (Standard Oil, 1882)."},{"id":"u2c04","f":"Social Darwinism","b":"Herbert Spencer and William Graham Sumner applied \"survival of the fittest\" to society. Wealth was proof of fitness, so government should not help the poor."},{"id":"u2c05","f":"Gospel of Wealth (1889)","b":"Carnegie's essay: the rich are trustees of their wealth and should give it away for public good. \"The man who dies thus rich dies disgraced.\""},{"id":"u2c06","f":"Henry George, <em>Progress and Poverty<\/em> (1879)","b":"Argued that poverty grows alongside progress. Proposed a \"single tax\" on land values."},{"id":"u2c07","f":"Edward Bellamy, <em>Looking Backward<\/em> (1888)","b":"Utopian novel of a cooperative socialist America in 2000. Inspired Nationalist Clubs."},{"id":"u2c08","f":"Thorstein Veblen","b":"Economist who coined \"conspicuous consumption\" (<em>The Theory of the Leisure Class<\/em>, 1899)."},{"id":"u2c09","f":"Munn v. Illinois (1877)","b":"States may regulate private businesses that serve the public interest (grain elevators). A Granger victory."},{"id":"u2c10","f":"Wabash v. Illinois (1886)","b":"States cannot regulate interstate railroad rates. This led to the Interstate Commerce Act."},{"id":"u2c11","f":"Interstate Commerce Act (1887)","b":"Required \"reasonable and just\" railroad rates. Created the ICC, the first federal regulatory agency."},{"id":"u2c12","f":"Sherman Antitrust Act (1890)","b":"Banned combinations \"in restraint of trade.\" Weakened by U.S. v. E.C. Knight (1895) and used against unions."},{"id":"u2c13","f":"Knights of Labor","b":"Terence Powderly's inclusive union (unskilled, women, Black workers). Declined after Haymarket (1886)."},{"id":"u2c14","f":"American Federation of Labor (1886)","b":"Samuel Gompers. Skilled craft unions focused on \"bread and butter\": wages, hours, conditions."},{"id":"u2c15","f":"Haymarket Riot (1886)","b":"A bomb exploded at a Chicago eight-hour-day rally. Anarchists were blamed, and anti-union backlash followed."},{"id":"u2c16","f":"Homestead Strike (1892)","b":"Carnegie Steel lockout. Frick hired Pinkertons, militia crushed the union."},{"id":"u2c17","f":"Pullman Strike (1894)","b":"Debs's American Railway Union boycott. Cleveland sent federal troops using a court injunction. Debs jailed."},{"id":"u2c18","f":"New Immigrants","b":"Post-1880 immigrants from southern and eastern Europe (Italians, Poles, Russian Jews). Mostly Catholic, Jewish, or Orthodox."},{"id":"u2c19","f":"Chinese Exclusion Act (1882)","b":"First federal law barring immigration by nationality. Renewed and made permanent until 1943."},{"id":"u2c20","f":"Political machine","b":"Urban party organization (Tammany Hall, Boss Tweed) trading jobs and services for votes. Riddled with graft."},{"id":"u2c21","f":"Jacob Riis","b":"Photojournalist whose <em>How the Other Half Lives<\/em> (1890) exposed New York tenement life."},{"id":"u2c22","f":"Settlement houses","b":"Community centers in immigrant neighborhoods run by middle-class reformers (Jane Addams's Hull House, 1889)."},{"id":"u2c23","f":"Social Gospel","b":"Protestant movement (Walter Rauschenbusch) applying Christian ethics to urban poverty and labor problems."},{"id":"u2c24","f":"Pendleton Act (1883)","b":"After Garfield's assassination by an office-seeker. Created the merit-based civil service and competitive exams."},{"id":"u2c25","f":"Mugwumps","b":"Reform Republicans who backed Democrat Grover Cleveland in 1884 over the scandal-tainted Blaine."},{"id":"u2c26","f":"Dawes Severalty Act (1887)","b":"Divided reservations into individual allotments to assimilate Native Americans. They lost about two-thirds of their land."},{"id":"u2c27","f":"Battle of Little Bighorn (1876)","b":"Lakota and Cheyenne under Sitting Bull and Crazy Horse defeated Custer's 7th Cavalry."},{"id":"u2c28","f":"Wounded Knee (1890)","b":"Army massacre of about 250 Lakota after alarm over the Ghost Dance. Ended armed Plains resistance."},{"id":"u2c29","f":"Helen Hunt Jackson","b":"Author of <em>A Century of Dishonor<\/em> (1881), an exposé of U.S. broken treaties with Native Americans."},{"id":"u2c30","f":"Frederick Jackson Turner","b":"\"Frontier thesis\" (1893): the frontier experience shaped American democracy and individualism, and it had now closed."},{"id":"u2c31","f":"Realism / Naturalism","b":"Realism showed everyday life (Twain, Howells). Naturalism showed people shaped by harsh forces (Crane, Dreiser, London)."}]},{"n":3,"title":"Populism, Empire, and the Progressive Era","years":"1890–1914","period":"early","weight":10,"minutes":13,"lesson":"<h2>The big picture<\/h2>\n<p>Three linked stories run from about 1890 to 1914. <strong>Farmers<\/strong> revolted against railroads, banks, and tight money, which created the <strong>Populist Party<\/strong>. The U.S. then <strong>went overseas<\/strong>, taking an empire in the Caribbean and Pacific. And middle-class <strong>Progressives<\/strong> tried to fix the problems of industrial society through government, from city hall to the Constitution. Many Populist demands became Progressive laws.<\/p>\n<h2>1. The farmers' revolt and the Populists<\/h2>\n<p>After the Civil War, farmers faced <strong>falling crop prices<\/strong>, <strong>high railroad rates<\/strong>, and heavy <strong>debt<\/strong>. Prices kept falling because the money supply did not keep up with economic growth. That is <strong>deflation<\/strong>, and it made debts harder to repay. Farmers organized in stages:<\/p>\n<ul><li>the <strong>Grange<\/strong> (1867), which won state railroad laws (see Unit 2)<\/li><li>the <strong>Farmers' Alliances<\/strong> (1880s), including a separate <strong>Colored Farmers' Alliance<\/strong>, which created cooperatives<\/li><li>the <strong>People's (Populist) Party<\/strong> in 1892<\/li><\/ul>\n<p>The Populists' <strong>Omaha Platform<\/strong> (1892) demanded:<\/p>\n<ul><li><strong>free and unlimited coinage of silver<\/strong> at 16 to 1, to inflate the currency<\/li><li>a <strong>graduated income tax<\/strong><\/li><li><strong>government ownership of railroads and telegraphs<\/strong><\/li><li><strong>direct election of U.S. senators<\/strong><\/li><li>the secret ballot and an eight-hour day for government workers<\/li><\/ul>\n<p>Their candidate, James B. Weaver, won over a million votes. Speakers like <strong>Mary Elizabeth Lease<\/strong> (\"raise less corn and more hell\") energized the movement.<\/p>\n<p>The <strong>Panic of 1893<\/strong> brought the worst depression yet. Unemployment soared, and <strong>Coxey's Army<\/strong> of jobless men marched on Washington (1894). The money question took over politics. <strong>\"Silverites\"<\/strong> wanted silver coinage to raise prices. <strong>\"Goldbugs\"<\/strong> (bankers, the Northeast) wanted the <strong>gold standard<\/strong>.<\/p>\n<h3>The election of 1896<\/h3>\n<p>At the Democratic convention, <strong>William Jennings Bryan<\/strong> electrified delegates with his <strong>\"Cross of Gold\"<\/strong> speech: \"You shall not crucify mankind upon a cross of gold.\" Democrats and Populists both nominated Bryan, a <strong>fusion<\/strong> that effectively ended the Populist Party as an independent force. Republican <strong>William McKinley<\/strong>, backed by <strong>Mark Hanna's<\/strong> massive corporate-funded campaign, won with the support of the industrial Northeast and Midwest and urban workers. The 1896 election was a <strong>realigning election<\/strong>: Republicans dominated national politics until 1932. The <strong>Gold Standard Act<\/strong> (1900) settled the money issue.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Deflation, debt, and railroad rates<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Farmers' Alliances → Populist Party; Bryan's 1896 campaign<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Populists defeated, but many of their ideas (income tax, direct election of senators) are adopted by Progressives<\/div><\/div>\n<h2>2. The new empire<\/h2>\n<p>Why did a nation born in anti-colonial revolution take colonies? The motives fall into four groups:<\/p>\n<ul><li><strong>Markets:<\/strong> business wanted outlets for surplus goods.<\/li><li><strong>Sea power:<\/strong> Captain <strong>Alfred Thayer Mahan<\/strong> (<em>The Influence of Sea Power upon History<\/em>, 1890) argued that great nations need a modern navy, coaling stations, and colonies.<\/li><li><strong>Racial and religious mission:<\/strong> Social Darwinism and Anglo-Saxon superiority (Josiah Strong) blended with missionary zeal.<\/li><li><strong>The closed frontier:<\/strong> with the frontier gone, some looked outward.<\/li><\/ul>\n<p><strong>Hawaii:<\/strong> American sugar planters led the overthrow of <strong>Queen Liliuokalani<\/strong> in 1893. President Cleveland refused to annex the islands, but they were annexed in <strong>1898<\/strong> under McKinley.<\/p>\n<h3>The Spanish-American War (1898)<\/h3>\n<p>Cubans revolted against Spain in 1895. Spanish General Weyler's brutal <strong>\"reconcentration\" camps<\/strong> were sensationalized by the <strong>yellow press<\/strong> of <strong>William Randolph Hearst<\/strong> and <strong>Joseph Pulitzer<\/strong>. In February 1898 the <strong>de Lôme letter<\/strong> insulted McKinley, and then the battleship <strong>USS Maine<\/strong> exploded in Havana harbor. \"Remember the Maine!\" became the rallying cry. Congress declared war, but the <strong>Teller Amendment<\/strong> promised the U.S. would <strong>not annex Cuba<\/strong>.<\/p>\n<p>The war lasted about four months. <strong>Commodore Dewey<\/strong> destroyed the Spanish fleet at <strong>Manila Bay<\/strong> in the Philippines. <strong>Theodore Roosevelt's Rough Riders<\/strong> charged up San Juan (Kettle) Hill in Cuba. Secretary of State John Hay called it a <strong>\"splendid little war.\"<\/strong> In the <strong>Treaty of Paris<\/strong> (1898), Spain gave the U.S. <strong>Puerto Rico, Guam, and the Philippines<\/strong> (for $20 million), and Cuba became nominally independent.<\/p>\n<p>The <strong>Anti-Imperialist League<\/strong>, whose members included Mark Twain, Andrew Carnegie, and Jane Addams, argued that colonies violated the principle of government by consent. Filipinos led by <strong>Emilio Aguinaldo<\/strong> had expected independence. The brutal <strong>Philippine-American War<\/strong> (1899–1902) cost thousands of American lives and far more Filipino lives.<\/p>\n<p>Afterward the U.S. built controls over its new sphere:<\/p>\n<ul><li>The <strong>Platt Amendment<\/strong> (1901) made Cuba a <strong>protectorate<\/strong>: the U.S. could intervene and got a naval base at <strong>Guantánamo Bay<\/strong>.<\/li><li>In the <strong>Insular Cases<\/strong> (1901), the Supreme Court ruled that the Constitution does not automatically apply in full to the territories (\"the Constitution does not follow the flag\").<\/li><li>The <strong>Open Door Notes<\/strong> (1899–1900) from <strong>John Hay<\/strong> asked the powers to keep <strong>China<\/strong> open to equal trade and to respect China's territorial integrity. The U.S. sent troops to help crush the anti-foreign <strong>Boxer Rebellion<\/strong> (1900).<\/li><\/ul>\n<h3>Roosevelt, Taft, and Wilson abroad<\/h3>\n<p><strong>Theodore Roosevelt<\/strong>: \"Speak softly and carry a <strong>big stick<\/strong>.\"<\/p>\n<ul><li><strong>Panama Canal:<\/strong> When Colombia balked at a treaty, the U.S. backed a <strong>Panamanian revolution<\/strong> (1903) and got the Canal Zone. The canal opened in <strong>1914<\/strong>.<\/li><li><strong>Roosevelt Corollary<\/strong> (1904) to the Monroe Doctrine: the U.S. would act as an <strong>\"international police power\"<\/strong> in Latin America to keep European creditors out, starting in the Dominican Republic.<\/li><li>He mediated the end of the <strong>Russo-Japanese War<\/strong> (Treaty of Portsmouth, 1905) and won the <strong>Nobel Peace Prize<\/strong>.<\/li><li>The <strong>Gentlemen's Agreement<\/strong> (1907): Japan limited emigration of laborers, and San Francisco reversed its segregation of Japanese schoolchildren.<\/li><li>The <strong>Great White Fleet<\/strong> (1907–09) showed off U.S. naval power around the world.<\/li><\/ul>\n<p><strong>William Howard Taft<\/strong>: <strong>\"Dollar Diplomacy\"<\/strong>, which meant using investment rather than force to gain influence, though Marines still landed in Nicaragua.<\/p>\n<p><strong>Woodrow Wilson<\/strong>: <strong>\"moral diplomacy\"<\/strong>, which in practice still meant intervention in Mexico, Haiti, and the Dominican Republic.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Search for markets, Mahan's sea power ideas, yellow journalism, the Maine<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Spanish-American War (1898)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>U.S. becomes a colonial power (Philippines, Puerto Rico, Guam); protectorate over Cuba; debate over imperialism<\/div><\/div>\n<h2>3. The Progressive Era (about 1900–1917)<\/h2>\n<p>Progressives were mostly <strong>urban, middle-class, educated<\/strong> reformers. They believed experts and an active government could fix the abuses of industrial capitalism, political corruption, and social disorder.<\/p>\n<h3>The muckrakers<\/h3>\n<p>Roosevelt called investigative journalists <strong>\"muckrakers.\"<\/strong> Their work built public pressure for reform:<\/p>\n<ul><li><strong>Lincoln Steffens<\/st
