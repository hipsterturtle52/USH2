 used <strong>\"island hopping\"<\/strong> (also called leapfrogging) under <strong>Douglas MacArthur<\/strong> and <strong>Chester Nimitz<\/strong>: seize key islands, bypass others, and move bomber bases closer to Japan. Major battles included <strong>Guadalcanal<\/strong>, <strong>Iwo Jima<\/strong>, and <strong>Okinawa<\/strong> (1945).<\/li><li>The secret <strong>Manhattan Project<\/strong> (J. Robert Oppenheimer at Los Alamos) built the <strong>atomic bomb<\/strong>.<\/li><li><strong>Harry Truman<\/strong>, president after FDR's death in April 1945, ordered bombs dropped on <strong>Hiroshima<\/strong> (August 6) and <strong>Nagasaki<\/strong> (August 9). Japan surrendered (V-J Day, August 1945; formal surrender September 2). Truman argued the bombs saved the lives an invasion would have cost. Critics have debated the decision ever since, including whether Japan was already near surrender and whether the bombs were meant partly to impress the Soviets.<\/li><\/ul>\n<h2>4. Wartime diplomacy<\/h2>\n<p>The \"Big Three\" were Roosevelt, <strong>Churchill<\/strong>, and <strong>Stalin<\/strong>.<\/p>\n<ul><li><strong>Casablanca<\/strong> (1943): Roosevelt and Churchill demanded the Axis's <strong>unconditional surrender<\/strong>.<\/li><li><strong>Tehran<\/strong> (1943): the Allies agreed on the <strong>second front<\/strong> in France.<\/li><li><strong>Yalta<\/strong> (<strong>February 1945<\/strong>) was the most controversial meeting:<\/li><li>Stalin agreed to enter the war against Japan and to join the <strong>United Nations<\/strong>.<\/li><li>He promised <strong>free elections<\/strong> in Eastern Europe, which he did not honor.<\/li><li>Germany would be divided into <strong>occupation zones<\/strong>.<\/li><li>Critics later charged that FDR \"gave away\" Eastern Europe, though the Red Army already occupied it.<\/li><li><strong>Potsdam<\/strong> (July 1945): Truman, Stalin, and Churchill (replaced midway by Attlee) set occupation policy and warned Japan to surrender.<\/li><li>The <strong>United Nations<\/strong> charter was signed at <strong>San Francisco<\/strong> (1945). This time the Senate approved U.S. membership overwhelmingly.<\/li><li>The <strong>Bretton Woods<\/strong> conference (1944) created the <strong>International Monetary Fund<\/strong> and <strong>World Bank<\/strong> and made the dollar the anchor of the world economy.<\/li><\/ul>\n<h2>5. The home front<\/h2>\n<p><strong>Production won the war.<\/strong> The <strong>War Production Board<\/strong> converted factories, and auto plants built tanks and bombers. The <strong>Office of Price Administration<\/strong> <strong>rationed<\/strong> goods (gasoline, sugar, meat, tires) and controlled prices. War bonds and a broader <strong>income tax<\/strong> (with paycheck <strong>withholding<\/strong>, starting in 1943) paid for it all. National output nearly doubled, and <strong>unemployment virtually disappeared<\/strong>, which ended the Depression.<\/p>\n<p><strong>Women:<\/strong> About <strong>six million women<\/strong> entered the workforce, symbolized by <strong>\"Rosie the Riveter.\"<\/strong> Many did industrial work for the first time. Some 350,000 served in uniform (WACs, WAVES). Most were pushed out of industrial jobs when men returned, but the experience mattered for later change.<\/p>\n<p><strong>African Americans:<\/strong> The <strong>Double V campaign<\/strong> demanded victory over fascism abroad <em>and<\/em> racism at home. When <strong>A. Philip Randolph<\/strong> threatened a <strong>March on Washington<\/strong> (1941), FDR issued <strong>Executive Order 8802<\/strong>, banning discrimination in <strong>defense industries<\/strong> and creating the <strong>Fair Employment Practices Committee<\/strong>. Some 1.2 million Black Americans served in a <strong>segregated<\/strong> military, including the <strong>Tuskegee Airmen<\/strong>. A second wave of the Great Migration moved north and west to defense jobs. Racial tension exploded in the <strong>Detroit riot<\/strong> (1943).<\/p>\n<p><strong>Mexican Americans:<\/strong> The <strong>Bracero Program<\/strong> (1942) brought Mexican laborers for farm work. In the <strong>Zoot Suit Riots<\/strong> (Los Angeles, 1943), servicemen attacked young Mexican Americans.<\/p>\n<p><strong>Native Americans:<\/strong> About 25,000 served, including the <strong>Navajo code talkers<\/strong>, whose code the Japanese never broke.<\/p>\n<p><strong>Japanese American internment:<\/strong> After Pearl Harbor, <strong>Executive Order 9066<\/strong> (February 1942) led to the forced removal of about <strong>120,000 people of Japanese ancestry<\/strong> from the West Coast to <strong>internment camps<\/strong>. <strong>About two-thirds were U.S. citizens.<\/strong> No comparable mass action was taken against German or Italian Americans, and no Japanese American was convicted of espionage. In <strong>Korematsu v. United States<\/strong> (1944), the Supreme Court <strong>upheld<\/strong> the removal as a military necessity. Meanwhile the Japanese American <strong>442nd Regimental Combat Team<\/strong> became one of the most decorated units of the war. In <strong>1988<\/strong> Congress apologized and paid <strong>$20,000<\/strong> to each surviving internee.<\/p>\n<p><strong>Refugees:<\/strong> U.S. immigration policy kept most Jewish refugees out. The ship <em>St. Louis<\/em> was turned away in 1939. A <strong>War Refugee Board<\/strong> was created only in 1944.<\/p>\n<p><strong>Looking ahead:<\/strong> The <strong>GI Bill<\/strong> (1944) gave veterans money for <strong>college, job training, and low-interest home loans<\/strong>. It helped build the postwar middle class and suburbs (Unit 7). Defense spending pulled people and industry to the <strong>West and South<\/strong> (the future <strong>Sun Belt<\/strong>).<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Total war mobilization<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Full employment, women and minorities in new jobs, internment, civil rights pressure<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Depression ends; seeds of the civil rights movement; a bigger federal government; U.S. emerges as a superpower<\/div><\/div>","mustknow":["<strong>Neutrality Acts<\/strong> (1935–37) came from the <strong>Nye Committee<\/strong> \"merchants of death\" view of WWI.","Steps toward war: <strong>cash-and-carry<\/strong> (1939), <strong>destroyers-for-bases<\/strong> and the <strong>peacetime draft<\/strong> (1940), <strong>Lend-Lease<\/strong> (March 1941), <strong>Atlantic Charter<\/strong> (Aug. 1941).","<strong>Four Freedoms<\/strong>: speech, worship, from want, from fear. <strong>America First<\/strong> = isolationists (Lindbergh).","<strong>Pearl Harbor<\/strong> (Dec. 7, 1941) followed the U.S. <strong>oil embargo<\/strong> on Japan.","<strong>Europe-first<\/strong> strategy; <strong>D-Day<\/strong> (June 6, 1944); <strong>Midway<\/strong> (June 1942) was the Pacific turning point; <strong>island hopping<\/strong>.","<strong>Manhattan Project<\/strong> → <strong>Hiroshima/Nagasaki<\/strong> (Aug. 1945), decided by <strong>Truman<\/strong>.","<strong>Yalta<\/strong> (Feb. 1945): Soviet entry against Japan, promised free elections in Eastern Europe, UN, German zones.","<strong>Japanese American internment<\/strong>: <strong>EO 9066<\/strong>, about 120,000 removed (2/3 citizens), upheld in <strong>Korematsu<\/strong> (1944), 1988 apology and reparations.","<strong>EO 8802<\/strong> (defense-industry nondiscrimination, after <strong>A. Philip Randolph's<\/strong> threatened march). <strong>Double V<\/strong>. <strong>Rosie the Riveter<\/strong>. <strong>Bracero Program<\/strong>.","<strong>GI Bill<\/strong> (1944): college, home loans. <strong>UN<\/strong> (1945). <strong>Bretton Woods<\/strong> (IMF, World Bank)."],"timeline":[{"y":"1931","t":"Japan seizes Manchuria","key":false},{"y":"1934–36","t":"Nye Committee hearings","key":false},{"y":"1935–37","t":"Neutrality Acts","key":false},{"y":"1937","t":"Japan invades China; FDR's Quarantine Speech","key":false},{"y":"1938","t":"Munich Conference (appeasement)","key":false},{"y":"1939","t":"Germany invades Poland (Sept. 1); cash-and-carry for arms","key":true},{"y":"1940","t":"France falls; destroyers-for-bases deal; first peacetime draft; FDR's third term","key":false},{"y":"1941","t":"Four Freedoms; Lend-Lease (March); EO 8802; Atlantic Charter (Aug.); Pearl Harbor (Dec. 7)","key":true},{"y":"1942","t":"EO 9066 (Japanese American internment); Battle of Midway (June); Bracero Program; Manhattan Project","key":true},{"y":"1943","t":"Casablanca and Tehran conferences; Detroit riot and Zoot Suit Riots; Italy invaded","key":false},{"y":"1944","t":"D-Day (June 6); Korematsu v. U.S.; GI Bill; Bretton Woods; Battle of the Bulge","key":true},{"y":"1945","t":"Yalta (Feb.); FDR dies, Truman president (April); V-E Day (May 8); Potsdam; Hiroshima and Nagasaki (Aug.); Japan surrenders; UN founded","key":true}],"cards":[{"id":"u6c01","f":"Nye Committee (1934–36)","b":"Senate investigation suggesting bankers and arms makers (\"merchants of death\") had pushed the U.S. into WWI. Fed isolationism."},{"id":"u6c02","f":"Neutrality Acts (1935–37)","b":"Banned arms sales and loans to belligerents and U.S. travel on belligerent ships. Later allowed \"cash-and-carry.\""},{"id":"u6c03","f":"Cash-and-carry","b":"Warring nations could buy U.S. goods (arms after 1939) if they paid cash and shipped them themselves. Favored Britain."},{"id":"u6c04","f":"Quarantine Speech (1937)","b":"FDR suggested \"quarantining\" aggressor nations. Met with isolationist backlash."},{"id":"u6c05","f":"America First Committee","b":"Isolationist group (Charles Lindbergh) opposing U.S. aid to Britain and entry into WWII."},{"id":"u6c06","f":"Destroyers-for-bases deal (1940)","b":"Fifty old U.S. destroyers for leases on British bases in the Western Hemisphere."},{"id":"u6c07","f":"Four Freedoms (1941)","b":"FDR's war aims: freedom of speech, freedom of worship, freedom from want, freedom from fear."},{"id":"u6c08","f":"Lend-Lease Act (March 1941)","b":"Let the president lend or lease arms to nations vital to U.S. defense (Britain, later the USSR). \"Arsenal of democracy.\""},{"id":"u6c09","f":"Atlantic Charter (Aug. 1941)","b":"FDR–Churchill statement of goals: no territorial gain, self-determination, free trade, collective security."},{"id":"u6c10","f":"Pearl Harbor (Dec. 7, 1941)","b":"Japanese surprise attack on the U.S. fleet in Hawaii after the U.S. oil embargo. The U.S. entered WWII."},{"id":"u6c11","f":"Europe-first strategy","b":"The Allied decision to defeat Germany before concentrating on Japan."},{"id":"u6c12","f":"D-Day (June 6, 1944)","b":"Allied invasion of Normandy under Eisenhower. Opened the western front."},{"id":"u6c13","f":"Battle of Midway (June 1942)","b":"U.S. carriers sank four Japanese carriers. The turning point of the Pacific war."},{"id":"u6c14","f":"Island hopping","b":"U.S. Pacific strategy of capturing key islands and bypassing others to approach Japan."},{"id":"u6c15","f":"Manhattan Project","b":"Secret U.S. program (Oppenheimer, Los Alamos) that built the atomic bomb."},{"id":"u6c16","f":"Hiroshima and Nagasaki (Aug. 1945)","b":"Atomic bombings ordered by Truman. Japan surrendered days later. Still debated."},{"id":"u6c17","f":"Yalta Conference (Feb. 1945)","b":"FDR, Churchill, Stalin: Soviet entry against Japan, UN, German zones, promised free elections in Eastern Europe."},{"id":"u6c18","f":"Executive Order 9066 (1942)","b":"Authorized removal of about 120,000 Japanese Americans (2/3 citizens) from the West Coast to internment camps."},{"id":"u6c19","f":"Korematsu v. United States (1944)","b":"Supreme Court upheld Japanese American internment as military necessity. Widely condemned later."},{"id":"u6c20","f":"Executive Order 8802 (1941)","b":"Banned racial discrimination in defense industries and created the FEPC, after A. Philip Randolph threatened a march."},{"id":"u6c21","f":"Double V campaign","b":"Black Americans' call for victory over fascism abroad and racism at home."},{"id":"u6c22","f":"Rosie the Riveter","b":"Symbol of the roughly six million women who entered the wartime workforce, many in industry."},{"id":"u6c23","f":"GI Bill (1944)","b":"Servicemen's Readjustment Act. Paid for veterans' college and job training and backed low-interest home loans."}]},{"n":7,"title":"Early Cold War and the 1950s","years":"1945–1960","period":"late","weight":11,"minutes":12,"lesson":"<h2>The big picture<\/h2>\n<p>World War II left two superpowers with opposite systems. The <strong>United States<\/strong> stood for capitalism and liberal democracy. The <strong>Soviet Union<\/strong> stood for communism and one-party rule. Their rivalry, the <strong>Cold War<\/strong>, shaped American foreign policy for 45 years. It also shaped life at home: a <strong>second Red Scare<\/strong>, a permanent military buildup, and federal money for highways, science, and schools. At the same time, the 1950s brought <strong>unprecedented prosperity<\/strong>: the <strong>baby boom<\/strong>, <strong>suburbs<\/strong>, <strong>television<\/strong>, and a consumer culture that critics attacked as conformist.<\/p>\n<h2>1. How the Cold War began (1945–1949)<\/h2>\n<p>The Soviets had lost over 20 million people and wanted a <strong>buffer zone<\/strong> of friendly states. At Yalta, Stalin had promised free elections in Eastern Europe, but he installed <strong>communist governments<\/strong> in Poland, Hungary, Romania, Bulgaria, and (in 1948) Czechoslovakia. In 1946 <strong>Winston Churchill<\/strong> warned that an <strong>\"iron curtain\"<\/strong> had descended across Europe.<\/p>\n<p>American diplomat <strong>George Kennan<\/strong> argued in his <strong>\"Long Telegram\"<\/strong> (1946) and his <strong>\"X\" article<\/strong> (1947) that Soviet expansion must be met with patient, firm <strong>containment<\/strong>. Containment became the core of U.S. policy:<\/p>\n<ul><li><strong>Truman Doctrine<\/strong> (March 1947): Truman asked Congress for <strong>$400 million<\/strong> for <strong>Greece and Turkey<\/strong>, declaring that the U.S. must \"support free peoples who are resisting attempted subjugation.\"<\/li><li><strong>Marshall Plan<\/strong> (1948): about <strong>$13 billion<\/strong> in economic aid to rebuild Western Europe, so that poverty would not breed communism. The Soviets refused it for their bloc.<\/li><li><strong>Berlin Blockade and Airlift<\/strong> (1948–49): Stalin cut off land access to West Berlin, and the U.S. and Britain <strong>flew in supplies for nearly a year<\/strong> until he backed down.<\/li><li><strong>NATO<\/strong> (1949): the first U.S. <strong>peacetime military alliance<\/strong>, built on the idea that an attack on one is an attack on all. The Soviet bloc answered with the <strong>Warsaw Pact<\/strong> (1955).<\/li><li>The <strong>National Security Act<\/strong> (1947) created the <strong>Department of Defense<\/strong>, the <strong>CIA<\/strong>, and the <strong>National Security Council<\/strong>.<\/li><\/ul>\n<p>1949 was a shock year. The Soviets tested an <strong>atomic bomb<\/strong>, and <strong>Mao Zedong's<\/strong> communists won China's civil war. Republicans charged that Truman had \"lost China.\" A secret report, <strong>NSC-68<\/strong> (1950), called for a massive military buildup to fight communism everywhere.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Soviet control of Eastern Europe; fear of communist expansion<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Containment: Truman Doctrine, Marshall Plan, NATO<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>A permanent U.S. global military presence and an arms race<\/div><\/div>\n<h2>2. The Korean War (1950–1953)<\/h2>\n<p>In <strong>June 1950<\/strong>, communist <strong>North Korea<\/strong> invaded <strong>South Korea<\/strong>. The <strong>UN Security Council<\/strong> authorized a defense; the Soviets were boycotting it and could not veto. The war unfolded in stages:<\/p>\n<ul><li><strong>General Douglas MacArthur's<\/strong> landing at <strong>Inchon<\/strong> turned the tide, and UN forces drove north toward China's border at the Yalu River.<\/li><li><strong>China<\/strong> entered with hundreds of thousands of troops and pushed them back.<\/li><li>MacArthur publicly demanded a wider war, including bombing China. Truman <strong>fired him<\/strong> in April 1951 for insubordination, upholding <strong>civilian control of the military<\/strong>.<\/li><li>After two years of stalemate, an <strong>armistice (1953)<\/strong> left Korea divided near the <strong>38th parallel<\/strong>, where it had started.<\/li><\/ul>\n<p>Korea was the first \"<strong>limited war<\/strong>\" of the Cold War, fought for containment rather than total victory. About 36,000 Americans died.<\/p>\n<h2>3. The Second Red Scare<\/h2>\n<p>Fear of communist subversion swept the country:<\/p>\n<ul><li>Truman's <strong>loyalty program<\/strong> (1947) screened federal employees.<\/li><li>The <strong>House Un-American Activities Committee (HUAC)<\/strong> investigated Hollywood. The <strong>\"Hollywood Ten\"<\/strong> were jailed for refusing to testify, and a <strong>blacklist<\/strong> cost hundreds of people their jobs.<\/li><li><strong>Alger Hiss<\/strong>, a former State Department official accused of spying, was convicted of <strong>perjury<\/strong> (1950). The case made Congressman <strong>Richard Nixon<\/strong> famous.<\/li><li><strong>Julius and Ethel Rosenberg<\/strong> were executed (1953) for passing atomic secrets to the Soviets.<\/li><li>The <strong>McCarran Internal Security Act<\/strong> (1950) required communist organizations to register.<\/li><\/ul>\n<p>In February 1950, Senator <strong>Joseph McCarthy<\/strong> of Wisconsin claimed to have a list of communists in the State Department. He never proved a single case, but <strong>\"McCarthyism\"<\/strong>, meaning reckless accusations of disloyalty, ruined many careers. His downfall came in the televised <strong>Army-McCarthy hearings<\/strong> (1954). Army lawyer <strong>Joseph Welch<\/strong> asked, \"Have you no sense of decency, sir?\" The <strong>Senate censured<\/strong> McCarthy in December 1954. Playwright <strong>Arthur Miller's<\/strong> <em>The Crucible<\/em> (1953) used the Salem witch trials as an allegory for the hunt.<\/p>\n<h2>4. Truman at home<\/h2>\n<ul><li><strong>Reconversion:<\/strong> a massive <strong>strike wave<\/strong> (1946) and inflation followed the end of price controls.<\/li><li>The <strong>Employment Act<\/strong> (1946) made maximum employment a federal goal and created the <strong>Council of Economic Advisers<\/strong>.<\/li><li>The Republican Congress passed the <strong>Taft-Hartley Act<\/strong> (1947) over Truman's veto. It <strong>banned the closed shop<\/strong>, allowed states to pass <strong>\"right-to-work\" laws<\/strong>, permitted 80-day \"cooling-off\" injunctions in national-emergency strikes, and required union leaders to swear they were not communists.<\/li><li><strong>Civil rights:<\/strong> Truman's committee report <em>To Secure These Rights<\/em> (1947) called for federal action. In 1948 Truman issued <strong>Executive Order 9981<\/strong>, <strong>desegregating the armed forces<\/strong>. That same year, <strong>Jackie Robinson<\/strong> had broken baseball's color line with the Brooklyn Dodgers (1947).<\/li><li><strong>Election of 1948:<\/strong> Truman faced a three-way split. Southern <strong>Dixiecrats<\/strong> (<strong>Strom Thurmond<\/strong>) walked out over civil rights, and <strong>Henry Wallace's<\/strong> Progressives attacked Truman from the left. Truman won a famous <strong>upset<\/strong> over Thomas Dewey anyway.<\/li><li><strong>Fair Deal:<\/strong> Truman won a higher minimum wage, expanded Social Security, and public housing, but Congress rejected <strong>national health insurance<\/strong>.<\/li><li>The <strong>Twenty-second Amendment<\/strong> (1951) limited presidents to <strong>two terms<\/strong>.<\/li><\/ul>\n<h2>5. Eisenhower: the middle way<\/h2>\n<p><strong>Dwight Eisenhower<\/strong> (1953–61) practiced <strong>\"Modern Republicanism.\"<\/strong> He accepted and even expanded the New Deal: Social Security grew, and he created the Department of Health, Education, and Welfare. But he favored balanced budgets. The <strong>Interstate Highway Act<\/strong> (1956), justified partly for defense and evacuation, built 41,000 miles of highway, the largest public works program in history.<\/p>\n<p><strong>Foreign policy:<\/strong> Secretary of State <strong>John Foster Dulles<\/strong> practiced <strong>brinkmanship<\/strong>.<\/p>\n<ul><li>The <strong>\"New Look\"<\/strong> relied on nuclear weapons and the threat of <strong>\"massive retaliation\"<\/strong> rather than costly ground forces: \"more bang for the buck.\"<\/li><li>The <strong>CIA<\/strong> ran <strong>covert operations<\/strong>, overthrowing governments in <strong>Iran<\/strong> (1953) and <strong>Guatemala<\/strong> (1954).<\/li><li>Eisenhower's <strong>domino theory<\/strong> (1954) held that if Vietnam fell to communism, its neighbors would follow. After the French defeat at Dien Bien Phu, the <strong>Geneva Accords<\/strong> (1954) temporarily divided Vietnam at the <strong>17th parallel<\/strong>. The U.S. backed <strong>Ngo Dinh Diem's<\/strong> South Vietnam and formed <strong>SEATO<\/strong>.<\/li><li>In the <strong>Suez Crisis<\/strong> (1956), Eisenhower forced Britain, France, and Israel to withdraw from Egypt.<\/li><li>He did <strong>not<\/strong> intervene when the Soviets crushed the <strong>Hungarian Revolution<\/strong> (1956).<\/li><li>The <strong>Eisenhower Doctrine<\/strong> (1957) offered aid against communism in the <strong>Middle East<\/strong>.<\/li><\/ul>\n<p><strong>Sputnik:<\/strong> In October 1957 the Soviets launched <strong>Sputnik<\/strong>, the first artificial satellite. Americans feared a \"missile gap\" and a science gap. Congress created <strong>NASA<\/strong> (1958) and passed the <strong>National Defense Education Act<\/strong> (1958), which funded science, math, and foreign-language education.<\/p>\n<p>At the end of his term, the <strong>U-2 incident<\/strong> (1960), a U.S. spy plane shot down over the USSR, wrecked a summit. In 1959 <strong>Fidel Castro<\/strong> took power in Cuba. In his <strong>Farewell Address<\/strong> (1961), Eisenhower warned against the <strong>\"military-industrial complex.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Sputnik (1957)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>NASA, National Defense Education Act, space race<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Federal investment in science and education; Cold War competition reaches schools<\/div><\/div>\n<h2>6. The affluent society<\/h2>\n<p>The postwar economy boomed. Pent-up savings, government spending (defense, highways, the <strong>GI Bill<\/strong>), and cheap energy fueled it. Births soared in the <strong>baby boom<\/strong> (1946–1964).<\/p>\n<p><strong>Suburbs:<\/strong> Builder <strong>William Levitt<\/strong> mass-produced affordable homes in <strong>Levittown<\/strong>, New York. <strong>FHA and VA mortgages<\/strong> made them easy to buy. But <strong>restrictive covenants and \"redlining\"<\/strong> excluded Black families, which cemented residential segregation. Millions moved to suburbs and to the <strong>Sun Belt<\/strong>, while inner cities lost people and tax revenue.<\/p>\n<p><strong>Consumer culture:<\/strong> Families bought <strong>cars<\/strong>, appliances, and <strong>television<\/strong>. By 1960 almost 90% of households had a TV, which spread shared programs and advertising. Credit cards appeared. A <strong>religious revival<\/strong> (evangelist <strong>Billy Graham<\/strong>) went with Cold War anti-communism: \"under God\" was added to the Pledge of Allegiance (1954). <strong>Jonas Salk's polio vaccine<\/strong> (1955) was a triumph of science.<\/p>\n<p><strong>The ideal of domesticity:<\/strong> Popular culture celebrated the suburban homemaker, and <strong>Dr. Benjamin Spock's<\/strong> <em>Baby and Child Care<\/em> (1946) became a bestseller. In reality, more married women were taking paid jobs every year.<\/p>\n<p><strong>Critics of conformity:<\/strong><\/p>\n<ul><li><strong>David Riesman<\/strong>, <em>The Lonely Crowd<\/em> (1950): \"other-directed\" people seek approval from peers.<\/li><li><strong>William Whyte<\/strong>, <em>The Organization Man<\/em> (1956): corporate conformity.<\/li><li><strong>John Kenneth Galbraith<\/strong>, <em>The Affluent Society<\/em> (1958): private wealth amid public neglect.<\/li><li><strong>C. Wright Mills<\/strong>, <em>The Power Elite<\/em> (1956).<\/li><li>Novels like <em>The Man in the Gray Flannel Suit<\/em> (Sloan Wilson).<\/li><\/ul>\n<p><strong>Rebels:<\/strong> The <strong>Beat Generation<\/strong> rejected materialism and conformity: <strong>Jack Kerouac's<\/strong> <em>On the Road<\/em> (1957) and <strong>Allen Ginsberg's<\/strong> <em>Howl<\/em> (1956). <strong>J.D. Salinger's<\/strong> <em>The Catcher in the Rye<\/em> (1951) spoke to alienated teens. <strong>Rock and roll<\/strong> (Elvis Presley, Chuck Berry, Little Richard) blended Black rhythm and blues with country and alarmed parents. <strong>Abstract Expressionist<\/strong> painters such as <strong>Jackson Pollock<\/strong> made New York the center of the art world.<\/p>\n<p><strong>Left behind:<\/strong> Prosperity did not reach everyone. Federal Indian policy shifted to <strong>\"termination\"<\/strong> (ending tribal recognition) and <strong>relocation<\/strong> to cities. <strong>\"Operation Wetback\"<\/strong> (1954) deported large numbers of Mexican migrants. Rural and urban poverty persisted (see Unit 8).<\/p>","mustknow":["<strong>Containment<\/strong> (George Kennan) was the core Cold War strategy.","<strong>Truman Doctrine<\/strong> (1947, Greece/Turkey military aid). <strong>Marshall Plan<\/strong> (1948, economic aid to rebuild Europe).","<strong>Berlin Airlift<\/strong> (1948–49); <strong>NATO<\/strong> (1949, first peacetime alliance); 1949: Soviet A-bomb + China falls to Mao.","<strong>Korean War<\/strong> (1950–53): UN action, Inchon, China enters, <strong>Truman fires MacArthur<\/strong> (civilian control), armistice at the 38th parallel.","<strong>Second Red Scare<\/strong>: HUAC/Hollywood Ten, Hiss, Rosenbergs, <strong>McCarthy<\/strong> (Army-McCarthy hearings 1954, censure).","<strong>Taft-Hartley<\/strong> (1947, curbed unions); <strong>EO 9981<\/strong> (1948, desegregated the military); <strong>1948<\/strong>: Truman beats Dewey despite Dixiecrats.","<strong>Eisenhower<\/strong>: Modern Republicanism, <strong>Interstate Highway Act<\/strong> (1956), <strong>massive retaliation/brinkmanship<\/strong>, CIA coups (Iran, Guatemala), <strong>domino theory<\/strong>.","<strong>Sputnik<\/strong> (1957) → <strong>NASA<\/strong> and the <strong>National Defense Education Act<\/strong> (1958). <strong>Military-industrial complex<\/strong> warning (1961).","1950s society: <strong>baby boom<\/strong>, <strong>Levittown<\/strong> suburbs (with racial exclusion), TV, religious revival.","Critics/rebels: Riesman, Whyte, Galbraith; <strong>Beats<\/strong> (Kerouac, Ginsberg); <strong>rock and roll<\/strong>; Salinger."],"timeline":[{"y":"1946","t":"Kennan's Long Telegram; Churchill's \"Iron Curtain\" speech; Employment Act; strike wave","key":false},{"y":"1947","t":"Truman Doctrine; Taft-Hartley Act; National Security Act; HUAC Hollywood hearings; Jackie Robinson; Levittown begins","key":true},{"y":"1948","t":"Marshall Plan; Berlin Airlift begins; EO 9981; Truman upsets Dewey","key":true},{"y":"1949","t":"NATO formed; Soviet atomic bomb; communist victory in China","key":true},{"y":"1950","t":"McCarthy's Wheeling speech; Korean War begins; NSC-68; Hiss convicted","key":true},{"y":"1951","t":"Truman fires MacArthur; 22nd Amendment","key":false},{"y":"1953","t":"Korean armistice; Rosenbergs executed; CIA coup in Iran","key":false},{"y":"1954","t":"Army-McCarthy hearings and censure; Geneva Accords; domino theory; Guatemala coup","key":false},{"y":"1955","t":"Warsaw Pact; Salk polio vaccine","key":false},{"y":"1956","t":"Interstate Highway Act; Suez Crisis; Hungarian Revolution; <em>Howl<\/em>","key":false},{"y":"1957","t":"Sputnik; Eisenhower Doctrine; <em>On the Road<\/em>","key":true},{"y":"1958","t":"NASA and National Defense Education Act","key":false},{"y":"1959","t":"Castro takes power in Cuba","key":false},{"y":"1960","t":"U-2 incident","key":false},{"y":"1961","t":"Eisenhower's Farewell Address (\"military-industrial complex\")","key":false}],"cards":[{"id":"u7c01","f":"Containment","b":"George Kennan's strategy: firmly resist Soviet expansion wherever it threatens, without all-out war."},{"id":"u7c02","f":"Iron Curtain speech (1946)","b":"Churchill's warning in Fulton, Missouri, that Soviet domination had divided Europe."},{"id":"u7c03","f":"Truman Doctrine (1947)","b":"$400 million in aid to Greece and Turkey. The U.S. would \"support free peoples\" resisting communist subjugation."},{"id":"u7c04","f":"Marshall Plan (1948)","b":"About $13 billion in economic aid to rebuild Western Europe and blunt communism's appeal."},{"id":"u7c05","f":"Berlin Airlift (1948–49)","b":"U.S. and British planes supplied West Berlin during the Soviet blockade until Stalin lifted it."},{"id":"u7c06","f":"NATO (1949)","b":"North Atlantic Treaty Organization. First U.S. peacetime military alliance. An attack on one is an attack on all."},{"id":"u7c07","f":"National Security Act (1947)","b":"Created the Department of Defense, the CIA, and the National Security Council."},{"id":"u7c08","f":"NSC-68 (1950)","b":"Secret policy paper calling for a massive military buildup to contain communism globally."},{"id":"u7c09","f":"Korean War (1950–53)","b":"North invaded South. UN/U.S. defense, Chinese intervention, MacArthur fired, armistice near the 38th parallel."},{"id":"u7c10","f":"MacArthur's firing (1951)","b":"Truman removed MacArthur for publicly demanding a wider war with China. Civilian control of the military."},{"id":"u7c11","f":"HUAC / Hollywood Ten","b":"House Un-American Activities Committee investigated Hollywood communism. The Ten were jailed, and a blacklist followed."},{"id":"u7c12","f":"Alger Hiss","b":"Ex-State Department official accused of spying for the USSR. Convicted of perjury (1950). Boosted Nixon's career."},{"id":"u7c13","f":"Rosenbergs","b":"Julius and Ethel Rosenberg, executed in 1953 for passing atomic secrets to the USSR."},{"id":"u7c14","f":"McCarthyism","b":"Sen. Joseph McCarthy's reckless anti-communist accusations (1950–54). Ended after the Army-McCarthy hearings and censure."},{"id":"u7c15","f":"Taft-Hartley Act (1947)","b":"Passed over Truman's veto. Banned the closed shop, allowed right-to-work laws, cooling-off periods, anti-communist oaths."},{"id":"u7c16","f":"Executive Order 9981 (1948)","b":"Truman's order desegregating the U.S. armed forces."},{"id":"u7c17","f":"Election of 1948","b":"Truman's upset win over Dewey despite Dixiecrat (Thurmond) and Progressive (Wallace) splits."},{"id":"u7c18","f":"Twenty-second Amendment (1951)","b":"Limits presidents to two elected terms."},{"id":"u7c19","f":"Modern Republicanism","b":"Eisenhower's acceptance of New Deal programs combined with fiscal conservatism."},{"id":"u7c20","f":"Interstate Highway Act (1956)","b":"Built 41,000 miles of interstate highways. Spurred suburbs and car culture, justified for defense."},{"id":"u7c21","f":"Massive retaliation / Brinkmanship","b":"Eisenhower–Dulles \"New Look\": rely on nuclear threats rather than large conventional forces, going to the brink of war."},{"id":"u7c22","f":"Domino theory","b":"Eisenhower (1954): if one Southeast Asian nation falls to communism, its neighbors will follow."},{"id":"u7c23","f":"Sputnik (1957)","b":"First Soviet satellite. Sparked U.S. fears and led to NASA and the National Defense Education Act (1958)."},{"id":"u7c24","f":"Military-industrial complex","b":"Eisenhower's 1961 farewell warning about the influence of the permanent arms industry and military."},{"id":"u7c25","f":"Baby boom","b":"Surge in births, 1946–1964, shaping schools, suburbs, and culture for decades."},{"id":"u7c26","f":"Levittown","b":"Mass-produced suburban housing (William Levitt). Affordable but initially excluded Black families."},{"id":"u7c27","f":"Beat Generation","b":"1950s writers rejecting conformity and materialism: Jack Kerouac (<em>On the Road<\/em>), Allen Ginsberg (<em>Howl<\/em>)."},{"id":"u7c28","f":"<em>The Lonely Crowd<\/em> / <em>The Organization Man<\/em>","b":"1950s critiques of conformity: Riesman's \"other-directed\" people and Whyte's corporate conformists."},{"id":"u7c29","f":"Termination policy","b":"1950s federal effort to end tribal recognition and move Native Americans into the mainstream. Reversed in the 1970s."}]},{"n":8,"title":"Civil Rights, the Great Society, and Vietnam","years":"1954–1975","period":"late","weight":13,"minutes":16,"lesson":"<h2>The big picture<\/h2>\n<p>This is the <strong>most heavily weighted unit<\/strong>, and it carries a large share of the social and cultural questions. Between 1954 and 1975 four things happened at once:<\/p>\n<ul><li>The <strong>civil rights movement<\/strong> destroyed legal segregation and won federal protection of voting rights.<\/li><li><strong>Lyndon Johnson's Great Society<\/strong> built the largest expansion of federal social programs since the New Deal.<\/li><li>The <strong>Warren Court<\/strong> expanded individual rights.<\/li><li>Women, Latinos, Native Americans, gay Americans, and environmentalists launched their own movements.<\/li><\/ul>\n<p>Over all of it hung the <strong>Vietnam War<\/strong>. It split the country, drove LBJ from office, fed a youth <strong>counterculture<\/strong>, and ended in American withdrawal.<\/p>\n<h2>1. The civil rights movement, phase one (1954–1960)<\/h2>\n<p><strong>Brown v. Board of Education<\/strong> (1954) was the legal breakthrough. NAACP lawyer <strong>Thurgood Marshall<\/strong> argued it, and a unanimous Court under Chief Justice <strong>Earl Warren<\/strong> ruled that <strong>segregated public schools are \"inherently unequal.\"<\/strong> That overturned <em>Plessy<\/em> in education. A second ruling (1955) ordered desegregation \"with all deliberate speed,\" which southern officials treated as permission to delay. Over 100 southern congressmen signed the <strong>Southern Manifesto<\/strong> (1956) pledging <strong>\"massive resistance.\"<\/strong><\/p>\n<p>Key events of the 1950s:<\/p>\n<ul><li><strong>Emmett Till<\/strong> (1955), a 14-year-old from Chicago, was murdered in Mississippi. His mother's open-casket funeral shocked the nation.<\/li><li><strong>Montgomery Bus Boycott<\/strong> (1955–56): after <strong>Rosa Parks<\/strong> refused to give up her bus seat, Black residents boycotted the buses for <strong>381 days<\/strong>, led by a young minister, <strong>Martin Luther King Jr.<\/strong> A Supreme Court ruling ended bus segregation. King and others then formed the <strong>Southern Christian Leadership Conference (SCLC)<\/strong> in 1957, committed to <strong>nonviolent<\/strong> direct action.<\/li><li><strong>Little Rock<\/strong> (1957): Arkansas governor <strong>Orval Faubus<\/strong> used the National Guard to block nine Black students from Central High School. <strong>Eisenhower<\/strong> sent the <strong>101st Airborne<\/strong> to enforce the court order.<\/li><li>The <strong>Civil Rights Act of 1957<\/strong> was the first since Reconstruction. It was weak, but it created a Civil Rights Commission.<\/li><\/ul>\n<h2>2. Phase two: direct action (1960–1965)<\/h2>\n<ul><li><strong>Sit-ins<\/strong> (1960): four Black college students sat at a whites-only <strong>Woolworth's lunch counter in Greensboro, North Carolina<\/strong>. Sit-ins spread across the South. With help from <strong>Ella Baker<\/strong>, students formed the <strong>Student Nonviolent Coordinating Committee (SNCC)<\/strong>.<\/li><li><strong>Freedom Rides<\/strong> (1961): <strong>CORE<\/strong> sent integrated groups on interstate buses to test desegregation rulings. Mobs firebombed a bus in Alabama, and the Kennedy administration finally sent federal marshals.<\/li><li><strong>James Meredith<\/strong> integrated the University of Mississippi (1962) under federal protection.<\/li><li><strong>Birmingham<\/strong> (1963): police chief <strong>Bull Connor<\/strong> turned <strong>fire hoses and police dogs<\/strong> on marching children, and the images went around the world. Jailed, King wrote his <strong>\"Letter from Birmingham Jail,\"<\/strong> defending civil disobedience against unjust laws.<\/li><li><strong>March on Washington<\/strong> (August 1963): about 250,000 people gathered at the Lincoln Memorial, where King gave his <strong>\"I Have a Dream\"<\/strong> speech. Weeks later, a bomb at Birmingham's <strong>16th Street Baptist Church<\/strong> killed four girls.<\/li><\/ul>\n<p>After Kennedy's assassination, <strong>Lyndon Johnson<\/strong> used his legislative skill to break a southern filibuster and pass the <strong>Civil Rights Act of 1964<\/strong>:<\/p>\n<ul><li>It banned segregation in <strong>public accommodations<\/strong> (hotels, restaurants, theaters).<\/li><li>Its <strong>Title VII<\/strong> banned employment discrimination by race, color, religion, national origin, <strong>and sex<\/strong>.<\/li><li>It created the <strong>Equal Employment Opportunity Commission<\/strong> (EEOC).<\/li><\/ul>\n<p>The <strong>Twenty-fourth Amendment<\/strong> (1964) outlawed <strong>poll taxes<\/strong> in federal elections.<\/p>\n<p><strong>Voting rights:<\/strong> In <strong>Freedom Summer<\/strong> (1964), volunteers registered Black voters in Mississippi, and three civil rights workers were murdered. <strong>Fannie Lou Hamer's<\/strong> <strong>Mississippi Freedom Democratic Party<\/strong> challenged the all-white state delegation at the Democratic convention. In <strong>Selma<\/strong> (March 1965), state troopers beat marchers, including <strong>John Lewis<\/strong>, on <strong>\"Bloody Sunday.\"<\/strong> Days later Johnson called for the <strong>Voting Rights Act of 1965<\/strong>. It suspended <strong>literacy tests<\/strong>, sent <strong>federal examiners<\/strong> to register voters, and required federal <strong>preclearance<\/strong> of voting changes in covered states. Black registration in the South soared.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Jim Crow plus nonviolent protest met with televised violence (Birmingham, Selma)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Civil Rights Act (1964) and Voting Rights Act (1965)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Legal segregation ends; Black voting rises; the South shifts toward the Republican Party over time<\/div><\/div>\n<h2>3. Phase three: Black Power and urban unrest (1965–1968)<\/h2>\n<p>Legal victories did not end northern poverty, police abuse, or housing segregation. Riots broke out in <strong>Watts<\/strong> (Los Angeles, 1965), Newark, and <strong>Detroit<\/strong> (1967). Johnson's <strong>Kerner Commission<\/strong> (1968) concluded: \"Our nation is moving toward <strong>two societies, one black, one white—separate and unequal<\/strong>,\" and blamed white racism.<\/p>\n<p><strong>Malcolm X<\/strong>, a minister of the <strong>Nation of Islam<\/strong>, rejected integration and nonviolence and stressed Black self-defense and pride. He later broke with the Nation and was assassinated in 1965. SNCC's <strong>Stokely Carmichael<\/strong> popularized <strong>\"Black Power\"<\/strong> (1966): racial pride, self-reliance, and Black control of Black communities. The <strong>Black Panther Party<\/strong> (Oakland, 1966; Huey Newton and Bobby Seale) organized armed patrols to watch police and ran free breakfast programs.<\/p>\n<p>On <strong>April 4, 1968<\/strong>, <strong>King was assassinated<\/strong> in Memphis, and riots followed in over 100 cities. Days later Congress passed the <strong>Civil Rights Act of 1968<\/strong> (the <strong>Fair Housing Act<\/strong>). In 1971 the Court approved <strong>busing<\/strong> to desegregate schools (<strong>Swann v. Charlotte-Mecklenburg<\/strong>).<\/p>\n<h2>4. Kennedy and Johnson<\/h2>\n<p><strong>John F. Kennedy<\/strong> narrowly beat Richard Nixon in <strong>1960<\/strong>. Nixon was hurt in the first <strong>televised debates<\/strong>, and Kennedy became the first Catholic president. JFK's <strong>\"New Frontier\"<\/strong> produced the <strong>Peace Corps<\/strong> and a pledge to land on the <strong>moon<\/strong>; <strong>Apollo 11<\/strong> did it in 1969. Most of his domestic agenda stalled in Congress. He was <strong>assassinated in Dallas<\/strong> on <strong>November 22, 1963<\/strong>.<\/p>\n<p>JFK's Cold War crises:<\/p>\n<ul><li>The CIA-planned <strong>Bay of Pigs<\/strong> invasion of Cuba by exiles (April 1961) failed.<\/li><li>The <strong>Berlin Wall<\/strong> went up (August 1961).<\/li><li>In the <strong>Cuban Missile Crisis<\/strong> (October 1962), the U.S. discovered Soviet nuclear missiles in Cuba. Kennedy imposed a naval <strong>\"quarantine\"<\/strong> (blockade). After 13 tense days, <strong>Khrushchev removed the missiles<\/strong> in exchange for a U.S. pledge not to invade Cuba and a secret agreement to remove U.S. missiles from Turkey. It was the <strong>closest the world came to nuclear war<\/strong>.<\/li><li>Afterward came a <strong>hotline<\/strong> between Washington and Moscow and the <strong>Limited Test Ban Treaty<\/strong> (1963), which banned above-ground nuclear tests.<\/li><li>Kennedy replaced massive retaliation with <strong>\"flexible response,\"<\/strong> which included more conventional and counterinsurgency forces such as the Green Berets.<\/li><\/ul>\n<p><strong>Lyndon B. Johnson<\/strong> won a landslide over conservative Republican <strong>Barry Goldwater<\/strong> in <strong>1964<\/strong>. He then launched the <strong>Great Society<\/strong>, inspired partly by <strong>Michael Harrington's<\/strong> <em>The Other America<\/em> (1962), which exposed hidden poverty. Its main pieces:<\/p>\n<ul><li><strong>War on Poverty<\/strong> (Economic Opportunity Act, 1964): <strong>Job Corps<\/strong>, VISTA, community action programs, and <strong>Head Start<\/strong> for preschoolers.<\/li><li><strong>Medicare<\/strong> (health insurance for the <strong>elderly<\/strong>) and <strong>Medicaid<\/strong> (for the <strong>poor<\/strong>), 1965.<\/li><li>The <strong>Elementary and Secondary Education Act<\/strong> (1965): the first major federal aid to public schools.<\/li><li>The <strong>Immigration and Nationality Act of 1965<\/strong> (Hart-Celler) <strong>abolished the national-origins quotas<\/strong> of 1924. Immigration from <strong>Asia and Latin America<\/strong> grew dramatically as a result.<\/li><li>New departments (Housing and Urban Development, Transportation), the <strong>National Endowments for the Arts and Humanities<\/strong>, and public broadcasting.<\/li><\/ul>\n<p>Johnson also appointed <strong>Thurgood Marshall<\/strong>, the first Black Supreme Court justice (1967). Poverty fell sharply in the late 1960s, but the war in Vietnam drained money and attention from the Great Society.<\/p>\n<h2>5. The Warren Court (1953–1969)<\/h2>\n<p>Chief Justice <strong>Earl Warren's<\/strong> Court expanded rights dramatically:<\/p>\n<ul><li><strong>Mapp v. Ohio<\/strong> (1961): illegally obtained evidence is excluded from state trials.<\/li><li><strong>Engel v. Vitale<\/strong> (1962): official <strong>school prayer<\/strong> is unconstitutional.<\/li><li><strong>Gideon v. Wainwright<\/strong> (1963): states must provide <strong>lawyers<\/strong> to poor defendants.<\/li><li><strong>Reynolds v. Sims<\/strong> (1964), following Baker v. Carr: <strong>\"one person, one vote\"<\/strong> in legislative districts.<\/li><li><strong>Griswold v. Connecticut<\/strong> (1965): a right to <strong>privacy<\/strong> covering contraception.<\/li><li><strong>Miranda v. Arizona<\/strong> (1966): police must inform suspects of their <strong>rights<\/strong>.<\/li><li><strong>Loving v. Virginia<\/strong> (1967): struck down bans on <strong>interracial marriage<\/strong>.<\/li><li><strong>Tinker v. Des Moines<\/strong> (1969): students' antiwar armbands are protected speech.<\/li><\/ul>\n<p>Conservatives accused the Court of \"judicial activism.\"<\/p>\n<h2>6. Other rights movements<\/h2>\n<ul><li><strong>Women:<\/strong> <strong>Betty Friedan's<\/strong> <em>The Feminine Mystique<\/em> (1963) described the \"problem that has no name,\" the discontent of educated suburban housewives. Friedan co-founded the <strong>National Organization for Women (NOW)<\/strong> in 1966.<\/li><li>The <strong>Equal Pay Act<\/strong> (1963) and <strong>Title VII<\/strong> opened legal doors.<\/li><li>Radical \"women's liberation\" groups raised consciousness, and <strong>Gloria Steinem<\/strong> founded <em>Ms.<\/em> magazine (1972).<\/li><li>Congress passed the <strong>Equal Rights Amendment<\/strong> in 1972. <strong>Phyllis Schlafly<\/strong> led opposition, and it fell short of ratification.<\/li><li><strong>Title IX<\/strong> (1972) banned sex discrimination in federally funded education, transforming women's sports.<\/li><li><strong>Roe v. Wade<\/strong> (1973) legalized abortion nationwide.<\/li><li><strong>Latinos:<\/strong> <strong>César Chávez<\/strong> and <strong>Dolores Huerta's<\/strong> <strong>United Farm Workers<\/strong> used strikes and a national <strong>grape boycott<\/strong> (1965–70) to win contracts for migrant farmworkers. The <strong>Chicano movement<\/strong> demanded political power and bilingual education.<\/li><li><strong>Native Americans:<\/strong> The <strong>American Indian Movement<\/strong> (AIM, 1968) and others <strong>occupied Alcatraz<\/strong> (1969–71) and <strong>Wounded Knee<\/strong> (1973). Policy shifted to tribal <strong>self-determination<\/strong> (1975 act).<\/li><li><strong>Gay rights:<\/strong> the <strong>Stonewall riots<\/strong> (New York, 1969), sparked by a police raid on a gay bar, launched the modern gay liberation movement.<\/li><li><strong>Environment:<\/strong> <strong>Rachel Carson's<\/strong> <em>Silent Spring<\/em> (1962) exposed the dangers of the pesticide <strong>DDT<\/strong> and launched modern environmentalism. The first <strong>Earth Day<\/strong> was held in 1970.<\/li><li><strong>Consumers:<\/strong> <strong>Ralph Nader's<\/strong> <em>Unsafe at Any Speed<\/em> (1965) attacked auto safety.<\/li><\/ul>\n<h2>7. The Vietnam War<\/h2>\n<p><strong>Roots:<\/strong> After the French defeat (1954), the U.S. backed <strong>Ngo Dinh Diem's<\/strong> South Vietnam against <strong>Ho Chi Minh's<\/strong> communist North and the southern guerrillas, the <strong>Viet Cong<\/strong>. Policy rested on containment and the <strong>domino theory<\/strong>. Kennedy raised the number of military \"advisers\" to about 16,000. Diem, unpopular for persecuting Buddhists, was overthrown and killed in a coup in November 1963.<\/p>\n<p><strong>Escalation:<\/strong> In August 1964, North Vietnamese boats reportedly attacked U.S. destroyers. The reports were murky, and the second attack probably never happened. Congress passed the <strong>Gulf of Tonkin Resolution<\/strong> almost unanimously. It gave Johnson a <strong>\"blank check\"<\/strong> to use force without a declaration of war. In 1965 he began sustained bombing (<strong>Operation Rolling Thunder<\/strong>) and sent ground combat troops. U.S. forces peaked at about <strong>536,000<\/strong> in 1968. General <strong>William Westmoreland<\/strong> pursued a <strong>war of attrition<\/strong>: \"search and destroy\" missions measured by <strong>body counts<\/strong>. Officials' optimistic claims created a <strong>\"credibility gap.\"<\/strong><\/p>\n<p><strong>The turning point:<\/strong> In the <strong>Tet Offensive<\/strong> (January 1968), communist forces attacked cities across South Vietnam, even the U.S. embassy grounds in Saigon. Militarily it was a <strong>defeat for the communists<\/strong>, but it was a <strong>political and psychological victory<\/strong>: it shattered claims that the war was nearly won. Respected TV anchor Walter Cronkite called the war a stalemate. In March, Johnson announced he would <strong>not seek reelection<\/strong>.<\/p>\n<p><strong>1968, year of shocks:<\/strong> King was assassinated in April. <strong>Robert Kennedy<\/strong> was assassinated in June while running for president. Police clashed with antiwar protesters at the <strong>Democratic convention in Chicago<\/strong>. <strong>Richard Nixon<\/strong> won by appealing to the <strong>\"silent majority\"<\/strong> and <strong>\"law and order.\"<\/strong> Third-party candidate George Wallace carried five Deep South states.<\/p>\n<p><strong>Nixon's war:<\/strong><\/p>\n<ul><li><strong>Vietnamization<\/strong>: gradually withdrawing U.S. troops while building up South Vietnamese forces.<\/li><li>The <strong>Nixon Doctrine<\/strong>: allies must supply their own troops.<\/li><li>He secretly bombed and then invaded <strong>Cambodia<\/strong> (1970), setting off campus protests. National Guardsmen killed four students at <strong>Kent State<\/strong> and police killed two at <strong>Jackson State<\/strong>.<\/li><li>The <strong>My Lai massacre<\/strong> (1968, revealed in 1969), in which U.S. troops killed hundreds of unarmed villagers, deepened disillusionment.<\/li><li><strong>Daniel Ellsberg<\/strong> leaked the <strong>Pentagon Papers<\/strong> (1971), a secret history showing that officials had misled the public. The Supreme Court allowed the <em>New York Times<\/em> to publish them.<\/li><li>The <strong>Paris Peace Accords<\/strong> (January 1973) withdrew U.S. forces. The <strong>draft ended<\/strong> in 1973.<\/li><li><strong>Saigon fell<\/strong> to North Vietnam in <strong>April 1975<\/strong>.<\/li><\/ul>\n<p>About <strong>58,000 Americans<\/strong> and millions of Vietnamese died. Congress reasserted itself with the <strong>War Powers Resolution<\/strong> (1973), which requires the president to notify Congress within 48 hours of sending troops and to withdraw them within 60 days without authorization. The <strong>Twenty-sixth Amendment<\/strong> (1971) lowered the <strong>voting age to 18<\/strong>: if you were old enough to be drafted, you were old enough to vote.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Containment and the domino theory; Gulf of Tonkin Resolution<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Escalation to over 500,000 troops; Tet Offensive (1968)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Johnson withdraws from the race; Vietnamization; antiwar movement; War Powers Resolution; a \"Vietnam syndrome\" of caution about intervention<\/div><\/div>\n<h2>8. The New Left and the counterculture<\/h2>\n<ul><li><strong>Students for a Democratic Society<\/strong> (SDS) issued the <strong>Port Huron Statement<\/strong> (1962), which called for <strong>\"participatory democracy.\"<\/strong><\/li><li>The <strong>Free Speech Movement<\/strong> at <strong>Berkeley<\/strong> (1964) launched campus activism.<\/li><li>The antiwar movement grew from <strong>teach-ins<\/strong> to mass marches and draft-card burnings.<\/li><li>The <strong>counterculture<\/strong> of <strong>\"hippies\"<\/strong> rejected middle-class norms: long hair, rock music, drugs, communes, and the 1967 \"Summer of Love\" in San Francisco's Haight-Ashbury. It culminated at <strong>Woodstock<\/strong> (1969).<\/li><li>Folk and rock musicians such as <strong>Bob Dylan<\/strong> (\"The Times They Are a-Changin'\") gave the era its soundtrack.<\/li><li>Many Americans recoiled from the counterculture, which fed the conservative backlash that elected Nixon and later Reagan.<\/li><\/ul>","mustknow":["<strong>Brown v. Board<\/strong> (1954): school segregation \"inherently unequal\" (Warren, Thurgood Marshall). Little Rock (1957): Eisenhower sent troops.","<strong>Montgomery Bus Boycott<\/strong> (1955–56, Parks, King) → <strong>SCLC<\/strong>. <strong>Greensboro sit-ins<\/strong> (1960) → <strong>SNCC<\/strong>. <strong>Freedom Rides<\/strong> (1961, CORE).","<strong>Birmingham<\/strong> (1963, \"Letter from Birmingham Jail\") → <strong>March on Washington<\/strong> (\"I Have a Dream\").","<strong>Civil Rights Act of 1964<\/strong> (public accommodations, Title VII jobs incl. sex). <strong>24th Amendment<\/strong> (poll tax). <strong>Selma<\/strong> → <strong>Voting Rights Act of 1965<\/strong>.","<strong>Malcolm X<\/strong>, <strong>Black Power<\/strong> (Carmichael), <strong>Black Panthers<\/strong>. <strong>Kerner Commission<\/strong>: \"two societies.\"","<strong>Great Society<\/strong>: War on Poverty, <strong>Medicare/Medicaid<\/strong>, ESEA, <strong>Immigration Act of 1965<\/strong> (ended national-origins quotas).","Warren Court: <strong>Gideon<\/strong>, <strong>Miranda<\/strong>, <strong>Engel<\/strong>, <strong>Mapp<\/strong>, <strong>Reynolds<\/strong>, <strong>Loving<\/strong>, <strong>Griswold<\/strong>.","<strong>Friedan<\/strong> (<em>Feminine Mystique<\/em>, NOW), <strong>Title IX<\/strong>, <strong>ERA<\/strong> (failed), <strong>Roe<\/strong> (1973). <strong>Chávez<\/strong> (UFW, grape boycott). <strong>AIM<\/strong>. <strong>Stonewall<\/strong> (1969). <strong>Carson<\/strong> (<em>Silent Spring<\/em>).","JFK: <strong>Bay of Pigs<\/strong>, <strong>Cuban Missile Crisis<\/strong> (blockade; missiles out), Test Ban Treaty.","Vietnam: <strong>Gulf of Tonkin Resolution<\/strong> (1964), escalation, <strong>Tet<\/strong> (1968), <strong>Vietnamization<\/strong>, <strong>Kent State<\/strong> (1970), <strong>Pentagon Papers<\/strong>, <strong>War Powers Resolution<\/strong> (1973), <strong>26th Amendment<\/strong>, fall of Saigon (1975)."],"timeline":[{"y":"1954","t":"Brown v. Board of Education","key":true},{"y":"1955","t":"Emmett Till murdered; Montgomery Bus Boycott begins","key":false},{"y":"1957","t":"Little Rock Nine; SCLC founded; Civil Rights Act of 1957","key":false},{"y":"1960","t":"Greensboro sit-ins; SNCC founded; Kennedy–Nixon debates","key":true},{"y":"1961","t":"Bay of Pigs; Freedom Rides; Berlin Wall","key":false},{"y":"1962","t":"Cuban Missile Crisis; <em>Silent Spring<\/em>; Port Huron Statement; Engel v. Vitale","key":true},{"y":"1963","t":"Birmingham campaign; March on Washington; <em>The Feminine Mystique<\/em>; Gideon; JFK assassinated (Nov. 22)","key":true},{"y":"1964","t":"Civil Rights Act; 24th Amendment; Freedom Summer; Gulf of Tonkin Resolution; War on Poverty; LBJ beats Goldwater","key":true},{"y":"1965","t":"Selma; Voting Rights Act; Medicare/Medicaid; Immigration Act; Malcolm X killed; Watts riot; combat troops to Vietnam","key":true},{"y":"1966","t":"Miranda; NOW founded; \"Black Power\"; Black Panthers founded","key":false},{"y":"1967","t":"Detroit riot; Loving v. Virginia; Thurgood Marshall joins the Court","key":false},{"y":"1968","t":"Tet Offensive; LBJ withdraws; King and RFK assassinated; Fair Housing Act; Chicago convention; Nixon elected","key":true},{"y":"1969","t":"Stonewall; Woodstock; Apollo 11; My Lai revealed","key":false},{"y":"1970","t":"Cambodia invasion; Kent State; first Earth Day","key":false},{"y":"1971","t":"Pentagon Papers; 26th Amendment; Swann busing decision","key":false},{"y":"1972","t":"Title IX; ERA passes Congress","key":false},{"y":"1973","t":"Paris Peace Accords; Roe v. Wade; War Powers Resolution; draft ends","key":true},{"y":"1975","t":"Fall of Saigon","key":false}],"cards":[{"id":"u8c01","f":"Brown v. Board of Education (1954)","b":"Unanimous Warren Court: segregated public schools are \"inherently unequal.\" Overturned Plessy in education."},{"id":"u8c02","f":"Montgomery Bus Boycott (1955–56)","b":"Sparked by Rosa Parks's arrest. A 381-day boycott led by Martin Luther King Jr. ended bus segregation."},{"id":"u8c03","f":"Little Rock Nine (1957)","b":"Nine Black students integrated Central High. Eisenhower sent the 101st Airborne after Gov. Faubus resisted."},{"id":"u8c04","f":"SCLC","b":"Southern Christian Leadership Conference (1957), King's organization of Black churches for nonviolent direct action."},{"id":"u8c05","f":"Greensboro sit-ins (1960)","b":"Students sat at a whites-only Woolworth's lunch counter. Sit-ins spread and led to SNCC."},{"id":"u8c06","f":"SNCC","b":"Student Nonviolent Coordinating Committee (1960, aided by Ella Baker). Sit-ins, Freedom Summer, later Black Power."},{"id":"u8c07","f":"Freedom Rides (1961)","b":"CORE's integrated bus trips through the South to test desegregation of interstate travel. Met with mob violence."},{"id":"u8c08","f":"\"Letter from Birmingham Jail\" (1963)","b":"King's defense of nonviolent civil disobedience against unjust laws and of urgency over waiting."},{"id":"u8c09","f":"March on Washington (1963)","b":"About 250,000 rallied for jobs and freedom. King's \"I Have a Dream\" speech."},{"id":"u8c10","f":"Civil Rights Act of 1964","b":"Banned segregation in public accommodations and job discrimination (Title VII, including sex). Created the EEOC."},{"id":"u8c11","f":"Twenty-fourth Amendment (1964)","b":"Banned poll taxes in federal elections."},{"id":"u8c12","f":"Voting Rights Act of 1965","b":"After Selma: suspended literacy tests, sent federal examiners, required preclearance. Black voter registration soared."},{"id":"u8c13","f":"Malcolm X","b":"Nation of Islam minister who promoted Black nationalism and self-defense. Assassinated in 1965."},{"id":"u8c14","f":"Black Power","b":"Slogan popularized by Stokely Carmichael (1966): racial pride, self-reliance, Black community control."},{"id":"u8c15","f":"Kerner Commission (1968)","b":"Report on urban riots: \"two societies, one black, one white—separate and unequal.\" Blamed white racism."},{"id":"u8c16","f":"Great Society","b":"LBJ's programs: War on Poverty, Medicare, Medicaid, federal aid to education, Head Start, immigration reform."},{"id":"u8c17","f":"Medicare and Medicaid (1965)","b":"Medicare: health insurance for those 65 and older. Medicaid: health coverage for the poor."},{"id":"u8c18","f":"Immigration and Nationality Act of 1965","b":"Ended national-origins quotas. Led to large increases in Asian and Latin American immigration."},{"id":"u8c19","f":"<em>The Other America<\/em> (1962)","b":"Michael Harrington's exposé of hidden poverty. Influenced the War on Poverty."},{"id":"u8c20","f":"Gideon v. Wainwright (1963)","b":"States must provide free lawyers to poor defendants in felony cases."},{"id":"u8c21","f":"Miranda v. Arizona (1966)","b":"Police must tell suspects their rights (silence, counsel) before questioning."},{"id":"u8c22","f":"Engel v. Vitale (1962)","b":"Official prayer in public schools violates the Establishment Clause."},{"id":"u8c23","f":"Cuban Missile Crisis (1962)","b":"Soviet missiles in Cuba. JFK's naval quarantine. Missiles removed in exchange for a no-invasion pledge (and secretly, Turkey)."},{"id":"u8c24","f":"Bay of Pigs (1961)","b":"Failed CIA-backed invasion of Cuba by exiles. An embarrassment for JFK."},{"id":"u8c25","f":"<em>The Feminine Mystique<\/em> (1963)","b":"Betty Friedan's study of suburban women's discontent (\"the problem that has no name\"). Sparked second-wave feminism."},{"id":"u8c26","f":"NOW (1966)","b":"National Organization for Women, co-founded by Friedan. Pushed for legal equality and the ERA."},{"id":"u8c27","f":"Title IX (1972)","b":"Banned sex discrimination in federally funded education programs. Transformed women's athletics."},{"id":"u8c28","f":"César Chávez / UFW","b":"United Farm Workers (with Dolores Huerta). Nonviolent strikes and a national grape boycott for migrant farmworkers."},{"id":"u8c29","f":"Stonewall riots (1969)","b":"Resistance to a police raid on a New York gay bar. Launched the gay liberation movement."},{"id":"u8c30","f":"<em>Silent Spring<\/em> (1962)","b":"Rachel Carson's exposé of DDT and pesticides. Launched the modern environmental movement."},{"id":"u8c31","f":"Gulf of Tonkin Resolution (1964)","b":"Gave LBJ broad authority to use force in Vietnam without a declaration of war."},{"id":"u8c32","f":"Tet Offensive (1968)","b":"Communist attack across South Vietnam. A military failure, but it destroyed public confidence in the war."},{"id":"u8c33","f":"Vietnamization","b":"Nixon's policy of withdrawing U.S. troops while shifting combat to South Vietnamese forces."},{"id":"u8c34","f":"War Powers Resolution (1973)","b":"The president must notify Congress within 48 hours of deploying troops and withdraw within 60 days without approval."}]}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const UNITS = D.units;
const QS = D.questions;
const QMAP = Object.fromEntries(QS.map(q => [q.id, q]));
const CARDS = UNITS.flatMap(u => u.cards.map(c => Object.assign({u: u.n}, c)));
const CMAP = Object.fromEntries(CARDS.map(c => [c.id, c]));
const THEMES = Object.fromEntries(D.meta.thematic_weights.map(t => [t.id, t]));
const LETTERS = ['A','B','C','D','E'];
const DAY = 86400000;
const $ = s => document.querySelector(s);
const main = document.getElementById('main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => Math.round(x * 100) + '%';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

/* ---------- storage (safe) ---------- */
const KEY = 'clep-ush2-v1';
let storageOK = true;
function blankState(){ return {v:1, theme:null, lessonsRead:{}, quiz:{}, diag:null, exams:{}, examRun:null, cards:{}, mistakes:{}, plan:null}; }
function loadState(){
  try { const raw = localStorage.getItem(KEY); if (!raw) return blankState(); return sanitize(JSON.parse(raw)); }
  catch(e){ storageOK = false; return blankState(); }
}
function sanitize(o){
  const s = blankState();
  if (!o || typeof o !== 'object') return s;
  for (const k of Object.keys(s)) if (o[k] !== undefined && typeof o[k] === typeof s[k] || (s[k] === null && o[k] && typeof o[k] === 'object')) s[k] = o[k];
  if (o.theme === 'light' || o.theme === 'dark') s.theme = o.theme;
  return s;
}
let S = loadState();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e){ storageOK = false; } }

/* ---------- theme ---------- */
function applyTheme(){ if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
$('#themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
applyTheme();

/* ---------- keyboard ---------- */
let keyHandler = null;
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (keyHandler && keyHandler(e) === true) e.preventDefault();
});

/* ---------- derived progress ---------- */
const unitQs = (n, pool) => QS.filter(q => q.u === n && (!pool || q.pool === pool));
const diagLabel = n => {
  if (!S.diag || !S.diag.byUnit || !S.diag.byUnit[n]) return null;
  const r = S.diag.byUnit[n]; const p = r.c / r.n;
  return p >= 0.75 ? 'skim' : p >= 0.5 ? 'study' : 'must';
};
const labelPill = l => l === 'skim' ? '<span class="pill good">Skim</span>' : l === 'study' ? '<span class="pill warn">Study</span>' : l === 'must' ? '<span class="pill bad">Must study</span>' : '';
const unitDone = n => !!S.lessonsRead[n] && S.quiz[n] && S.quiz[n].best >= 0.7;
const cardState = id => S.cards[id] || null;
function cardMastery(n){ const cs = CARDS.filter(c => !n || c.u === n); if (!cs.length) return 0; return cs.filter(c => (S.cards[c.id] || {}).box >= 3).length / cs.length; }
function dueCards(n){ const now = Date.now(); return CARDS.filter(c => (!n || c.u === n) && (!S.cards[c.id] || S.cards[c.id].due <= now)); }
function openMistakes(){ return Object.keys(S.mistakes).filter(id => QMAP[id] && !S.mistakes[id].ok); }

/* time model (minutes) */
function unitTasks(n){
  const u = UNITS[n-1]; const lab = diagLabel(n); const f = lab === 'skim' ? 0.5 : 1;
  const qn = unitQs(n, 'quiz').length;
  return [
    {id:'lesson'+n, unit:n, kind:'lesson', label:`Unit ${n}: read lesson + must-know + timeline`, min: Math.round((u.minutes + 10) * f), done: !!S.lessonsRead[n]},
    {id:'quiz'+n, unit:n, kind:'quiz', label:`Unit ${n}: quiz (${qn} Q) + review explanations`, min: Math.round(qn * 1.5), done: !!S.quiz[n]},
    {id:'cards'+n, unit:n, kind:'cards', label:`Unit ${n}: learn flashcards (${u.cards.length})`, min: Math.round(u.cards.length * 1.0), done: cardMastery(n) >= 0.8, frac: cardMastery(n)}
  ];
}
function allTasks(){
  const t = [{id:'diag', kind:'diag', label:'Diagnostic test (30 Q)', min:45, done: !!S.diag}];
  const order = UNITS.map(u => u.n).sort((a,b) => { const r = l => ({must:0, study:1, skim:2})[diagLabel(l)] ?? 1; return r(a) - r(b) || a - b; });
  for (const n of order) t.push(...unitTasks(n));
  t.push({id:'review', kind:'review', label:'Spaced flashcard reviews (ongoing)', min: Math.round(CARDS.length * 0.9 * (1 - cardMastery())), done: cardMastery() >= 0.9});
  t.push({id:'mist', kind:'mist', label:'Drill the mistake log', min: Math.max(30, openMistakes().length * 2), done: false, always:true});
  t.push({id:'cheat', kind:'cheat', label:'Cheat sheet: redraw from memory', min:60, done:false, always:true});
  t.push({id:'examA', kind:'exam', label:'Practice Exam 1 (90 min) + review', min:150, done: !!(S.exams.A && S.exams.A.attempts)});
  t.push({id:'examB', kind:'exam', label:'Practice Exam 2 (90 min) + review', min:150, done: !!(S.exams.B && S.exams.B.attempts)});
  return t;
}

/* ---------- QUIZ ENGINE (practice / diagnostic / drill) ---------- */
function recordMistake(id, correct, mode){
  if (!correct) { const m = S.mistakes[id] || {n:0}; m.n++; m.t = Date.now(); m.ok = false; S.mistakes[id] = m; }
  else if (mode === 'drill' && S.mistakes[id]) { S.mistakes[id].ok = true; }
}
function stimHTML(q){ return q.st ? `<div class="stim">${q.st}</div>` : ''; }
function qMeta(q){ return `<span class="pill">Unit ${q.u}</span> <span class="pill">${esc(THEMES[q.th].short)}</span>`; }
function runQuiz(opts){
  const {qs, mode} = opts; let i = 0, sel = null, revealed = false; const res = [];
  const feedback = mode !== 'diag';
  function render(){
    const q = qs[i];
    main.innerHTML = banners() + `<div class="qhead"><b>${esc(opts.title)}</b><span class="muted small">Question ${i+1} of ${qs.length}</span></div>
    <div class="bar"><span style="width:${(i)/qs.length*100}%"></span></div>
    <div class="card">${feedback ? `<div class="row small" style="margin-bottom:6px">${qMeta(q)}</div>` : ''}${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o, k) => {
      let cls = '';
      if (revealed) cls = k === q.a ? 'right' : (k === sel ? 'wrong' : '');
      else if (k === sel) cls = 'sel';
      return `<button class="opt ${cls}" data-k="${k}" ${revealed ? 'disabled' : ''}><span class="k">${LETTERS[k]}</span><span>${o}${revealed ? `<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span>` : ''}</span></button>`;
    }).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <a href="${opts.back}" class="small muted">Quit</a>
      <button class="btn" id="nx" ${sel == null ? 'disabled' : ''}>${!feedback ? (i === qs.length-1 ? 'Finish' : 'Next') : revealed ? (i === qs.length-1 ? 'See results' : 'Next') : 'Check'}</button></div>
    <div class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> ${feedback ? 'answer' : 'select'} · <span class="kbd">Enter</span> ${feedback ? 'next' : 'confirm'}</div></div>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
    $('#nx').onclick = next;
  }
  function choose(k){ if (revealed) return; sel = k; if (feedback) reveal(); else render(); }
  function reveal(){ revealed = true; const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); render(); }
  function next(){
    if (sel == null) return;
    if (feedback && !revealed) { reveal(); return; }
    if (!feedback) { const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); }
    if (i < qs.length - 1) { i++; sel = null; revealed = false; render(); window.scrollTo(0,0); }
    else finish();
  }
  function finish(){
    keyHandler = null;
    const r = {total: res.length, correct: res.filter(x => x.ok).length, res};
    if (opts.onDone) opts.onDone(r);
    if (opts.renderResults) return opts.renderResults(r);
    main.innerHTML = banners() + `<h1>${esc(opts.title)}: results</h1><div class="card"><div style="font-size:2rem;font-weight:700">${r.correct} / ${r.total} <span class="muted" style="font-size:1rem">(${pct(r.correct/r.total)})</span></div>
    <p class="muted">${r.correct/r.total >= 0.75 ? 'Solid. Keep the flashcards going.' : 'Missed questions are now in your mistake log. Re-read the bold terms in the lesson, then drill them.'}</p>
    <div class="row"><a class="btn" href="${opts.back}">Done</a><a class="btn ghost" href="#/mistakes">Mistake log</a></div></div>${reviewList(res.filter(x => !x.ok))}`;
  }
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { choose(+e.key - 1); return true; }
    const L = e.key.toUpperCase(); if (!revealed && LETTERS.includes(L) && e.key.length === 1) { choose(LETTERS.indexOf(L)); return true; }
    if (e.key === 'Enter') { next(); return true; }
  };
  render();
}
function reviewList(items, title){
  if (!items.length) return '';
  return `<h2>${title || 'Review what you missed'}</h2>` + items.map(x => { const q = QMAP[x.id]; return `<div class="card"><div class="row small">${qMeta(q)}</div>${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o,k) => `<div class="opt ${k === q.a ? 'right' : k === x.sel ? 'wrong' : ''}"><span class="k">${LETTERS[k]}</span><span>${o}<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span></span></div>`).join('')}</div></div>`; }).join('');
}
