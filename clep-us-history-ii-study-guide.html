cticed <strong>\"Modern Republicanism.\"<\/strong> He accepted and even expanded the New Deal: Social Security grew, and he created the Department of Health, Education, and Welfare. But he favored balanced budgets. The <strong>Interstate Highway Act<\/strong> (1956), justified partly for defense and evacuation, built 41,000 miles of highway, the largest public works program in history.<\/p>\n<p><strong>Foreign policy:<\/strong> Secretary of State <strong>John Foster Dulles<\/strong> practiced <strong>brinkmanship<\/strong>.<\/p>\n<ul><li>The <strong>\"New Look\"<\/strong> relied on nuclear weapons and the threat of <strong>\"massive retaliation\"<\/strong> rather than costly ground forces: \"more bang for the buck.\"<\/li><li>The <strong>CIA<\/strong> ran <strong>covert operations<\/strong>, overthrowing governments in <strong>Iran<\/strong> (1953) and <strong>Guatemala<\/strong> (1954).<\/li><li>Eisenhower's <strong>domino theory<\/strong> (1954) held that if Vietnam fell to communism, its neighbors would follow. After the French defeat at Dien Bien Phu, the <strong>Geneva Accords<\/strong> (1954) temporarily divided Vietnam at the <strong>17th parallel<\/strong>. The U.S. backed <strong>Ngo Dinh Diem's<\/strong> South Vietnam and formed <strong>SEATO<\/strong>.<\/li><li>In the <strong>Suez Crisis<\/strong> (1956), Eisenhower forced Britain, France, and Israel to withdraw from Egypt.<\/li><li>He did <strong>not<\/strong> intervene when the Soviets crushed the <strong>Hungarian Revolution<\/strong> (1956).<\/li><li>The <strong>Eisenhower Doctrine<\/strong> (1957) offered aid against communism in the <strong>Middle East<\/strong>.<\/li><\/ul>\n<p><strong>Sputnik:<\/strong> In October 1957 the Soviets launched <strong>Sputnik<\/strong>, the first artificial satellite. Americans feared a \"missile gap\" and a science gap. Congress created <strong>NASA<\/strong> (1958) and passed the <strong>National Defense Education Act<\/strong> (1958), which funded science, math, and foreign-language education.<\/p>\n<p>At the end of his term, the <strong>U-2 incident<\/strong> (1960), a U.S. spy plane shot down over the USSR, wrecked a summit. In 1959 <strong>Fidel Castro<\/strong> took power in Cuba. In his <strong>Farewell Address<\/strong> (1961), Eisenhower warned against the <strong>\"military-industrial complex.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Sputnik (1957)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>NASA, National Defense Education Act, space race<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Federal investment in science and education; Cold War competition reaches schools<\/div><\/div>\n<h2>6. The affluent society<\/h2>\n<p>The postwar economy boomed. Pent-up savings, government spending (defense, highways, the <strong>GI Bill<\/strong>), and cheap energy fueled it. Births soared in the <strong>baby boom<\/strong> (1946–1964).<\/p>\n<p><strong>Suburbs:<\/strong> Builder <strong>William Levitt<\/strong> mass-produced affordable homes in <strong>Levittown<\/strong>, New York. <strong>FHA and VA mortgages<\/strong> made them easy to buy. But <strong>restrictive covenants and \"redlining\"<\/strong> excluded Black families, which cemented residential segregation. Millions moved to suburbs and to the <strong>Sun Belt<\/strong>, while inner cities lost people and tax revenue.<\/p>\n<p><strong>Consumer culture:<\/strong> Families bought <strong>cars<\/strong>, appliances, and <strong>television<\/strong>. By 1960 almost 90% of households had a TV, which spread shared programs and advertising. Credit cards appeared. A <strong>religious revival<\/strong> (evangelist <strong>Billy Graham<\/strong>) went with Cold War anti-communism: \"under God\" was added to the Pledge of Allegiance (1954). <strong>Jonas Salk's polio vaccine<\/strong> (1955) was a triumph of science.<\/p>\n<p><strong>The ideal of domesticity:<\/strong> Popular culture celebrated the suburban homemaker, and <strong>Dr. Benjamin Spock's<\/strong> <em>Baby and Child Care<\/em> (1946) became a bestseller. In reality, more married women were taking paid jobs every year.<\/p>\n<p><strong>Critics of conformity:<\/strong><\/p>\n<ul><li><strong>David Riesman<\/strong>, <em>The Lonely Crowd<\/em> (1950): \"other-directed\" people seek approval from peers.<\/li><li><strong>William Whyte<\/strong>, <em>The Organization Man<\/em> (1956): corporate conformity.<\/li><li><strong>John Kenneth Galbraith<\/strong>, <em>The Affluent Society<\/em> (1958): private wealth amid public neglect.<\/li><li><strong>C. Wright Mills<\/strong>, <em>The Power Elite<\/em> (1956).<\/li><li>Novels like <em>The Man in the Gray Flannel Suit<\/em> (Sloan Wilson).<\/li><\/ul>\n<p><strong>Rebels:<\/strong> The <strong>Beat Generation<\/strong> rejected materialism and conformity: <strong>Jack Kerouac's<\/strong> <em>On the Road<\/em> (1957) and <strong>Allen Ginsberg's<\/strong> <em>Howl<\/em> (1956). <strong>J.D. Salinger's<\/strong> <em>The Catcher in the Rye<\/em> (1951) spoke to alienated teens. <strong>Rock and roll<\/strong> (Elvis Presley, Chuck Berry, Little Richard) blended Black rhythm and blues with country and alarmed parents. <strong>Abstract Expressionist<\/strong> painters such as <strong>Jackson Pollock<\/strong> made New York the center of the art world.<\/p>\n<p><strong>Left behind:<\/strong> Prosperity did not reach everyone. Federal Indian policy shifted to <strong>\"termination\"<\/strong> (ending tribal recognition) and <strong>relocation<\/strong> to cities. <strong>\"Operation Wetback\"<\/strong> (1954) deported large numbers of Mexican migrants. Rural and urban poverty persisted (see Unit 8).<\/p>","mustknow":["<strong>Containment<\/strong> (George Kennan) was the core Cold War strategy.","<strong>Truman Doctrine<\/strong> (1947, Greece/Turkey military aid). <strong>Marshall Plan<\/strong> (1948, economic aid to rebuild Europe).","<strong>Berlin Airlift<\/strong> (1948–49); <strong>NATO<\/strong> (1949, first peacetime alliance); 1949: Soviet A-bomb + China falls to Mao.","<strong>Korean War<\/strong> (1950–53): UN action, Inchon, China enters, <strong>Truman fires MacArthur<\/strong> (civilian control), armistice at the 38th parallel.","<strong>Second Red Scare<\/strong>: HUAC/Hollywood Ten, Hiss, Rosenbergs, <strong>McCarthy<\/strong> (Army-McCarthy hearings 1954, censure).","<strong>Taft-Hartley<\/strong> (1947, curbed unions); <strong>EO 9981<\/strong> (1948, desegregated the military); <strong>1948<\/strong>: Truman beats Dewey despite Dixiecrats.","<strong>Eisenhower<\/strong>: Modern Republicanism, <strong>Interstate Highway Act<\/strong> (1956), <strong>massive retaliation/brinkmanship<\/strong>, CIA coups (Iran, Guatemala), <strong>domino theory<\/strong>.","<strong>Sputnik<\/strong> (1957) → <strong>NASA<\/strong> and the <strong>National Defense Education Act<\/strong> (1958). <strong>Military-industrial complex<\/strong> warning (1961).","1950s society: <strong>baby boom<\/strong>, <strong>Levittown<\/strong> suburbs (with racial exclusion), TV, religious revival.","Critics/rebels: Riesman, Whyte, Galbraith; <strong>Beats<\/strong> (Kerouac, Ginsberg); <strong>rock and roll<\/strong>; Salinger."],"timeline":[{"y":"1946","t":"Kennan's Long Telegram; Churchill's \"Iron Curtain\" speech; Employment Act; strike wave","key":false},{"y":"1947","t":"Truman Doctrine; Taft-Hartley Act; National Security Act; HUAC Hollywood hearings; Jackie Robinson; Levittown begins","key":true},{"y":"1948","t":"Marshall Plan; Berlin Airlift begins; EO 9981; Truman upsets Dewey","key":true},{"y":"1949","t":"NATO formed; Soviet atomic bomb; communist victory in China","key":true},{"y":"1950","t":"McCarthy's Wheeling speech; Korean War begins; NSC-68; Hiss convicted","key":true},{"y":"1951","t":"Truman fires MacArthur; 22nd Amendment","key":false},{"y":"1953","t":"Korean armistice; Rosenbergs executed; CIA coup in Iran","key":false},{"y":"1954","t":"Army-McCarthy hearings and censure; Geneva Accords; domino theory; Guatemala coup","key":false},{"y":"1955","t":"Warsaw Pact; Salk polio vaccine","key":false},{"y":"1956","t":"Interstate Highway Act; Suez Crisis; Hungarian Revolution; <em>Howl<\/em>","key":false},{"y":"1957","t":"Sputnik; Eisenhower Doctrine; <em>On the Road<\/em>","key":true},{"y":"1958","t":"NASA and National Defense Education Act","key":false},{"y":"1959","t":"Castro takes power in Cuba","key":false},{"y":"1960","t":"U-2 incident","key":false},{"y":"1961","t":"Eisenhower's Farewell Address (\"military-industrial complex\")","key":false}],"cards":[{"id":"u7c01","f":"Containment","b":"George Kennan's strategy: firmly resist Soviet expansion wherever it threatens, without all-out war."},{"id":"u7c02","f":"Iron Curtain speech (1946)","b":"Churchill's warning in Fulton, Missouri, that Soviet domination had divided Europe."},{"id":"u7c03","f":"Truman Doctrine (1947)","b":"$400 million in aid to Greece and Turkey. The U.S. would \"support free peoples\" resisting communist subjugation."},{"id":"u7c04","f":"Marshall Plan (1948)","b":"About $13 billion in economic aid to rebuild Western Europe and blunt communism's appeal."},{"id":"u7c05","f":"Berlin Airlift (1948–49)","b":"U.S. and British planes supplied West Berlin during the Soviet blockade until Stalin lifted it."},{"id":"u7c06","f":"NATO (1949)","b":"North Atlantic Treaty Organization. First U.S. peacetime military alliance. An attack on one is an attack on all."},{"id":"u7c07","f":"National Security Act (1947)","b":"Created the Department of Defense, the CIA, and the National Security Council."},{"id":"u7c08","f":"NSC-68 (1950)","b":"Secret policy paper calling for a massive military buildup to contain communism globally."},{"id":"u7c09","f":"Korean War (1950–53)","b":"North invaded South. UN/U.S. defense, Chinese intervention, MacArthur fired, armistice near the 38th parallel."},{"id":"u7c10","f":"MacArthur's firing (1951)","b":"Truman removed MacArthur for publicly demanding a wider war with China. Civilian control of the military."},{"id":"u7c11","f":"HUAC / Hollywood Ten","b":"House Un-American Activities Committee investigated Hollywood communism. The Ten were jailed, and a blacklist followed."},{"id":"u7c12","f":"Alger Hiss","b":"Ex-State Department official accused of spying for the USSR. Convicted of perjury (1950). Boosted Nixon's career."},{"id":"u7c13","f":"Rosenbergs","b":"Julius and Ethel Rosenberg, executed in 1953 for passing atomic secrets to the USSR."},{"id":"u7c14","f":"McCarthyism","b":"Sen. Joseph McCarthy's reckless anti-communist accusations (1950–54). Ended after the Army-McCarthy hearings and censure."},{"id":"u7c15","f":"Taft-Hartley Act (1947)","b":"Passed over Truman's veto. Banned the closed shop, allowed right-to-work laws, cooling-off periods, anti-communist oaths."},{"id":"u7c16","f":"Executive Order 9981 (1948)","b":"Truman's order desegregating the U.S. armed forces."},{"id":"u7c17","f":"Election of 1948","b":"Truman's upset win over Dewey despite Dixiecrat (Thurmond) and Progressive (Wallace) splits."},{"id":"u7c18","f":"Twenty-second Amendment (1951)","b":"Limits presidents to two elected terms."},{"id":"u7c19","f":"Modern Republicanism","b":"Eisenhower's acceptance of New Deal programs combined with fiscal conservatism."},{"id":"u7c20","f":"Interstate Highway Act (1956)","b":"Built 41,000 miles of interstate highways. Spurred suburbs and car culture, justified for defense."},{"id":"u7c21","f":"Massive retaliation / Brinkmanship","b":"Eisenhower–Dulles \"New Look\": rely on nuclear threats rather than large conventional forces, going to the brink of war."},{"id":"u7c22","f":"Domino theory","b":"Eisenhower (1954): if one Southeast Asian nation falls to communism, its neighbors will follow."},{"id":"u7c23","f":"Sputnik (1957)","b":"First Soviet satellite. Sparked U.S. fears and led to NASA and the National Defense Education Act (1958)."},{"id":"u7c24","f":"Military-industrial complex","b":"Eisenhower's 1961 farewell warning about the influence of the permanent arms industry and military."},{"id":"u7c25","f":"Baby boom","b":"Surge in births, 1946–1964, shaping schools, suburbs, and culture for decades."},{"id":"u7c26","f":"Levittown","b":"Mass-produced suburban housing (William Levitt). Affordable but initially excluded Black families."},{"id":"u7c27","f":"Beat Generation","b":"1950s writers rejecting conformity and materialism: Jack Kerouac (<em>On the Road<\/em>), Allen Ginsberg (<em>Howl<\/em>)."},{"id":"u7c28","f":"<em>The Lonely Crowd<\/em> / <em>The Organization Man<\/em>","b":"1950s critiques of conformity: Riesman's \"other-directed\" people and Whyte's corporate conformists."},{"id":"u7c29","f":"Termination policy","b":"1950s federal effort to end tribal recognition and move Native Americans into the mainstream. Reversed in the 1970s."}]},{"n":8,"title":"Civil Rights, the Great Society, and Vietnam","years":"1954–1975","period":"late","weight":13,"minutes":16,"lesson":"<h2>The big picture<\/h2>\n<p>This is the <strong>most heavily weighted unit<\/strong>, and it carries a large share of the social and cultural questions. Between 1954 and 1975 four things happened at once:<\/p>\n<ul><li>The <strong>civil rights movement<\/strong> destroyed legal segregation and won federal protection of voting rights.<\/li><li><strong>Lyndon Johnson's Great Society<\/strong> built the largest expansion of federal social programs since the New Deal.<\/li><li>The <strong>Warren Court<\/strong> expanded individual rights.<\/li><li>Women, Latinos, Native Americans, gay Americans, and environmentalists launched their own movements.<\/li><\/ul>\n<p>Over all of it hung the <strong>Vietnam War<\/strong>. It split the country, drove LBJ from office, fed a youth <strong>counterculture<\/strong>, and ended in American withdrawal.<\/p>\n<h2>1. The civil rights movement, phase one (1954–1960)<\/h2>\n<p><strong>Brown v. Board of Education<\/strong> (1954) was the legal breakthrough. NAACP lawyer <strong>Thurgood Marshall<\/strong> argued it, and a unanimous Court under Chief Justice <strong>Earl Warren<\/strong> ruled that <strong>segregated public schools are \"inherently unequal.\"<\/strong> That overturned <em>Plessy<\/em> in education. A second ruling (1955) ordered desegregation \"with all deliberate speed,\" which southern officials treated as permission to delay. Over 100 southern congressmen signed the <strong>Southern Manifesto<\/strong> (1956) pledging <strong>\"massive resistance.\"<\/strong><\/p>\n<p>Key events of the 1950s:<\/p>\n<ul><li><strong>Emmett Till<\/strong> (1955), a 14-year-old from Chicago, was murdered in Mississippi. His mother's open-casket funeral shocked the nation.<\/li><li><strong>Montgomery Bus Boycott<\/strong> (1955–56): after <strong>Rosa Parks<\/strong> refused to give up her bus seat, Black residents boycotted the buses for <strong>381 days<\/strong>, led by a young minister, <strong>Martin Luther King Jr.<\/strong> A Supreme Court ruling ended bus segregation. King and others then formed the <strong>Southern Christian Leadership Conference (SCLC)<\/strong> in 1957, committed to <strong>nonviolent<\/strong> direct action.<\/li><li><strong>Little Rock<\/strong> (1957): Arkansas governor <strong>Orval Faubus<\/strong> used the National Guard to block nine Black students from Central High School. <strong>Eisenhower<\/strong> sent the <strong>101st Airborne<\/strong> to enforce the court order.<\/li><li>The <strong>Civil Rights Act of 1957<\/strong> was the first since Reconstruction. It was weak, but it created a Civil Rights Commission.<\/li><\/ul>\n<h2>2. Phase two: direct action (1960–1965)<\/h2>\n<ul><li><strong>Sit-ins<\/strong> (1960): four Black college students sat at a whites-only <strong>Woolworth's lunch counter in Greensboro, North Carolina<\/strong>. Sit-ins spread across the South. With help from <strong>Ella Baker<\/strong>, students formed the <strong>Student Nonviolent Coordinating Committee (SNCC)<\/strong>.<\/li><li><strong>Freedom Rides<\/strong> (1961): <strong>CORE<\/strong> sent integrated groups on interstate buses to test desegregation rulings. Mobs firebombed a bus in Alabama, and the Kennedy administration finally sent federal marshals.<\/li><li><strong>James Meredith<\/strong> integrated the University of Mississippi (1962) under federal protection.<\/li><li><strong>Birmingham<\/strong> (1963): police chief <strong>Bull Connor<\/strong> turned <strong>fire hoses and police dogs<\/strong> on marching children, and the images went around the world. Jailed, King wrote his <strong>\"Letter from Birmingham Jail,\"<\/strong> defending civil disobedience against unjust laws.<\/li><li><strong>March on Washington<\/strong> (August 1963): about 250,000 people gathered at the Lincoln Memorial, where King gave his <strong>\"I Have a Dream\"<\/strong> speech. Weeks later, a bomb at Birmingham's <strong>16th Street Baptist Church<\/strong> killed four girls.<\/li><\/ul>\n<p>After Kennedy's assassination, <strong>Lyndon Johnson<\/strong> used his legislative skill to break a southern filibuster and pass the <strong>Civil Rights Act of 1964<\/strong>:<\/p>\n<ul><li>It banned segregation in <strong>public accommodations<\/strong> (hotels, restaurants, theaters).<\/li><li>Its <strong>Title VII<\/strong> banned employment discrimination by race, color, religion, national origin, <strong>and sex<\/strong>.<\/li><li>It created the <strong>Equal Employment Opportunity Commission<\/strong> (EEOC).<\/li><\/ul>\n<p>The <strong>Twenty-fourth Amendment<\/strong> (1964) outlawed <strong>poll taxes<\/strong> in federal elections.<\/p>\n<p><strong>Voting rights:<\/strong> In <strong>Freedom Summer<\/strong> (1964), volunteers registered Black voters in Mississippi, and three civil rights workers were murdered. <strong>Fannie Lou Hamer's<\/strong> <strong>Mississippi Freedom Democratic Party<\/strong> challenged the all-white state delegation at the Democratic convention. In <strong>Selma<\/strong> (March 1965), state troopers beat marchers, including <strong>John Lewis<\/strong>, on <strong>\"Bloody Sunday.\"<\/strong> Days later Johnson called for the <strong>Voting Rights Act of 1965<\/strong>. It suspended <strong>literacy tests<\/strong>, sent <strong>federal examiners<\/strong> to register voters, and required federal <strong>preclearance<\/strong> of voting changes in covered states. Black registration in the South soared.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Jim Crow plus nonviolent protest met with televised violence (Birmingham, Selma)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Civil Rights Act (1964) and Voting Rights Act (1965)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Legal segregation ends; Black voting rises; the South shifts toward the Republican Party over time<\/div><\/div>\n<h2>3. Phase three: Black Power and urban unrest (1965–1968)<\/h2>\n<p>Legal victories did not end northern poverty, police abuse, or housing segregation. Riots broke out in <strong>Watts<\/strong> (Los Angeles, 1965), Newark, and <strong>Detroit<\/strong> (1967). Johnson's <strong>Kerner Commission<\/strong> (1968) concluded: \"Our nation is moving toward <strong>two societies, one black, one white—separate and unequal<\/strong>,\" and blamed white racism.<\/p>\n<p><strong>Malcolm X<\/strong>, a minister of the <strong>Nation of Islam<\/strong>, rejected integration and nonviolence and stressed Black self-defense and pride. He later broke with the Nation and was assassinated in 1965. SNCC's <strong>Stokely Carmichael<\/strong> popularized <strong>\"Black Power\"<\/strong> (1966): racial pride, self-reliance, and Black control of Black communities. The <strong>Black Panther Party<\/strong> (Oakland, 1966; Huey Newton and Bobby Seale) organized armed patrols to watch police and ran free breakfast programs.<\/p>\n<p>On <strong>April 4, 1968<\/strong>, <strong>King was assassinated<\/strong> in Memphis, and riots followed in over 100 cities. Days later Congress passed the <strong>Civil Rights Act of 1968<\/strong> (the <strong>Fair Housing Act<\/strong>). In 1971 the Court approved <strong>busing<\/strong> to desegregate schools (<strong>Swann v. Charlotte-Mecklenburg<\/strong>).<\/p>\n<h2>4. Kennedy and Johnson<\/h2>\n<p><strong>John F. Kennedy<\/strong> narrowly beat Richard Nixon in <strong>1960<\/strong>. Nixon was hurt in the first <strong>televised debates<\/strong>, and Kennedy became the first Catholic president. JFK's <strong>\"New Frontier\"<\/strong> produced the <strong>Peace Corps<\/strong> and a pledge to land on the <strong>moon<\/strong>; <strong>Apollo 11<\/strong> did it in 1969. Most of his domestic agenda stalled in Congress. He was <strong>assassinated in Dallas<\/strong> on <strong>November 22, 1963<\/strong>.<\/p>\n<p>JFK's Cold War crises:<\/p>\n<ul><li>The CIA-planned <strong>Bay of Pigs<\/strong> invasion of Cuba by exiles (April 1961) failed.<\/li><li>The <strong>Berlin Wall<\/strong> went up (August 1961).<\/li><li>In the <strong>Cuban Missile Crisis<\/strong> (October 1962), the U.S. discovered Soviet nuclear missiles in Cuba. Kennedy imposed a naval <strong>\"quarantine\"<\/strong> (blockade). After 13 tense days, <strong>Khrushchev removed the missiles<\/strong> in exchange for a U.S. pledge not to invade Cuba and a secret agreement to remove U.S. missiles from Turkey. It was the <strong>closest the world came to nuclear war<\/strong>.<\/li><li>Afterward came a <strong>hotline<\/strong> between Washington and Moscow and the <strong>Limited Test Ban Treaty<\/strong> (1963), which banned above-ground nuclear tests.<\/li><li>Kennedy replaced massive retaliation with <strong>\"flexible response,\"<\/strong> which included more conventional and counterinsurgency forces such as the Green Berets.<\/li><\/ul>\n<p><strong>Lyndon B. Johnson<\/strong> won a landslide over conservative Republican <strong>Barry Goldwater<\/strong> in <strong>1964<\/strong>. He then launched the <strong>Great Society<\/strong>, inspired partly by <strong>Michael Harrington's<\/strong> <em>The Other America<\/em> (1962), which exposed hidden poverty. Its main pieces:<\/p>\n<ul><li><strong>War on Poverty<\/strong> (Economic Opportunity Act, 1964): <strong>Job Corps<\/strong>, VISTA, community action programs, and <strong>Head Start<\/strong> for preschoolers.<\/li><li><strong>Medicare<\/strong> (health insurance for the <strong>elderly<\/strong>) and <strong>Medicaid<\/strong> (for the <strong>poor<\/strong>), 1965.<\/li><li>The <strong>Elementary and Secondary Education Act<\/strong> (1965): the first major federal aid to public schools.<\/li><li>The <strong>Immigration and Nationality Act of 1965<\/strong> (Hart-Celler) <strong>abolished the national-origins quotas<\/strong> of 1924. Immigration from <strong>Asia and Latin America<\/strong> grew dramatically as a result.<\/li><li>New departments (Housing and Urban Development, Transportation), the <strong>National Endowments for the Arts and Humanities<\/strong>, and public broadcasting.<\/li><\/ul>\n<p>Johnson also appointed <strong>Thurgood Marshall<\/strong>, the first Black Supreme Court justice (1967). Poverty fell sharply in the late 1960s, but the war in Vietnam drained money and attention from the Great Society.<\/p>\n<h2>5. The Warren Court (1953–1969)<\/h2>\n<p>Chief Justice <strong>Earl Warren's<\/strong> Court expanded rights dramatically:<\/p>\n<ul><li><strong>Mapp v. Ohio<\/strong> (1961): illegally obtained evidence is excluded from state trials.<\/li><li><strong>Engel v. Vitale<\/strong> (1962): official <strong>school prayer<\/strong> is unconstitutional.<\/li><li><strong>Gideon v. Wainwright<\/strong> (1963): states must provide <strong>lawyers<\/strong> to poor defendants.<\/li><li><strong>Reynolds v. Sims<\/strong> (1964), following Baker v. Carr: <strong>\"one person, one vote\"<\/strong> in legislative districts.<\/li><li><strong>Griswold v. Connecticut<\/strong> (1965): a right to <strong>privacy<\/strong> covering contraception.<\/li><li><strong>Miranda v. Arizona<\/strong> (1966): police must inform suspects of their <strong>rights<\/strong>.<\/li><li><strong>Loving v. Virginia<\/strong> (1967): struck down bans on <strong>interracial marriage<\/strong>.<\/li><li><strong>Tinker v. Des Moines<\/strong> (1969): students' antiwar armbands are protected speech.<\/li><\/ul>\n<p>Conservatives accused the Court of \"judicial activism.\"<\/p>\n<h2>6. Other rights movements<\/h2>\n<ul><li><strong>Women:<\/strong> <strong>Betty Friedan's<\/strong> <em>The Feminine Mystique<\/em> (1963) described the \"problem that has no name,\" the discontent of educated suburban housewives. Friedan co-founded the <strong>National Organization for Women (NOW)<\/strong> in 1966.<\/li><li>The <strong>Equal Pay Act<\/strong> (1963) and <strong>Title VII<\/strong> opened legal doors.<\/li><li>Radical \"women's liberation\" groups raised consciousness, and <strong>Gloria Steinem<\/strong> founded <em>Ms.<\/em> magazine (1972).<\/li><li>Congress passed the <strong>Equal Rights Amendment<\/strong> in 1972. <strong>Phyllis Schlafly<\/strong> led opposition, and it fell short of ratification.<\/li><li><strong>Title IX<\/strong> (1972) banned sex discrimination in federally funded education, transforming women's sports.<\/li><li><strong>Roe v. Wade<\/strong> (1973) legalized abortion nationwide.<\/li><li><strong>Latinos:<\/strong> <strong>César Chávez<\/strong> and <strong>Dolores Huerta's<\/strong> <strong>United Farm Workers<\/strong> used strikes and a national <strong>grape boycott<\/strong> (1965–70) to win contracts for migrant farmworkers. The <strong>Chicano movement<\/strong> demanded political power and bilingual education.<\/li><li><strong>Native Americans:<\/strong> The <strong>American Indian Movement<\/strong> (AIM, 1968) and others <strong>occupied Alcatraz<\/strong> (1969–71) and <strong>Wounded Knee<\/strong> (1973). Policy shifted to tribal <strong>self-determination<\/strong> (1975 act).<\/li><li><strong>Gay rights:<\/strong> the <strong>Stonewall riots<\/strong> (New York, 1969), sparked by a police raid on a gay bar, launched the modern gay liberation movement.<\/li><li><strong>Environment:<\/strong> <strong>Rachel Carson's<\/strong> <em>Silent Spring<\/em> (1962) exposed the dangers of the pesticide <strong>DDT<\/strong> and launched modern environmentalism. The first <strong>Earth Day<\/strong> was held in 1970.<\/li><li><strong>Consumers:<\/strong> <strong>Ralph Nader's<\/strong> <em>Unsafe at Any Speed<\/em> (1965) attacked auto safety.<\/li><\/ul>\n<h2>7. The Vietnam War<\/h2>\n<p><strong>Roots:<\/strong> After the French defeat (1954), the U.S. backed <strong>Ngo Dinh Diem's<\/strong> South Vietnam against <strong>Ho Chi Minh's<\/strong> communist North and the southern guerrillas, the <strong>Viet Cong<\/strong>. Policy rested on containment and the <strong>domino theory<\/strong>. Kennedy raised the number of military \"advisers\" to about 16,000. Diem, unpopular for persecuting Buddhists, was overthrown and killed in a coup in November 1963.<\/p>\n<p><strong>Escalation:<\/strong> In August 1964, North Vietnamese boats reportedly attacked U.S. destroyers. The reports were murky, and the second attack probably never happened. Congress passed the <strong>Gulf of Tonkin Resolution<\/strong> almost unanimously. It gave Johnson a <strong>\"blank check\"<\/strong> to use force without a declaration of war. In 1965 he began sustained bombing (<strong>Operation Rolling Thunder<\/strong>) and sent ground combat troops. U.S. forces peaked at about <strong>536,000<\/strong> in 1968. General <strong>William Westmoreland<\/strong> pursued a <strong>war of attrition<\/strong>: \"search and destroy\" missions measured by <strong>body counts<\/strong>. Officials' optimistic claims created a <strong>\"credibility gap.\"<\/strong><\/p>\n<p><strong>The turning point:<\/strong> In the <strong>Tet Offensive<\/strong> (January 1968), communist forces attacked cities across South Vietnam, even the U.S. embassy grounds in Saigon. Militarily it was a <strong>defeat for the communists<\/strong>, but it was a <strong>political and psychological victory<\/strong>: it shattered claims that the war was nearly won. Respected TV anchor Walter Cronkite called the war a stalemate. In March, Johnson announced he would <strong>not seek reelection<\/strong>.<\/p>\n<p><strong>1968, year of shocks:<\/strong> King was assassinated in April. <strong>Robert Kennedy<\/strong> was assassinated in June while running for president. Police clashed with antiwar protesters at the <strong>Democratic convention in Chicago<\/strong>. <strong>Richard Nixon<\/strong> won by appealing to the <strong>\"silent majority\"<\/strong> and <strong>\"law and order.\"<\/strong> Third-party candidate George Wallace carried five Deep South states.<\/p>\n<p><strong>Nixon's war:<\/strong><\/p>\n<ul><li><strong>Vietnamization<\/strong>: gradually withdrawing U.S. troops while building up South Vietnamese forces.<\/li><li>The <strong>Nixon Doctrine<\/strong>: allies must supply their own troops.<\/li><li>He secretly bombed and then invaded <strong>Cambodia<\/strong> (1970), setting off campus protests. National Guardsmen killed four students at <strong>Kent State<\/strong> and police killed two at <strong>Jackson State<\/strong>.<\/li><li>The <strong>My Lai massacre<\/strong> (1968, revealed in 1969), in which U.S. troops killed hundreds of unarmed villagers, deepened disillusionment.<\/li><li><strong>Daniel Ellsberg<\/strong> leaked the <strong>Pentagon Papers<\/strong> (1971), a secret history showing that officials had misled the public. The Supreme Court allowed the <em>New York Times<\/em> to publish them.<\/li><li>The <strong>Paris Peace Accords<\/strong> (January 1973) withdrew U.S. forces. The <strong>draft ended<\/strong> in 1973.<\/li><li><strong>Saigon fell<\/strong> to North Vietnam in <strong>April 1975<\/strong>.<\/li><\/ul>\n<p>About <strong>58,000 Americans<\/strong> and millions of Vietnamese died. Congress reasserted itself with the <strong>War Powers Resolution<\/strong> (1973), which requires the president to notify Congress within 48 hours of sending troops and to withdraw them within 60 days without authorization. The <strong>Twenty-sixth Amendment<\/strong> (1971) lowered the <strong>voting age to 18<\/strong>: if you were old enough to be drafted, you were old enough to vote.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Containment and the domino theory; Gulf of Tonkin Resolution<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Escalation to over 500,000 troops; Tet Offensive (1968)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Johnson withdraws from the race; Vietnamization; antiwar movement; War Powers Resolution; a \"Vietnam syndrome\" of caution about intervention<\/div><\/div>\n<h2>8. The New Left and the counterculture<\/h2>\n<ul><li><strong>Students for a Democratic Society<\/strong> (SDS) issued the <strong>Port Huron Statement<\/strong> (1962), which called for <strong>\"participatory democracy.\"<\/strong><\/li><li>The <strong>Free Speech Movement<\/strong> at <strong>Berkeley<\/strong> (1964) launched campus activism.<\/li><li>The antiwar movement grew from <strong>teach-ins<\/strong> to mass marches and draft-card burnings.<\/li><li>The <strong>counterculture<\/strong> of <strong>\"hippies\"<\/strong> rejected middle-class norms: long hair, rock music, drugs, communes, and the 1967 \"Summer of Love\" in San Francisco's Haight-Ashbury. It culminated at <strong>Woodstock<\/strong> (1969).<\/li><li>Folk and rock musicians such as <strong>Bob Dylan<\/strong> (\"The Times They Are a-Changin'\") gave the era its soundtrack.<\/li><li>Many Americans recoiled from the counterculture, which fed the conservative backlash that elected Nixon and later Reagan.<\/li><\/ul>","mustknow":["<strong>Brown v. Board<\/strong> (1954): school segregation \"inherently unequal\" (Warren, Thurgood Marshall). Little Rock (1957): Eisenhower sent troops.","<strong>Montgomery Bus Boycott<\/strong> (1955–56, Parks, King) → <strong>SCLC<\/strong>. <strong>Greensboro sit-ins<\/strong> (1960) → <strong>SNCC<\/strong>. <strong>Freedom Rides<\/strong> (1961, CORE).","<strong>Birmingham<\/strong> (1963, \"Letter from Birmingham Jail\") → <strong>March on Washington<\/strong> (\"I Have a Dream\").","<strong>Civil Rights Act of 1964<\/strong> (public accommodations, Title VII jobs incl. sex). <strong>24th Amendment<\/strong> (poll tax). <strong>Selma<\/strong> → <strong>Voting Rights Act of 1965<\/strong>.","<strong>Malcolm X<\/strong>, <strong>Black Power<\/strong> (Carmichael), <strong>Black Panthers<\/strong>. <strong>Kerner Commission<\/strong>: \"two societies.\"","<strong>Great Society<\/strong>: War on Poverty, <strong>Medicare/Medicaid<\/strong>, ESEA, <strong>Immigration Act of 1965<\/strong> (ended national-origins quotas).","Warren Court: <strong>Gideon<\/strong>, <strong>Miranda<\/strong>, <strong>Engel<\/strong>, <strong>Mapp<\/strong>, <strong>Reynolds<\/strong>, <strong>Loving<\/strong>, <strong>Griswold<\/strong>.","<strong>Friedan<\/strong> (<em>Feminine Mystique<\/em>, NOW), <strong>Title IX<\/strong>, <strong>ERA<\/strong> (failed), <strong>Roe<\/strong> (1973). <strong>Chávez<\/strong> (UFW, grape boycott). <strong>AIM<\/strong>. <strong>Stonewall<\/strong> (1969). <strong>Carson<\/strong> (<em>Silent Spring<\/em>).","JFK: <strong>Bay of Pigs<\/strong>, <strong>Cuban Missile Crisis<\/strong> (blockade; missiles out), Test Ban Treaty.","Vietnam: <strong>Gulf of Tonkin Resolution<\/strong> (1964), escalation, <strong>Tet<\/strong> (1968), <strong>Vietnamization<\/strong>, <strong>Kent State<\/strong> (1970), <strong>Pentagon Papers<\/strong>, <strong>War Powers Resolution<\/strong> (1973), <strong>26th Amendment<\/strong>, fall of Saigon (1975)."],"timeline":[{"y":"1954","t":"Brown v. Board of Education","key":true},{"y":"1955","t":"Emmett Till murdered; Montgomery Bus Boycott begins","key":false},{"y":"1957","t":"Little Rock Nine; SCLC founded; Civil Rights Act of 1957","key":false},{"y":"1960","t":"Greensboro sit-ins; SNCC founded; Kennedy–Nixon debates","key":true},{"y":"1961","t":"Bay of Pigs; Freedom Rides; Berlin Wall","key":false},{"y":"1962","t":"Cuban Missile Crisis; <em>Silent Spring<\/em>; Port Huron Statement; Engel v. Vitale","key":true},{"y":"1963","t":"Birmingham campaign; March on Washington; <em>The Feminine Mystique<\/em>; Gideon; JFK assassinated (Nov. 22)","key":true},{"y":"1964","t":"Civil Rights Act; 24th Amendment; Freedom Summer; Gulf of Tonkin Resolution; War on Poverty; LBJ beats Goldwater","key":true},{"y":"1965","t":"Selma; Voting Rights Act; Medicare/Medicaid; Immigration Act; Malcolm X killed; Watts riot; combat troops to Vietnam","key":true},{"y":"1966","t":"Miranda; NOW founded; \"Black Power\"; Black Panthers founded","key":false},{"y":"1967","t":"Detroit riot; Loving v. Virginia; Thurgood Marshall joins the Court","key":false},{"y":"1968","t":"Tet Offensive; LBJ withdraws; King and RFK assassinated; Fair Housing Act; Chicago convention; Nixon elected","key":true},{"y":"1969","t":"Stonewall; Woodstock; Apollo 11; My Lai revealed","key":false},{"y":"1970","t":"Cambodia invasion; Kent State; first Earth Day","key":false},{"y":"1971","t":"Pentagon Papers; 26th Amendment; Swann busing decision","key":false},{"y":"1972","t":"Title IX; ERA passes Congress","key":false},{"y":"1973","t":"Paris Peace Accords; Roe v. Wade; War Powers Resolution; draft ends","key":true},{"y":"1975","t":"Fall of Saigon","key":false}],"cards":[{"id":"u8c01","f":"Brown v. Board of Education (1954)","b":"Unanimous Warren Court: segregated public schools are \"inherently unequal.\" Overturned Plessy in education."},{"id":"u8c02","f":"Montgomery Bus Boycott (1955–56)","b":"Sparked by Rosa Parks's arrest. A 381-day boycott led by Martin Luther King Jr. ended bus segregation."},{"id":"u8c03","f":"Little Rock Nine (1957)","b":"Nine Black students integrated Central High. Eisenhower sent the 101st Airborne after Gov. Faubus resisted."},{"id":"u8c04","f":"SCLC","b":"Southern Christian Leadership Conference (1957), King's organization of Black churches for nonviolent direct action."},{"id":"u8c05","f":"Greensboro sit-ins (1960)","b":"Students sat at a whites-only Woolworth's lunch counter. Sit-ins spread and led to SNCC."},{"id":"u8c06","f":"SNCC","b":"Student Nonviolent Coordinating Committee (1960, aided by Ella Baker). Sit-ins, Freedom Summer, later Black Power."},{"id":"u8c07","f":"Freedom Rides (1961)","b":"CORE's integrated bus trips through the South to test desegregation of interstate travel. Met with mob violence."},{"id":"u8c08","f":"\"Letter from Birmingham Jail\" (1963)","b":"King's defense of nonviolent civil disobedience against unjust laws and of urgency over waiting."},{"id":"u8c09","f":"March on Washington (1963)","b":"About 250,000 rallied for jobs and freedom. King's \"I Have a Dream\" speech."},{"id":"u8c10","f":"Civil Rights Act of 1964","b":"Banned segregation in public accommodations and job discrimination (Title VII, including sex). Created the EEOC."},{"id":"u8c11","f":"Twenty-fourth Amendment (1964)","b":"Banned poll taxes in federal elections."},{"id":"u8c12","f":"Voting Rights Act of 1965","b":"After Selma: suspended literacy tests, sent federal examiners, required preclearance. Black voter registration soared."},{"id":"u8c13","f":"Malcolm X","b":"Nation of Islam minister who promoted Black nationalism and self-defense. Assassinated in 1965."},{"id":"u8c14","f":"Black Power","b":"Slogan popularized by Stokely Carmichael (1966): racial pride, self-reliance, Black community control."},{"id":"u8c15","f":"Kerner Commission (1968)","b":"Report on urban riots: \"two societies, one black, one white—separate and unequal.\" Blamed white racism."},{"id":"u8c16","f":"Great Society","b":"LBJ's programs: War on Poverty, Medicare, Medicaid, federal aid to education, Head Start, immigration reform."},{"id":"u8c17","f":"Medicare and Medicaid (1965)","b":"Medicare: health insurance for those 65 and older. Medicaid: health coverage for the poor."},{"id":"u8c18","f":"Immigration and Nationality Act of 1965","b":"Ended national-origins quotas. Led to large increases in Asian and Latin American immigration."},{"id":"u8c19","f":"<em>The Other America<\/em> (1962)","b":"Michael Harrington's exposé of hidden poverty. Influenced the War on Poverty."},{"id":"u8c20","f":"Gideon v. Wainwright (1963)","b":"States must provide free lawyers to poor defendants in felony cases."},{"id":"u8c21","f":"Miranda v. Arizona (1966)","b":"Police must tell suspects their rights (silence, counsel) before questioning."},{"id":"u8c22","f":"Engel v. Vitale (1962)","b":"Official prayer in public schools violates the Establishment Clause."},{"id":"u8c23","f":"Cuban Missile Crisis (1962)","b":"Soviet missiles in Cuba. JFK's naval quarantine. Missiles removed in exchange for a no-invasion pledge (and secretly, Turkey)."},{"id":"u8c24","f":"Bay of Pigs (1961)","b":"Failed CIA-backed invasion of Cuba by exiles. An embarrassment for JFK."},{"id":"u8c25","f":"<em>The Feminine Mystique<\/em> (1963)","b":"Betty Friedan's study of suburban women's discontent (\"the problem that has no name\"). Sparked second-wave feminism."},{"id":"u8c26","f":"NOW (1966)","b":"National Organization for Women, co-founded by Friedan. Pushed for legal equality and the ERA."},{"id":"u8c27","f":"Title IX (1972)","b":"Banned sex discrimination in federally funded education programs. Transformed women's athletics."},{"id":"u8c28","f":"César Chávez / UFW","b":"United Farm Workers (with Dolores Huerta). Nonviolent strikes and a national grape boycott for migrant farmworkers."},{"id":"u8c29","f":"Stonewall riots (1969)","b":"Resistance to a police raid on a New York gay bar. Launched the gay liberation movement."},{"id":"u8c30","f":"<em>Silent Spring<\/em> (1962)","b":"Rachel Carson's exposé of DDT and pesticides. Launched the modern environmental movement."},{"id":"u8c31","f":"Gulf of Tonkin Resolution (1964)","b":"Gave LBJ broad authority to use force in Vietnam without a declaration of war."},{"id":"u8c32","f":"Tet Offensive (1968)","b":"Communist attack across South Vietnam. A military failure, but it destroyed public confidence in the war."},{"id":"u8c33","f":"Vietnamization","b":"Nixon's policy of withdrawing U.S. troops while shifting combat to South Vietnamese forces."},{"id":"u8c34","f":"War Powers Resolution (1973)","b":"The president must notify Congress within 48 hours of deploying troops and withdraw within 60 days without approval."}]},{"n":9,"title":"From Watergate to Reagan","years":"1968–1989","period":"late","weight":9,"minutes":12,"lesson":"<h2>The big picture<\/h2>\n<p>After 1968 the liberal consensus of the New Deal and Great Society came apart. Several blows hit at once:<\/p>\n<ul><li><strong>Watergate<\/strong> destroyed trust in the presidency.<\/li><li><strong>Stagflation<\/strong>, high inflation plus high unemployment, ended the long postwar boom.<\/li><li><strong>Oil shocks<\/strong> revealed U.S. dependence on foreign energy.<\/li><li><strong>Defeat in Vietnam<\/strong> and the <strong>Iranian hostage crisis<\/strong> dented confidence abroad.<\/li><\/ul>\n<p>Out of that frustration rose a <strong>new conservative coalition<\/strong> that elected <strong>Ronald Reagan<\/strong> in 1980. In foreign policy the period moved from <strong>détente<\/strong> (relaxing tensions with the USSR and China) to a renewed Cold War under Reagan, and then to the dramatic thaw with <strong>Gorbachev<\/strong> that set up the Cold War's end.<\/p>\n<h2>1. Nixon at home: more liberal than you'd think<\/h2>\n<p>Richard Nixon (1969–74) courted conservatives with a <strong>\"Southern strategy\"<\/strong> aimed at white southern voters, talk of the <strong>\"silent majority,\"<\/strong> and <strong>\"New Federalism,\"<\/strong> which returned money to the states through <strong>revenue sharing<\/strong>. But he also signed major regulatory laws:<\/p>\n<ul><li>the <strong>Environmental Protection Agency<\/strong> (EPA, 1970)<\/li><li>the <strong>Clean Air Act<\/strong> (1970)<\/li><li>the <strong>Occupational Safety and Health Administration<\/strong> (OSHA)<\/li><li>the <strong>Endangered Species Act<\/strong> (1973)<\/li><\/ul>\n<p>He proposed a guaranteed income, the Family Assistance Plan, which did not pass. He also began <strong>affirmative action<\/strong> requirements for federal contractors (the Philadelphia Plan).<\/p>\n<p><strong>Economics:<\/strong> Inflation from Vietnam spending plus slowing growth produced <strong>stagflation<\/strong>. In 1971 Nixon imposed temporary <strong>wage and price controls<\/strong> and <strong>ended the dollar's convertibility to gold<\/strong>. That effectively ended the <strong>Bretton Woods<\/strong> system of fixed exchange rates.<\/p>\n<h2>2. Nixon abroad: détente<\/h2>\n<p>With national security adviser (later Secretary of State) <strong>Henry Kissinger<\/strong>, Nixon practiced <strong>realpolitik<\/strong>: national interest over ideology. He exploited the <strong>Sino-Soviet split<\/strong>:<\/p>\n<ul><li><strong>Nixon's visit to China<\/strong> (February 1972) opened relations with the communist People's Republic, a stunning reversal by a lifelong anti-communist.<\/li><li>In Moscow (May 1972) he signed <strong>SALT I<\/strong>, the Strategic Arms Limitation Talks agreement, which froze the number of offensive missiles, and the <strong>Anti-Ballistic Missile (ABM) Treaty<\/strong>. This relaxation of tensions was called <strong>détente<\/strong>.<\/li><\/ul>\n<p>When Egypt and Syria attacked Israel in the <strong>Yom Kippur War<\/strong> (1973), the U.S. airlifted aid to Israel. Arab members of <strong>OPEC<\/strong> responded with an <strong>oil embargo<\/strong> (1973–74). Oil prices <strong>quadrupled<\/strong>, gas lines formed, and the era of cheap energy ended.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Vietnam spending + rising global competition + OPEC oil shock (1973)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Stagflation: inflation and unemployment rise together<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Keynesian tools look broken; voters open to deregulation, tax cuts, and conservative economics<\/div><\/div>\n<h2>3. Watergate (1972–1974)<\/h2>\n<p>In June <strong>1972<\/strong>, burglars connected to Nixon's reelection committee were caught breaking into <strong>Democratic National Committee headquarters<\/strong> at the <strong>Watergate<\/strong> complex. Nixon won a <strong>landslide<\/strong> over George McGovern that November. But <em>Washington Post<\/em> reporters <strong>Bob Woodward and Carl Bernstein<\/strong>, tipped by a secret source (\"Deep Throat\"), traced the burglary toward the White House. The crime was the <strong>cover-up<\/strong>: payments of hush money and obstruction of the FBI. The investigation unfolded in steps:<\/p>\n<ul><li><strong>1973:<\/strong> A <strong>Senate committee<\/strong> (Sam Ervin) held televised hearings. Former counsel <strong>John Dean<\/strong> testified against Nixon. An aide revealed that Nixon had <strong>secretly taped<\/strong> Oval Office conversations.<\/li><li><strong>\"Saturday Night Massacre\"<\/strong> (October 1973): Nixon ordered special prosecutor Archibald Cox fired. The attorney general and his deputy resigned rather than do it.<\/li><li><strong>Separately<\/strong>, Vice President <strong>Spiro Agnew<\/strong> resigned over bribery and tax evasion. Under the <strong>Twenty-fifth Amendment<\/strong>, Nixon appointed <strong>Gerald Ford<\/strong> vice president.<\/li><li><strong>United States v. Nixon<\/strong> (July 1974): the Supreme Court ruled unanimously that <strong>executive privilege<\/strong> did not shield the tapes. The \"smoking gun\" tape showed Nixon ordering the cover-up.<\/li><li>The House Judiciary Committee approved <strong>articles of impeachment<\/strong>.<\/li><li>On <strong>August 9, 1974<\/strong>, Nixon became the <strong>only president to resign<\/strong>.<\/li><\/ul>\n<p><strong>Ford<\/strong> became president without being elected to either office. A month later he <strong>pardoned Nixon<\/strong>, which probably cost him the 1976 election.<\/p>\n<p><strong>Aftermath:<\/strong> Congress passed reforms:<\/p>\n<ul><li><strong>campaign finance<\/strong> limits (1974)<\/li><li>a stronger <strong>Freedom of Information Act<\/strong><\/li><li>the <strong>Ethics in Government Act<\/strong> (1978), which created independent counsels<\/li><li>the <strong>Church Committee<\/strong> (1975) exposed CIA and FBI abuses<\/li><\/ul>\n<p>Public <strong>trust in government fell<\/strong> and never fully recovered.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Watergate break-in and cover-up<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Hearings, tapes, U.S. v. Nixon<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Nixon resigns (1974); new limits on executive power; deep public cynicism<\/div><\/div>\n<h2>4. Ford and Carter: a time of limits<\/h2>\n<p><strong>Gerald Ford<\/strong> (1974–77) faced inflation (his \"Whip Inflation Now\" buttons were mocked) and the <strong>fall of Saigon<\/strong> (1975). He signed the <strong>Helsinki Accords<\/strong> (1975), which accepted Europe's postwar borders in exchange for Soviet human rights pledges.<\/p>\n<p><strong>Jimmy Carter<\/strong> (1977–81), a born-again Baptist and Washington outsider from Georgia, made <strong>human rights<\/strong> the centerpiece of his foreign policy:<\/p>\n<ul><li>The <strong>Panama Canal Treaties<\/strong> (1977) agreed to return the canal to Panama by 1999.<\/li><li>The <strong>Camp David Accords<\/strong> (1978): Carter brokered peace between Egypt's <strong>Anwar Sadat<\/strong> and Israel's <strong>Menachem Begin<\/strong>, the first Arab–Israeli peace treaty (1979). It is his greatest achievement.<\/li><li>He established full <strong>diplomatic relations with China<\/strong> (1979).<\/li><li>After the <strong>Soviet invasion of Afghanistan<\/strong> (December 1979), he withdrew the SALT II treaty from the Senate, imposed a <strong>grain embargo<\/strong>, and <strong>boycotted the 1980 Moscow Olympics<\/strong>. Détente was dead.<\/li><li><strong>The Iranian hostage crisis:<\/strong> the 1979 <strong>Iranian Revolution<\/strong> toppled the U.S.-backed Shah and set off a second <strong>oil shock<\/strong>. In November 1979 militants seized the <strong>U.S. embassy in Tehran<\/strong> and held <strong>52 Americans hostage for 444 days<\/strong>. A rescue mission failed in April 1980. The hostages were released minutes after Reagan's inauguration in January 1981.<\/li><\/ul>\n<p>At home, inflation hit double digits. Carter's <strong>\"malaise\" speech<\/strong> (1979) blamed a national \"crisis of confidence\" and backfired. He created the Departments of <strong>Energy<\/strong> and <strong>Education<\/strong> and began <strong>deregulation<\/strong> (airlines, 1978). The <strong>Three Mile Island<\/strong> nuclear accident (1979) set back nuclear power. Fed chairman <strong>Paul Volcker<\/strong> (appointed 1979) raised <strong>interest rates<\/strong> sharply to crush inflation. That worked, at the cost of a severe recession in 1981–82.<\/p>\n<h2>5. Society in the 1970s<\/h2>\n<ul><li><strong>The \"Me Decade\"<\/strong> (Tom Wolfe's phrase) and Christopher Lasch's <em>The Culture of Narcissism<\/em> (1979) described a turn inward toward self-fulfillment.<\/li><li><strong>Rust Belt and Sun Belt:<\/strong> <strong>Deindustrialization<\/strong> hit the Northeast and Midwest as factories closed, while population and political power shifted to the <strong>Sun Belt<\/strong>.<\/li><li><strong>Tax revolt:<\/strong> California's <strong>Proposition 13<\/strong> (1978) capped property taxes and inspired anti-tax movements nationwide.<\/li><li><strong>Affirmative action:<\/strong> In <strong>Regents of the University of California v. Bakke<\/strong> (1978), the Court ruled that <strong>racial quotas<\/strong> in admissions were unconstitutional but that <strong>race could be one factor<\/strong>.<\/li><li><strong>Busing:<\/strong> court-ordered busing provoked violent resistance in places like <strong>Boston<\/strong> (1974).<\/li><li><strong>Roe v. Wade<\/strong> (1973) energized a <strong>pro-life movement<\/strong>. <strong>Phyllis Schlafly's<\/strong> campaign helped defeat the <strong>ERA<\/strong> (it died in 1982).<\/li><li><strong>Culture:<\/strong> Alex Haley's <em>Roots<\/em> (TV miniseries, 1977) drew record audiences and sparked interest in family and ethnic heritage.<\/li><\/ul>\n<h3>The New Right<\/h3>\n<p>Several groups converged:<\/p>\n<ul><li><strong>Evangelical Christians<\/strong>, organized in <strong>Jerry Falwell's Moral Majority<\/strong> (1979), opposed abortion, the ERA, gay rights, and the ban on school prayer.<\/li><li><strong>Neoconservatives<\/strong>, former liberals who became hawkish on the Soviet Union and skeptical of the Great Society.<\/li><li><strong>Free-market economists<\/strong> such as Milton Friedman.<\/li><li>Former Democrats, especially white southerners and blue-collar northerners known as <strong>\"Reagan Democrats\"<\/strong>, angry about taxes, crime, and cultural change.<\/li><\/ul>\n<h2>6. The Reagan Revolution (1981–1989)<\/h2>\n<p>In 1980 <strong>Ronald Reagan<\/strong> asked voters, \"Are you better off than you were four years ago?\" and beat Carter decisively. \"Government is not the solution to our problem; government is the problem,\" he declared.<\/p>\n<p><strong>Reaganomics<\/strong> (<strong>supply-side economics<\/strong>) held that cutting taxes would spur investment and growth:<\/p>\n<ul><li>The <strong>Economic Recovery Tax Act<\/strong> (1981) cut income tax rates about 25% over three years.<\/li><li>He cut domestic spending and promoted <strong>deregulation<\/strong>.<\/li><li>When <strong>air traffic controllers<\/strong> (PATCO) struck illegally in 1981, Reagan <strong>fired them<\/strong>, a blow to organized labor.<\/li><li>After the 1981–82 recession, the economy boomed and inflation fell.<\/li><li>But big tax cuts plus a huge <strong>military buildup<\/strong> produced record <strong>budget deficits<\/strong>, and the <strong>national debt roughly tripled<\/strong>.<\/li><li>Income inequality widened. The 1987 stock market crash and the <strong>savings and loan crisis<\/strong> showed the risks of deregulation.<\/li><\/ul>\n<p>Reagan appointed <strong>Sandra Day O'Connor<\/strong>, the <strong>first woman on the Supreme Court<\/strong> (1981). He survived an assassination attempt (1981) and won a 49-state landslide in <strong>1984<\/strong> over Walter Mondale, whose running mate <strong>Geraldine Ferraro<\/strong> was the first woman on a major-party ticket. The <strong>Immigration Reform and Control Act<\/strong> (1986) gave <strong>amnesty<\/strong> to about 3 million undocumented immigrants while penalizing employers who hired undocumented workers. The <strong>AIDS<\/strong> epidemic, first identified in 1981, devastated gay communities, and critics faulted the administration's slow response.<\/p>\n<h3>Reagan and the Cold War<\/h3>\n<p>Reagan called the USSR an <strong>\"evil empire\"<\/strong> (1983). He began the largest peacetime <strong>military buildup<\/strong> and proposed the <strong>Strategic Defense Initiative<\/strong> (SDI, \"Star Wars\"), a space-based missile shield. The <strong>Reagan Doctrine<\/strong> aided <strong>anti-communist insurgents<\/strong>: the mujahideen in <strong>Afghanistan<\/strong> and the <strong>Contras<\/strong> in <strong>Nicaragua<\/strong>. U.S. forces invaded <strong>Grenada<\/strong> (1983). A suicide bombing killed <strong>241 U.S. servicemen<\/strong> in <strong>Beirut<\/strong> (1983).<\/p>\n<p>The <strong>Iran-Contra affair<\/strong> (revealed 1986) was the administration's major scandal. Officials secretly <strong>sold arms to Iran<\/strong>, hoping to free hostages in Lebanon, and <strong>diverted the profits to the Contras<\/strong>, defying a congressional ban (the <strong>Boland Amendment<\/strong>). National Security Council aide <strong>Oliver North<\/strong> and others were prosecuted. Reagan said he did not know of the diversion.<\/p>\n<p>Then came the thaw. <strong>Mikhail Gorbachev<\/strong> (Soviet leader from 1985) pursued reforms: <strong>glasnost<\/strong> (openness) and <strong>perestroika<\/strong> (restructuring). After summits in Geneva and Reykjavik, the two leaders signed the <strong>INF Treaty<\/strong> (1987), the first treaty to <strong>eliminate an entire class of nuclear weapons<\/strong> (intermediate-range missiles). In Berlin, Reagan challenged: <strong>\"Mr. Gorbachev, tear down this wall!\"<\/strong> (1987).<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Stagflation, hostage crisis, cultural backlash, rise of the New Right<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Reagan elected (1980): tax cuts, deregulation, military buildup<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Conservative realignment; record deficits; Cold War pressure followed by a Reagan–Gorbachev thaw<\/div><\/div>","mustknow":["<strong>Nixon<\/strong>: Southern strategy and \"silent majority,\" but also the <strong>EPA<\/strong>, Clean Air Act, OSHA; <strong>wage-price controls<\/strong>; ended <strong>gold convertibility<\/strong> (1971).","<strong>Détente<\/strong>: Nixon to <strong>China<\/strong> (1972), <strong>SALT I<\/strong> and the <strong>ABM Treaty<\/strong> (1972). Kissinger. Realpolitik.","<strong>OPEC oil embargo<\/strong> (1973) after the Yom Kippur War → <strong>stagflation<\/strong>.","<strong>Watergate<\/strong>: break-in (1972), cover-up, tapes, <strong>U.S. v. Nixon<\/strong> (1974, no absolute executive privilege), <strong>resignation<\/strong> (Aug. 1974); Ford <strong>pardon<\/strong>.","<strong>Ford<\/strong>: Helsinki Accords, fall of Saigon. <strong>25th Amendment<\/strong> made Ford VP after Agnew resigned.","<strong>Carter<\/strong>: human rights; <strong>Camp David Accords<\/strong> (1978); Panama Canal Treaties; China recognition; <strong>Soviet invasion of Afghanistan<\/strong> → Olympic boycott; <strong>Iranian hostage crisis<\/strong> (444 days); \"malaise\"; Volcker's high interest rates.","<strong>Bakke<\/strong> (1978): quotas out, race as one factor OK. <strong>Proposition 13<\/strong> tax revolt. <strong>Moral Majority<\/strong> (Falwell). ERA defeated (Schlafly).","<strong>Reaganomics<\/strong>: supply-side tax cuts (1981), deregulation, military buildup → <strong>huge deficits<\/strong>; <strong>PATCO<\/strong> firing.","<strong>Reagan Cold War<\/strong>: \"evil empire,\" <strong>SDI<\/strong>, Reagan Doctrine (Contras, Afghanistan), <strong>Iran-Contra<\/strong> scandal.","<strong>Gorbachev<\/strong> (glasnost, perestroika) → <strong>INF Treaty<\/strong> (1987, first to eliminate a class of nuclear weapons). <strong>O'Connor<\/strong>, first woman justice."],"timeline":[{"y":"1969","t":"Nixon inaugurated; Apollo 11 moon landing","key":false},{"y":"1970","t":"EPA created; Clean Air Act; OSHA","key":false},{"y":"1971","t":"Wage-price controls; dollar taken off gold","key":false},{"y":"1972","t":"Nixon visits China; SALT I and ABM Treaty; Watergate break-in; Nixon reelected","key":true},{"y":"1973","t":"Yom Kippur War and OPEC oil embargo; Roe v. Wade; Agnew resigns; Saturday Night Massacre","key":true},{"y":"1974","t":"U.S. v. Nixon; Nixon resigns (Aug. 9); Ford pardons Nixon","key":true},{"y":"1975","t":"Helsinki Accords; fall of Saigon; Church Committee","key":false},{"y":"1977","t":"Carter inaugurated; Panama Canal Treaties; <em>Roots<\/em>","key":false},{"y":"1978","t":"Camp David Accords; Bakke decision; Proposition 13","key":true},{"y":"1979","t":"Iranian Revolution; hostage crisis begins; Soviet invasion of Afghanistan; Three Mile Island; Moral Majority; Volcker at the Fed","key":true},{"y":"1980","t":"Moscow Olympics boycott; failed hostage rescue; Reagan elected","key":true},{"y":"1981","t":"Hostages released; Reagan tax cuts; PATCO strike; O'Connor joins the Court; AIDS identified","key":false},{"y":"1983","t":"\"Evil empire\" speech; SDI proposed; Beirut bombing; Grenada invasion","key":false},{"y":"1985","t":"Gorbachev takes power in the USSR","key":false},{"y":"1986","t":"Iran-Contra revealed; Immigration Reform and Control Act","key":false},{"y":"1987","t":"INF Treaty; \"Tear down this wall\"; stock market crash","key":true}],"cards":[{"id":"u9c01","f":"Southern strategy","b":"Nixon-era Republican effort to win white southern voters alienated by Democratic civil rights policies."},{"id":"u9c02","f":"New Federalism","b":"Nixon's (and later Reagan's) effort to shift power and funds to the states, e.g., revenue sharing."},{"id":"u9c03","f":"EPA (1970)","b":"Environmental Protection Agency, created under Nixon to enforce environmental laws."},{"id":"u9c04","f":"Stagflation","b":"High inflation plus high unemployment and slow growth. Defined the 1970s economy."},{"id":"u9c05","f":"Nixon shock (1971)","b":"Nixon ended the dollar's convertibility to gold and imposed wage-price controls. Ended Bretton Woods fixed exchange rates."},{"id":"u9c06","f":"Détente","b":"Relaxation of Cold War tensions under Nixon and Kissinger: arms control and trade with the USSR."},{"id":"u9c07","f":"Nixon's China trip (1972)","b":"Opened relations with communist China, exploiting the Sino-Soviet split."},{"id":"u9c08","f":"SALT I / ABM Treaty (1972)","b":"First U.S.–Soviet nuclear arms limitation agreements."},{"id":"u9c09","f":"OPEC oil embargo (1973)","b":"Arab oil producers cut off oil to the U.S. after it aided Israel in the Yom Kippur War. Prices quadrupled."},{"id":"u9c10","f":"Watergate","b":"1972 break-in at DNC headquarters and Nixon's cover-up. Led to his resignation in 1974."},{"id":"u9c11","f":"United States v. Nixon (1974)","b":"Unanimous Court: executive privilege is not absolute. Nixon had to release the tapes."},{"id":"u9c12","f":"Saturday Night Massacre (1973)","b":"Nixon ordered special prosecutor Cox fired. The attorney general and deputy resigned in protest."},{"id":"u9c13","f":"Twenty-fifth Amendment","b":"Presidential succession and disability. Filling a VP vacancy put Ford (and later Rockefeller) in office."},{"id":"u9c14","f":"Ford's pardon of Nixon (1974)","b":"A \"full, free, and absolute\" pardon. Widely unpopular and hurt Ford in 1976."},{"id":"u9c15","f":"Helsinki Accords (1975)","b":"Recognized postwar European borders in exchange for Soviet human rights commitments."},{"id":"u9c16","f":"Camp David Accords (1978)","b":"Carter brokered peace between Egypt (Sadat) and Israel (Begin)."},{"id":"u9c17","f":"Panama Canal Treaties (1977)","b":"Agreed to transfer the canal to Panama by 1999."},{"id":"u9c18","f":"Iranian hostage crisis (1979–81)","b":"Militants held 52 Americans for 444 days. Doomed Carter's presidency."},{"id":"u9c19","f":"Soviet invasion of Afghanistan (1979)","b":"Ended détente. Carter withdrew SALT II, embargoed grain, and boycotted the 1980 Olympics."},{"id":"u9c20","f":"\"Malaise\" speech (1979)","b":"Carter blamed a national \"crisis of confidence.\" Politically damaging."},{"id":"u9c21","f":"Bakke (1978)","b":"Racial quotas in admissions are unconstitutional, but race may be one factor (affirmative action)."},{"id":"u9c22","f":"Proposition 13 (1978)","b":"California ballot measure capping property taxes. Launched a national tax revolt."},{"id":"u9c23","f":"Moral Majority (1979)","b":"Jerry Falwell's evangelical political organization. A key part of the New Right."},{"id":"u9c24","f":"Reaganomics / supply-side economics","b":"Cut taxes (esp. top rates) to spur investment and growth. Also deregulation and less domestic spending."},{"id":"u9c25","f":"PATCO strike (1981)","b":"Reagan fired over 11,000 striking air traffic controllers. A major defeat for organized labor."},{"id":"u9c26","f":"Strategic Defense Initiative (1983)","b":"Reagan's proposed space-based missile defense (\"Star Wars\")."},{"id":"u9c27","f":"Iran-Contra affair","b":"Secret arms sales to Iran, with profits illegally diverted to the Nicaraguan Contras. Revealed in 1986."},{"id":"u9c28","f":"INF Treaty (1987)","b":"Reagan–Gorbachev treaty eliminating all intermediate-range nuclear missiles. The first to abolish a whole class."}]},{"n":10,"title":"Contemporary America","years":"1989–present","period":"late","weight":9,"minutes":11,"lesson":"<h2>The big picture<\/h2>\n<p>The Cold War ended with the <strong>collapse of the Soviet Union<\/strong> (1991), leaving the U.S. the world's only superpower. The 1990s brought a long boom driven by technology and <strong>globalization<\/strong>, a centrist Democratic president, and bitter partisan fights. The <strong>September 11, 2001<\/strong> attacks launched a <strong>War on Terror<\/strong> and long wars in <strong>Afghanistan<\/strong> and <strong>Iraq<\/strong>. The <strong>Great Recession<\/strong> of 2007–09 was followed by the election of the first African American president. Since then, politics has been marked by <strong>deep polarization<\/strong>. Expect CLEP questions to center on the big, settled events, roughly 1989–2010. The most recent material is summarized for context.<\/p>\n<h2>1. The end of the Cold War (1989–1991)<\/h2>\n<p>Gorbachev's reforms and the Soviet Union's economic weakness loosened Moscow's grip on Eastern Europe. Then events moved fast:<\/p>\n<ul><li><strong>1989:<\/strong> Communist governments collapsed across Eastern Europe, and the <strong>Berlin Wall fell<\/strong> (November 9).<\/li><li><strong>1990:<\/strong> <strong>Germany reunified<\/strong>.<\/li><li><strong>December 1991:<\/strong> the <strong>Soviet Union dissolved<\/strong> into fifteen independent republics.<\/li><\/ul>\n<p>Historians still debate the causes: Reagan's military pressure, internal Soviet economic failure, Gorbachev's choices, and popular movements in Eastern Europe all played a role.<\/p>\n<h2>2. George H.W. Bush (1989–1993)<\/h2>\n<p>Bush, Reagan's vice president, managed the Soviet collapse cautiously and spoke of a <strong>\"new world order.\"<\/strong> He invaded <strong>Panama<\/strong> (1989) to remove dictator Manuel Noriega. When Iraq's <strong>Saddam Hussein invaded Kuwait<\/strong> (August 1990), Bush assembled a <strong>UN-backed international coalition<\/strong>. <strong>Operation Desert Storm<\/strong> (1991) drove Iraq out of Kuwait in weeks, but it left Saddam in power. This was the <strong>Persian Gulf War<\/strong>.<\/p>\n<p>At home, Bush signed the <strong>Americans with Disabilities Act<\/strong> (ADA, 1990), which banned discrimination against people with disabilities, and tougher <strong>Clean Air Act<\/strong> amendments. He broke his famous pledge, <strong>\"Read my lips: no new taxes,\"<\/strong> in a 1990 budget deal, angering conservatives. The <strong>Clarence Thomas<\/strong> Supreme Court confirmation hearings (1991), where <strong>Anita Hill<\/strong> accused Thomas of sexual harassment, put the issue in the national spotlight and helped make 1992 the <strong>\"Year of the Woman\"<\/strong> in congressional elections. Riots erupted in <strong>Los Angeles<\/strong> (1992) after police officers were acquitted in the videotaped beating of <strong>Rodney King<\/strong>.<\/p>\n<h2>3. Bill Clinton (1993–2001)<\/h2>\n<p>A recession helped <strong>Bill Clinton<\/strong> beat Bush in <strong>1992<\/strong> (\"It's the economy, stupid\"). Independent <strong>Ross Perot<\/strong> won 19% of the popular vote. Clinton governed as a <strong>\"New Democrat\"<\/strong>, a centrist who accepted many market-oriented ideas:<\/p>\n<ul><li>His <strong>health care reform<\/strong> plan, led by <strong>Hillary Clinton<\/strong>, failed (1994).<\/li><li>He won the <strong>North American Free Trade Agreement<\/strong> (NAFTA, 1993), which eliminated most trade barriers with Canada and Mexico, over opposition from many unions in his own party.<\/li><li>He signed the <strong>Family and Medical Leave Act<\/strong> (1993) and the <strong>Brady<\/strong> gun background-check law.<\/li><\/ul>\n<p>In <strong>1994<\/strong>, Republicans led by <strong>Newt Gingrich<\/strong> and his <strong>\"Contract with America\"<\/strong> won control of <strong>both houses of Congress for the first time in 40 years<\/strong>. Clinton moved to the center:<\/p>\n<ul><li>He signed <strong>welfare reform<\/strong> (1996), which ended the federal entitlement to cash aid (AFDC) and replaced it with <strong>time limits and work requirements<\/strong> (TANF).<\/li><li>He declared, \"The era of big government is over.\"<\/li><li>A booming <strong>technology economy<\/strong> (the <strong>Internet<\/strong> and the \"dot-com\" boom), plus tax increases and spending restraint, produced <strong>federal budget surpluses<\/strong> (1998–2001).<\/li><\/ul>\n<p>In <strong>1998<\/strong> the House <strong>impeached<\/strong> Clinton for <strong>perjury and obstruction of justice<\/strong> related to an affair with a White House intern. The <strong>Senate acquitted<\/strong> him (1999). He was the second president impeached, after Andrew Johnson.<\/p>\n<p>Abroad, the U.S. struggled to define its role:<\/p>\n<ul><li>a disastrous raid in <strong>Somalia<\/strong> (1993)<\/li><li>inaction during the <strong>Rwandan genocide<\/strong> (1994)<\/li><li>NATO bombing that led to the <strong>Dayton Accords<\/strong> ending the war in <strong>Bosnia<\/strong> (1995)<\/li><li>NATO air war over <strong>Kosovo<\/strong> (1999)<\/li><\/ul>\n<p>Domestic terrorism struck when <strong>Timothy McVeigh<\/strong> bombed the federal building in <strong>Oklahoma City<\/strong> (1995).<\/p>\n<h2>4. George W. Bush and the War on Terror (2001–2009)<\/h2>\n<p>The <strong>2000 election<\/strong> came down to Florida. In <strong>Bush v. Gore<\/strong>, the Supreme Court halted the recount, so <strong>George W. Bush<\/strong> won the Electoral College even though <strong>Al Gore<\/strong> won the national popular vote.<\/p>\n<p>On <strong>September 11, 2001<\/strong>, <strong>al-Qaeda<\/strong> terrorists directed by <strong>Osama bin Laden<\/strong> hijacked four airliners. They destroyed the <strong>World Trade Center<\/strong> and struck the <strong>Pentagon<\/strong>, killing nearly <strong>3,000 people<\/strong>. The response:<\/p>\n<ul><li><strong>War in Afghanistan<\/strong> (October 2001) toppled the <strong>Taliban<\/strong> government that sheltered al-Qaeda.<\/li><li>The <strong>USA PATRIOT Act<\/strong> (2001) expanded government surveillance powers, which critics said threatened civil liberties.<\/li><li>Congress created the <strong>Department of Homeland Security<\/strong> (2002).<\/li><li>The <strong>Bush Doctrine<\/strong> claimed the right to <strong>preemptive war<\/strong> against threats.<\/li><li>In <strong>March 2003<\/strong>, the U.S. invaded <strong>Iraq<\/strong>, citing <strong>weapons of mass destruction<\/strong> and terrorism. Saddam Hussein fell quickly, but <strong>no WMDs were found<\/strong>. A long insurgency followed, eased somewhat by the 2007 troop <strong>\"surge.\"<\/strong><\/li><\/ul>\n<p>At home, Bush cut taxes (2001, 2003). He passed <strong>No Child Left Behind<\/strong> (2002), which brought standardized testing and accountability to schools, and a <strong>Medicare prescription drug benefit<\/strong> (2003). The government's response to <strong>Hurricane Katrina<\/strong> (2005), which devastated New Orleans, was widely criticized.<\/p>\n<p><strong>The Great Recession (2007–2009):<\/strong> A <strong>housing bubble<\/strong> fueled by <strong>subprime mortgages<\/strong> and complex securities burst. The investment bank <strong>Lehman Brothers<\/strong> failed in September 2008, and Congress passed the <strong>TARP<\/strong> bank bailout. It was the worst downturn since the Great Depression.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Housing bubble, risky subprime lending, lightly regulated financial products<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Financial crisis and Great Recession (2007–09)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Bank bailouts, stimulus spending, Dodd-Frank regulation, populist anger on left and right<\/div><\/div>\n<h2>5. Barack Obama (2009–2017)<\/h2>\n<p><strong>Barack Obama<\/strong> became the <strong>first African American president<\/strong>. His main actions:<\/p>\n<ul><li>the <strong>stimulus<\/strong> (American Recovery and Reinvestment Act, 2009) and an auto industry rescue<\/li><li>the <strong>Affordable Care Act<\/strong> (2010, \"Obamacare\"), the largest health care expansion since Medicare, which expanded insurance through subsidies, Medicaid, and a ban on denying coverage for pre-existing conditions<\/li><li>the <strong>Dodd-Frank Act<\/strong> (2010), which regulated Wall Street<\/li><\/ul>\n<p>The conservative <strong>Tea Party<\/strong> movement opposed his spending and helped Republicans win the House in 2010. U.S. forces <strong>killed Osama bin Laden<\/strong> in Pakistan (2011). In <strong>Obergefell v. Hodges<\/strong> (2015), the Supreme Court legalized <strong>same-sex marriage<\/strong> nationwide.<\/p>\n<h2>6. Recent years: a summary<\/h2>\n<ul><li><strong>Donald Trump<\/strong> won in <strong>2016<\/strong> by carrying the Electoral College while losing the popular vote. He cut taxes (2017), imposed <strong>tariffs<\/strong> in a trade war with China, and withdrew from the Paris climate accord and the Iran nuclear deal. He was <strong>impeached twice<\/strong>, in 2019 and again after the <strong>January 6, 2021, attack on the Capitol<\/strong>, and acquitted by the Senate both times. His term saw the <strong>COVID-19 pandemic<\/strong> (2020) and nationwide protests after the police murder of <strong>George Floyd<\/strong> (2020).<\/li><li><strong>Joe Biden<\/strong> (2021–2025) passed pandemic relief, an <strong>infrastructure law<\/strong>, and climate spending. He withdrew U.S. forces from <strong>Afghanistan<\/strong> (2021) and aided <strong>Ukraine<\/strong> against Russia's 2022 invasion. In <strong>Dobbs v. Jackson Women's Health Organization<\/strong> (2022), the Supreme Court <strong>overturned Roe v. Wade<\/strong> and returned abortion law to the states.<\/li><li>In 2024 Trump won a second, <strong>non-consecutive term<\/strong>, the first president to do so since Grover Cleveland.<\/li><\/ul>\n<h2>7. Society and culture since 1990<\/h2>\n<ul><li><strong>A more diverse nation:<\/strong> Immigration after the 1965 act, mainly from <strong>Latin America and Asia<\/strong>, transformed the population. By the 2000s <strong>Hispanic Americans<\/strong> had become the <strong>largest minority group<\/strong>. Debates over undocumented immigration and border enforcement intensified.<\/li><li><strong>The digital revolution:<\/strong> the <strong>World Wide Web<\/strong> (1990s), personal computers, smartphones, and social media reshaped work, commerce, politics, and daily life.<\/li><li><strong>Globalization and inequality:<\/strong> trade and technology lowered prices and created new industries but contributed to the loss of manufacturing jobs. Income and wealth inequality rose sharply from the 1980s onward.<\/li><li><strong>Culture wars:<\/strong> Americans clashed over abortion, gun rights (the Columbine school shooting, 1999), affirmative action, school curricula, and <strong>LGBTQ rights<\/strong>. Public opinion on same-sex marriage shifted dramatically in two decades.<\/li><li><strong>Political polarization:<\/strong> Talk radio, cable news, and later social media helped sort voters into hostile partisan camps. Divided government and confirmation battles over the Supreme Court became routine.<\/li><li><strong>Ideas:<\/strong> <strong>Francis Fukuyama<\/strong> argued that liberal democracy might be the <strong>\"end of history\"<\/strong> (1989/1992). <strong>Samuel Huntington<\/strong> predicted a <strong>\"clash of civilizations\"<\/strong> (1993/1996). After 9/11, many read Huntington's thesis as prophetic, while others rejected it.<\/li><li><strong>Arts:<\/strong> <strong>Toni Morrison<\/strong> (<em>Beloved<\/em>, 1987) became the first Black woman to win the <strong>Nobel Prize in Literature<\/strong> (1993). <strong>Hip-hop<\/strong>, born in the 1970s Bronx, became the dominant popular music genre.<\/li><\/ul>","mustknow":["<strong>Berlin Wall falls<\/strong> (Nov. 1989); <strong>German reunification<\/strong> (1990); <strong>USSR dissolves<\/strong> (Dec. 1991).","<strong>Persian Gulf War<\/strong> (1991): UN coalition expels Iraq from Kuwait; Saddam stays in power.","<strong>Americans with Disabilities Act<\/strong> (1990). Bush broke \"no new taxes.\"","<strong>Clinton<\/strong>: New Democrat, <strong>NAFTA<\/strong> (1993), failed health reform, <strong>welfare reform<\/strong> (1996), <strong>budget surpluses<\/strong>, <strong>impeachment<\/strong> (1998) and acquittal.","<strong>1994 \"Contract with America\"<\/strong>: Republicans win Congress for the first time in 40 years (Gingrich).","<strong>Bush v. Gore<\/strong> (2000) decided the election.","<strong>9/11<\/strong> → Afghanistan war, <strong>PATRIOT Act<\/strong>, <strong>Department of Homeland Security<\/strong>; <strong>Iraq War<\/strong> (2003) over WMD claims (none found).","<strong>Great Recession<\/strong> (2007–09): subprime mortgages, Lehman collapse, TARP.","<strong>Obama<\/strong>: first Black president, <strong>Affordable Care Act<\/strong> (2010), Dodd-Frank, bin Laden killed (2011); <strong>Obergefell<\/strong> (2015).","Long-term trends: diversity from post-1965 immigration, digital revolution, globalization, rising inequality, polarization."],"timeline":[{"y":"1989","t":"Berlin Wall falls; U.S. invades Panama","key":true},{"y":"1990","t":"Iraq invades Kuwait; Americans with Disabilities Act; German reunification","key":false},{"y":"1991","t":"Persian Gulf War (Desert Storm); Soviet Union dissolves; Thomas–Hill hearings","key":true},{"y":"1992","t":"Los Angeles riots; Clinton elected (Perot 19%)","key":false},{"y":"1993","t":"NAFTA approved; Family and Medical Leave Act","key":false},{"y":"1994","t":"\"Contract with America\": Republicans win Congress","key":true},{"y":"1995","t":"Oklahoma City bombing; Dayton Accords end the Bosnian war","key":false},{"y":"1996","t":"Welfare reform (PRWORA)","key":true},{"y":"1998","t":"Clinton impeached (acquitted 1999); first budget surplus in decades","key":false},{"y":"2000","t":"Bush v. Gore decides the election","key":true},{"y":"2001","t":"September 11 attacks; war in Afghanistan; PATRIOT Act","key":true},{"y":"2002","t":"Department of Homeland Security; No Child Left Behind","key":false},{"y":"2003","t":"Iraq War begins","key":false},{"y":"2005","t":"Hurricane Katrina","key":false},{"y":"2008","t":"Financial crisis; Lehman collapse; TARP; Obama elected","key":true},{"y":"2010","t":"Affordable Care Act; Dodd-Frank Act","key":false},{"y":"2011","t":"Osama bin Laden killed","key":false},{"y":"2015","t":"Obergefell v. Hodges","key":false},{"y":"2020","t":"COVID-19 pandemic; George Floyd protests","key":false},{"y":"2022","t":"Dobbs overturns Roe v. Wade","key":false}],"cards":[{"id":"u10c01","f":"Fall of the Berlin Wall (1989)","b":"East Germany opened the Wall on Nov. 9, 1989. A symbol of communism's collapse in Eastern Europe."},{"id":"u10c02","f":"Collapse of the USSR (1991)","b":"The Soviet Union dissolved in December 1991, ending the Cold War. The U.S. was left as the sole superpower."},{"id":"u10c03","f":"Persian Gulf War (1991)","b":"Operation Desert Storm: a UN-backed coalition led by George H.W. Bush expelled Iraq from Kuwait."},{"id":"u10c04","f":"Americans with Disabilities Act (1990)","b":"Banned discrimination against people with disabilities in jobs, public services, and accommodations."},{"id":"u10c05","f":"NAFTA (1993)","b":"North American Free Trade Agreement with Canada and Mexico. Clinton pushed it through over union opposition."},{"id":"u10c06","f":"Contract with America (1994)","b":"Newt Gingrich's Republican platform. The GOP won Congress for the first time in 40 years."},{"id":"u10c07","f":"Welfare reform (1996)","b":"Ended AFDC's entitlement to cash aid. TANF imposed work requirements and time limits."},{"id":"u10c08","f":"Clinton impeachment (1998–99)","b":"House impeached Clinton for perjury and obstruction. The Senate acquitted him."},{"id":"u10c09","f":"Bush v. Gore (2000)","b":"Supreme Court halted the Florida recount. Bush won the Electoral College while Gore won the popular vote."},{"id":"u10c10","f":"September 11, 2001","b":"Al-Qaeda hijackers attacked the World Trade Center and Pentagon, killing nearly 3,000. Launched the War on Terror."},{"id":"u10c11","f":"USA PATRIOT Act (2001)","b":"Expanded government surveillance and investigative powers after 9/11. Criticized on civil liberties grounds."},{"id":"u10c12","f":"Department of Homeland Security (2002)","b":"Cabinet department combining agencies to prevent terrorism and secure borders."},{"id":"u10c13","f":"Bush Doctrine","b":"George W. Bush's claimed right to wage preemptive war against potential threats. Used to justify the Iraq War."},{"id":"u10c14","f":"Iraq War (2003)","b":"U.S.-led invasion that toppled Saddam Hussein. No WMDs were found, and a long insurgency followed."},{"id":"u10c15","f":"Great Recession (2007–09)","b":"Financial crisis triggered by the housing bubble and subprime mortgages. Worst downturn since the 1930s."},{"id":"u10c16","f":"Affordable Care Act (2010)","b":"\"Obamacare.\" Expanded health insurance th
