manufactured goods","Return to the gold standard","Repeal of the Fifteenth Amendment"],"e":["Populists demanded government ownership of railroads and telegraphs.","Populists wanted to inflate the currency to raise crop prices and ease farm debts.","Populists opposed high tariffs, which raised the prices farmers paid.","Populists opposed the gold standard. Its defenders were bankers and Republicans.","The Platform did not call for repeal of any amendment."],"a":1},{"id":"u3q02","u":3,"th":"pol","d":"e","pool":"diag","s":"William Jennings Bryan's \"Cross of Gold\" speech of 1896 attacked","st":"","o":["prohibition of alcohol","the annexation of the Philippines","the gold standard, which Bryan said crushed debtors and farmers","the Pullman Strike's labor leaders","the creation of the Federal Reserve"],"e":["Bryan later backed prohibition, but the Cross of Gold speech concerned currency.","Bryan did oppose imperialism, but in 1900. The 1896 speech was about money.","Bryan argued that tying the currency to gold kept money scarce and prices low, hurting producers.","The speech was not about Pullman.","The Federal Reserve was created in 1913."],"a":2},{"id":"u3q03","u":3,"th":"pol","d":"m","pool":"quiz","s":"The presidential election of 1896 is considered a turning point because it","st":"","o":["established free silver as national policy","brought the Populists to power in Congress","was decided by the House of Representatives","began a long period of Republican dominance and effectively ended the Populist Party as an independent force","was the first election in which women voted nationally"],"e":["McKinley's victory led to the Gold Standard Act (1900).","The Populists faded after 1896.","That happened in 1800 and 1824, not 1896.","McKinley's victory realigned politics. Fusion with the Democrats absorbed the Populists, and Republicans controlled the White House for most years until 1932.","Women voted nationally first in 1920."],"a":3},{"id":"u3q04","u":3,"th":"pol","d":"m","pool":"quiz","s":"The Seventeenth Amendment (1913) changed the federal government by","st":"","o":["prohibiting the manufacture and sale of alcohol","requiring the direct popular election of U.S. senators","granting women the right to vote","authorizing a federal income tax","limiting presidents to two terms"],"e":["That was the Eighteenth Amendment.","Before 1913, state legislatures chose senators, a system Progressives and Populists saw as corrupt.","That was the Nineteenth Amendment.","That was the Sixteenth Amendment.","That was the Twenty-second Amendment (1951)."],"a":1},{"id":"u3q05","u":3,"th":"pol","d":"m","pool":"A","s":"The initiative, referendum, and recall were Progressive reforms designed to","st":"","o":["give voters more direct control over legislation and officeholders","restrict voting to property owners","regulate interstate railroads","increase the president's power over Congress","strengthen the power of political machines"],"e":["They let citizens propose laws, vote on them directly, and remove officials, bypassing machine-controlled legislatures.","Progressives sought broader (if not universal) popular control.","Railroad regulation came through the ICC and the Hepburn Act.","These were mainly state and local reforms.","They were aimed against machines."],"a":0},{"id":"u3q06","u":3,"th":"pol","d":"m","pool":"A","s":"Theodore Roosevelt earned the nickname \"trust buster\" largely because his administration","st":"","o":["successfully prosecuted the Northern Securities Company under the Sherman Antitrust Act","abolished all large corporations","created the Federal Reserve System","passed the Clayton Antitrust Act","broke up Standard Oil in 1911"],"e":["The 1904 Supreme Court decision dissolving the railroad holding company revived antitrust enforcement.","Roosevelt distinguished \"good\" trusts from \"bad\" ones and regulated rather than abolished most.","Wilson signed the Federal Reserve Act in 1913.","Clayton came in 1914 under Wilson.","The Standard Oil breakup came under Taft."],"a":0},{"id":"u3q07","u":3,"th":"pol","d":"m","pool":"B","s":"In the anthracite coal strike of 1902, President Theodore Roosevelt broke with earlier practice by","st":"","o":["signing the Wagner Act","outlawing unions in the coal industry","pressuring the mine owners to accept arbitration rather than sending troops to crush the strike","sending troops to protect strikebreakers","nationalizing the coal mines permanently"],"e":["The Wagner Act came in 1935.","He did not outlaw unions.","It was the first time a president intervened as a neutral broker rather than on management's side.","Earlier presidents (Hayes 1877, Cleveland 1894) used troops. TR did not.","Roosevelt threatened a takeover but did not nationalize the mines."],"a":2},{"id":"u3q08","u":3,"th":"pol","d":"h","pool":"B","s":"In the election of 1912, Theodore Roosevelt's \"New Nationalism\" differed from Woodrow Wilson's \"New Freedom\" in that Roosevelt","st":"","o":["supported the gold standard, while Wilson supported free silver","accepted big business as inevitable but called for strong federal regulation of it, while Wilson sought to break up trusts and restore competition","opposed women's suffrage, while Wilson endorsed it in 1912","favored laissez-faire policies, while Wilson favored regulation","ran as the Republican nominee, while Wilson ran as a Socialist"],"e":["The money question was settled by 1900 and was not the 1912 issue.","This is the core contrast. Ironically, Wilson's presidency ended up creating powerful regulatory bodies (the FTC, the Federal Reserve).","Roosevelt's Progressive Party endorsed woman suffrage in 1912. Wilson came around only in 1918.","Both favored government action. Roosevelt favored more federal power.","TR ran as a Progressive (\"Bull Moose\"). Taft was the Republican, Wilson the Democrat, and Debs the Socialist."],"a":1},{"id":"u3q09","u":3,"th":"pol","d":"m","pool":"A","s":"The Federal Reserve Act of 1913 was intended to","st":"","o":["break up large corporations","establish the gold standard","regulate the stock market","create a central banking system that could manage the nation's money supply and credit","insure individual bank deposits"],"e":["Antitrust was handled by the Clayton Act and the FTC.","The Gold Standard Act was passed in 1900.","The SEC was created in 1934.","Twelve regional banks under a Federal Reserve Board could adjust currency and lend to banks, addressing recurring panics.","Deposit insurance (FDIC) came in 1933."],"a":3},{"id":"u3q10","u":3,"th":"pol","d":"m","pool":"A","s":"Samuel Gompers called the Clayton Antitrust Act of 1914 labor's \"Magna Carta\" because it","st":"","o":["guaranteed the right to collective bargaining","exempted labor unions from prosecution as illegal combinations under antitrust law","ended child labor nationwide","created the Department of Labor","established the minimum wage"],"e":["That came with the Wagner Act (1935).","Unions had been hit with injunctions under the Sherman Act. Clayton declared that labor is not a commodity. (Courts later weakened this protection.)","Federal child labor bans were struck down until 1938/1941.","The Department of Labor was created in 1913 by separate legislation.","The federal minimum wage came in 1938."],"a":1},{"id":"u3q11","u":3,"th":"pol","d":"h","pool":"A","s":"Which of the following was a constitutional amendment ratified during the Progressive Era?","st":"","o":["The Twenty-first Amendment, repealing Prohibition","The Twenty-second Amendment, limiting presidential terms","The Sixteenth Amendment, authorizing a federal income tax (1913)","The Fifteenth Amendment, protecting voting rights regardless of race","The Twenty-fourth Amendment, banning poll taxes in federal elections"],"e":["The Twenty-first was ratified in 1933.","The Twenty-second was ratified in 1951.","The Sixteenth, Seventeenth, Eighteenth, and Nineteenth Amendments (1913–1920) are all products of Progressive reform.","The Fifteenth Amendment dates from Reconstruction (1870).","The Twenty-fourth was ratified in 1964."],"a":2},{"id":"u3q12","u":3,"th":"pol","d":"m","pool":"A","s":"Robert La Follette's \"Wisconsin Idea\" is best described as","st":"","o":["a scheme to build canals linking the Great Lakes","a plan for Wisconsin to secede from the Union","a Populist demand for free silver","an agricultural cooperative for dairy farmers","a program of state-level Progressive reform that used university experts to draft and administer policy"],"e":["The Wisconsin Idea did not concern canals.","No such plan existed.","Free silver was a separate monetary issue.","The Wisconsin Idea was about government reform.","La Follette made Wisconsin a \"laboratory of democracy\" with direct primaries, railroad regulation, and expert commissions."],"a":4},{"id":"u3q13","u":3,"th":"pol","d":"e","pool":"quiz","s":"The muckraker Upton Sinclair's novel <em>The Jungle<\/em> (1906) led most directly to the passage of","st":"","o":["the Seventeenth Amendment","the Clayton Antitrust Act","the Social Security Act","the Meat Inspection Act and the Pure Food and Drug Act","the Sherman Antitrust Act"],"e":["Direct election of senators was not Sinclair's subject.","Clayton was passed in 1914.","Social Security came in 1935.","Public disgust at the meatpacking descriptions pushed Congress to act in 1906.","The Sherman Act came in 1890."],"a":3},{"id":"u3q14","u":3,"th":"pol","d":"h","pool":"B","s":"In Lochner v. New York (1905), the Supreme Court","st":"","o":["upheld the federal income tax","upheld a law limiting women's working hours","struck down a state law limiting bakers' working hours as a violation of \"liberty of contract\"","ruled that separate but equal facilities were constitutional","broke up the Northern Securities Company"],"e":["The income tax came by constitutional amendment in 1913.","That was Muller v. Oregon (1908).","Lochner represents the Court's hostility to economic regulation, an era that lasted until 1937.","That was Plessy (1896).","That was Northern Securities Co. v. U.S. (1904)."],"a":2},{"id":"u3q15","u":3,"th":"soc","d":"e","pool":"B","s":"Lincoln Steffens, Ida Tarbell, and Upton Sinclair are best described as","st":"","o":["leaders of the Anti-Imperialist League","leaders of the Populist Party","members of the Lost Generation of the 1920s","Supreme Court justices of the Progressive Era","muckrakers who exposed corruption and abuses in American society"],"e":["Twain and Carnegie are the best-known anti-imperialists.","They were journalists, not Populist politicians.","The Lost Generation came later (Hemingway, Fitzgerald).","None served on the Court.","Steffens (city politics), Tarbell (Standard Oil), and Sinclair (meatpacking) shaped Progressive opinion."],"a":4},{"id":"u3q16","u":3,"th":"soc","d":"e","pool":"A","s":"The Triangle Shirtwaist Factory fire of 1911 led to","st":"","o":["a Supreme Court decision banning child labor","the end of immigration from southern Europe","new state laws improving workplace safety and labor conditions in New York","the Pullman Strike","the founding of the American Federation of Labor"],"e":["The Court struck down federal child labor laws in 1918 (Hammer v. Dagenhart).","Immigration restriction came in the 1920s.","The deaths of 146 workers, many trapped behind locked doors, prompted New York's factory investigating commission and a wave of safety laws.","The Pullman Strike took place in 1894.","The AFL was founded in 1886."],"a":2},{"id":"u3q17","u":3,"th":"soc","d":"m","pool":"A","s":"The Supreme Court's decision in Muller v. Oregon (1908) is notable because it","st":"","o":["outlawed child labor in factories","established a federal minimum wage for women","granted women the right to vote in Oregon","struck down all state labor laws as unconstitutional","upheld a law limiting women's working hours, relying on sociological evidence presented by Louis Brandeis"],"e":["Muller concerned women's hours.","There was no federal minimum wage until 1938.","Suffrage was not the issue.","Muller upheld a labor law.","The \"Brandeis brief\" used data on health effects. It was a Progressive success, though it rested on ideas about women's physical weakness."],"a":4},{"id":"u3q18","u":3,"th":"soc","d":"m","pool":"diag","s":"The NAACP, founded in 1909, differed from Booker T. Washington's approach by","st":"","o":["focusing exclusively on vocational education","promoting emigration to Africa","urging African Americans to accept segregation temporarily","using lawsuits, publicity, and political pressure to demand equal rights","refusing all white members"],"e":["Vocational emphasis was Washington's program.","That was Marcus Garvey's later movement.","That was Washington's Atlanta Compromise strategy.","The NAACP (Du Bois, Ida B. Wells, white progressives) challenged discrimination directly, especially in the courts.","The NAACP was interracial from its founding."],"a":3},{"id":"u3q19","u":3,"th":"soc","d":"m","pool":"B","s":"Which statement best describes the Progressive Era's record on race?","st":"","o":["Progressives passed federal laws ending segregation in the South.","Most white Progressives did little to challenge segregation, and Wilson's administration segregated federal offices.","Progressives successfully abolished poll taxes.","The Seventeenth Amendment restored Black voting rights in the South.","Progressive presidents ended lynching through federal legislation."],"e":["No such federal laws passed until the 1960s.","Disfranchisement and Jim Crow expanded during the era, which is why Black activists organized the Niagara Movement and the NAACP.","The poll tax in federal elections was abolished in 1964.","The Seventeenth Amendment concerned senators' election, not race.","Federal anti-lynching bills failed repeatedly."],"a":1},{"id":"u3q20","u":3,"th":"soc","d":"h","pool":"quiz","s":"The Industrial Workers of the World (IWW), founded in 1905, differed from the American Federation of Labor in that the IWW","st":"","o":["organized only skilled craftsmen","became the largest union in the country by 1920","was closely allied with large employers","rejected strikes as a tactic","sought to organize all workers, including the unskilled, into \"one big union\" with radical goals"],"e":["That was the AFL's approach.","Wartime repression crushed the IWW. The AFL remained much larger.","The IWW was militantly anti-capitalist.","The IWW used strikes heavily (e.g., Lawrence, 1912).","The \"Wobblies\" (Big Bill Haywood) rejected the AFL's craft focus and aimed to replace capitalism."],"a":4},{"id":"u3q21","u":3,"th":"soc","d":"m","pool":"quiz","s":"Coxey's Army of 1894 consisted of","st":"","o":["unemployed workers who marched on Washington to demand federal jobs programs during the depression of the 1890s","Rough Riders who fought in Cuba","veterans demanding early payment of a bonus","federal troops sent to break the Pullman Strike","farmers who founded the Grange"],"e":["Jacob Coxey led the march to call for public works. Leaders were arrested for walking on the Capitol lawn.","The Rough Riders fought in 1898.","That was the Bonus Army of 1932.","Coxey's followers were protesters, not soldiers.","The Grange was founded in 1867."],"a":0},{"id":"u3q22","u":3,"th":"soc","d":"m","pool":"A","s":"Progressive-Era reformers such as Florence Kelley and the National Child Labor Committee worked primarily to","st":"","o":["end child labor and improve conditions for working women and children","promote the spoils system in government","abolish public schools","restrict women's right to vote","expand the crop-lien system"],"e":["Reformers won many state child-labor laws, and Lewis Hine's photographs supported the campaign.","Progressives opposed the spoils system.","Progressives expanded public schooling.","Most social-justice Progressives supported suffrage.","The crop-lien system was a southern farm credit problem, not their goal."],"a":0},{"id":"u3q23","u":3,"th":"soc","d":"h","pool":"diag","s":"Which statement best characterizes the typical Progressive reformer?","st":"","o":["An urban, middle-class, educated professional who believed experts and government could fix social problems","A rural evangelical opposing public schools","A radical seeking to overthrow capitalism","A wealthy industrialist opposed to all regulation","A southern sharecropper seeking free silver"],"e":["Progressives drew heavily from the new professional middle class: lawyers, journalists, teachers, and social workers.","Progressives championed public education.","That describes the IWW or revolutionary socialists, not mainstream Progressives.","Most industrialists resisted Progressive regulation.","That profile fits the Populist base better."],"a":0},{"id":"u3q24","u":3,"th":"eco","d":"e","pool":"A","s":"The main economic grievance behind the farmers' protest movements of the 1880s and 1890s was","st":"","o":["the high wages paid to farm laborers","the federal government's heavy taxation of farmland","rapidly rising crop prices that hurt urban consumers","a shortage of available land in the West","falling crop prices combined with high debts and high railroad rates"],"e":["Farm wages were not the central grievance.","There was no federal land tax. Farmers wanted an income tax instead.","Prices were falling, not rising.","Land was abundant. Prices and credit were the problem.","Deflation made debts harder to pay, while railroads and middlemen took a large share of farm income."],"a":4},{"id":"u3q25","u":3,"th":"eco","d":"m","pool":"B","s":"Farmers supported \"free silver\" in the 1890s mainly because they believed it would","st":"","o":["encourage foreign investment in railroads","reduce the national debt","strengthen the gold standard","lower the prices of their crops to boost exports","increase the money supply, raise crop prices, and make debts easier to repay"],"e":["Free silver was expected to discourage foreign investors, which is one reason bankers opposed it.","The aim was easing private farm debt, not the national debt.","Free silver would effectively replace strict gold backing.","Farmers wanted higher prices.","Inflation would help debtors. Creditors and bankers opposed it for the same reason."],"a":4},{"id":"u3q26","u":3,"th":"eco","d":"m","pool":"B","s":"The Panic of 1893 had which of the following effects?","st":"","o":["It triggered a severe depression with mass unemployment that intensified the debate over currency","It ended the Populist movement immediately","It caused the Spanish-American War","It led to the immediate creation of the Federal Reserve","It brought a period of rapid inflation"],"e":["Bank failures and unemployment fueled Coxey's Army, the Pullman Strike, and the 1896 silver campaign.","The depression actually strengthened the silver crusade through 1896.","The war's causes were the Cuban revolt, the Maine, and the yellow press.","The Federal Reserve came twenty years later, after the Panic of 1907.","The 1890s were deflationary."],"a":0},{"id":"u3q27","u":3,"th":"eco","d":"h","pool":"quiz","s":"Taft's \"Dollar Diplomacy\" in Latin America and Asia aimed to","st":"","o":["withdraw American businesses from Latin America","abandon the Monroe Doctrine","pay reparations to Colombia for the Panama Canal","create a common currency for the Western Hemisphere","expand U.S. influence by encouraging and protecting American investment abroad"],"e":["The policy encouraged business involvement.","Dollar Diplomacy built on U.S. regional dominance.","A $25 million payment came under Wilson's treaty, ratified in 1921, not Taft's policy.","No such currency was proposed.","Taft hoped loans and investment would bring stability and influence, though Marines still landed in Nicaragua."],"a":4},{"id":"u3q28","u":3,"th":"cul","d":"e","pool":"B","s":"In the 1890s, newspaper publishers William Randolph Hearst and Joseph Pulitzer contributed to war with Spain by","st":"","o":["negotiating the Treaty of Paris","writing the Teller Amendment","revealing the Zimmermann Telegram","opposing any U.S. involvement in Cuba","printing sensational \"yellow journalism\" about Spanish atrocities in Cuba"],"e":["Diplomats negotiated the treaty.","Senator Henry Teller authored the amendment.","The Zimmermann Telegram came in 1917, during WWI.","Their papers pushed for intervention.","Exaggerated stories stirred public demand for war, especially after the Maine exploded."],"a":4},{"id":"u3q29","u":3,"th":"cul","d":"m","pool":"quiz","s":"Alfred Thayer Mahan's <em>The Influence of Sea Power upon History<\/em> (1890) argued that","st":"","o":["the frontier shaped American democracy","national greatness depended on a powerful navy supported by overseas bases and colonies","colonies were immoral and should be abandoned","railroads were more important than ships for national defense","the United States should disband its navy to save money"],"e":["That was Turner's thesis.","Mahan's ideas influenced Theodore Roosevelt and the push for a modern navy, Hawaii, and an isthmian canal.","That was the anti-imperialists' view.","Mahan emphasized sea power.","Mahan argued the opposite."],"a":1},{"id":"u3q30","u":3,"th":"cul","d":"m","pool":"quiz","s":"Opponents of annexing the Philippines, including members of the Anti-Imperialist League such as Mark Twain, argued that","st":"","o":["ruling colonies without the consent of their people violated American principles of self-government","the United States should seize Cuba as well","the Philippines should be annexed as a state immediately","the navy needed more coaling stations in Asia","Spain should keep the Philippines"],"e":["Anti-imperialists invoked the Declaration of Independence. Some also used racist arguments against incorporating nonwhite peoples.","The Teller Amendment had already ruled out annexing Cuba, and anti-imperialists opposed new colonies.","Anti-imperialists opposed annexation.","That was an imperialist argument.","They favored Philippine independence, not Spanish rule."],"a":0},{"id":"u3q31","u":3,"th":"cul","d":"m","pool":"quiz","s":"The philosopher John Dewey is best known for promoting","st":"","o":["the Gospel of Wealth","the theory of conspicuous consumption","progressive education emphasizing learning by doing and preparation for democratic citizenship","Social Darwinism and laissez-faire economics","the frontier thesis"],"e":["That was Carnegie.","That was Veblen.","Dewey's pragmatism shaped schools that stressed experience, problem-solving, and social participation.","Dewey rejected Social Darwinism.","That was Turner."],"a":2},{"id":"u3q32","u":3,"th":"cul","d":"h","pool":"B","s":"Pragmatism, as developed by William James and John Dewey, held that","st":"","o":["society should be governed by unchanging natural laws of competition","ideas should be judged by their practical consequences rather than by fixed absolute truths","art should depict only idealized beauty","government should never intervene in the economy","religion is the only source of truth"],"e":["That is closer to Social Darwinism.","This flexible, experimental outlook suited Progressive reformers who wanted to test solutions to social problems.","Pragmatism is a philosophy of knowledge, not an artistic doctrine.","Pragmatism supported experimentation, including government action.","Pragmatism tested beliefs by results, not by authority alone."],"a":1},{"id":"u3q33","u":3,"th":"cul","d":"e","pool":"B","s":"Theodore Roosevelt's conservation policy, carried out with Gifford Pinchot, emphasized","st":"","o":["opening Alaska to unrestricted oil drilling","ending federal involvement in irrigation","scientific management and \"wise use\" of natural resources, along with setting aside national forests and parks","selling all federal lands to private developers","preserving all wilderness completely untouched by human use"],"e":["That was not TR's policy.","The Newlands Act (1902) expanded federal irrigation projects.","TR added millions of acres to national forests and created monuments and wildlife refuges.","TR expanded public lands.","That was John Muir's preservationist view. Pinchot favored managed use."],"a":2},{"id":"u3q34","u":3,"th":"cul","d":"h","pool":"A","s":"The 1913 Armory Show in New York City was significant because it","st":"","o":["marked the beginning of the Harlem Renaissance","celebrated the end of the Spanish-American War","featured the first motion pictures shown in the United States","introduced many Americans to European modernist art such as Cubism","displayed new military weapons before World War I"],"e":["The Harlem Renaissance flourished in the 1920s.","The Armory Show was an art exhibition, not a war celebration.","Motion pictures had been shown since the 1890s.","Works by Picasso, Matisse, and Duchamp shocked viewers and helped launch modern art in America.","The show displayed art, not weapons."],"a":3},{"id":"u3q35","u":3,"th":"dip","d":"e","pool":"quiz","s":"As a result of the Spanish-American War, the United States acquired","st":"","o":["Cuba as a state of the Union","Hawaii and Samoa","the Panama Canal Zone","Alaska and the Aleutian Islands","Puerto Rico, Guam, and the Philippines"],"e":["The Teller Amendment barred annexing Cuba.","Hawaii was annexed separately in 1898, and part of Samoa in 1899, but not from Spain.","The Canal Zone came from Panama in 1903–1904.","Alaska was bought from Russia in 1867.","The Treaty of Paris (1898) transferred these from Spain. Cuba became nominally independent."],"a":4},{"id":"u3q36","u":3,"th":"dip","d":"m","pool":"quiz","s":"The Platt Amendment (1901) made Cuba a U.S. protectorate by","st":"","o":["giving Cuba control of the Panama Canal","making Cuba a U.S. state","promising never to interfere in Cuba","allowing the United States to intervene in Cuban affairs and to lease a naval base at Guantánamo Bay","requiring Cuba to adopt English as its official language"],"e":["Cuba had no role in the canal.","Cuba was never annexed.","That pledge is closer to the Teller Amendment, which the Platt Amendment effectively undercut.","Cuba had to add these terms to its constitution, limiting its sovereignty until 1934.","No such requirement existed."],"a":3},{"id":"u3q37","u":3,"th":"dip","d":"m","pool":"B","s":"John Hay's Open Door Notes (1899–1900) called for","st":"","o":["closing Chinese ports to European trade","the United States to annex Chinese territory","equal trading rights for all nations in China and respect for China's territorial integrity","U.S. control of the Panama Canal","an end to Japanese immigration to the U.S."],"e":["The notes called for open, equal access.","The U.S. did not seek territory in China.","The U.S., with no sphere of its own, wanted access to Chinese markets without colonizing China.","The canal was a separate issue.","That was addressed by the Gentlemen's Agreement (1907)."],"a":2},{"id":"u3q38","u":3,"th":"dip","d":"m","pool":"B","s":"The Roosevelt Corollary to the Monroe Doctrine (1904) asserted that the United States would","st":"","o":["act as an \"international police power\" in Latin America to prevent European intervention","support Latin American independence from the United States","withdraw all troops from Latin America","allow European nations to collect debts by force in the Americas","abandon the Monroe Doctrine"],"e":["TR first applied it in the Dominican Republic, taking over customs collection to pay its debts.","It asserted U.S. authority.","The Corollary justified more intervention.","It aimed to keep Europeans out by having the U.S. intervene itself.","It expanded the Monroe Doctrine."],"a":0},{"id":"u3q39","u":3,"th":"dip","d":"h","pool":"quiz","s":"The United States acquired rights to build the Panama Canal after","st":"","o":["Great Britain transferred the region in the Treaty of Washington","Mexico ceded it at the end of the Mexican-American War","a vote of the Colombian Senate approved the original treaty","it purchased the region from Spain in the Treaty of Paris","it supported a revolution in which Panama broke away from Colombia in 1903"],"e":["The Hay-Pauncefote Treaty (1901) gave Britain's consent to a U.S. canal but transferred no territory.","Mexico never controlled Panama.","The Colombian Senate rejected the treaty, which is why the U.S. backed Panama's revolt.","Panama was part of Colombia, not a Spanish colony in 1898.","When Colombia rejected a treaty, Roosevelt backed Panama's revolt and quickly signed the Hay-Bunau-Varilla Treaty with the new nation."],"a":4},{"id":"u4q01","u":4,"th":"dip","d":"e","pool":"A","s":"The Zimmermann Telegram (1917) angered Americans because it revealed that Germany had","st":"","o":["offered to buy the Philippines","signed a peace treaty with Russia","proposed that Mexico ally with Germany against the United States in return for recovering lost territory","sunk the Lusitania","refused to pay reparations"],"e":["No such offer existed.","Brest-Litovsk (1918) came after U.S. entry.","Germany offered Mexico Texas, New Mexico, and Arizona. Published in March 1917, the telegram pushed opinion toward war.","The Lusitania was sunk in 1915. The telegram came two years later.","Reparations were imposed after the war."],"a":2},{"id":"u4q02","u":4,"th":"dip","d":"e","pool":"quiz","s":"Wilson's Fourteen Points included all of the following goals EXCEPT","st":"","o":["a League of Nations","freedom of the seas","national self-determination","the annexation of German colonies by the United States","reduction of armaments"],"e":["The League was the fourteenth point and Wilson's top priority.","Freedom of navigation was Point II.","Self-determination ran through the points on Europe's borders.","Wilson opposed territorial grabs. The Fourteen Points called for impartial adjustment of colonial claims.","Arms reduction was Point IV."],"a":3},{"id":"u4q03","u":4,"th":"dip","d":"m","pool":"quiz","s":"Senate opponents of the Treaty of Versailles, led by Henry Cabot Lodge rial workers.","About six million women entered the workforce, many in defense factories.","Suffrage was won in 1920.","Rosie dates from the 1940s.","Flappers were a Jazz Age image."],"a":1},{"id":"u6q19","u":6,"th":"soc","d":"e","pool":"quiz","s":"The \"Double V\" campaign during World War II called for","st":"","o":["victory in both Europe and the Pacific within one year","doubling war production and war bond sales","victory over the Soviet Union and Germany","victory over fascism abroad and victory over racial discrimination at home","doubling the number of women in the workforce"],"e":["The slogan concerned racism, not timetables.","It was a civil rights slogan.","The Soviet Union was an ally.","Launched by the <em>Pittsburgh Courier<\/em>, it linked the war's ideals to the fight against Jim Crow.","It referred to African Americans' struggle."],"a":3},{"id":"u6q20","u":6,"th":"soc","d":"m","pool":"quiz","s":"The Bracero Program, begun in 1942, was established to","st":"","o":["deport Mexican Americans during the Depression","relocate Japanese Americans to Mexico","provide college education for veterans","train Mexican soldiers to fight in Europe","bring Mexican workers into the United States to meet wartime agricultural labor shortages"],"e":["Repatriation took place in the early 1930s.","Japanese Americans were held in U.S. camps.","That was the GI Bill.","The program was about farm labor.","It continued until 1964 and shaped Mexican migration patterns."],"a":4},{"id":"u6q21","u":6,"th":"soc","d":"m","pool":"quiz","s":"The Zoot Suit Riots of 1943 in Los Angeles involved","st":"","o":["attacks by servicemen on young Mexican Americans, reflecting wartime ethnic tensions","a revolt by Japanese Americans in internment camps","fights between rival labor unions","strikes by defense workers demanding higher wages","protests against the internment of Japanese Americans"],"e":["Sailors and soldiers beat zoot-suited youths while police largely stood by.","There was unrest in some camps, but that is not the Zoot Suit Riots.","They were not union conflicts.","These riots were ethnic violence, not a labor dispute.","They were not internment protests."],"a":0},{"id":"u6q22","u":6,"th":"soc","d":"m","pool":"diag","s":"Which of the following statements about Japanese American internment during World War II is accurate?","st":"","o":["Congress has never acknowledged the injustice.","German Americans and Italian Americans were interned in equal numbers.","Internment applied to all Japanese Americans in Hawaii.","Many Japanese Americans were convicted of espionage.","A majority of those interned were U.S. citizens."],"e":["The Civil Liberties Act of 1988 apologized and paid reparations.","Far fewer German and Italian nationals were interned, and there was no mass removal of those communities.","Hawaii, with a large Japanese American population, saw only limited detentions.","No Japanese American was convicted of espionage during the war.","About two-thirds of the roughly 120,000 internees were American-born citizens (Nisei)."],"a":4},{"id":"u6q23","u":6,"th":"soc","d":"m","pool":"B","s":"The GI Bill (Servicemen's Readjustment Act) of 1944","st":"","o":["guaranteed jobs to women who had worked in war industries","paid reparations to Japanese Americans","created a peacetime draft","desegregated universities in the South","provided veterans with funds for education and low-interest home loans, expanding the middle class"],"e":["Most women were pushed out of industrial jobs after the war.","Reparations came in 1988.","The draft came in 1940 and again in 1948.","Southern schools stayed segregated, and Black veterans often faced barriers in using benefits.","Millions of veterans attended college, and federally backed mortgages fueled suburban growth."],"a":4},{"id":"u6q24","u":6,"th":"soc","d":"h","pool":"quiz","s":"During World War II, the federal government's response to the plight of European Jewish refugees is best characterized as","st":"","o":["generous, admitting all refugees who applied","carried out mainly through the United Nations","focused on bombing concentration camps early in the war","ignorant, since no reports of mass killing reached Washington before 1945","limited, since immigration quotas stayed strict and a War Refugee Board was created only in 1944"],"e":["Quotas and bureaucratic barriers kept most out.","The UN did not yet exist as an operating body.","Requests to bomb Auschwitz were refused.","Reports of mass murder reached officials by 1942.","The 1939 turning away of the <em>St. Louis<\/em> and restrictive visa policies kept most refugees out."],"a":4},{"id":"u6q25","u":6,"th":"soc","d":"m","pool":"quiz","s":"The Navajo code talkers contributed to the U.S. war effort by","st":"","o":["serving as interpreters at the Yalta Conference","training the Tuskegee Airmen","building the atomic bomb at Los Alamos","leading the Bracero Program","transmitting military messages in a code based on the Navajo language that the Japanese never broke"],"e":["There is no connection to Yalta.","The Tuskegee Airmen were Black pilots trained in Alabama.","The bomb was built by Manhattan Project scientists.","The Bracero Program brought Mexican farm workers.","About 400 Navajo Marines served as code talkers in the Pacific."],"a":4},{"id":"u6q26","u":6,"th":"soc","d":"e","pool":"A","s":"The Tuskegee Airmen of World War II were","st":"","o":["Navajo Marines who transmitted coded messages","scientists who developed radar","women who ferried aircraft across the country","Japanese American soldiers of the 442nd Regiment","African American military pilots who served with distinction in a segregated armed forces"],"e":["Those were the code talkers.","Radar development involved British and American scientists.","Those were the WASPs.","The 442nd was a Japanese American infantry unit.","Their record helped build the case for desegregating the military in 1948."],"a":4},{"id":"u6q27","u":6,"th":"soc","d":"h","pool":"A","s":"The 442nd Regimental Combat Team is notable in World War II history because it","st":"","o":["led the D-Day landing at Omaha Beach","dropped the atomic bomb on Hiroshima","guarded internment camps on the West Coast","was composed mainly of Japanese American soldiers and became one of the most decorated units for its size","was the first racially integrated unit in the army"],"e":["The 442nd fought mainly in Italy and France.","The <em>Enola Gay<\/em>'s crew belonged to the Army Air Forces' 509th Composite Group.","The 442nd fought overseas.","Many of its soldiers had families in internment camps.","It was segregated by ancestry."],"a":3},{"id":"u6q28","u":6,"th":"soc","d":"m","pool":"A","s":"World War II affected the American economy by","st":"","o":["eliminating the federal income tax","ending the Depression through massive government spending that created full employment","reducing the size of the federal government","causing a deep depression that lasted until 1950","causing the stock market crash of 1941"],"e":["The income tax expanded to most workers, with withholding.","Federal spending dwarfed the New Deal, unemployment fell to about 1%, and output nearly doubled.","The federal government grew enormously.","The war produced a boom, not a depression.","There was no 1941 crash."],"a":1},{"id":"u6q29","u":6,"th":"eco","d":"m","pool":"B","s":"The Office of Price Administration during World War II was responsible for","st":"","o":["negotiating Lend-Lease agreements","rationing scarce goods and controlling prices to prevent inflation","building the atomic bomb","regulating labor unions","drafting soldiers"],"e":["Lend-Lease was run by other agencies and diplomats.","Families used ration books for gasoline, sugar, meat, and other goods.","That was the Manhattan Project.","The NLRB and War Labor Board handled labor matters.","The Selective Service handled the draft."],"a":1},{"id":"u6q30","u":6,"th":"eco","d":"e","pool":"A","s":"During World War II, the federal government began collecting income taxes through","st":"","o":["automatic withholding from workers' paychecks","tariffs on imported goods only","contributions from state governments","a single annual payment due only from the wealthy","a national sales tax on all goods"],"e":["Starting in 1943, withholding made the income tax a mass tax paid by most workers.","Tariffs were a small share of wartime revenue.","Federal income tax is paid by individuals.","The income tax broadened to most earners.","There is no national sales tax."],"a":0},{"id":"u6q31","u":6,"th":"cul","d":"m","pool":"B","s":"During World War II, Norman Rockwell's popular paintings of the Four Freedoms and Frank Capra's <em>Why We Fight<\/em> films were used to","st":"","o":["promote isolationism","celebrate the Harlem Renaissance","build public support for the war by illustrating American values and war aims","criticize the internment of Japanese Americans","protest wartime rationing"],"e":["These works supported the war effort.","They concerned the war effort.","Government and private media framed the war as a defense of freedom and democracy.","Mainstream wartime media rarely criticized internment.","They encouraged sacrifice rather than protest."],"a":2},{"id":"u6q32","u":6,"th":"cul","d":"m","pool":"A","s":"The America First Committee, founded in 1940, argued that","st":"","o":["the U.S. should immediately declare war on Germany","women should be drafted into the military","the U.S. should join the League of Nations","Japan should be the first priority of U.S. foreign policy","the United States should stay out of the European war and avoid aiding Britain"],"e":["That was the opposite of its position.","The committee did not address drafting women.","The committee was isolationist.","The committee opposed involvement in war generally.","With prominent members like Charles Lindbergh, it opposed Lend-Lease and intervention until Pearl Harbor."],"a":4},{"id":"u6q33","u":6,"th":"cul","d":"h","pool":"A","s":"The Manhattan Project is significant in the history of American science and society because it","st":"","o":["was located entirely in New York City","marked the beginning of large-scale government funding of scientific research tied to national security","was the first private corporation to develop nuclear energy","produced the first television broadcasts","was publicly debated in Congress before the bomb was built"],"e":["Major sites included Los Alamos (NM), Oak Ridge (TN), and Hanford (WA).","It joined the federal government, universities, and industry, a model for the postwar military-industrial complex.","It was a secret government project.","Television had other origins.","It was highly secret."],"a":1},{"id":"u6q34","u":6,"th":"cul","d":"h","pool":"quiz","s":"Which of the following best describes how World War II changed attitudes about race in the United States?","st":"","o":["The war had no effect on African American migration.","Segregation ended in the armed forces during the war.","The contradiction between fighting Nazi racism and practicing segregation at home strengthened demands for civil rights.","Racial violence completely disappeared on the home front.","Congress passed a major civil rights act in 1944."],"e":["A second Great Migration drew many Black workers to defense jobs.","The military remained segregated until 1948.","Black veterans, the Double V campaign, and growing NAACP membership laid foundations for the postwar civil rights movement.","Riots erupted in Detroit, Los Angeles, and elsewhere in 1943.","No major civil rights act passed until 1957."],"a":2}],"units":[{"n":1,"title":"Reconstruction and the New South","years":"1865–1900","period":"early","weight":8,"minutes":10,"lesson":"<h2>The big question<\/h2>\n<p>In 1865 the Union had won the war, and about four million enslaved people were free. Two questions followed. <strong>On what terms would the eleven Confederate states rejoin the Union?<\/strong> And <strong>what would freedom actually mean for formerly enslaved people?<\/strong> The struggle over these questions is called <strong>Reconstruction<\/strong> (1865–1877). The short version: freedpeople won major constitutional rights during Reconstruction. Then the North lost interest, white southern Democrats retook power, and most of those rights were stripped away by 1900.<\/p>\n<h2>Presidential Reconstruction (1865–1866)<\/h2>\n<p>Lincoln had planned a lenient restoration. Under his <strong>Ten Percent Plan<\/strong> (1863), a state could form a new government once 10% of its 1860 voters swore loyalty to the Union. Congress pushed back with the harsher <strong>Wade-Davis Bill<\/strong>, which required 50% and an \"ironclad oath,\" but Lincoln pocket-vetoed it. Lincoln was assassinated in April 1865, and <strong>Andrew Johnson<\/strong>, a pro-Union Democrat from Tennessee, became president.<\/p>\n<p>Johnson pardoned thousands of ex-Confederates and let the old southern elite rebuild state governments. Those governments passed <strong>Black Codes<\/strong>. These laws limited freedpeople's right to own or rent land, required them to sign yearly labor contracts, and let authorities arrest unemployed Black men for \"vagrancy\" and hire them out. Johnson also returned land confiscated during the war to its prewar owners. That ended the hopes raised by General Sherman's Field Order No. 15 that freedpeople would get <strong>\"forty acres and a mule.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Johnson's lenient pardons; old elites back in power<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Southern states pass Black Codes; anti-Black riots in Memphis and New Orleans (1866)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Northern voters elect a Republican supermajority in 1866; Congress takes over Reconstruction<\/div><\/div>\n<p>The <strong>Thirteenth Amendment<\/strong> (ratified December 1865) abolished slavery. Congress also created the <strong>Freedmen's Bureau<\/strong> (1865). It provided food and medical care and supervised labor contracts. Its most lasting work was <strong>education<\/strong>: with northern missionary societies, it helped found schools and colleges such as <strong>Howard<\/strong> and <strong>Fisk<\/strong>.<\/p>\n<h2>Congressional (Radical) Reconstruction (1867–1877)<\/h2>\n<p>The <strong>Radical Republicans<\/strong>, led by <strong>Thaddeus Stevens<\/strong> in the House and <strong>Charles Sumner<\/strong> in the Senate, wanted to remake southern society and protect Black rights. Congress passed the <strong>Civil Rights Act of 1866<\/strong> over Johnson's veto. Then, to put those rights beyond the reach of future majorities, it wrote the <strong>Fourteenth Amendment<\/strong> (ratified 1868). The amendment made everyone born in the U.S. a <strong>citizen<\/strong> and barred states from denying anyone <strong>\"due process\"<\/strong> or <strong>\"equal protection of the laws.\"<\/strong> It later became the foundation of the twentieth-century civil rights revolution.<\/p>\n<p>When southern states refused to ratify it, Congress passed the <strong>Reconstruction Acts of 1867<\/strong>. These acts divided the former Confederacy (except Tennessee, already readmitted) into <strong>five military districts<\/strong>. To be readmitted, a state had to write a new constitution guaranteeing <strong>Black male suffrage<\/strong> and ratify the Fourteenth Amendment.<\/p>\n<p>Congress also passed the <strong>Tenure of Office Act<\/strong>, which barred the president from removing certain officials without Senate approval. Johnson fired Secretary of War Edwin Stanton anyway, and in 1868 the House <strong>impeached<\/strong> him. The Senate fell <strong>one vote<\/strong> short of removing him. Johnson finished his term with little power left.<\/p>\n<p><strong>Ulysses S. Grant<\/strong> won the presidency in 1868. The <strong>Fifteenth Amendment<\/strong> (1870) barred denying the vote on account of <strong>\"race, color, or previous condition of servitude.\"<\/strong> It did not mention sex, which angered woman suffrage leaders and split their movement.<\/p>\n<h3>Reconstruction governments in the South<\/h3>\n<p>Southern Republican governments drew support from three groups:<\/p>\n<ul><li>freedmen, who voted in large numbers<\/li><li><strong>\"carpetbaggers\"<\/strong>, northerners who moved South<\/li><li><strong>\"scalawags\"<\/strong>, white southerners who joined the Republicans<\/li><\/ul>\n<p>About 2,000 Black men held office. <strong>Hiram Revels<\/strong> of Mississippi became the <strong>first African American U.S. senator<\/strong> (1870). These governments created the South's first <strong>public school systems<\/strong> and rebuilt railroads, but they also ran up debt and suffered some corruption, which opponents exaggerated.<\/p>\n<p>Freedpeople built independent lives. They <strong>reunited families<\/strong>, legalized marriages, and founded <strong>Black churches<\/strong>, which became the center of community and political life. They also flocked to schools.<\/p>\n<h3>Violence and retreat<\/h3>\n<p>The <strong>Ku Klux Klan<\/strong> (founded 1866) and similar groups used terror to keep Black men from voting. Congress answered with the <strong>Enforcement Acts<\/strong> and the <strong>Ku Klux Klan Act<\/strong> (1870–71), which let federal troops and courts crush the first Klan. But northern commitment faded for several reasons:<\/p>\n<ul><li>the <strong>Panic of 1873<\/strong> turned voters' attention to the economy<\/li><li>scandals in Grant's administration, including the <strong>Crédit Mobilier<\/strong> railroad bribery scheme and the <strong>Whiskey Ring<\/strong> tax fraud, discredited Republican rule<\/li><li>northern racism made voters weary of the \"southern question\"<\/li><\/ul>\n<p>The Supreme Court also narrowed the new amendments. In the <strong>Slaughterhouse Cases<\/strong> (1873), the Court read the Fourteenth Amendment's protections narrowly. <strong>U.S. v. Cruikshank<\/strong> (1876) overturned convictions from the <strong>Colfax Massacre<\/strong> and left protection of Black citizens mostly to the states.<\/p>\n<h2>The end of Reconstruction: the Compromise of 1877<\/h2>\n<p>The <strong>election of 1876<\/strong> between <strong>Rutherford B. Hayes<\/strong> (Republican) and <strong>Samuel Tilden<\/strong> (Democrat) hinged on disputed electoral votes from three southern states. In the informal <strong>Compromise of 1877<\/strong>, Democrats accepted Hayes as president, and Hayes <strong>withdrew the last federal troops<\/strong> from southern statehouses. Southern Democrats who called themselves <strong>\"Redeemers\"<\/strong> took over every southern state.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Northern fatigue, depression, violence, court rulings<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Compromise of 1877 removes federal troops<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>\"Redeemer\" Democrats rule the South; Black rights erode<\/div><\/div>\n<h2>The \"New South\" and Jim Crow (1877–1900)<\/h2>\n<p>Atlanta editor <strong>Henry Grady<\/strong> promoted a <strong>\"New South\"<\/strong> of factories, railroads, and diversified farming. Some industry did grow: <strong>textile mills<\/strong>, <strong>Birmingham steel<\/strong>, and <strong>tobacco<\/strong> (James B. Duke's American Tobacco Company). But the South stayed poor and mostly agricultural, and northern capital often owned its industry.<\/p>\n<h3>The farm trap<\/h3>\n<p>Without land, most freedpeople, and many poor whites, became <strong>sharecroppers<\/strong>. They farmed a landowner's land in exchange for a share of the crop, often half. Others were <strong>tenant farmers<\/strong> who rented land. Under the <strong>crop-lien system<\/strong>, local merchants supplied seed and food on credit, secured by a lien on the coming crop. High interest and low cotton prices kept families in <strong>permanent debt<\/strong>.<\/p>\n<h3>Jim Crow and disfranchisement<\/h3>\n<p>By the 1890s southern states built a system of legal segregation known as <strong>Jim Crow<\/strong>. To get around the Fifteenth Amendment, they used:<\/p>\n<ul><li><strong>poll taxes<\/strong><\/li><li><strong>literacy tests<\/strong>, applied unfairly by white registrars<\/li><li><strong>white primaries<\/strong><\/li><li><strong>grandfather clauses<\/strong>, which excused a man from these tests if his grandfather could vote before 1867, so poor whites kept the vote<\/li><\/ul>\n<p>The Supreme Court went along:<\/p>\n<ul><li><strong>Civil Rights Cases (1883):<\/strong> struck down the Civil Rights Act of 1875, holding that the Fourteenth Amendment limits <em>state<\/em> action, not private businesses.<\/li><li><strong>Plessy v. Ferguson (1896):<\/strong> upheld segregated railroad cars under the doctrine of <strong>\"separate but equal.\"<\/strong> Justice <strong>John Marshall Harlan<\/strong> dissented alone: \"Our Constitution is color-blind.\"<\/li><\/ul>\n<p><strong>Lynching<\/strong> peaked in the 1890s. Journalist <strong>Ida B. Wells<\/strong> exposed it in pamphlets such as <em>Southern Horrors<\/em> (1892). Some Black southerners left. The <strong>Exodusters<\/strong> moved to Kansas in 1879.<\/p>\n<h3>Two Black strategies<\/h3>\n<p><strong>Booker T. Washington<\/strong> founded the <strong>Tuskegee Institute<\/strong> (1881). In his <strong>Atlanta Compromise<\/strong> speech (1895), he urged Black southerners to accept segregation for now and focus on <strong>vocational education<\/strong> and economic self-help. <strong>W.E.B. Du Bois<\/strong> answered in <em>The Souls of Black Folk<\/em> (1903). He demanded <strong>full civil and political rights now<\/strong> and higher education for a <strong>\"Talented Tenth\"<\/strong> of leaders. (Du Bois's later work is in Unit 3.)<\/p>\n<p>Meanwhile, white southerners built the <strong>\"Lost Cause\"<\/strong> memory of the war. It cast the Confederacy as a noble fight for states' rights rather than slavery. Monuments and textbooks spread this view for generations.<\/p>\n<h3>One diplomatic footnote<\/h3>\n<p>In 1867 Secretary of State <strong>William Seward<\/strong> bought <strong>Alaska<\/strong> from Russia for $7.2 million. Critics mocked it as \"Seward's Folly.\"<\/p>","mustknow":["<strong>13th Amendment<\/strong> (1865) abolished slavery. <strong>14th<\/strong> (1868) gave citizenship plus <strong>equal protection<\/strong> and <strong>due process<\/strong>. <strong>15th<\/strong> (1870) barred race-based denial of the vote.","<strong>Black Codes<\/strong> (1865–66): southern laws restricting freedpeople's labor and movement. They provoked <strong>Radical Reconstruction<\/strong>.","<strong>Reconstruction Acts of 1867<\/strong>: five military districts; readmission required Black male suffrage and ratifying the 14th Amendment.","<strong>Johnson's impeachment<\/strong> (1868) came from firing Stanton in violation of the <strong>Tenure of Office Act<\/strong>. He was acquitted by one vote.","<strong>Freedmen's Bureau<\/strong>: aid, labor contracts, and especially <strong>schools<\/strong> (Howard, Fisk).","<strong>Sharecropping + crop-lien<\/strong> = a cycle of debt for Black and poor white farmers.","<strong>Compromise of 1877<\/strong>: Hayes becomes president and federal troops leave the South. Reconstruction ends.","<strong>Plessy v. Ferguson<\/strong> (1896) = \"separate but equal.\" Harlan's dissent: \"color-blind.\"","Disfranchisement tools: <strong>poll tax, literacy test, grandfather clause, white primary<\/strong>.","<strong>Booker T. Washington<\/strong> (accommodation, Tuskegee, Atlanta Compromise) vs. <strong>W.E.B. Du Bois<\/strong> (immediate rights, Talented Tenth)."],"timeline":[{"y":"1863","t":"Lincoln's Ten Percent Plan","key":false},{"y":"1865","t":"Lincoln assassinated; Freedmen's Bureau created; 13th Amendment ratified; Black Codes begin","key":true},{"y":"1866","t":"Civil Rights Act passed over Johnson's veto; Ku Klux Klan founded","key":false},{"y":"1867","t":"Reconstruction Acts (military districts); Tenure of Office Act; Alaska purchased","key":true},{"y":"1868","t":"Johnson impeached and acquitted; 14th Amendment ratified; Grant elected","key":true},{"y":"1870","t":"15th Amendment; Hiram Revels first Black U.S. senator","key":true},{"y":"1870–71","t":"Enforcement Acts and Ku Klux Klan Act","key":false},{"y":"1873","t":"Panic of 1873; Slaughterhouse Cases; Colfax Massacre","key":false},{"y":"1876","t":"Disputed Hayes–Tilden election; U.S. v. Cruikshank","key":false},{"y":"1877","t":"Compromise of 1877: troops withdrawn, Reconstruction ends","key":true},{"y":"1879","t":"Exoduster migration to Kansas","key":false},{"y":"1881","t":"Booker T. Washington opens Tuskegee Institute","key":false},{"y":"1883","t":"Civil Rights Cases strike down Civil Rights Act of 1875","key":false},{"y":"1890","t":"Mississippi constitution adds poll tax and literacy test","key":false},{"y":"1892","t":"Ida B. Wells publishes <em>Southern Horrors<\/em>","key":false},{"y":"1895","t":"Washington's Atlanta Compromise speech","key":false},{"y":"1896","t":"Plessy v. Ferguson: \"separate but equal\"","key":true}],"cards":[{"id":"u1c01","f":"Thirteenth Amendment (1865)","b":"Abolished slavery and involuntary servitude, except as punishment for a crime."},{"id":"u1c02","f":"Fourteenth Amendment (1868)","b":"Citizenship for all persons born in the U.S.; states may not deny \"due process\" or \"equal protection of the laws.\" The basis of later civil rights rulings."},{"id":"u1c03","f":"Fifteenth Amendment (1870)","b":"The right to vote cannot be denied because of \"race, color, or previous condition of servitude.\" It left out women."},{"id":"u1c04","f":"Ten Percent Plan vs. Wade-Davis Bill","b":"Lincoln: a state is restored once 10% of 1860 voters swear loyalty. Congress (Wade-Davis): 50% plus an ironclad oath. Lincoln pocket-vetoed it."},{"id":"u1c05","f":"Freedmen's Bureau (1865)","b":"Federal agency that gave freedpeople food and medical care and supervised labor contracts. Its biggest legacy was schools and colleges (Howard, Fisk)."},{"id":"u1c06","f":"Black Codes","b":"Laws passed by southern states in 1865–66 restricting freedpeople's labor, movement, and property rights. They sparked Radical Reconstruction."},{"id":"u1c07","f":"Radical Republicans","b":"Congressional faction (Thaddeus Stevens, Charles Sumner) that pushed for Black civil and voting rights and tough terms for the South."},{"id":"u1c08","f":"Reconstruction Acts of 1867","b":"Split the South into five military districts. Readmission required new constitutions with Black male suffrage and ratification of the 14th Amendment."},{"id":"u1c09","f":"Impeachment of Andrew Johnson (1868)","b":"The House impeached him for firing Secretary of War Stanton in violation of the Tenure of Office Act. The Senate acquitted by one vote."},{"id":"u1c10","f":"Carpetbaggers / Scalawags","b":"Carpetbaggers were northerners who moved South during Reconstruction. Scalawags were white southerners who supported the Republicans."},{"id":"u1c11","f":"Sharecropping","b":"Landless farmers worked a landowner's land in exchange for a share of the crop. It was the dominant labor system for freedpeople."},{"id":"u1c12","f":"Crop-lien system","b":"Merchants advanced seed and supplies on credit, secured by the future crop. High interest kept farmers in endless debt."},{"id":"u1c13","f":"Enforcement Acts / Ku Klux Klan Act (1870–71)","b":"Federal laws that let the government use courts and troops against Klan terror aimed at Black voters."},{"id":"u1c14","f":"Compromise of 1877","b":"Settled the disputed Hayes–Tilden election. Hayes became president and withdrew the last federal troops from the South, ending Reconstruction."},{"id":"u1c15","f":"Redeemers","b":"Southern white Democrats who took back state governments from Republicans in the 1870s and rolled back Reconstruction."},{"id":"u1c16","f":"New South","b":"Henry Grady's vision of an industrialized, diversified southern economy (textiles, steel, tobacco). Only partly achieved."},{"id":"u1c17","f":"Jim Crow disfranchisement tools","b":"Poll taxes, literacy tests, white primaries, and grandfather clauses, used to strip Black men of the vote despite the 15th Amendment."},{"id":"u1c18","f":"Plessy v. Ferguson (1896)","b":"Supreme Court upheld segregated railroad cars under \"separate but equal.\" Justice Harlan dissented: \"Our Constitution is color-blind.\""},{"id":"u1c19","f":"Atlanta Compromise (1895)","b":"Booker T. Washington's speech urging Black southerners to accept segregation for now and pursue vocational education and economic progress."},{"id":"u1c20","f":"Ida B. Wells","b":"Black journalist who led the crusade against lynching (<em>Southern Horrors<\/em>, 1892)."},{"id":"u1c21","f":"Exodusters (1879)","b":"Black southerners who migrated to Kansas to escape the post-Reconstruction South."}]},{"n":2,"title":"The Gilded Age: Industry, Labor, the West, and the Cities","years":"1865–1900","period":"early","weight":12,"minutes":12,"lesson":"<h2>The big picture<\/h2>\n<p>Between the Civil War and 1900 the United States became the world's leading <strong>industrial economy<\/strong>. Railroads, steel, oil, and electricity built enormous fortunes. They also brought dangerous factories, crowded cities, and violent strikes. Mark Twain and Charles Dudley Warner called it <strong>\"The Gilded Age\"<\/strong> (1873): a thin layer of gold over serious problems. This unit has four pieces: <strong>big business<\/strong>, <strong>labor<\/strong>, <strong>immigrants and cities<\/strong>, and <strong>the West<\/strong>. A short section on <strong>politics<\/strong> follows.<\/p>\n<h2>1. Railroads and big business<\/h2>\n<p>The <strong>transcontinental railroad<\/strong> was finished at <strong>Promontory Point, Utah, in 1869<\/strong>. The Union Pacific was built largely by Irish workers and the Central Pacific by Chinese workers. Congress subsidized railroads with huge <strong>land grants<\/strong>. Railroads created a <strong>national market<\/strong> and drove demand for steel and coal. They even led to <strong>standard time zones<\/strong> (1883).<\/p>\n<p>New business strategies created giant corporations:<\/p>\n<ul><li><strong>Andrew Carnegie<\/strong> (steel) used the <strong>Bessemer process<\/strong> and <strong>vertical integration<\/strong>: he owned every stage of production, from iron mines and ore ships to mills and railroads. In 1901 he sold to banker <strong>J.P. Morgan<\/strong>, who created <strong>U.S. Steel<\/strong>, the first <strong>billion-dollar corporation<\/strong>.<\/li><li><strong>John D. Rockefeller<\/strong> (<strong>Standard Oil<\/strong>) used <strong>horizontal integration<\/strong>. He bought out or crushed competing refiners until he controlled about 90% of U.S. refining. He organized the business as a <strong>trust<\/strong> (1882), in which stockholders of many companies handed control to one board of trustees. Later, <strong>holding companies<\/strong> did the same job.<\/li><li>Critics called these men <strong>\"robber barons\"<\/strong>. Admirers called them <strong>\"captains of industry.\"<\/strong><\/li><\/ul>\n<p>New inventions remade daily life. <strong>Alexander Graham Bell<\/strong> invented the telephone (1876). <strong>Thomas Edison<\/strong> set up a research lab at Menlo Park and produced a practical <strong>light bulb<\/strong> (1879). <strong>George Westinghouse<\/strong> promoted alternating current.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Railroads + new technology + cheap immigrant labor + government support<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Rise of giant corporations and trusts<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Huge wealth gap, monopoly power, and a backlash from farmers and workers<\/div><\/div>\n<h3>Ideas that justified (and challenged) big business<\/h3>\n<p><strong>Social Darwinism<\/strong> applied \"survival of the fittest\" to society. <strong>Herbert Spencer<\/strong> and Yale's <strong>William Graham Sumner<\/strong> argued that the rich had earned their place and government should not help the poor. This fit with <strong>laissez-faire<\/strong> economics. <strong>Horatio Alger<\/strong> novels sold the \"rags to riches\" dream.<\/p>\n<p>Carnegie's <strong>\"Gospel of Wealth\"<\/strong> (1889) argued that the rich had a duty to give their fortunes away for the public good, through libraries, universities, and concert halls. \"The man who dies thus rich dies disgraced.\"<\/p>\n<p>Critics pushed back:<\/p>\n<ul><li><strong>Henry George<\/strong>, <em>Progress and Poverty<\/em> (1879), proposed a <strong>\"single tax\"<\/strong> on land values.<\/li><li><strong>Edward Bellamy<\/strong>, <em>Looking Backward<\/em> (1888), imagined a cooperative socialist utopia in the year 2000.<\/li><li><strong>Thorstein Veblen<\/strong> coined <strong>\"conspicuous consumption\"<\/strong> for the wasteful display of the rich (<em>The Theory of the Leisure Class<\/em>, 1899).<\/li><\/ul>\n<h3>First steps at regulation<\/h3>\n<p>Farmers angry at railroad rates won state <strong>\"Granger laws.\"<\/strong> In <strong>Munn v. Illinois<\/strong> (1877), the Supreme Court upheld state regulation of businesses \"clothed with a public interest,\" in that case grain elevators. But <strong>Wabash v. Illinois<\/strong> (1886) ruled that states could not regulate <strong>interstate<\/strong> commerce. Congress responded with two laws:<\/p>\n<ul><li>the <strong>Interstate Commerce Act<\/strong> (1887), which created the <strong>Interstate Commerce Commission<\/strong>, the first federal regulatory agency<\/li><li>the <strong>Sherman Antitrust Act<\/strong> (1890), which outlawed combinations \"in restraint of trade\"<\/li><\/ul>\n<p>Both were weak at first. In <strong>U.S. v. E.C. Knight<\/strong> (1895), the Court ruled that a sugar trust controlling 98% of refining was <em>manufacturing<\/em>, not <em>commerce<\/em>, so the Sherman Act did not reach it. Ironically, the Sherman Act was used more against <strong>labor unions<\/strong> than against trusts in the 1890s.<\/p>\n<h2>2. Labor<\/h2>\n<p>Factory work meant <strong>12-hour days<\/strong>, six-day weeks, child labor, dangerous machines, and no compensation for injuries. Workers organized in two main ways:<\/p>\n<ul><li>The <strong>Knights of Labor<\/strong> (led by <strong>Terence Powderly<\/strong>) welcomed nearly everyone: skilled and unskilled workers, women, and Black workers. It favored the <strong>eight-hour day<\/strong> and cooperatives. It collapsed after being blamed for the Haymarket bombing.<\/li><li>The <strong>American Federation of Labor (AFL, 1886)<\/strong>, led by <strong>Samuel Gompers<\/strong>, was a federation of <strong>skilled craft unions<\/strong>. It practiced <strong>\"bread-and-butter\" unionism<\/strong>: higher wages, shorter hours, better conditions. It used strikes and collective bargaining and avoided radical politics. The AFL survived and grew.<\/li><\/ul>\n<p>The great strikes are tested often. Know who, what, and the result:<\/p>\n<ul><li><strong>Great Railroad Strike (1877):<\/strong> the first nationwide strike, set off by wage cuts. President Hayes sent <strong>federal troops<\/strong>.<\/li><li><strong>Haymarket Square (Chicago, 1886):<\/strong> a bomb exploded at a rally for the eight-hour day. Anarchists were blamed, and a wave of <strong>anti-union, anti-immigrant<\/strong> feeling followed.<\/li><li><strong>Homestead Strike (1892):<\/strong> at Carnegie's steel works, manager <strong>Henry Clay Frick<\/strong> hired <strong>Pinkerton<\/strong> guards. A gun battle followed, the state militia broke the strike, and the steelworkers' union was crushed.<\/li><li><strong>Pullman Strike (1894):<\/strong> <strong>Eugene V. Debs's American Railway Union<\/strong> boycotted Pullman cars and paralyzed the railroads. President <strong>Cleveland<\/strong> sent troops, using a federal court <strong>injunction<\/strong>, on the grounds that the strike interfered with the mail. Debs went to jail and later became a <strong>Socialist<\/strong>.<\/li><\/ul>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Wage cuts and harsh conditions<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Major strikes (1877, 1886, 1892, 1894)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Government sides with employers: troops, injunctions; public links unions to radicalism<\/div><\/div>\n<h2>3. Immigrants and cities<\/h2>\n<p>After about 1880, the <strong>\"New Immigrants\"<\/strong> came mostly from <strong>southern and eastern Europe<\/strong>: Italians, Poles, Russian Jews, Greeks, and Slavs. Most were Catholic, Orthodox, or Jewish, and many were poor. They entered through <strong>Ellis Island<\/strong> (opened 1892). Asian immigrants on the West Coast later passed through <strong>Angel Island<\/strong> (1910).<\/p>\n<p><strong>Nativism<\/strong> (hostility to immigrants) grew. The <strong>Chinese Exclusion Act (1882)<\/strong> was the <strong>first federal law to bar immigrants by nationality<\/strong>. The anti-Catholic <strong>American Protective Association<\/strong> (1887) organized against the newcomers.<\/p>\n<p>Cities exploded. In 1870 about one American in four lived in an urban area. By 1920 it was more than half. Skyscrapers (architect <strong>Louis Sullivan<\/strong>: \"form follows function\"), electric streetcars, and the <strong>Brooklyn Bridge<\/strong> (1883) changed the landscape. The poor crowded into <strong>tenements<\/strong>. Photojournalist <strong>Jacob Riis<\/strong> exposed them in <em>How the Other Half Lives<\/em> (1890).<\/p>\n<p><strong>Political machines<\/strong> such as New York's <strong>Tammany Hall<\/strong>, run by <strong>\"Boss\" William Tweed<\/strong>, traded jobs, food, and favors for immigrant votes, and stole millions. Cartoonist <strong>Thomas Nast<\/strong> helped bring Tweed down.<\/p>\n<p>Reformers responded:<\/p>\n<ul><li><strong>Settlement houses<\/strong>, above all <strong>Jane Addams's Hull House<\/strong> (Chicago, 1889), offered classes, child care, and English lessons, and pushed for reform laws.<\/li><li>The <strong>Social Gospel<\/strong> movement (<strong>Walter Rauschenbusch<\/strong>, Washington Gladden) urged churches to fix social problems on earth.<\/li><li>The <strong>Woman's Christian Temperance Union<\/strong> (<strong>Frances Willard<\/strong>) fought alcohol and became the largest women's organization of the era.<\/li><\/ul>\n<h2>4. The West<\/h2>\n<p>The <strong>Homestead Act<\/strong> (1862) offered <strong>160 acres<\/strong> of public land to settlers who farmed it for five years. The <strong>Morrill Land-Grant Act<\/strong> (1862) funded state agricultural and technical colleges. Mining booms, <strong>cattle drives<\/strong> up trails such as the Chisholm Trail (many cowboys were Black or Mexican), and finally <strong>barbed wire<\/strong> (1874) closed the open range.<\/p>\n<p>The cost fell on Plains Indians. Hunters slaughtered the <strong>buffalo<\/strong>, the base of Plains life, and the herds nearly vanished by the late 1880s. The wars ran from the <strong>Sand Creek Massacre<\/strong> (1864) through these events:<\/p>\n<ul><li><strong>Little Bighorn (1876):<\/strong> Lakota and Cheyenne under <strong>Sitting Bull<\/strong> and <strong>Crazy Horse<\/strong> wiped out <strong>Custer's<\/strong> force.<\/li><li><strong>Chief Joseph<\/strong> and the Nez Perce attempted a long flight toward Canada and surrendered in 1877: \"I will fight no more forever.\"<\/li><li><strong>Wounded Knee (1890):<\/strong> the army massacred about 250 Lakota after alarm over the <strong>Ghost Dance<\/strong> religion. It marked the end of armed resistance.<\/li><\/ul>\n<p>Writer <strong>Helen Hunt Jackson<\/strong> condemned federal treatment of Native peoples in <em>A Century of Dishonor<\/em> (1881). But reformers' main answer was <strong>assimilation<\/strong>. The <strong>Dawes Severalty Act (1887)<\/strong> broke up reservations into <strong>individual allotments<\/strong> (160 acres per family head) and promised citizenship. \"Surplus\" land was sold to whites, and Native Americans lost about <strong>two-thirds<\/strong> of their land by 1934. Boarding schools such as <strong>Carlisle<\/strong> (founded by Richard Henry Pratt) forced Native children to give up their languages and cultures.<\/p>\n<p>In 1893 historian <strong>Frederick Jackson Turner<\/strong> argued in his <strong>\"frontier thesis\"<\/strong> that the frontier had shaped American democracy and individualism. The 1890 census had just declared the frontier <strong>closed<\/strong>.<\/p>\n<h2>5. Gilded Age politics<\/h2>\n<p>Politics was a close, intense game. Elections were narrow, <strong>voter turnout was very high<\/strong> (often about 80%), and the two parties differed less on policy than on loyalty, region, religion, and <strong>patronage<\/strong>. Debate focused on <strong>tariffs<\/strong>, <strong>currency<\/strong>, and <strong>civil service<\/strong>.<\/p>\n<p>In 1881 a disappointed office-seeker assassinated President <strong>James Garfield<\/strong>. This led to the <strong>Pendleton Civil Service Act (1883)<\/strong>, which filled some federal jobs by <strong>merit exams<\/strong> instead of the <strong>spoils system<\/strong>. In 1884, reform Republicans called <strong>\"Mugwumps\"<\/strong> bolted to Democrat <strong>Grover Cleveland<\/strong>, the only president to serve two <strong>non-consecutive<\/strong> terms (1885–89, 1893–97) until Donald Trump repeated the feat in 2025.<\/p>\n<p>Diplomacy was quiet. The <strong>Treaty of Washington<\/strong> (1871) sent the <strong>Alabama claims<\/strong> against Britain (over damage by Confederate raiders built in British shipyards) to arbitration, which awarded the U.S. $15.5 million. Secretary of State <strong>James G. Blaine<\/strong> hosted the first <strong>Pan-American Conference<\/strong> (1889) to expand U.S. influence and trade in Latin America.<\/p>\n<h2>Culture in brief<\/h2>\n<p>Writers turned to <strong>realism<\/strong>: <strong>Mark Twain<\/strong> (<em>Adventures of Huckleberry Finn<\/em>, 1884), William Dean Howells, and Henry James. Then came <strong>naturalism<\/strong>, which showed people at the mercy of their environment: <strong>Stephen Crane<\/strong> (<em>Maggie: A Girl of the Streets<\/em>), Jack London, and <strong>Theodore Dreiser<\/strong> (<em>Sister Carrie<\/em>). Painters <strong>Winslow Homer<\/strong> and <strong>Thomas Eakins<\/strong> worked in a realist style. <strong>Public high schools<\/strong>, land-grant colleges, research universities such as <strong>Johns Hopkins<\/strong> (1876), and women's colleges expanded quickly. The <strong>Chautauqua<\/strong> movement brought adult education to small towns. Mass leisure arrived: <strong>baseball<\/strong>, vaudeville, amusement parks, department stores, and mail-order catalogs from <strong>Montgomery Ward<\/strong> and <strong>Sears<\/strong>.<\/p>","mustknow":["<strong>Vertical integration<\/strong> (Carnegie, steel) vs. <strong>horizontal integration<\/strong> (Rockefeller, Standard Oil). A <strong>trust<\/strong> concentrates control of many companies.","<strong>Social Darwinism<\/strong> (Spencer, Sumner) justified inequality. The <strong>Gospel of Wealth<\/strong> (Carnegie) urged philanthropy. <strong>Henry George<\/strong> proposed a single tax. <strong>Bellamy<\/strong> wrote a socialist utopia.","<strong>Interstate Commerce Act<\/strong> (1887) regulated railroads. <strong>Sherman Antitrust Act<\/strong> (1890) banned trusts but was weakened by <strong>E.C. Knight<\/strong> (1895).","<strong>Knights of Labor<\/strong>: open to all, faded after Haymarket. <strong>AFL (Gompers)<\/strong>: skilled crafts, \"bread and butter.\"","Strikes: <strong>1877 railroad<\/strong>, <strong>Haymarket 1886<\/strong>, <strong>Homestead 1892<\/strong> (Carnegie/Frick), <strong>Pullman 1894<\/strong> (Debs; Cleveland sent troops via injunction).","<strong>New Immigrants<\/strong> came from southern and eastern Europe. <strong>Chinese Exclusion Act<\/strong> (1882) was the first nationality-based ban.","<strong>Jacob Riis<\/strong> (<em>How the Other Half Lives<\/em>), <strong>Jane Addams<\/strong> (Hull House), <strong>Tammany Hall / Boss Tweed<\/strong> (Nast cartoons).","<strong>Dawes Act<\/strong> (1887) broke up reservations into allotments. <strong>Wounded Knee<\/strong> (1890) ended the Indian wars. <strong>Little Bighorn<\/strong> (1876).","<strong>Turner's frontier thesis<\/strong> (1893): the frontier shaped American democracy, and it was now closed.","<strong>Pendleton Act<\/strong> (1883) came after Garfield's assassination and created merit-based civil service."],"timeline":[{"y":"1862","t":"Homestead Act; Morrill Land-Grant Act; Pacific Railway Act","key":false},{"y":"1869","t":"Transcontinental railroad completed at Promontory Point","key":true},{"y":"1871","t":"Treaty of Washington sends the Alabama claims to arbitration","key":false},{"y":"1873","t":"Twain and Warner publish <em>The Gilded Age<\/em>","key":false},{"y":"1876","t":"Battle of Little Bighorn; Bell's telephone","key":false},{"y":"1877","t":"Great Railroad Strike; Munn v. Illinois; Chief Joseph surrenders","key":true},{"y":"1879","t":"Edison's light bulb; Henry George's <em>Progress and Poverty<\/em>","key":false},{"y":"1881","t":"Garfield assassinated; <em>A Century of Dishonor<\/em>","key":false},{"y":"1882","t":"Chinese Exclusion Act; Standard Oil Trust organized","key":true},{"y":"1883","t":"Pendleton Civil Service Act; Brooklyn Bridge; standard time zones","key":true},{"y":"1886","t":"Haymarket bombing; AFL founded; Wabash v. Illinois","key":true},{"y":"1887","t":"Interstate Commerce Act; Dawes Severalty Act","key":true},{"y":"1889","t":"Hull House founded; Carnegie's \"Gospel of Wealth\"; Pan-American Conference","key":false},{"y":"1890","t":"Sherman Antitrust Act; Wounded Knee; <em>How the Other Half Lives<\/em>; census declares the frontier closed","key":true},{"y":"1892","t":"Homestead Strike; Ellis Island opens","key":false},{"y":"1893","t":"Turner's frontier thesis; Chicago World's Fair","key":false},{"y":"1894","t":"Pullman Strike","key":true},{"y":"1895","t":"U.S. v. E.C. Knight weakens the Sherman Act","key":false},{"y":"1901","t":"J.P. Morgan forms U.S. Steel","key":false}],"cards":[{"id":"u2c01","f":"Vertical integration","b":"Controlling every stage of production, from raw materials to the finished product. Carnegie Steel is the classic example."},{"id":"u2c02","f":"Horizontal integration","b":"Buying up or merging with competitors in the same industry. Rockefeller's Standard Oil is the classic example."},{"id":"u2c03","f":"Trust","b":"Stockholders of competing firms hand control to one board of trustees, creating a near-monopoly (Standard Oil, 1882)."},{"id":"u2c04","f":"Social Darwinism","b":"Herbert Spencer and William Graham Sumner applied \"survival of the fittest\" to society. Wealth was proof of fitness, so government should not help the poor."},{"id":"u2c05","f":"Gospel of Wealth (1889)","b":"Carnegie's essay: the rich are trustees of their wealth and should give it away for public good. \"The man who dies thus rich dies disgraced.\""},{"id":"u2c06","f":"Henry George, <em>Progress and Poverty<\/em> (1879)","b":"Argued that poverty grows alongside progress. Proposed a \"single tax\" on land values."},{"id":"u2c07","f":"Edward Bellamy, <em>Looking Backward<\/em> (1888)","b":"Utopian novel of a cooperative socialist America in 2000. Inspired Nationalist Clubs."},{"id":"u2c08","f":"Thorstein Veblen","b":"Economist who coined \"conspicuous consumption\" (<em>The Theory of the Leisure Class<\/em>, 1899)."},{"id":"u2c09","f":"Munn v. Illinois (1877)","b":"States may regulate private businesses that serve the public interest (grain elevators). A Granger victory."},{"id":"u2c10","f":"Wabash v. Illinois (1886)","b":"States cannot regulate interstate railroad rates. This led to the Interstate Commerce Act."},{"id":"u2c11","f":"Interstate Commerce Act (1887)","b":"Required \"reasonable and just\" railroad rates. Created the ICC, the first federal regulatory agency."},{"id":"u2c12","f":"Sherman Antitrust Act (1890)","b":"Banned combinations \"in restraint of trade.\" Weakened by U.S. v. E.C. Knight (1895) and used against unions."},{"id":"u2c13","f":"Knights of Labor","b":"Terence Powderly's inclusive union (unskilled, women, Black workers). Declined after Haymarket (1886)."},{"id":"u2c14","f":"American Federation of Labor (1886)","b":"Samuel Gompers. Skilled craft unions focused on \"bread and butter\": wages, hours, conditions."},{"id":"u2c15","f":"Haymarket Riot (1886)","b":"A bomb exploded at a Chicago eight-hour-day rally. Anarchists were blamed, and anti-union backlash followed."},{"id":"u2c16","f":"Homestead Strike (1892)","b":"Carnegie Steel lockout. Frick hired Pinkertons, militia crushed the union."},{"id":"u2c17","f":"Pullman Strike (1894)","b":"Debs's American Railway Union boycott. Cleveland sent federal troops using a court injunction. Debs jailed."},{"id":"u2c18","f":"New Immigrants","b":"Post-1880 immigrants from southern and eastern Europe (Italians, Poles, Russian Jews). Mostly Catholic, Jewish, or Orthodox."},{"id":"u2c19","f":"Chinese Exclusion Act (1882)","b":"First federal law barring immigration by nationality. Renewed and made permanent until 1943."},{"id":"u2c20","f":"Political machine","b":"Urban party organization (Tammany Hall, Boss Tweed) trading jobs and services for votes. Riddled with graft."},{"id":"u2c21","f":"Jacob Riis","b":"Photojournalist whose <em>How the Other Half Lives<\/em> (1890) exposed New York tenement life."},{"id":"u2c22","f":"Settlement hou
