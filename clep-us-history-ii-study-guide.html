<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEP US History II</title>
<meta name="description" content="Self-paced study guide for the CLEP History of the United States II exam: lessons, quizzes, flashcards, practice exams.">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --surface2:#f2f0ea; --ink:#1d232a; --muted:#5d6670; --line:#dedad0;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --good:#24774a; --good-soft:#e2f2e8; --bad:#b03a2e; --bad-soft:#f8e3e0; --warn:#9a6a00; --warn-soft:#fbf0d4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
  --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
  --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
  --shadow:none; color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
    --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
    --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
    --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{max-width:860px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;text-decoration:none;color:var(--ink);font-size:1.02rem;letter-spacing:.01em}
.brand small{font-weight:500;color:var(--muted)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
nav.tabs{max-width:860px;margin:0 auto;padding:6px 12px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:999px;font-size:.9rem}
nav.tabs a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;line-height:1.25;margin:.2em 0 .5em}
h2{font-size:1.25rem;margin:1.6em 0 .5em}
h3{font-size:1.05rem;margin:1.3em 0 .4em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>span{background:var(--good)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:.92rem}
/* lesson */
.lesson{font-family:var(--serif);font-size:1.08rem;line-height:1.7}
.lesson h2{font-family:var(--sans)}
.lesson h3{font-family:var(--sans)}
.lesson p{margin:.7em 0}
.lesson strong{font-weight:700}
.lesson ul{padding-left:1.2em}
.cec{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin:14px 0;font-family:var(--sans);font-size:.88rem}
.cec div.b{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.cec div.b b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cec .ar{align-self:center;color:var(--muted)}
@media (max-width:600px){.cec{grid-template-columns:1fr}.cec .ar{transform:rotate(90deg);justify-self:center}}
.mustknow{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 16px}
.mustknow ol{margin:.3em 0;padding-left:1.3em}
.mustknow li{margin:.35em 0}
/* timeline */
.tl{position:relative;margin:10px 0 10px 6px;padding-left:22px;border-left:2px solid var(--line)}
.tl .ev{position:relative;margin:0 0 12px}
.tl .ev::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl .ev.key::before{background:var(--accent);border-color:var(--accent)}
.tl .yr{font-weight:700;font-variant-numeric:tabular-nums;margin-right:8px}
.tl .ev.key .yr{color:var(--accent)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stem{font-size:1.07rem;font-weight:500;margin:6px 0 12px}
.stim{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-family:var(--serif);font-size:1rem}
.stim table{font-family:var(--sans);font-size:.88rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;align-items:flex-start}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt .ex{display:block;font-size:.88rem;color:var(--muted);margin-top:4px}
.opt.right .ex,.opt.wrong .ex{color:var(--ink)}
.opt[disabled]{cursor:default}
.kbd{font:600 .75rem var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface2)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;margin-top:10px}
.navgrid button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:4px 0;font:inherit;font-size:.75rem;cursor:pointer}
.navgrid button.ans{background:var(--accent-soft);color:var(--ink)}
.navgrid button.cur{outline:2px solid var(--accent)}
.navgrid button.flag{border-color:var(--warn);border-width:2px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.timer.low{color:var(--bad)}
/* flashcards */
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;padding:28px 20px;cursor:pointer;user-select:none}
.fc .back{font-size:1.02rem;font-family:var(--serif);line-height:1.6}
.boxes{display:flex;gap:6px;align-items:flex-end;height:70px;margin:8px 0}
.boxes div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;position:relative;opacity:.85}
.boxlbl{display:flex;gap:6px}.boxlbl span{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
/* readiness */
.meter{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dial{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;flex:none}
.dial span{background:var(--surface);width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
.dial small{font-size:.65rem;color:var(--muted);font-weight:600;text-transform:uppercase}
/* cheat sheet */
.cheat{font-size:.82rem;line-height:1.35;columns:2 300px;column-gap:20px}
.cheat section{break-inside:avoid;margin:0 0 12px}
.cheat h3{margin:.2em 0 .3em;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.cheat table{font-size:.78rem}
.cheat td,.cheat th{padding:2px 4px}
.cheat ul{margin:0;padding-left:1em}
.cheat.memo .m{filter:blur(5px);cursor:pointer;transition:filter .15s}
.cheat.memo .m.show{filter:none}
.kbdhint{font-size:.8rem;color:var(--muted);margin-top:10px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.plan td:first-child{white-space:nowrap}
.tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media print{
  header.top,.noprint,.banner{display:none!important}
  body{background:#fff;color:#000;font-size:10pt}
  main{max-width:none;padding:0}
  .card{border:none;box-shadow:none;padding:0;margin:0}
  .cheat{columns:3;column-gap:10px;font-size:6.2pt;line-height:1.15}
  .cheat h3{font-size:6.8pt;color:#000;margin:0 0 1px;break-after:avoid}
  .cheat table{font-size:6pt}
  .cheat td,.cheat th{padding:0 2px;border-bottom:0.5px solid #ccc}
  .cheat section{margin:0 0 4px;break-inside:auto}
  .cheat ul{padding-left:.9em}
  .cheat.memo .m{filter:none}
  .printhead{font-size:9pt;margin:0 0 4px}
  @page{size:letter;margin:.35in}
}
</style>
</head>

class=\"m\"><i>How the Other Half Lives<\/i><\/td><\/tr>\n<tr><td>H.H. Jackson<\/td><td class=\"m\"><i>A Century of Dishonor<\/i><\/td><\/tr>\n<tr><td>F.J. Turner<\/td><td class=\"m\">Frontier thesis 1893<\/td><\/tr>\n<tr><td>Mahan<\/td><td class=\"m\">Sea power → navy, colonies<\/td><\/tr>\n<tr><td>B.T. Washington<\/td><td class=\"m\">Atlanta Compromise; Tuskegee<\/td><\/tr>\n<tr><td>Du Bois<\/td><td class=\"m\"><i>Souls of Black Folk<\/i>; Talented Tenth<\/td><\/tr>\n<tr><td>Ida B. Wells<\/td><td class=\"m\">Anti-lynching<\/td><\/tr>\n<tr><td>Steffens / Tarbell / Sinclair<\/td><td class=\"m\">Cities / Std. Oil / <i>Jungle<\/i><\/td><\/tr>\n<tr><td>James / Dewey<\/td><td class=\"m\">Pragmatism; learn by doing<\/td><\/tr>\n<tr><td>Hughes / Hurston / Locke<\/td><td class=\"m\">Harlem Renaissance<\/td><\/tr>\n<tr><td>Hemingway / Fitzgerald / Lewis<\/td><td class=\"m\">Lost Generation; <i>Gatsby<\/i>; <i>Babbitt<\/i><\/td><\/tr>\n<tr><td>Steinbeck / Lange<\/td><td class=\"m\"><i>Grapes of Wrath<\/i> / \"Migrant Mother\"<\/td><\/tr>\n<tr><td>Keynes<\/td><td class=\"m\">Deficit spending in slumps<\/td><\/tr>\n<tr><td>Riesman / Whyte / Galbraith<\/td><td class=\"m\">1950s conformity critics<\/td><\/tr>\n<tr><td>Kerouac / Ginsberg<\/td><td class=\"m\">Beats<\/td><\/tr>\n<tr><td>Carson<\/td><td class=\"m\"><i>Silent Spring<\/i> (DDT)<\/td><\/tr>\n<tr><td>Friedan<\/td><td class=\"m\"><i>Feminine Mystique<\/i>; NOW<\/td><\/tr>\n<tr><td>Harrington<\/td><td class=\"m\"><i>The Other America<\/i><\/td><\/tr>\n<tr><td>Nader<\/td><td class=\"m\"><i>Unsafe at Any Speed<\/i><\/td><\/tr>\n<tr><td>Schlafly<\/td><td class=\"m\">Stopped ERA<\/td><\/tr>\n<tr><td>Fukuyama / Huntington<\/td><td class=\"m\">End of history / clash of civs<\/td><\/tr>\n<\/tbody><\/table><\/section>\n\n<section><h3>Labor &amp; the economy<\/h3>\n<ul>\n<li><b>Knights<\/b> (all workers) vs. <b>AFL<\/b> (skilled, Gompers) vs. <b>CIO<\/b> (industrial, 1930s) vs. <b>IWW<\/b> (radical)<\/li>\n<li>Pro-labor: <span class=\"m\">Clayton 1914, Wagner 1935, FLSA 1938<\/span>. Anti: <span class=\"m\">Taft-Hartley 1947, PATCO 1981<\/span><\/li>\n<li>Panics/busts: <span class=\"m\">1873, 1893, 1929, 1973 oil, 2008<\/span><\/li>\n<li>Free silver = <span class=\"m\">inflation to help debtor farmers<\/span><\/li>\n<li>Stagflation = <span class=\"m\">inflation + unemployment (1970s)<\/span><\/li>\n<\/ul><\/section>\n\n<section><h3>Test-day tactics<\/h3>\n<ul>\n<li>About 120 questions in 90 min = <b>45 s each<\/b>. Flag and move on.<\/li>\n<li>There's no guessing penalty, so <b>never leave a question blank<\/b>.<\/li>\n<li>Put a date on every option. Wrong answers are often from the wrong era.<\/li>\n<li>Watch for <b>EXCEPT<\/b> and <b>FIRST<\/b>. Re-read the stem before you pick.<\/li>\n<li>About 70% of questions are after 1914. Know the 1945–1975 period cold.<\/li>\n<\/ul><\/section>\n","questions":[{"id":"u1q01","u":1,"th":"pol","d":"e","pool":"A","s":"Which constitutional amendment established that all persons born in the United States are citizens and guaranteed them \"equal protection of the laws\"?","st":"","o":["The Sixteenth Amendment","The Thirteenth Amendment","The Fifteenth Amendment","The Fourteenth Amendment","The Nineteenth Amendment"],"e":["The Sixteenth Amendment (1913) authorized a federal income tax.","The Thirteenth Amendment (1865) abolished slavery but did not define citizenship.","The Fifteenth Amendment (1870) dealt with voting rights, not citizenship.","Ratified in 1868, the Fourteenth Amendment defined national citizenship and barred states from denying due process or equal protection.","The Nineteenth Amendment (1920) guaranteed women's suffrage."],"a":3},{"id":"u1q02","u":1,"th":"pol","d":"e","pool":"quiz","s":"The Fifteenth Amendment (1870) prohibited states from denying the right to vote on the basis of","st":"","o":["failure to pay a poll tax","race, color, or previous condition of servitude","age, for citizens 18 or older","literacy","sex"],"e":["Poll taxes in federal elections were banned only by the Twenty-fourth Amendment (1964).","This is the amendment's exact wording. It aimed to protect Black men's suffrage.","The voting age was lowered to 18 by the Twenty-sixth Amendment (1971).","The Fifteenth Amendment said nothing about literacy, which is why southern states could later use literacy tests.","Sex was deliberately left out, which angered woman suffrage leaders. Women won the vote only with the Nineteenth Amendment in 1920."],"a":1},{"id":"u1q03","u":1,"th":"pol","d":"m","pool":"B","s":"Congress passed the Reconstruction Acts of 1867 mainly in response to which of the following?","st":"","o":["A wave of Black migration to Kansas","A Supreme Court ruling that the Thirteenth Amendment was unconstitutional","Southern states' passage of Black Codes and their refusal to ratify the Fourteenth Amendment","The disputed presidential election of 1876","The assassination of Abraham Lincoln"],"e":["The Exoduster migration happened in 1879, after Reconstruction ended.","No such ruling occurred. The Thirteenth Amendment was never struck down.","The Black Codes, the 1866 riots, and southern rejection of the Fourteenth Amendment convinced Congress to impose military reconstruction.","That election came almost a decade later and led to the end of Reconstruction, not its start.","Lincoln's death in 1865 brought Johnson to power, but the 1867 acts responded to what southern governments did under Johnson's lenient plan."],"a":2},{"id":"u1q04","u":1,"th":"pol","d":"m","pool":"quiz","s":"The House of Representatives impeached President Andrew Johnson in 1868 chiefly because he had","st":"","o":["removed Secretary of War Edwin Stanton in apparent violation of the Tenure of Office Act","refused to enforce the Fifteenth Amendment","accepted bribes in the Crédit Mobilier scandal","ordered federal troops out of the South","purchased Alaska without congressional approval"],"e":["The formal charges centered on Stanton's dismissal, though the real conflict was over Johnson's obstruction of Congressional Reconstruction.","The Fifteenth Amendment was not ratified until 1870, after Johnson left office.","Crédit Mobilier involved congressmen and Grant-era officials, not Johnson's impeachment.","Troops were withdrawn in 1877 under Hayes, not by Johnson.","The Senate approved the Alaska treaty, and it was not a ground for impeachment."],"a":0},{"id":"u1q05","u":1,"th":"pol","d":"m","pool":"B","s":"Which of the following was a direct result of the Compromise of 1877?","st":"","o":["The Freedmen's Bureau was created.","Southern states were divided into five military districts.","The Fifteenth Amendment was ratified.","Federal troops were withdrawn from the remaining Reconstruction governments in the South.","Samuel Tilden became president."],"e":["The Freedmen's Bureau was created in 1865.","Military districts were created by the Reconstruction Acts of 1867, the start of Radical Reconstruction rather than its end.","The Fifteenth Amendment was ratified in 1870.","In return for Democrats accepting Hayes's election, the last federal troops left southern statehouses, ending Reconstruction.","Tilden won the popular vote but lost the presidency to Hayes under the compromise."],"a":3},{"id":"u1q06","u":1,"th":"pol","d":"h","pool":"B","s":"Which of the following occurred FIRST?","st":"","o":["Hiram Revels took his seat in the U.S. Senate.","The Fifteenth Amendment was ratified.","Andrew Johnson was impeached by the House.","Rutherford B. Hayes became president.","Southern legislatures enacted Black Codes."],"e":["Revels was seated in 1870.","The Fifteenth Amendment was ratified in 1870.","Johnson's impeachment came in 1868.","Hayes took office in 1877.","The Black Codes were passed in 1865–1866 under Presidential Reconstruction, before every other event listed."],"a":4},{"id":"u1q07","u":1,"th":"soc","d":"e","pool":"A","s":"Immediately after emancipation, which of the following was a top priority for many freedpeople?","st":"","o":["Reuniting families that had been separated by slavery","Moving to the Great Plains as cattle ranchers","Returning to work for their former owners for wages under the same conditions as slavery","Joining the Democratic Party","Emigrating to Africa"],"e":["Freedpeople traveled widely and placed newspaper ads searching for relatives sold away. Family reunification was a defining early goal.","A few moved West, but ranching was not a widespread priority.","Freedpeople resisted gang labor and conditions resembling slavery. This is why sharecropping emerged as a compromise.","Freedmen overwhelmingly supported the Republican Party, the party of Lincoln and Reconstruction.","Some emigration schemes existed, but very few freedpeople chose to leave."],"a":0},{"id":"u1q08","u":1,"th":"soc","d":"m","pool":"quiz","s":"The most lasting achievement of the Freedmen's Bureau was in the field of","st":"","o":["voting rights enforcement","railroad construction","immigration control","education","land redistribution"],"e":["Voting rights were enforced, briefly, by the army and the Enforcement Acts, not mainly by the Bureau.","The Bureau did not build railroads.","Immigration had nothing to do with the Bureau's mission.","With northern aid societies, the Bureau set up thousands of schools and helped found Black colleges such as Howard and Fisk.","Most confiscated land was returned to former owners after Johnson's pardons, so redistribution largely failed."],"a":3},{"id":"u1q09","u":1,"th":"soc","d":"m","pool":"B","s":"The Black Codes passed by southern states in 1865–1866 were designed primarily to","st":"","o":["grant freedpeople limited voting rights","implement the provisions of the Fourteenth Amendment","restrict the freedom of formerly enslaved people and keep them as a controlled labor force","provide public schools for Black children","redistribute plantation land to freedpeople"],"e":["The Black Codes did not grant suffrage. Southern governments under Johnson refused Black voting.","The codes contradicted equal protection. Their passage helped prompt the amendment.","Vagrancy laws, mandatory labor contracts, and limits on land ownership kept freedpeople working on plantations under white control.","The first southern public school systems came from Reconstruction governments, not the Black Codes.","The codes protected white landowners' interests rather than redistributing land."],"a":2},{"id":"u1q10","u":1,"th":"pol","d":"e","pool":"quiz","s":"Thaddeus Stevens and Charles Sumner are best known as leaders of which group?","st":"","o":["Populists who demanded free silver","Redeemer Democrats who ended Reconstruction","Radical Republicans in Congress who pushed for Black civil rights and strict terms for the South","Liberal Republicans who opposed Grant in 1872","Copperheads who opposed the Civil War"],"e":["Populism arose in the 1890s, after both men had died.","Redeemers were southern Democrats, opponents of the Radicals.","Stevens (House) and Sumner (Senate) led the Radicals who took control of Reconstruction in 1867.","The Liberal Republicans of 1872 (Horace Greeley) wanted to end Reconstruction. Sumner did briefly side with them in 1872, but neither man is known as their leader.","Copperheads were antiwar Democrats. Stevens and Sumner were firm Unionists."],"a":2},{"id":"u1q11","u":1,"th":"pol","d":"e","pool":"A","s":"The Supreme Court's decision in Plessy v. Ferguson (1896) is significant because it","st":"","o":["established the right of the Court to review state laws","struck down poll taxes in federal elections","outlawed segregation in public schools","upheld state-mandated racial segregation under the \"separate but equal\" doctrine","declared that Black Americans could not be citizens"],"e":["Judicial review dates to Marbury v. Madison (1803).","Poll taxes in federal elections ended with the Twenty-fourth Amendment (1964).","Segregated schools were struck down in Brown v. Board of Education (1954), which overturned Plessy's reasoning.","Plessy approved segregated railroad cars, giving constitutional cover to Jim Crow for nearly 60 years.","That was Dred Scott v. Sandford (1857), which the Fourteenth Amendment overturned."],"a":3},{"id":"u1q12","u":1,"th":"pol","d":"h","pool":"A","s":"The statement above comes from","st":"<p>\"Our Constitution is color-blind, and neither knows nor tolerates classes among citizens.\"<\/p>","o":["the majority opinion in Plessy v. Ferguson","Justice John Marshall Harlan's dissent in Plessy v. Ferguson","Booker T. Washington's Atlanta Compromise speech","the text of the Fifteenth Amendment","the majority opinion in the Civil Rights Cases"],"e":["The majority upheld segregation, the opposite of this statement.","Harlan was the lone dissenter in Plessy. He argued that segregation violated the Fourteenth Amendment.","Washington's speech accepted social segregation for the time being. It did not attack it on constitutional grounds.","The Fifteenth Amendment concerns voting and does not contain this language.","The majority in 1883 struck down the Civil Rights Act of 1875. (Harlan dissented there too, but this line is from Plessy.)"],"a":1},{"id":"u1q13","u":1,"th":"soc","d":"m","pool":"A","s":"In his 1895 Atlanta Compromise speech, Booker T. Washington urged Black Americans to","st":"","o":["demand immediate social and political equality through protest","support the Populist Party's alliance of Black and white farmers","form a separate political party to contest southern elections","emigrate to Africa to escape discrimination","focus on vocational training and economic progress while temporarily accepting segregation"],"e":["This was Du Bois's position, not Washington's.","Washington did not tie himself to the Populists.","Washington avoided direct political confrontation.","Back-to-Africa ideas are associated with Marcus Garvey in the 1920s.","Washington argued that economic self-help would earn respect and rights over time. Critics saw this as accommodation to Jim Crow."],"a":4},{"id":"u1q14","u":1,"th":"cul","d":"m","pool":"quiz","s":"W.E.B. Du Bois criticized Booker T. Washington chiefly because Du Bois believed that African Americans should","st":"","o":["concentrate on industrial and agricultural training","separate completely from white society and return to Africa","avoid politics until they had achieved economic independence","move to the West to claim homesteads","demand full civil and political rights immediately and develop a college-educated \"Talented Tenth\""],"e":["That was Washington's program at Tuskegee.","Separatism is associated with Marcus Garvey, whom Du Bois opposed.","This summarizes Washington's gradualism, which Du Bois opposed.","Du Bois did not promote western migration.","In <em>The Souls of Black Folk<\/em> (1903), Du Bois rejected accommodation and called for higher education and immediate equal rights."],"a":4},{"id":"u1q15","u":1,"th":"soc","d":"e","pool":"quiz","s":"Ida B. Wells is best known for her","st":"","o":["service as the first African American U.S. senator","leadership of the Exoduster migration to Kansas","journalism exposing and campaigning against lynching","novel <em>Uncle Tom's Cabin<\/em>","founding of Tuskegee Institute"],"e":["That was Hiram Revels (1870).","The Exodusters are associated with Benjamin \"Pap\" Singleton.","Wells documented lynchings in works such as <em>Southern Horrors<\/em> (1892) and fought for federal anti-lynching action.","Harriet Beecher Stowe wrote <em>Uncle Tom's Cabin<\/em> (1852).","Tuskegee was founded by Booker T. Washington."],"a":2},{"id":"u1q16","u":1,"th":"soc","d":"m","pool":"B","s":"Southern \"grandfather clauses\" of the 1890s were designed to","st":"","o":["guarantee voting rights to elderly freedmen","give land to the descendants of formerly enslaved people","let grandsons of Confederate veterans skip military service","require voters to have lived in the state for three generations","exempt white men from literacy tests and poll taxes if their ancestors could vote before 1867"],"e":["They did the opposite. They shielded white voters, not freedmen.","No such land policy existed.","The clauses concerned voting, not military service.","The clauses exempted voters from tests. They did not set residency requirements.","Since Black men could not vote before 1867, these clauses disfranchised Black voters while protecting poor whites' votes."],"a":4},{"id":"u1q17","u":1,"th":"eco","d":"m","pool":"quiz","s":"Under the crop-lien system that spread across the postwar South,","st":"","o":["railroads guaranteed minimum prices for cotton","the federal government lent farmers money at low interest","landowners paid farm workers fixed daily wages","farmers pooled crops in cooperatives to bypass middlemen","merchants supplied seed and goods on credit in exchange for a claim on the farmer's future crop"],"e":["Railroads set shipping rates. They did not guarantee crop prices.","Federal farm credit programs came much later (Federal Farm Loan Act 1916, New Deal).","Wage labor was not the crop-lien arrangement. Credit secured by the crop was.","Cooperatives were a Farmers' Alliance remedy against the crop-lien system, not the system itself.","High interest and falling cotton prices meant many farmers never got out of debt."],"a":4},{"id":"u1q18","u":1,"th":"eco","d":"m","pool":"diag","s":"Henry Grady's idea of a \"New South\" called for the South to","st":"","o":["industrialize and diversify its economy by attracting northern investment","secede again from the Union","rely entirely on cotton exports to Britain","redistribute land to freedpeople","restore a plantation economy based on slave labor"],"e":["Grady, an Atlanta editor, promoted textile mills, railroads, and industry alongside reconciliation with the North.","Grady preached sectional reconciliation, not secession.","Dependence on cotton was the problem the New South idea was meant to fix.","Grady did not advocate land redistribution.","Slavery was abolished, and Grady looked forward rather than back."],"a":0},{"id":"u1q19","u":1,"th":"eco","d":"m","pool":"A","s":"The arrangement described is best identified as","st":"<p>The following terms are typical of a contract signed in Georgia in 1867: The laborer agrees to cultivate the land and furnish his own labor. The owner furnishes land, a mule, tools, and seed. At harvest the owner receives one-half of the crop, and from the laborer's half are deducted all advances of food and supplies.<\/p>","o":["the encomienda system","wage labor","indentured servitude","sharecropping","homesteading"],"e":["Encomienda was a Spanish colonial labor system.","Wage laborers receive fixed cash pay, not a share of the harvest.","Indentured servants worked a fixed term to repay passage. They were not paid a crop share.","The laborer works the owner's land and supplies and is paid with a share of the crop. That is the defining feature of sharecropping.","Homesteaders got title to public land by living on and improving it."],"a":3},{"id":"u1q20","u":1,"th":"pol","d":"h","pool":"quiz","s":"Supreme Court decisions such as the Slaughterhouse Cases (1873) and United States v. Cruikshank (1876) affected Reconstruction by","st":"","o":["guaranteeing land to freedpeople as compensation for slavery","expanding federal power to prosecute private acts of violence","declaring the Reconstruction Acts unconstitutional","requiring the federal government to enforce desegregation of public schools","narrowing the protections of the Fourteenth Amendment and leaving the protection of Black citizens largely to the states"],"e":["No Supreme Court decision required land grants.","Cruikshank did the reverse. It overturned federal convictions from the Colfax Massacre.","Neither case struck down the Reconstruction Acts.","Court-ordered school desegregation began with Brown (1954).","These rulings read federal protections narrowly. In practice, that let southern states and private violence undermine Black rights."],"a":4},{"id":"u1q21","u":1,"th":"pol","d":"e","pool":"B","s":"The Crédit Mobilier and Whiskey Ring scandals are associated with the presidency of","st":"","o":["Ulysses S. Grant","Abraham Lincoln","Grover Cleveland","Rutherford B. Hayes","Andrew Johnson"],"e":["Both scandals tarnished Grant's administration (1869–1877) and weakened northern support for Republican Reconstruction.","Lincoln died in 1865. These scandals came to light in the 1870s.","Cleveland was known for honesty and vetoes in the 1880s–1890s.","Hayes came to office in 1877 promising reform after the Grant-era scandals.","Johnson's presidency was defined by his clashes with Congress, not these scandals."],"a":0},{"id":"u1q22","u":1,"th":"soc","d":"m","pool":"quiz","s":"The Enforcement Acts and the Ku Klux Klan Act of 1870–1871 were passed in order to","st":"","o":["prohibit Black men from serving on juries","end military occupation of the South","grant amnesty to former Confederate officers","establish segregated public facilities","protect Black voters and officeholders from terrorist violence"],"e":["The acts aimed to protect, not restrict, Black civil rights.","They expanded federal enforcement rather than ending it.","Amnesty came through presidential pardons and the Amnesty Act of 1872, not these acts.","Segregation laws came from southern states later, not from these federal acts.","These laws let federal courts and troops prosecute the Klan, which briefly broke the first Klan."],"a":4},{"id":"u1q23","u":1,"th":"soc","d":"e","pool":"quiz","s":"Hiram Revels is historically significant as the","st":"","o":["founder of the NAACP","Supreme Court justice who dissented in Plessy","head of the Freedmen's Bureau","first African American to serve in the U.S. Senate","author of <em>Up From Slavery<\/em>"],"e":["The NAACP was founded in 1909 by a multiracial group including Du Bois.","The Plessy dissenter was John Marshall Harlan.","General Oliver O. Howard headed the Freedmen's Bureau.","Revels was elected from Mississippi and seated in 1870.","<em>Up From Slavery<\/em> is Booker T. Washington's autobiography."],"a":3},{"id":"u1q24","u":1,"th":"pol","d":"m","pool":"diag","s":"Lincoln's Ten Percent Plan differed from the Wade-Davis Bill in that Lincoln's plan","st":"","o":["required Black male suffrage, while Wade-Davis did not","placed the South under military rule, while Wade-Davis did not","was passed by Congress over a presidential veto","allowed a state to be restored once 10 percent of its 1860 voters took a loyalty oath, while Wade-Davis required a majority","confiscated all plantations, while Wade-Davis protected property"],"e":["Neither plan required Black suffrage. That came with the 1867 Reconstruction Acts.","Military districts came in 1867 under Congress, not Lincoln's plan.","The Ten Percent Plan was an executive proclamation, not a law passed over a veto.","Lincoln favored a quick, lenient restoration. Congress's Wade-Davis Bill demanded 50 percent and an ironclad oath, and Lincoln pocket-vetoed it.","Lincoln's plan offered pardons and protected most property except enslaved people."],"a":3},{"id":"u1q25","u":1,"th":"dip","d":"e","pool":"quiz","s":"In 1867 the United States purchased Alaska from","st":"","o":["France","Great Britain","Russia","Mexico","Spain"],"e":["France sold Louisiana in 1803.","Britain controlled Canada, not Alaska.","Secretary of State William Seward bought Alaska from Russia for $7.2 million, which critics mocked as \"Seward's Folly.\"","Mexico ceded the Southwest in 1848. It never held Alaska.","Spain gave up Florida (1819) and later Puerto Rico and the Philippines (1898), not Alaska."],"a":2},{"id":"u1q26","u":1,"th":"soc","d":"h","pool":"B","s":"The \"Exodusters\" of 1879 were","st":"","o":["Chinese laborers expelled from California","Mormon settlers who moved from Illinois to Utah","white farmers who abandoned the Dust Bowl for California","African Americans who left the South for Kansas to escape violence and economic oppression after Reconstruction","former Confederates who emigrated to Brazil"],"e":["Chinese exclusion is a separate story (1882 act). They were not called Exodusters.","The Mormon migration took place in the 1840s.","That describes the \"Okies\" of the 1930s.","Thousands left after the troops were withdrawn, hoping for land and safety on the plains.","Some Confederates did go to Brazil (the Confederados), but they were not called Exodusters."],"a":3},{"id":"u1q27","u":1,"th":"cul","d":"e","pool":"B","s":"Booker T. Washington founded which institution in 1881 to provide industrial and agricultural education?","st":"","o":["Harvard University","The NAACP","Tuskegee Institute","Hull House","Howard University"],"e":["Harvard is a colonial-era university (1636). Du Bois earned his PhD there.","The NAACP is a civil rights organization founded in 1909.","Washington built Tuskegee in Alabama into a model of vocational education.","Hull House was Jane Addams's Chicago settlement house (1889).","Howard was founded in 1867 with Freedmen's Bureau support and offered a liberal arts curriculum."],"a":2},{"id":"u1q28","u":1,"th":"cul","d":"h","pool":"B","s":"The \"Lost Cause\" interpretation of the Civil War, widely promoted in the South after Reconstruction, held that","st":"","o":["the South should industrialize to compete with the North","the war had been lost because of Black soldiers' desertion","Reconstruction was a success that should be extended","the Confederacy had fought nobly for states' rights and honor rather than to preserve slavery","the North had been right to abolish slavery"],"e":["That is the New South argument, a separate idea.","That was not the Lost Cause argument. Black Union soldiers fought with distinction.","Lost Cause writers portrayed Reconstruction as a disastrous era of corruption.","This myth shaped monuments, textbooks, and white southern memory, and it downplayed slavery's central role.","Lost Cause advocates minimized slavery rather than celebrating abolition."],"a":3},{"id":"u1q29","u":1,"th":"pol","d":"m","pool":"A","s":"The southern Democrats who regained control of state governments in the 1870s and ended Reconstruction called themselves","st":"","o":["Copperheads","Mugwumps","Know-Nothings","Half-Breeds","Redeemers"],"e":["Copperheads were northern Democrats who opposed the Civil War.","Mugwumps were reform-minded Republicans who backed Democrat Grover Cleveland in 1884.","The Know-Nothings were a nativist party of the 1850s.","Half-Breeds were a moderate Republican faction of the 1870s–80s that favored civil service reform.","They claimed to \"redeem\" the South from Republican rule, then cut spending on schools and began rolling back Black rights."],"a":4},{"id":"u1q30","u":1,"th":"soc","d":"e","pool":"B","s":"During Reconstruction, white southerners who supported the Republican Party were called","st":"","o":["doughfaces","carpetbaggers","scalawags","Exodusters","Redeemers"],"e":["Doughfaces were pre–Civil War northerners with southern sympathies.","Carpetbaggers were northerners who moved South, not native southerners.","Opponents used the insult \"scalawag\" for white southerners who cooperated with Republican governments.","Exodusters were Black migrants to Kansas.","Redeemers were the Democrats who overthrew Republican rule."],"a":2},{"id":"u1q31","u":1,"th":"pol","d":"m","pool":"quiz","s":"In 1867 a former Confederate state that wanted its representatives seated in Congress first had to write a new constitution guaranteeing Black male suffrage and ratify the Fourteenth Amendment. This requirement came from","st":"","o":["the Compromise of 1877","Lincoln's Ten Percent Plan","the Supreme Court's decision in Plessy v. Ferguson","the Reconstruction Acts passed by Congress","Andrew Johnson's amnesty proclamation"],"e":["The Compromise ended Reconstruction. It set no readmission conditions.","Lincoln's plan required only a 10 percent loyalty oath and made no mention of Black suffrage.","Plessy (1896) concerned segregation, not readmission.","The 1867 Reconstruction Acts set these conditions and placed the South under military supervision until they were met.","Johnson's plan readmitted states with few conditions."],"a":3},{"id":"u1q32","u":1,"th":"pol","d":"h","pool":"A","s":"In the Civil Rights Cases (1883), the Supreme Court ruled that","st":"","o":["Congress could ban racial discrimination in hotels under its commerce power","the Fourteenth Amendment barred discrimination by states but not by private individuals and businesses","the Fifteenth Amendment guaranteed voting rights to women","Black Codes were constitutional","segregated public schools were unconstitutional"],"e":["That reasoning was upheld only in 1964 (Heart of Atlanta Motel v. U.S.).","This \"state action\" reasoning struck down the Civil Rights Act of 1875's ban on discrimination in inns, theaters, and railroads.","The Court never read the Fifteenth Amendment to cover sex.","The Black Codes had been superseded by the Civil Rights Act of 1866 and the Fourteenth Amendment. They were not the issue in 1883.","That was Brown v. Board of Education (1954)."],"a":1},{"id":"u1q33","u":1,"th":"cul","d":"m","pool":"A","s":"During and after Reconstruction, independent Black churches became important primarily because they","st":"","o":["encouraged members to join the Democratic Party","were required by federal law in every southern county","served as centers of community life, education, and political organizing","opposed education for freedpeople","were funded and controlled by the Freedmen's Bureau"],"e":["Black voters and leaders overwhelmingly backed the Republicans.","No federal law required churches. Establishing religion would violate the First Amendment.","Free of white control, Black churches hosted schools and meetings and produced many Reconstruction-era leaders.","Churches were among the strongest supporters of Black education.","The churches were independent institutions, not Bureau agencies."],"a":2},{"id":"u1q34","u":1,"th":"soc","d":"h","pool":"A","s":"Freedpeople's hopes of receiving \"forty acres and a mule\" were largely disappointed because","st":"","o":["most freedpeople preferred to move to northern cities","the Homestead Act of 1862 excluded all southern land","Radical Republicans opposed any land redistribution","President Johnson's pardons restored most confiscated land to its former owners","the Fifteenth Amendment prohibited land grants to freedpeople"],"e":["The Great Migration north came decades later. Most freedpeople wanted land in the South.","The Southern Homestead Act of 1866 opened some southern public land, but it was poor land and the program largely failed.","Thaddeus Stevens actually proposed confiscating planter land for freedpeople. Moderates and Johnson blocked it.","Sherman's Field Order No. 15 had set aside coastal land, but Johnson reversed it and returned land to pardoned planters.","The Fifteenth Amendment concerns voting and says nothing about land."],"a":3},{"id":"u2q01","u":2,"th":"pol","d":"m","pool":"quiz","s":"The Pendleton Civil Service Act of 1883 was passed largely in reaction to","st":"","o":["the Pullman Strike","the assassination of President Garfield by a disappointed office-seeker","the Haymarket bombing in Chicago","the Supreme Court's decision in Wabash v. Illinois","the Crédit Mobilier railroad scandal"],"e":["The Pullman Strike took place in 1894, after the Pendleton Act.","Garfield's murder by Charles Guiteau dramatized the evils of the spoils system and pushed Congress to require merit exams for some federal jobs.","Haymarket (1886) produced anti-labor and anti-immigrant backlash, not civil service reform.","Wabash (1886) led to the Interstate Commerce Act, not civil service reform.","Crédit Mobilier (1872) involved bribery of congressmen and fed general reform sentiment, but it was not the trigger for the 1883 act."],"a":1},{"id":"u2q02","u":2,"th":"pol","d":"m","pool":"A","s":"The Interstate Commerce Act of 1887 was significant because it","st":"","o":["nationalized the major railroads","created the first federal regulatory agency to oversee railroad rates","broke up the Standard Oil Company","granted public land to transcontinental railroads","established an eight-hour day for railroad workers"],"e":["The railroads stayed privately owned. The government briefly ran them only during World War I.","The ICC was meant to ensure \"reasonable and just\" rates. It was weak at first but set a precedent for federal regulation.","Standard Oil was broken up by the Supreme Court in 1911 under the Sherman Act.","Land grants came earlier, in the Pacific Railway Acts of the 1860s.","The eight-hour day for railroad workers came with the Adamson Act of 1916."],"a":1},{"id":"u2q03","u":2,"th":"pol","d":"h","pool":"A","s":"In United States v. E.C. Knight Co. (1895), the Supreme Court weakened the Sherman Antitrust Act by ruling that","st":"","o":["the federal government could regulate railroad rates but not stock sales","states, not Congress, had the sole power to regulate railroads","manufacturing was not interstate commerce, so a sugar-refining monopoly was beyond the act's reach","the act violated the Fourteenth Amendment's due process clause","labor unions could never be prosecuted as combinations in restraint of trade"],"e":["The case concerned manufacturing monopolies, not railroad rates or stocks.","Wabash (1886) said states could NOT regulate interstate railroads.","Although the company controlled about 98% of sugar refining, the Court said manufacturing was local. This gutted early antitrust enforcement.","The Court did not strike the act down. It narrowed it.","The Sherman Act was actually used against unions in this era (e.g., the Pullman injunction upheld in In re Debs)."],"a":2},{"id":"u2q04","u":2,"th":"pol","d":"e","pool":"quiz","s":"Thomas Nast's political cartoons helped bring down which of the following?","st":"","o":["The Ku Klux Klan Act","William \"Boss\" Tweed and the Tammany Hall machine","Standard Oil's petroleum monopoly","The Populist Party","The Knights of Labor"],"e":["The Klan Act was a federal law against the Klan, not a political machine.","Nast's cartoons in <em>Harper's Weekly<\/em> made Tweed's corruption visible even to voters who could not read. Tweed was convicted in the 1870s.","Standard Oil was later exposed by Ida Tarbell's writing, not Nast's cartoons.","The Populists arose in the 1890s and were not Nast's target.","Nast did not lead a campaign against the Knights."],"a":1},{"id":"u2q05","u":2,"th":"pol","d":"h","pool":"quiz","s":"Which of the following correctly shows cause and effect in railroad regulation?","st":"","o":["The Pullman Strike led Congress to abolish the Interstate Commerce Commission.","The Interstate Commerce Act created the Granger movement.","The Sherman Antitrust Act forced the Supreme Court to decide Munn v. Illinois.","Wabash v. Illinois barred states from regulating interstate rates, so Congress passed the Interstate Commerce Act.","Munn v. Illinois struck down all state Granger laws."],"e":["The ICC lasted until 1995.","The Grangers came first (1867 onward) and pushed for regulation.","Munn (1877) came 13 years before the Sherman Act (1890).","After Wabash (1886) blocked state regulation of interstate traffic, Congress created the ICC in 1887 to fill the gap.","Munn upheld state regulation of grain elevators."],"a":3},{"id":"u2q06","u":2,"th":"pol","d":"h","pool":"diag","s":"The data above best support which generalization about Gilded Age politics?","st":"<p>Presidential election, 1880: Garfield (R) 48.3% of popular vote, Hancock (D) 48.2%. Voter turnout: about 80% of eligible voters.<\/p><p>Presidential election, 1884: Cleveland (D) 48.9%, Blaine (R) 48.3%. Voter turnout: about 78%.<\/p>","o":["Women's suffrage had greatly expanded the electorate.","Most eligible voters did not participate in presidential elections.","Elections were extremely close and voter participation was very high.","One party dominated national politics throughout the era.","Third parties regularly won a majority of the popular vote."],"e":["National women's suffrage came only in 1920.","Turnout near 80% is far higher than in most twentieth-century elections.","Popular-vote margins under one point and turnout around 80% characterized national elections in the period.","The near-even splits show intense two-party competition, not domination.","The two major parties won almost all the votes in these elections."],"a":2},{"id":"u2q07","u":2,"th":"pol","d":"m","pool":"B","s":"The \"Mugwumps\" of 1884 were","st":"","o":["southern Democrats who overthrew Reconstruction governments","labor activists who led the Haymarket rally","supporters of unlimited coinage of silver","farmers who founded the Grange","reform-minded Republicans who supported Democrat Grover Cleveland rather than their own party's tainted nominee"],"e":["Those were the Redeemers.","The Haymarket organizers were anarchists and labor radicals, not Mugwumps.","Free-silver supporters were mostly Populists and western Democrats.","The Grange was founded by Oliver Kelley in 1867.","They objected to James G. Blaine's reputation for corruption and helped elect Cleveland."],"a":4},{"id":"u2q08","u":2,"th":"pol","d":"m","pool":"A","s":"During the Pullman Strike of 1894, President Grover Cleveland","st":"","o":["forced George Pullman to recognize the union","nationalized the railroads to keep trains running","signed a law guaranteeing workers the right to bargain collectively","refused to intervene, citing laissez-faire principles","sent federal troops to break the strike, citing interference with the U.S. mail"],"e":["Pullman refused to negotiate, and the government sided with him.","There was no nationalization.","That right came with the Wagner Act in 1935.","Cleveland intervened decisively on the employers' side.","A federal court injunction against Debs's union and Cleveland's troops ended the strike. The Supreme Court upheld the injunction in In re Debs (1895)."],"a":4},{"id":"u2q09","u":2,"th":"pol","d":"m","pool":"B","s":"The Dawes Severalty Act of 1887 attempted to","st":"","o":["pay compensation for land seized in violation of treaties","grant immediate full citizenship to all Native Americans","restore tribal governments and communal landholding","assimilate Native Americans by dividing tribal reservations into individual family farms","relocate all Native Americans to Oklahoma Territory"],"e":["There was no compensation. The act opened \"surplus\" land to white settlers.","Citizenship was promised only to allottees after a 25-year trust period. All Native Americans became citizens in 1924.","That was the goal of the Indian Reorganization Act of 1934, which reversed Dawes.","Allotment aimed to make Native Americans into individual farmers and citizens. In practice, it cost them about two-thirds of their land.","Removal to Indian Territory was an earlier policy (the 1830s)."],"a":3},{"id":"u2q10","u":2,"th":"eco","d":"e","pool":"quiz","s":"Andrew Carnegie's control of iron mines, coal fields, ore ships, railroads, and steel mills is the best example of","st":"","o":["collective bargaining","laissez-faire regulation","horizontal integration","the crop-lien system","vertical integration"],"e":["Collective bargaining is negotiation between unions and employers.","Laissez-faire means government non-interference, not a business structure.","Horizontal integration means buying competitors at the same stage, as Rockefeller did with refineries.","The crop-lien system was a southern agricultural credit arrangement.","Owning every stage of production, from raw materials to the finished product, is vertical integration."],"a":4},{"id":"u2q11","u":2,"th":"eco","d":"m","pool":"B","s":"John D. Rockefeller built Standard Oil into a near-monopoly mainly by","st":"","o":["recognizing labor unions to avoid strikes","buying out or driving out competing oil refiners, an examp ious movement promising renewal.","The army killed about 250 Lakota after alarm over the Ghost Dance. It is seen as the close of the Indian wars."],"a":4},{"id":"u2q30","u":2,"th":"soc","d":"h","pool":"quiz","s":"This 1877 statement was made by","st":"<p>\"Hear me, my chiefs! I am tired; my heart is sick and sad. From where the sun now stands I will fight no more forever.\"<\/p>","o":["Chief Joseph of the Nez Perce after a long retreat toward Canada","Geronimo after his final surrender in 1886","Sitting Bull after the Battle of Little Bighorn","Crazy Horse at Wounded Knee","Tecumseh before the War of 1812"],"e":["Joseph surrendered just short of the Canadian border after a long pursuit.","Geronimo was an Apache leader in the Southwest. This is not his statement.","Sitting Bull fled to Canada after 1876 and surrendered in 1881. These are not his words.","Crazy Horse was killed in 1877 and was not at Wounded Knee (1890).","Tecumseh lived decades earlier."],"a":0},{"id":"u2q31","u":2,"th":"soc","d":"m","pool":"quiz","s":"Federal Indian boarding schools such as the Carlisle School in Pennsylvania aimed primarily to","st":"","o":["train Native Americans as military officers","educate white settlers about Native culture","assimilate Native American children by suppressing their languages, religions, and cultures","preserve tribal languages through bilingual education","prepare tribal leaders to negotiate new treaties"],"e":["Carlisle offered vocational and academic schooling, not officer training.","The schools were for Native children.","Founder Richard Henry Pratt's motto, \"Kill the Indian in him, and save the man,\" sums up the aim.","The schools banned Native languages.","Congress ended treaty-making with tribes in 1871."],"a":2},{"id":"u2q32","u":2,"th":"soc","d":"m","pool":"A","s":"Which of the following statements about cowboys of the late-nineteenth-century cattle drives is accurate?","st":"","o":["Cattle drives continued to grow after barbed wire spread.","The c
