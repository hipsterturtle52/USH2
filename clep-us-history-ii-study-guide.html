s third term","key":false},{"y":"1941","t":"Four Freedoms; Lend-Lease (March); EO 8802; Atlantic Charter (Aug.); Pearl Harbor (Dec. 7)","key":true},{"y":"1942","t":"EO 9066 (Japanese American internment); Battle of Midway (June); Bracero Program; Manhattan Project","key":true},{"y":"1943","t":"Casablanca and Tehran conferences; Detroit riot and Zoot Suit Riots; Italy invaded","key":false},{"y":"1944","t":"D-Day (June 6); Korematsu v. U.S.; GI Bill; Bretton Woods; Battle of the Bulge","key":true},{"y":"1945","t":"Yalta (Feb.); FDR dies, Truman president (April); V-E Day (May 8); Potsdam; Hiroshima and Nagasaki (Aug.); Japan surrenders; UN founded","key":true}],"cards":[{"id":"u6c01","f":"Nye Committee (1934–36)","b":"Senate investigation suggesting bankers and arms makers (\"merchants of death\") had pushed the U.S. into WWI. Fed isolationism."},{"id":"u6c02","f":"Neutrality Acts (1935–37)","b":"Banned arms sales and loans to belligerents and U.S. travel on belligerent ships. Later allowed \"cash-and-carry.\""},{"id":"u6c03","f":"Cash-and-carry","b":"Warring nations could buy U.S. goods (arms after 1939) if they paid cash and shipped them themselves. Favored Britain."},{"id":"u6c04","f":"Quarantine Speech (1937)","b":"FDR suggested \"quarantining\" aggressor nations. Met with isolationist backlash."},{"id":"u6c05","f":"America First Committee","b":"Isolationist group (Charles Lindbergh) opposing U.S. aid to Britain and entry into WWII."},{"id":"u6c06","f":"Destroyers-for-bases deal (1940)","b":"Fifty old U.S. destroyers for leases on British bases in the Western Hemisphere."},{"id":"u6c07","f":"Four Freedoms (1941)","b":"FDR's war aims: freedom of speech, freedom of worship, freedom from want, freedom from fear."},{"id":"u6c08","f":"Lend-Lease Act (March 1941)","b":"Let the president lend or lease arms to nations vital to U.S. defense (Britain, later the USSR). \"Arsenal of democracy.\""},{"id":"u6c09","f":"Atlantic Charter (Aug. 1941)","b":"FDR–Churchill statement of goals: no territorial gain, self-determination, free trade, collective security."},{"id":"u6c10","f":"Pearl Harbor (Dec. 7, 1941)","b":"Japanese surprise attack on the U.S. fleet in Hawaii after the U.S. oil embargo. The U.S. entered WWII."},{"id":"u6c11","f":"Europe-first strategy","b":"The Allied decision to defeat Germany before concentrating on Japan."},{"id":"u6c12","f":"D-Day (June 6, 1944)","b":"Allied invasion of Normandy under Eisenhower. Opened the western front."},{"id":"u6c13","f":"Battle of Midway (June 1942)","b":"U.S. carriers sank four Japanese carriers. The turning point of the Pacific war."},{"id":"u6c14","f":"Island hopping","b":"U.S. Pacific strategy of capturing key islands and bypassing others to approach Japan."},{"id":"u6c15","f":"Manhattan Project","b":"Secret U.S. program (Oppenheimer, Los Alamos) that built the atomic bomb."},{"id":"u6c16","f":"Hiroshima and Nagasaki (Aug. 1945)","b":"Atomic bombings ordered by Truman. Japan surrendered days later. Still debated."},{"id":"u6c17","f":"Yalta Conference (Feb. 1945)","b":"FDR, Churchill, Stalin: Soviet entry against Japan, UN, German zones, promised free elections in Eastern Europe."},{"id":"u6c18","f":"Executive Order 9066 (1942)","b":"Authorized removal of about 120,000 Japanese Americans (2/3 citizens) from the West Coast to internment camps."},{"id":"u6c19","f":"Korematsu v. United States (1944)","b":"Supreme Court upheld Japanese American internment as military necessity. Widely condemned later."},{"id":"u6c20","f":"Executive Order 8802 (1941)","b":"Banned racial discrimination in defense industries and created the FEPC, after A. Philip Randolph threatened a march."},{"id":"u6c21","f":"Double V campaign","b":"Black Americans' call for victory over fascism abroad and racism at home."},{"id":"u6c22","f":"Rosie the Riveter","b":"Symbol of the roughly six million women who entered the wartime workforce, many in industry."},{"id":"u6c23","f":"GI Bill (1944)","b":"Servicemen's Readjustment Act. Paid for veterans' college and job training and backed low-interest home loans."}]}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const UNITS = D.units;
const QS = D.questions;
const QMAP = Object.fromEntries(QS.map(q => [q.id, q]));
const CARDS = UNITS.flatMap(u => u.cards.map(c => Object.assign({u: u.n}, c)));
const CMAP = Object.fromEntries(CARDS.map(c => [c.id, c]));
const THEMES = Object.fromEntries(D.meta.thematic_weights.map(t => [t.id, t]));
const LETTERS = ['A','B','C','D','E'];
const DAY = 86400000;
const $ = s => document.querySelector(s);
const main = document.getElementById('main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => Math.round(x * 100) + '%';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

/* ---------- storage (safe) ---------- */
const KEY = 'clep-ush2-v1';
let storageOK = true;
function blankState(){ return {v:1, theme:null, lessonsRead:{}, quiz:{}, diag:null, exams:{}, examRun:null, cards:{}, mistakes:{}, plan:null}; }
function loadState(){
  try { const raw = localStorage.getItem(KEY); if (!raw) return blankState(); return sanitize(JSON.parse(raw)); }
  catch(e){ storageOK = false; return blankState(); }
}
function sanitize(o){
  const s = blankState();
  if (!o || typeof o !== 'object') return s;
  for (const k of Object.keys(s)) if (o[k] !== undefined && typeof o[k] === typeof s[k] || (s[k] === null && o[k] && typeof o[k] === 'object')) s[k] = o[k];
  if (o.theme === 'light' || o.theme === 'dark') s.theme = o.theme;
  return s;
}
let S = loadState();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e){ storageOK = false; } }

/* ---------- theme ---------- */
function applyTheme(){ if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
$('#themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
applyTheme();

/* ---------- keyboard ---------- */
let keyHandler = null;
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (keyHandler && keyHandler(e) === true) e.preventDefault();
});

/* ---------- derived progress ---------- */
const unitQs = (n, pool) => QS.filter(q => q.u === n && (!pool || q.pool === pool));
const diagLabel = n => {
  if (!S.diag || !S.diag.byUnit || !S.diag.byUnit[n]) return null;
  const r = S.diag.byUnit[n]; const p = r.c / r.n;
  return p >= 0.75 ? 'skim' : p >= 0.5 ? 'study' : 'must';
};
const labelPill = l => l === 'skim' ? '<span class="pill good">Skim</span>' : l === 'study' ? '<span class="pill warn">Study</span>' : l === 'must' ? '<span class="pill bad">Must study</span>' : '';
const unitDone = n => !!S.lessonsRead[n] && S.quiz[n] && S.quiz[n].best >= 0.7;
const cardState = id => S.cards[id] || null;
function cardMastery(n){ const cs = CARDS.filter(c => !n || c.u === n); if (!cs.length) return 0; return cs.filter(c => (S.cards[c.id] || {}).box >= 3).length / cs.length; }
function dueCards(n){ const now = Date.now(); return CARDS.filter(c => (!n || c.u === n) && (!S.cards[c.id] || S.cards[c.id].due <= now)); }
function openMistakes(){ return Object.keys(S.mistakes).filter(id => QMAP[id] && !S.mistakes[id].ok); }

/* time model (minutes) */
function unitTasks(n){
  const u = UNITS[n-1]; const lab = diagLabel(n); const f = lab === 'skim' ? 0.5 : 1;
  const qn = unitQs(n, 'quiz').length;
  return [
    {id:'lesson'+n, unit:n, kind:'lesson', label:`Unit ${n}: read lesson + must-know + timeline`, min: Math.round((u.minutes + 10) * f), done: !!S.lessonsRead[n]},
    {id:'quiz'+n, unit:n, kind:'quiz', label:`Unit ${n}: quiz (${qn} Q) + review explanations`, min: Math.round(qn * 1.5), done: !!S.quiz[n]},
    {id:'cards'+n, unit:n, kind:'cards', label:`Unit ${n}: learn flashcards (${u.cards.length})`, min: Math.round(u.cards.length * 1.0), done: cardMastery(n) >= 0.8, frac: cardMastery(n)}
  ];
}
function allTasks(){
  const t = [{id:'diag', kind:'diag', label:'Diagnostic test (30 Q)', min:45, done: !!S.diag}];
  const order = UNITS.map(u => u.n).sort((a,b) => { const r = l => ({must:0, study:1, skim:2})[diagLabel(l)] ?? 1; return r(a) - r(b) || a - b; });
  for (const n of order) t.push(...unitTasks(n));
  t.push({id:'review', kind:'review', label:'Spaced flashcard reviews (ongoing)', min: Math.round(CARDS.length * 0.9 * (1 - cardMastery())), done: cardMastery() >= 0.9});
  t.push({id:'mist', kind:'mist', label:'Drill the mistake log', min: Math.max(30, openMistakes().length * 2), done: false, always:true});
  t.push({id:'cheat', kind:'cheat', label:'Cheat sheet: redraw from memory', min:60, done:false, always:true});
  t.push({id:'examA', kind:'exam', label:'Practice Exam 1 (90 min) + review', min:150, done: !!(S.exams.A && S.exams.A.attempts)});
  t.push({id:'examB', kind:'exam', label:'Practice Exam 2 (90 min) + review', min:150, done: !!(S.exams.B && S.exams.B.attempts)});
  return t;
}
function hoursLeft(){
  let m = 0; for (const t of allTasks()) { if (t.done) continue; m += t.frac ? t.min * (1 - t.frac) : t.min; }
  return m / 60;
}
function totalHours(){ return allTasks().reduce((a,t) => a + t.min, 0) / 60; }

/* ---------- nav / router ---------- */
const NAV = [['#/','Home'],['#/diagnostic','Diagnostic'],['#/units','Units'],['#/cards','Flashcards'],['#/mistakes','Mistakes'],['#/exams','Practice exams'],['#/cheatsheet','Cheat sheet'],['#/plan','Study plan'],['#/about','About & data']];
function renderNav(){
  const h = location.hash || '#/';
  $('#nav').innerHTML = NAV.map(([href, l]) => {

/* ---------- QUIZ ENGINE (practice / diagnostic / drill) ---------- */
function recordMistake(id, correct, mode){
  if (!correct) { const m = S.mistakes[id] || {n:0}; m.n++; m.t = Date.now(); m.ok = false; S.mistakes[id] = m; }
  else if (mode === 'drill' && S.mistakes[id]) { S.mistakes[id].ok = true; }
}
function stimHTML(q){ return q.st ? `<div class="stim">${q.st}</div>` : ''; }
function qMeta(q){ return `<span class="pill">Unit ${q.u}</span> <span class="pill">${esc(THEMES[q.th].short)}</span>`; }
function runQuiz(opts){
  const {qs, mode} = opts; let i = 0, sel = null, revealed = false; const res = [];
  const feedback = mode !== 'diag';
  function render(){
    const q = qs[i];
    main.innerHTML = banners() + `<div class="qhead"><b>${esc(opts.title)}</b><span class="muted small">Question ${i+1} of ${qs.length}</span></div>
    <div class="bar"><span style="width:${(i)/qs.length*100}%"></span></div>
    <div class="card">${feedback ? `<div class="row small" style="margin-bottom:6px">${qMeta(q)}</div>` : ''}${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o, k) => {
      let cls = '';
      if (revealed) cls = k === q.a ? 'right' : (k === sel ? 'wrong' : '');
      else if (k === sel) cls = 'sel';
      return `<button class="opt ${cls}" data-k="${k}" ${revealed ? 'disabled' : ''}><span class="k">${LETTERS[k]}</span><span>${o}${revealed ? `<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span>` : ''}</span></button>`;
    }).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <a href="${opts.back}" class="small muted">Quit</a>
      <button class="btn" id="nx" ${sel == null ? 'disabled' : ''}>${!feedback ? (i === qs.length-1 ? 'Finish' : 'Next') : revealed ? (i === qs.length-1 ? 'See results' : 'Next') : 'Check'}</button></div>
    <div class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> ${feedback ? 'answer' : 'select'} · <span class="kbd">Enter</span> ${feedback ? 'next' : 'confirm'}</div></div>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
    $('#nx').onclick = next;
  }
  function choose(k){ if (revealed) return; sel = k; if (feedback) reveal(); else render(); }
  function reveal(){ revealed = true; const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); render(); }
  function next(){
    if (sel == null) return;
    if (feedback && !revealed) { reveal(); return; }
    if (!feedback) { const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); }
    if (i < qs.length - 1) { i++; sel = null; revealed = false; render(); window.scrollTo(0,0); }
    else finish();
  }
  function finish(){
    keyHandler = null;
    const r = {total: res.length, correct: res.filter(x => x.ok).length, res};
    if (opts.onDone) opts.onDone(r);
    if (opts.renderResults) return opts.renderResults(r);
    main.innerHTML = banners() + `<h1>${esc(opts.title)}: results</h1><div class="card"><div style="font-size:2rem;font-weight:700">${r.correct} / ${r.total} <span class="muted" style="font-size:1rem">(${pct(r.correct/r.total)})</span></div>
    <p class="muted">${r.correct/r.total >= 0.75 ? 'Solid. Keep the flashcards going.' : 'Missed questions are now in your mistake log. Re-read the bold terms in the lesson, then drill them.'}</p>
    <div class="row"><a class="btn" href="${opts.back}">Done</a><a class="btn ghost" href="#/mistakes">Mistake log</a></div></div>${reviewList(res.filter(x => !x.ok))}`;
  }
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { choose(+e.key - 1); return true; }
    const L = e.key.toUpperCase(); if (!revealed && LETTERS.includes(L) && e.key.length === 1) { choose(LETTERS.indexOf(L)); return true; }
    if (e.key === 'Enter') { next(); return true; }
  };
  render();
}
function reviewList(items, title){
  if (!items.length) return '';
  return `<h2>${title || 'Review what you missed'}</h2>` + items.map(x => { const q = QMAP[x.id]; return `<div class="card"><div class="row small">${qMeta(q)}</div>${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o,k) => `<div class="opt ${k === q.a ? 'right' : k === x.sel ? 'wrong' : ''}"><span class="k">${LETTERS[k]}</span><span>${o}<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span></span></div>`).join('')}</div></div>`; }).join('');
}

const INTERVALS = [0, 1, 3, 7, 14]; // days for boxes 1..5
function viewCards(){

function boxChart(n){
  const cs = CARDS.filter(c => !n || c.u === n); const counts = [0,0,0,0,0,0];
  for (const c of cs) { const s = S.cards[c.id]; counts[s ? s.box : 0]++; }
  const mx = Math.max(1, ...counts);
  const lbl = ['New','Box 1','Box 2','Box 3','Box 4','Box 5'];
  return `<div class="boxes">${counts.map(v => `<div title="${v}" style="height:${v/mx*100}%"></div>`).join('')}</div><div class="boxlbl">${counts.map((v,k) => `<span>${lbl[k]}<br><b>${v}</b></span>`).join('')}</div>`;
}
function flashSession(el, {unit, mode}){
  const pool = CARDS.filter(c => !unit || c.u === unit);
  let queue;
  if (mode === 'missed') queue = pool.filter(c => S.cards[c.id] && S.cards[c.id].lastMiss);
  else if (mode === 'all') queue = pool.slice();
  else { const now = Date.now(); const seen = pool.filter(c => S.cards[c.id] && S.cards[c.id].due <= now); const fresh = pool.filter(c => !S.cards[c.id]); queue = seen.concat(fresh.slice(0, Math.max(0, 30 - seen.length))); }
  queue = shuffle(queue); let flipped = false, got = 0, missed = 0; const total = queue.length;
  function render(){
    if (!queue.length) {
      el.innerHTML = `<div class="card"><b>${total ? 'Session complete.' : mode === 'missed' ? 'No missed cards here. Nice.' : 'Nothing due right now.'}</b> ${total ? `<span class="muted">${got} right first time, ${missed} misses.</span>` : ''}<div class="small muted" style="margin-top:6px">${dueCards(unit || 0).length} cards due in this set now.</div>${unit ? boxChart(unit) : ''}<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="again">Cram all cards in this set</button></div></div>`;
      $('#again').onclick = () => flashSession(el, {unit, mode:'all'}); keyHandler = null; return;
    }
    const c = queue[0]; const st = S.cards[c.id];
    el.innerHTML = `<div class="row small muted" style="justify-content:space-between;margin-top:10px"><span>${queue.length} left in session · Unit ${c.u}</span><span>${st ? 'Box ' + st.box : 'New card'}</span></div>
    <div class="card fc" id="fc">${flipped ? `<div><div style="font-weight:700;margin-bottom:8px">${c.f}</div><div class="back">${c.b}</div></div>` : `<div>${c.f}<div class="small muted" style="margin-top:12px">tap or press Space to flip</div></div>`}</div>
    <div class="row" style="justify-content:center">${flipped ? `<button class="btn ghost" id="miss">✗ Missed <span class="kbd">1</span></button><button class="btn" id="hit">✓ Got it <span class="kbd">2</span></button>` : `<button class="btn" id="flip">Flip <span class="kbd">Space</span></button>`}</div>`;
    $('#fc').onclick = () => { flipped = !flipped; render(); };
    if (flipped) { $('#miss').onclick = () => grade(false); $('#hit').onclick = () => grade(true); } else $('#flip').onclick = () => { flipped = true; render(); };
  }
  function grade(ok){
    const c = queue.shift(); const st = S.cards[c.id] || {box:0, miss:0};
    if (ok) { st.box = Math.min(5, Math.max(1, st.box + 1)); st.due = Date.now() + INTERVALS[st.box - 1] * DAY; st.lastMiss = false; if (!c._m) got++; }
    else { st.box = 1; st.due = Date.now(); st.miss = (st.miss || 0) + 1; st.lastMiss = true; missed++; c._m = true; queue.splice(Math.min(queue.length, 3), 0, c); }
    if (ok && st.box === 1) st.due = Date.now() + 10 * 60000; // learned today, show again later
    S.cards[c.id] = st; save(); flipped = false; render();
  }
  keyHandler = e => {
    if (!queue.length) return;
    if (e.key === ' ' || e.key === 'Enter' && !flipped) { flipped = !flipped; render(); return true; }
    if (flipped && e.key === '1') { grade(false); return true; }
    if (flipped && (e.key === '2' || e.key === 'Enter')) { grade(true); return true; }
  };
  pool.forEach(c => delete c._m);
  render();
}

/* ---------- MISTAKES ---------- */
function viewMistakes(){
  const ids = openMistakes().sort((a,b) => QMAP[a].u - QMAP[b].u);
  const fixed = Object.keys(S.mistakes).filter(id => QMAP[id] && S.mistakes[id].ok).length;
  main.innerHTML = banners() + `<h1>Mistake log</h1><p class="muted">Every question you miss in any mode lands here. In a drill, answering one correctly clears it. Fixed so far: ${fixed}.</p>
  <div class="card"><div class="row" style="justify-content:space-between"><b>${ids.length} open mistake${ids.length === 1 ? '' : 's'}</b><div class="row"><select id="mu"><option value="0">All units</option>${UNITS.map(u => `<option value="${u.n}">Unit ${u.n} (${ids.filter(id => QMAP[id].u === u.n).length})</option>`).join('')}</select><button class="btn" id="go" ${ids.length ? '' : 'disabled'}>Drill</button></div></div></div>
  ${ids.length ? `<div class="card tablewrap"><table><thead><tr><th>Unit</th><th>Question</th><th>Missed</th></tr></thead><tbody>${ids.map(id => { const q = QMAP[id]; return `<tr><td>${q.u}</td><td>${q.s.replace(/<[^>]+>/g,'').slice(0,110)}…</td><td>${S.mistakes[id].n}×</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted">Nothing here yet. Take a quiz or the diagnostic.</p>'}`;
  const go = () => { const u = +$('#mu').value; const qs = shuffle(ids.filter(id => !u || QMAP[id].u === u).map(id => QMAP[id])); if (!qs.length) return; runQuiz({title:'Mistake drill', qs, mode:'drill', back:'#/mistakes'}); };
  $('#go').onclick = go;
}

/* ---------- PRACTICE EXAMS ---------- */
const EXAM_MIN = 90;
function viewExams(){
  const card = (k, label) => { const e = S.exams[k]; const n = QS.filter(q => q.pool === k).length; return `<div class="card"><h3 style="margin-top:0">${label}</h3><p class="small muted">${n} questions · ${EXAM_MIN} minutes · no pausing · results by unit, theme, and period at the end</p>
    ${e ? `<p>Best: <b>${pct(e.best)}</b> · Last: ${pct(e.last)} · Attempts: ${e.attempts}</p>` : '<p class="muted">Not taken.</p>'}
    ${e && e.history && e.history.length ? `<details><summary class="small">Last result breakdown</summary>${breakdownHTML(e.history[e.history.length-1])}</details>` : ''}
    <a class="btn" href="#/exam/${k}">${S.examRun && S.examRun.exam === k ? 'Resume (timer running)' : 'Start'}</a></div>`; };
  main.innerHTML = banners() + `<h1>Practice exams</h1><p>Each exam copies the real format: about 120 five-option questions in 90 minutes. The timer keeps running if you leave the page, just like test day. The two exams share no questions with each other, with the unit quizzes, or with the diagnostic. Take them in the last few days before your exam.</p>
  ${readinessCard()}<div class="grid g2">${card('A','Practice Exam 1')}${card('B','Practice Exam 2')}</div>`;
}
function viewExam(k){
  const qs = QS.filter(q => q.pool === k);
  if (!S.examRun || S.examRun.exam !== k) {
    if (S.examRun) { main.innerHTML = banners() + `<div class="card">Finish your other exam first.</div>`; return; }
    main.innerHTML = banners() + `<h1>Practice Exam ${k === 'A' ? 1 : 2}</h1><div class="card"><ul><li>${qs.length} questions, ${EXAM_MIN} minutes. That's 45 seconds per question.</li><li><b>No pausing.</b> Once you start, the clock runs even if you close the tab.</li><li>You can skip, flag, and go back. At 0:00 the exam is submitted automatically.</li><li>There's no penalty for guessing on CLEP, so never leave a question blank.</li></ul>
    <p class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> answer · <span class="kbd">Enter</span>/<span class="kbd">→</span> next · <span class="kbd">←</span> back · <span class="kbd">F</span> flag</p>
    <button class="btn" id="go">Start the clock</button> <a href="#/exams" class="btn ghost">Not now</a></div>`;
    $('#go').onclick = () => { S.examRun = {exam:k, order: shuffle(qs.map(q => q.id)), ans:{}, flag:{}, start: Date.now(), cur:0}; save(); viewExam(k); };
    return;
  }
  const R = S.examRun;
  const left = () => EXAM_MIN * 60000 - (Date.now() - R.start);
  if (left() <= 0) return submitExam();
  function fmt(ms){ ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  function render(){
    const q = QMAP[R.order[R.cur]]; const a = R.ans[q.id];
    const answered = Object.keys(R.ans).length;
    main.innerHTML = `<div class="qhead"><b>Practice Exam ${k === 'A' ? 1 : 2}</b><span class="timer" id="tm">${fmt(left())}</span></div>
    <div class="small muted">Question ${R.cur+1} of ${R.order.length} · ${answered} answered</div>
    <div class="card">${stimHTML(q)}<div class="stem">${q.s}</div><div class="opts">${q.o.map((o,j) => `<button class="opt ${a === j ? 'sel' : ''}" data-k="${j}"><span class="k">${LETTERS[j]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><div class="row"><button class="btn ghost sm" id="pv" ${R.cur === 0 ? 'disabled' : ''}>← Back</button><button class="btn ghost sm" id="fl">${R.flag[q.id] ? '★ Flagged' : '☆ Flag'}</button></div>
    <div class="row">${R.cur < R.order.length - 1 ? '<button class="btn sm" id="nx">Next →</button>' : ''}<button class="btn sm ${R.cur < R.order.length - 1 ? 'ghost' : ''}" id="sb">Submit exam</button></div></div></div>
    <details class="card"><summary class="small">Question navigator (flagged = gold border)</summary><div class="navgrid">${R.order.map((id,j) => `<button data-j="${j}" class="${R.ans[id] != null ? 'ans' : ''} ${j === R.cur ? 'cur' : ''} ${R.flag[id] ? 'flag' : ''}">${j+1}</button>`).join('')}</div></details>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
    main.querySelectorAll('.navgrid button').forEach(b => b.onclick = () => go(+b.dataset.j));
    $('#pv').onclick = () => go(R.cur - 1); if ($('#nx')) $('#nx').onclick = () => go(R.cur + 1);
    $('#fl').onclick = () => { R.flag[q.id] = !R.flag[q.id]; save(); render(); };
    $('#sb').onclick = () => { const un = R.order.length - Object.keys(R.ans).length; if (confirm(un ? `${un} question(s) unanswered. Submit anyway?` : 'Submit the exam?')) submitExam(); };
  }
  function pick(j){ R.ans[R.order[R.cur]] = j; save(); render(); }
  function go(j){ if (j < 0 || j >= R.order.length) return; R.cur = j; save(); render(); window.scrollTo(0,0); }
  timerIv = setInterval(() => { const l = left(); const t = $('#tm'); if (t) { t.textContent = fmt(l); t.classList.toggle('low', l < 5 * 60000); } if (l <= 0) { clearInterval(timerIv); timerIv = null; submitExam(true); } }, 1000);
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { pick(+e.key - 1); return true; }
    if (e.key === 'Enter' || e.key === 'ArrowRight') { go(R.cur + 1); return true; }
    if (e.key === 'ArrowLeft') { go(R.cur - 1); return true; }
    if (e.key === 'f' || e.key === 'F') { const id = R.order[R.cur]; R.flag[id] = !R.flag[id]; save(); render(); return true; }
  };
  render();
}
function tally(res){
  const by = (f) => { const o = {}; for (const x of res) { const q = QMAP[x.id]; const key = f(q); o[key] = o[key] || {c:0, n:0}; o[key].n++; if (x.ok) o[key].c++; } return o; };
  return {unit: by(q => q.u), theme: by(q => q.th), period: by(q => UNITS[q.u-1].period)};
}
function submitExam(timeout){
  const R = S.examRun; if (!R) return; if (timerIv) { clearInterval(timerIv); timerIv = null; }
  const res = R.order.map(id => ({id, sel: R.ans[id] != null ? R.ans[id] : null, ok: R.ans[id] === QMAP[id].a}));
  for (const x of res) recordMistake(x.id, x.ok, 'exam');
  const sc = res.filter(x => x.ok).length / res.length;
  const t = tally(res);
  const rec = {date: todayStr(), score: sc, mins: Math.min(EXAM_MIN, Math.round((Date.now() - R.start) / 60000)), ...t};
  const p = S.exams[R.exam] || {best:0, attempts:0, history:[]};
  S.exams[R.exam] = {best: Math.max(p.best, sc), last: sc, attempts: p.attempts + 1, history: (p.history || []).concat([rec]).slice(-5)};
  const k = R.exam; S.examRun = null; save();
  keyHandler = null;
  main.innerHTML = `<h1>Practice Exam ${k === 'A' ? 1 : 2}: results</h1>${timeout ? '<div class="banner">Time ran out, so the exam was submitted automatically.</div>' : ''}
  <div class="card"><div style="font-size:2.2rem;font-weight:700">${pct(sc)} <span class="muted" style="font-size:1rem">${res.filter(x => x.ok).length} / ${res.length} · ${rec.mins} min</span></div>
  <p>${sc >= 0.75 ? '<span class="pill good">Meets the 75% readiness bar</span>' : '<span class="pill bad">Below the 75% readiness bar</span>'} <span class="small muted">CLEP doesn't publish a percent-to-score conversion. The 75% bar is a deliberately safe margin above a typical passing raw score <span class="pill">unverified</span>.</span></p>
  ${breakdownHTML(rec)}<div class="row"><a class="btn" href="#/mistakes">Drill the misses</a><a class="btn ghost" href="#/exams">Back to exams</a></div></div>
  ${reviewList(res.filter(x => !x.ok))}`;
  window.scrollTo(0,0);
}
function breakdownHTML(rec){
  const rows = (obj, name) => Object.entries(obj).sort((a,b) => (isNaN(a[0]) ? 0 : a[0] - b[0])).map(([k, v]) => { const p = v.c / v.n; return `<tr><td>${name(k)}</td><td>${v.c}/${v.n}</td><td style="width:40%"><div class="bar ${p >= 0.75 ? 'good' : ''}"><span style="width:${p*100}%"></span></div></td><td>${pct(p)}</td></tr>`; }).join('');
  return `<div class="tablewrap"><table><thead><tr><th>By unit</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.unit, k => `${k}. ${esc(UNITS[k-1].title)}`)}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>By official theme</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.theme, k => esc(THEMES[k].short) + ` <span class="muted small">(${THEMES[k].percent}% of exam)</span>`)}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>By period</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.period, k => k === 'early' ? '1865–1914' : '1915–present')}</tbody></table></div>`;
}

/* ---------- CHEAT SHEET ---------- */
function viewCheat(){
  main.innerHTML = banners() + `<div class="noprint"><h1>Cheat sheet</h1><p class="muted">One printable page. Print it (it fits one letter page), then redraw it from memory on a blank sheet. <b>Memory mode</b> blurs the answers, and you tap one to check it.</p>
  <div class="row" style="margin-bottom:10px"><button class="btn" onclick="window.print()">Print</button><button class="btn ghost" id="memo">Memory mode: off</button></div></div>
  <div class="printhead"><b>CLEP US History II · one-page review</b></div>
  <div class="card"><div class="cheat" id="cheat">${D.cheat}</div></div>`;
  const ch = $('#cheat');
  $('#memo').onclick = e => { ch.classList.toggle('memo'); e.target.textContent = 'Memory mode: ' + (ch.classList.contains('memo') ? 'on' : 'off'); };
  ch.addEventListener('click', e => { const m = e.target.closest('.m'); if (m && ch.classList.contains('memo')) m.classList.toggle('show'); });
}

/* ---------- STUDY PLAN ---------- */
function viewPlan(){
  const p = S.plan || {hours: 1.5, date: '', start: todayStr()};
  main.innerHTML = banners() + `<h1>Study plan</h1><p class="muted">Enter your daily hours and exam date. The plan puts must-study units first and short flashcard reviews every day. It schedules Practice Exam 1 two days before the exam and Practice Exam 2 the day before. Re-generate it any time; it uses what you've already finished.</p>
  <div class="card noprint"><div class="row"><label class="f">Hours per day<input id="ph" type="number" min="0.5" max="12" step="0.5" value="${esc(p.hours)}"></label>
  <label class="f">Start date<input id="ps" type="date" value="${esc(p.start || todayStr())}"></label>
  <label class="f">Exam date<input id="pd" type="date" value="${esc(p.date)}"></label>
  <button class="btn" id="gen" style="align-self:flex-end">Generate</button><button class="btn ghost" style="align-self:flex-end" onclick="window.print()">Print</button></div></div><div id="planOut"></div>`;
  const gen = () => {
    const hours = Math.max(0.5, Math.min(12, parseFloat($('#ph').value) || 1.5)); const date = $('#pd').value; const start = $('#ps').value || todayStr();
    S.plan = {hours, date, start}; save();
    $('#planOut').innerHTML = date ? planHTML(hours, start, date) : '<p class="muted">Pick an exam date.</p>';
  };
  $('#gen').onclick = gen; if (p.date) gen();
}
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtD(d){ return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}); }
function planHTML(hours, startS, examS){
  const start = parseD(startS), exam = parseD(examS);
  const days = Math.round((exam - start) / DAY);
  if (days < 1) return '<div class="banner">The exam date must be after the start date.</div>';
  const cap = hours * 60;
  const tasks = allTasks().filter(t => !t.done && !['examA','examB','review','mist','cheat'].includes(t.id))
    .map(t => ({label: t.label, min: Math.max(10, Math.round(t.frac ? t.min * (1 - t.frac) : t.min))}));
  const studyDays = Math.max(0, days - 2); // last 2 days before exam reserved for practice exams
  const daily = Math.min(20, Math.round(cap * 0.2)); // flashcard review slot
  const plan = [];
  for (let i = 0; i < studyDays; i++) plan.push({d: new Date(start.getTime() + i * DAY), items: [], used: 0});
  let ti = 0, rem = tasks.length ? tasks[0].min : 0, part = 1;
  for (const day of plan) {
    if (ti > 0 || plan.indexOf(day) > 0) { day.items.push(`Flashcards: due cards (${daily} min)`); day.used += daily; }
    while (ti < tasks.length && day.used < cap - 5) {
      const take = Math.min(rem, cap - day.used);
      const t = tasks[ti];
      day.items.push(`${t.label}${take < rem || part > 1 ? ` (part ${part})` : ''} · ${Math.round(take)} min`);
      day.used += take; rem -= take;
      if (rem <= 0.5) { ti++; part = 1; rem = ti < tasks.length ? tasks[ti].min : 0; } else part++;
    }
    if (ti >= tasks.length && day.used < cap - 15) { day.items.push(`Mistake log drill + cheat-sheet redraw · ${Math.round(cap - day.used)} min`); day.used = cap; }
  }
  const leftover = tasks.slice(ti).reduce((a,t,k) => a + (k === 0 ? rem : t.min), 0);
  const e2 = new Date(exam.getTime() - DAY), e1 = new Date(exam.getTime() - 2 * DAY);
  if (days >= 2) plan.push({d: e1, items: ['<b>Practice Exam 1</b> (90 min, timed) · then review every miss (60 min)', 'Flashcards: missed only']});
  plan.push({d: e2, items: [`<b>Practice Exam ${days >= 2 ? 2 : '1 and 2 (split if you must)'}</b> (90 min, timed) · then review every miss`, 'Redraw the cheat sheet from memory once', 'If either exam is below 75%, consider moving your test date']});
  plan.push({d: exam, items: ['<b>EXAM DAY</b>. 20 min: skim the cheat sheet and run due flashcards. Then go take it. Pace: 45 s per question; guess and flag rather than stall.']});
  const need = (tasks.reduce((a,t) => a + t.min, 0) + studyDays * daily) / Math.max(1, studyDays) / 60;
  return `${leftover > 0 ? `<div class="banner">Not enough time: about ${(leftover/60).toFixed(1)} h of material doesn't fit. You'd need about <b>${need.toFixed(1)} h/day</b>, or a later exam date. The schedule below covers the highest-priority units first.</div>` : ''}
  <div class="card tablewrap plan"><table><thead><tr><th>Day</th><th>Do this</th></tr></thead><tbody>${plan.map((p, k) => `<tr><td><b>${fmtD(p.d)}</b><div class="small muted">Day ${k+1}</div></td><td><ul style="margin:0;padding-left:1.1em">${p.items.map(i => `<li>${i}</li>`).join('') || '<li class="muted">Rest / catch-up</li>'}</ul></td></tr>`).join('')}</tbody></table></div>`;
}

  const M = D.meta; const st = D.stats;
  main.innerHTML = banners() + `<h1>About this guide</h1>
  <div class="card"><h3 style="margin-top:0">Official exam facts</h3>

  <p class="small muted">${esc(M.verification_note)}</p></div>

  <table style="margin-top:10px"><thead><tr><th>Official period</th><th>Exam</th><th>Bank questions</th><th>Share</th></tr></thead><tbody>${M.chronological_weights.map(t => `<tr><td>${esc(t.name)}</td><td>${t.percent}%</td><td>${st.period[t.id]}</td><td>${pct(st.period[t.id]/st.total)}</td></tr>`).join('')}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>Unit</th><th>Weight</th><th>Lesson min</th><th>Questions</th><th>Cards</th></tr></thead><tbody>${UNITS.map(u => `<tr><td>${u.n}. ${esc(u.title)}</td><td>${u.weight}%</td><td>${u.minutes}</td><td>${unitQs(u.n).length} (${pct(unitQs(u.n).length/st.total)})</td><td>${u.cards.length} (${pct(u.cards.length/CARDS.length)})</td></tr>`).join('')}</tbody></table>
  <p class="small muted">${st.total} original questions (${st.diff.e} easy / ${st.diff.m} medium / ${st.diff.h} hard). Pools: ${st.pool.quiz} in unit quizzes, ${st.pool.diag} in the diagnostic, ${st.pool.A} in Practice Exam 1, and ${st.pool.B} in Practice Exam 2. No question appears in more than one pool. Correct answers are spread evenly across A–E.</p></div>
  <div class="card"><h3 style="margin-top:0">Your data</h3><p class="small muted">Progress is saved in this browser only (localStorage). ${storageOK ? '' : '<b>Storage is currently blocked, so export your progress before closing.</b>'}</p>
  <div class="row"><button class="btn" id="exp">Export progress (JSON)</button><label class="btn ghost">Import progress<input type="file" id="imp" accept="application/json,.json" style="display:none"></label><button class="btn ghost" id="rst">Reset everything</button></div><div id="msg" class="small" style="margin-top:8px"></div></div>
  <p class="small muted">The questions are original practice items written for this guide. They are not College Board questions.</p>`;
  $('#exp').onclick = () => { const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `clep-ush2-progress-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o || o.v !== 1) throw new Error('not a progress file'); S = sanitize(o); save(); applyTheme(); $('#msg').textContent = 'Imported.'; } catch(err){ $('#msg').textContent = 'Could not import: ' + err.message; } }; r.readAsText(f); };
  $('#rst').onclick = () => { if (confirm('Erase all progress? This cannot be undone. (Export first if unsure.)')) { S = blankState(); save(); applyTheme(); route(); } };
}

route();
