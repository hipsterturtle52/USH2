to Democrat <strong>Grover Cleveland<\/strong>, the only president to serve two <strong>non-consecutive<\/strong> terms (1885–89, 1893–97) until Donald Trump repeated the feat in 2025.<\/p>\n<p>Diplomacy was quiet. The <strong>Treaty of Washington<\/strong> (1871) sent the <strong>Alabama claims<\/strong> against Britain (over damage by Confederate raiders built in British shipyards) to arbitration, which awarded the U.S. $15.5 million. Secretary of State <strong>James G. Blaine<\/strong> hosted the first <strong>Pan-American Conference<\/strong> (1889) to expand U.S. influence and trade in Latin America.<\/p>\n<h2>Culture in brief<\/h2>\n<p>Writers turned to <strong>realism<\/strong>: <strong>Mark Twain<\/strong> (<em>Adventures of Huckleberry Finn<\/em>, 1884), William Dean Howells, and Henry James. Then came <strong>naturalism<\/strong>, which showed people at the mercy of their environment: <strong>Stephen Crane<\/strong> (<em>Maggie: A Girl of the Streets<\/em>), Jack London, and <strong>Theodore Dreiser<\/strong> (<em>Sister Carrie<\/em>). Painters <strong>Winslow Homer<\/strong> and <strong>Thomas Eakins<\/strong> worked in a realist style. <strong>Public high schools<\/strong>, land-grant colleges, research universities such as <strong>Johns Hopkins<\/strong> (1876), and women's colleges expanded quickly. The <strong>Chautauqua<\/strong> movement brought adult education to small towns. Mass leisure arrived: <strong>baseball<\/strong>, vaudeville, amusement parks, department stores, and mail-order catalogs from <strong>Montgomery Ward<\/strong> and <strong>Sears<\/strong>.<\/p>","mustknow":["<strong>Vertical integration<\/strong> (Carnegie, steel) vs. <strong>horizontal integration<\/strong> (Rockefeller, Standard Oil). A <strong>trust<\/strong> concentrates control of many companies.","<strong>Social Darwinism<\/strong> (Spencer, Sumner) justified inequality. The <strong>Gospel of Wealth<\/strong> (Carnegie) urged philanthropy. <strong>Henry George<\/strong> proposed a single tax. <strong>Bellamy<\/strong> wrote a socialist utopia.","<strong>Interstate Commerce Act<\/strong> (1887) regulated railroads. <strong>Sherman Antitrust Act<\/strong> (1890) banned trusts but was weakened by <strong>E.C. Knight<\/strong> (1895).","<strong>Knights of Labor<\/strong>: open to all, faded after Haymarket. <strong>AFL (Gompers)<\/strong>: skilled crafts, \"bread and butter.\"","Strikes: <strong>1877 railroad<\/strong>, <strong>Haymarket 1886<\/strong>, <strong>Homestead 1892<\/strong> (Carnegie/Frick), <strong>Pullman 1894<\/strong> (Debs; Cleveland sent troops via injunction).","<strong>New Immigrants<\/strong> came from southern and eastern Europe. <strong>Chinese Exclusion Act<\/strong> (1882) was the first nationality-based ban.","<strong>Jacob Riis<\/strong> (<em>How the Other Half Lives<\/em>), <strong>Jane Addams<\/strong> (Hull House), <strong>Tammany Hall / Boss Tweed<\/strong> (Nast cartoons).","<strong>Dawes Act<\/strong> (1887) broke up reservations into allotments. <strong>Wounded Knee<\/strong> (1890) ended the Indian wars. <strong>Little Bighorn<\/strong> (1876).","<strong>Turner's frontier thesis<\/strong> (1893): the frontier shaped American democracy, and it was now closed.","<strong>Pendleton Act<\/strong> (1883) came after Garfield's assassination and created merit-based civil service."],"timeline":[{"y":"1862","t":"Homestead Act; Morrill Land-Grant Act; Pacific Railway Act","key":false},{"y":"1869","t":"Transcontinental railroad completed at Promontory Point","key":true},{"y":"1871","t":"Treaty of Washington sends the Alabama claims to arbitration","key":false},{"y":"1873","t":"Twain and Warner publish <em>The Gilded Age<\/em>","key":false},{"y":"1876","t":"Battle of Little Bighorn; Bell's telephone","key":false},{"y":"1877","t":"Great Railroad Strike; Munn v. Illinois; Chief Joseph surrenders","key":true},{"y":"1879","t":"Edison's light bulb; Henry George's <em>Progress and Poverty<\/em>","key":false},{"y":"1881","t":"Garfield assassinated; <em>A Century of Dishonor<\/em>","key":false},{"y":"1882","t":"Chinese Exclusion Act; Standard Oil Trust organized","key":true},{"y":"1883","t":"Pendleton Civil Service Act; Brooklyn Bridge; standard time zones","key":true},{"y":"1886","t":"Haymarket bombing; AFL founded; Wabash v. Illinois","key":true},{"y":"1887","t":"Interstate Commerce Act; Dawes Severalty Act","key":true},{"y":"1889","t":"Hull House founded; Carnegie's \"Gospel of Wealth\"; Pan-American Conference","key":false},{"y":"1890","t":"Sherman Antitrust Act; Wounded Knee; <em>How the Other Half Lives<\/em>; census declares the frontier closed","key":true},{"y":"1892","t":"Homestead Strike; Ellis Island opens","key":false},{"y":"1893","t":"Turner's frontier thesis; Chicago World's Fair","key":false},{"y":"1894","t":"Pullman Strike","key":true},{"y":"1895","t":"U.S. v. E.C. Knight weakens the Sherman Act","key":false},{"y":"1901","t":"J.P. Morgan forms U.S. Steel","key":false}],"cards":[{"id":"u2c01","f":"Vertical integration","b":"Controlling every stage of production, from raw materials to the finished product. Carnegie Steel is the classic example."},{"id":"u2c02","f":"Horizontal integration","b":"Buying up or merging with competitors in the same industry. Rockefeller's Standard Oil is the classic example."},{"id":"u2c03","f":"Trust","b":"Stockholders of competing firms hand control to one board of trustees, creating a near-monopoly (Standard Oil, 1882)."},{"id":"u2c04","f":"Social Darwinism","b":"Herbert Spencer and William Graham Sumner applied \"survival of the fittest\" to society. Wealth was proof of fitness, so government should not help the poor."},{"id":"u2c05","f":"Gospel of Wealth (1889)","b":"Carnegie's essay: the rich are trustees of their wealth and should give it away for public good. \"The man who dies thus rich dies disgraced.\""},{"id":"u2c06","f":"Henry George, <em>Progress and Poverty<\/em> (1879)","b":"Argued that poverty grows alongside progress. Proposed a \"single tax\" on land values."},{"id":"u2c07","f":"Edward Bellamy, <em>Looking Backward<\/em> (1888)","b":"Utopian novel of a cooperative socialist America in 2000. Inspired Nationalist Clubs."},{"id":"u2c08","f":"Thorstein Veblen","b":"Economist who coined \"conspicuous consumption\" (<em>The Theory of the Leisure Class<\/em>, 1899)."},{"id":"u2c09","f":"Munn v. Illinois (1877)","b":"States may regulate private businesses that serve the public interest (grain elevators). A Granger victory."},{"id":"u2c10","f":"Wabash v. Illinois (1886)","b":"States cannot regulate interstate railroad rates. This led to the Interstate Commerce Act."},{"id":"u2c11","f":"Interstate Commerce Act (1887)","b":"Required \"reasonable and just\" railroad rates. Created the ICC, the first federal regulatory agency."},{"id":"u2c12","f":"Sherman Antitrust Act (1890)","b":"Banned combinations \"in restraint of trade.\" Weakened by U.S. v. E.C. Knight (1895) and used against unions."},{"id":"u2c13","f":"Knights of Labor","b":"Terence Powderly's inclusive union (unskilled, women, Black workers). Declined after Haymarket (1886)."},{"id":"u2c14","f":"American Federation of Labor (1886)","b":"Samuel Gompers. Skilled craft unions focused on \"bread and butter\": wages, hours, conditions."},{"id":"u2c15","f":"Haymarket Riot (1886)","b":"A bomb exploded at a Chicago eight-hour-day rally. Anarchists were blamed, and anti-union backlash followed."},{"id":"u2c16","f":"Homestead Strike (1892)","b":"Carnegie Steel lockout. Frick hired Pinkertons, militia crushed the union."},{"id":"u2c17","f":"Pullman Strike (1894)","b":"Debs's American Railway Union boycott. Cleveland sent federal troops using a court injunction. Debs jailed."},{"id":"u2c18","f":"New Immigrants","b":"Post-1880 immigrants from southern and eastern Europe (Italians, Poles, Russian Jews). Mostly Catholic, Jewish, or Orthodox."},{"id":"u2c19","f":"Chinese Exclusion Act (1882)","b":"First federal law barring immigration by nationality. Renewed and made permanent until 1943."},{"id":"u2c20","f":"Political machine","b":"Urban party organization (Tammany Hall, Boss Tweed) trading jobs and services for votes. Riddled with graft."},{"id":"u2c21","f":"Jacob Riis","b":"Photojournalist whose <em>How the Other Half Lives<\/em> (1890) exposed New York tenement life."},{"id":"u2c22","f":"Settlement houses","b":"Community centers in immigrant neighborhoods run by middle-class reformers (Jane Addams's Hull House, 1889)."},{"id":"u2c23","f":"Social Gospel","b":"Protestant movement (Walter Rauschenbusch) applying Christian ethics to urban poverty and labor problems."},{"id":"u2c24","f":"Pendleton Act (1883)","b":"After Garfield's assassination by an office-seeker. Created the merit-based civil service and competitive exams."},{"id":"u2c25","f":"Mugwumps","b":"Reform Republicans who backed Democrat Grover Cleveland in 1884 over the scandal-tainted Blaine."},{"id":"u2c26","f":"Dawes Severalty Act (1887)","b":"Divided reservations into individual allotments to assimilate Native Americans. They lost about two-thirds of their land."},{"id":"u2c27","f":"Battle of Little Bighorn (1876)","b":"Lakota and Cheyenne under Sitting Bull and Crazy Horse defeated Custer's 7th Cavalry."},{"id":"u2c28","f":"Wounded Knee (1890)","b":"Army massacre of about 250 Lakota after alarm over the Ghost Dance. Ended armed Plains resistance."},{"id":"u2c29","f":"Helen Hunt Jackson","b":"Author of <em>A Century of Dishonor<\/em> (1881), an exposé of U.S. broken treaties with Native Americans."},{"id":"u2c30","f":"Frederick Jackson Turner","b":"\"Frontier thesis\" (1893): the frontier experience shaped American democracy and individualism, and it had now closed."},{"id":"u2c31","f":"Realism / Naturalism","b":"Realism showed everyday life (Twain, Howells). Naturalism showed people shaped by harsh forces (Crane, Dreiser, London)."}]},{"n":3,"title":"Populism, Empire, and the Progressive Era","years":"1890–1914","period":"early","weight":10,"minutes":13,"lesson":"<h2>The big picture<\/h2>\n<p>Three linked stories run from about 1890 to 1914. <strong>Farmers<\/strong> revolted against railroads, banks, and tight money, which created the <strong>Populist Party<\/strong>. The U.S. then <strong>went overseas<\/strong>, taking an empire in the Caribbean and Pacific. And middle-class <strong>Progressives<\/strong> tried to fix the problems of industrial society through government, from city hall to the Constitution. Many Populist demands became Progressive laws.<\/p>\n<h2>1. The farmers' revolt and the Populists<\/h2>\n<p>After the Civil War, farmers faced <strong>falling crop prices<\/strong>, <strong>high railroad rates<\/strong>, and heavy <strong>debt<\/strong>. Prices kept falling because the money supply did not keep up with economic growth. That is <strong>deflation<\/strong>, and it made debts harder to repay. Farmers organized in stages:<\/p>\n<ul><li>the <strong>Grange<\/strong> (1867), which won state railroad laws (see Unit 2)<\/li><li>the <strong>Farmers' Alliances<\/strong> (1880s), including a separate <strong>Colored Farmers' Alliance<\/strong>, which created cooperatives<\/li><li>the <strong>People's (Populist) Party<\/strong> in 1892<\/li><\/ul>\n<p>The Populists' <strong>Omaha Platform<\/strong> (1892) demanded:<\/p>\n<ul><li><strong>free and unlimited coinage of silver<\/strong> at 16 to 1, to inflate the currency<\/li><li>a <strong>graduated income tax<\/strong><\/li><li><strong>government ownership of railroads and telegraphs<\/strong><\/li><li><strong>direct election of U.S. senators<\/strong><\/li><li>the secret ballot and an eight-hour day for government workers<\/li><\/ul>\n<p>Their candidate, James B. Weaver, won over a million votes. Speakers like <strong>Mary Elizabeth Lease<\/strong> (\"raise less corn and more hell\") energized the movement.<\/p>\n<p>The <strong>Panic of 1893<\/strong> brought the worst depression yet. Unemployment soared, and <strong>Coxey's Army<\/strong> of jobless men marched on Washington (1894). The money question took over politics. <strong>\"Silverites\"<\/strong> wanted silver coinage to raise prices. <strong>\"Goldbugs\"<\/strong> (bankers, the Northeast) wanted the <strong>gold standard<\/strong>.<\/p>\n<h3>The election of 1896<\/h3>\n<p>At the Democratic convention, <strong>William Jennings Bryan<\/strong> electrified delegates with his <strong>\"Cross of Gold\"<\/strong> speech: \"You shall not crucify mankind upon a cross of gold.\" Democrats and Populists both nominated Bryan, a <strong>fusion<\/strong> that effectively ended the Populist Party as an independent force. Republican <strong>William McKinley<\/strong>, backed by <strong>Mark Hanna's<\/strong> massive corporate-funded campaign, won with the support of the industrial Northeast and Midwest and urban workers. The 1896 election was a <strong>realigning election<\/strong>: Republicans dominated national politics until 1932. The <strong>Gold Standard Act<\/strong> (1900) settled the money issue.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Deflation, debt, and railroad rates<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Farmers' Alliances → Populist Party; Bryan's 1896 campaign<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Populists defeated, but many of their ideas (income tax, direct election of senators) are adopted by Progressives<\/div><\/div>\n<h2>2. The new empire<\/h2>\n<p>Why did a nation born in anti-colonial revolution take colonies? The motives fall into four groups:<\/p>\n<ul><li><strong>Markets:<\/strong> business wanted outlets for surplus goods.<\/li><li><strong>Sea power:<\/strong> Captain <strong>Alfred Thayer Mahan<\/strong> (<em>The Influence of Sea Power upon History<\/em>, 1890) argued that great nations need a modern navy, coaling stations, and colonies.<\/li><li><strong>Racial and religious mission:<\/strong> Social Darwinism and Anglo-Saxon superiority (Josiah Strong) blended with missionary zeal.<\/li><li><strong>The closed frontier:<\/strong> with the frontier gone, some looked outward.<\/li><\/ul>\n<p><strong>Hawaii:<\/strong> American sugar planters led the overthrow of <strong>Queen Liliuokalani<\/strong> in 1893. President Cleveland refused to annex the islands, but they were annexed in <strong>1898<\/strong> under McKinley.<\/p>\n<h3>The Spanish-American War (1898)<\/h3>\n<p>Cubans revolted against Spain in 1895. Spanish General Weyler's brutal <strong>\"reconcentration\" camps<\/strong> were sensationalized by the <strong>yellow press<\/strong> of <strong>William Randolph Hearst<\/strong> and <strong>Joseph Pulitzer<\/strong>. In February 1898 the <strong>de Lôme letter<\/strong> insulted McKinley, and then the battleship <strong>USS Maine<\/strong> exploded in Havana harbor. \"Remember the Maine!\" became the rallying cry. Congress declared war, but the <strong>Teller Amendment<\/strong> promised the U.S. would <strong>not annex Cuba<\/strong>.<\/p>\n<p>The war lasted about four months. <strong>Commodore Dewey<\/strong> destroyed the Spanish fleet at <strong>Manila Bay<\/strong> in the Philippines. <strong>Theodore Roosevelt's Rough Riders<\/strong> charged up San Juan (Kettle) Hill in Cuba. Secretary of State John Hay called it a <strong>\"splendid little war.\"<\/strong> In the <strong>Treaty of Paris<\/strong> (1898), Spain gave the U.S. <strong>Puerto Rico, Guam, and the Philippines<\/strong> (for $20 million), and Cuba became nominally independent.<\/p>\n<p>The <strong>Anti-Imperialist League<\/strong>, whose members included Mark Twain, Andrew Carnegie, and Jane Addams, argued that colonies violated the principle of government by consent. Filipinos led by <strong>Emilio Aguinaldo<\/strong> had expected independence. The brutal <strong>Philippine-American War<\/strong> (1899–1902) cost thousands of American lives and far more Filipino lives.<\/p>\n<p>Afterward the U.S. built controls over its new sphere:<\/p>\n<ul><li>The <strong>Platt Amendment<\/strong> (1901) made Cuba a <strong>protectorate<\/strong>: the U.S. could intervene and got a naval base at <strong>Guantánamo Bay<\/strong>.<\/li><li>In the <strong>Insular Cases<\/strong> (1901), the Supreme Court ruled that the Constitution does not automatically apply in full to the territories (\"the Constitution does not follow the flag\").<\/li><li>The <strong>Open Door Notes<\/strong> (1899–1900) from <strong>John Hay<\/strong> asked the powers to keep <strong>China<\/strong> open to equal trade and to respect China's territorial integrity. The U.S. sent troops to help crush the anti-foreign <strong>Boxer Rebellion<\/strong> (1900).<\/li><\/ul>\n<h3>Roosevelt, Taft, and Wilson abroad<\/h3>\n<p><strong>Theodore Roosevelt<\/strong>: \"Speak softly and carry a <strong>big stick<\/strong>.\"<\/p>\n<ul><li><strong>Panama Canal:<\/strong> When Colombia balked at a treaty, the U.S. backed a <strong>Panamanian revolution<\/strong> (1903) and got the Canal Zone. The canal opened in <strong>1914<\/strong>.<\/li><li><strong>Roosevelt Corollary<\/strong> (1904) to the Monroe Doctrine: the U.S. would act as an <strong>\"international police power\"<\/strong> in Latin America to keep European creditors out, starting in the Dominican Republic.<\/li><li>He mediated the end of the <strong>Russo-Japanese War<\/strong> (Treaty of Portsmouth, 1905) and won the <strong>Nobel Peace Prize<\/strong>.<\/li><li>The <strong>Gentlemen's Agreement<\/strong> (1907): Japan limited emigration of laborers, and San Francisco reversed its segregation of Japanese schoolchildren.<\/li><li>The <strong>Great White Fleet<\/strong> (1907–09) showed off U.S. naval power around the world.<\/li><\/ul>\n<p><strong>William Howard Taft<\/strong>: <strong>\"Dollar Diplomacy\"<\/strong>, which meant using investment rather than force to gain influence, though Marines still landed in Nicaragua.<\/p>\n<p><strong>Woodrow Wilson<\/strong>: <strong>\"moral diplomacy\"<\/strong>, which in practice still meant intervention in Mexico, Haiti, and the Dominican Republic.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Search for markets, Mahan's sea power ideas, yellow journalism, the Maine<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Spanish-American War (1898)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>U.S. becomes a colonial power (Philippines, Puerto Rico, Guam); protectorate over Cuba; debate over imperialism<\/div><\/div>\n<h2>3. The Progressive Era (about 1900–1917)<\/h2>\n<p>Progressives were mostly <strong>urban, middle-class, educated<\/strong> reformers. They believed experts and an active government could fix the abuses of industrial capitalism, political corruption, and social disorder.<\/p>\n<h3>The muckrakers<\/h3>\n<p>Roosevelt called investigative journalists <strong>\"muckrakers.\"<\/strong> Their work built public pressure for reform:<\/p>\n<ul><li><strong>Lincoln Steffens<\/strong>, <em>The Shame of the Cities<\/em>: urban political corruption.<\/li><li><strong>Ida Tarbell<\/strong>, <em>The History of the Standard Oil Company<\/em>: Rockefeller's tactics.<\/li><li><strong>Upton Sinclair<\/strong>, <em>The Jungle<\/em> (1906): he aimed at workers' conditions in Chicago meatpacking, but the public reacted to the filthy meat. \"I aimed at the public's heart, and by accident I hit it in the stomach.\" The result was the <strong>Meat Inspection Act<\/strong> and the <strong>Pure Food and Drug Act<\/strong> (1906).<\/li><li>Photographer <strong>Lewis Hine<\/strong> documented child labor.<\/li><\/ul>\n<h3>Making government more democratic<\/h3>\n<ul><li>The <strong>secret (Australian) ballot<\/strong>.<\/li><li>The <strong>direct primary<\/strong>, letting voters rather than bosses pick nominees.<\/li><li>The <strong>initiative<\/strong> (citizens propose laws), the <strong>referendum<\/strong> (citizens vote on laws), and the <strong>recall<\/strong> (remove officials).<\/li><li>The <strong>Seventeenth Amendment<\/strong> (1913): <strong>direct election of senators<\/strong>.<\/li><li>Wisconsin governor <strong>Robert La Follette's \"Wisconsin Idea\"<\/strong> used university experts in government.<\/li><li>City commission and city-manager plans, first tried in Galveston, Texas, after the 1900 hurricane.<\/li><\/ul>\n<h3>Social justice<\/h3>\n<ul><li>The <strong>Triangle Shirtwaist Factory fire<\/strong> (1911) killed <strong>146<\/strong> garment workers, mostly young immigrant women, behind locked doors. It led to new New York safety laws.<\/li><li>In <strong>Lochner v. New York<\/strong> (1905) the Supreme Court struck down a limit on bakers' hours as a violation of \"liberty of contract.\" But in <strong>Muller v. Oregon<\/strong> (1908), it upheld maximum hours for <strong>women<\/strong>, persuaded by Louis <strong>Brandeis's<\/strong> brief full of social data.<\/li><li>Reformers like <strong>Florence Kelley<\/strong> fought child labor and won state laws.<\/li><li>The <strong>Anti-Saloon League<\/strong> pushed <strong>prohibition<\/strong>, which became the Eighteenth Amendment (1919).<\/li><li>Suffragists (NAWSA under <strong>Carrie Chapman Catt<\/strong>, and the more militant <strong>Alice Paul<\/strong>) pressed toward the Nineteenth Amendment (1920; see Unit 4).<\/li><\/ul>\n<p><strong>Race was Progressivism's blind spot.<\/strong> Disfranchisement and segregation spread in the South, often defended as \"reform.\" Wilson <strong>segregated the federal civil service<\/strong>. In response, <strong>W.E.B. Du Bois<\/strong> and others formed the <strong>Niagara Movement<\/strong> (1905) and then the interracial <strong>NAACP<\/strong> (1909), which fought through courts and publicity.<\/p>\n<p>On the left, the <strong>Industrial Workers of the World<\/strong> (IWW or \"Wobblies,\" 1905; Big Bill Haywood) sought one big union of all workers. <strong>Eugene Debs's Socialist Party<\/strong> won 6% of the vote in 1912.<\/p>\n<h3>The Progressive presidents<\/h3>\n<p><strong>Theodore Roosevelt (1901–1909)<\/strong>, the <strong>\"Square Deal\"<\/strong>:<\/p>\n<ul><li>He was the <strong>\"trust buster\"<\/strong> who sued the <strong>Northern Securities<\/strong> railroad holding company (upheld by the Court in 1904). He separated \"good\" from \"bad\" trusts.<\/li><li>In the <strong>1902 anthracite coal strike<\/strong> he forced arbitration. It was the first time a president intervened as a neutral party rather than for the owners.<\/li><li>The <strong>Hepburn Act<\/strong> (1906) strengthened the ICC.<\/li><li><strong>Conservation:<\/strong> with <strong>Gifford Pinchot<\/strong> he set aside national forests, wildlife refuges, and monuments, and backed the Newlands Reclamation Act (1902). Pinchot favored wise <em>use<\/em> of resources (conservation). <strong>John Muir<\/strong> (Sierra Club) wanted <em>preservation<\/em> of untouched wilderness.<\/li><\/ul>\n<p><strong>William Howard Taft (1909–1913)<\/strong>:<\/p>\n<ul><li>He brought more antitrust suits than TR, including the 1911 breakup of <strong>Standard Oil<\/strong>.<\/li><li>He angered progressives over the high <strong>Payne-Aldrich Tariff<\/strong> and the <strong>Ballinger-Pinchot<\/strong> dispute.<\/li><li>The <strong>Sixteenth Amendment<\/strong> (income tax) passed Congress under Taft and was ratified in 1913.<\/li><\/ul>\n<p><strong>Election of 1912<\/strong>: Roosevelt ran as the <strong>Progressive (\"Bull Moose\")<\/strong> candidate on <strong>\"New Nationalism\"<\/strong>, meaning accept big business but regulate it with strong federal power (inspired by Herbert Croly). Wilson's <strong>\"New Freedom\"<\/strong> aimed to break up trusts and restore competition. The Republican split elected <strong>Woodrow Wilson<\/strong>.<\/p>\n<p><strong>Wilson's reforms (1913–1916)<\/strong>:<\/p>\n<ul><li>the <strong>Underwood Tariff<\/strong> (lower rates plus the first modern <strong>income tax<\/strong>)<\/li><li>the <strong>Federal Reserve Act<\/strong> (1913), which created a central banking system to manage the money supply<\/li><li>the <strong>Clayton Antitrust Act<\/strong> (1914), which strengthened the Sherman Act and <strong>exempted labor unions<\/strong>. Gompers called it labor's \"Magna Carta.\"<\/li><li>the <strong>Federal Trade Commission<\/strong> (1914)<\/li><\/ul>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Muckrakers expose abuses; Populist ideas spread<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Progressive reforms at city, state, and federal levels<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>16th, 17th, 18th, 19th Amendments; regulatory agencies (FTC, Federal Reserve); expanded federal role<\/div><\/div>\n<h3>Ideas and culture<\/h3>\n<ul><li><strong>Pragmatism<\/strong> (<strong>William James<\/strong>, <strong>John Dewey<\/strong>) judged ideas by their practical results. Dewey promoted <strong>progressive education<\/strong>: \"learning by doing.\"<\/li><li>The <strong>Ashcan School<\/strong> painted gritty city scenes.<\/li><li>The <strong>Armory Show<\/strong> (1913) introduced Americans to European modern art.<\/li><\/ul>","mustknow":["<strong>Omaha Platform<\/strong> (1892): free silver, graduated income tax, government ownership of railroads, direct election of senators.","<strong>1896<\/strong>: Bryan's <strong>\"Cross of Gold\"<\/strong> speech; McKinley wins (Hanna's money); Populists absorbed. A realigning election.","<strong>Mahan<\/strong> (sea power) and <strong>yellow journalism<\/strong> (Hearst/Pulitzer) + <strong>USS Maine<\/strong> led to the <strong>Spanish-American War<\/strong> (1898).","<strong>Treaty of Paris (1898)<\/strong>: U.S. gets <strong>Puerto Rico, Guam, Philippines<\/strong>. <strong>Teller Amendment<\/strong> (no annexing Cuba) vs. <strong>Platt Amendment<\/strong> (Cuba protectorate, Guantánamo).","<strong>Open Door Notes<\/strong> (Hay, China). <strong>Roosevelt Corollary<\/strong> (U.S. as Latin American \"police power\"). <strong>Panama Canal<\/strong>. <strong>Dollar Diplomacy<\/strong> (Taft).","Muckrakers: <strong>Steffens<\/strong> (cities), <strong>Tarbell<\/strong> (Standard Oil), <strong>Sinclair<\/strong> (<em>The Jungle<\/em> → Meat Inspection and Pure Food and Drug Acts, 1906).","<strong>Initiative, referendum, recall, direct primary<\/strong>, <strong>17th Amendment<\/strong>; La Follette's Wisconsin Idea.","<strong>Muller v. Oregon<\/strong> (1908) upheld hours limits for women. <strong>Lochner<\/strong> (1905) struck down bakers' hours. <strong>Triangle fire<\/strong> (1911).","TR's <strong>Square Deal<\/strong>, trust busting (Northern Securities), conservation (Pinchot vs. Muir). <strong>1912<\/strong>: New Nationalism (TR) vs. <strong>New Freedom<\/strong> (Wilson).","Wilson: <strong>Federal Reserve<\/strong> (1913), <strong>Clayton Act<\/strong> (1914, protects unions), <strong>FTC<\/strong>, <strong>16th Amendment<\/strong> income tax. NAACP founded 1909."],"timeline":[{"y":"1890","t":"Mahan's <em>Influence of Sea Power upon History<\/em>; Sherman Silver Purchase Act","key":false},{"y":"1892","t":"Populist Omaha Platform","key":true},{"y":"1893","t":"Panic of 1893; Hawaiian queen Liliuokalani overthrown","key":false},{"y":"1894","t":"Coxey's Army marches on Washington","key":false},{"y":"1896","t":"Bryan's \"Cross of Gold\"; McKinley elected","key":true},{"y":"1898","t":"USS Maine explodes; Spanish-American War; Treaty of Paris; Hawaii annexed","key":true},{"y":"1899","t":"Open Door Notes; Philippine-American War begins","key":false},{"y":"1900","t":"Boxer Rebellion; Gold Standard Act","key":false},{"y":"1901","t":"McKinley assassinated, TR president; Platt Amendment; Insular Cases","key":true},{"y":"1902","t":"Anthracite coal strike arbitration; Newlands Reclamation Act","key":false},{"y":"1903","t":"Panama revolution; canal treaty","key":false},{"y":"1904","t":"Roosevelt Corollary; Northern Securities decision","key":true},{"y":"1905","t":"Lochner v. New York; Niagara Movement; IWW founded; Treaty of Portsmouth","key":false},{"y":"1906","t":"<em>The Jungle<\/em>; Meat Inspection Act; Pure Food and Drug Act; Hepburn Act","key":true},{"y":"1907","t":"Gentlemen's Agreement with Japan; Great White Fleet sails","key":false},{"y":"1908","t":"Muller v. Oregon","key":false},{"y":"1909","t":"NAACP founded","key":false},{"y":"1911","t":"Triangle Shirtwaist fire; Standard Oil broken up","key":false},{"y":"1912","t":"Wilson defeats TR (Bull Moose), Taft, and Debs","key":true},{"y":"1913","t":"16th and 17th Amendments; Federal Reserve Act; Underwood Tariff","key":true},{"y":"1914","t":"Clayton Antitrust Act; FTC; Panama Canal opens","key":false}],"cards":[{"id":"u3c01","f":"Omaha Platform (1892)","b":"Populist program: free silver (16:1), graduated income tax, government ownership of railroads and telegraphs, direct election of senators, secret ballot."},{"id":"u3c02","f":"Free silver","b":"Unlimited coinage of silver to expand the money supply and raise crop prices. Favored by indebted farmers and opposed by bankers (\"goldbugs\")."},{"id":"u3c03","f":"\"Cross of Gold\" speech (1896)","b":"William Jennings Bryan's call for free silver at the Democratic convention. Won him the Democratic and Populist nominations."},{"id":"u3c04","f":"Election of 1896","b":"McKinley (R) beat Bryan with Mark Hanna's funding and urban-industrial votes. Began Republican dominance until 1932 and ended the Populists."},{"id":"u3c05","f":"Alfred Thayer Mahan","b":"Naval officer whose <em>Influence of Sea Power upon History<\/em> (1890) urged a big navy, coaling stations, and colonies."},{"id":"u3c06","f":"Yellow journalism","b":"Sensational reporting (Hearst, Pulitzer) that inflamed opinion against Spain before 1898."},{"id":"u3c07","f":"Teller Amendment (1898)","b":"Pledged that the U.S. would not annex Cuba after the war."},{"id":"u3c08","f":"Platt Amendment (1901)","b":"Made Cuba a U.S. protectorate: the U.S. could intervene, and it got Guantánamo Bay."},{"id":"u3c09","f":"Treaty of Paris (1898)","b":"Ended the Spanish-American War. U.S. gained Puerto Rico, Guam, and the Philippines ($20 million)."},{"id":"u3c10","f":"Anti-Imperialist League","b":"Opponents of annexing the Philippines (Mark Twain, Andrew Carnegie, Jane Addams). Colonies violated consent of the governed."},{"id":"u3c11","f":"Philippine-American War (1899–1902)","b":"Filipino independence fighters under Emilio Aguinaldo resisted U.S. rule. A brutal counterinsurgency."},{"id":"u3c12","f":"Open Door Notes (1899–1900)","b":"John Hay asked the powers to allow equal trading rights in China and to preserve China's territorial integrity."},{"id":"u3c13","f":"Roosevelt Corollary (1904)","b":"Addition to the Monroe Doctrine: the U.S. would act as an \"international police power\" in Latin America."},{"id":"u3c14","f":"Dollar Diplomacy","b":"Taft's policy of using American investment to gain influence in Latin America and East Asia."},{"id":"u3c15","f":"Muckrakers","b":"Investigative journalists: Lincoln Steffens (city corruption), Ida Tarbell (Standard Oil), Upton Sinclair (<em>The Jungle<\/em>)."},{"id":"u3c16","f":"<em>The Jungle<\/em> (1906)","b":"Upton Sinclair's novel about Chicago meatpacking. Led to the Meat Inspection Act and the Pure Food and Drug Act."},{"id":"u3c17","f":"Initiative, referendum, recall","b":"Initiative: citizens propose laws. Referendum: citizens vote on laws. Recall: citizens remove officials early."},{"id":"u3c18","f":"Seventeenth Amendment (1913)","b":"Direct popular election of U.S. senators (previously chosen by state legislatures)."},{"id":"u3c19","f":"Muller v. Oregon (1908)","b":"Upheld maximum working hours for women, using Louis Brandeis's sociological brief."},{"id":"u3c20","f":"Triangle Shirtwaist fire (1911)","b":"146 garment workers died behind locked doors in New York. Spurred workplace safety laws."},{"id":"u3c21","f":"Square Deal","b":"TR's program: control corporations, consumer protection, conservation. A fair deal for labor, business, and the public."},{"id":"u3c22","f":"Conservation vs. preservation","b":"Gifford Pinchot: managed \"wise use\" of resources. John Muir (Sierra Club): preserve wilderness untouched."},{"id":"u3c23","f":"New Nationalism vs. New Freedom (1912)","b":"TR: accept big business and regulate it strongly. Wilson: break up trusts and restore competition."},{"id":"u3c24","f":"Federal Reserve Act (1913)","b":"Created a central banking system of 12 regional banks to manage the money supply."},{"id":"u3c25","f":"Clayton Antitrust Act (1914)","b":"Strengthened antitrust law and exempted labor unions and farm cooperatives. Gompers called it labor's \"Magna Carta.\""},{"id":"u3c26","f":"NAACP (1909)","b":"Interracial civil rights organization (Du Bois and others). Used lawsuits and publicity against discrimination."}]},{"n":4,"title":"World War I and the 1920s","years":"1914–1929","period":"late","weight":10,"minutes":12,"lesson":"<h2>The big picture<\/h2>\n<p>The United States tried to stay neutral in the Great War, then joined it in 1917. It helped win, but the Senate <strong>rejected the peace treaty<\/strong>. At home the war brought propaganda, limits on dissent, and the <strong>Great Migration<\/strong>, then a postwar <strong>Red Scare<\/strong>. The 1920s were an age of <strong>prosperity, mass culture, and modern values<\/strong>. They were also an age of fierce <strong>backlash<\/strong>: immigration restriction, a reborn Ku Klux Klan, Prohibition, and the Scopes trial. The CLEP exam loves the <strong>cultural conflicts of the 1920s<\/strong>.<\/p>\n<h2>1. From neutrality to war (1914–1917)<\/h2>\n<p>When war broke out in Europe in 1914, <strong>Woodrow Wilson<\/strong> declared neutrality and asked Americans to be \"impartial in thought as well as in action.\" But neutrality tilted toward the Allies:<\/p>\n<ul><li>Americans shared language and ties with Britain.<\/li><li>U.S. <strong>trade and loans<\/strong> to the Allies (Britain and France) far exceeded those to Germany, since Britain's naval <strong>blockade<\/strong> cut off German trade.<\/li><li>Germany struck back with <strong>submarine (U-boat) warfare<\/strong>. In May 1915 a U-boat sank the British liner <strong>Lusitania<\/strong>, killing 128 Americans. After more sinkings, Germany promised in the <strong>Sussex Pledge<\/strong> (1916) not to sink merchant ships without warning.<\/li><\/ul>\n<p>Wilson won reelection in 1916 on the slogan <strong>\"He kept us out of war.\"<\/strong> Then events in early 1917 pushed the U.S. in:<\/p>\n<ul><li>In January, Germany resumed <strong>unrestricted submarine warfare<\/strong>.<\/li><li>The <strong>Zimmermann Telegram<\/strong> was intercepted. In it, Germany proposed that <strong>Mexico<\/strong> join a war against the U.S. in exchange for recovering Texas, New Mexico, and Arizona.<\/li><li>The <strong>Russian Revolution<\/strong> (March 1917) toppled the czar, so the Allies looked more democratic.<\/li><\/ul>\n<p>In April 1917 Congress declared war so the world might be <strong>\"made safe for democracy.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Unrestricted U-boat warfare + Zimmermann Telegram + economic ties to the Allies<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>U.S. declares war (April 1917)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Fresh American troops help the Allies win by November 1918<\/div><\/div>\n<h2>2. The home front<\/h2>\n<p>Total war meant an active federal government:<\/p>\n<ul><li>The <strong>Selective Service Act<\/strong> (1917) drafted about 2.8 million men.<\/li><li>The <strong>War Industries Board<\/strong> (Bernard Baruch) coordinated production.<\/li><li>The <strong>Food Administration<\/strong> under <strong>Herbert Hoover<\/strong> relied on <em>voluntary<\/em> conservation (\"meatless Mondays\").<\/li><li><strong>Liberty Bonds<\/strong> financed the war.<\/li><li>The <strong>Committee on Public Information<\/strong> (<strong>George Creel<\/strong>) produced propaganda to build support.<\/li><\/ul>\n<p>Civil liberties suffered. The <strong>Espionage Act<\/strong> (1917) and <strong>Sedition Act<\/strong> (1918) punished antiwar speech, and Socialist <strong>Eugene Debs<\/strong> went to prison for an antiwar speech. In <strong>Schenck v. United States<\/strong> (1919), Justice Oliver Wendell Holmes upheld these limits with the <strong>\"clear and present danger\"<\/strong> test. Anti-German hysteria followed: schools dropped German classes, and sauerkraut became \"liberty cabbage.\"<\/p>\n<p>The war opened opportunities. Factory jobs and the end of European immigration drew hundreds of thousands of Black southerners north in the <strong>Great Migration<\/strong> to Chicago, Detroit, New York, and other cities. Women took industrial jobs. Their war service helped win the <strong>Nineteenth Amendment<\/strong> (1920): <strong>woman suffrage<\/strong>. Moderate suffragists under <strong>Carrie Chapman Catt<\/strong> lobbied, while <strong>Alice Paul's<\/strong> National Woman's Party picketed the White House.<\/p>\n<p><strong>General John J. Pershing's<\/strong> American Expeditionary Force arrived in strength in 1918 and fought at Château-Thierry, Belleau Wood, and the <strong>Meuse-Argonne<\/strong>. The <strong>armistice<\/strong> came on <strong>November 11, 1918<\/strong>. About 116,000 Americans died, many from the <strong>1918 influenza pandemic<\/strong>, which killed roughly 675,000 Americans at home and in the service.<\/p>\n<h2>3. The fight over the peace<\/h2>\n<p>Wilson's <strong>Fourteen Points<\/strong> (January 1918) laid out his vision:<\/p>\n<ul><li>open diplomacy and freedom of the seas<\/li><li>free trade and arms reduction<\/li><li><strong>national self-determination<\/strong> for peoples of the old empires<\/li><li>a <strong>League of Nations<\/strong> to keep the peace<\/li><\/ul>\n<p>At Paris, the other Allies wanted revenge. The <strong>Treaty of Versailles<\/strong> forced Germany to accept a <strong>war guilt clause<\/strong> and pay heavy <strong>reparations<\/strong>. Wilson accepted these compromises to get the League included.<\/p>\n<p>In the Senate, <strong>Henry Cabot Lodge<\/strong> and the <strong>\"reservationists\"<\/strong> objected that <strong>Article X<\/strong> (collective security) could drag the U.S. into wars without Congress's approval. The <strong>\"irreconcilables\"<\/strong> opposed the treaty completely. Wilson refused to compromise, went on a speaking tour, and suffered a <strong>stroke<\/strong>. The Senate <strong>rejected<\/strong> the treaty, and the U.S. <strong>never joined the League<\/strong>.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Wilson's idealism (Fourteen Points) vs. Allied demands and Senate fears about Article X<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Senate rejects the Treaty of Versailles<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>U.S. stays out of the League of Nations; a weaker League; American turn toward \"isolationism\"<\/div><\/div>\n<h2>4. Postwar reaction (1919–1920s)<\/h2>\n<p>In 1919 a huge <strong>strike wave<\/strong> hit the country, including the <strong>Seattle general strike<\/strong> and the <strong>Boston police strike<\/strong>, which Governor Calvin Coolidge broke. Anarchist <strong>bombings<\/strong> followed. Fear of Bolshevism produced the <strong>Red Scare<\/strong>. Attorney General <strong>A. Mitchell Palmer's<\/strong> <strong>Palmer Raids<\/strong> (1919–1920) rounded up thousands of suspected radicals, many of them immigrants, and deported hundreds.<\/p>\n<p>The <strong>Sacco and Vanzetti<\/strong> case showed the same mood. Two Italian immigrant anarchists were convicted of murder on weak evidence and executed in 1927.<\/p>\n<p>Racial violence exploded in the <strong>\"Red Summer\" of 1919<\/strong>, with a deadly riot in Chicago, and in the <strong>Tulsa Race Massacre<\/strong> (1921), where a white mob destroyed the prosperous Black Greenwood district.<\/p>\n<p><strong>Nativism<\/strong> became law:<\/p>\n<ul><li>The <strong>Emergency Quota Act<\/strong> (1921) set the first national-origins quotas.<\/li><li>The <strong>National Origins Act (Immigration Act of 1924)<\/strong> set quotas at <strong>2% of each nationality as of the 1890 census<\/strong>. This deliberately favored northern and western Europeans, cut immigration from southern and eastern Europe, and <strong>barred Japanese and other Asian immigrants<\/strong>.<\/li><\/ul>\n<p>A <strong>second Ku Klux Klan<\/strong>, revived in 1915 and inspired by the film <em>The Birth of a Nation<\/em>, grew to millions of members by the mid-1920s. It was strong in the <strong>Midwest<\/strong> (Indiana) as well as the South. It targeted <strong>Catholics, Jews, and immigrants<\/strong> as well as African Americans, then collapsed amid scandal.<\/p>\n<h2>5. The politics of \"normalcy\"<\/h2>\n<p><strong>Warren G. Harding<\/strong> won in 1920 promising a <strong>\"return to normalcy.\"<\/strong> His administration was marred by the <strong>Teapot Dome<\/strong> scandal: Interior Secretary <strong>Albert Fall<\/strong> took bribes to lease naval oil reserves to private companies. <strong>Calvin Coolidge<\/strong> (\"the chief business of the American people is business\") and Treasury Secretary <strong>Andrew Mellon<\/strong> cut taxes on the wealthy, kept tariffs high, and favored business.<\/p>\n<p>Farmers did not share the boom. Crop prices collapsed after the war. Coolidge vetoed the <strong>McNary-Haugen<\/strong> farm relief bills. In 1928 <strong>Herbert Hoover<\/strong> beat <strong>Al Smith<\/strong>, the first Catholic major-party nominee, partly because of anti-Catholic and anti-\"wet\" (anti-Prohibition) feeling.<\/p>\n<p>Abroad, the U.S. avoided alliances but stayed active:<\/p>\n<ul><li>The <strong>Washington Naval Conference<\/strong> (1921–22) produced the Five-Power Treaty, which limited battleship tonnage.<\/li><li>The <strong>Dawes Plan<\/strong> (1924) used U.S. loans to help Germany pay reparations.<\/li><li>The <strong>Kellogg-Briand Pact<\/strong> (1928) renounced war \"as an instrument of national policy.\" It was idealistic and had no enforcement.<\/li><\/ul>\n<h2>6. The new economy and mass culture<\/h2>\n<p>The 1920s economy boomed on <strong>consumer goods<\/strong>. <strong>Henry Ford's<\/strong> moving <strong>assembly line<\/strong> (1913) made the <strong>Model T<\/strong> affordable, and the <strong>automobile<\/strong> reshaped the country: suburbs, roads, motels, oil, rubber, and steel. <strong>Electricity<\/strong> spread, bringing radios, vacuum cleaners, and refrigerators. <strong>Advertising<\/strong> and <strong>installment buying<\/strong> (credit) encouraged people to spend. But income inequality widened, and many families bought on credit, weaknesses that mattered after 1929.<\/p>\n<p>Mass culture created shared national experiences:<\/p>\n<ul><li><strong>Radio<\/strong>, starting with the first commercial station, KDKA, in 1920.<\/li><li><strong>Movies<\/strong>, including the first \"talkie,\" <em>The Jazz Singer<\/em> (1927).<\/li><li><strong>Spectator sports<\/strong>, with heroes like Babe Ruth.<\/li><li><strong>Charles Lindbergh's<\/strong> solo flight across the Atlantic (1927).<\/li><\/ul>\n<p>The <strong>\"flapper\"<\/strong>, a young woman with bobbed hair and short skirts who smoked and danced, symbolized new freedoms. <strong>Margaret Sanger<\/strong> campaigned for birth control. <strong>Alice Paul<\/strong> proposed an <strong>Equal Rights Amendment<\/strong> in 1923.<\/p>\n<h2>7. Culture wars: the modern vs. the traditional<\/h2>\n<p><strong>Prohibition<\/strong> (the <strong>Eighteenth Amendment<\/strong>, 1919, enforced by the <strong>Volstead Act<\/strong>) banned the manufacture and sale of alcohol. It cut drinking somewhat, but it bred <strong>speakeasies<\/strong>, <strong>bootlegging<\/strong>, and <strong>organized crime<\/strong> (Al Capone in Chicago). It was repealed by the <strong>Twenty-first Amendment<\/strong> in 1933.<\/p>\n<p>In the <strong>Scopes \"Monkey\" Trial<\/strong> (1925), Tennessee teacher <strong>John Scopes<\/strong> was tried for teaching <strong>evolution<\/strong> in violation of state law. <strong>Clarence Darrow<\/strong> defended him, and <strong>William Jennings Bryan<\/strong> helped prosecute. Scopes was convicted (later overturned on a technicality). Urban newspapers, especially <strong>H.L. Mencken's<\/strong>, mocked the <strong>fundamentalists<\/strong>, and the trial became a symbol of the clash between rural religious tradition and urban modernism.<\/p>\n<h2>8. The Harlem Renaissance and the Lost Generation<\/h2>\n<p>The Great Migration made <strong>Harlem<\/strong> the capital of Black America and the center of the <strong>Harlem Renaissance<\/strong>:<\/p>\n<ul><li><strong>Langston Hughes<\/strong>, poetry and jazz rhythms (\"The Negro Speaks of Rivers\")<\/li><li><strong>Zora Neale Hurston<\/strong>, folklore and fiction<\/li><li><strong>Claude McKay<\/strong>, poetry (\"If We Must Die\")<\/li><li><strong>Countee Cullen<\/strong>, poetry<\/li><li><strong>Alain Locke<\/strong>, editor of <em>The New Negro<\/em> (1925)<\/li><li>jazz and blues from <strong>Louis Armstrong<\/strong>, <strong>Duke Ellington<\/strong>, and <strong>Bessie Smith<\/strong><\/li><\/ul>\n<p><strong>Marcus Garvey's<\/strong> <strong>Universal Negro Improvement Association (UNIA)<\/strong> preached <strong>Black pride<\/strong>, economic independence, and a <strong>\"Back to Africa\"<\/strong> movement. It drew mass support before Garvey was convicted of mail fraud and deported.<\/p>\n<p>White writers disillusioned by the war and by middle-class materialism formed the <strong>\"Lost Generation\"<\/strong>, a term from Gertrude Stein. Many lived abroad in Paris:<\/p>\n<ul><li><strong>Ernest Hemingway<\/strong>: <em>The Sun Also Rises<\/em>, <em>A Farewell to Arms<\/em><\/li><li><strong>F. Scott Fitzgerald<\/strong>: <em>The Great Gatsby<\/em> (1925), a portrait of Jazz Age excess<\/li><li><strong>Sinclair Lewis<\/strong>: <em>Main Street<\/em> and <em>Babbitt<\/em>, satirizing small-town conformity and boosterism. He became the first American to win the Nobel Prize in Literature.<\/li><li><strong>T.S. Eliot<\/strong>: <em>The Waste Land<\/em><\/li><\/ul>","mustknow":["Road to war: <strong>Lusitania<\/strong> (1915), <strong>Sussex Pledge<\/strong>, renewed <strong>unrestricted submarine warfare<\/strong> and the <strong>Zimmermann Telegram<\/strong> (1917).","Home front: <strong>War Industries Board<\/strong>, <strong>Committee on Public Information<\/strong> (Creel), <strong>Espionage and Sedition Acts<\/strong>. <strong>Schenck<\/strong> = \"clear and present danger.\"","<strong>Great Migration<\/strong> of Black southerners to northern cities began during WWI.","<strong>Fourteen Points<\/strong> (self-determination, League of Nations). Senate (Lodge, <strong>Article X<\/strong>) rejected Versailles. U.S. never joined the League.","<strong>Red Scare / Palmer Raids<\/strong> (1919–20); <strong>Sacco and Vanzetti<\/strong>.","<strong>Immigration Act of 1924<\/strong>: national-origins quotas (2% of 1890) favoring northern and western Europe and excluding Asians.","<strong>Second KKK<\/strong>: anti-Black, anti-Catholic, anti-Jewish, anti-immigrant; strong in the Midwest.","<strong>Scopes Trial<\/strong> (1925): evolution, Darrow vs. Bryan, fundamentalism vs. modernism. <strong>Prohibition<\/strong> (18th; repealed by the 21st in 1933).","<strong>Harlem Renaissance<\/strong> (Hughes, Hurston, Locke) and <strong>Garvey's UNIA<\/strong>. <strong>Lost Generation<\/strong> (Hemingway, Fitzgerald, Lewis).","1920s politics: <strong>Harding<\/strong> (Teapot Dome), <strong>Coolidge<\/strong> (pro-business), <strong>Kellogg-Briand Pact<\/strong>, <strong>Washington Naval Conference<\/strong>. <strong>19th Amendment<\/strong> (1920)."],"timeline":[{"y":"1914","t":"War begins in Europe; Wilson declares neutrality","key":false},{"y":"1915","t":"Lusitania sunk; second KKK founded; <em>The Birth of a Nation<\/em>","key":false},{"y":"1916","t":"Sussex Pledge; Wilson reelected (\"He kept us out of war\")","key":false},{"y":"1917","t":"Unrestricted U-boat warfare; Zimmermann Telegram; U.S. declares war (April); Espionage Act","key":true},{"y":"1918","t":"Fourteen Points; Sedition Act; flu pandemic; armistice Nov. 11","key":true},{"y":"1919","t":"Treaty of Versailles; Senate rejects it; 18th Amendment; Red Summer; Schenck decision; strike wave","key":true},{"y":"1919–20","t":"Red Scare and Palmer Raids","key":false},{"y":"1920","t":"19th Amendment (woman suffrage); Harding elected; KDKA radio","key":true},{"y":"1921","t":"Emergency Quota Act; Tulsa Race Massacre; Washington Naval Conference begins","key":false},{"y":"1923","t":"Teapot Dome exposed; Harding dies, Coolidge president; ERA proposed","key":false},{"y":"1924","t":"Immigration (National Origins) Act; Dawes Plan; Indian Citizenship Act","key":true},{"y":"1925","t":"Scopes Trial; <em>The Great Gatsby<\/em>; <em>The New Negro<\/em>","key":true},{"y":"1927","t":"Lindbergh's flight; <em>The Jazz Singer<\/em>; Sacco and Vanzetti executed","key":false},{"y":"1928","t":"Kellogg-Briand Pact; Hoover defeats Al Smith","key":false}],"cards":[{"id":"u4c01","f":"Lusitania (1915)","b":"British liner sunk by a German U-boat. 128 Americans died, and U.S. opinion turned against Germany."},{"id":"u4c02","f":"Sussex Pledge (1916)","b":"Germany's promise not to sink merchant ships without warning. Broken in 1917."},{"id":"u4c03","f":"Zimmermann Telegram (1917)","b":"German proposal that Mexico join a war against the U.S. to regain Texas, New Mexico, and Arizona. Helped bring the U.S. into WWI."},{"id":"u4c04","f":"Committee on Public Information","b":"George Creel's WWI propaganda agency that \"sold\" the war to Americans."},{"id":"u4c05","f":"Espionage and Sedition Acts (1917–18)","b":"Punished interference with the war and criticism of the government. Debs was jailed under them."},{"id":"u4c06","f":"Schenck v. United States (1919)","b":"Upheld the Espionage Act: speech posing a \"clear and present danger\" can be restricted (Holmes)."},{"id":"u4c07","f":"War Industries Board","b":"Bernard Baruch's WWI agency coordinating industrial production. An early model of the managed economy."},{"id":"u4c08","f":"Great Migration","b":"Movement of Black southerners to northern and midwestern cities, beginning around WWI, for jobs and to escape Jim Crow."},{"id":"u4c09","f":"Fourteen Points (1918)","b":"Wilson's peace plan: open diplomacy, freedom of the seas, free trade, arms reduction, self-determination, League of Nations."},{"id":"u4c10","f":"Treaty of Versailles / Article X","b":"The Senate (Lodge) feared Article X's collective security would commit the U.S. to wars. The treaty was rejected, and the U.S. never joined the League."},{"id":"u4c11","f":"Red Scare (1919–20)","b":"Postwar fear of communists and anarchists. Palmer Raids arrested thousands and deported hundreds."},{"id":"u4c12","f":"Sacco and Vanzetti","b":"Italian immigrant anarchists executed in 1927 after a controversial murder trial. A symbol of 1920s nativism."},{"id":"u4c13","f":"Immigration Act of 1924","b":"National-origins quotas (2% of 1890 census) favoring northern and western Europe. Barred Japanese and other Asian immigration."},{"id":"u4c14","f":"Second Ku Klux Klan","b":"Revived in 1915. Millions of members by the mid-1920s, strong in the Midwest. Anti-Black, anti-Catholic, anti-Jewish, anti-immigrant."},{"id":"u4c15","f":"Nineteenth Amendment (1920)","b":"Women's right to vote nationwide. Catt's NAWSA lobbied, and Alice Paul's National Woman's Party protested."},{"id":"u4c16","f":"Teapot Dome","b":"Harding-era scandal: Interior Secretary Albert Fall took bribes for leasing federal oil reserves."},{"id":"u4c17","f":"Kellogg-Briand Pact (1928)","b":"Signatories renounced war as an instrument of national policy. No enforcement."},{"id":"u4c18","f":"Washington Naval Conference (1921–22)","b":"Treaties limiting battleship tonnage among the U.S., Britain, Japan, France, and Italy."},{"id":"u4c19","f":"Scopes Trial (1925)","b":"Tennessee teacher tried for teaching evolution. Darrow vs. Bryan. Fundamentalism vs. modernism."},{"id":"u4c20","f":"Prohibition","b":"18th Amendment (1919) and the Volstead Act banned alcohol. It led to speakeasies, bootlegging, and organized crime. Repealed by the 21st Amendment (1933)."},{"id":"u4c21","f":"Harlem Renaissance","b":"1920s flowering of Black art, literature, and music in Harlem: Langston Hughes, Zora Neale Hurston, Alain Locke, Duke Ellington."},{"id":"u4c22","f":"Marcus Garvey / UNIA","b":"Black nationalist leader who promoted racial pride, Black-owned businesses, and \"Back to Africa.\""},{"id":"u4c23","f":"Lost Generation","b":"Writers disillusioned by WWI and materialism: Hemingway, Fitzgerald (<em>The Great Gatsby<\/em>), Sinclair Lewis (<em>Babbitt<\/em>), T.S. Eliot."},{"id":"u4c24","f":"Flapper","b":"Symbol of the 1920s \"New Woman\": bobbed hair, short skirts, jazz, and independence."},{"id":"u4c25","f":"Assembly line / Model T","b":"Henry Ford's moving assembly line (1913) made cars affordable and transformed the economy and suburbs."},{"id":"u4c26","f":"Installment buying","b":"Buying on credit with monthly payments. Fueled 1920s consumer spending and household debt."}]},{"n":5,"title":"The Great Depression and the New Deal","years":"1929–1941","period":"late","weight":10,"minutes":12,"lesson":"<h2>The big picture<\/h2>\n<p>The Great Depression was the worst economic collapse in American history. By 1933 about <strong>one worker in four was unemployed<\/strong>, thousands of banks had failed, and national output had fallen by roughly a third. <strong>Herbert Hoover<\/strong> responded with limited, mostly voluntary measures. <strong>Franklin D. Roosevelt's New Deal<\/strong> created a much larger federal government that provided <strong>relief, recovery, and reform<\/strong> (the \"<strong>three R's<\/strong>\"). The New Deal did not end the Depression; World War II did. But it permanently changed what Americans expect from Washington: Social Security, bank deposit insurance, union rights, and federal economic management.<\/p>\n<h2>1. Causes of the Depression<\/h2>\n<p>The <strong>stock market crash<\/strong> of October 1929 (<strong>\"Black Tuesday,\"<\/strong> October 29) was the trigger, not the only cause. The underlying weaknesses were:<\/p>\n<ul><li><strong>Unequal distribution of income.<\/strong> Wages lagged behind productivity, so workers could not buy all the goods factories produced (<strong>overproduction / underconsumption<\/strong>).<\/li><li><strong>Speculation and buying stocks \"on margin\"<\/strong>, with borrowed money. When prices fell, margin calls forced more selling.<\/li><li><strong>A weak banking system.<\/strong> Thousands of small, unregulated banks had <strong>no deposit insurance<\/strong>, so <strong>bank runs<\/strong> spread panic. About 9,000 banks failed between 1930 and 1933.<\/li><li><strong>A long farm depression<\/strong> and heavy consumer debt from installment buying.<\/li><li><strong>A fragile international economy.<\/strong> War debts and reparations were recycled through American loans. When U.S. lending stopped, Europe collapsed too.<\/li><li><strong>Policy mistakes.<\/strong> The <strong>Hawley-Smoot Tariff<\/strong> (1930) raised rates to record highs, other nations retaliated, and world trade shrank. The Federal Reserve let the money supply contract.<\/li><\/ul>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Unequal income, margin buying, weak banks, high tariffs<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Crash of 1929 and banking panics (1930–33)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Mass unemployment (~25% in 1933), shrinking output, and a demand for federal action<\/div><\/div>\n<h2>2. Hoover's response<\/h2>\n<p>Hoover was not idle, but he believed in <strong>\"rugged individualism\"<\/strong> and <strong>voluntarism<\/strong>. He asked business leaders to keep wages up and urged private charity and local governments to handle relief. He opposed direct federal payments to individuals. His main tools:<\/p>\n<ul><li>The <strong>Reconstruction Finance Corporation (RFC, 1932)<\/strong> lent money to <strong>banks, railroads, and large businesses<\/strong>, on the theory that aid would \"trickle down.\"<\/li><li>A one-year <strong>moratorium<\/strong> on war debt and reparations payments (1931).<\/li><\/ul>\n<p>Shantytowns of the homeless became known as <strong>\"Hoovervilles.\"<\/strong> In 1932 the <strong>Bonus Army<\/strong>, about 15,000 to 20,000 World War I veterans demanding early payment of a promised bonus, camped in Washington. Hoover had the army, under <strong>Douglas MacArthur<\/strong>, drive them out with tanks and tear gas. Hoover's reputation collapsed, and <strong>FDR<\/strong> won the 1932 election in a landslide.<\/p>\n<h2>3. The First New Deal (1933–1934)<\/h2>\n<p>\"The only thing we have to fear is fear itself,\" Roosevelt said in his inaugural address. Advised by his <strong>\"Brain Trust\"<\/strong> of professors, he moved fast during the <strong>Hundred Days<\/strong>. He explained his programs directly to the public in radio <strong>\"fireside chats.\"<\/strong><\/p>\n<p><strong>Banking and finance (reform):<\/strong><\/p>\n<ul><li>A national <strong>bank holiday<\/strong> and the <strong>Emergency Banking Act<\/strong> reopened sound banks under federal supervision.<\/li><li>The <strong>Glass-Steagall Act<\/strong> (1933) separated commercial and investment banking and created the <strong>FDIC<\/strong>, which <strong>insures bank deposits<\/strong>. Bank runs essentially ended.<\/li><li>The <strong>Securities and Exchange Commission (SEC, 1934)<\/strong> regulated the stock market.<\/li><li>The U.S. went <strong>off the gold standard<\/strong>.<\/li><\/ul>\n<p><strong>Relief:<\/strong><\/p>\n<ul><li>The <strong>Civilian Conservation Corps (CCC)<\/strong> put young men to work planting forests and building parks.<\/li><li>The <strong>Federal Emergency Relief Administration<\/strong> (Harry Hopkins) gave grants to the states.<\/li><li>The <strong>Home Owners' Loan Corporation<\/strong> refinanced mortgages.<\/li><\/ul>\n<p><strong>Recovery:<\/strong><\/p>\n<ul><li>The <strong>Agricultural Adjustment Act (AAA)<\/strong> <strong>paid farmers to reduce production<\/strong> to raise crop prices. Critics were horrified that crops and livestock were destroyed while people went hungry, and payments helped landowners more than tenants and sharecroppers.<\/li><li>The <strong>National Industrial Recovery Act (NIRA)<\/strong> created the <strong>NRA<\/strong>, which let industries write \"codes of fair competition\" setting prices, wages, and hours. Its <strong>Section 7(a)<\/strong> guaranteed workers the right to organize. NIRA also created the <strong>Public Works Administration (PWA)<\/strong>.<\/li><li>The <strong>Tennessee Valley Authority (TVA)<\/strong> built dams to provide flood control and <strong>cheap public electricity<\/strong> to one of the poorest regions. It was the boldest experiment in government-owned regional planning.<\/li><\/ul>\n<p>Also in 1933, the <strong>Twenty-first Amendment<\/strong> repealed Prohibition.<\/p>\n<h2>4. Critics left and right<\/h2>\n<p>The <strong>American Liberty League<\/strong> (1934), backed by wealthy business leaders, called the New Deal socialism. Critics on the other side said it did too little:<\/p>\n<ul><li>Louisiana senator <strong>Huey Long's \"Share Our Wealth\"<\/strong> plan proposed confiscating great fortunes to guarantee every family a home and an income. Long was assassinated in 1935.<\/li><li><strong>Father Charles Coughlin<\/strong>, a \"radio priest,\" attacked bankers and drifted into antisemitism.<\/li><li><strong>Dr. Francis Townsend<\/strong> proposed $200 monthly pensions for the elderly, pressure that helped produce Social Security.<\/li><\/ul>\n<p>The <strong>Supreme Court<\/strong> struck down key First New Deal laws:<\/p>\n<ul><li><strong>Schechter Poultry v. U.S.<\/strong> (1935, the \"sick chicken\" case) killed the NIRA.<\/li><li><strong>U.S. v. Butler<\/strong> (1936) struck down the AAA's processing tax.<\/li><\/ul>\n<h2>5. The Second New Deal (1935–1938)<\/h2>\n<p>Pushed by these critics and by the Court, Roosevelt moved toward <strong>reform and security<\/strong>:<\/p>\n<ul><li><strong>Works Progress Administration (WPA)<\/strong> (Hopkins): employed millions building roads, schools, and airports. Its <strong>Federal Writers', Art, Theatre, and Music Projects<\/strong> employed artists and writers.<\/li><li><strong>Social Security Act (1935)<\/strong>: <strong>old-age pensions<\/strong> funded by payroll taxes, <strong>unemployment insurance<\/strong>, and aid to dependent children and the disabled. At first it <strong>excluded farm and domestic workers<\/strong>, which left out many African Americans and women.<\/li><li><strong>Wagner Act (National Labor Relations Act, 1935)<\/strong>: guaranteed workers' right to <strong>organize and bargain collectively<\/strong> and created the <strong>National Labor Relations Board (NLRB)<\/strong>. It is labor's most important New Deal victory.<\/li><li><strong>Rural Electrification Administration<\/strong>: brought power lines to farms.<\/li><li><strong>Revenue Act of 1935<\/strong>: the \"wealth tax\" raised top income tax rates.<\/li><li><strong>Fair Labor Standards Act (1938)<\/strong>: the first federal <strong>minimum wage<\/strong>, a standard workweek (phased down to 40 hours) with overtime pay, and a ban on most <strong>child labor<\/strong>.<\/li><\/ul>\n<h3>Labor's surge<\/h3>\n<p>The <strong>Congress of Industrial Organizations (CIO)<\/strong>, led by <strong>John L. Lewis<\/strong>, organized whole <strong>industries<\/strong>, skilled and unskilled together, in autos, steel, and rubber. This put it at odds with the craft-based AFL. The <strong>sit-down strike<\/strong> at General Motors in <strong>Flint, Michigan<\/strong> (1936–37) won recognition of the United Auto Workers. Union membership roughly tripled during the decade.<\/p>\n<h3>Politics of the New Deal<\/h3>\n<p>Roosevelt won a landslide in 1936 with the <strong>New Deal coalition<\/strong>: urban workers, union members, immigrants and their children, Catholics and Jews, <strong>African Americans<\/strong> (who shifted from the party of Lincoln), white southerners, and intellectuals. This coalition kept Democrats dominant for decades.<\/p>\n<p>Then Roosevelt overreached. His <strong>\"court-packing\" plan<\/strong> (1937) asked to add up to six new justices. Even allies called it an attack on judicial independence, and Congress rejected it. But the Court began upholding New Deal laws, starting with <strong>West Coast Hotel v. Parrish<\/strong> (1937), the \"switch in time that saved nine.\"<\/p>\n<p>Roosevelt cut spending in 1937, and the economy fell back into the <strong>\"Roosevelt recession\"<\/strong> (1937–38). This seemed to support British economist <strong>John Maynard Keynes<\/strong>, who argued that government <strong>deficit spending<\/strong> should replace missing private demand during downturns. By 1938 a conservative coalition of Republicans and southern Democrats had stalled new reforms. <strong>Massive WWII spending<\/strong> finally ended the Depression.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Depression, plus pressure from the left and Court defeats<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Second New Deal: WPA, Social Security, Wagner Act<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Lasting welfare state, union power, the New Deal coalition, and a much larger federal role<\/div><\/div>\n<h2>6. Society in the Depression<\/h2>\n<ul><li><strong>The Dust Bowl.<\/strong> Drought plus years of over-plowing on the southern Great Plains produced massive dust storms. Hundreds of thousands of <strong>\"Okies\"<\/strong> went west to California, where they found low-paid migrant work. <strong>John Steinbeck's<\/strong> <em>The Grapes of Wrath<\/em> (1939) told their story. <strong>Dorothea Lange's<\/strong> photograph \"Migrant Mother,\" taken for the Farm Security Administration, became the Depression's iconic image.<\/li><li><strong>African Americans<\/strong> were often \"last hired, first fired,\" and New Deal programs were sometimes administered in discriminatory ways, especially in the South. Still, FDR's informal <strong>\"Black Cabinet\"<\/strong> (including <strong>Mary McLeod Bethune<\/strong>) and <strong>Eleanor Roosevelt's<\/strong> advocacy brought new attention. In 1939 Eleanor Roosevelt helped arrange <strong>Marian Anderson's<\/strong> concert at the <strong>Lincoln Memorial<\/strong> after the DAR barred her from Constitution Hall. The <strong>Scottsboro Boys<\/strong> case (1931), nine Black youths falsely accused of rape in Alabama, exposed southern injustice.<\/li><li><strong>Mexican Americans<\/strong>: during the <strong>repatriation<\/strong> campaigns, hundreds of thousands of Mexicans and Mexican Americans, many of them U.S. citizens, were pressured or forced to leave for Mexico.<\/li><li><strong>Native Americans<\/strong>: the <strong>Indian Reorganization Act (1934)<\/strong>, pushed by <strong>John Collier<\/strong>, ended allotment and encouraged <strong>tribal self-government<\/strong>, reversing the Dawes Act.<\/li><li><strong>Women<\/strong>: <strong>Frances Perkins<\/strong> became the <strong>first woman cabinet member<\/strong> (Secretary of Labor). Many married women faced pressure to leave jobs to men.<\/li><\/ul>\n<h2>7. Culture and diplomacy<\/h2>\n<p>Americans sought <strong>escape<\/strong> at the movies: <em>Gone with the Wind<\/em> and <em>The Wizard of Oz<\/em> (both 1939), and Disney's <em>Snow White<\/em>. They also listened to <strong>radio<\/strong> (Orson Welles's <em>War of the Worlds<\/em> broadcast of 1938 caused a stir), <strong>swing<\/strong> music, and comic books (Superman, 1938).<\/p>\n<p>Other artists documented hard times:<\/p>\n<ul><li>The <strong>social realism<\/strong> of Steinbeck and FSA photographers<\/li><li>James Agee and Walker Evans's <em>Let Us Now Praise Famous Men<\/em><\/li><li>Richard Wright's <em>Native Son<\/em> (1940)<\/li><li><strong>Regionalist<\/strong> painting such as <strong>Grant Wood's<\/strong> <em>American Gothic<\/em><\/li><\/ul>\n<p>Abroad, FDR announced the <strong>Good Neighbor Policy<\/strong> toward Latin America: no more armed intervention. The U.S. gave up its Platt Amendment rights in Cuba (1934). The U.S. also <strong>recognized the Soviet Union<\/strong> (1933).<\/p>","mustknow":["Causes: <strong>unequal income/underconsumption<\/strong>, <strong>margin buying<\/strong>, <strong>weak banks<\/strong>, farm slump, <strong>Hawley-Smoot Tariff<\/strong>, international debt. The Crash (<strong>Oct. 1929<\/strong>) was the trigger.","<strong>Hoover<\/strong>: voluntarism, <strong>RFC<\/strong> (loans to banks and business), opposed direct relief. <strong>Bonus Army<\/strong> (1932) dispersed by MacArthur.","The three R's: <strong>Relief, Recovery, Reform<\/strong>.","First New Deal: <strong>Emergency Banking Act<\/strong>, <strong>FDIC<\/strong> (Glass-Steagall), <strong>SEC<\/strong>, <strong>CCC<\/strong>, <strong>AAA<\/strong> (pay farmers to cut output), <strong>NIRA/NRA<\/strong>, <strong>TVA<\/strong>.","Critics: <strong>Huey Long<\/strong> (Share Our Wealth), <strong>Coughlin<\/strong>, <strong>Townsend<\/strong> (pensions), <strong>American Liberty League<\/strong> (right).","Court: <strong>Schechter<\/strong> (1935) killed the NIRA; <strong>Butler<\/strong> (1936) killed the AAA. <strong>Court-packing<\/strong> failed (1937).","Second New Deal: <strong>WPA<\/strong>, <strong>Social Security Act<\/strong>, <strong>Wagner Act<\/strong> (collective bargaining, NLRB), <strong>Fair Labor Standards Act<\/strong> (1938, minimum wage).","<strong>CIO<\/strong> (industrial unions, John L. Lewis) vs. AFL (craft). <strong>Flint sit-down strike<\/strong>.","<strong>New Deal coalition<\/strong> (incl. African Americans switching to the Democrats). <strong>Keynes<\/strong>: deficit spending.","<strong>Dust Bowl<\/strong> → <em>Grapes of Wrath<\/em>; <strong>Indian Reorganization Act<\/strong>; <strong>Frances Perkins<\/strong>; <strong>Good Neighbor Policy<\/strong>."],"timeline":[{"y":"1929","t":"Stock market crash (Black Tuesday, Oct. 29)","key":true},{"y":"1930","t":"Hawley-Smoot Tariff; bank failures spread","key":false},{"y":"1931","t":"Hoover debt moratorium; Scottsboro case","key":false},{"y":"1932","t":"Reconstruction Finance Corporation; Bonus Army routed; FDR elected","key":true},{"y":"1933","t":"Hundred Days: bank holiday, CCC, AAA, NIRA, TVA, FDIC; 21st Amendment; Good Neighbor Policy","key":true},{"y":"1934","t":"SEC created; Indian Reorganization Act; American Liberty League","key":false},{"y":"1935","t":"Second New Deal: WPA, Social Security Act, Wagner Act; Schechter decision; Huey Long assassinated; CIO formed","key":true},{"y":"1936","t":"U.S. v. Butler; FDR landslide reelection; Flint sit-down strike begins","key":false},{"y":"1937","t":"Court-packing plan fails; West Coast Hotel v. Parrish; \"Roosevelt recession\"","key":false},{"y":"1938","t":"Fair Labor Standards Act; <em>War of the Worlds<\/em> broadcast","key":true},{"y":"1939","t":"<em>The Grapes of Wrath<\/em>; Marian Anderson at the Lincoln Memorial","key":false}],"cards":[{"id":"u5c01","f":"Black Tuesday (Oct. 29, 1929)","b":"The worst day of the stock market crash. It triggered, but did not by itself cause, the Great Depression."},{"id":"u5c02","f":"Buying on margin","b":"Buying stock with borrowed money. It inflated the 1920s bubble and magnified losses in the crash."},{"id":"u5c03","f":"Hawley-Smoot Tariff (1930)","b":"Record-high tariff. Other countries retaliated, and world trade shrank, deepening the Depression."},{"id":"u5c04","f":"Reconstruction Finance Corporation (1932)","b":"Hoover's agency lending to banks, railroads, and big business. \"Trickle-down\" relief."},{"id":"u5c05","f":"Bonus Army (1932)","b":"WWI veterans who camped in Washington demanding early bonus payment. Driven out by the army under MacArthur."},{"id":"u5c06","f":"Hoovervilles","b":"Shantytowns of homeless people during the early Depression, named mockingly for Hoover."},{"id":"u5c07","f":"Hundred Days (1933)","b":"FDR's first burst of legislation: banking reform, CCC, AAA, NIRA, TVA, and more."},{"id":"u5c08","f":"FDIC","b":"Federal Deposit Insurance Corporation (Glass-Steagall Act, 1933). Insures bank deposits and ended bank runs."},{"id":"u5c09","f":"SEC (1934)","b":"Securities and Exchange Commission. Regulates the stock market to prevent fraud and manipulation."},{"id":"u5c10","f":"CCC","b":"Civilian Conservation Corps. Employed young men in reforestation, parks, and flood control."},{"id":"u5c11","f":"AAA (1933)","b":"Agricultural Adjustment Act. Paid farmers to reduce production to raise prices. Struck down in U.S. v. Butler (1936)."},{"id":"u5c12","f":"NIRA / NRA (1933)","b":"Industry codes on prices, wages, and hours. Section 7(a) union rights. Struck down in Schechter Poultry (1935)."},{"id":"u5c13","f":"TVA","b":"Tennessee Valley Authority. Federal dams providing electricity, flood control, and development in a poor region."},{"id":"u5c14","f":"Huey Long","b":"Louisiana senator whose \"Share Our Wealth\" plan proposed redistributing great fortunes. Assassinated in 1935."},{"id":"u5c15","f":"WPA (1935)","b":"Works Progress Administration. Millions of public works jobs, plus federal arts, writers', and theater projects."},{"id":"u5c16","f":"Social Security Act (1935)","b":"Old-age pensions, unemployment insurance, and aid to dependent children. Initially excluded farm and domestic workers."},{"id":"u5c17","f":"Wagner Act (1935)","b":"National Labor Relations Act. Guaranteed the right to unionize and bargain collectively. Created the NLRB."},{"id":"u5c18","f":"Fair Labor Standards Act (1938)","b":"First federal minimum wage, 40-hour workweek standard, and a ban on most child labor."},{"id":"u5c19","f":"CIO","b":"Congress of Industrial Organizations (John L. Lewis). Organized whole industries (autos, steel), including unskilled workers."},{"id":"u5c20","f":"Court-packing plan (1937)","b":"FDR's failed proposal to add up to six justices. The Court began upholding New Deal laws anyway."},{"id":"u5c21","f":"New Deal coalition","b":"Urban workers, unions, immigrants, Catholics, Jews, African Americans, white southerners, and intellectuals voting Democratic."},{"id":"u5c22","f":"Keynesian economics","b":"John Maynard Keynes: government deficit spending can boost demand and fight depressions."},{"id":"u5c23","f":"Dust Bowl","b":"1930s drought and over-plowing on the southern Plains. Okies migrated to California (<em>The Grapes of Wrath<\/em>)."},{"id":"u5c24","f":"Indian Reorganization Act (1934)","b":"\"Indian New Deal\" (John Collier). Ended allotment and restored tribal self-government."},{"id":"u5c25","f":"Frances Perkins","b":"Secretary of Labor and the first woman in a presidential cabinet. Key architect of Social Security."},{"id":"u5c26","f":"Good Neighbor Policy","b":"FDR's pledge of non-intervention in Latin America. Gave up Platt Amendment rights (1934)."}]},{"n":6,"title":"World War II","years":"1939–1945","period":"late","weight":8,"minutes":11,"lesson":"<h2>The big picture<\/h2>\n<p>In the 1930s Americans were determined to stay out of another European war, and Congress passed strict <strong>Neutrality Acts<\/strong>. As Germany, Italy, and Japan conquered their neighbors, <strong>Franklin Roosevelt<\/strong> moved the country step by step from neutrality to <strong>\"arsenal of democracy\"<\/strong> to open war after <strong>Pearl Harbor<\/strong> (December 7, 1941). The war ended the Depression, transformed the home front, opened jobs to women and minorities, and saw the <strong>internment of Japanese Americans<\/strong>. It left the U.S. a <strong>superpower<\/strong> holding the <strong>atomic bomb<\/strong>.<\/p>\n<h2>1. Isolationism in the 1930s<\/h2>\n<p>Disillusionment with World War I ran deep. The <strong>Nye Committee<\/strong> (1934–36) suggested that bankers and arms makers, the <strong>\"merchants of death,\"<\/strong> had dragged the U.S. into that war for profit. Congress responded with the <strong>Neutrality Acts<\/strong> (1935–37):<\/p>\n<ul><li><strong>no arms sales or loans<\/strong> to nations at war<\/li><li>no travel by Americans on belligerent ships<\/li><li>after 1937, <strong>\"cash-and-carry\"<\/strong>: warring nations could buy non-military goods if they paid cash and carried them away in their own ships<\/li><\/ul>\n<p>Meanwhile aggression spread:<\/p>\n<ul><li><strong>Japan<\/strong> seized <strong>Manchuria<\/strong> (1931) and invaded <strong>China<\/strong> (1937).<\/li><li><strong>Italy<\/strong> conquered <strong>Ethiopia<\/strong> (1935).<\/li><li><strong>Germany<\/strong> under Hitler rearmed, took Austria, and took Czechoslovakia's Sudetenland after the <strong>Munich Conference<\/strong> (1938). There Britain and France practiced <strong>appeasement<\/strong>.<\/li><\/ul>\n<p>Roosevelt's <strong>\"Quarantine Speech\"<\/strong> (1937) suggested isolating aggressors but drew a hostile reaction.<\/p>\n<h2>2. From neutrality to \"arsenal of democracy\" (1939–1941)<\/h2>\n<p>Germany invaded <strong>Poland<\/strong> on <strong>September 1, 1939<\/strong>, and Britain and France declared war. Roosevelt took a series of steps toward the Allies:<\/p>\n<ul><li><strong>1939:<\/strong> Congress allowed <strong>cash-and-carry for arms<\/strong>, which favored Britain and France since they controlled the seas.<\/li><li><strong>1940:<\/strong> After <strong>France fell<\/strong> (June), Britain stood nearly alone. The <strong>destroyers-for-bases deal<\/strong> traded 50 old U.S. destroyers for leases on British bases. Congress passed the <strong>first peacetime draft<\/strong> (Selective Training and Service Act).<\/li><li><strong>The debate:<\/strong> The <strong>America First Committee<\/strong> (with <strong>Charles Lindbergh<\/strong>) argued for staying out. Interventionists such as the <strong>Committee to Defend America by Aiding the Allies<\/strong> answered them.<\/li><li><strong>Election of 1940:<\/strong> FDR won an unprecedented <strong>third term<\/strong> over Wendell Willkie. He pledged to make America the <strong>\"arsenal of democracy.\"<\/strong><\/li><li><strong>January 1941:<\/strong> The <strong>Four Freedoms<\/strong> speech named the goals: freedom of <strong>speech<\/strong> and of <strong>worship<\/strong>, freedom <strong>from want<\/strong> and <strong>from fear<\/strong>.<\/li><li><strong>March 1941:<\/strong> The <strong>Lend-Lease Act<\/strong> let the president lend or lease war supplies to any nation whose defense was vital to the U.S. It went first to Britain and later to the <strong>Soviet Union<\/strong>. This ended any pretense of neutrality.<\/li><li><strong>August 1941:<\/strong> FDR and Churchill issued the <strong>Atlantic Charter<\/strong>: no territorial gains, <strong>self-determination<\/strong>, free trade, and a future system of collective security. It previewed the United Nations.<\/li><li><strong>Fall 1941:<\/strong> U.S. warships escorted convoys and fought an <strong>undeclared naval war<\/strong> with German U-boats in the Atlantic.<\/li><\/ul>\n<p>In the Pacific, Japan moved into French Indochina. In July 1941 the U.S. <strong>froze Japanese assets<\/strong> and imposed an <strong>oil embargo<\/strong>. Negotiations failed. On <strong>December 7, 1941<\/strong>, Japan attacked the U.S. fleet at <strong>Pearl Harbor<\/strong>, Hawaii, killing about 2,400 Americans. Roosevelt called it \"a date which will live in infamy.\" Congress declared war on Japan, and Germany and Italy declared war on the U.S. days later.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Axis aggression; U.S. aid to Britain (Lend-Lease); oil embargo on Japan<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Japan attacks Pearl Harbor (Dec. 7, 1941)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>U.S. enters the war against Japan, Germany, and Italy<\/div><\/div>\n<h2>3. Fighting the war<\/h2>\n<p>The Allies chose a <strong>\"Europe first\"<\/strong> strategy, because Germany was considered the greater threat.<\/p>\n<p><strong>Europe and North Africa:<\/strong><\/p>\n<ul><li><strong>North Africa<\/strong> (Operation Torch, late 1942), then <strong>Sicily and Italy<\/strong> (1943).<\/li><li>The Soviets broke the German advance at <strong>Stalingrad<\/strong> (1942–43), at enormous cost.<\/li><li><strong>D-Day<\/strong> (<strong>June 6, 1944<\/strong>): <strong>Dwight D. Eisenhower<\/strong> commanded the largest amphibious invasion in history at <strong>Normandy<\/strong>, opening a western front.<\/li><li>Germany's last offensive, the <strong>Battle of the Bulge<\/strong> (December 1944), failed.<\/li><li>Germany surrendered on <strong>V-E Day<\/strong>, <strong>May 8, 1945<\/strong>. Allied troops liberating the camps revealed the full horror of the <strong>Holocaust<\/strong>, the Nazi murder of six million Jews and millions of others.<\/li><\/ul>\n<p><strong>The Pacific:<\/strong><\/p>\n<ul><li>Early disasters included the fall of the Philippines and the <strong>Bataan Death March<\/strong> (1942).<\/li><li>At <strong>Midway<\/strong> (<strong>June 1942<\/strong>), U.S. carriers sank four Japanese carriers. Midway was the <strong>turning point<\/strong> of the Pacific war.<\/li><li>The U.S. then
