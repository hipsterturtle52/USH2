<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEP US History II</title>
<meta name="description" content="Self-paced study guide for the CLEP History of the United States II exam: lessons, quizzes, flashcards, practice exams.">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --surface2:#f2f0ea; --ink:#1d232a; --muted:#5d6670; --line:#dedad0;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --good:#24774a; --good-soft:#e2f2e8; --bad:#b03a2e; --bad-soft:#f8e3e0; --warn:#9a6a00; --warn-soft:#fbf0d4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
  --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
  --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
  --shadow:none; color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
    --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
    --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
    --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{max-width:860px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;text-decoration:none;color:var(--ink);font-size:1.02rem;letter-spacing:.01em}
.brand small{font-weight:500;color:var(--muted)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
nav.tabs{max-width:860px;margin:0 auto;padding:6px 12px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:999px;font-size:.9rem}
nav.tabs a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;line-height:1.25;margin:.2em 0 .5em}
h2{font-size:1.25rem;margin:1.6em 0 .5em}
h3{font-size:1.05rem;margin:1.3em 0 .4em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>span{background:var(--good)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:.92rem}
/* lesson */
.lesson{font-family:var(--serif);font-size:1.08rem;line-height:1.7}
.lesson h2{font-family:var(--sans)}
.lesson h3{font-family:var(--sans)}
.lesson p{margin:.7em 0}
.lesson strong{font-weight:700}
.lesson ul{padding-left:1.2em}
.cec{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin:14px 0;font-family:var(--sans);font-size:.88rem}
.cec div.b{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.cec div.b b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cec .ar{align-self:center;color:var(--muted)}
@media (max-width:600px){.cec{grid-template-columns:1fr}.cec .ar{transform:rotate(90deg);justify-self:center}}
.mustknow{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 16px}
.mustknow ol{margin:.3em 0;padding-left:1.3em}
.mustknow li{margin:.35em 0}
/* timeline */
.tl{position:relative;margin:10px 0 10px 6px;padding-left:22px;border-left:2px solid var(--line)}
.tl .ev{position:relative;margin:0 0 12px}
.tl .ev::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl .ev.key::before{background:var(--accent);border-color:var(--accent)}
.tl .yr{font-weight:700;font-variant-numeric:tabular-nums;margin-right:8px}
.tl .ev.key .yr{color:var(--accent)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stem{font-size:1.07rem;font-weight:500;margin:6px 0 12px}
.stim{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-family:var(--serif);font-size:1rem}
.stim table{font-family:var(--sans);font-size:.88rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;align-items:flex-start}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt .ex{display:block;font-size:.88rem;color:var(--muted);margin-top:4px}
.opt.right .ex,.opt.wrong .ex{color:var(--ink)}
.opt[disabled]{cursor:default}
.kbd{font:600 .75rem var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface2)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;margin-top:10px}
.navgrid button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:4px 0;font:inherit;font-size:.75rem;cursor:pointer}
.navgrid button.ans{background:var(--accent-soft);color:var(--ink)}
.navgrid button.cur{outline:2px solid var(--accent)}
.navgrid button.flag{border-color:var(--warn);border-width:2px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.timer.low{color:var(--bad)}
/* flashcards */
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;padding:28px 20px;cursor:pointer;user-select:none}
.fc .back{font-size:1.02rem;font-family:var(--serif);line-height:1.6}
.boxes{display:flex;gap:6px;align-items:flex-end;height:70px;margin:8px 0}
.boxes div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;position:relative;opacity:.85}
.boxlbl{display:flex;gap:6px}.boxlbl span{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
/* readiness */
.meter{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dial{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;flex:none}
.dial span{background:var(--surface);width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
.dial small{font-size:.65rem;color:var(--muted);font-weight:600;text-transform:uppercase}
/* cheat sheet */
.cheat{font-size:.82rem;line-height:1.35;columns:2 300px;column-gap:20px}
.cheat section{break-inside:avoid;margin:0 0 12px}
.cheat h3{margin:.2em 0 .3em;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.cheat table{font-size:.78rem}
.cheat td,.cheat th{padding:2px 4px}
.cheat ul{margin:0;padding-left:1em}
.cheat.memo .m{filter:blur(5px);cursor:pointer;transition:filter .15s}
.cheat.memo .m.show{filter:none}
.kbdhint{font-size:.8rem;color:var(--muted);margin-top:10px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.plan td:first-child{white-space:nowrap}
.tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media print{
  header.top,.noprint,.banner{display:none!important}
  body{background:#fff;color:#000;font-size:10pt}
  main{max-width:none;padding:0}
  .card{border:none;box-shadow:none;padding:0;margin:0}
  .cheat{columns:3;column-gap:12px;font-size:6.6pt;line-height:1.22}
  .cheat h3{font-size:7pt;color:#000;margin:0 0 1px}
  .cheat table{font-size:6.3pt}
  .cheat section{margin:0 0 5px}
  .cheat.memo .m{filter:none}
  .printhead{font-size:9pt;margin:0 0 4px}
  @page{size:letter;margin:.35in}
}
</style>

tizens and guaranteed them \"equal protection of the laws\"?","st":"","o":["The Fifteenth Amendment","The Nineteenth Amendment","The Sixteenth Amendment","The Thirteenth Amendment","The Fourteenth Amendment"],"e":["The Fifteenth Amendment (1870) dealt with voting rights, not citizenship.","The Nineteenth Amendment (1920) guaranteed women's suffrage.","The Sixteenth Amendment (1913) authorized a federal income tax.","The Thirteenth Amendment (1865) abolished slavery but did not define citizenship.","Ratified in 1868, the Fourteenth Amendment defined national citizenship and barred states from denying due process or equal protection."],"a":4},{"id":"u1q02","u":1,"th":"pol","d":"e","pool":"A","s":"The Fifteenth Amendment (1870) prohibited states from denying the right to vote on the basis of","st":"","o":["race, color, or previous condition of servitude","sex","age, for citizens 18 or older","failure to pay a poll tax","literacy"],"e":["This is the amendment's exact wording. It aimed to protect Black men's suffrage.","Sex was deliberately left out, which angered woman suffrage leaders. Women won the vote only with the Nineteenth Amendment in 1920.","The voting age was lowered to 18 by the Twenty-sixth Amendment (1971).","Poll taxes in federal elections were banned only by the Twenty-fourth Amendment (1964).","The Fifteenth Amendment said nothing about literacy, which is why southern states could later use literacy tests."],"a":0},{"id":"u1q03","u":1,"th":"pol","d":"m","pool":"B","s":"Congress passed the Reconstruction Acts of 1867 mainly in response to which of the following?","st":"","o":["Southern states' passage of Black Codes and their refusal to ratify the Fourteenth Amendment","A Supreme Court ruling that the Thirteenth Amendment was unconstitutional","The disputed presidential election of 1876","A wave of Black migration to Kansas","The assassination of Abraham Lincoln"],"e":["The Black Codes, the 1866 riots, and southern rejection of the Fourteenth Amendment convinced Congress to impose military reconstruction.","No such ruling occurred. The Thirteenth Amendment was never struck down.","That election came almost a decade later and led to the end of Reconstruction, not its start.","The Exoduster migration happened in 1879, after Reconstruction ended.","Lincoln's death in 1865 brought Johnson to power, but the 1867 acts responded to what southern governments did under Johnson's lenient plan."],"a":0},{"id":"u1q04","u":1,"th":"pol","d":"m","pool":"diag","s":"The House of Representatives impeached President Andrew Johnson in 1868 chiefly because he had","st":"","o":["ordered federal troops out of the South","removed Secretary of War Edwin Stanton in apparent violation of the Tenure of Office Act","purchased Alaska without congressional approval","accepted bribes in the Crédit Mobilier scandal","refused to enforce the Fifteenth Amendment"],"e":["Troops were withdrawn in 1877 under Hayes, not by Johnson.","The formal charges centered on Stanton's dismissal, though the real conflict was over Johnson's obstruction of Congressional Reconstruction.","The Senate approved the Alaska treaty, and it was not a ground for impeachment.","Crédit Mobilier involved congressmen and Grant-era officials, not Johnson's impeachment.","The Fifteenth Amendment was not ratified until 1870, after Johnson left office."],"a":1},{"id":"u1q05","u":1,"th":"pol","d":"m","pool":"quiz","s":"Which of the following was a direct result of the Compromise of 1877?","st":"","o":["Southern states were divided into five military districts.","The Freedmen's Bureau was created.","Federal troops were withdrawn from the remaining Reconstruction governments in the South.","The Fifteenth Amendment was ratified.","Samuel Tilden became president."],"e":["Military districts were created by the Reconstruction Acts of 1867, the start of Radical Reconstruction rather than its end.","The Freedmen's Bureau was created in 1865.","In return for Democrats accepting Hayes's election, the last federal troops left southern statehouses, ending Reconstruction.","The Fifteenth Amendment was ratified in 1870.","Tilden won the popular vote but lost the presidency to Hayes under the compromise."],"a":2},{"id":"u1q06","u":1,"th":"pol","d":"h","pool":"quiz","s":"Which of the following occurred FIRST?","st":"","o":["Southern legislatures enacted Black Codes.","Rutherford B. Hayes became president.","The Fifteenth Amendment was ratified.","Hiram Revels took his seat in the U.S. Senate.","Andrew Johnson was impeached by the House."],"e":["The Black Codes were passed in 1865–1866 under Presidential Reconstruction, before every other event listed.","Hayes took office in 1877.","The Fifteenth Amendment was ratified in 1870.","Revels was seated in 1870.","Johnson's impeachment came in 1868."],"a":0},{"id":"u1q07","u":1,"th":"soc","d":"e","pool":"quiz","s":"Immediately after emancipation, which of the following was a top priority for many freedpeople?","st":"","o":["Reuniting families that had been separated by slavery","Joining the Democratic Party","Moving to the Great Plains as cattle ranchers","Returning to work for their former owners for wages under the same conditions as slavery","Emigrating to Africa"],"e":["Freedpeople traveled widely and placed newspaper ads searching for relatives sold away. Family reunification was a defining early goal.","Freedmen overwhelmingly supported the Republican Party, the party of Lincoln and Reconstruction.","A few moved West, but ranching was not a widespread priority.","Freedpeople resisted gang labor and conditions resembling slavery. This is why sharecropping emerged as a compromise.","Some emigration schemes existed, but very few freedpeople chose to leave."],"a":0},{"id":"u1q08","u":1,"th":"soc","d":"m","pool":"quiz","s":"The most lasting achievement of the Freedmen's Bureau was in the field of","st":"","o":["voting rights enforcement","education","immigration control","railroad construction","land redistribution"],"e":["Voting rights were enforced, briefly, by the army and the Enforcement Acts, not mainly by the Bureau.","With northern aid societies, the Bureau set up thousands of schools and helped found Black colleges such as Howard and Fisk.","Immigration had nothing to do with the Bureau's mission.","The Bureau did not build railroads.","Most confiscated land was returned to former owners after Johnson's pardons, so redistribution largely failed."],"a":1},{"id":"u1q09","u":1,"th":"soc","d":"m","pool":"A","s":"The Black Codes passed by southern states in 1865–1866 were designed primarily to","st":"","o":["redistribute plantation land to freedpeople","implement the provisions of the Fourteenth Amendment","provide public schools for Black children","grant freedpeople limited voting rights","restrict the freedom of formerly enslaved people and keep them as a controlled labor force"],"e":["The codes protected white landowners' interests rather than redistributing land.","The codes contradicted equal protection. Their passage helped prompt the amendment.","The first southern public school systems came from Reconstruction governments, not the Black Codes.","The Black Codes did not grant suffrage. Southern governments under Johnson refused Black voting.","Vagrancy laws, mandatory labor contracts, and limits on land ownership kept freedpeople working on plantations under white control."],"a":4},{"id":"u1q10","u":1,"th":"pol","d":"m","pool":"quiz","s":"Thaddeus Stevens and Charles Sumner are best known as leaders of which group?","st":"","o":["Radical Republicans in Congress who pushed for Black civil rights and strict terms for the South","Liberal Republicans who opposed Grant in 1872","Populists who demanded free silver","Copperheads who opposed the Civil War","Redeemer Democrats who ended Reconstruction"],"e":["Stevens (House) and Sumner (Senate) led the Radicals who took control of Reconstruction in 1867.","The Liberal Republicans of 1872 (Horace Greeley) wanted to end Reconstruction. Sumner did briefly side with them in 1872, but neither man is known as their leader.","Populism arose in the 1890s, after both men had died.","Copperheads were antiwar Democrats. Stevens and Sumner were firm Unionists.","Redeemers were southern Democrats, opponents of the Radicals."],"a":0},{"id":"u1q11","u":1,"th":"pol","d":"e","pool":"A","s":"The Supreme Court's decision in Plessy v. Ferguson (1896) is significant because it","st":"","o":["upheld state-mandated racial segregation under the \"separate but equal\" doctrine","outlawed segregation in public schools","declared that Black Americans could not be citizens","established the right of the Court to review state laws","struck down poll taxes in federal elections"],"e":["Plessy approved segregated railroad cars, giving constitutional cover to Jim Crow for nearly 60 years.","Segregated schools were struck down in Brown v. Board of Education (1954), which overturned Plessy's reasoning.","That was Dred Scott v. Sandford (1857), which the Fourteenth Amendment overturned.","Judicial review dates to Marbury v. Madison (1803).","Poll taxes in federal elections ended with the Twenty-fourth Amendment (1964)."],"a":0},{"id":"u1q12","u":1,"th":"pol","d":"h","pool":"A","s":"The statement above comes from","st":"<p>\"Our Constitution is color-blind, and neither knows nor tolerates classes among citizens.\"<\/p>","o":["the text of the Fifteenth Amendment","Justice John Marshall Harlan's dissent in Plessy v. Ferguson","Booker T. Washington's Atlanta Compromise speech","the majority opinion in the Civil Rights Cases","the majority opinion in Plessy v. Ferguson"],"e":["The Fifteenth Amendment concerns voting and does not contain this language.","Harlan was the lone dissenter in Plessy. He argued that segregation violated the Fourteenth Amendment.","Washington's speech accepted social segregation for the time being. It did not attack it on constitutional grounds.","The majority in 1883 struck down the Civil Rights Act of 1875. (Harlan dissented there too, but this line is from Plessy.)","The majority upheld segregation, the opposite of this statement."],"a":1},{"id":"u1q13","u":1,"th":"soc","d":"m","pool":"A","s":"In his 1895 Atlanta Compromise speech, Booker T. Washington urged Black Americans to","st":"","o":["support the Populist Party's alliance of Black and white farmers","demand immediate social and political equality through protest","focus on vocational training and economic progress while temporarily accepting segregation","emigrate to Africa to escape discrimination","form a separate political party to contest southern elections"],"e":["Washington did not tie himself to the Populists.","This was Du Bois's position, not Washington's.","Washington argued that economic self-help would earn respect and rights over time. Critics saw this as accommodation to Jim Crow.","Back-to-Africa ideas are associated with Marcus Garvey in the 1920s.","Washington avoided direct political confrontation."],"a":2},{"id":"u1q14","u":1,"th":"cul","d":"m","pool":"B","s":"W.E.B. Du Bois criticized Booker T. Washington chiefly because Du Bois believed that African Americans should","st":"","o":["demand full civil and political rights immediately and develop a college-educated \"Talented Tenth\"","concentrate on industrial and agricultural training","avoid politics until they had achieved economic independence","move to the West to claim homesteads","separate completely from white society and return to Africa"],"e":["In <em>The Souls of Black Folk<\/em> (1903), Du Bois rejected accommodation and called for higher education and immediate equal rights.","That was Washington's program at Tuskegee.","This summarizes Washington's gradualism, which Du Bois opposed.","Du Bois did not promote western migration.","Separatism is associated with Marcus Garvey, whom Du Bois opposed."],"a":0},{"id":"u1q15","u":1,"th":"soc","d":"e","pool":"A","s":"Ida B. Wells is best known for her","st":"","o":["leadership of the Exoduster migration to Kansas","service as the first African American U.S. senator","novel <em>Uncle Tom's Cabin<\/em>","journalism exposing and campaigning against lynching","founding of Tuskegee Institute"],"e":["The Exodusters are associated with Benjamin \"Pap\" Singleton.","That was Hiram Revels (1870).","Harriet Beecher Stowe wrote <em>Uncle Tom's Cabin<\/em> (1852).","Wells documented lynchings in works such as <em>Southern Horrors<\/em> (1892) and fought for federal anti-lynching action.","Tuskegee was founded by Booker T. Washington."],"a":3},{"id":"u1q16","u":1,"th":"soc","d":"m","pool":"B","s":"Southern \"grandfather clauses\" of the 1890s were designed to","st":"","o":["require voters to have lived in the state for three generations","guarantee voting rights to elderly freedmen","exempt white men from literacy tests and poll taxes if their ancestors could vote before 1867","let grandsons of Confederate veterans skip military service","give land to the descendants of formerly enslaved people"],"e":["The clauses exempted voters from tests. They did not set residency requirements.","They did the opposite. They shielded white voters, not freedmen.","Since Black men could not vote before 1867, these clauses disfranchised Black voters while protecting poor whites' votes.","The clauses concerned voting, not military service.","No such land policy existed."],"a":2},{"id":"u1q17","u":1,"th":"eco","d":"m","pool":"quiz","s":"Under the crop-lien system that spread across the postwar South,","st":"","o":["railroads guaranteed minimum prices for cotton","the federal government lent farmers money at low interest","landowners paid farm workers fixed daily wages","farmers pooled crops in cooperatives to bypass middlemen","merchants supplied seed and goods on credit in exchange for a claim on the farmer's future crop"],"e":["Railroads set shipping rates. They did not guarantee crop prices.","Federal farm credit programs came much later (Federal Farm Loan Act 1916, New Deal).","Wage labor was not the crop-lien arrangement. Credit secured by the crop was.","Cooperatives were a Farmers' Alliance remedy against the crop-lien system, not the system itself.","High interest and falling cotton prices meant many farmers never got out of debt."],"a":4},{"id":"u1q18","u":1,"th":"eco","d":"m","pool":"A","s":"Henry Grady's idea of a \"New South\" called for the South to","st":"","o":["secede again from the Union","industrialize and diversify its economy by attracting northern investment","rely entirely on cotton exports to Britain","restore a plantation economy based on slave labor","redistribute land to freedpeople"],"e":["Grady preached sectional reconciliation, not secession.","Grady, an Atlanta editor, promoted textile mills, railroads, and industry alongside reconciliation with the North.","Dependence on cotton was the problem the New South idea was meant to fix.","Slavery was abolished, and Grady looked forward rather than back.","Grady did not advocate land redistribution."],"a":1},{"id":"u1q19","u":1,"th":"eco","d":"m","pool":"diag","s":"The arrangement described is best identified as","st":"<p>The following terms are typical of a contract signed in Georgia in 1867: The laborer agrees to cultivate the land and furnish his own labor. The owner furnishes land, a mule, tools, and seed. At harvest the owner receives one-half of the crop, and from the laborer's half are deducted all advances of food and supplies.<\/p>","o":["sharecropping","homesteading","the encomienda system","wage labor","indentured servitude"],"e":["The laborer works the owner's land and supplies and is paid with a share of the crop. That is the defining feature of sharecropping.","Homesteaders got title to public land by living on and improving it.","Encomienda was a Spanish colonial labor system.","Wage laborers receive fixed cash pay, not a share of the harvest.","Indentured servants worked a fixed term to repay passage. They were not paid a crop share."],"a":0},{"id":"u1q20","u":1,"th":"pol","d":"h","pool":"B","s":"Supreme Court decisions such as the Slaughterhouse Cases (1873) and United States v. Cruikshank (1876) affected Reconstruction by","st":"","o":["guaranteeing land to freedpeople as compensation for slavery","requiring the federal government to enforce desegregation of public schools","expanding federal power to prosecute private acts of violence","declaring the Reconstruction Acts unconstitutional","narrowing the protections of the Fourteenth Amendment and leaving the protection of Black citizens largely to the states"],"e":["No Supreme Court decision required land grants.","Court-ordered school desegregation began with Brown (1954).","Cruikshank did the reverse. It overturned federal convictions from the Colfax Massacre.","Neither case struck down the Reconstruction Acts.","These rulings read federal protections narrowly. In practice, that let southern states and private violence undermine Black rights."],"a":4},{"id":"u1q21","u":1,"th":"pol","d":"m","pool":"B","s":"The Crédit Mobilier and Whiskey Ring scandals are associated with the presidency of","st":"","o":["Rutherford B. Hayes","Abraham Lincoln","Grover Cleveland","Ulysses S. Grant","Andrew Johnson"],"e":["Hayes came to office in 1877 promising reform after the Grant-era scandals.","Lincoln died in 1865. These scandals came to light in the 1870s.","Cleveland was known for honesty and vetoes in the 1880s–1890s.","Both scandals tarnished Grant's administration (1869–1877) and weakened northern support for Republican Reconstruction.","Johnson's presidency was defined by his clashes with Congress, not these scandals."],"a":3},{"id":"u1q22","u":1,"th":"soc","d":"m","pool":"A","s":"The Enforcement Acts and the Ku Klux Klan Act of 1870–1871 were passed in order to","st":"","o":["grant amnesty to former Confederate officers","end military occupation of the South","prohibit Black men from serving on juries","protect Black voters and officeholders from terrorist violence","establish segregated public facilities"],"e":["Amnesty came through presidential pardons and the Amnesty Act of 1872, not these acts.","They expanded federal enforcement rather than ending it.","The acts aimed to protect, not restrict, Black civil rights.","These laws let federal courts and troops prosecute the Klan, which briefly broke the first Klan.","Segregation laws came from southern states later, not from these federal acts."],"a":3},{"id":"u1q23","u":1,"th":"soc","d":"e","pool":"B","s":"Hiram Revels is historically significant as the","st":"","o":["Supreme Court justice who dissented in Plessy","head of the Freedmen's Bureau","first African American to serve in the U.S. Senate","author of <em>Up From Slavery<\/em>","founder of the NAACP"],"e":["The Plessy dissenter was John Marshall Harlan.","General Oliver O. Howard headed the Freedmen's Bureau.","Revels was elected from Mississippi and seated in 1870.","<em>Up From Slavery<\/em> is Booker T. Washington's autobiography.","The NAACP was founded in 1909 by a multiracial group including Du Bois."],"a":2},{"id":"u1q24","u":1,"th":"pol","d":"m","pool":"A","s":"Lincoln's Ten Percent Plan differed from the Wade-Davis Bill in that Lincoln's plan","st":"","o":["required Black male suffrage, while Wade-Davis did not","was passed by Congress over a presidential veto","allowed a state to be restored once 10 percent of its 1860 voters took a loyalty oath, while Wade-Davis required a majority","confiscated all plantations, while Wade-Davis protected property","placed the South under military rule, while Wade-Davis did not"],"e":["Neither plan required Black suffrage. That came with the 1867 Reconstruction Acts.","The Ten Percent Plan was an executive proclamation, not a law passed over a veto.","Lincoln favored a quick, lenient restoration. Congress's Wade-Davis Bill demanded 50 percent and an ironclad oath, and Lincoln pocket-vetoed it.","Lincoln's plan offered pardons and protected most property except enslaved people.","Military districts came in 1867 under Congress, not Lincoln's plan."],"a":2},{"id":"u1q25","u":1,"th":"dip","d":"e","pool":"quiz","s":"In 1867 the United States purchased Alaska from","st":"","o":["Great Britain","Russia","France","Spain","Mexico"],"e":["Britain controlled Canada, not Alaska.","Secretary of State William Seward bought Alaska from Russia for $7.2 million, which critics mocked as \"Seward's Folly.\"","France sold Louisiana in 1803.","Spain gave up Florida (1819) and later Puerto Rico and the Philippines (1898), not Alaska.","Mexico ceded the Southwest in 1848. It never held Alaska."],"a":1},{"id":"u1q26","u":1,"th":"soc","d":"h","pool":"A","s":"The \"Exodusters\" of 1879 were","st":"","o":["Chinese laborers expelled from California","former Confederates who emigrated to Brazil","white farmers who abandoned the Dust Bowl for California","Mormon settlers who moved from Illinois to Utah","African Americans who left the South for Kansas to escape violence and economic oppression after Reconstruction"],"e":["Chinese exclusion is a separate story (1882 act). They were not called Exodusters.","Some Confederates did go to Brazil (the Confederados), but they were not called Exodusters.","That describes the \"Okies\" of the 1930s.","The Mormon migration took place in the 1840s.","Thousands left after the troops were withdrawn, hoping for land and safety on the plains."],"a":4},{"id":"u1q27","u":1,"th":"cul","d":"e","pool":"quiz","s":"Booker T. Washington founded which institution in 1881 to provide industrial and agricultural education?","st":"","o":["Harvard University","Howard University","The NAACP","Tuskegee Institute","Hull House"],"e":["Harvard is a colonial-era university (1636). Du Bois earned his PhD there.","Howard was founded in 1867 with Freedmen's Bureau support and offered a liberal arts curriculum.","The NAACP is a civil rights organization founded in 1909.","Washington built Tuskegee in Alabama into a model of vocational education.","Hull House was Jane Addams's Chicago settlement house (1889)."],"a":3},{"id":"u1q28","u":1,"th":"cul","d":"h","pool":"quiz","s":"The \"Lost Cause\" interpretation of the Civil War, widely promoted in the South after Reconstruction, held that","st":"","o":["the South should industrialize to compete with the North","the war had been lost because of Black soldiers' desertion","Reconstruction was a success that should be extended","the North had been right to abolish slavery","the Confederacy had fought nobly for states' rights and honor rather than to preserve slavery"],"e":["That is the New South argument, a separate idea.","That was not the Lost Cause argument. Black Union soldiers fought with distinction.","Lost Cause writers portrayed Reconstruction as a disastrous era of corruption.","Lost Cause advocates minimized slavery rather than celebrating abolition.","This myth shaped monuments, textbooks, and white southern memory, and it downplayed slavery's central role."],"a":4},{"id":"u1q29","u":1,"th":"pol","d":"m","pool":"quiz","s":"The southern Democrats who regained control of state governments in the 1870s and ended Reconstruction called themselves","st":"","o":["Know-Nothings","Redeemers","Half-Breeds","Copperheads","Mugwumps"],"e":["The Know-Nothings were a nativist party of the 1850s.","They claimed to \"redeem\" the South from Republican rule, then cut spending on schools and began rolling back Black rights.","Half-Breeds were a moderate Republican faction of the 1870s–80s that favored civil service reform.","Copperheads were northern Democrats who opposed the Civil War.","Mugwumps were reform-minded Republicans who backed Democrat Grover Cleveland in 1884."],"a":1},{"id":"u1q30","u":1,"th":"soc","d":"e","pool":"B","s":"During Reconstruction, white southerners who supported the Republican Party were called","st":"","o":["Exodusters","scalawags","doughfaces","Redeemers","carpetbaggers"],"e":["Exodusters were Black migrants to Kansas.","Opponents used the insult \"scalawag\" for white southerners who cooperated with Republican governments.","Doughfaces were pre–Civil War northerners with southern sympathies.","Redeemers were the Democrats who overthrew Republican rule.","Carpetbaggers were northerners who moved South, not native southerners."],"a":1},{"id":"u1q31","u":1,"th":"pol","d":"m","pool":"B","s":"In 1867 a former Confederate state that wanted its representatives seated in Congress first had to write a new constitution guaranteeing Black male suffrage and ratify the Fourteenth Amendment. This requirement came from","st":"","o":["the Supreme Court's decision in Plessy v. Ferguson","the Compromise of 1877","Andrew Johnson's amnesty proclamation","the Reconstruction Acts passed by Congress","Lincoln's Ten Percent Plan"],"e":["Plessy (1896) concerned segregation, not readmission.","The Compromise ended Reconstruction. It set no readmission conditions.","Johnson's plan readmitted states with few conditions.","The 1867 Reconstruction Acts set these conditions and placed the South under military supervision until they were met.","Lincoln's plan required only a 10 percent loyalty oath and made no mention of Black suffrage."],"a":3},{"id":"u1q32","u":1,"th":"pol","d":"h","pool":"B","s":"In the Civil Rights Cases (1883), the Supreme Court ruled that","st":"","o":["Black Codes were constitutional","the Fourteenth Amendment barred discrimination by states but not by private individuals and businesses","Congress could ban racial discrimination in hotels under its commerce power","the Fifteenth Amendment guaranteed voting rights to women","segregated public schools were unconstitutional"],"e":["The Black Codes had been superseded by the Civil Rights Act of 1866 and the Fourteenth Amendment. They were not the issue in 1883.","This \"state action\" reasoning struck down the Civil Rights Act of 1875's ban on discrimination in inns, theaters, and railroads.","That reasoning was upheld only in 1964 (Heart of Atlanta Motel v. U.S.).","The Court never read the Fifteenth Amendment to cover sex.","That was Brown v. Board of Education (1954)."],"a":1},{"id":"u1q33","u":1,"th":"cul","d":"m","pool":"quiz","s":"During and after Reconstruction, independent Black churches became important primarily because they","st":"","o":["opposed education for freedpeople","were funded and controlled by the Freedmen's Bureau","encouraged members to join the Democratic Party","served as centers of community life, education, and political organizing","were required by federal law in every southern county"],"e":["Churches were among the strongest supporters of Black education.","The churches were independent institutions, not Bureau agencies.","Black voters and leaders overwhelmingly backed the Republicans.","Free of white control, Black churches hosted schools and meetings and produced many Reconstruction-era leaders.","No federal law required churches. Establishing religion would violate the First Amendment."],"a":3},{"id":"u1q34","u":1,"th":"soc","d":"h","pool":"quiz","s":"Freedpeople's hopes of receiving \"forty acres and a mule\" were largely disappointed because","st":"","o":["Radical Republicans opposed any land redistribution","the Fifteenth Amendment prohibited land grants to freedpeople","President Johnson's pardons restored most confiscated land to its former owners","most freedpeople preferred to move to northern cities","the Homestead Act of 1862 excluded all southern land"],"e":["Thaddeus Stevens actually proposed confiscating planter land for freedpeople. Moderates and Johnson blocked it.","The Fifteenth Amendment concerns voting and says nothing about land.","Sherman's Field Order No. 15 had set aside coastal land, but Johnson reversed it and returned land to pardoned planters.","The Great Migration north came decades later. Most freedpeople wanted land in the South.","The Southern Homestead Act of 1866 opened some southern public land, but it was poor land and the program largely failed."],"a":2}],"units":[{"n":1,"title":"Reconstruction and the New South","years":"1865–1900","period":"early","weight":8,"minutes":9,"lesson":"<h2>The big question<\/h2>\n<p>In 1865 the Union had won the war, and about four million enslaved people were free. Two questions followed. <strong>On what terms would the eleven Confederate states rejoin the Union?<\/strong> And <strong>what would freedom actually mean for formerly enslaved people?<\/strong> The struggle over these questions is called <strong>Reconstruction<\/strong> (1865–1877). The short version: freedpeople won major constitutional rights during Reconstruction. Then the North lost interest, white southern Democrats retook power, and most of those rights were stripped away by 1900.<\/p>\n<h2>Presidential Reconstruction (1865–1866)<\/h2>\n<p>Lincoln had planned a lenient restoration. Under his <strong>Ten Percent Plan<\/strong> (1863), a state could form a new government once 10% of its 1860 voters swore loyalty to the Union. Congress pushed back with the harsher <strong>Wade-Davis Bill<\/strong>, which required 50% and an \"ironclad oath,\" but Lincoln pocket-vetoed it. Lincoln was assassinated in April 1865, and <strong>Andrew Johnson<\/strong>, a pro-Union Democrat from Tennessee, became president.<\/p>\n<p>Johnson pardoned thousands of ex-Confederates and let the old southern elite rebuild state governments. Those governments passed <strong>Black Codes<\/strong>. These laws limited freedpeople's right to own or rent land, required them to sign yearly labor contracts, and let authorities arrest unemployed Black men for \"vagrancy\" and hire them out. Johnson also returned land confiscated during the war to its prewar owners. That ended the hopes raised by General Sherman's Field Order No. 15 that freedpeople would get <strong>\"forty acres and a mule.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Johnson's lenient pardons; old elites back in power<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Southern states pass Black Codes; anti-Black riots in Memphis and New Orleans (1866)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Northern voters elect a Republican supermajority in 1866; Congress takes over Reconstruction<\/div><\/div>\n<p>The <strong>Thirteenth Amendment<\/strong> (ratified December 1865) abolished slavery. Congress also created the <strong>Freedmen's Bureau<\/strong> (1865). It provided food and medical care and supervised labor contracts. Its most lasting work was <strong>education<\/strong>: with northern missionary societies, it helped found schools and colleges such as <strong>Howard<\/strong> and <strong>Fisk<\/strong>.<\/p>\n<h2>Congressional (Radical) Reconstruction (1867–1877)<\/h2>\n<p>The <strong>Radical Republicans<\/strong>, led by <strong>Thaddeus Stevens<\/strong> in the House and <strong>Charles Sumner<\/strong> in the Senate, wanted to remake southern society and protect Black rights. Congress passed the <strong>Civil Rights Act of 1866<\/strong> over Johnson's veto. Then, to put those rights beyond the reach of future majorities, it wrote the <strong>Fourteenth Amendment<\/strong> (ratified 1868). The amendment made everyone born in the U.S. a <strong>citizen<\/strong> and barred states from denying anyone <strong>\"due process\"<\/strong> or <strong>\"equal protection of the laws.\"<\/strong> It later became the foundation of the twentieth-century civil rights revolution.<\/p>\n<p>When southern states refused to ratify it, Congress passed the <strong>Reconstruction Acts of 1867<\/strong>. These acts divided the former Confederacy (except Tennessee, already readmitted) into <strong>five military districts<\/strong>. To be readmitted, a state had to write a new constitution guaranteeing <strong>Black male suffrage<\/strong> and ratify the Fourteenth Amendment.<\/p>\n<p>Congress also passed the <strong>Tenure of Office Act<\/strong>, which barred the president from removing certain officials without Senate approval. Johnson fired Secretary of War Edwin Stanton anyway, and in 1868 the House <strong>impeached<\/strong> him. The Senate fell <strong>one vote<\/strong> short of removing him. Johnson finished his term with little power left.<\/p>\n<p><strong>Ulysses S. Grant<\/strong> won the presidency in 1868. The <strong>Fifteenth Amendment<\/strong> (1870) barred denying the vote on account of <strong>\"race, color, or previous condition of servitude.\"<\/strong> It did not mention sex, which angered woman suffrage leaders and split their movement.<\/p>\n<h3>Reconstruction governments in the South<\/h3>\n<p>Southern Republican governments drew support from three groups:<\/p>\n<ul><li>freedmen, who voted in large numbers<\/li><li><strong>\"carpetbaggers\"<\/strong>, northerners who moved South<\/li><li><strong>\"scalawags\"<\/strong>, white southerners who joined the Republicans<\/li><\/ul>\n<p>About 2,000 Black men held office. <strong>Hiram Revels<\/strong> of Mississippi became the <strong>first African American U.S. senator<\/strong> (1870). These governments created the South's first <strong>public school systems<\/strong> and rebuilt railroads, but they also ran up debt and suffered some corruption, which opponents exaggerated.<\/p>\n<p>Freedpeople built independent lives. They <strong>reunited families<\/strong>, legalized marriages, and founded <strong>Black churches<\/strong>, which became the center of community and political life. They also flocked to schools.<\/p>\n<h3>Violence and retreat<\/h3>\n<p>The <strong>Ku Klux Klan<\/strong> (founded 1866) and similar groups used terror to keep Black men from voting. Congress answered with the <strong>Enforcement Acts<\/strong> and the <strong>Ku Klux Klan Act<\/strong> (1870–71), which let federal troops and courts crush the first Klan. But northern commitment faded for several reasons:<\/p>\n<ul><li>the <strong>Panic of 1873<\/strong> turned voters' attention to the economy<\/li><li>scandals in Grant's administration, including the <strong>Crédit Mobilier<\/strong> railroad bribery scheme and the <strong>Whiskey Ring<\/strong> tax fraud, discredited Republican rule<\/li><li>northern racism made voters weary of the \"southern question\"<\/li><\/ul>\n<p>The Supreme Court also narrowed the new amendments. In the <strong>Slaughterhouse Cases<\/strong> (1873), the Court read the Fourteenth Amendment's protections narrowly. <strong>U.S. v. Cruikshank<\/strong> (1876) overturned convictions from the <strong>Colfax Massacre<\/strong> and left protection of Black citizens mostly to the states.<\/p>\n<h2>The end of Reconstruction: the Compromise of 1877<\/h2>\n<p>The <strong>election of 1876<\/strong> between <strong>Rutherford B. Hayes<\/strong> (Republican) and <strong>Samuel Tilden<\/strong> (Democrat) hinged on disputed electoral votes from three southern states. In the informal <strong>Compromise of 1877<\/strong>, Democrats accepted Hayes as president, and Hayes <strong>withdrew the last federal troops<\/strong> from southern statehouses. Southern Democrats who called themselves <strong>\"Redeemers\"<\/strong> took over every southern state.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Northern fatigue, depression, violence, court rulings<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Compromise of 1877 removes federal troops<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>\"Redeemer\" Democrats rule the South; Black rights erode<\/div><\/div>\n<h2>The \"New South\" and Jim Crow (1877–1900)<\/h2>\n<p>Atlanta editor <strong>Henry Grady<\/strong> promoted a <strong>\"New South\"<\/strong> of factories, railroads, and diversified farming. Some industry did grow: <strong>textile mills<\/strong>, <strong>Birmingham steel<\/strong>, and <strong>tobacco<\/strong> (James B. Duke's American Tobacco Company). But the South stayed poor and mostly agricultural, and northern capital often owned its industry.<\/p>\n<h3>The farm trap<\/h3>\n<p>Without land, most freedpeople, and many poor whites, became <strong>sharecroppers<\/strong>. They farmed a landowner's land in exchange for a share of the crop, often half. Others were <strong>tenant farmers<\/strong> who rented land. Under the <strong>crop-lien system<\/strong>, local merchants supplied seed and food on credit, secured by a lien on the coming crop. High interest and low cotton prices kept families in <strong>permanent debt<\/strong>.<\/p>\n<h3>Jim Crow and disfranchisement<\/h3>\n<p>By the 1890s southern states built a system of legal segregation known as <strong>Jim Crow<\/strong>. To get around the Fifteenth Amendment, they used:<\/p>\n<ul><li><strong>poll taxes<\/strong><\/li><li><strong>literacy tests<\/strong>, applied unfairly by white registrars<\/li><li><strong>white primaries<\/strong><\/li><li><strong>grandfather clauses<\/strong>, which excused a man from these tests if his grandfather could vote before 1867, so poor whites kept the vote<\/li><\/ul>\n<p>The Supreme Court went along:<\/p>\n<ul><li><strong>Civil Rights Cases (1883):<\/strong> struck down the Civil Rights Act of 1875, holding that the Fourteenth Amendment limits <em>state<\/em> action, not private businesses.<\/li><li><strong>Plessy v. Ferguson (1896):<\/strong> upheld segregated railroad cars under the doctrine of <strong>\"separate but equal.\"<\/strong> Justice <strong>John Marshall Harlan<\/strong> dissented alone: \"Our Constitution is color-blind.\"<\/li><\/ul>\n<p><strong>Lynching<\/strong> peaked in the 1890s. Journalist <strong>Ida B. Wells<\/strong> exposed it in pamphlets such as <em>Southern Horrors<\/em> (1892). Some Black southerners left. The <strong>Exodusters<\/strong> moved to Kansas in 1879.<\/p>\n<h3>Two Black strategies<\/h3>\n<p><strong>Booker T. Washington<\/strong> founded the <strong>Tuskegee Institute<\/strong> (1881). In his <strong>Atlanta Compromise<\/strong> speech (1895), he urged Black southerners to accept segregation for now and focus on <strong>vocational education<\/strong> and economic self-help. <strong>W.E.B. Du Bois<\/strong> answered in <em>The Souls of Black Folk<\/em> (1903). He demanded <strong>full civil and political rights now<\/strong> and higher education for a <strong>\"Talented Tenth\"<\/strong> of leaders. (Du Bois's later work is in Unit 3.)<\/p>\n<p>Meanwhile, white southerners built the <strong>\"Lost Cause\"<\/strong> memory of the war. It cast the Confederacy as a noble fight for states' rights rather than slavery. Monuments and textbooks spread this view for generations.<\/p>\n<h3>One diplomatic footnote<\/h3>\n<p>In 1867 Secretary of State <strong>William Seward<\/strong> bought <strong>Alaska<\/strong> from Russia for $7.2 million. Critics mocked it as \"Seward's Folly.\"<\/p>","mustknow":["<strong>13th Amendment<\/strong> (1865) abolished slavery. <strong>14th<\/strong> (1868) gave citizenship plus <strong>equal protection<\/strong> and <strong>due process<\/strong>. <strong>15th<\/strong> (1870) barred race-based denial of the vote.","<strong>Black Codes<\/strong> (1865–66): southern laws restricting freedpeople's labor and movement. They provoked <strong>Radical Reconstruction<\/strong>.","<strong>Reconstruction Acts of 1867<\/strong>: five military districts; readmission required Black male suffrage and ratifying the 14th Amendment.","<strong>Johnson's impeachment<\/strong> (1868) came from firing Stanton in violation of the <strong>Tenure of Office Act<\/strong>. He was acquitted by one vote.","<strong>Freedmen's Bureau<\/strong>: aid, labor contracts, and especially <strong>schools<\/strong> (Howard, Fisk).","<strong>Sharecropping + crop-lien<\/strong> = a cycle of debt for Black and poor white farmers.","<strong>Compromise of 1877<\/strong>: Hayes becomes president and federal troops leave the South. Reconstruction ends.","<strong>Plessy v. Ferguson<\/strong> (1896) = \"separate but equal.\" Harlan's dissent: \"color-blind.\"","Disfranchisement tools: <strong>poll tax, literacy test, grandfather clause, white primary<\/strong>.","<strong>Booker T. Washington<\/strong> (accommodation, Tuskegee, Atlanta Compromise) vs. <strong>W.E.B. Du Bois<\/strong> (immediate rights, Talented Tenth)."],"timeline":[{"y":"1863","t":"Lincoln's Ten Percent Plan","key":false},{"y":"1865","t":"Lincoln assassinated; Freedmen's Bureau created; 13th Amendment ratified; Black Codes begin","key":true},{"y":"1866","t":"Civil Rights Act passed over Johnson's veto; Ku Klux Klan founded","key":false},{"y":"1867","t":"Reconstruction Acts (military districts); Tenure of Office Act; Alaska purchased","key":true},{"y":"1868","t":"Johnson impeached and acquitted; 14th Amendment ratified; Grant elected","key":true},{"y":"1870","t":"15th Amendment; Hiram Revels first Black U.S. senator","key":true},{"y":"1870–71","t":"Enforcement Acts and Ku Klux Klan Act","key":false},{"y":"1873","t":"Panic of 1873; Slaughterhouse Cases; Colfax Massacre","key":false},{"y":"1876","t":"Disputed Hayes–Tilden election; U.S. v. Cruikshank","key":false},{"y":"1877","t":"Compromise of 1877: troops withdrawn, Reconstruction ends","key":true},{"y":"1879","t":"Exoduster migration to Kansas","key":false},{"y":"1881","t":"Booker T. Washington opens Tuskegee Institute","key":false},{"y":"1883","t":"Civil Rights Cases strike down Civil Rights Act of 1875","key":false},{"y":"1890","t":"Mississippi constitution adds poll tax and literacy test","key":false},{"y":"1892","t":"Ida B. Wells publishes <em>Southern Horrors<\/em>","key":false},{"y":"1895","t":"Washington's Atlanta Compromise speech","key":false},{"y":"1896","t":"Plessy v. Ferguson: \"separate but equal\"","key":true}],"cards":[{"id":"u1c01","f":"Thirteenth Amendment (1865)","b":"Abolished slavery and involuntary servitude, except as punishment for a crime."},{"id":"u1c02","f":"Fourteenth Amendment (1868)","b":"Citizenship for all persons born in the U.S.; states may not deny \"due process\" or \"equal protection of the laws.\" The basis of later civil rights rulings."},{"id":"u1c03","f":"Fifteenth Amendment (1870)","b":"The right to vote cannot be denied because of \"race, color, or previous condition of servitude.\" It left out women."},{"id":"u1c04","f":"Ten Percent Plan vs. Wade-Davis Bill","b":"Lincoln: a state is restored once 10% of 1860 voters swear loyalty. Congress (Wade-Davis): 50% plus an ironclad oath. Lincoln pocket-vetoed it."},{"id":"u1c05","f":"Freedmen's Bureau (1865)","b":"Federal agency that gave freedpeople food and medical care and supervised labor contracts. Its biggest legacy was schools and colleges (Howard, Fisk)."},{"id":"u1c06","f":"Black Codes","b":"Laws passed by southern states in 1865–66 restricting freedpeople's labor, movement, and property rights. They sparked Radical Reconstruction."},{"id":"u1c07","f":"Radical Republicans","b":"Congressional faction (Thaddeus Stevens, Charles Sumner) that pushed for Black civil and voting rights and tough terms for the South."},{"id":"u1c08","f":"Reconstruction Acts of 1867","b":"Split the South into five military districts. Readmission required new constitutions with Black male suffrage and ratification of the 14th Amendment."},{"id":"u1c09","f":"Impeachment of Andrew Johnson (1868)","b":"The House impeached him for firing Secretary of War Stanton in violation of the Tenure of Office Act. The Senate acquitted by one vote."},{"id":"u1c10","f":"Carpetbaggers / Scalawags","b":"Carpetbaggers were northerners who moved South during Reconstruction. Scalawags were white southerners who supported the Republicans."},{"id":"u1c11","f":"Sharecropping","b":"Landless farmers worked a landowner's land in exchange for a share of the crop. It was the dominant labor system for freedpeople."},{"id":"u1c12","f":"Crop-lien system","b":"Merchants advanced seed and supplies on credit, secured by the future crop. High interest kept farmers in endless debt."},{"id":"u1c13","f":"Enforcement Acts / Ku Klux Klan Act (1870–71)","b":"Federal laws that let the government use courts and troops against Klan terror aimed at Black voters."},{"id":"u1c14","f":"Compromise of 1877","b":"Settled the disputed Hayes–Tilden election. Hayes became president and withdrew the last federal troops from the South, ending Reconstruction."},{"id":"u1c15","f":"Redeemers","b":"Southern white Democrats who took back state governments from Republicans in the 1870s and rolled back Reconstruction."},{"id":"u1c16","f":"New South","b":"Henry Grady's vision of an industrialized, diversified southern economy (textiles, steel, tobacco). Only partly achieved."},{"id":"u1c17","f":"Jim Crow disfranchisement tools","b":"Poll taxes, literacy tests, white primaries, and grandfather clauses, used to strip Black men of the vote despite the 15th Amendment."},{"id":"u1c18","f":"Plessy v. Ferguson (1896)","b":"Supreme Court upheld segregated railroad cars under \"separate but equal.\" Justice Harlan dissented: \"Our Constitution is color-blind.\""},{"id":"u1c19","f":"Atlanta Compromise (1895)","b":"Booker T. Washington's speech urging Black southerners to accept segregation for now and pursue vocational education and economic progress."},{"id":"u1c20","f":"Ida B. Wells","b":"Black journalist who led the crusade against lynching (<em>Southern Horrors<\/em>, 1892)."},{"id":"u1c21","f":"Exodusters (1879)","b":"Black southerners who migrated to Kansas to escape the post-Reconstruction South."}]}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const UNITS = D.units;
const QS = D.questions;
const QMAP = Object.fromEntries(QS.map(q => [q.id, q]));
const CARDS = UNITS.flatMap(u => u.cards.map(c => Object.assign({u: u.n}, c)));
const CMAP = Object.fromEntries(CARDS.map(c => [c.id, c]));
const THEMES = Object.fromEntries(D.meta.thematic_weights.map(t => [t.id, t]));
const LETTERS = ['A','B','C','D','E'];
const DAY = 86400000;
const $ = s => document.querySelector(s);
const main = document.getElementById('main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => Math.round(x * 100) + '%';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

/* ---------- storage (safe) ---------- */
const KEY = 'clep-ush2-v1';
let storageOK = true;
function blankState(){ return {v:1, theme:null, lessonsRead:{}, quiz:{}, diag:null, exams:{}, examRun:null, cards:{}, mistakes:{}, plan:null}; }
function loadState(){
  try { const raw = localStorage.getItem(KEY); if (!raw) return blankState(); return sanitize(JSON.parse(raw)); }
  catch(e){ storageOK = false; return blankState(); }
}
function sanitize(o){
  const s = blankState();
  if (!o || typeof o !== 'object') return s;
  for (const k of Object.keys(s)) if (o[k] !== undefined && typeof o[k] === typeof s[k] || (s[k] === null && o[k] && typeof o[k] === 'object')) s[k] = o[k];
  if (o.theme === 'light' || o.theme === 'dark') s.theme = o.theme;
  return s;
}
let S = loadState();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e){ storageOK = false; } }

/* ---------- theme ---------- */
function applyTheme(){ if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
$('#themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
applyTheme();

/* ---------- keyboard ---------- */
let keyHandler = null;
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (keyHandler && keyHandler(e) === true) e.preventDefault();
});

/* ---------- derived progress ---------- */
const unitQs = (n, pool) => QS.filter(q => q.u === n && (!pool || q.pool === pool));
const diagLabel = n => {
  if (!S.diag || !S.diag.byUnit || !S.diag.byUnit[n]) return null;
  const r = S.diag.byUnit[n]; const p = r.c / r.n;
  return p >= 0.75 ? 'skim' : p >= 0.5 ? 'study' : 'must';
};
const labelPill = l => l === 'skim' ? '<span class="pill good">Skim</span>' : l === 'study' ? '<span class="pill warn">Study</span>' : l === 'must' ? '<span class="pill bad">Must study</span>' : '';
const unitDone = n => !!S.lessonsRead[n] && S.quiz[n] && S.quiz[n].best >= 0.7;
const cardState = id => S.cards[id] || null;
function cardMastery(n){ const cs = CARDS.filter(c => !n || c.u === n); if (!cs.length) return 0; return cs.filter(c => (S.cards[c.id] || {}).box >= 3).length / cs.length; }
function dueCards(n){ const now = Date.now(); return CARDS.filter(c => (!n || c.u === n) && (!S.cards[c.id] || S.cards[c.id].due <= now)); }
function openMistakes(){ return Object.keys(S.mistakes).filter(id => QMAP[id] && !S.mistakes[id].ok); }

/* time model (minutes) */
function unitTasks(n){
  const u = UNITS[n-1]; const lab = diagLabel(n); const f = lab === 'skim' ? 0.5 : 1;
  const qn = unitQs(n, 'quiz').length;
  return [
    {id:'lesson'+n, unit:n, kind:'lesson', label:`Unit ${n}: read lesson + must-know + timeline`, min: Math.round((u.minutes + 10) * f), done: !!S.lessonsRead[n]},
    {id:'quiz'+n, unit:n, kind:'quiz', label:`Unit ${n}: quiz (${qn} Q) + review explanations`, min: Math.round(qn * 1.5), done: !!S.quiz[n]},
    {id:'cards'+n, unit:n, kind:'cards', label:`Unit ${n}: learn flashcards (${u.cards.length})`, min: Math.round(u.cards.length * 1.0), done: cardMastery(n) >= 0.8, frac: cardMastery(n)}
  ];
}
function allTasks(){
  const t = [{id:'diag', kind:'diag', label:'Diagnostic test (30 Q)', min:45, done: !!S.diag}];
  const order = UNITS.map(u => u.n).sort((a,b) => { const r = l => ({must:0, study:1, skim:2})[diagLabel(l)] ?? 1; return r(a) - r(b) || a - b; });
  for (const n of order) t.push(...unitTasks(n));
  t.push({id:'review', kind:'review', label:'Spaced flashcard reviews (ongoing)', min: Math.round(CARDS.length * 0.9 * (1 - cardMastery())), done: cardMastery() >= 0.9});
  t.push({id:'mist', kind:'mist', label:'Drill the mistake log', min: Math.max(30, openMistakes().length * 2), done: false, always:true});
  t.push({id:'cheat', kind:'cheat', label:'Cheat sheet: redraw from memory', min:60, done:false, always:true});
  t.push({id:'examA', kind:'exam', label:'Practice Exam 1 (90 min) + review', min:150, done: !!(S.exams.A && S.exams.A.attempts)});
  t.push({id:'examB', kind:'exam', label:'Practice Exam 2 (90 min) + review', min:150, done: !!(S.exams.B && S.exams.B.attempts)});
  return t;
}
function hoursLeft(){
  let m = 0; for (const t of allTasks()) { if (t.done) continue; m += t.frac ? t.min * (1 - t.frac) : t.min; }
  return m / 60;
}
function totalHours(){ return allTasks().reduce((a,t) => a + t.min, 0) / 60; }

/* ---------- nav / router ---------- */
const NAV = [['#/','Home'],['#/diagnostic','Diagnostic'],['#/units','Units'],['#/cards','Flashcards'],['#/mistakes','Mistakes'],['#/exams','Practice exams'],['#/cheatsheet','Cheat sheet'],['#/plan','Study plan'],['#/about','About & data']];
function renderNav(){
  const h = location.hash || '#/';
  $('#nav').innerHTML = NAV.map(([href, l]) => {
    const on = href === '#/' ? (h === '#/' || h === '' || h === '#') : h.startsWith(href) || (href === '#/units' && h.startsWith('#/unit/')) || (href === '#/exams' && h.startsWith('#/exam/'));
    return `<a href="${href}" class="${on ? 'on' : ''}">${l}</a>`;
  }).join('');
}
const ROUTES = [
  [/^#?\/?$/, viewHome], [/^#\/diagnostic$/, viewDiag], [/^#\/units$/, viewUnits],
  [/^#\/unit\/(\d+)(?:\/(\w+))?$/, viewUnit], [/^#\/cards$/, viewCards], [/^#\/mistakes$/, viewMistakes],
  [/^#\/exams$/, viewExams], [/^#\/exam\/(A|B)$/, viewExam], [/^#\/cheatsheet$/, viewCheat],
  [/^#\/plan$/, viewPlan], [/^#\/about$/, viewAbout]
];
let timerIv = null;
function route(){
  keyHandler = null; if (timerIv) { clearInterval(timerIv); timerIv = null; }
  renderNav();
  const h = location.hash || '#/';
  for (const [re, fn] of ROUTES) { const m = h.match(re); if (m) { fn(...m.slice(1)); window.scrollTo(0,0); return; } }
  viewHome();
}
window.addEventListener('hashchange', route);
function banners(){
  let b = '';
  if (!storageOK) b += `<div class="banner">Your browser is blocking storage, so progress will not be saved between visits. Use <a href="#/about">Export progress</a> to keep a copy.</div>`;
  if (S.examRun && !location.hash.startsWith('#/exam/')) b += `<div class="banner"><b>A practice exam is in progress and its timer is still running.</b> <a href="#/exam/${S.examRun.exam}">Return to the exam</a></div>`;
  return b;
}

/* ---------- HOME ---------- */
function readiness(){
  const a = S.exams.A ? S.exams.A.best : null, b = S.exams.B ? S.exams.B.best : null;
  const ready = a != null && b != null && a >= 0.75 && b >= 0.75;
  return {a, b, ready};
}
function readinessCard(){
  const {a, b, ready} = readiness();
  const shown = [a, b].filter(x => x != null);
  const score = shown.length ? Math.min(...shown) : 0;
  const col = ready ? 'var(--good)' : 'var(--accent)';
  const deg = Math.round((shown.length === 2 ? score : shown.length ? score / 2 : 0) * 360);
  const status = ready ? '<span class="pill good">Ready to book</span>' : '<span class="pill warn">Not ready yet</span>';
  const line = x => x == null ? '<span class="muted">not taken</span>' : `<b>${pct(x)}</b> ${x >= 0.75 ? '<span class="pill good">≥75%</span>' : '<span class="pill bad">below 75%</span>'}`;
  return `<div class="card"><div class="meter">
    <div class="dial" style="background:conic-gradient(${col} ${deg}deg, var(--surface2) 0)"><span>${shown.length ? pct(score) : '—'}<small>${shown.length === 2 ? 'lowest' : 'readiness'}</small></span></div>
    <div><h3 style="margin:0 0 6px">Readiness ${status}</h3>
    <div class="small">Practice Exam 1 (best): ${line(a)}<br>Practice Exam 2 (best): ${line(b)}</div>
    <div class="small muted" style="margin-top:6px">“Ready to book” turns on only when <b>both</b> practice exams are at 75% or higher.</div></div>
  </div></div>`;
}
function nextStep(){
  if (S.examRun) return [`Finish your practice exam`, `#/exam/${S.examRun.exam}`];
  if (!S.diag) return ['Take the 30-question diagnostic', '#/diagnostic'];
  const t = allTasks().find(t => !t.done && !t.always);
  if (!t) return ['Drill your mistakes and redraw the cheat sheet', '#/mistakes'];
  if (t.kind === 'lesson') return [t.label, `#/unit/${t.unit}/lesson`];
  if (t.kind === 'quiz') return [t.label, `#/unit/${t.unit}/quiz`];
  if (t.kind === 'cards') return [t.label, `#/unit/${t.unit}/cards`];
  if (t.kind === 'review') return [t.label, '#/cards'];
  if (t.id === 'examA') return ['Take Practice Exam 1', '#/exam/A'];
  if (t.id === 'examB') return ['Take Practice Exam 2', '#/exam/B'];
  return [t.label, '#/'];
}
function viewHome(){
  const done = UNITS.filter(u => unitDone(u.n)).length;
  const hl = hoursLeft(), th = totalHours();
  const [ns, nh] = nextStep();
  const due = dueCards().length, mk = openMistakes().length;
  main.innerHTML = banners() + `
  <h1>Pass CLEP US History II</h1>
  <p class="muted">The exam has about 120 questions in 90 minutes and covers 1865 to the present. 70% of it is after 1914. Work through the steps in order. Nothing here is filler.</p>
  <div class="card" style="border-color:var(--accent)"><div class="tag">Next step</div><div class="row" style="justify-content:space-between;margin-top:4px"><b>${esc(ns)}</b><a class="btn" href="${nh}">Go →</a></div></div>
  ${readinessCard()}
  <div class="grid g3">
    <div class="card"><div class="tag">Units complete</div><div style="font-size:1.6rem;font-weight:700">${done} / ${UNITS.length}</div><div class="bar"><span style="width:${done/UNITS.length*100}%"></span></div></div>
    <div class="card"><div class="tag">Est. hours left</div><div style="font-size:1.6rem;font-weight:700">${hl.toFixed(1)} h</div><div class="small muted">of about ${th.toFixed(0)} h total</div></div>
    <div class="card"><div class="tag">Review queue</div><div style="font-size:1.05rem;margin-top:4px"><a href="#/cards">${due} cards due</a><br><a href="#/mistakes">${mk} mistakes to drill</a></div></div>
  </div>
  <h2>Units</h2>
  <div class="card tablewrap"><table><thead><tr><th>Unit</th><th>Weight</th><th>Diagnostic</th><th>Lesson</th><th>Quiz best</th><th>Cards</th></tr></thead><tbody>
  ${UNITS.map(u => `<tr><td><a href="#/unit/${u.n}">${u.n}. ${esc(u.title)}</a><div class="small muted">${esc(u.years)}</div></td><td>${u.weight}%</td>
    <td>${labelPill(diagLabel(u.n)) || '<span class="muted small">—</span>'}</td>
    <td>${S.lessonsRead[u.n] ? '<span class="pill good">Read</span>' : '<span class="muted small">—</span>'}</td>
    <td>${S.quiz[u.n] ? `<span class="pill ${S.quiz[u.n].best >= 0.7 ? 'good' : 'bad'}">${pct(S.quiz[u.n].best)}</span>` : '<span class="muted small">—</span>'}</td>
    <td><div class="bar good" style="width:70px"><span style="width:${cardMastery(u.n)*100}%"></span></div></td></tr>`).join('')}
  </tbody></table></div>
  <p class="small muted">A unit counts as complete when you have marked the lesson read <b>and</b> scored 70% or higher on its quiz. Cards bar = share of the unit's flashcards in Leitner box 3 or higher.</p>`;
}

/* ---------- UNITS LIST ---------- */
function viewUnits(){
  main.innerHTML = banners() + `<h1>Units</h1><p class="muted">The units run in time order, and their weights match the official 30% (1865–1914) / 70% (1915–present) split. Spend your time where the weight is.</p>` +
  UNITS.map(u => `<a href="#/unit/${u.n}" style="text-decoration:none;color:inherit"><div class="card"><div class="row" style="justify-content:space-between"><div><b>${u.n}. ${esc(u.title)}</b> <span class="muted">${esc(u.years)}</span></div><div class="row">${labelPill(diagLabel(u.n))}<span class="pill acc">${u.weight}% of exam</span>${unitDone(u.n) ? '<span class="pill good">Done</span>' : ''}</div></div>

/* ---------- QUIZ ENGINE (practice / diagnostic / drill) ---------- */
function recordMistake(id, correct, mode){
  if (!correct) { const m = S.mistakes[id] || {n:0}; m.n++; m.t = Date.now(); m.ok = false; S.mistakes[id] = m; }
  else if (mode === 'drill' && S.mistakes[id]) { S.mistakes[id].ok = true; }
}
function stimHTML(q){ return q.st ? `<div class="stim">${q.st}</div>` : ''; }
function qMeta(q){ return `<span class="pill">Unit ${q.u}</span> <span class="pill">${esc(THEMES[q.th].short)}</span>`; }
function runQuiz(opts){
  const {qs, mode} = opts; let i = 0, sel = null, revealed = false; const res = [];
  const feedback = mode !== 'diag';
  function render(){
    const q = qs[i];
    main.innerHTML = banners() + `<div class="qhead"><b>${esc(opts.title)}</b><span class="muted small">Question ${i+1} of ${qs.length}</span></div>
    <div class="bar"><span style="width:${(i)/qs.length*100}%"></span></div>
    <div class="card">${feedback ? `<div class="row small" style="margin-bottom:6px">${qMeta(q)}</div>` : ''}${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o, k) => {
      let cls = '';
      if (revealed) cls = k === q.a ? 'right' : (k === sel ? 'wrong' : '');
      else if (k === sel) cls = 'sel';
      return `<button class="opt ${cls}" data-k="${k}" ${revealed ? 'disabled' : ''}><span class="k">${LETTERS[k]}</span><span>${o}${revealed ? `<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span>` : ''}</span></button>`;
    }).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <a href="${opts.back}" class="small muted">Quit</a>
      <button class="btn" id="nx" ${sel == null ? 'disabled' : ''}>${!feedback ? (i === qs.length-1 ? 'Finish' : 'Next') : revealed ? (i === qs.length-1 ? 'See results' : 'Next') : 'Check'}</button></div>
    <div class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> ${feedback ? 'answer' : 'select'} · <span class="kbd">Enter</span> ${feedback ? 'next' : 'confirm'}</div></div>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
    $('#nx').onclick = next;
  }
  function choose(k){ if (revealed) return; sel = k; if (feedback) reveal(); else render(); }
  function reveal(){ revealed = true; const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); render(); }
  function next(){
    if (sel == null) return;
    if (feedback && !revealed) { reveal(); return; }
    if (!feedback) { const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); }
    if (i < qs.length - 1) { i++; sel = null; revealed = false; render(); window.scrollTo(0,0); }
    else finish();
  }
  function finish(){
    keyHandler = null;
    const r = {total: res.length, correct: res.filter(x => x.ok).length, res};
    if (opts.onDone) opts.onDone(r);
    if (opts.renderResults) return opts.renderResults(r);
    main.innerHTML = banners() + `<h1>${esc(opts.title)}: results</h1><div class="card"><div style="font-size:2rem;font-weight:700">${r.correct} / ${r.total} <span class="muted" style="font-size:1rem">(${pct(r.correct/r.total)})</span></div>
    <p class="muted">${r.correct/r.total >= 0.75 ? 'Solid. Keep the flashcards going.' : 'Missed questions are now in your mistake log. Re-read the bold terms in the lesson, then drill them.'}</p>
    <div class="row"><a class="btn" href="${opts.back}">Done</a><a class="btn ghost" href="#/mistakes">Mistake log</a></div></div>${reviewList(res.filter(x => !x.ok))}`;
  }
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { choose(+e.key - 1); return true; }
    const L = e.key.toUpperCase(); if (!revealed && LETTERS.includes(L) && e.key.length === 1) { choose(LETTERS.indexOf(L)); return true; }
    if (e.key === 'Enter') { next(); return true; }
  };
  render();
}
function reviewList(items, title){
  if (!items.length) return '';
  return `<h2>${title || 'Review what you missed'}</h2>` + items.map(x => { const q = QMAP[x.id]; return `<div class="card"><div class="row small">${qMeta(q)}</div>${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o,k) => `<div class="opt ${k === q.a ? 'right' : k === x.sel ? 'wrong' : ''}"><span class="k">${LETTERS[k]}</span><span>${o}<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span></span></div>`).join('')}</div></div>`; }).join('');
}

/* ---------- FLASHCARDS (Leitner) ---------- */
const INTERVALS = [0, 1, 3, 7, 14]; // days for boxes 1..5
function viewCards(){
  main.innerHTML = banners() + `<h1>Flashcards</h1><p class="muted">These are Leitner boxes. A card you get right moves up a box and comes back later (box 1 = today, then 1, 3, 7, and 14 days). A card you miss drops to box 1 and comes back in this same session.</p>
  <div class="card"><div class="row"><label class="f">Unit<select id="fu"><option value="0">All units</option>${UNITS.map(u => `<option value="${u.n}">${u.n}. ${esc(u.title)}</option>`).join('')}</select></label>
  <label class="f">Mode<select id="fm"><option value="due">Due now</option><option value="missed">Review missed only</option><option value="all">All cards (cram)</option></select></label></div>
  ${boxChart()}</div><div id="fcwrap"></div>`;
  const go = () => flashSession($('#fcwrap'), {unit: +$('#fu').value, mode: $('#fm').value});
  $('#fu').onchange = go; $('#fm').onchange = go; go();
}
function boxChart(n){
  const cs = CARDS.filter(c => !n || c.u === n); const counts = [0,0,0,0,0,0];
  for (const c of cs) { const s = S.cards[c.id]; counts[s ? s.box : 0]++; }
  const mx = Math.max(1, ...counts);
  const lbl = ['New','Box 1','Box 2','Box 3','Box 4','Box 5'];
  return `<div class="boxes">${counts.map(v => `<div title="${v}" style="height:${v/mx*100}%"></div>`).join('')}</div><div class="boxlbl">${counts.map((v,k) => `<span>${lbl[k]}<br><b>${v}</b></span>`).join('')}</div>`;
}
function flashSession(el, {unit, mode}){
  const pool = CARDS.filter(c => !unit || c.u === unit);
  let queue;
  if (mode === 'missed') queue = pool.filter(c => S.cards[c.id] && S.cards[c.id].lastMiss);
  else if (mode === 'all') queue = pool.slice();
  else { const now = Date.now(); const seen = pool.filter(c => S.cards[c.id] && S.cards[c.id].due <= now); const fresh = pool.filter(c => !S.cards[c.id]); queue = seen.concat(fresh.slice(0, Math.max(0, 30 - seen.length))); }
  queue = shuffle(queue); let flipped = false, got = 0, missed = 0; const total = queue.length;
  function render(){
    if (!queue.length) {
      el.innerHTML = `<div class="card"><b>${total ? 'Session complete.' : mode === 'missed' ? 'No missed cards here. Nice.' : 'Nothing due right now.'}</b> ${total ? `<span class="muted">${got} right first time, ${missed} misses.</span>` : ''}<div class="small muted" style="margin-top:6px">${dueCards(unit || 0).length} cards due in this set now.</div>${unit ? boxChart(unit) : ''}<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="again">Cram all cards in this set</button></div></div>`;
      $('#again').onclick = () => flashSession(el, {unit, mode:'all'}); keyHandler = null; return;
    }
    const c = queue[0]; const st = S.cards[c.id];
    el.innerHTML = `<div class="row small muted" style="justify-content:space-between;margin-top:10px"><span>${queue.length} left in session · Unit ${c.u}</span><span>${st ? 'Box ' + st.box : 'New card'}</span></div>
    <div class="card fc" id="fc">${flipped ? `<div><div style="font-weight:700;margin-bottom:8px">${c.f}</div><div class="back">${c.b}</div></div>` : `<div>${c.f}<div class="small muted" style="margin-top:12px">tap or press Space to flip</div></div>`}</div>
    <div class="row" style="justify-content:center">${flipped ? `<button class="btn ghost" id="miss">✗ Missed <span class="kbd">1</span></button><button class="btn" id="hit">✓ Got it <span class="kbd">2</span></button>` : `<button class="btn" id="flip">Flip <span class="kbd">Space</span></button>`}</div>`;
    $('#fc').onclick = () => { flipped = !flipped; render(); };
    if (flipped) { $('#miss').onclick = () => grade(false); $('#hit').onclick = () => grade(true); } else $('#flip').onclick = () => { flipped = true; render(); };
  }
  function grade(ok){
    const c = queue.shift(); const st = S.cards[c.id] || {box:0, miss:0};
    if (ok) { st.box = Math.min(5, Math.max(1, st.box + 1)); st.due = Date.now() + INTERVALS[st.box - 1] * DAY; st.lastMiss = false; if (!c._m) got++; }
    else { st.box = 1; st.due = Date.now(); st.miss = (st.miss || 0) + 1; st.lastMiss = true; missed++; c._m = true; queue.splice(Math.min(queue.length, 3), 0, c); }
    if (ok && st.box === 1) st.due = Date.now() + 10 * 60000; // learned today, show again later
    S.cards[c.id] = st; save(); flipped = false; render();
  }
  keyHandler = e => {
    if (!queue.length) return;
    if (e.key === ' ' || e.key === 'Enter' && !flipped) { flipped = !flipped; render(); return true; }
    if (flipped && e.key === '1') { grade(false); return true; }
    if (flipped && (e.key === '2' || e.key === 'Enter')) { grade(true); return true; }
  };
  pool.forEach(c => delete c._m);
  render();
}

function viewExam(k){

    if (S.examRun) { main.innerHTML = banners() + `<div class="card">Finish your other exam first.</div>`; return; }
