<\/strong>, allowed states to pass <strong>\"right-to-work\" laws<\/strong>, permitted 80-day \"cooling-off\" injunctions in national-emergency strikes, and required union leaders to swear they were not communists.<\/li><li><strong>Civil rights:<\/strong> Truman's committee report <em>To Secure These Rights<\/em> (1947) called for federal action. In 1948 Truman issued <strong>Executive Order 9981<\/strong>, <strong>desegregating the armed forces<\/strong>. That same year, <strong>Jackie Robinson<\/strong> had broken baseball's color line with the Brooklyn Dodgers (1947).<\/li><li><strong>Election of 1948:<\/strong> Truman faced a three-way split. Southern <strong>Dixiecrats<\/strong> (<strong>Strom Thurmond<\/strong>) walked out over civil rights, and <strong>Henry Wallace's<\/strong> Progressives attacked Truman from the left. Truman won a famous <strong>upset<\/strong> over Thomas Dewey anyway.<\/li><li><strong>Fair Deal:<\/strong> Truman won a higher minimum wage, expanded Social Security, and public housing, but Congress rejected <strong>national health insurance<\/strong>.<\/li><li>The <strong>Twenty-second Amendment<\/strong> (1951) limited presidents to <strong>two terms<\/strong>.<\/li><\/ul>\n<h2>5. Eisenhower: the middle way<\/h2>\n<p><strong>Dwight Eisenhower<\/strong> (1953–61) practiced <strong>\"Modern Republicanism.\"<\/strong> He accepted and even expanded the New Deal: Social Security grew, and he created the Department of Health, Education, and Welfare. But he favored balanced budgets. The <strong>Interstate Highway Act<\/strong> (1956), justified partly for defense and evacuation, built 41,000 miles of highway, the largest public works program in history.<\/p>\n<p><strong>Foreign policy:<\/strong> Secretary of State <strong>John Foster Dulles<\/strong> practiced <strong>brinkmanship<\/strong>.<\/p>\n<ul><li>The <strong>\"New Look\"<\/strong> relied on nuclear weapons and the threat of <strong>\"massive retaliation\"<\/strong> rather than costly ground forces: \"more bang for the buck.\"<\/li><li>The <strong>CIA<\/strong> ran <strong>covert operations<\/strong>, overthrowing governments in <strong>Iran<\/strong> (1953) and <strong>Guatemala<\/strong> (1954).<\/li><li>Eisenhower's <strong>domino theory<\/strong> (1954) held that if Vietnam fell to communism, its neighbors would follow. After the French defeat at Dien Bien Phu, the <strong>Geneva Accords<\/strong> (1954) temporarily divided Vietnam at the <strong>17th parallel<\/strong>. The U.S. backed <strong>Ngo Dinh Diem's<\/strong> South Vietnam and formed <strong>SEATO<\/strong>.<\/li><li>In the <strong>Suez Crisis<\/strong> (1956), Eisenhower forced Britain, France, and Israel to withdraw from Egypt.<\/li><li>He did <strong>not<\/strong> intervene when the Soviets crushed the <strong>Hungarian Revolution<\/strong> (1956).<\/li><li>The <strong>Eisenhower Doctrine<\/strong> (1957) offered aid against communism in the <strong>Middle East<\/strong>.<\/li><\/ul>\n<p><strong>Sputnik:<\/strong> In October 1957 the Soviets launched <strong>Sputnik<\/strong>, the first artificial satellite. Americans feared a \"missile gap\" and a science gap. Congress created <strong>NASA<\/strong> (1958) and passed the <strong>National Defense Education Act<\/strong> (1958), which funded science, math, and foreign-language education.<\/p>\n<p>At the end of his term, the <strong>U-2 incident<\/strong> (1960), a U.S. spy plane shot down over the USSR, wrecked a summit. In 1959 <strong>Fidel Castro<\/strong> took power in Cuba. In his <strong>Farewell Address<\/strong> (1961), Eisenhower warned against the <strong>\"military-industrial complex.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Sputnik (1957)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>NASA, National Defense Education Act, space race<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Federal investment in science and education; Cold War competition reaches schools<\/div><\/div>\n<h2>6. The affluent society<\/h2>\n<p>The postwar economy boomed. Pent-up savings, government spending (defense, highways, the <strong>GI Bill<\/strong>), and cheap energy fueled it. Births soared in the <strong>baby boom<\/strong> (1946–1964).<\/p>\n<p><strong>Suburbs:<\/strong> Builder <strong>William Levitt<\/strong> mass-produced affordable homes in <strong>Levittown<\/strong>, New York. <strong>FHA and VA mortgages<\/strong> made them easy to buy. But <strong>restrictive covenants and \"redlining\"<\/strong> excluded Black families, which cemented residential segregation. Millions moved to suburbs and to the <strong>Sun Belt<\/strong>, while inner cities lost people and tax revenue.<\/p>\n<p><strong>Consumer culture:<\/strong> Families bought <strong>cars<\/strong>, appliances, and <strong>television<\/strong>. By 1960 almost 90% of households had a TV, which spread shared programs and advertising. Credit cards appeared. A <strong>religious revival<\/strong> (evangelist <strong>Billy Graham<\/strong>) went with Cold War anti-communism: \"under God\" was added to the Pledge of Allegiance (1954). <strong>Jonas Salk's polio vaccine<\/strong> (1955) was a triumph of science.<\/p>\n<p><strong>The ideal of domesticity:<\/strong> Popular culture celebrated the suburban homemaker, and <strong>Dr. Benjamin Spock's<\/strong> <em>Baby and Child Care<\/em> (1946) became a bestseller. In reality, more married women were taking paid jobs every year.<\/p>\n<p><strong>Critics of conformity:<\/strong><\/p>\n<ul><li><strong>David Riesman<\/strong>, <em>The Lonely Crowd<\/em> (1950): \"other-directed\" people seek approval from peers.<\/li><li><strong>William Whyte<\/strong>, <em>The Organization Man<\/em> (1956): corporate conformity.<\/li><li><strong>John Kenneth Galbraith<\/strong>, <em>The Affluent Society<\/em> (1958): private wealth amid public neglect.<\/li><li><strong>C. Wright Mills<\/strong>, <em>The Power Elite<\/em> (1956).<\/li><li>Novels like <em>The Man in the Gray Flannel Suit<\/em> (Sloan Wilson).<\/li><\/ul>\n<p><strong>Rebels:<\/strong> The <strong>Beat Generation<\/strong> rejected materialism and conformity: <strong>Jack Kerouac's<\/strong> <em>On the Road<\/em> (1957) and <strong>Allen Ginsberg's<\/strong> <em>Howl<\/em> (1956). <strong>J.D. Salinger's<\/strong> <em>The Catcher in the Rye<\/em> (1951) spoke to alienated teens. <strong>Rock and roll<\/strong> (Elvis Presley, Chuck Berry, Little Richard) blended Black rhythm and blues with country and alarmed parents. <strong>Abstract Expressionist<\/strong> painters such as <strong>Jackson Pollock<\/strong> made New York the center of the art world.<\/p>\n<p><strong>Left behind:<\/strong> Prosperity did not reach everyone. Federal Indian policy shifted to <strong>\"termination\"<\/strong> (ending tribal recognition) and <strong>relocation<\/strong> to cities. <strong>\"Operation Wetback\"<\/strong> (1954) deported large numbers of Mexican migrants. Rural and urban poverty persisted (see Unit 8).<\/p>","mustknow":["<strong>Containment<\/strong> (George Kennan) was the core Cold War strategy.","<strong>Truman Doctrine<\/strong> (1947, Greece/Turkey military aid). <strong>Marshall Plan<\/strong> (1948, economic aid to rebuild Europe).","<strong>Berlin Airlift<\/strong> (1948–49); <strong>NATO<\/strong> (1949, first peacetime alliance); 1949: Soviet A-bomb + China falls to Mao.","<strong>Korean War<\/strong> (1950–53): UN action, Inchon, China enters, <strong>Truman fires MacArthur<\/strong> (civilian control), armistice at the 38th parallel.","<strong>Second Red Scare<\/strong>: HUAC/Hollywood Ten, Hiss, Rosenbergs, <strong>McCarthy<\/strong> (Army-McCarthy hearings 1954, censure).","<strong>Taft-Hartley<\/strong> (1947, curbed unions); <strong>EO 9981<\/strong> (1948, desegregated the military); <strong>1948<\/strong>: Truman beats Dewey despite Dixiecrats.","<strong>Eisenhower<\/strong>: Modern Republicanism, <strong>Interstate Highway Act<\/strong> (1956), <strong>massive retaliation/brinkmanship<\/strong>, CIA coups (Iran, Guatemala), <strong>domino theory<\/strong>.","<strong>Sputnik<\/strong> (1957) → <strong>NASA<\/strong> and the <strong>National Defense Education Act<\/strong> (1958). <strong>Military-industrial complex<\/strong> warning (1961).","1950s society: <strong>baby boom<\/strong>, <strong>Levittown<\/strong> suburbs (with racial exclusion), TV, religious revival.","Critics/rebels: Riesman, Whyte, Galbraith; <strong>Beats<\/strong> (Kerouac, Ginsberg); <strong>rock and roll<\/strong>; Salinger."],"timeline":[{"y":"1946","t":"Kennan's Long Telegram; Churchill's \"Iron Curtain\" speech; Employment Act; strike wave","key":false},{"y":"1947","t":"Truman Doctrine; Taft-Hartley Act; National Security Act; HUAC Hollywood hearings; Jackie Robinson; Levittown begins","key":true},{"y":"1948","t":"Marshall Plan; Berlin Airlift begins; EO 9981; Truman upsets Dewey","key":true},{"y":"1949","t":"NATO formed; Soviet atomic bomb; communist victory in China","key":true},{"y":"1950","t":"McCarthy's Wheeling speech; Korean War begins; NSC-68; Hiss convicted","key":true},{"y":"1951","t":"Truman fires MacArthur; 22nd Amendment","key":false},{"y":"1953","t":"Korean armistice; Rosenbergs executed; CIA coup in Iran","key":false},{"y":"1954","t":"Army-McCarthy hearings and censure; Geneva Accords; domino theory; Guatemala coup","key":false},{"y":"1955","t":"Warsaw Pact; Salk polio vaccine","key":false},{"y":"1956","t":"Interstate Highway Act; Suez Crisis; Hungarian Revolution; <em>Howl<\/em>","key":false},{"y":"1957","t":"Sputnik; Eisenhower Doctrine; <em>On the Road<\/em>","key":true},{"y":"1958","t":"NASA and National Defense Education Act","key":false},{"y":"1959","t":"Castro takes power in Cuba","key":false},{"y":"1960","t":"U-2 incident","key":false},{"y":"1961","t":"Eisenhower's Farewell Address (\"military-industrial complex\")","key":false}],"cards":[{"id":"u7c01","f":"Containment","b":"George Kennan's strategy: firmly resist Soviet expansion wherever it threatens, without all-out war."},{"id":"u7c02","f":"Iron Curtain speech (1946)","b":"Churchill's warning in Fulton, Missouri, that Soviet domination had divided Europe."},{"id":"u7c03","f":"Truman Doctrine (1947)","b":"$400 million in aid to Greece and Turkey. The U.S. would \"support free peoples\" resisting communist subjugation."},{"id":"u7c04","f":"Marshall Plan (1948)","b":"About $13 billion in economic aid to rebuild Western Europe and blunt communism's appeal."},{"id":"u7c05","f":"Berlin Airlift (1948–49)","b":"U.S. and British planes supplied West Berlin during the Soviet blockade until Stalin lifted it."},{"id":"u7c06","f":"NATO (1949)","b":"North Atlantic Treaty Organization. First U.S. peacetime military alliance. An attack on one is an attack on all."},{"id":"u7c07","f":"National Security Act (1947)","b":"Created the Department of Defense, the CIA, and the National Security Council."},{"id":"u7c08","f":"NSC-68 (1950)","b":"Secret policy paper calling for a massive military buildup to contain communism globally."},{"id":"u7c09","f":"Korean War (1950–53)","b":"North invaded South. UN/U.S. defense, Chinese intervention, MacArthur fired, armistice near the 38th parallel."},{"id":"u7c10","f":"MacArthur's firing (1951)","b":"Truman removed MacArthur for publicly demanding a wider war with China. Civilian control of the military."},{"id":"u7c11","f":"HUAC / Hollywood Ten","b":"House Un-American Activities Committee investigated Hollywood communism. The Ten were jailed, and a blacklist followed."},{"id":"u7c12","f":"Alger Hiss","b":"Ex-State Department official accused of spying for the USSR. Convicted of perjury (1950). Boosted Nixon's career."},{"id":"u7c13","f":"Rosenbergs","b":"Julius and Ethel Rosenberg, executed in 1953 for passing atomic secrets to the USSR."},{"id":"u7c14","f":"McCarthyism","b":"Sen. Joseph McCarthy's reckless anti-communist accusations (1950–54). Ended after the Army-McCarthy hearings and censure."},{"id":"u7c15","f":"Taft-Hartley Act (1947)","b":"Passed over Truman's veto. Banned the closed shop, allowed right-to-work laws, cooling-off periods, anti-communist oaths."},{"id":"u7c16","f":"Executive Order 9981 (1948)","b":"Truman's order desegregating the U.S. armed forces."},{"id":"u7c17","f":"Election of 1948","b":"Truman's upset win over Dewey despite Dixiecrat (Thurmond) and Progressive (Wallace) splits."},{"id":"u7c18","f":"Twenty-second Amendment (1951)","b":"Limits presidents to two elected terms."},{"id":"u7c19","f":"Modern Republicanism","b":"Eisenhower's acceptance of New Deal programs combined with fiscal conservatism."},{"id":"u7c20","f":"Interstate Highway Act (1956)","b":"Built 41,000 miles of interstate highways. Spurred suburbs and car culture, justified for defense."},{"id":"u7c21","f":"Massive retaliation / Brinkmanship","b":"Eisenhower–Dulles \"New Look\": rely on nuclear threats rather than large conventional forces, going to the brink of war."},{"id":"u7c22","f":"Domino theory","b":"Eisenhower (1954): if one Southeast Asian nation falls to communism, its neighbors will follow."},{"id":"u7c23","f":"Sputnik (1957)","b":"First Soviet satellite. Sparked U.S. fears and led to NASA and the National Defense Education Act (1958)."},{"id":"u7c24","f":"Military-industrial complex","b":"Eisenhower's 1961 farewell warning about the influence of the permanent arms industry and military."},{"id":"u7c25","f":"Baby boom","b":"Surge in births, 1946–1964, shaping schools, suburbs, and culture for decades."},{"id":"u7c26","f":"Levittown","b":"Mass-produced suburban housing (William Levitt). Affordable but initially excluded Black families."},{"id":"u7c27","f":"Beat Generation","b":"1950s writers rejecting conformity and materialism: Jack Kerouac (<em>On the Road<\/em>), Allen Ginsberg (<em>Howl<\/em>)."},{"id":"u7c28","f":"<em>The Lonely Crowd<\/em> / <em>The Organization Man<\/em>","b":"1950s critiques of conformity: Riesman's \"other-directed\" people and Whyte's corporate conformists."},{"id":"u7c29","f":"Termination policy","b":"1950s federal effort to end tribal recognition and move Native Americans into the mainstream. Reversed in the 1970s."}]}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const UNITS = D.units;
const QS = D.questions;
const QMAP = Object.fromEntries(QS.map(q => [q.id, q]));
const CARDS = UNITS.flatMap(u => u.cards.map(c => Object.assign({u: u.n}, c)));
const CMAP = Object.fromEntries(CARDS.map(c => [c.id, c]));
const THEMES = Object.fromEntries(D.meta.thematic_weights.map(t => [t.id, t]));
const LETTERS = ['A','B','C','D','E'];
const DAY = 86400000;
const $ = s => document.querySelector(s);
const main = document.getElementById('main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => Math.round(x * 100) + '%';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

/* ---------- storage (safe) ---------- */
const KEY = 'clep-ush2-v1';
let storageOK = true;
function blankState(){ return {v:1, theme:null, lessonsRead:{}, quiz:{}, diag:null, exams:{}, examRun:null, cards:{}, mistakes:{}, plan:null}; }
function loadState(){
  try { const raw = localStorage.getItem(KEY); if (!raw) return blankState(); return sanitize(JSON.parse(raw)); }
  catch(e){ storageOK = false; return blankState(); }
}
function sanitize(o){
  const s = blankState();
  if (!o || typeof o !== 'object') return s;
  for (const k of Object.keys(s)) if (o[k] !== undefined && typeof o[k] === typeof s[k] || (s[k] === null && o[k] && typeof o[k] === 'object')) s[k] = o[k];
  if (o.theme === 'light' || o.theme === 'dark') s.theme = o.theme;
  return s;
}
let S = loadState();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e){ storageOK = false; } }

/* ---------- theme ---------- */
function applyTheme(){ if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
$('#themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
applyTheme();

/* ---------- keyboard ---------- */
let keyHandler = null;
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (keyHandler && keyHandler(e) === true) e.preventDefault();
});

/* ---------- derived progress ---------- */
const unitQs = (n, pool) => QS.filter(q => q.u === n && (!pool || q.pool === pool));
const diagLabel = n => {
  if (!S.diag || !S.diag.byUnit || !S.diag.byUnit[n]) return null;
  const r = S.diag.byUnit[n]; const p = r.c / r.n;
  return p >= 0.75 ? 'skim' : p >= 0.5 ? 'study' : 'must';
};
const labelPill = l => l === 'skim' ? '<span class="pill good">Skim</span>' : l === 'study' ? '<span class="pill warn">Study</span>' : l === 'must' ? '<span class="pill bad">Must study</span>' : '';
const unitDone = n => !!S.lessonsRead[n] && S.quiz[n] && S.quiz[n].best >= 0.7;
const cardState = id => S.cards[id] || null;
function cardMastery(n){ const cs = CARDS.filter(c => !n || c.u === n); if (!cs.length) return 0; return cs.filter(c => (S.cards[c.id] || {}).box >= 3).length / cs.length; }
function dueCards(n){ const now = Date.now(); return CARDS.filter(c => (!n || c.u === n) && (!S.cards[c.id] || S.cards[c.id].due <= now)); }
function openMistakes(){ return Object.keys(S.mistakes).filter(id => QMAP[id] && !S.mistakes[id].ok); }

/* time model (minutes) */
function unitTasks(n){
  const u = UNITS[n-1]; const lab = diagLabel(n); const f = lab === 'skim' ? 0.5 : 1;
  const qn = unitQs(n, 'quiz').length;
  return [
    {id:'lesson'+n, unit:n, kind:'lesson', label:`Unit ${n}: read lesson + must-know + timeline`, min: Math.round((u.minutes + 10) * f), done: !!S.lessonsRead[n]},
    {id:'quiz'+n, unit:n, kind:'quiz', label:`Unit ${n}: quiz (${qn} Q) + review explanations`, min: Math.round(qn * 1.5), done: !!S.quiz[n]},
    {id:'cards'+n, unit:n, kind:'cards', label:`Unit ${n}: learn flashcards (${u.cards.length})`, min: Math.round(u.cards.length * 1.0), done: cardMastery(n) >= 0.8, frac: cardMastery(n)}
  ];
}
function allTasks(){
  const t = [{id:'diag', kind:'diag', label:'Diagnostic test (30 Q)', min:45, done: !!S.diag}];
  const order = UNITS.map(u => u.n).sort((a,b) => { const r = l => ({must:0, study:1, skim:2})[diagLabel(l)] ?? 1; return r(a) - r(b) || a - b; });
  for (const n of order) t.push(...unitTasks(n));
  t.push({id:'review', kind:'review', label:'Spaced flashcard reviews (ongoing)', min: Math.round(CARDS.length * 0.9 * (1 - cardMastery())), done: cardMastery() >= 0.9});
  t.push({id:'mist', kind:'mist', label:'Drill the mistake log', min: Math.max(30, openMistakes().length * 2), done: false, always:true});
  t.push({id:'cheat', kind:'cheat', label:'Cheat sheet: redraw from memory', min:60, done:false, always:true});
  t.push({id:'examA', kind:'exam', label:'Practice Exam 1 (90 min) + review', min:150, done: !!(S.exams.A && S.exams.A.attempts)});
  t.push({id:'examB', kind:'exam', label:'Practice Exam 2 (90 min) + review', min:150, done: !!(S.exams.B && S.exams.B.attempts)});
  return t;
}
function hoursLeft(){
  let m = 0; for (const t of allTasks()) { if (t.done) continue; m += t.frac ? t.min * (1 - t.frac) : t.min; }
  return m / 60;
}
function totalHours(){ return allTasks().reduce((a,t) => a + t.min, 0) / 60; }

/* ---------- nav / router ---------- */
const NAV = [['#/','Home'],['#/diagnostic','Diagnostic'],['#/units','Units'],['#/cards','Flashcards'],['#/mistakes','Mistakes'],['#/exams','Practice exams'],['#/cheatsheet','Cheat sheet'],['#/plan','Study plan'],['#/about','About & data']];
function renderNav(){
  const h = location.hash || '#/';
  $('#nav').innerHTML = NAV.map(([href, l]) => {
    const on = href === '#/' ? (h === '#/' || h === '' || h === '#') : h.startsWith(href) || (href === '#/units' && h.startsWith('#/unit/')) || (href === '#/exams' && h.startsWith('#/exam/'));
    return `<a href="${href}" class="${on ? 'on' : ''}">${l}</a>`;
  }).join('');
}
const ROUTES = [
  [/^#?\/?$/, viewHome], [/^#\/diagnostic$/, viewDiag], [/^#\/units$/, viewUnits],
  [/^#\/unit\/(\d+)(?:\/(\w+))?$/, viewUnit], [/^#\/cards$/, viewCards], [/^#\/mistakes$/, viewMistakes],
  [/^#\/exams$/, viewExams], [/^#\/exam\/(A|B)$/, viewExam], [/^#\/cheatsheet$/, viewCheat],
  [/^#\/plan$/, viewPlan], [/^#\/about$/, viewAbout]
];
let timerIv = null;
function route(){
  keyHandler = null; if (timerIv) { clearInterval(timerIv); timerIv = null; }
  renderNav();
  const h = location.hash || '#/';
  for (const [re, fn] of ROUTES) { const m = h.match(re); if (m) { fn(...m.slice(1)); window.scrollTo(0,0); return; } }
  viewHome();
}
window.addEventListener('hashchange', route);
function banners(){
  let b = '';
  if (!storageOK) b += `<div class="banner">Your browser is blocking storage, so progress will not be saved between visits. Use <a href="#/about">Export progress</a> to keep a copy.</div>`;
  if (S.examRun && !location.hash.startsWith('#/exam/')) b += `<div class="banner"><b>A practice exam is in progress and its timer is still running.</b> <a href="#/exam/${S.examRun.exam}">Return to the exam</a></div>`;
  return b;
}

/* ---------- HOME ---------- */
function readiness(){
  const a = S.exams.A ? S.exams.A.best : null, b = S.exams.B ? S.exams.B.best : null;
  const ready = a != null && b != null && a >= 0.75 && b >= 0.75;
  return {a, b, ready};
}
function readinessCard(){
  const {a, b, ready} = readiness();
  const taken = [a, b].filter(x => x != null).length;
  const score = Math.min(a || 0, b || 0); // the lower exam is what gates booking (untaken = 0)
  const col = ready ? 'var(--good)' : 'var(--accent)';
  const deg = Math.round(Math.min(1, score / 0.75) * 360);
  const status = ready ? '<span class="pill good">Ready to book</span>' : '<span class="pill warn">Not ready yet</span>';
  const line = x => x == null ? '<span class="muted">not taken</span>' : `<b>${pct(x)}</b> ${x >= 0.75 ? '<span class="pill good">≥75%</span>' : '<span class="pill bad">below 75%</span>'}`;
  return `<div class="card"><div class="meter">
    <div class="dial" style="background:conic-gradient(${col} ${deg}deg, var(--surface2) 0)"><span>${taken ? pct(score) : '—'}<small>lower exam</small></span></div>
    <div><h3 style="margin:0 0 6px">Readiness ${status}</h3>
    <div class="small">Practice Exam 1 (best): ${line(a)}<br>Practice Exam 2 (best): ${line(b)}</div>
    <div class="small muted" style="margin-top:6px">“Ready to book” turns on only when <b>both</b> practice exams are at 75% or higher. The dial fills as your <b>lower</b> score approaches 75%.</div></div>
  </div></div>`;
}
function nextStep(){
  if (S.examRun) return [`Finish your practice exam`, `#/exam/${S.examRun.exam}`];
  if (!S.diag) return ['Take the 30-question diagnostic', '#/diagnostic'];
  const t = allTasks().find(t => !t.done && !t.always);
  if (!t) return ['Drill your mistakes and redraw the cheat sheet', '#/mistakes'];
  if (t.kind === 'lesson') return [t.label, `#/unit/${t.unit}/lesson`];
  if (t.kind === 'quiz') return [t.label, `#/unit/${t.unit}/quiz`];
  if (t.kind === 'cards') return [t.label, `#/unit/${t.unit}/cards`];
  if (t.kind === 'review') return [t.label, '#/cards'];
  if (t.id === 'examA') return ['Take Practice Exam 1', '#/exam/A'];
  if (t.id === 'examB') return ['Take Practice Exam 2', '#/exam/B'];
  return [t.label, '#/'];
}
function viewHome(){
  const done = UNITS.filter(u => unitDone(u.n)).length;
  const hl = hoursLeft(), th = totalHours();
  const [ns, nh] = nextStep();
  const due = dueCards().length, mk = openMistakes().length;
  main.innerHTML = banners() + `
  <h1>Pass CLEP US History II</h1>
  <p class="muted">The exam has about 120 questions in 90 minutes and covers 1865 to the present. 70% of it is after 1914. Work through the steps in order. Nothing here is filler.</p>
  <div class="card" style="border-color:var(--accent)"><div class="tag">Next step</div><div class="row" style="justify-content:space-between;margin-top:4px"><b>${esc(ns)}</b><a class="btn" href="${nh}">Go →</a></div></div>
  ${readinessCard()}
  <div class="grid g3">
    <div class="card"><div class="tag">Units complete</div><div style="font-size:1.6rem;font-weight:700">${done} / ${UNITS.length}</div><div class="bar"><span style="width:${done/UNITS.length*100}%"></span></div></div>
    <div class="card"><div class="tag">Est. hours left</div><div style="font-size:1.6rem;font-weight:700">${hl.toFixed(1)} h</div><div class="small muted">of about ${th.toFixed(0)} h total</div></div>
    <div class="card"><div class="tag">Review queue</div><div style="font-size:1.05rem;margin-top:4px"><a href="#/cards">${due} cards due</a><br><a href="#/mistakes">${mk} mistakes to drill</a></div></div>
  </div>
  <h2>Units</h2>
  <div class="card tablewrap"><table><thead><tr><th>Unit</th><th>Weight</th><th>Diagnostic</th><th>Lesson</th><th>Quiz best</th><th>Cards</th></tr></thead><tbody>
  ${UNITS.map(u => `<tr><td><a href="#/unit/${u.n}">${u.n}. ${esc(u.title)}</a><div class="small muted">${esc(u.years)}</div></td><td>${u.weight}%</td>
    <td>${labelPill(diagLabel(u.n)) || '<span class="muted small">—</span>'}</td>
    <td>${S.lessonsRead[u.n] ? '<span class="pill good">Read</span>' : '<span class="muted small">—</span>'}</td>
    <td>${S.quiz[u.n] ? `<span class="pill ${S.quiz[u.n].best >= 0.7 ? 'good' : 'bad'}">${pct(S.quiz[u.n].best)}</span>` : '<span class="muted small">—</span>'}</td>

/* ---------- QUIZ ENGINE (practice / diagnostic / drill) ---------- */
function recordMistake(id, correct, mode){
  if (!correct) { const m = S.mistakes[id] || {n:0}; m.n++; m.t = Date.now(); m.ok = false; S.mistakes[id] = m; }
  else if (mode === 'drill' && S.mistakes[id]) { S.mistakes[id].ok = true; }
}
function stimHTML(q){ return q.st ? `<div class="stim">${q.st}</div>` : ''; }
function qMeta(q){ return `<span class="pill">Unit ${q.u}</span> <span class="pill">${esc(THEMES[q.th].short)}</span>`; }
function runQuiz(opts){
  const {qs, mode} = opts; let i = 0, sel = null, revealed = false; const res = [];
  const feedback = mode !== 'diag';
  function render(){
    const q = qs[i];
    main.innerHTML = banners() + `<div class="qhead"><b>${esc(opts.title)}</b><span class="muted small">Question ${i+1} of ${qs.length}</span></div>
    <div class="bar"><span style="width:${(i)/qs.length*100}%"></span></div>
    <div class="card">${feedback ? `<div class="row small" style="margin-bottom:6px">${qMeta(q)}</div>` : ''}${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o, k) => {
      let cls = '';
      if (revealed) cls = k === q.a ? 'right' : (k === sel ? 'wrong' : '');
      else if (k === sel) cls = 'sel';
      return `<button class="opt ${cls}" data-k="${k}" ${revealed ? 'disabled' : ''}><span class="k">${LETTERS[k]}</span><span>${o}${revealed ? `<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span>` : ''}</span></button>`;
    }).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <a href="${opts.back}" class="small muted">Quit</a>
      <button class="btn" id="nx" ${sel == null ? 'disabled' : ''}>${!feedback ? (i === qs.length-1 ? 'Finish' : 'Next') : revealed ? (i === qs.length-1 ? 'See results' : 'Next') : 'Check'}</button></div>
    <div class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> ${feedback ? 'answer' : 'select'} · <span class="kbd">Enter</span> ${feedback ? 'next' : 'confirm'}</div></div>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
    $('#nx').onclick = next;
  }
  function choose(k){ if (revealed) return; sel = k; if (feedback) reveal(); else render(); }
  function reveal(){ revealed = true; const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); render(); }
  function next(){
    if (sel == null) return;
    if (feedback && !revealed) { reveal(); return; }
    if (!feedback) { const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); }
    if (i < qs.length - 1) { i++; sel = null; revealed = false; render(); window.scrollTo(0,0); }
    else finish();
  }
  function finish(){
    keyHandler = null;
    const r = {total: res.length, correct: res.filter(x => x.ok).length, res};
    if (opts.onDone) opts.onDone(r);
    if (opts.renderResults) return opts.renderResults(r);
    main.innerHTML = banners() + `<h1>${esc(opts.title)}: results</h1><div class="card"><div style="font-size:2rem;font-weight:700">${r.correct} / ${r.total} <span class="muted" style="font-size:1rem">(${pct(r.correct/r.total)})</span></div>
    <p class="muted">${r.correct/r.total >= 0.75 ? 'Solid. Keep the flashcards going.' : 'Missed questions are now in your mistake log. Re-read the bold terms in the lesson, then drill them.'}</p>
    <div class="row"><a class="btn" href="${opts.back}">Done</a><a class="btn ghost" href="#/mistakes">Mistake log</a></div></div>${reviewList(res.filter(x => !x.ok))}`;
  }
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { choose(+e.key - 1); return true; }
    const L = e.key.toUpperCase(); if (!revealed && LETTERS.includes(L) && e.key.length === 1) { choose(LETTERS.indexOf(L)); return true; }
    if (e.key === 'Enter') { next(); return true; }
  };
  render();
}
function reviewList(items, title){
  if (!items.length) return '';
  return `<h2>${title || 'Review what you missed'}</h2>` + items.map(x => { const q = QMAP[x.id]; return `<div class="card"><div class="row small">${qMeta(q)}</div>${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o,k) => `<div class="opt ${k === q.a ? 'right' : k === x.sel ? 'wrong' : ''}"><span class="k">${LETTERS[k]}</span><span>${o}<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span></span></div>`).join('')}</div></div>`; }).join('');
}

/* ---------- FLASHCARDS (Leitner) ---------- */
const INTERVALS = [0, 1, 3, 7, 14]; // days for boxes 1..5
function viewCards(){
  main.innerHTML = banners() + `<h1>Flashcards</h1><p class="muted">These are Leitner boxes. A card you get right moves up a box and comes back later (box 1 = today, then 1, 3, 7, and 14 days). A card you miss drops to box 1 and comes back in this same session.</p>
  <div class="card"><div class="row"><label class="f">Unit<select id="fu"><option value="0">All units</option>${UNITS.map(u => `<option value="${u.n}">${u.n}. ${esc(u.title)}</option>`).join('')}</select></label>
  <label class="f">Mode<select id="fm"><option value="due">Due now</option><option value="missed">Review missed only</option><option value="all">All cards (cram)</option></select></label></div>
  ${boxChart()}</div><div id="fcwrap"></div>`;
  const go = () => flashSession($('#fcwrap'), {unit: +$('#fu').value, mode: $('#fm').value});
  $('#fu').onchange = go; $('#fm').onchange = go; go();
}
function boxChart(n){
  const cs = CARDS.filter(c => !n || c.u === n); const counts = [0,0,0,0,0,0];
  for (const c of cs) { const s = S.cards[c.id]; counts[s ? s.box : 0]++; }
  const mx = Math.max(1, ...counts);
  const lbl = ['New','Box 1','Box 2','Box 3','Box 4','Box 5'];
  return `<div class="boxes">${counts.map(v => `<div title="${v}" style="height:${v/mx*100}%"></div>`).join('')}</div><div class="boxlbl">${counts.map((v,k) => `<span>${lbl[k]}<br><b>${v}</b></span>`).join('')}</div>`;
}
function flashSession(el, {unit, mode}){
  const pool = CARDS.filter(c => !unit || c.u === unit);
  let queue;
  if (mode === 'missed') queue = pool.filter(c => S.cards[c.id] && S.cards[c.id].lastMiss);
  else if (mode === 'all') queue = pool.slice();
  else { const now = Date.now(); const seen = pool.filter(c => S.cards[c.id] && S.cards[c.id].due <= now); const fresh = pool.filter(c => !S.cards[c.id]); queue = seen.concat(fresh.slice(0, Math.max(0, 30 - seen.length))); }
  queue = shuffle(queue); let flipped = false, got = 0, missed = 0; const total = queue.length;
  function render(){
    if (!queue.length) {
      el.innerHTML = `<div class="card"><b>${total ? 'Session complete.' : mode === 'missed' ? 'No missed cards here. Nice.' : 'Nothing due right now.'}</b> ${total ? `<span class="muted">${got} right first time, ${missed} misses.</span>` : ''}<div class="small muted" style="margin-top:6px">${dueCards(unit || 0).length} cards due in this set now.</div>${unit ? boxChart(unit) : ''}<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="again">Cram all cards in this set</button></div></div>`;
      $('#again').onclick = () => flashSession(el, {unit, mode:'all'}); keyHandler = null; return;
    }
    const c = queue[0]; const st = S.cards[c.id];
    el.innerHTML = `<div class="row small muted" style="justify-content:space-between;margin-top:10px"><span>${queue.length} left in session · Unit ${c.u}</span><span>${st ? 'Box ' + st.box : 'New card'}</span></div>
    <div class="card fc" id="fc">${flipped ? `<div><div style="font-weight:700;margin-bottom:8px">${c.f}</div><div class="back">${c.b}</div></div>` : `<div>${c.f}<div class="small muted" style="margin-top:12px">tap or press Space to flip</div></div>`}</div>
    <div class="row" style="justify-content:center">${flipped ? `<button class="btn ghost" id="miss">✗ Missed <span class="kbd">1</span></button><button class="btn" id="hit">✓ Got it <span class="kbd">2</span></button>` : `<button class="btn" id="flip">Flip <span class="kbd">Space</span></button>`}</div>`;
    $('#fc').onclick = () => { flipped = !flipped; render(); };
    if (flipped) { $('#miss').onclick = () => grade(false); $('#hit').onclick = () => grade(true); } else $('#flip').onclick = () => { flipped = true; render(); };
  }
  function grade(ok){
    const c = queue.shift(); const st = S.cards[c.id] || {box:0, miss:0};
    if (ok) { st.box = Math.min(5, Math.max(1, st.box + 1)); st.due = Date.now() + INTERVALS[st.box - 1] * DAY; st.lastMiss = false; if (!c._m) got++; }
    else { st.box = 1; st.due = Date.now(); st.miss = (st.miss || 0) + 1; st.lastMiss = true; missed++; c._m = true; queue.splice(Math.min(queue.length, 3), 0, c); }
    if (ok && st.box === 1) st.due = Date.now() + 10 * 60000; // learned today, show again later
    S.cards[c.id] = st; save(); flipped = false; render();
  }
  keyHandler = e => {
    if (!queue.length) return;
    if (e.key === ' ' || e.key === 'Enter' && !flipped) { flipped = !flipped; render(); return true; }
    if (flipped && e.key === '1') { grade(false); return true; }
    if (flipped && (e.key === '2' || e.key === 'Enter')) { grade(true); return true; }
  };
  pool.forEach(c => delete c._m);
  render();
}

    <div class="row" style="margin-top:14px;justify-content:space-between"><div class="row"><button class="btn ghost sm" id="pv" ${R.cur === 0 ? 'disabled' : ''}>← Back</button><button class="btn ghost sm" id="fl">${R.flag[q.id] ? '★ Flagged' : '☆ Flag'}</button></div>
    <div class="row">${R.cur < R.order.length - 1 ? '<button class="btn sm" id="nx">Next →</button>' : ''}<button class="btn sm ${R.cur < R.order.length - 1 ? 'ghost' : ''}" id="sb">Submit exam</button></div></div></div>
    <details class="card"><summary class="small">Question navigator (flagged = gold border)</summary><div class="navgrid">${R.order.map((id,j) => `<button data-j="${j}" class="${R.ans[id] != null ? 'ans' : ''} ${j === R.cur ? 'cur' : ''} ${R.flag[id] ? 'flag' : ''}">${j+1}</button>`).join('')}</div></details>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
    main.querySelectorAll('.navgrid button').forEach(b => b.onclick = () => go(+b.dataset.j));
    $('#pv').onclick = () => go(R.cur - 1); if ($('#nx')) $('#nx').onclick = () => go(R.cur + 1);
    $('#fl').onclick = () => { R.flag[q.id] = !R.flag[q.id]; save(); render(); };
    $('#sb').onclick = () => { const un = R.order.length - Object.keys(R.ans).length; if (confirm(un ? `${un} question(s) unanswered. Submit anyway?` : 'Submit the exam?')) submitExam(); };
  }
  function pick(j){ R.ans[R.order[R.cur]] = j; save(); render(); }
  function go(j){ if (j < 0 || j >= R.order.length) return; R.cur = j; save(); render(); window.scrollTo(0,0); }
  timerIv = setInterval(() => { const l = left(); const t = $('#tm'); if (t) { t.textContent = fmt(l); t.classList.toggle('low', l < 5 * 60000); } if (l <= 0) { clearInterval(timerIv); timerIv = null; submitExam(true); } }, 1000);
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { pick(+e.key - 1); return true; }
    if (e.key === 'Enter' || e.key === 'ArrowRight') { go(R.cur + 1); return true; }
    if (e.key === 'ArrowLeft') { go(R.cur - 1); return true; }
    if (e.key === 'f' || e.key === 'F') { const id = R.order[R.cur]; R.flag[id] = !R.flag[id]; save(); render(); return true; }
  };
  render();
}
function tally(res){
  const by = (f) => { const o = {}; for (const x of res) { const q = QMAP[x.id]; const key = f(q); o[key] = o[key] || {c:0, n:0}; o[key].n++; if (x.ok) o[key].c++; } return o; };
  return {unit: by(q => q.u), theme: by(q => q.th), period: by(q => UNITS[q.u-1].period)};
}
function submitExam(timeout){
  const R = S.examRun; if (!R) return; if (timerIv) { clearInterval(timerIv); timerIv = null; }
  const res = R.order.map(id => ({id, sel: R.ans[id] != null ? R.ans[id] : null, ok: R.ans[id] === QMAP[id].a}));
  for (const x of res) recordMistake(x.id, x.ok, 'exam');
  const sc = res.filter(x => x.ok).length / res.length;
  const t = tally(res);
  const rec = {date: todayStr(), score: sc, mins: Math.min(EXAM_MIN, Math.round((Date.now() - R.start) / 60000)), ...t};
  const p = S.exams[R.exam] || {best:0, attempts:0, history:[]};
  S.exams[R.exam] = {best: Math.max(p.best, sc), last: sc, attempts: p.attempts + 1, history: (p.history || []).concat([rec]).slice(-5)};
  const k = R.exam; S.examRun = null; save();
  keyHandler = null;
  main.innerHTML = `<h1>Practice Exam ${k === 'A' ? 1 : 2}: results</h1>${timeout ? '<div class="banner">Time ran out, so the exam was submitted automatically.</div>' : ''}
  <div class="card"><div style="font-size:2.2rem;font-weight:700">${pct(sc)} <span class="muted" style="font-size:1rem">${res.filter(x => x.ok).length} / ${res.length} · ${rec.mins} min</span></div>
  <p>${sc >= 0.75 ? '<span class="pill good">Meets the 75% readiness bar</span>' : '<span class="pill bad">Below the 75% readiness bar</span>'} <span class="small muted">CLEP doesn't publish a percent-to-score conversion. The 75% bar is a deliberately safe margin above a typical passing raw score <span class="pill">unverified</span>.</span></p>
  ${breakdownHTML(rec)}<div class="row"><a class="btn" href="#/mistakes">Drill the misses</a><a class="btn ghost" href="#/exams">Back to exams</a></div></div>
  ${reviewList(res.filter(x => !x.ok))}`;
  window.scrollTo(0,0);
}
function breakdownHTML(rec){
  const rows = (obj, name) => Object.entries(obj).sort((a,b) => (isNaN(a[0]) ? 0 : a[0] - b[0])).map(([k, v]) => { const p = v.c / v.n; return `<tr><td>${name(k)}</td><td>${v.c}/${v.n}</td><td style="width:40%"><div class="bar ${p >= 0.75 ? 'good' : ''}"><span style="width:${p*100}%"></span></div></td><td>${pct(p)}</td></tr>`; }).join('');
  return `<div class="tablewrap"><table><thead><tr><th>By unit</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.unit, k => `${k}. ${esc(UNITS[k-1].title)}`)}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>By official theme</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.theme, k => esc(THEMES[k].short) + ` <span class="muted small">(${THEMES[k].percent}% of exam)</span>`)}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>By period</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.period, k => k === 'early' ? '1865–1914' : '1915–present')}</tbody></table></div>`;
}

  <div class="printhead"><b>CLEP US History II · one-page review</b></div>

  const ch = $('#cheat');
  $('#memo').onclick = e => { ch.classList.toggle('memo'); e.target.textContent = 'Memory mode: ' + (ch.classList.contains('memo') ? 'on' : 'off'); };
  ch.addEventListener('click', e => { const m = e.target.closest('.m'); if (m && ch.classList.contains('memo')) m.classList.toggle('show'); });

/* ---------- STUDY PLAN ---------- */
function viewPlan(){
  const p = S.plan || {hours: 1.5, date: '', start: todayStr()};
  main.innerHTML = banners() + `<h1>Study plan</h1><p class="muted">Enter your daily hours and exam date. The plan puts must-study units first and short flashcard reviews every day. It schedules Practice Exam 1 two days before the exam and Practice Exam 2 the day before. Re-generate it any time; it uses what you've already finished.</p>
  <div class="card noprint"><div class="row"><label class="f">Hours per day<input id="ph" type="number" min="0.5" max="12" step="0.5" value="${esc(p.hours)}"></label>
  <label class="f">Start date<input id="ps" type="date" value="${esc(p.start || todayStr())}"></label>
  <label class="f">Exam date<input id="pd" type="date" value="${esc(p.date)}"></label>
  <button class="btn" id="gen" style="align-self:flex-end">Generate</button><button class="btn ghost" style="align-self:flex-end" onclick="window.print()">Print</button></div></div><div id="planOut"></div>`;
  const gen = () => {
    const hours = Math.max(0.5, Math.min(12, parseFloat($('#ph').value) || 1.5)); const date = $('#pd').value; const start = $('#ps').value || todayStr();
    S.plan = {hours, date, start}; save();
    $('#planOut').innerHTML = date ? planHTML(hours, start, date) : '<p class="muted">Pick an exam date.</p>';
  };
  $('#gen').onclick = gen; if (p.date) gen();
}
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtD(d){ return d.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}); }
function planHTML(hours, startS, examS){
  const start = parseD(startS), exam = parseD(examS);
  const days = Math.round((exam - start) / DAY);
  if (days < 1) return '<div class="banner">The exam date must be after the start date.</div>';
  const cap = hours * 60;
  const tasks = allTasks().filter(t => !t.done && !['examA','examB','review','mist','cheat'].includes(t.id))
    .map(t => ({label: t.label, min: Math.max(10, Math.round(t.frac ? t.min * (1 - t.frac) : t.min))}));
  const studyDays = Math.max(0, days - 2); // last 2 days before exam reserved for practice exams
  const daily = Math.min(20, Math.round(cap * 0.2)); // flashcard review slot
  const plan = [];
  for (let i = 0; i < studyDays; i++) plan.push({d: new Date(start.getTime() + i * DAY), items: [], used: 0});
  let ti = 0, rem = tasks.length ? tasks[0].min : 0, part = 1;
  for (const day of plan) {
    if (ti > 0 || plan.indexOf(day) > 0) { day.items.push(`Flashcards: due cards (${daily} min)`); day.used += daily; }
    while (ti < tasks.length && day.used < cap - 5) {
      const take = Math.min(rem, cap - day.used);
      const t = tasks[ti];
      day.items.push(`${t.label}${take < rem || part > 1 ? ` (part ${part})` : ''} · ${Math.round(take)} min`);
      day.used += take; rem -= take;
      if (rem <= 0.5) { ti++; part = 1; rem = ti < tasks.length ? tasks[ti].min : 0; } else part++;
    }
    if (ti >= tasks.length && day.used < cap - 15) { day.items.push(`Mistake log drill + cheat-sheet redraw · ${Math.round(cap - day.used)} min`); day.used = cap; }
  }
  const leftover = tasks.slice(ti).reduce((a,t,k) => a + (k === 0 ? rem : t.min), 0);
  const e2 = new Date(exam.getTime() - DAY), e1 = new Date(exam.getTime() - 2 * DAY);
  if (days >= 2) plan.push({d: e1, items: ['<b>Practice Exam 1</b> (90 min, timed) · then review every miss (60 min)', 'Flashcards: missed only']});
  plan.push({d: e2, items: [`<b>Practice Exam ${days >= 2 ? 2 : '1 and 2 (split if you must)'}</b> (90 min, timed) · then review every miss`, 'Redraw the cheat sheet from memory once', 'If either exam is below 75%, consider moving your test date']});
  plan.push({d: exam, items: ['<b>EXAM DAY</b>. 20 min: skim the cheat sheet and run due flashcards. Then go take it. Pace: 45 s per question; guess and flag rather than stall.']});
  const need = (tasks.reduce((a,t) => a + t.min, 0) + studyDays * daily) / Math.max(1, studyDays) / 60;
  return `${leftover > 0 ? `<div class="banner">Not enough time: about ${(leftover/60).toFixed(1)} h of material doesn't fit. You'd need about <b>${need.toFixed(1)} h/day</b>, or a later exam date. The schedule below covers the highest-priority units first.</div>` : ''}
  <div class="card tablewrap plan"><table><thead><tr><th>Day</th><th>Do this</th></tr></thead><tbody>${plan.map((p, k) => `<tr><td><b>${fmtD(p.d)}</b><div class="small muted">Day ${k+1}</div></td><td><ul style="margin:0;padding-left:1.1em">${p.items.map(i => `<li>${i}</li>`).join('') || '<li class="muted">Rest / catch-up</li>'}</ul></td></tr>`).join('')}</tbody></table></div>`;
}

  main.innerHTML = banners() + `<h1>About this guide</h1>
  <div class="card"><h3 style="margin-top:0">Official exam facts</h3>

  <ul><li><b>Questions:</b> ${esc(M.format.questions)} <span class="pill good">verified</span></li><li><b>Time:</b> ${M.format.time_limit_minutes} minutes <span class="pill good">verified</span></li>
  <li><b>Scoring:</b> scaled ${esc(M.scoring.scale)}; ACE-recommended passing score ${M.scoring.ace_recommended_passing_score}; ${esc(M.scoring.credit_recommendation)} <span class="pill warn">unverified</span></li>

  <p class="small muted">${esc(M.verification_note)}</p></div>
  <div class="card tablewrap"><h3 style="margin-top:0">Official weights vs. this guide</h3>
  <table><thead><tr><th>Official theme</th><th>Exam</th><th>Bank questions</th><th>Share</th></tr></thead><tbody>${M.thematic_weights.map(t => `<tr><td>${esc(t.name)}</td><td>${t.percent}%</td><td>${st.theme[t.id]}</td><td>${pct(st.theme[t.id]/st.total)}</td></tr>`).join('')}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>Official period</th><th>Exam</th><th>Bank questions</th><th>Share</th></tr></thead><tbody>${M.chronological_weights.map(t => `<tr><td>${esc(t.name)}</td><td>${t.percent}%</td><td>${st.period[t.id]}</td><td>${pct(st.period[t.id]/st.total)}</td></tr>`).join('')}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>Unit</th><th>Weight</th><th>Lesson min</th><th>Questions</th><th>Cards</th></tr></thead><tbody>${UNITS.map(u => `<tr><td>${u.n}. ${esc(u.title)}</td><td>${u.weight}%</td><td>${u.minutes}</td><td>${unitQs(u.n).length} (${pct(unitQs(u.n).length/st.total)})</td><td>${u.cards.length} (${pct(u.cards.length/CARDS.length)})</td></tr>`).join('')}</tbody></table>
  <p class="small muted">${st.total} original questions (${st.diff.e} easy / ${st.diff.m} medium / ${st.diff.h} hard). Pools: ${st.pool.quiz} in unit quizzes, ${st.pool.diag} in the diagnostic, ${st.pool.A} in Practice Exam 1, and ${st.pool.B} in Practice Exam 2. No question appears in more than one pool. Correct answers are spread evenly across A–E.</p></div>
  <div class="card"><h3 style="margin-top:0">Your data</h3><p class="small muted">Progress is saved in this browser only (localStorage). ${storageOK ? '' : '<b>Storage is currently blocked, so export your progress before closing.</b>'}</p>
  <div class="row"><button class="btn" id="exp">Export progress (JSON)</button><label class="btn ghost">Import progress<input type="file" id="imp" accept="application/json,.json" style="display:none"></label><button class="btn ghost" id="rst">Reset everything</button></div><div id="msg" class="small" style="margin-top:8px"></div></div>
  <p class="small muted">The questions are original practice items written for this guide. They are not College Board questions.</p>`;
  $('#exp').onclick = () => { const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `clep-ush2-progress-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  $('#imp').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const o = JSON.parse(r.result); if (!o || o.v !== 1) throw new Error('not a progress file'); S = sanitize(o); save(); applyTheme(); $('#msg').textContent = 'Imported.'; } catch(err){ $('#msg').textContent = 'Could not import: ' + err.message; } }; r.readAsText(f); };
  $('#rst').onclick = () => { if (confirm('Erase all progress? This cannot be undone. (Export first if unsure.)')) { S = blankState(); save(); applyTheme(); route(); } };
}

route();
</script>
