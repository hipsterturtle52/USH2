<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEP US History II</title>
<meta name="description" content="Self-paced study guide for the CLEP History of the United States II exam: lessons, quizzes, flashcards, practice exams.">
<style>
:root{
  --bg:#fbfaf7; --surface:#ffffff; --surface2:#f2f0ea; --ink:#1d232a; --muted:#5d6670; --line:#dedad0;
  --accent:#2f5d8a; --accent-ink:#ffffff; --accent-soft:#e3ecf5;
  --good:#24774a; --good-soft:#e2f2e8; --bad:#b03a2e; --bad-soft:#f8e3e0; --warn:#9a6a00; --warn-soft:#fbf0d4;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
  --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
  --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
  --shadow:none; color-scheme: dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --surface:#1b1f26; --surface2:#232832; --ink:#e7e9ec; --muted:#9aa3ad; --line:#323844;
    --accent:#7fb0e0; --accent-ink:#0f1a26; --accent-soft:#1f3042;
    --good:#5fc28a; --good-soft:#173326; --bad:#ef8579; --bad-soft:#3a1f1c; --warn:#e2b552; --warn-soft:#352b14;
    --shadow:none; color-scheme: dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{max-width:860px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:12px}
.brand{font-weight:700;text-decoration:none;color:var(--ink);font-size:1.02rem;letter-spacing:.01em}
.brand small{font-weight:500;color:var(--muted)}
.spacer{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:.85rem;cursor:pointer}
nav.tabs{max-width:860px;margin:0 auto;padding:6px 12px 8px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:999px;font-size:.9rem}
nav.tabs a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
main{max-width:860px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:1.6rem;line-height:1.25;margin:.2em 0 .5em}
h2{font-size:1.25rem;margin:1.6em 0 .5em}
h3{font-size:1.05rem;margin:1.3em 0 .4em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin:12px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.btn{display:inline-block;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.78rem;font-weight:600;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>span{background:var(--good)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.banner{background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-size:.92rem}
/* lesson */
.lesson{font-family:var(--serif);font-size:1.08rem;line-height:1.7}
.lesson h2{font-family:var(--sans)}
.lesson h3{font-family:var(--sans)}
.lesson p{margin:.7em 0}
.lesson strong{font-weight:700}
.lesson ul{padding-left:1.2em}
.cec{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin:14px 0;font-family:var(--sans);font-size:.88rem}
.cec div.b{background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.cec div.b b{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cec .ar{align-self:center;color:var(--muted)}
@media (max-width:600px){.cec{grid-template-columns:1fr}.cec .ar{transform:rotate(90deg);justify-self:center}}
.mustknow{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 12px 12px 0;padding:12px 16px}
.mustknow ol{margin:.3em 0;padding-left:1.3em}
.mustknow li{margin:.35em 0}
/* timeline */
.tl{position:relative;margin:10px 0 10px 6px;padding-left:22px;border-left:2px solid var(--line)}
.tl .ev{position:relative;margin:0 0 12px}
.tl .ev::before{content:"";position:absolute;left:-29px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.tl .ev.key::before{background:var(--accent);border-color:var(--accent)}
.tl .yr{font-weight:700;font-variant-numeric:tabular-nums;margin-right:8px}
.tl .ev.key .yr{color:var(--accent)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.stem{font-size:1.07rem;font-weight:500;margin:6px 0 12px}
.stim{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-family:var(--serif);font-size:1rem}
.stim table{font-family:var(--sans);font-size:.88rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;align-items:flex-start}
.opt:hover{border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt .ex{display:block;font-size:.88rem;color:var(--muted);margin-top:4px}
.opt.right .ex,.opt.wrong .ex{color:var(--ink)}
.opt[disabled]{cursor:default}
.kbd{font:600 .75rem var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface2)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;margin-top:10px}
.navgrid button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:6px;padding:4px 0;font:inherit;font-size:.75rem;cursor:pointer}
.navgrid button.ans{background:var(--accent-soft);color:var(--ink)}
.navgrid button.cur{outline:2px solid var(--accent)}
.navgrid button.flag{border-color:var(--warn);border-width:2px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.timer.low{color:var(--bad)}
/* flashcards */
.fc{min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;padding:28px 20px;cursor:pointer;user-select:none}
.fc .back{font-size:1.02rem;font-family:var(--serif);line-height:1.6}
.boxes{display:flex;gap:6px;align-items:flex-end;height:70px;margin:8px 0}
.boxes div{flex:1;background:var(--accent);border-radius:5px 5px 0 0;min-height:3px;position:relative;opacity:.85}
.boxlbl{display:flex;gap:6px}.boxlbl span{flex:1;text-align:center;font-size:.75rem;color:var(--muted)}
/* readiness */
.meter{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dial{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.3rem;flex:none}
.dial span{background:var(--surface);width:82px;height:82px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1}
.dial small{font-size:.65rem;color:var(--muted);font-weight:600;text-transform:uppercase}
/* cheat sheet */
.cheat{font-size:.82rem;line-height:1.35;columns:2 300px;column-gap:20px}
.cheat section{break-inside:avoid;margin:0 0 12px}
.cheat h3{margin:.2em 0 .3em;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.cheat table{font-size:.78rem}
.cheat td,.cheat th{padding:2px 4px}
.cheat ul{margin:0;padding-left:1em}
.cheat.memo .m{filter:blur(5px);cursor:pointer;transition:filter .15s}
.cheat.memo .m.show{filter:none}
.kbdhint{font-size:.8rem;color:var(--muted);margin-top:10px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}
.plan td:first-child{white-space:nowrap}
.tag{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media print{
  header.top,.noprint,.banner{display:none!important}
  body{background:#fff;color:#000;font-size:10pt}
  main{max-width:none;padding:0}
  .card{border:none;box-shadow:none;padding:0;margin:0}
  .cheat{columns:3;column-gap:12px;font-size:6.6pt;line-height:1.22}
  .cheat h3{font-size:7pt;color:#000;margin:0 0 1px}
  .cheat table{font-size:6.3pt}
  .cheat section{margin:0 0 5px}
  .cheat.memo .m{filter:none}
  .printhead{font-size:9pt;margin:0 0 4px}
  @page{size:letter;margin:.35in}
}
</style>

t":70,"status":"verified"}],"skills_tested":{"items":["Identify and describe historical phenomena","Analyze and interpret historical phenomena","Compare and contrast historical phenomena"],"status":"verified (listed without percentages)"},"unit_plan":[{"unit":1,"title":"Reconstruction and the New South","years":"1865-1900","period":"early","weight":8},{"unit":2,"title":"The Gilded Age: Industry, Labor, the West, and the Cities","years":"1865-1900","period":"early","weight":12},{"unit":3,"title":"Populism, Empire, and the Progressive Era","years":"1890-1914","period":"early","weight":10},{"unit":4,"title":"World War I and the 1920s","years":"1914-1929","period":"late","weight":10},{"unit":5,"title":"The Great Depression and the New Deal","years":"1929-1941","period":"late","weight":10},{"unit":6,"title":"World War II","years":"1939-1945","period":"late","weight":8},{"unit":7,"title":"Early Cold War and the 1950s","years":"1945-1960","period":"late","weight":11},{"unit":8,"title":"Civil Rights, the Great Society, and Vietnam","years":"1954-1975","period":"late","weight":13},{"unit":9,"title":"From Watergate to Reagan","years":"1968-1989","period":"late","weight":9},{"unit":10,"title":"Contemporary America","years":"1989-present","period":"late","weight":9}],"unit_plan_note":"The official outline is thematic (5 themes) plus chronological (2 periods). Units are chronological so the story can be learned in order; unit weights sum to the official 30% (1865-1914) / 70% (1915-present) split. Every question also carries a theme tag, and the bank is balanced to the official 30/30/10/20/10 theme weights."},"stats":{"total":157,"theme":{"cul":31,"dip":13,"eco":20,"pol":45,"soc":48},"period":{"early":120,"late":37},"diff":{"e":38,"m":85,"h":34},"pool":{"quiz":49,"diag":12,"A":48,"B":48}},"cheat":"<p>Cheat sheet coming soon.<\/p>","questions":[{"id":"u1q01","u":1,"th":"pol","d":"e","pool":"B","s":"Which constitutional amendment established that all persons born in the United States are citizens and guaranteed them \"equal protection of the laws\"?","st":"","o":["The Sixteenth Amendment","The Fourteenth Amendment","The Thirteenth Amendment","The Nineteenth Amendment","The Fifteenth Amendment"],"e":["The Sixteenth Amendment (1913) authorized a federal income tax.","Ratified in 1868, the Fourteenth Amendment defined national citizenship and barred states from denying due process or equal protection.","The Thirteenth Amendment (1865) abolished slavery but did not define citizenship.","The Nineteenth Amendment (1920) guaranteed women's suffrage.","The Fifteenth Amendment (1870) dealt with voting rights, not citizenship."],"a":1},{"id":"u1q02","u":1,"th":"pol","d":"e","pool":"A","s":"The Fifteenth Amendment (1870) prohibited states from denying the right to vote on the basis of","st":"","o":["age, for citizens 18 or older","sex","race, color, or previous condition of servitude","failure to pay a poll tax","literacy"],"e":["The voting age was lowered to 18 by the Twenty-sixth Amendment (1971).","Sex was deliberately left out, which angered woman suffrage leaders. Women won the vote only with the Nineteenth Amendment in 1920.","This is the amendment's exact wording. It aimed to protect Black men's suffrage.","Poll taxes in federal elections were banned only by the Twenty-fourth Amendment (1964).","The Fifteenth Amendment said nothing about literacy, which is why southern states could later use literacy tests."],"a":2},{"id":"u1q03","u":1,"th":"pol","d":"m","pool":"B","s":"Congress passed the Reconstruction Acts of 1867 mainly in response to which of the following?","st":"","o":["Southern states' passage of Black Codes and their refusal to ratify the Fourteenth Amendment","A Supreme Court ruling that the Thirteenth Amendment was unconstitutional","The disputed presidential election of 1876","A wave of Black migration to Kansas","The assassination of Abraham Lincoln"],"e":["The Black Codes, the 1866 riots, and southern rejection of the Fourteenth Amendment convinced Congress to impose military reconstruction.","No such ruling occurred. The Thirteenth Amendment was never struck down.","That election came almost a decade later and led to the end of Reconstruction, not its start.","The Exoduster migration happened in 1879, after Reconstruction ended.","Lincoln's death in 1865 brought Johnson to power, but the 1867 acts responded to what southern governments did under Johnson's lenient plan."],"a":0},{"id":"u1q04","u":1,"th":"pol","d":"m","pool":"diag","s":"The House of Representatives impeached President Andrew Johnson in 1868 chiefly because he had","st":"","o":["ordered federal troops out of the South","purchased Alaska without congressional approval","refused to enforce the Fifteenth Amendment","accepted bribes in the Crédit Mobilier scandal","removed Secretary of War Edwin Stanton in apparent violation of the Tenure of Office Act"],"e":["Troops were withdrawn in 1877 under Hayes, not by Johnson.","The Senate approved the Alaska treaty, and it was not a ground for impeachment.","The Fifteenth Amendment was not ratified until 1870, after Johnson left office.","Crédit Mobilier involved congressmen and Grant-era officials, not Johnson's impeachment.","The formal charges centered on Stanton's dismissal, though the real conflict was over Johnson's obstruction of Congressional Reconstruction."],"a":4},{"id":"u1q05","u":1,"th":"pol","d":"m","pool":"quiz","s":"Which of the following was a direct result of the Compromise of 1877?","st":"","o":["The Fifteenth Amendment was ratified.","Southern states were divided into five military districts.","Samuel Tilden became president.","Federal troops were withdrawn from the remaining Reconstruction governments in the South.","The Freedmen's Bureau was created."],"e":["The Fifteenth Amendment was ratified in 1870.","Military districts were created by the Reconstruction Acts of 1867, the start of Radical Reconstruction rather than its end.","Tilden won the popular vote but lost the presidency to Hayes under the compromise.","In return for Democrats accepting Hayes's election, the last federal troops left southern statehouses, ending Reconstruction.","The Freedmen's Bureau was created in 1865."],"a":3},{"id":"u1q06","u":1,"th":"pol","d":"h","pool":"quiz","s":"Which of the following occurred FIRST?","st":"","o":["The Fifteenth Amendment was ratified.","Andrew Johnson was impeached by the House.","Hiram Revels took his seat in the U.S. Senate.","Rutherford B. Hayes became president.","Southern legislatures enacted Black Codes."],"e":["The Fifteenth Amendment was ratified in 1870.","Johnson's impeachment came in 1868.","Revels was seated in 1870.","Hayes took office in 1877.","The Black Codes were passed in 1865–1866 under Presidential Reconstruction, before every other event listed."],"a":4},{"id":"u1q07","u":1,"th":"soc","d":"e","pool":"quiz","s":"Immediately after emancipation, which of the following was a top priority for many freedpeople?","st":"","o":["Emigrating to Africa","Moving to the Great Plains as cattle ranchers","Reuniting families that had been separated by slavery","Joining the Democratic Party","Returning to work for their former owners for wages under the same conditions as slavery"],"e":["Some emigration schemes existed, but very few freedpeople chose to leave.","A few moved West, but ranching was not a widespread priority.","Freedpeople traveled widely and placed newspaper ads searching for relatives sold away. Family reunification was a defining early goal.","Freedmen overwhelmingly supported the Republican Party, the party of Lincoln and Reconstruction.","Freedpeople resisted gang labor and conditions resembling slavery. This is why sharecropping emerged as a compromise."],"a":2},{"id":"u1q08","u":1,"th":"soc","d":"m","pool":"quiz","s":"The most lasting achievement of the Freedmen's Bureau was in the field of","st":"","o":["education","voting rights enforcement","immigration control","land redistribution","railroad construction"],"e":["With northern aid societies, the Bureau set up thousands of schools and helped found Black colleges such as Howard and Fisk.","Voting rights were enforced, briefly, by the army and the Enforcement Acts, not mainly by the Bureau.","Immigration had nothing to do with the Bureau's mission.","Most confiscated land was returned to former owners after Johnson's pardons, so redistribution largely failed.","The Bureau did not build railroads."],"a":0},{"id":"u1q09","u":1,"th":"soc","d":"m","pool":"A","s":"The Black Codes passed by southern states in 1865–1866 were designed primarily to","st":"","o":["implement the provisions of the Fourteenth Amendment","restrict the freedom of formerly enslaved people and keep them as a controlled labor force","provide public schools for Black children","redistribute plantation land to freedpeople","grant freedpeople limited voting rights"],"e":["The codes contradicted equal protection. Their passage helped prompt the amendment.","Vagrancy laws, mandatory labor contracts, and limits on land ownership kept freedpeople working on plantations under white control.","The first southern public school systems came from Reconstruction governments, not the Black Codes.","The codes protected white landowners' interests rather than redistributing land.","The Black Codes did not grant suffrage. Southern governments under Johnson refused Black voting."],"a":1},{"id":"u1q10","u":1,"th":"pol","d":"m","pool":"quiz","s":"Thaddeus Stevens and Charles Sumner are best known as leaders of which group?","st":"","o":["Populists who demanded free silver","Copperheads who opposed the Civil War","Liberal Republicans who opposed Grant in 1872","Radical Republicans in Congress who pushed for Black civil rights and strict terms for the South","Redeemer Democrats who ended Reconstruction"],"e":["Populism arose in the 1890s, after both men had died.","Copperheads were antiwar Democrats. Stevens and Sumner were firm Unionists.","The Liberal Republicans of 1872 (Horace Greeley) wanted to end Reconstruction. Sumner did briefly side with them in 1872, but neither man is known as their leader.","Stevens (House) and Sumner (Senate) led the Radicals who took control of Reconstruction in 1867.","Redeemers were southern Democrats, opponents of the Radicals."],"a":3},{"id":"u1q11","u":1,"th":"pol","d":"e","pool":"A","s":"The Supreme Court's decision in Plessy v. Ferguson (1896) is significant because it","st":"","o":["upheld state-mandated racial segregation under the \"separate but equal\" doctrine","declared that Black Americans could not be citizens","struck down poll taxes in federal elections","established the right of the Court to review state laws","outlawed segregation in public schools"],"e":["Plessy approved segregated railroad cars, giving constitutional cover to Jim Crow for nearly 60 years.","That was Dred Scott v. Sandford (1857), which the Fourteenth Amendment overturned.","Poll taxes in federal elections ended with the Twenty-fourth Amendment (1964).","Judicial review dates to Marbury v. Madison (1803).","Segregated schools were struck down in Brown v. Board of Education (1954), which overturned Plessy's reasoning."],"a":0},{"id":"u1q12","u":1,"th":"pol","d":"h","pool":"A","s":"The statement above comes from","st":"<p>\"Our Constitution is color-blind, and neither knows nor tolerates classes among citizens.\"<\/p>","o":["Justice John Marshall Harlan's dissent in Plessy v. Ferguson","the majority opinion in the Civil Rights Cases","Booker T. Washington's Atlanta Compromise speech","the text of the Fifteenth Amendment","the majority opinion in Plessy v. Ferguson"],"e":["Harlan was the lone dissenter in Plessy. He argued that segregation violated the Fourteenth Amendment.","The majority in 1883 struck down the Civil Rights Act of 1875. (Harlan dissented there too, but this line is from Plessy.)","Washington's speech accepted social segregation for the time being. It did not attack it on constitutional grounds.","The Fifteenth Amendment concerns voting and does not contain this language.","The majority upheld segregation, the opposite of this statement."],"a":0},{"id":"u1q13","u":1,"th":"soc","d":"m","pool":"A","s":"In his 1895 Atlanta Compromise speech, Booker T. Washington urged Black Americans to","st":"","o":["form a separate political party to contest southern elections","emigrate to Africa to escape discrimination","focus on vocational training and economic progress while temporarily accepting segregation","support the Populist Party's alliance of Black and white farmers","demand immediate social and political equality through protest"],"e":["Washington avoided direct political confrontation.","Back-to-Africa ideas are associated with Marcus Garvey in the 1920s.","Washington argued that economic self-help would earn respect and rights over time. Critics saw this as accommodation to Jim Crow.","Washington did not tie himself to the Populists.","This was Du Bois's position, not Washington's."],"a":2},{"id":"u1q14","u":1,"th":"cul","d":"m","pool":"B","s":"W.E.B. Du Bois criticized Booker T. Washington chiefly because Du Bois believed that African Americans should","st":"","o":["separate completely from white society and return to Africa","demand full civil and political rights immediately and develop a college-educated \"Talented Tenth\"","avoid politics until they had achieved economic independence","move to the West to claim homesteads","concentrate on industrial and agricultural training"],"e":["Separatism is associated with Marcus Garvey, whom Du Bois opposed.","In <em>The Souls of Black Folk<\/em> (1903), Du Bois rejected accommodation and called for higher education and immediate equal rights.","This summarizes Washington's gradualism, which Du Bois opposed.","Du Bois did not promote western migration.","That was Washington's program at Tuskegee."],"a":1},{"id":"u1q15","u":1,"th":"soc","d":"e","pool":"A","s":"Ida B. Wells is best known for her","st":"","o":["novel <em>Uncle Tom's Cabin<\/em>","founding of Tuskegee Institute","journalism exposing and campaigning against lynching","service as the first African American U.S. senator","leadership of the Exoduster migration to Kansas"],"e":["Harriet Beecher Stowe wrote <em>Uncle Tom's Cabin<\/em> (1852).","Tuskegee was founded by Booker T. Washington.","Wells documented lynchings in works such as <em>Southern Horrors<\/em> (1892) and fought for federal anti-lynching action.","That was Hiram Revels (1870).","The Exodusters are associated with Benjamin \"Pap\" Singleton."],"a":2},{"id":"u1q16","u":1,"th":"soc","d":"m","pool":"B","s":"Southern \"grandfather clauses\" of the 1890s were designed to","st":"","o":["guarantee voting rights to elderly freedmen","require voters to have lived in the state for three generations","exempt white men from literacy tests and poll taxes if their ancestors could vote before 1867","let grandsons of Confederate veterans skip military service","give land to the descendants of formerly enslaved people"],"e":["They did the opposite. They shielded white voters, not freedmen.","The clauses exempted voters from tests. They did not set residency requirements.","Since Black men could not vote before 1867, these clauses disfranchised Black voters while protecting poor whites' votes.","The clauses concerned voting, not military service.","No such land policy existed."],"a":2},{"id":"u1q17","u":1,"th":"eco","d":"m","pool":"quiz","s":"Under the crop-lien system that spread across the postwar South,","st":"","o":["railroads guaranteed minimum prices for cotton","merchants supplied seed and goods on credit in exchange for a claim on the farmer's future crop","the federal government lent farmers money at low interest","farmers pooled crops in cooperatives to bypass middlemen","landowners paid farm workers fixed daily wages"],"e":["Railroads set shipping rates. They did not guarantee crop prices.","High interest and falling cotton prices meant many farmers never got out of debt.","Federal farm credit programs came much later (Federal Farm Loan Act 1916, New Deal).","Cooperatives were a Farmers' Alliance remedy against the crop-lien system, not the system itself.","Wage labor was not the crop-lien arrangement. Credit secured by the crop was."],"a":1},{"id":"u1q18","u":1,"th":"eco","d":"m","pool":"A","s":"Henry Grady's idea of a \"New South\" called for the South to","st":"","o":["restore a plantation economy based on slave labor","rely entirely on cotton exports to Britain","industrialize and diversify its economy by attracting northern investment","redistribute land to freedpeople","secede again from the Union"],"e":["Slavery was abolished, and Grady looked forward rather than back.","Dependence on cotton was the problem the New South idea was meant to fix.","Grady, an Atlanta editor, promoted textile mills, railroads, and industry alongside reconciliation with the North.","Grady did not advocate land redistribution.","Grady preached sectional reconciliation, not secession."],"a":2},{"id":"u1q19","u":1,"th":"eco","d":"m","pool":"diag","s":"The arrangement described is best identified as","st":"<p>The following terms are typical of a contract signed in Georgia in 1867: The laborer agrees to cultivate the land and furnish his own labor. The owner furnishes land, a mule, tools, and seed. At harvest the owner receives one-half of the crop, and from the laborer's half are deducted all advances of food and supplies.<\/p>","o":["indentured servitude","sharecropping","the encomienda system","wage labor","homesteading"],"e":["Indentured servants worked a fixed term to repay passage. They were not paid a crop share.","The laborer works the owner's land and supplies and is paid with a share of the crop. That is the defining feature of sharecropping.","Encomienda was a Spanish colonial labor system.","Wage laborers receive fixed cash pay, not a share of the harvest.","Homesteaders got title to public land by living on and improving it."],"a":1},{"id":"u1q20","u":1,"th":"pol","d":"h","pool":"B","s":"Supreme Court decisions such as the Slaughterhouse Cases (1873) and United States v. Cruikshank (1876) affected Reconstruction by","st":"","o":["narrowing the protections of the Fourteenth Amendment and leaving the protection of Black citizens largely to the states","declaring the Reconstruction Acts unconstitutional","guaranteeing land to freedpeople as compensation for slavery","requiring the federal government to enforce desegregation of public schools","expanding federal power to prosecute private acts of violence"],"e":["These rulings read federal protections narrowly. In practice, that let southern states and private violence undermine Black rights.","Neither case struck down the Reconstruction Acts.","No Supreme Court decision required land grants.","Court-ordered school desegregation began with Brown (1954).","Cruikshank did the reverse. It overturned federal convictions from the Colfax Massacre."],"a":0},{"id":"u1q21","u":1,"th":"pol","d":"m","pool":"B","s":"The Crédit Mobilier and Whiskey Ring scandals are associated with the presidency of","st":"","o":["Andrew Johnson","Rutherford B. Hayes","Grover Cleveland","Ulysses S. Grant","Abraham Lincoln"],"e":["Johnson's presidency was defined by his clashes with Congress, not these scandals.","Hayes came to office in 1877 promising reform after the Grant-era scandals.","Cleveland was known for honesty and vetoes in the 1880s–1890s.","Both scandals tarnished Grant's administration (1869–1877) and weakened northern support for Republican Reconstruction.","Lincoln died in 1865. These scandals came to light in the 1870s."],"a":3},{"id":"u1q22","u":1,"th":"soc","d":"m","pool":"A","s":"The Enforcement Acts and the Ku Klux Klan Act of 1870–1871 were passed in order to","st":"","o":["prohibit Black men from serving on juries","end military occupation of the South","protect Black voters and officeholders from terrorist violence","establish segregated public facilities","grant amnesty to former Confederate officers"],"e":["The acts aimed to protect, not restrict, Black civil rights.","They expanded federal enforcement rather than ending it.","These laws let federal courts and troops prosecute the Klan, which briefly broke the first Klan.","Segregation laws came from southern states later, not from these federal acts.","Amnesty came through presidential pardons and the Amnesty Act of 1872, not these acts."],"a":2},{"id":"u1q23","u":1,"th":"soc","d":"e","pool":"B","s":"Hiram Revels is historically significant as the","st":"","o":["head of the Freedmen's Bureau","first African American to serve in the U.S. Senate","Supreme Court justice who dissented in Plessy","author of <em>Up From Slavery<\/em>","founder of the NAACP"],"e":["General Oliver O. Howard headed the Freedmen's Bureau.","Revels was elected from Mississippi and seated in 1870.","The Plessy dissenter was John Marshall Harlan.","<em>Up From Slavery<\/em> is Booker T. Washington's autobiography.","The NAACP was founded in 1909 by a multiracial group including Du Bois."],"a":1},{"id":"u1q24","u":1,"th":"pol","d":"m","pool":"A","s":"Lincoln's Ten Percent Plan differed from the Wade-Davis Bill in that Lincoln's plan","st":"","o":["required Black male suffrage, while Wade-Davis did not","placed the South under military rule, while Wade-Davis did not","was passed by Congress over a presidential veto","confiscated all plantations, while Wade-Davis protected property","allowed a state to be restored once 10 percent of its 1860 voters took a loyalty oath, while Wade-Davis required a majority"],"e":["Neither plan required Black suffrage. That came with the 1867 Reconstruction Acts.","Military districts came in 1867 under Congress, not Lincoln's plan.","The Ten Percent Plan was an executive proclamation, not a law passed over a veto.","Lincoln's plan offered pardons and protected most property except enslaved people.","Lincoln favored a quick, lenient restoration. Congress's Wade-Davis Bill demanded 50 percent and an ironclad oath, and Lincoln pocket-vetoed it."],"a":4},{"id":"u1q25","u":1,"th":"dip","d":"e","pool":"quiz","s":"In 1867 the United States purchased Alaska from","st":"","o":["Spain","Russia","Mexico","France","Great Britain"],"e":["Spain gave up Florida (1819) and later Puerto Rico and the Philippines (1898), not Alaska.","Secretary of State William Seward bought Alaska from Russia for $7.2 million, which critics mocked as \"Seward's Folly.\"","Mexico ceded the Southwest in 1848. It never held Alaska.","France sold Louisiana in 1803.","Britain controlled Canada, not Alaska."],"a":1},{"id":"u1q26","u":1,"th":"soc","d":"h","pool":"A","s":"The \"Exodusters\" of 1879 were","st":"","o":["Chinese laborers expelled from California","white farmers who abandoned the Dust Bowl for California","former Confederates who emigrated to Brazil","African Americans who left the South for Kansas to escape violence and economic oppression after Reconstruction","Mormon settlers who moved from Illinois to Utah"],"e":["Chinese exclusion is a separate story (1882 act). They were not called Exodusters.","That describes the \"Okies\" of the 1930s.","Some Confederates did go to Brazil (the Confederados), but they were not called Exodusters.","Thousands left after the troops were withdrawn, hoping for land and safety on the plains.","The Mormon migration took place in the 1840s."],"a":3},{"id":"u1q27","u":1,"th":"cul","d":"e","pool":"quiz","s":"Booker T. Washington founded which institution in 1881 to provide industrial and agricultural education?","st":"","o":["Tuskegee Institute","Harvard University","The NAACP","Howard University","Hull House"],"e":["Washington built Tuskegee in Alabama into a model of vocational education.","Harvard is a colonial-era university (1636). Du Bois earned his PhD there.","The NAACP is a civil rights organization founded in 1909.","Howard was founded in 1867 with Freedmen's Bureau support and offered a liberal arts curriculum.","Hull House was Jane Addams's Chicago settlement house (1889)."],"a":0},{"id":"u1q28","u":1,"th":"cul","d":"h","pool":"quiz","s":"The \"Lost Cause\" interpretation of the Civil War, widely promoted in the South after Reconstruction, held that","st":"","o":["the war had been lost because of Black soldiers' desertion","the North had been right to abolish slavery","Reconstruction was a success that should be extended","the Confederacy had fought nobly for states' rights and honor rather than to preserve slavery","the South should industrialize to compete with the North"],"e":["That was not the Lost Cause argument. Black Union soldiers fought with distinction.","Lost Cause advocates minimized slavery rather than celebrating abolition.","Lost Cause writers portrayed Reconstruction as a disastrous era of corruption.","This myth shaped monuments, textbooks, and white southern memory, and it downplayed slavery's central role.","That is the New South argument, a separate idea."],"a":3},{"id":"u1q29","u":1,"th":"pol","d":"m","pool":"quiz","s":"The southern Democrats who regained control of state governments in the 1870s and ended Reconstruction called themselves","st":"","o":["Copperheads","Half-Breeds","Mugwumps","Redeemers","Know-Nothings"],"e":["Copperheads were northern Democrats who opposed the Civil War.","Half-Breeds were a moderate Republican faction of the 1870s–80s that favored civil service reform.","Mugwumps were reform-minded Republicans who backed Democrat Grover Cleveland in 1884.","They claimed to \"redeem\" the South from Republican rule, then cut spending on schools and began rolling back Black rights.","The Know-Nothings were a nativist party of the 1850s."],"a":3},{"id":"u1q30","u":1,"th":"soc","d":"e","pool":"B","s":"During Reconstruction, white southerners who supported the Republican Party were called","st":"","o":["doughfaces","Redeemers","Exodusters","scalawags","carpetbaggers"],"e":["Doughfaces were pre–Civil War northerners with southern sympathies.","Redeemers were the Democrats who overthrew Republican rule.","Exodusters were Black migrants to Kansas.","Opponents used the insult \"scalawag\" for white southerners who cooperated with Republican governments.","Carpetbaggers were northerners who moved South, not native southerners."],"a":3},{"id":"u1q31","u":1,"th":"pol","d":"m","pool":"B","s":"In 1867 a former Confederate state that wanted its representatives seated in Congress first had to write a new constitution guaranteeing Black male suffrage and ratify the Fourteenth Amendment. This requirement came from","st":"","o":["the Reconstruction Acts passed by Congress","the Supreme Court's decision in Plessy v. Ferguson","Lincoln's Ten Percent Plan","Andrew Johnson's amnesty proclamation","the Compromise of 1877"],"e":["The 1867 Reconstruction Acts set these conditions and placed the South under military supervision until they were met.","Plessy (1896) concerned segregation, not readmission.","Lincoln's plan required only a 10 percent loyalty oath and made no mention of Black suffrage.","Johnson's plan readmitted states with few conditions.","The Compromise ended Reconstruction. It set no readmission conditions."],"a":0},{"id":"u1q32","u":1,"th":"pol","d":"h","pool":"B","s":"In the Civil Rights Cases (1883), the Supreme Court ruled that","st":"","o":["Congress could ban racial discrimination in hotels under its commerce power","the Fifteenth Amendment guaranteed voting rights to women","the Fourteenth Amendment barred discrimination by states but not by private individuals and businesses","segregated public schools were unconstitutional","Black Codes were constitutional"],"e":["That reasoning was upheld only in 1964 (Heart of Atlanta Motel v. U.S.).","The Court never read the Fifteenth Amendment to cover sex.","This \"state action\" reasoning struck down the Civil Rights Act of 1875's ban on discrimination in inns, theaters, and railroads.","That was Brown v. Board of Education (1954).","The Black Codes had been superseded by the Civil Rights Act of 1866 and the Fourteenth Amendment. They were not the issue in 1883."],"a":2},{"id":"u1q33","u":1,"th":"cul","d":"m","pool":"quiz","s":"During and after Reconstruction, independent Black churches became important primarily because they","st":"","o":["were required by federal law in every southern county","were funded and controlled by the Freedmen's Bureau","opposed education for freedpeople","encouraged members to join the Democratic Party","served as centers of community life, education, and political organizing"],"e":["No federal law required churches. Establishing religion would violate the First Amendment.","The churches were independent institutions, not Bureau agencies.","Churches were among the strongest supporters of Black education.","Black voters and leaders overwhelmingly backed the Republicans.","Free of white control, Black churches hosted schools and meetings and produced many Reconstruction-era leaders."],"a":4},{"id":"u1q34","u":1,"th":"soc","d":"h","pool":"quiz","s":"Freedpeople's hopes of receiving \"forty acres and a mule\" were largely disappointed because","st":"","o":["Radical Republicans opposed any land redistribution","the Fifteenth Amendment prohibited land grants to freedpeople","most freedpeople preferred to move to northern cities","President Johnson's pardons restored most confiscated land to its former owners","the Homestead Act of 1862 excluded all southern land"],"e":["Thaddeus Stevens actually proposed confiscating planter land for freedpeople. Moderates and Johnson blocked it.","The Fifteenth Amendment concerns voting and says nothing about land.","The Great Migration north came decades later. Most freedpeople wanted land in the South.","Sherman's Field Order No. 15 had set aside coastal land, but Johnson reversed it and returned land to pardoned planters.","The Southern Homestead Act of 1866 opened some southern public land, but it was poor land and the program largely failed."],"a":3},{"id":"u2q01","u":2,"th":"pol","d":"m","pool":"quiz","s":"The Pendleton Civil Service Act of 1883 was passed largely in reaction to","st":"","o":["the Crédit Mobilier railroad scandal","the Supreme Court's decision in Wabash v. Illinois","the Haymarket bombing in Chicago","the Pullman Strike","the assassination of President Garfield by a disappointed office-seeker"],"e":["Crédit Mobilier (1872) involved bribery of congressmen and fed general reform sentiment, but it was not the trigger for the 1883 act.","Wabash (1886) led to the Interstate Commerce Act, not civil service reform.","Haymarket (1886) produced anti-labor and anti-immigrant backlash, not civil service reform.","The Pullman Strike took place in 1894, after the Pendleton Act.","Garfield's murder by Charles Guiteau dramatized the evils of the spoils system and pushed Congress to require merit exams for some federal jobs."],"a":4},{"id":"u2q02","u":2,"th":"pol","d":"m","pool":"B","s":"The Interstate Commerce Act of 1887 was significant because it","st":"","o":["established an eight-hour day for railroad workers","nationalized the major railroads","broke up the Standard Oil Company","created the first federal regulatory agency to oversee railroad rates","granted public land to transcontinental railroads"],"e":["The eight-hour day for railroad workers came with the Adamson Act of 1916.","The railroads stayed privately owned. The government briefly ran them only during World War I.","Standard Oil was broken up by the Supreme Court in 1911 under the Sherman Act.","The ICC was meant to ensure \"reasonable and just\" rates. It was weak at first but set a precedent for federal regulation.","Land grants came earlier, in the Pacific Railway Acts of the 1860s."],"a":3},{"id":"u2q03","u":2,"th":"pol","d":"h","pool":"diag","s":"In United States v. E.C. Knight Co. (1895), the Supreme Court weakened the Sherman Antitrust Act by ruling that","st":"","o":["manufacturing was not interstate commerce, so a sugar-refining monopoly was beyond the act's reach","states, not Congress, had the sole power to regulate railroads","the federal government could regulate railroad rates but not stock sales","the act violated the Fourteenth Amendment's due process clause","labor unions could never be prosecuted as combinations in restraint of trade"],"e":["Although the company controlled about 98% of sugar refining, the Court said manufacturing was local. This gutted early antitrust enforcement.","Wabash (1886) said states could NOT regulate interstate railroads.","The case concerned manufacturing monopolies, not railroad rates or stocks.","The Court did not strike the act down. It narrowed it.","The Sherman Act was actually used against unions in this era (e.g., the Pullman injunction upheld in In re Debs)."],"a":0},{"id":"u2q04","u":2,"th":"pol","d":"e","pool":"A","s":"Thomas Nast's political cartoons helped bring down which of the following?","st":"","o":["The Ku Klux Klan Act","The Populist Party","The Knights of Labor","Standard Oil's petroleum monopoly","William \"Boss\" Tweed and the Tammany Hall machine"],"e":["The Klan Act was a federal law against the Klan, not a political machine.","The Populists arose in the 1890s and were not Nast's target.","Nast did not lead a campaign against the Knights.","Standard Oil was later exposed by Ida Tarbell's writing, not Nast's cartoons.","Nast's cartoons in <em>Harper's Weekly<\/em> made Tweed's corruption visible even to voters who could not read. Tweed was convicted in the 1870s."],"a":4},{"id":"u2q05","u":2,"th":"pol","d":"h","pool":"A","s":"Which of the following correctly shows cause and effect in railroad regulation?","st":"","o":["The Pullman Strike led Congress to abolish the Interstate Commerce Commission.","Wabash v. Illinois barred states from regulating interstate rates, so Congress passed the Interstate Commerce Act.","The Interstate Commerce Act created the Granger movement.","The Sherman Antitrust Act forced the Supreme Court to decide Munn v. Illinois.","Munn v. Illinois struck down all state Granger laws."],"e":["The ICC lasted until 1995.","After Wabash (1886) blocked state regulation of interstate traffic, Congress created the ICC in 1887 to fill the gap.","The Grangers came first (1867 onward) and pushed for regulation.","Munn (1877) came 13 years before the Sherman Act (1890).","Munn upheld state regulation of grain elevators."],"a":1},{"id":"u2q06","u":2,"th":"pol","d":"h","pool":"B","s":"The data above best support which generalization about Gilded Age politics?","st":"<p>Presidential election, 1880: Garfield (R) 48.3% of popular vote, Hancock (D) 48.2%. Voter turnout: about 80% of eligible voters.<\/p><p>Presidential election, 1884: Cleveland (D) 48.9%, Blaine (R) 48.3%. Voter turnout: about 78%.<\/p>","o":["Third parties regularly won a majority of the popular vote.","Women's suffrage had greatly expanded the electorate.","Elections were extremely close and voter participation was very high.","Most eligible voters did not participate in presidential elections.","One party dominated national politics throughout the era."],"e":["The two major parties won almost all the votes in these elections.","National women's suffrage came only in 1920.","Popular-vote margins under one point and turnout around 80% characterized national elections in the period.","Turnout near 80% is far higher than in most twentieth-century elections.","The near-even splits show intense two-party competition, not domination."],"a":2},{"id":"u2q07","u":2,"th":"pol","d":"m","pool":"A","s":"The \"Mugwumps\" of 1884 were","st":"","o":["farmers who founded the Grange","supporters of unlimited coinage of silver","reform-minded Republicans who supported Democrat Grover Cleveland rather than their own party's tainted nominee","southern Democrats who overthrew Reconstruction governments","labor activists who led the Haymarket rally"],"e":["The Grange was founded by Oliver Kelley in 1867.","Free-silver supporters were mostly Populists and western Democrats.","They objected to James G. Blaine's reputation for corruption and helped elect Cleveland.","Those were the Redeemers.","The Haymarket organizers were anarchists and labor radicals, not Mugwumps."],"a":2},{"id":"u2q08","u":2,"th":"pol","d":"m","pool":"B","s":"During the Pullman Strike of 1894, President Grover Cleveland","st":"","o":["nationalized the railroads to keep trains running","signed a law guaranteeing workers the right to bargain collectively","forced George Pullman to recognize the union","refused to intervene, citing laissez-faire principles","sent federal troops to break the strike, citing interference with the U.S. mail"],"e":["There was no nationalization.","That right came with the Wagner Act in 1935.","Pullman refused to negotiate, and the government sided with him.","Cleveland intervened decisively on the employers' side.","A federal court injunction against Debs's union and Cleveland's troops ended the strike. The Supreme Court upheld the injunction in In re Debs (1895)."],"a":4},{"id":"u2q09","u":2,"th":"pol","d":"m","pool":"quiz","s":"The Dawes Severalty Act of 1887 attempted to","st":"","o":["pay compensation for land seized in violation of treaties","assimilate Native Americans by dividing tribal reservations into individual family farms","restore tribal governments and communal landholding","grant immediate full citizenship to all Native Americans","relocate all Native Americans to Oklahoma Territory"],"e":["There was no compensation. The act opened \"surplus\" land to white settlers.","Allotment aimed to make Native Americans into individual farmers and citizens. In practice, it cost them about two-thirds of their land.","That was the goal of the Indian Reorganization Act of 1934, which reversed Dawes.","Citizenship was promised only to allottees after a 25-year trust period. All Native Americans became citizens in 1924.","Removal to Indian Territory was an earlier policy (the 1830s)."],"a":1},{"id":"u2q10","u":2,"th":"eco","d":"e","pool":"diag","s":"Andrew Carnegie's control of iron mines, coal fields, ore ships, railroads, and steel mills is the best example of","st":"","o":["the crop-lien system","vertical integration","horizontal integration","collective bargaining","laissez-faire regulation"],"e":["The crop-lien system was a southern agricultural credit arrangement.","Owning every stage of production, from raw materials to the finished product, is vertical integration.","Horizontal integration means buying competitors at the same stage, as Rockefeller did with refineries.","Collective bargaining is negotiation between unions and employers.","Laissez-faire means government non-interference, not a business structure."],"a":1},{"id":"u2q11","u":2,"th":"eco","d":"m","pool":"A","s":"John D. Rockefeller built Standard Oil into a near-monopoly mainly by","st":"","o":["receiving a government-granted monopoly","buying out or driving out competing oil refiners, an example of horizontal integration","inventing the internal combustion engine","refusing to use railroads for shipping","recognizing labor unions to avoid strikes"],"e":["Standard Oil's dominance came from business tactics, not a government charter.","Using rebates, price cutting, and buyouts, Standard Oil controlled about 90% of U.S. refining by the 1880s.","Rockefeller was a businessman, not an inventor of engines.","Rockefeller exploited railroads, winning secret rebates on shipping rates.","Rockefeller was not known for union recognition."],"a":1},{"id":"u2q12","u":2,"th":"eco","d":"m","pool":"B","s":"In the late nineteenth century, a \"trust\" was","st":"","o":["a federal agency regulating interstate commerce","a government-insured savings account","a cooperative store owned by farmers","an arrangement in which stockholders of several companies gave control to a single board of trustees, reducing competition","a union of skilled workers"],"e":["That was the Interstate Commerce Commission.","Federal deposit insurance came in 1933 (FDIC).","Farmers' cooperatives aimed to escape middlemen and trusts.","Standard Oil organized the first major trust in 1882. \"Trust\" became shorthand for any monopoly.","Craft unions are labor organizations, not business combinations."],"a":3},{"id":"u2q13","u":2,"th":"eco","d":"e","pool":"quiz","s":"The completion of the first transcontinental railroad in 1869 was celebrated at","st":"","o":["San Francisco, California, at the Pacific terminus","Chicago, Illinois, during the World's Columbian Exposition","Promontory Point, Utah, where the Union Pacific and Central Pacific lines met","Abilene, Kansas, at the end of the Chisholm Trail","Pittsburgh, Pennsylvania, center of the steel industry"],"e":["The Central Pacific began in Sacramento, and the lines met in Utah.","The Exposition took place in 1893.","The \"golden spike\" ceremony joined the two lines, built largely by Irish and Chinese labor.","Abilene was a cattle town, not the meeting point.","Pittsburgh was the steel hub, not the railroad's meeting point."],"a":2},{"id":"u2q14","u":2,"th":"eco","d":"m","pool":"A","s":"Banker J.P. Morgan's purchase of Carnegie Steel in 1901 led to the creation of","st":"","o":["U.S. Steel, the first billion-dollar corporation","the Federal Reserve System","the Standard Oil Trust","the American Federation of Labor","the Interstate Commerce Commission"],"e":["Morgan merged Carnegie's company with others, creating a giant capitalized at about $1.4 billion.","The Federal Reserve was created by Congress in 1913.","Standard Oil was Rockefeller's company, organized as a trust in 1882.","The AFL was a labor federation founded by Samuel Gompers.","The ICC was a government agency created in 1887."],"a":0},{"id":"u2q15","u":2,"th":"eco","d":"m","pool":"A","s":"One important economic effect of the expansion of railroads after 1865 was the","st":"","o":["creation of a national market that allowed goods to be mass-produced and sold across the country","end of federal involvement in the economy","reduction of immigration to the United States","collapse of agriculture on the Great Plains","decline of coal and steel production"],"e":["Railroads linked regions, cut shipping costs, and spurred demand for steel and coal, which knitted together a national economy.","The government heavily subsidized railroads with land grants and loans.","Railroads recruited immigrant labor and settlers.","Railroads opened the Plains to commercial farming.","Railroads greatly increased demand for coal and steel."],"a":0},{"id":"u2q16","u":2,"th":"eco","d":"m","pool":"B","s":"The invention of barbed wire in the 1870s contributed most directly to the","st":"","o":["rise of the Knights of Labor","growth of the steel industry in the South","end of the open range and the long cattle drives","decline of farming on the Great Plains","passage of the Homestead Act"],"e":["Barbed wire had no direct connection to the Knights.","Barbed wire was a minor steel product. Its key effect was on ranching.","Fenced land blocked trails and ended open grazing, transforming the cattle industry.","Barbed wire helped farmers fence land on the treeless Plains.","The Homestead Act (1862) came before barbed wire (1874)."],"a":2},{"id":"u2q17","u":2,"th":"eco","d":"e","pool":"quiz","s":"Thomas Edison's laboratory at Menlo Park, New Jersey, is best known for developing","st":"","o":["the Bessemer steel process","the airplane","a practical incandescent electric light bulb","the telephone","the assembly line for automobiles"],"e":["Henry Bessemer, an Englishman, developed it.","The Wright brothers flew in 1903.","Edison's lab produced the commercial light bulb in 1879 along with other inventions such as the phonograph.","Alexander Graham Bell patented the telephone in 1876.","Henry Ford introduced the moving assembly line in 1913."],"a":2},{"id":"u2q18","u":2,"th":"eco","d":"m","pool":"quiz","s":"The Bessemer process was important to industrialization because it","st":"","o":["mechanized cotton picking","allowed oil to be refined into kerosene","made it possible to produce steel cheaply and in large quantities","generated alternating-current electricity","connected the East and West Coasts by telegraph"],"e":["Mechanical cotton pickers spread in the 1940s.","That is oil refining, Rockefeller's business.","By blasting air through molten iron to remove impurities, the process made steel affordable for rails, bridges, and buildings.","AC power is associated with Westinghouse and Tesla.","The transcontinental telegraph was completed in 1861."],"a":2},{"id":"u2q19","u":2,"th":"eco","d":"h","pool":"B","s":"In Munn v. Illinois (1877), the Supreme Court ruled that","st":"","o":["monopolies in manufacturing were exempt from federal law","the federal income tax was unconstitutional","states could not regulate any railroad rates","labor unions were illegal conspiracies","states could regulate private businesses, such as grain elevators, that were \"clothed with a public interest\""],"e":["That was the reasoning of E.C. Knight (1895).","That was Pollock v. Farmers' Loan and Trust (1895).","That conclusion came later and applied only to interstate rates (Wabash, 1886).","Munn did not concern unions.","Munn was a victory for the Granger movement. Later cases such as Wabash (1886) limited it for interstate traffic."],"a":4},{"id":"u2q20","u":2,"th":"soc","d":"m","pool":"diag","s":"Compared with the American Federation of Labor, the Knights of Labor was distinctive because it","st":"","o":["was founded by Samuel Gompers","refused to support the eight-hour day","organized only skilled craftsmen into separate trade unions","welcomed unskilled workers, women, and African Americans into one large organization","lasted far longer and became the largest union of the twentieth century"],"e":["Gompers founded the AFL. Terence Powderly led the Knights.","The Knights supported the eight-hour day.","That describes the AFL.","The Knights' inclusiveness set them apart from the AFL's estern Europe.","Voluntary African immigration was very small in this period."],"a":3},{"id":"u2q26","u":2,"th":"soc","d":"e","pool":"quiz","s":"The Chinese Exclusion Act of 1882 was historically significant because it","st":"","o":["established a quota system based on national origins","was the first federal law to bar immigration on the basis of nationality","ended immigration from all of Asia","created Ellis Island as an immigration station","granted citizenship to Chinese railroad workers"],"e":["National-origins quotas came in the 1920s (Emergency Quota Act of 1921, Immigration Act of 1924).","It suspended Chinese labor immigration, was renewed and made permanent, and was not repealed until 1943.","It applied to China. Broader Asian exclusion came with the 1917 and 1924 laws.","Ellis Island opened in 1892.","The act barred Chinese immigrants from naturalization."],"a":1},{"id":"u2q27","u":2,"th":"soc","d":"e","pool":"B","s":"Jacob Riis's <em>How the Other Half Lives<\/em> (1890) used photographs and text to expose","st":"","o":["the treatment of Native Americans on reservations","the corruption of the Standard Oil Company","the meatpacking industry in Chicago","the lives of southern sharecroppers","the squalid conditions of New York City tenements"],"e":["That was Helen Hunt Jackson's <em>A Century of Dishonor<\/em>.","Ida Tarbell exposed Standard Oil (1904).","Upton Sinclair's <em>The Jungle<\/em> (1906) targeted meatpacking.","Riis focused on urban immigrants in New York.","Riis's images of crowded, dark tenements spurred housing reform."],"a":4},{"id":"u2q28","u":2,"th":"soc","d":"e","pool":"A","s":"Jane Addams's Hull House in Chicago was an example of a","st":"","o":["political machine that traded favors for votes","factory that employed child laborers","settlement house that provided services to immigrants and pushed for social reform","labor union for garment workers","religious revival center in the West"],"e":["Machines like Tammany Hall were partisan organizations.","Hull House reformers fought child labor.","Middle-class reformers lived among the poor and offered classes, child care, and English instruction.","The International Ladies' Garment Workers' Union (1900) was a union, not a settlement house.","Hull House was urban and secular in its programs."],"a":2},{"id":"u2q29","u":2,"th":"soc","d":"m","pool":"B","s":"The Ghost Dance movement and the massacre at Wounded Knee in 1890 are significant because","st":"","o":["Wounded Knee marked the effective end of armed Native American resistance on the Plains","the Ghost Dance led Congress to pass the Dawes Act","Wounded Knee was the Lakota's greatest military victory","Wounded Knee forced the government to restore tribal lands","the Ghost Dance was a federal program to assimilate Native Americans"],"e":["The army killed about 250 Lakota after alarm over the Ghost Dance. It is seen as the close of the Indian wars.","The Dawes Act came three years before Wounded Knee.","That was Little Bighorn (1876).","No land was restored. Allotment continued.","It was a Native religious movement promising renewal."],"a":0},{"id":"u2q30","u":2,"th":"soc","d":"h","pool":"A","s":"This 1877 statement was made by","st":"<p>\"Hear me, my chiefs! I am tired; my heart is sick and sad. From where the sun now stands I will fight no more forever.\"<\/p>","o":["Sitting Bull after the Battle of Little Bighorn","Tecumseh before the War of 1812","Geronimo after his final surrender in 1886","Chief Joseph of the Nez Perce after a long retreat toward Canada","Crazy Horse at Wounded Knee"],"e":["Sitting Bull fled to Canada after 1876 and surrendered in 1881. These are not his words.","Tecumseh lived decades earlier.","Geronimo was an Apache leader in the Southwest. This is not his statement.","Joseph surrendered just short of the Canadian border after a long pursuit.","Crazy Horse was killed in 1877 and was not at Wounded Knee (1890)."],"a":3},{"id":"u2q31","u":2,"th":"soc","d":"m","pool":"A","s":"Federal Indian boarding schools such as the Carlisle School in Pennsylvania aimed primarily to","st":"","o":["prepare tribal leaders to negotiate new treaties","assimilate Native American children by suppressing their languages, religions, and cultures","train Native Americans as military officers","preserve tribal languages through bilingual education","educate white settlers about Native culture"],"e":["Congress ended treaty-making with tribes in 1871.","Founder Richard Henry Pratt's motto, \"Kill the Indian in him, and save the man,\" sums up the aim.","Carlisle offered vocational and academic schooling, not officer training.","The schools banned Native languages.","The schools were for Native children."],"a":1},{"id":"u2q32","u":2,"th":"soc","d":"m","pool":"diag","s":"Which of the following statements about cowboys of the late-nineteenth-century cattle drives is accurate?","st":"","o":["Most cowboys owned the herds they drove.","Cattle drives continued to grow after barbed wire spread.","The cattle drives ran mainly from Canada to Texas.","Cowboys were mainly recent immigrants from southern Europe.","A substantial share of cowboys were African American or Mexican American."],"e":["Cowboys were mostly low-paid wage workers. Ranchers and investors owned the cattle.","Barbed wire and railroads ended the long drives by the late 1880s.","The drives ran north from Texas to railheads in Kansas.","The New Immigrants mostly settled in eastern cities.","Historians estimate that roughly a quarter or more were Black or Hispanic, though popular culture later portrayed cowboys as white."],"a":4},{"id":"u2q33","u":2,"th":"soc","d":"m","pool":"A","s":"Which conclusion is best supported by the data above?","st":"<p>Percentage of the U.S. population living in urban areas (U.S. Census): 1870: 26%; 1900: 40%; 1920: 51%<\/p>","o":["Immigration had no effect on urban growth.","Most Americans lived in cities by 1870.","Urbanization slowed sharply after 1900.","By 1920, for the first time, a majority of Americans lived in urban areas.","The rural population declined in absolute numbers every decade."],"e":["The data don't address causes. In fact, immigration was a major driver of urban growth.","In 1870 only about a quarter lived in urban areas.","The share kept rising quickly between 1900 and 1920.","The census of 1920 recorded urban residents at just over half the population, the culmination of the trend shown.","The data show shares, not absolute numbers. Rural population actually still grew for much of this period."],"a":3},{"id":"u2q34","u":2,"th":"soc","d":"h","pool":"B","s":"The American Protective Association, founded in 1887, is best described as","st":"","o":["a trust of insurance companies","an agency that inspected immigrants at Ellis Island","a nativist organization hostile to Catholic immigrants","a group that protected Native American land rights","a union representing railroad workers"],"e":["The APA was a political-social organization, not a business.","Federal officials did the inspections.","The APA spread anti-Catholic suspicion as Italian, Polish, and other Catholic immigrants arrived.","Groups like the Indian Rights Association took a different, assimilationist approach. The APA was nativist.","That was Debs's American Railway Union."],"a":2},{"id":"u2q35","u":2,"th":"soc","d":"m","pool":"quiz","s":"The Woman's Christian Temperance Union under Frances Willard is significant because it","st":"","o":["became the largest women's organization of the era and drew women into broader reform, including suffrage","led the Pullman Strike","successfully banned alcohol nationwide in the 1880s","opposed women's right to vote","founded the first settlement house"],"e":["Willard's \"Do Everything\" policy linked temperance to suffrage, labor, and other causes.","Debs's American Railway Union led Pullman.","National prohibition came with the Eighteenth Amendment in 1919/1920.","Under Willard, the WCTU endorsed suffrage.","Settlement houses are associated with Jane Addams and others."],"a":0},{"id":"u2q36","u":2,"th":"soc","d":"m","pool":"B","s":"The near-extermination of the buffalo by the late 1880s affected Plains Indians chiefly by","st":"","o":["giving them a new source of income from the hide trade","leading Congress to grant them full citizenship","destroying the foundation of their food supply, economy, and way of life, which forced many onto reservations","encouraging them to become cattle ranchers on the open range","having little effect because they had already switched to farming"],"e":["Hide profits went mainly to white hunters, and the collapse left tribes destitute.","Citizenship for all Native Americans came in 1924.","Commercial hunting (aided by railroads and the army) wiped out the herds that sustained Plains peoples.","Few Plains tribes became commercial ranchers.","Most Plains peoples depended heavily on the buffalo."],"a":2},{"id":"u2q37","u":2,"th":"cul","d":"m","pool":"A","s":"Herbert Spencer and William Graham Sumner are associated with which idea?","st":"","o":["the frontier thesis about American democracy","pragmatism, which judged ideas by their practical results","the single tax on land","the Social Gospel, which called on churches to address poverty","Social Darwinism, the view that competition rewards the \"fittest\" and government should not aid the poor"],"e":["That was Frederick Jackson Turner.","Pragmatism is associated with William James and John Dewey.","That was Henry George.","The Social Gospel (Rauschenbusch) rejected Social Darwinist indifference.","They applied \"survival of the fittest\" to society to justify inequality and laissez-faire."],"a":4},{"id":"u2q38","u":2,"th":"cul","d":"m","pool":"A","s":"The author of this passage most likely believed that","st":"<p>\"The man who dies thus rich dies disgraced... The true antidote for the temporary unequal distribution of wealth is the reconciliation of the rich and the poor.\"<\/p>","o":["workers should seize control of factories","the wealthy had a duty to use their fortunes for the public good through philanthropy","the government should confiscate large fortunes through taxation","poverty was caused by a lack of religious faith","wealth should be passed intact to one's children"],"e":["That would be a socialist or anarchist view, not Carnegie's.","This is from Carnegie's \"Gospel of Wealth\" (1889), which urged giving fortunes away for libraries, universities, and other public goods.","Carnegie favored voluntary giving rather than government redistribution.","The passage concerns the duties of wealth, not religion.","Carnegie explicitly opposed leaving vast fortunes to heirs."],"a":1},{"id":"u2q39","u":2,"th":"cul","d":"h","pool":"quiz","s":"Henry George's <em>Progress and Poverty<\/em> (1879) argued that poverty could be reduced by","st":"","o":["unlimited coinage of silver","a single tax on the rising value of land","a graduated federal income tax","immigration restriction","government ownership of all factories"],"e":["Free silver was the Populists' monetary remedy.","George argued that land speculation captured wealth created by society, and that taxing land values would make other taxes unnecessary.","The income tax was a Populist and Progressive demand, adopted in 1913.","George's analysis centered on land, not immigration.","George was not a socialist. That idea is closer to Bellamy's utopia."],"a":1},{"id":"u2q40","u":2,"th":"cul","d":"m","pool":"B","s":"Edward Bellamy's novel <em>Looking Backward<\/em> (1888) presented","st":"","o":["the life of a riverboat boy on the Mississippi","a utopian vision of a cooperative, socialist society in the year 2000","the struggles of immigrants in Chicago's meatpacking plants","an account of broken treaties with Native Americans","a defense of Social Darwinism"],"e":["That is Twain's <em>Adventures of Huckleberry Finn<\/em>.","The bestseller imagined the end of competition and inspired \"Nationalist\" clubs.","That is Sinclair's <em>The Jungle<\/em> (1906).","That is Helen Hunt Jackson's <em>A Century of Dishonor<\/em>.","Bellamy's novel attacked competitive capitalism."],"a":1},{"id":"u2q41","u":2,"th":"cul","d":"m","pool":"B","s":"Frederick Jackson Turner's \"frontier thesis\" (1893) argued that","st":"","o":["cities, not the frontier, were the true source of American values","the frontier experience had shaped American democracy and individualism, and its closing marked the end of an era","the United States should avoid overseas expansion","Native Americans had been treated justly on the frontier","the frontier had been settled mainly by European aristocrats"],"e":["Turner stressed the frontier, not cities.","Turner's essay, prompted by the 1890 census, was among the most influential interpretations of American history.","Some read Turner as implying that new frontiers abroad were needed. He did not argue for avoiding expansion.","Turner largely ignored Native perspectives. He did not argue this.","Turner emphasized ordinary settlers and democratic leveling."],"a":1},{"id":"u2q42","u":2,"th":"cul","d":"m","pool":"quiz","s":"Stephen Crane's <em>Maggie: A Girl of the Streets<\/em> and Theodore Dreiser's <em>Sister Carrie<\/em> are examples of literary","st":"","o":["naturalism, which portrayed characters shaped by harsh social and economic forces","Transcendentalism, which sought spiritual truth in nature","modernism of the Lost Generation","the Harlem Renaissance","romanticism, which celebrated nature and the individual spirit"],"e":["Naturalist writers showed people trapped by environment and heredity, often in urban poverty.","Transcendentalism was an 1830s–1850s movement.","The Lost Generation wrote in the 1920s.","The Harlem Renaissance was a 1920s African American cultural movement.","Romanticism (Emerson, Thoreau) was the pre–Civil War style."],"a":0},{"id":"u2q43","u":2,"th":"cul","d":"m","pool":"quiz","s":"The Social Gospel movement of the late nineteenth century urged","st":"","o":["missionaries to convert Native Americans by force","churches and Christians to address urban poverty, labor exploitation, and other social problems","Christians to withdraw from politics and focus on the afterlife","the government to establish an official national church","businesses to follow Social Darwinist principles"],"e":["The Social Gospel focused on urban industrial problems.","Ministers like Walter Rauschenbusch argued that Christianity required reforming society, not just saving individual souls.","The Social Gospel urged social engagement.","The movement did not seek an established church.","The Social Gospel criticized Social Darwinism."],"a":1},{"id":"u2q44","u":2,"th":"cul","d":"h","pool":"A","s":"Helen Hunt Jackson's <em>A Century of Dishonor<\/em> (1881) helped shape federal policy by","st":"","o":["exposing tenement conditions and leading to housing codes","convincing Americans to annex Hawaii","leading directly to restoration of all treaty lands","persuading Congress to restrict Chinese immigration","building public sympathy for Native Americans, which reformers channeled into the assimilationist Dawes Act"],"e":["That was Riis's work.","The book concerned Native Americans.","No lands were restored. Allotment cost Native nations more land.","Chinese exclusion had separate origins.","Jackson exposed broken treaties. Reformers then pursued allotment and assimilation, which proved disastrous for Native landholding."],"a":4},{"id":"u2q45","u":2,"th":"cul","d":"h","pool":"quiz","s":"Thorstein Veblen's phrase \"conspicuous consumption\" refers to","st":"","o":["workers' spending on necessities such as food and rent","farmers' purchases through mail-order catalogs","government purchases during wartime","the lavish display of wealth by the rich to signal social status","the buying of goods on credit in the 1920s"],"e":["Veblen's term described waste by the wealthy, not workers' necessities.","Catalog shopping was a practical rural convenience, not Veblen's concept.","The term concerns private status display.","Veblen's <em>The Theory of the Leisure Class<\/em> (1899) satirized the extravagant lifestyles of the Gilded Age elite.","Installment buying spread in the 1920s. Veblen's phrase came earlier and meant something different."],"a":3},{"id":"u2q46","u":2,"th":"dip","d":"h","pool":"quiz","s":"The Treaty of Washington (1871) between the United States and Great Britain is significant because it","st":"","o":["set the border between Canada and Oregon at the 49th parallel","submitted the Alabama claims, over damage done by British-built Confederate raiders, to international arbitration","ended the War of 1812","established an alliance against Spain","transferred Alaska to the United States"],"e":["That was the Oregon Treaty of 1846.","The arbitration awarded the U.S. $15.5 million and eased Anglo-American tensions.","That was the Treaty of Ghent (1814).","No such alliance existed. The U.S. fought Spain alone in 1898.","Alaska was bought from Russia in 1867."],"a":1},{"id":"u2q47","u":2,"th":"dip","d":"h","pool":"quiz","s":"Secretary of State James G. Blaine organized the first Pan-American Conference in 1889 primarily to","st":"","o":["annex Cuba and Puerto Rico","create a military alliance against Germany","expand U.S. trade and influence in Latin America","end the Spanish-American War","negotiate the purchase of the Panama Canal Zone"],"e":["Puerto Rico was acquired in 1898, and Cuba was never annexed.","No such alliance came out of the conference.","The conference reflected growing U.S. interest in hemispheric markets and leadership, a prelude to 1890s expansionism.","That war took place in 1898.","The Canal Zone was acquired in 1903–1904."],"a":2},{"id":"u3q01","u":3,"th":"pol","d":"e","pool":"A","s":"Which of the following was a demand of the Populist Party's Omaha Platform of 1892?","st":"","o":["Higher protective tariffs on manufactured goods","Repeal of the Fifteenth Amendment","Private ownership of the telegraph system","Free and unlimited coinage of silver","Return to the gold standard"],"e":["Populists opposed high tariffs, which raised the prices farmers paid.","The Platform did not call for repeal of any amendment.","Populists demanded government ownership of railroads and telegraphs.","Populists wanted to inflate the currency to raise crop prices and ease farm debts.","Populists opposed the gold standard. Its defenders were bankers and Republicans."],"a":3},{"id":"u3q02","u":3,"th":"pol","d":"e","pool":"diag","s":"William Jennings Bryan's \"Cross of Gold\" speech of 1896 attacked","st":"","o":["the gold standard, which Bryan said crushed debtors and farmers","prohibition of alcohol","the Pullman Strike's labor leaders","the annexation of the Philippines","the creation of the Federal Reserve"],"e":["Bryan argued that tying the currency to gold kept money scarce and prices low, hurting producers.","Bryan later backed prohibition, but the Cross of Gold speech concerned currency.","The speech was not about Pullman.","Bryan did oppose imperialism, but in 1900. The 1896 speech was about money.","The Federal Reserve was created in 1913."],"a":0},{"id":"u3q03","u":3,"th":"pol","d":"m","pool":"quiz","s":"The presidential election of 1896 is considered a turning point because it","st":"","o":["was the first election in which women voted nationally","was decided by the House of Representatives","established free silver as national policy","began a long period of Republican dominance and effectively ended the Populist Party as an independent force","brought the Populists to power in Congress"],"e":["Women voted nationally first in 1920.","That happened in 1800 and 1824, not 1896.","McKinley's victory led to the Gold Standard Act (1900).","McKinley's victory realigned politics. Fusion with the Democrats absorbed the Populists, and Republicans controlled the White House for most years until 1932.","The Populists faded after 1896."],"a":3},{"id":"u3q04","u":3,"th":"pol","d":"m","pool":"quiz","s":"The Seventeenth Amendment (1913) changed the federal government by","st":"","o":["requiring the direct popular election of U.S. senators","authorizing a federal income tax","prohibiting the manufacture and sale of alcohol","limiting presidents to two terms","granting women the right to vote"],"e":["Before 1913, state legislatures chose senators, a system Progressives and Populists saw as corrupt.","That was the Sixteenth Amendment.","That was the Eighteenth Amendment.","That was the Twenty-second Amendment (1951).","That was the Nineteenth Amendment."],"a":0},{"id":"u3q05","u":3,"th":"pol","d":"m","pool":"A","s":"The initiative, referendum, and recall were Progressive reforms designed to","st":"","o":["restrict voting to property owners","give voters more direct control over legislation and officeholders","regulate interstate railroads","increase the president's power over Congress","strengthen the power of political machines"],"e":["Progressives sought broader (if not universal) popular control.","They let citizens propose laws, vote on them directly, and remove officials, bypassing machine-controlled legislatures.","Railroad regulation came through the ICC and the Hepburn Act.","These were mainly state and local reforms.","They were aimed against machines."],"a":1},{"id":"u3q06","u":3,"th":"pol","d":"m","pool":"A","s":"Theodore Roosevelt earned the nickname \"trust buster\" largely because his administration","st":"","o":["successfully prosecuted the Northern Securities Company under the Sherman Antitrust Act","passed the Clayton Antitrust Act","abolished all large corporations","broke up Standard Oil in 1911","created the Federal Reserve System"],"e":["The 1904 Supreme Court decision dissolving the railroad holding company revived antitrust enforcement.","Clayton came in 1914 under Wilson.","Roosevelt distinguished \"good\" trusts from \"bad\" ones and regulated rather than abolished most.","The Standard Oil breakup came under Taft.","Wilson
