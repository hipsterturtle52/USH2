olution take colonies? The motives fall into four groups:<\/p>\n<ul><li><strong>Markets:<\/strong> business wanted outlets for surplus goods.<\/li><li><strong>Sea power:<\/strong> Captain <strong>Alfred Thayer Mahan<\/strong> (<em>The Influence of Sea Power upon History<\/em>, 1890) argued that great nations need a modern navy, coaling stations, and colonies.<\/li><li><strong>Racial and religious mission:<\/strong> Social Darwinism and Anglo-Saxon superiority (Josiah Strong) blended with missionary zeal.<\/li><li><strong>The closed frontier:<\/strong> with the frontier gone, some looked outward.<\/li><\/ul>\n<p><strong>Hawaii:<\/strong> American sugar planters led the overthrow of <strong>Queen Liliuokalani<\/strong> in 1893. President Cleveland refused to annex the islands, but they were annexed in <strong>1898<\/strong> under McKinley.<\/p>\n<h3>The Spanish-American War (1898)<\/h3>\n<p>Cubans revolted against Spain in 1895. Spanish General Weyler's brutal <strong>\"reconcentration\" camps<\/strong> were sensationalized by the <strong>yellow press<\/strong> of <strong>William Randolph Hearst<\/strong> and <strong>Joseph Pulitzer<\/strong>. In February 1898 the <strong>de Lôme letter<\/strong> insulted McKinley, and then the battleship <strong>USS Maine<\/strong> exploded in Havana harbor. \"Remember the Maine!\" became the rallying cry. Congress declared war, but the <strong>Teller Amendment<\/strong> promised the U.S. would <strong>not annex Cuba<\/strong>.<\/p>\n<p>The war lasted about four months. <strong>Commodore Dewey<\/strong> destroyed the Spanish fleet at <strong>Manila Bay<\/strong> in the Philippines. <strong>Theodore Roosevelt's Rough Riders<\/strong> charged up San Juan (Kettle) Hill in Cuba. Secretary of State John Hay called it a <strong>\"splendid little war.\"<\/strong> In the <strong>Treaty of Paris<\/strong> (1898), Spain gave the U.S. <strong>Puerto Rico, Guam, and the Philippines<\/strong> (for $20 million), and Cuba became nominally independent.<\/p>\n<p>The <strong>Anti-Imperialist League<\/strong>, whose members included Mark Twain, Andrew Carnegie, and Jane Addams, argued that colonies violated the principle of government by consent. Filipinos led by <strong>Emilio Aguinaldo<\/strong> had expected independence. The brutal <strong>Philippine-American War<\/strong> (1899–1902) cost thousands of American lives and far more Filipino lives.<\/p>\n<p>Afterward the U.S. built controls over its new sphere:<\/p>\n<ul><li>The <strong>Platt Amendment<\/strong> (1901) made Cuba a <strong>protectorate<\/strong>: the U.S. could intervene and got a naval base at <strong>Guantánamo Bay<\/strong>.<\/li><li>In the <strong>Insular Cases<\/strong> (1901), the Supreme Court ruled that the Constitution does not automatically apply in full to the territories (\"the Constitution does not follow the flag\").<\/li><li>The <strong>Open Door Notes<\/strong> (1899–1900) from <strong>John Hay<\/strong> asked the powers to keep <strong>China<\/strong> open to equal trade and to respect China's territorial integrity. The U.S. sent troops to help crush the anti-foreign <strong>Boxer Rebellion<\/strong> (1900).<\/li><\/ul>\n<h3>Roosevelt, Taft, and Wilson abroad<\/h3>\n<p><strong>Theodore Roosevelt<\/strong>: \"Speak softly and carry a <strong>big stick<\/strong>.\"<\/p>\n<ul><li><strong>Panama Canal:<\/strong> When Colombia balked at a treaty, the U.S. backed a <strong>Panamanian revolution<\/strong> (1903) and got the Canal Zone. The canal opened in <strong>1914<\/strong>.<\/li><li><strong>Roosevelt Corollary<\/strong> (1904) to the Monroe Doctrine: the U.S. would act as an <strong>\"international police power\"<\/strong> in Latin America to keep European creditors out, starting in the Dominican Republic.<\/li><li>He mediated the end of the <strong>Russo-Japanese War<\/strong> (Treaty of Portsmouth, 1905) and won the <strong>Nobel Peace Prize<\/strong>.<\/li><li>The <strong>Gentlemen's Agreement<\/strong> (1907): Japan limited emigration of laborers, and San Francisco reversed its segregation of Japanese schoolchildren.<\/li><li>The <strong>Great White Fleet<\/strong> (1907–09) showed off U.S. naval power around the world.<\/li><\/ul>\n<p><strong>William Howard Taft<\/strong>: <strong>\"Dollar Diplomacy\"<\/strong>, which meant using investment rather than force to gain influence, though Marines still landed in Nicaragua.<\/p>\n<p><strong>Woodrow Wilson<\/strong>: <strong>\"moral diplomacy\"<\/strong>, which in practice still meant intervention in Mexico, Haiti, and the Dominican Republic.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Search for markets, Mahan's sea power ideas, yellow journalism, the Maine<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Spanish-American War (1898)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>U.S. becomes a colonial power (Philippines, Puerto Rico, Guam); protectorate over Cuba; debate over imperialism<\/div><\/div>\n<h2>3. The Progressive Era (about 1900–1917)<\/h2>\n<p>Progressives were mostly <strong>urban, middle-class, educated<\/strong> reformers. They believed experts and an active government could fix the abuses of industrial capitalism, political corruption, and social disorder.<\/p>\n<h3>The muckrakers<\/h3>\n<p>Roosevelt called investigative journalists <strong>\"muckrakers.\"<\/strong> Their work built public pressure for reform:<\/p>\n<ul><li><strong>Lincoln Steffens<\/strong>, <em>The Shame of the Cities<\/em>: urban political corruption.<\/li><li><strong>Ida Tarbell<\/strong>, <em>The History of the Standard Oil Company<\/em>: Rockefeller's tactics.<\/li><li><strong>Upton Sinclair<\/strong>, <em>The Jungle<\/em> (1906): he aimed at workers' conditions in Chicago meatpacking, but the public reacted to the filthy meat. \"I aimed at the public's heart, and by accident I hit it in the stomach.\" The result was the <strong>Meat Inspection Act<\/strong> and the <strong>Pure Food and Drug Act<\/strong> (1906).<\/li><li>Photographer <strong>Lewis Hine<\/strong> documented child labor.<\/li><\/ul>\n<h3>Making government more democratic<\/h3>\n<ul><li>The <strong>secret (Australian) ballot<\/strong>.<\/li><li>The <strong>direct primary<\/strong>, letting voters rather than bosses pick nominees.<\/li><li>The <strong>initiative<\/strong> (citizens propose laws), the <strong>referendum<\/strong> (citizens vote on laws), and the <strong>recall<\/strong> (remove officials).<\/li><li>The <strong>Seventeenth Amendment<\/strong> (1913): <strong>direct election of senators<\/strong>.<\/li><li>Wisconsin governor <strong>Robert La Follette's \"Wisconsin Idea\"<\/strong> used university experts in government.<\/li><li>City commission and city-manager plans, first tried in Galveston, Texas, after the 1900 hurricane.<\/li><\/ul>\n<h3>Social justice<\/h3>\n<ul><li>The <strong>Triangle Shirtwaist Factory fire<\/strong> (1911) killed <strong>146<\/strong> garment workers, mostly young immigrant women, behind locked doors. It led to new New York safety laws.<\/li><li>In <strong>Lochner v. New York<\/strong> (1905) the Supreme Court struck down a limit on bakers' hours as a violation of \"liberty of contract.\" But in <strong>Muller v. Oregon<\/strong> (1908), it upheld maximum hours for <strong>women<\/strong>, persuaded by Louis <strong>Brandeis's<\/strong> brief full of social data.<\/li><li>Reformers like <strong>Florence Kelley<\/strong> fought child labor and won state laws.<\/li><li>The <strong>Anti-Saloon League<\/strong> pushed <strong>prohibition<\/strong>, which became the Eighteenth Amendment (1919).<\/li><li>Suffragists (NAWSA under <strong>Carrie Chapman Catt<\/strong>, and the more militant <strong>Alice Paul<\/strong>) pressed toward the Nineteenth Amendment (1920; see Unit 4).<\/li><\/ul>\n<p><strong>Race was Progressivism's blind spot.<\/strong> Disfranchisement and segregation spread in the South, often defended as \"reform.\" Wilson <strong>segregated the federal civil service<\/strong>. In response, <strong>W.E.B. Du Bois<\/strong> and others formed the <strong>Niagara Movement<\/strong> (1905) and then the interracial <strong>NAACP<\/strong> (1909), which fought through courts and publicity.<\/p>\n<p>On the left, the <strong>Industrial Workers of the World<\/strong> (IWW or \"Wobblies,\" 1905; Big Bill Haywood) sought one big union of all workers. <strong>Eugene Debs's Socialist Party<\/strong> won 6% of the vote in 1912.<\/p>\n<h3>The Progressive presidents<\/h3>\n<p><strong>Theodore Roosevelt (1901–1909)<\/strong>, the <strong>\"Square Deal\"<\/strong>:<\/p>\n<ul><li>He was the <strong>\"trust buster\"<\/strong> who sued the <strong>Northern Securities<\/strong> railroad holding company (upheld by the Court in 1904). He separated \"good\" from \"bad\" trusts.<\/li><li>In the <strong>1902 anthracite coal strike<\/strong> he forced arbitration. It was the first time a president intervened as a neutral party rather than for the owners.<\/li><li>The <strong>Hepburn Act<\/strong> (1906) strengthened the ICC.<\/li><li><strong>Conservation:<\/strong> with <strong>Gifford Pinchot<\/strong> he set aside national forests, wildlife refuges, and monuments, and backed the Newlands Reclamation Act (1902). Pinchot favored wise <em>use<\/em> of resources (conservation). <strong>John Muir<\/strong> (Sierra Club) wanted <em>preservation<\/em> of untouched wilderness.<\/li><\/ul>\n<p><strong>William Howard Taft (1909–1913)<\/strong>:<\/p>\n<ul><li>He brought more antitrust suits than TR, including the 1911 breakup of <strong>Standard Oil<\/strong>.<\/li><li>He angered progressives over the high <strong>Payne-Aldrich Tariff<\/strong> and the <strong>Ballinger-Pinchot<\/strong> dispute.<\/li><li>The <strong>Sixteenth Amendment<\/strong> (income tax) passed Congress under Taft and was ratified in 1913.<\/li><\/ul>\n<p><strong>Election of 1912<\/strong>: Roosevelt ran as the <strong>Progressive (\"Bull Moose\")<\/strong> candidate on <strong>\"New Nationalism\"<\/strong>, meaning accept big business but regulate it with strong federal power (inspired by Herbert Croly). Wilson's <strong>\"New Freedom\"<\/strong> aimed to break up trusts and restore competition. The Republican split elected <strong>Woodrow Wilson<\/strong>.<\/p>\n<p><strong>Wilson's reforms (1913–1916)<\/strong>:<\/p>\n<ul><li>the <strong>Underwood Tariff<\/strong> (lower rates plus the first modern <strong>income tax<\/strong>)<\/li><li>the <strong>Federal Reserve Act<\/strong> (1913), which created a central banking system to manage the money supply<\/li><li>the <strong>Clayton Antitrust Act<\/strong> (1914), which strengthened the Sherman Act and <strong>exempted labor unions<\/strong>. Gompers called it labor's \"Magna Carta.\"<\/li><li>the <strong>Federal Trade Commission<\/strong> (1914)<\/li><\/ul>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Muckrakers expose abuses; Populist ideas spread<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Progressive reforms at city, state, and federal levels<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>16th, 17th, 18th, 19th Amendments; regulatory agencies (FTC, Federal Reserve); expanded federal role<\/div><\/div>\n<h3>Ideas and culture<\/h3>\n<ul><li><strong>Pragmatism<\/strong> (<strong>William James<\/strong>, <strong>John Dewey<\/strong>) judged ideas by their practical results. Dewey promoted <strong>progressive education<\/strong>: \"learning by doing.\"<\/li><li>The <strong>Ashcan School<\/strong> painted gritty city scenes.<\/li><li>The <strong>Armory Show<\/strong> (1913) introduced Americans to European modern art.<\/li><\/ul>","mustknow":["<strong>Omaha Platform<\/strong> (1892): free silver, graduated income tax, government ownership of railroads, direct election of senators.","<strong>1896<\/strong>: Bryan's <strong>\"Cross of Gold\"<\/strong> speech; McKinley wins (Hanna's money); Populists absorbed. A realigning election.","<strong>Mahan<\/strong> (sea power) and <strong>yellow journalism<\/strong> (Hearst/Pulitzer) + <strong>USS Maine<\/strong> led to the <strong>Spanish-American War<\/strong> (1898).","<strong>Treaty of Paris (1898)<\/strong>: U.S. gets <strong>Puerto Rico, Guam, Philippines<\/strong>. <strong>Teller Amendment<\/strong> (no annexing Cuba) vs. <strong>Platt Amendment<\/strong> (Cuba protectorate, Guantánamo).","<strong>Open Door Notes<\/strong> (Hay, China). <strong>Roosevelt Corollary<\/strong> (U.S. as Latin American \"police power\"). <strong>Panama Canal<\/strong>. <strong>Dollar Diplomacy<\/strong> (Taft).","Muckrakers: <strong>Steffens<\/strong> (cities), <strong>Tarbell<\/strong> (Standard Oil), <strong>Sinclair<\/strong> (<em>The Jungle<\/em> → Meat Inspection and Pure Food and Drug Acts, 1906).","<strong>Initiative, referendum, recall, direct primary<\/strong>, <strong>17th Amendment<\/strong>; La Follette's Wisconsin Idea.","<strong>Muller v. Oregon<\/strong> (1908) upheld hours limits for women. <strong>Lochner<\/strong> (1905) struck down bakers' hours. <strong>Triangle fire<\/strong> (1911).","TR's <strong>Square Deal<\/strong>, trust busting (Northern Securities), conservation (Pinchot vs. Muir). <strong>1912<\/strong>: New Nationalism (TR) vs. <strong>New Freedom<\/strong> (Wilson).","Wilson: <strong>Federal Reserve<\/strong> (1913), <strong>Clayton Act<\/strong> (1914, protects unions), <strong>FTC<\/strong>, <strong>16th Amendment<\/strong> income tax. NAACP founded 1909."],"timeline":[{"y":"1890","t":"Mahan's <em>Influence of Sea Power upon History<\/em>; Sherman Silver Purchase Act","key":false},{"y":"1892","t":"Populist Omaha Platform","key":true},{"y":"1893","t":"Panic of 1893; Hawaiian queen Liliuokalani overthrown","key":false},{"y":"1894","t":"Coxey's Army marches on Washington","key":false},{"y":"1896","t":"Bryan's \"Cross of Gold\"; McKinley elected","key":true},{"y":"1898","t":"USS Maine explodes; Spanish-American War; Treaty of Paris; Hawaii annexed","key":true},{"y":"1899","t":"Open Door Notes; Philippine-American War begins","key":false},{"y":"1900","t":"Boxer Rebellion; Gold Standard Act","key":false},{"y":"1901","t":"McKinley assassinated, TR president; Platt Amendment; Insular Cases","key":true},{"y":"1902","t":"Anthracite coal strike arbitration; Newlands Reclamation Act","key":false},{"y":"1903","t":"Panama revolution; canal treaty","key":false},{"y":"1904","t":"Roosevelt Corollary; Northern Securities decision","key":true},{"y":"1905","t":"Lochner v. New York; Niagara Movement; IWW founded; Treaty of Portsmouth","key":false},{"y":"1906","t":"<em>The Jungle<\/em>; Meat Inspection Act; Pure Food and Drug Act; Hepburn Act","key":true},{"y":"1907","t":"Gentlemen's Agreement with Japan; Great White Fleet sails","key":false},{"y":"1908","t":"Muller v. Oregon","key":false},{"y":"1909","t":"NAACP founded","key":false},{"y":"1911","t":"Triangle Shirtwaist fire; Standard Oil broken up","key":false},{"y":"1912","t":"Wilson defeats TR (Bull Moose), Taft, and Debs","key":true},{"y":"1913","t":"16th and 17th Amendments; Federal Reserve Act; Underwood Tariff","key":true},{"y":"1914","t":"Clayton Antitrust Act; FTC; Panama Canal opens","key":false}],"cards":[{"id":"u3c01","f":"Omaha Platform (1892)","b":"Populist program: free silver (16:1), graduated income tax, government ownership of railroads and telegraphs, direct election of senators, secret ballot."},{"id":"u3c02","f":"Free silver","b":"Unlimited coinage of silver to expand the money supply and raise crop prices. Favored by indebted farmers and opposed by bankers (\"goldbugs\")."},{"id":"u3c03","f":"\"Cross of Gold\" speech (1896)","b":"William Jennings Bryan's call for free silver at the Democratic convention. Won him the Democratic and Populist nominations."},{"id":"u3c04","f":"Election of 1896","b":"McKinley (R) beat Bryan with Mark Hanna's funding and urban-industrial votes. Began Republican dominance until 1932 and ended the Populists."},{"id":"u3c05","f":"Alfred Thayer Mahan","b":"Naval officer whose <em>Influence of Sea Power upon History<\/em> (1890) urged a big navy, coaling stations, and colonies."},{"id":"u3c06","f":"Yellow journalism","b":"Sensational reporting (Hearst, Pulitzer) that inflamed opinion against Spain before 1898."},{"id":"u3c07","f":"Teller Amendment (1898)","b":"Pledged that the U.S. would not annex Cuba after the war."},{"id":"u3c08","f":"Platt Amendment (1901)","b":"Made Cuba a U.S. protectorate: the U.S. could intervene, and it got Guantánamo Bay."},{"id":"u3c09","f":"Treaty of Paris (1898)","b":"Ended the Spanish-American War. U.S. gained Puerto Rico, Guam, and the Philippines ($20 million)."},{"id":"u3c10","f":"Anti-Imperialist League","b":"Opponents of annexing the Philippines (Mark Twain, Andrew Carnegie, Jane Addams). Colonies violated consent of the governed."},{"id":"u3c11","f":"Philippine-American War (1899–1902)","b":"Filipino independence fighters under Emilio Aguinaldo resisted U.S. rule. A brutal counterinsurgency."},{"id":"u3c12","f":"Open Door Notes (1899–1900)","b":"John Hay asked the powers to allow equal trading rights in China and to preserve China's territorial integrity."},{"id":"u3c13","f":"Roosevelt Corollary (1904)","b":"Addition to the Monroe Doctrine: the U.S. would act as an \"international police power\" in Latin America."},{"id":"u3c14","f":"Dollar Diplomacy","b":"Taft's policy of using American investment to gain influence in Latin America and East Asia."},{"id":"u3c15","f":"Muckrakers","b":"Investigative journalists: Lincoln Steffens (city corruption), Ida Tarbell (Standard Oil), Upton Sinclair (<em>The Jungle<\/em>)."},{"id":"u3c16","f":"<em>The Jungle<\/em> (1906)","b":"Upton Sinclair's novel about Chicago meatpacking. Led to the Meat Inspection Act and the Pure Food and Drug Act."},{"id":"u3c17","f":"Initiative, referendum, recall","b":"Initiative: citizens propose laws. Referendum: citizens vote on laws. Recall: citizens remove officials early."},{"id":"u3c18","f":"Seventeenth Amendment (1913)","b":"Direct popular election of U.S. senators (previously chosen by state legislatures)."},{"id":"u3c19","f":"Muller v. Oregon (1908)","b":"Upheld maximum working hours for women, using Louis Brandeis's sociological brief."},{"id":"u3c20","f":"Triangle Shirtwaist fire (1911)","b":"146 garment workers died behind locked doors in New York. Spurred workplace safety laws."},{"id":"u3c21","f":"Square Deal","b":"TR's program: control corporations, consumer protection, conservation. A fair deal for labor, business, and the public."},{"id":"u3c22","f":"Conservation vs. preservation","b":"Gifford Pinchot: managed \"wise use\" of resources. John Muir (Sierra Club): preserve wilderness untouched."},{"id":"u3c23","f":"New Nationalism vs. New Freedom (1912)","b":"TR: accept big business and regulate it strongly. Wilson: break up trusts and restore competition."},{"id":"u3c24","f":"Federal Reserve Act (1913)","b":"Created a central banking system of 12 regional banks to manage the money supply."},{"id":"u3c25","f":"Clayton Antitrust Act (1914)","b":"Strengthened antitrust law and exempted labor unions and farm cooperatives. Gompers called it labor's \"Magna Carta.\""},{"id":"u3c26","f":"NAACP (1909)","b":"Interracial civil rights organization (Du Bois and others). Used lawsuits and publicity against discrimination."}]},{"n":4,"title":"World War I and the 1920s","years":"1914–1929","period":"late","weight":10,"minutes":12,"lesson":"<h2>The big picture<\/h2>\n<p>The United States tried to stay neutral in the Great War, then joined it in 1917. It helped win, but the Senate <strong>rejected the peace treaty<\/strong>. At home the war brought propaganda, limits on dissent, and the <strong>Great Migration<\/strong>, then a postwar <strong>Red Scare<\/strong>. The 1920s were an age of <strong>prosperity, mass culture, and modern values<\/strong>. They were also an age of fierce <strong>backlash<\/strong>: immigration restriction, a reborn Ku Klux Klan, Prohibition, and the Scopes trial. The CLEP exam loves the <strong>cultural conflicts of the 1920s<\/strong>.<\/p>\n<h2>1. From neutrality to war (1914–1917)<\/h2>\n<p>When war broke out in Europe in 1914, <strong>Woodrow Wilson<\/strong> declared neutrality and asked Americans to be \"impartial in thought as well as in action.\" But neutrality tilted toward the Allies:<\/p>\n<ul><li>Americans shared language and ties with Britain.<\/li><li>U.S. <strong>trade and loans<\/strong> to the Allies (Britain and France) far exceeded those to Germany, since Britain's naval <strong>blockade<\/strong> cut off German trade.<\/li><li>Germany struck back with <strong>submarine (U-boat) warfare<\/strong>. In May 1915 a U-boat sank the British liner <strong>Lusitania<\/strong>, killing 128 Americans. After more sinkings, Germany promised in the <strong>Sussex Pledge<\/strong> (1916) not to sink merchant ships without warning.<\/li><\/ul>\n<p>Wilson won reelection in 1916 on the slogan <strong>\"He kept us out of war.\"<\/strong> Then events in early 1917 pushed the U.S. in:<\/p>\n<ul><li>In January, Germany resumed <strong>unrestricted submarine warfare<\/strong>.<\/li><li>The <strong>Zimmermann Telegram<\/strong> was intercepted. In it, Germany proposed that <strong>Mexico<\/strong> join a war against the U.S. in exchange for recovering Texas, New Mexico, and Arizona.<\/li><li>The <strong>Russian Revolution<\/strong> (March 1917) toppled the czar, so the Allies looked more democratic.<\/li><\/ul>\n<p>In April 1917 Congress declared war so the world might be <strong>\"made safe for democracy.\"<\/strong><\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Unrestricted U-boat warfare + Zimmermann Telegram + economic ties to the Allies<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>U.S. declares war (April 1917)<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>Fresh American troops help the Allies win by November 1918<\/div><\/div>\n<h2>2. The home front<\/h2>\n<p>Total war meant an active federal government:<\/p>\n<ul><li>The <strong>Selective Service Act<\/strong> (1917) drafted about 2.8 million men.<\/li><li>The <strong>War Industries Board<\/strong> (Bernard Baruch) coordinated production.<\/li><li>The <strong>Food Administration<\/strong> under <strong>Herbert Hoover<\/strong> relied on <em>voluntary<\/em> conservation (\"meatless Mondays\").<\/li><li><strong>Liberty Bonds<\/strong> financed the war.<\/li><li>The <strong>Committee on Public Information<\/strong> (<strong>George Creel<\/strong>) produced propaganda to build support.<\/li><\/ul>\n<p>Civil liberties suffered. The <strong>Espionage Act<\/strong> (1917) and <strong>Sedition Act<\/strong> (1918) punished antiwar speech, and Socialist <strong>Eugene Debs<\/strong> went to prison for an antiwar speech. In <strong>Schenck v. United States<\/strong> (1919), Justice Oliver Wendell Holmes upheld these limits with the <strong>\"clear and present danger\"<\/strong> test. Anti-German hysteria followed: schools dropped German classes, and sauerkraut became \"liberty cabbage.\"<\/p>\n<p>The war opened opportunities. Factory jobs and the end of European immigration drew hundreds of thousands of Black southerners north in the <strong>Great Migration<\/strong> to Chicago, Detroit, New York, and other cities. Women took industrial jobs. Their war service helped win the <strong>Nineteenth Amendment<\/strong> (1920): <strong>woman suffrage<\/strong>. Moderate suffragists under <strong>Carrie Chapman Catt<\/strong> lobbied, while <strong>Alice Paul's<\/strong> National Woman's Party picketed the White House.<\/p>\n<p><strong>General John J. Pershing's<\/strong> American Expeditionary Force arrived in strength in 1918 and fought at Château-Thierry, Belleau Wood, and the <strong>Meuse-Argonne<\/strong>. The <strong>armistice<\/strong> came on <strong>November 11, 1918<\/strong>. About 116,000 Americans died, many from the <strong>1918 influenza pandemic<\/strong>, which killed roughly 675,000 Americans at home and in the service.<\/p>\n<h2>3. The fight over the peace<\/h2>\n<p>Wilson's <strong>Fourteen Points<\/strong> (January 1918) laid out his vision:<\/p>\n<ul><li>open diplomacy and freedom of the seas<\/li><li>free trade and arms reduction<\/li><li><strong>national self-determination<\/strong> for peoples of the old empires<\/li><li>a <strong>League of Nations<\/strong> to keep the peace<\/li><\/ul>\n<p>At Paris, the other Allies wanted revenge. The <strong>Treaty of Versailles<\/strong> forced Germany to accept a <strong>war guilt clause<\/strong> and pay heavy <strong>reparations<\/strong>. Wilson accepted these compromises to get the League included.<\/p>\n<p>In the Senate, <strong>Henry Cabot Lodge<\/strong> and the <strong>\"reservationists\"<\/strong> objected that <strong>Article X<\/strong> (collective security) could drag the U.S. into wars without Congress's approval. The <strong>\"irreconcilables\"<\/strong> opposed the treaty completely. Wilson refused to compromise, went on a speaking tour, and suffered a <strong>stroke<\/strong>. The Senate <strong>rejected<\/strong> the treaty, and the U.S. <strong>never joined the League<\/strong>.<\/p>\n<div class=\"cec\"><div class=\"b\"><b>Cause<\/b>Wilson's idealism (Fourteen Points) vs. Allied demands and Senate fears about Article X<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Event<\/b>Senate rejects the Treaty of Versailles<\/div><div class=\"ar\">→<\/div><div class=\"b\"><b>Consequence<\/b>U.S. stays out of the League of Nations; a weaker League; American turn toward \"isolationism\"<\/div><\/div>\n<h2>4. Postwar reaction (1919–1920s)<\/h2>\n<p>In 1919 a huge <strong>strike wave<\/strong> hit the country, including the <strong>Seattle general strike<\/strong> and the <strong>Boston police strike<\/strong>, which Governor Calvin Coolidge broke. Anarchist <strong>bombings<\/strong> followed. Fear of Bolshevism produced the <strong>Red Scare<\/strong>. Attorney General <strong>A. Mitchell Palmer's<\/strong> <strong>Palmer Raids<\/strong> (1919–1920) rounded up thousands of suspected radicals, many of them immigrants, and deported hundreds.<\/p>\n<p>The <strong>Sacco and Vanzetti<\/strong> case showed the same mood. Two Italian immigrant anarchists were convicted of murder on weak evidence and executed in 1927.<\/p>\n<p>Racial violence exploded in the <strong>\"Red Summer\" of 1919<\/strong>, with a deadly riot in Chicago, and in the <strong>Tulsa Race Massacre<\/strong> (1921), where a white mob destroyed the prosperous Black Greenwood district.<\/p>\n<p><strong>Nativism<\/strong> became law:<\/p>\n<ul><li>The <strong>Emergency Quota Act<\/strong> (1921) set the first national-origins quotas.<\/li><li>The <strong>National Origins Act (Immigration Act of 1924)<\/strong> set quotas at <strong>2% of each nationality as of the 1890 census<\/strong>. This deliberately favored northern and western Europeans, cut immigration from southern and eastern Europe, and <strong>barred Japanese and other Asian immigrants<\/strong>.<\/li><\/ul>\n<p>A <strong>second Ku Klux Klan<\/strong>, revived in 1915 and inspired by the film <em>The Birth of a Nation<\/em>, grew to millions of members by the mid-1920s. It was strong in the <strong>Midwest<\/strong> (Indiana) as well as the South. It targeted <strong>Catholics, Jews, and immigrants<\/strong> as well as African Americans, then collapsed amid scandal.<\/p>\n<h2>5. The politics of \"normalcy\"<\/h2>\n<p><strong>Warren G. Harding<\/strong> won in 1920 promising a <strong>\"return to normalcy.\"<\/strong> His administration was marred by the <strong>Teapot Dome<\/strong> scandal: Interior Secretary <strong>Albert Fall<\/strong> took bribes to lease naval oil reserves to private companies. <strong>Calvin Coolidge<\/strong> (\"the chief business of the American people is business\") and Treasury Secretary <strong>Andrew Mellon<\/strong> cut taxes on the wealthy, kept tariffs high, and favored business.<\/p>\n<p>Farmers did not share the boom. Crop prices collapsed after the war. Coolidge vetoed the <strong>McNary-Haugen<\/strong> farm relief bills. In 1928 <strong>Herbert Hoover<\/strong> beat <strong>Al Smith<\/strong>, the first Catholic major-party nominee, partly because of anti-Catholic and anti-\"wet\" (anti-Prohibition) feeling.<\/p>\n<p>Abroad, the U.S. avoided alliances but stayed active:<\/p>\n<ul><li>The <strong>Washington Naval Conference<\/strong> (1921–22) produced the Five-Power Treaty, which limited battleship tonnage.<\/li><li>The <strong>Dawes Plan<\/strong> (1924) used U.S. loans to help Germany pay reparations.<\/li><li>The <strong>Kellogg-Briand Pact<\/strong> (1928) renounced war \"as an instrument of national policy.\" It was idealistic and had no enforcement.<\/li><\/ul>\n<h2>6. The new economy and mass culture<\/h2>\n<p>The 1920s economy boomed on <strong>consumer goods<\/strong>. <strong>Henry Ford's<\/strong> moving <strong>assembly line<\/strong> (1913) made the <strong>Model T<\/strong> affordable, and the <strong>automobile<\/strong> reshaped the country: suburbs, roads, motels, oil, rubber, and steel. <strong>Electricity<\/strong> spread, bringing radios, vacuum cleaners, and refrigerators. <strong>Advertising<\/strong> and <strong>installment buying<\/strong> (credit) encouraged people to spend. But income inequality widened, and many families bought on credit, weaknesses that mattered after 1929.<\/p>\n<p>Mass culture created shared national experiences:<\/p>\n<ul><li><strong>Radio<\/strong>, starting with the first commercial station, KDKA, in 1920.<\/li><li><strong>Movies<\/strong>, including the first \"talkie,\" <em>The Jazz Singer<\/em> (1927).<\/li><li><strong>Spectator sports<\/strong>, with heroes like Babe Ruth.<\/li><li><strong>Charles Lindbergh's<\/strong> solo flight across the Atlantic (1927).<\/li><\/ul>\n<p>The <strong>\"flapper\"<\/strong>, a young woman with bobbed hair and short skirts who smoked and danced, symbolized new freedoms. <strong>Margaret Sanger<\/strong> campaigned for birth control. <strong>Alice Paul<\/strong> proposed an <strong>Equal Rights Amendment<\/strong> in 1923.<\/p>\n<h2>7. Culture wars: the modern vs. the traditional<\/h2>\n<p><strong>Prohibition<\/strong> (the <strong>Eighteenth Amendment<\/strong>, 1919, enforced by the <strong>Volstead Act<\/strong>) banned the manufacture and sale of alcohol. It cut drinking somewhat, but it bred <strong>speakeasies<\/strong>, <strong>bootlegging<\/strong>, and <strong>organized crime<\/strong> (Al Capone in Chicago). It was repealed by the <strong>Twenty-first Amendment<\/strong> in 1933.<\/p>\n<p>In the <strong>Scopes \"Monkey\" Trial<\/strong> (1925), Tennessee teacher <strong>John Scopes<\/strong> was tried for teaching <strong>evolution<\/strong> in violation of state law. <strong>Clarence Darrow<\/strong> defended him, and <strong>William Jennings Bryan<\/strong> helped prosecute. Scopes was convicted (later overturned on a technicality). Urban newspapers, especially <strong>H.L. Mencken's<\/strong>, mocked the <strong>fundamentalists<\/strong>, and the trial became a symbol of the clash between rural religious tradition and urban modernism.<\/p>\n<h2>8. The Harlem Renaissance and the Lost Generation<\/h2>\n<p>The Great Migration made <strong>Harlem<\/strong> the capital of Black America and the center of the <strong>Harlem Renaissance<\/strong>:<\/p>\n<ul><li><strong>Langston Hughes<\/strong>, poetry and jazz rhythms (\"The Negro Speaks of Rivers\")<\/li><li><strong>Zora Neale Hurston<\/strong>, folklore and fiction<\/li><li><strong>Claude McKay<\/strong>, poetry (\"If We Must Die\")<\/li><li><strong>Countee Cullen<\/strong>, poetry<\/li><li><strong>Alain Locke<\/strong>, editor of <em>The New Negro<\/em> (1925)<\/li><li>jazz and blues from <strong>Louis Armstrong<\/strong>, <strong>Duke Ellington<\/strong>, and <strong>Bessie Smith<\/strong><\/li><\/ul>\n<p><strong>Marcus Garvey's<\/strong> <strong>Universal Negro Improvement Association (UNIA)<\/strong> preached <strong>Black pride<\/strong>, economic independence, and a <strong>\"Back to Africa\"<\/strong> movement. It drew mass support before Garvey was convicted of mail fraud and deported.<\/p>\n<p>White writers disillusioned by the war and by middle-class materialism formed the <strong>\"Lost Generation\"<\/strong>, a term from Gertrude Stein. Many lived abroad in Paris:<\/p>\n<ul><li><strong>Ernest Hemingway<\/strong>: <em>The Sun Also Rises<\/em>, <em>A Farewell to Arms<\/em><\/li><li><strong>F. Scott Fitzgerald<\/strong>: <em>The Great Gatsby<\/em> (1925), a portrait of Jazz Age excess<\/li><li><strong>Sinclair Lewis<\/strong>: <em>Main Street<\/em> and <em>Babbitt<\/em>, satirizing small-town conformity and boosterism. He became the first American to win the Nobel Prize in Literature.<\/li><li><strong>T.S. Eliot<\/strong>: <em>The Waste Land<\/em><\/li><\/ul>","mustknow":["Road to war: <strong>Lusitania<\/strong> (1915), <strong>Sussex Pledge<\/strong>, renewed <strong>unrestricted submarine warfare<\/strong> and the <strong>Zimmermann Telegram<\/strong> (1917).","Home front: <strong>War Industries Board<\/strong>, <strong>Committee on Public Information<\/strong> (Creel), <strong>Espionage and Sedition Acts<\/strong>. <strong>Schenck<\/strong> = \"clear and present danger.\"","<strong>Great Migration<\/strong> of Black southerners to northern cities began during WWI.","<strong>Fourteen Points<\/strong> (self-determination, League of Nations). Senate (Lodge, <strong>Article X<\/strong>) rejected Versailles. U.S. never joined the League.","<strong>Red Scare / Palmer Raids<\/strong> (1919–20); <strong>Sacco and Vanzetti<\/strong>.","<strong>Immigration Act of 1924<\/strong>: national-origins quotas (2% of 1890) favoring northern and western Europe and excluding Asians.","<strong>Second KKK<\/strong>: anti-Black, anti-Catholic, anti-Jewish, anti-immigrant; strong in the Midwest.","<strong>Scopes Trial<\/strong> (1925): evolution, Darrow vs. Bryan, fundamentalism vs. modernism. <strong>Prohibition<\/strong> (18th; repealed by the 21st in 1933).","<strong>Harlem Renaissance<\/strong> (Hughes, Hurston, Locke) and <strong>Garvey's UNIA<\/strong>. <strong>Lost Generation<\/strong> (Hemingway, Fitzgerald, Lewis).","1920s politics: <strong>Harding<\/strong> (Teapot Dome), <strong>Coolidge<\/strong> (pro-business), <strong>Kellogg-Briand Pact<\/strong>, <strong>Washington Naval Conference<\/strong>. <strong>19th Amendment<\/strong> (1920)."],"timeline":[{"y":"1914","t":"War begins in Europe; Wilson declares neutrality","key":false},{"y":"1915","t":"Lusitania sunk; second KKK founded; <em>The Birth of a Nation<\/em>","key":false},{"y":"1916","t":"Sussex Pledge; Wilson reelected (\"He kept us out of war\")","key":false},{"y":"1917","t":"Unrestricted U-boat warfare; Zimmermann Telegram; U.S. declares war (April); Espionage Act","key":true},{"y":"1918","t":"Fourteen Points; Sedition Act; flu pandemic; armistice Nov. 11","key":true},{"y":"1919","t":"Treaty of Versailles; Senate rejects it; 18th Amendment; Red Summer; Schenck decision; strike wave","key":true},{"y":"1919–20","t":"Red Scare and Palmer Raids","key":false},{"y":"1920","t":"19th Amendment (woman suffrage); Harding elected; KDKA radio","key":true},{"y":"1921","t":"Emergency Quota Act; Tulsa Race Massacre; Washington Naval Conference begins","key":false},{"y":"1923","t":"Teapot Dome exposed; Harding dies, Coolidge president; ERA proposed","key":false},{"y":"1924","t":"Immigration (National Origins) Act; Dawes Plan; Indian Citizenship Act","key":true},{"y":"1925","t":"Scopes Trial; <em>The Great Gatsby<\/em>; <em>The New Negro<\/em>","key":true},{"y":"1927","t":"Lindbergh's flight; <em>The Jazz Singer<\/em>; Sacco and Vanzetti executed","key":false},{"y":"1928","t":"Kellogg-Briand Pact; Hoover defeats Al Smith","key":false}],"cards":[{"id":"u4c01","f":"Lusitania (1915)","b":"British liner sunk by a German U-boat. 128 Americans died, and U.S. opinion turned against Germany."},{"id":"u4c02","f":"Sussex Pledge (1916)","b":"Germany's promise not to sink merchant ships without warning. Broken in 1917."},{"id":"u4c03","f":"Zimmermann Telegram (1917)","b":"German proposal that Mexico join a war against the U.S. to regain Texas, New Mexico, and Arizona. Helped bring the U.S. into WWI."},{"id":"u4c04","f":"Committee on Public Information","b":"George Creel's WWI propaganda agency that \"sold\" the war to Americans."},{"id":"u4c05","f":"Espionage and Sedition Acts (1917–18)","b":"Punished interference with the war and criticism of the government. Debs was jailed under them."},{"id":"u4c06","f":"Schenck v. United States (1919)","b":"Upheld the Espionage Act: speech posing a \"clear and present danger\" can be restricted (Holmes)."},{"id":"u4c07","f":"War Industries Board","b":"Bernard Baruch's WWI agency coordinating industrial production. An early model of the managed economy."},{"id":"u4c08","f":"Great Migration","b":"Movement of Black southerners to northern and midwestern cities, beginning around WWI, for jobs and to escape Jim Crow."},{"id":"u4c09","f":"Fourteen Points (1918)","b":"Wilson's peace plan: open diplomacy, freedom of the seas, free trade, arms reduction, self-determination, League of Nations."},{"id":"u4c10","f":"Treaty of Versailles / Article X","b":"The Senate (Lodge) feared Article X's collective security would commit the U.S. to wars. The treaty was rejected, and the U.S. never joined the League."},{"id":"u4c11","f":"Red Scare (1919–20)","b":"Postwar fear of communists and anarchists. Palmer Raids arrested thousands and deported hundreds."},{"id":"u4c12","f":"Sacco and Vanzetti","b":"Italian immigrant anarchists executed in 1927 after a controversial murder trial. A symbol of 1920s nativism."},{"id":"u4c13","f":"Immigration Act of 1924","b":"National-origins quotas (2% of 1890 census) favoring northern and western Europe. Barred Japanese and other Asian immigration."},{"id":"u4c14","f":"Second Ku Klux Klan","b":"Revived in 1915. Millions of members by the mid-1920s, strong in the Midwest. Anti-Black, anti-Catholic, anti-Jewish, anti-immigrant."},{"id":"u4c15","f":"Nineteenth Amendment (1920)","b":"Women's right to vote nationwide. Catt's NAWSA lobbied, and Alice Paul's National Woman's Party protested."},{"id":"u4c16","f":"Teapot Dome","b":"Harding-era scandal: Interior Secretary Albert Fall took bribes for leasing federal oil reserves."},{"id":"u4c17","f":"Kellogg-Briand Pact (1928)","b":"Signatories renounced war as an instrument of national policy. No enforcement."},{"id":"u4c18","f":"Washington Naval Conference (1921–22)","b":"Treaties limiting battleship tonnage among the U.S., Britain, Japan, France, and Italy."},{"id":"u4c19","f":"Scopes Trial (1925)","b":"Tennessee teacher tried for teaching evolution. Darrow vs. Bryan. Fundamentalism vs. modernism."},{"id":"u4c20","f":"Prohibition","b":"18th Amendment (1919) and the Volstead Act banned alcohol. It led to speakeasies, bootlegging, and organized crime. Repealed by the 21st Amendment (1933)."},{"id":"u4c21","f":"Harlem Renaissance","b":"1920s flowering of Black art, literature, and music in Harlem: Langston Hughes, Zora Neale Hurston, Alain Locke, Duke Ellington."},{"id":"u4c22","f":"Marcus Garvey / UNIA","b":"Black nationalist leader who promoted racial pride, Black-owned businesses, and \"Back to Africa.\""},{"id":"u4c23","f":"Lost Generation","b":"Writers disillusioned by WWI and materialism: Hemingway, Fitzgerald (<em>The Great Gatsby<\/em>), Sinclair Lewis (<em>Babbitt<\/em>), T.S. Eliot."},{"id":"u4c24","f":"Flapper","b":"Symbol of the 1920s \"New Woman\": bobbed hair, short skirts, jazz, and independence."},{"id":"u4c25","f":"Assembly line / Model T","b":"Henry Ford's moving assembly line (1913) made cars affordable and transformed the economy and suburbs."},{"id":"u4c26","f":"Installment buying","b":"Buying on credit with monthly payments. Fueled 1920s consumer spending and household debt."}]}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const UNITS = D.units;
const QS = D.questions;
const QMAP = Object.fromEntries(QS.map(q => [q.id, q]));
const CARDS = UNITS.flatMap(u => u.cards.map(c => Object.assign({u: u.n}, c)));
const CMAP = Object.fromEntries(CARDS.map(c => [c.id, c]));
const THEMES = Object.fromEntries(D.meta.thematic_weights.map(t => [t.id, t]));
const LETTERS = ['A','B','C','D','E'];
const DAY = 86400000;
const $ = s => document.querySelector(s);
const main = document.getElementById('main');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => Math.round(x * 100) + '%';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };

/* ---------- storage (safe) ---------- */
const KEY = 'clep-ush2-v1';
let storageOK = true;
function blankState(){ return {v:1, theme:null, lessonsRead:{}, quiz:{}, diag:null, exams:{}, examRun:null, cards:{}, mistakes:{}, plan:null}; }
function loadState(){
  try { const raw = localStorage.getItem(KEY); if (!raw) return blankState(); return sanitize(JSON.parse(raw)); }
  catch(e){ storageOK = false; return blankState(); }
}
function sanitize(o){
  const s = blankState();
  if (!o || typeof o !== 'object') return s;
  for (const k of Object.keys(s)) if (o[k] !== undefined && typeof o[k] === typeof s[k] || (s[k] === null && o[k] && typeof o[k] === 'object')) s[k] = o[k];
  if (o.theme === 'light' || o.theme === 'dark') s.theme = o.theme;
  return s;
}
let S = loadState();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch(e){ storageOK = false; } }

/* ---------- theme ---------- */
function applyTheme(){ if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); else document.documentElement.removeAttribute('data-theme'); }
$('#themeBtn').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
applyTheme();

/* ---------- keyboard ---------- */
let keyHandler = null;
document.addEventListener('keydown', e => {
  if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (keyHandler && keyHandler(e) === true) e.preventDefault();
});

/* ---------- derived progress ---------- */
const unitQs = (n, pool) => QS.filter(q => q.u === n && (!pool || q.pool === pool));
const diagLabel = n => {
  if (!S.diag || !S.diag.byUnit || !S.diag.byUnit[n]) return null;
  const r = S.diag.byUnit[n]; const p = r.c / r.n;
  return p >= 0.75 ? 'skim' : p >= 0.5 ? 'study' : 'must';
};
const labelPill = l => l === 'skim' ? '<span class="pill good">Skim</span>' : l === 'study' ? '<span class="pill warn">Study</span>' : l === 'must' ? '<span class="pill bad">Must study</span>' : '';
const unitDone = n => !!S.lessonsRead[n] && S.quiz[n] && S.quiz[n].best >= 0.7;
const cardState = id => S.cards[id] || null;
function cardMastery(n){ const cs = CARDS.filter(c => !n || c.u === n); if (!cs.length) return 0; return cs.filter(c => (S.cards[c.id] || {}).box >= 3).length / cs.length; }
function dueCards(n){ const now = Date.now(); return CARDS.filter(c => (!n || c.u === n) && (!S.cards[c.id] || S.cards[c.id].due <= now)); }
function openMistakes(){ return Object.keys(S.mistakes).filter(id => QMAP[id] && !S.mistakes[id].ok); }

/* time model (minutes) */
function unitTasks(n){
  const u = UNITS[n-1]; const lab = diagLabel(n); const f = lab === 'skim' ? 0.5 : 1;
  const qn = unitQs(n, 'quiz').length;
  return [
    {id:'lesson'+n, unit:n, kind:'lesson', label:`Unit ${n}: read lesson + must-know + timeline`, min: Math.round((u.minutes + 10) * f), done: !!S.lessonsRead[n]},
    {id:'quiz'+n, unit:n, kind:'quiz', label:`Unit ${n}: quiz (${qn} Q) + review explanations`, min: Math.round(qn * 1.5), done: !!S.quiz[n]},
    {id:'cards'+n, unit:n, kind:'cards', label:`Unit ${n}: learn flashcards (${u.cards.length})`, min: Math.round(u.cards.length * 1.0), done: cardMastery(n) >= 0.8, frac: cardMastery(n)}
  ];
}
function allTasks(){
  const t = [{id:'diag', kind:'diag', label:'Diagnostic test (30 Q)', min:45, done: !!S.diag}];
  const order = UNITS.map(u => u.n).sort((a,b) => { const r = l => ({must:0, study:1, skim:2})[diagLabel(l)] ?? 1; return r(a) - r(b) || a - b; });
  for (const n of order) t.push(...unitTasks(n));
  t.push({id:'review', kind:'review', label:'Spaced flashcard reviews (ongoing)', min: Math.round(CARDS.length * 0.9 * (1 - cardMastery())), done: cardMastery() >= 0.9});
  t.push({id:'mist', kind:'mist', label:'Drill the mistake log', min: Math.max(30, openMistakes().length * 2), done: false, always:true});
  t.push({id:'cheat', kind:'cheat', label:'Cheat sheet: redraw from memory', min:60, done:false, always:true});
  t.push({id:'examA', kind:'exam', label:'Practice Exam 1 (90 min) + review', min:150, done: !!(S.exams.A && S.exams.A.attempts)});
  t.push({id:'examB', kind:'exam', label:'Practice Exam 2 (90 min) + review', min:150, done: !!(S.exams.B && S.exams.B.attempts)});
  return t;
}
function hoursLeft(){
  let m = 0; for (const t of allTasks()) { if (t.done) continue; m += t.frac ? t.min * (1 - t.frac) : t.min; }
  return m / 60;
}
function totalHours(){ return allTasks().reduce((a,t) => a + t.min, 0) / 60; }

/* ---------- nav / router ---------- */
const NAV = [['#/','Home'],['#/diagnostic','Diagnostic'],['#/units','Units'],['#/cards','Flashcards'],['#/mistakes','Mistakes'],['#/exams','Practice exams'],['#/cheatsheet','Cheat sheet'],['#/plan','Study plan'],['#/about','About & data']];
function renderNav(){
  const h = location.hash || '#/';
  $('#nav').innerHTML = NAV.map(([href, l]) => {
    const on = href === '#/' ? (h === '#/' || h === '' || h === '#') : h.startsWith(href) || (href === '#/units' && h.startsWith('#/unit/')) || (href === '#/exams' && h.startsWith('#/exam/'));
    return `<a href="${href}" class="${on ? 'on' : ''}">${l}</a>`;
  }).join('');
}
const ROUTES = [
  [/^#?\/?$/, viewHome], [/^#\/diagnostic$/, viewDiag], [/^#\/units$/, viewUnits],
  [/^#\/unit\/(\d+)(?:\/(\w+))?$/, viewUnit], [/^#\/cards$/, viewCards], [/^#\/mistakes$/, viewMistakes],
  [/^#\/exams$/, viewExams], [/^#\/exam\/(A|B)$/, viewExam], [/^#\/cheatsheet$/, viewCheat],
  [/^#\/plan$/, viewPlan], [/^#\/about$/, viewAbout]
];
let timerIv = null;
function route(){
  keyHandler = null; if (timerIv) { clearInterval(timerIv); timerIv = null; }
  renderNav();
  const h = location.hash || '#/';
  for (const [re, fn] of ROUTES) { const m = h.match(re); if (m) { fn(...m.slice(1)); window.scrollTo(0,0); return; } }
  viewHome();
}
window.addEventListener('hashchange', route);
function banners(){
  let b = '';
  if (!storageOK) b += `<div class="banner">Your browser is blocking storage, so progress will not be saved between visits. Use <a href="#/about">Export progress</a> to keep a copy.</div>`;
  if (S.examRun && !location.hash.startsWith('#/exam/')) b += `<div class="banner"><b>A practice exam is in progress and its timer is still running.</b> <a href="#/exam/${S.examRun.exam}">Return to the exam</a></div>`;
  return b;
}

/* ---------- HOME ---------- */
function readiness(){
  const a = S.exams.A ? S.exams.A.best : null, b = S.exams.B ? S.exams.B.best : null;
  const ready = a != null && b != null && a >= 0.75 && b >= 0.75;
  return {a, b, ready};
}
function readinessCard(){
  const {a, b, ready} = readiness();
  const taken = [a, b].filter(x => x != null).length;
  const score = Math.min(a || 0, b || 0); // the lower exam is what gates booking (untaken = 0)
  const col = ready ? 'var(--good)' : 'var(--accent)';
  const deg = Math.round(Math.min(1, score / 0.75) * 360);
  const status = ready ? '<span class="pill good">Ready to book</span>' : '<span class="pill warn">Not ready yet</span>';
  const line = x => x == null ? '<span class="muted">not taken</span>' : `<b>${pct(x)}</b> ${x >= 0.75 ? '<span class="pill good">≥75%</span>' : '<span class="pill bad">below 75%</span>'}`;
  return `<div class="card"><div class="meter">
    <div class="dial" style="background:conic-gradient(${col} ${deg}deg, var(--surface2) 0)"><span>${taken ? pct(score) : '—'}<small>lower exam</small></span></div>
    <div><h3 style="margin:0 0 6px">Readiness ${status}</h3>
    <div class="small">Practice Exam 1 (best): ${line(a)}<br>Practice Exam 2 (best): ${line(b)}</div>
    <div class="small muted" style="margin-top:6px">“Ready to book” turns on only when <b>both</b> practice exams are at 75% or higher. The dial fills as your <b>lower</b> score approaches 75%.</div></div>
  </div></div>`;
}
function nextStep(){
  if (S.examRun) return [`Finish your practice exam`, `#/exam/${S.examRun.exam}`];
  if (!S.diag) return ['Take the 30-question diagnostic', '#/diagnostic'];
  const t = allTasks().find(t => !t.done && !t.always);
  if (!t) return ['Drill your mistakes and redraw the cheat sheet', '#/mistakes'];
  if (t.kind === 'lesson') return [t.label, `#/unit/${t.unit}/lesson`];
  if (t.kind === 'quiz') return [t.label, `#/unit/${t.unit}/quiz`];
  if (t.kind === 'cards') return [t.label, `#/unit/${t.unit}/cards`];
  if (t.kind === 'review') return [t.label, '#/cards'];
  if (t.id === 'examA') return ['Take Practice Exam 1', '#/exam/A'];
  if (t.id === 'examB') return ['Take Practice Exam 2', '#/exam/B'];
  return [t.label, '#/'];
}
function viewHome(){
  const done = UNITS.filter(u => unitDone(u.n)).length;
  const hl = hoursLeft(), th = totalHours();
  const [ns, nh] = nextStep();
  const due = dueCards().length, mk = openMistakes().length;
  main.innerHTML = banners() + `
  <h1>Pass CLEP US History II</h1>
  <p class="muted">The exam has about 120 questions in 90 minutes and covers 1865 to the present. 70% of it is after 1914. Work through the steps in order. Nothing here is filler.</p>
  <div class="card" style="border-color:var(--accent)"><div class="tag">Next step</div><div class="row" style="justify-content:space-between;margin-top:4px"><b>${esc(ns)}</b><a class="btn" href="${nh}">Go →</a></div></div>
  ${readinessCard()}
  <div class="grid g3">
    <div class="card"><div class="tag">Units complete</div><div style="font-size:1.6rem;font-weight:700">${done} / ${UNITS.length}</div><div class="bar"><span style="width:${done/UNITS.length*100}%"></span></div></div>
    <div class="card"><div class="tag">Est. hours left</div><div style="font-size:1.6rem;font-weight:700">${hl.toFixed(1)} h</div><div class="small muted">of about ${th.toFixed(0)} h total</div></div>
    <div class="card"><div class="tag">Review queue</div><div style="font-size:1.05rem;margin-top:4px"><a href="#/cards">${due} cards due</a><br><a href="#/mistakes">${mk} mistakes to drill</a></div></div>
  </div>
  <h2>Units</h2>
  <div class="card tablewrap"><table><thead><tr><th>Unit</th><th>Weight</th><th>Diagnostic</th><th>Lesson</th><th>Quiz best</th><th>Cards</th></tr></thead><tbody>
  ${UNITS.map(u => `<tr><td><a href="#/unit/${u.n}">${u.n}. ${esc(u.title)}</a><div class="small muted">${esc(u.years)}</div></td><td>${u.weight}%</td>
    <td>${labelPill(diagLabel(u.n)) || '<span class="muted small">—</span>'}</td>
    <td>${S.lessonsRead[u.n] ? '<span class="pill good">Read</span>' : '<span class="muted small">—</span>'}</td>
    <td>${S.quiz[u.n] ? `<span class="pill ${S.quiz[u.n].best >= 0.7 ? 'good' : 'bad'}">${pct(S.quiz[u.n].best)}</span>` : '<span class="muted small">—</span>'}</td>
    <td><div class="bar good" style="width:70px"><span style="width:${cardMastery(u.n)*100}%"></span></div></td></tr>`).join('')}
  </tbody></table></div>
  <p class="small muted">A unit counts as complete when you have marked the lesson read <b>and</b> scored 70% or higher on its quiz. Cards bar = share of the unit's flashcards in Leitner box 3 or higher.</p>`;
}

/* ---------- UNITS LIST ---------- */
function viewUnits(){
  main.innerHTML = banners() + `<h1>Units</h1><p class="muted">The units run in time order, and their weights match the official 30% (1865–1914) / 70% (1915–present) split. Spend your time where the weight is.</p>` +
  UNITS.map(u => `<a href="#/unit/${u.n}" style="text-decoration:none;color:inherit"><div class="card"><div class="row" style="justify-content:space-between"><div><b>${u.n}. ${esc(u.title)}</b> <span class="muted">${esc(u.years)}</span></div><div class="row">${labelPill(diagLabel(u.n))}<span class="pill acc">${u.weight}% of exam</span>${unitDone(u.n) ? '<span class="pill good">Done</span>' : ''}</div></div>
  <div class="small muted" style="margin-top:4px">${u.minutes}-min lesson · ${unitQs(u.n,'quiz').length}-question quiz · ${u.cards.length} flashcards</div></div></a>`).join('');
}

/* ---------- UNIT ---------- */
function viewUnit(n, tab){
  n = +n; const u = UNITS[n-1]; if (!u) return viewUnits();
  tab = tab || 'lesson';
  const tabs = [['lesson','Lesson'],['must','Must know'],['timeline','Timeline'],['quiz','Quiz'],['cards','Flashcards']];
  const head = banners() + `<div class="tag">Unit ${n} of ${UNITS.length} · ${esc(u.years)} · ${u.weight}% of exam</div><h1>${esc(u.title)}</h1>
  <div class="row noprint" style="margin-bottom:10px">${tabs.map(([k,l]) => `<a class="btn sm ${k === tab ? '' : 'ghost'}" href="#/unit/${n}/${k}">${l}</a>`).join('')}</div>`;
  const pager = `<hr><div class="row" style="justify-content:space-between">${n > 1 ? `<a href="#/unit/${n-1}">← Unit ${n-1}</a>` : '<span></span>'}${n < UNITS.length ? `<a href="#/unit/${n+1}">Unit ${n+1} →</a>` : '<span></span>'}</div>`;
  if (tab === 'lesson') {
    main.innerHTML = head + `<div class="small muted">About ${u.minutes} minutes to read. ${labelPill(diagLabel(n))}${diagLabel(n) === 'skim' ? ' Your diagnostic says you can skim this one: read the bold terms and the must-know box.' : ''}</div>
    <article class="lesson">${u.lesson}</article>
    <div class="card mustknow"><b>Must know</b><ol>${u.mustknow.map(m => `<li>${m}</li>`).join('')}</ol></div>
    <div class="row"><label class="row" style="cursor:pointer"><input type="checkbox" id="readChk" ${S.lessonsRead[n] ? 'checked' : ''}> I've read this lesson</label><a class="btn" href="#/unit/${n}/quiz">Take the quiz →</a></div>` + pager;
    $('#readChk').onchange = e => { if (e.target.checked) S.lessonsRead[n] = true; else delete S.lessonsRead[n]; save(); };
  } else if (tab === 'must') {
    main.innerHTML = head + `<div class="card mustknow"><b>The ${u.mustknow.length} things most likely to be tested</b><ol>${u.mustknow.map(m => `<li>${m}</li>`).join('')}</ol></div>` + pager;
  } else if (tab === 'timeline') {
    main.innerHTML = head + `<p class="small muted">Filled dots are the key dates. Cover the right side and try to say what happened in each year.</p>${timelineHTML(u.timeline)}` + pager;
  } else if (tab === 'quiz') {
    const qs = unitQs(n, 'quiz');
    const best = S.quiz[n] ? `Best: <b>${pct(S.quiz[n].best)}</b> · Last: ${pct(S.quiz[n].last)} · Attempts: ${S.quiz[n].attempts}` : 'Not taken yet.';
    main.innerHTML = head + `<div class="card"><p>${qs.length} CLEP-style questions. After each answer you'll see why it is right and why every other option is wrong. A score of 70% or higher marks the unit complete.</p><p class="small muted">${best}</p><button class="btn" id="go">Start quiz</button> <span class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> answer · <span class="kbd">Enter</span> next</span></div>` + pager;
    const start = () => runQuiz({title:`Unit ${n} quiz`, qs: shuffle(qs), mode:'practice', back:`#/unit/${n}/quiz`, onDone: r => {
      const sc = r.correct / r.total; const p = S.quiz[n] || {best:0, attempts:0};
      S.quiz[n] = {best: Math.max(p.best, sc), last: sc, attempts: p.attempts + 1}; save();
    }});
    $('#go').onclick = start;
    keyHandler = e => { if (e.key === 'Enter') { start(); return true; } };
  } else if (tab === 'cards') {

  }

function timelineHTML(tl){ return `<div class="tl">${tl.map(e => `<div class="ev ${e.key ? 'key' : ''}"><span class="yr">${esc(e.y)}</span>${e.t}</div>`).join('')}</div>`; }

/* ---------- QUIZ ENGINE (practice / diagnostic / drill) ---------- */
function recordMistake(id, correct, mode){
  if (!correct) { const m = S.mistakes[id] || {n:0}; m.n++; m.t = Date.now(); m.ok = false; S.mistakes[id] = m; }
  else if (mode === 'drill' && S.mistakes[id]) { S.mistakes[id].ok = true; }
}
function stimHTML(q){ return q.st ? `<div class="stim">${q.st}</div>` : ''; }
function qMeta(q){ return `<span class="pill">Unit ${q.u}</span> <span class="pill">${esc(THEMES[q.th].short)}</span>`; }
function runQuiz(opts){
  const {qs, mode} = opts; let i = 0, sel = null, revealed = false; const res = [];
  const feedback = mode !== 'diag';
  function render(){
    const q = qs[i];
    main.innerHTML = banners() + `<div class="qhead"><b>${esc(opts.title)}</b><span class="muted small">Question ${i+1} of ${qs.length}</span></div>
    <div class="bar"><span style="width:${(i)/qs.length*100}%"></span></div>
    <div class="card">${feedback ? `<div class="row small" style="margin-bottom:6px">${qMeta(q)}</div>` : ''}${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o, k) => {
      let cls = '';
      if (revealed) cls = k === q.a ? 'right' : (k === sel ? 'wrong' : '');
      else if (k === sel) cls = 'sel';
      return `<button class="opt ${cls}" data-k="${k}" ${revealed ? 'disabled' : ''}><span class="k">${LETTERS[k]}</span><span>${o}${revealed ? `<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span>` : ''}</span></button>`;
    }).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <a href="${opts.back}" class="small muted">Quit</a>
      <button class="btn" id="nx" ${sel == null ? 'disabled' : ''}>${!feedback ? (i === qs.length-1 ? 'Finish' : 'Next') : revealed ? (i === qs.length-1 ? 'See results' : 'Next') : 'Check'}</button></div>
    <div class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> ${feedback ? 'answer' : 'select'} · <span class="kbd">Enter</span> ${feedback ? 'next' : 'confirm'}</div></div>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
    $('#nx').onclick = next;
  }
  function choose(k){ if (revealed) return; sel = k; if (feedback) reveal(); else render(); }
  function reveal(){ revealed = true; const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); render(); }
  function next(){
    if (sel == null) return;
    if (feedback && !revealed) { reveal(); return; }
    if (!feedback) { const q = qs[i]; const ok = sel === q.a; res.push({id:q.id, sel, ok}); recordMistake(q.id, ok, mode); save(); }
    if (i < qs.length - 1) { i++; sel = null; revealed = false; render(); window.scrollTo(0,0); }
    else finish();
  }
  function finish(){
    keyHandler = null;
    const r = {total: res.length, correct: res.filter(x => x.ok).length, res};
    if (opts.onDone) opts.onDone(r);
    if (opts.renderResults) return opts.renderResults(r);
    main.innerHTML = banners() + `<h1>${esc(opts.title)}: results</h1><div class="card"><div style="font-size:2rem;font-weight:700">${r.correct} / ${r.total} <span class="muted" style="font-size:1rem">(${pct(r.correct/r.total)})</span></div>
    <p class="muted">${r.correct/r.total >= 0.75 ? 'Solid. Keep the flashcards going.' : 'Missed questions are now in your mistake log. Re-read the bold terms in the lesson, then drill them.'}</p>
    <div class="row"><a class="btn" href="${opts.back}">Done</a><a class="btn ghost" href="#/mistakes">Mistake log</a></div></div>${reviewList(res.filter(x => !x.ok))}`;
  }
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { choose(+e.key - 1); return true; }
    const L = e.key.toUpperCase(); if (!revealed && LETTERS.includes(L) && e.key.length === 1) { choose(LETTERS.indexOf(L)); return true; }
    if (e.key === 'Enter') { next(); return true; }
  };
  render();
}
function reviewList(items, title){
  if (!items.length) return '';
  return `<h2>${title || 'Review what you missed'}</h2>` + items.map(x => { const q = QMAP[x.id]; return `<div class="card"><div class="row small">${qMeta(q)}</div>${stimHTML(q)}<div class="stem">${q.s}</div>
    <div class="opts">${q.o.map((o,k) => `<div class="opt ${k === q.a ? 'right' : k === x.sel ? 'wrong' : ''}"><span class="k">${LETTERS[k]}</span><span>${o}<span class="ex">${k === q.a ? '✓ ' : '✗ '}${q.e[k]}</span></span></div>`).join('')}</div></div>`; }).join('');
}

/* ---------- DIAGNOSTIC ---------- */
function viewDiag(){
  const qs = QS.filter(q => q.pool === 'diag').sort((a,b) => a.u - b.u);
  let prev = '';
  if (S.diag) prev = `<div class="card"><b>Your diagnostic results</b> <span class="muted small">(${esc(S.diag.date)})</span>${diagTable()}</div>`;
  main.innerHTML = banners() + `<h1>Diagnostic test</h1><p>${qs.length} questions covering all ${UNITS.length} units, untimed, with no feedback until the end. It shows you which units to <b>skim</b> and which you <b>must study</b>, and the study plan and hour estimates adjust to match. Guess if you have to. A guess still tells you something.</p>${prev}
  <button class="btn" id="go">${S.diag ? 'Retake diagnostic' : 'Start diagnostic'}</button>`;
  const start = () => runQuiz({title:'Diagnostic', qs, mode:'diag', back:'#/diagnostic',
    onDone: r => { const by = {}; for (const x of r.res) { const u = QMAP[x.id].u; by[u] = by[u] || {c:0, n:0}; by[u].n++; if (x.ok) by[u].c++; } S.diag = {date: todayStr(), byUnit: by, score: r.correct / r.total}; save(); },
    renderResults: r => { main.innerHTML = `<h1>Diagnostic results</h1><div class="card"><div style="font-size:1.8rem;font-weight:700">${r.correct} / ${r.total} (${pct(r.correct/r.total)})</div>${diagTable()}<p class="small muted">Skim = 75% or higher · Study = 50–74% · Must study = under 50%. There are only 2–4 questions per unit, so treat these labels as a rough guide.</p><div class="row"><a class="btn" href="#/plan">Build my study plan →</a><a class="btn ghost" href="#/">Home</a></div></div>${reviewList(r.res.filter(x => !x.ok), 'Answers to the questions you missed')}`; }
  });
  $('#go').onclick = start;
  keyHandler = e => { if (e.key === 'Enter') { start(); return true; } };
}
function diagTable(){
  return `<div class="tablewrap"><table><thead><tr><th>Unit</th><th>Score</th><th>Verdict</th></tr></thead><tbody>${UNITS.map(u => { const r = S.diag.byUnit[u.n]; return `<tr><td><a href="#/unit/${u.n}">${u.n}. ${esc(u.title)}</a></td><td>${r ? `${r.c}/${r.n}` : '—'}</td><td>${labelPill(diagLabel(u.n))}</td></tr>`; }).join('')}</tbody></table></div>`;
}

/* ---------- FLASHCARDS (Leitner) ---------- */
const INTERVALS = [0, 1, 3, 7, 14]; // days for boxes 1..5
function viewCards(){
  main.innerHTML = banners() + `<h1>Flashcards</h1><p class="muted">These are Leitner boxes. A card you get right moves up a box and comes back later (box 1 = today, then 1, 3, 7, and 14 days). A card you miss drops to box 1 and comes back in this same session.</p>
  <div class="card"><div class="row"><label class="f">Unit<select id="fu"><option value="0">All units</option>${UNITS.map(u => `<option value="${u.n}">${u.n}. ${esc(u.title)}</option>`).join('')}</select></label>
  <label class="f">Mode<select id="fm"><option value="due">Due now</option><option value="missed">Review missed only</option><option value="all">All cards (cram)</option></select></label></div>
  ${boxChart()}</div><div id="fcwrap"></div>`;
  const go = () => flashSession($('#fcwrap'), {unit: +$('#fu').value, mode: $('#fm').value});
  $('#fu').onchange = go; $('#fm').onchange = go; go();
}
function boxChart(n){
  const cs = CARDS.filter(c => !n || c.u === n); const counts = [0,0,0,0,0,0];
  for (const c of cs) { const s = S.cards[c.id]; counts[s ? s.box : 0]++; }
  const mx = Math.max(1, ...counts);
  const lbl = ['New','Box 1','Box 2','Box 3','Box 4','Box 5'];
  return `<div class="boxes">${counts.map(v => `<div title="${v}" style="height:${v/mx*100}%"></div>`).join('')}</div><div class="boxlbl">${counts.map((v,k) => `<span>${lbl[k]}<br><b>${v}</b></span>`).join('')}</div>`;
}
function flashSession(el, {unit, mode}){
  const pool = CARDS.filter(c => !unit || c.u === unit);
  let queue;
  if (mode === 'missed') queue = pool.filter(c => S.cards[c.id] && S.cards[c.id].lastMiss);
  else if (mode === 'all') queue = pool.slice();
  else { const now = Date.now(); const seen = pool.filter(c => S.cards[c.id] && S.cards[c.id].due <= now); const fresh = pool.filter(c => !S.cards[c.id]); queue = seen.concat(fresh.slice(0, Math.max(0, 30 - seen.length))); }
  queue = shuffle(queue); let flipped = false, got = 0, missed = 0; const total = queue.length;
  function render(){
    if (!queue.length) {
      el.innerHTML = `<div class="card"><b>${total ? 'Session complete.' : mode === 'missed' ? 'No missed cards here. Nice.' : 'Nothing due right now.'}</b> ${total ? `<span class="muted">${got} right first time, ${missed} misses.</span>` : ''}<div class="small muted" style="margin-top:6px">${dueCards(unit || 0).length} cards due in this set now.</div>${unit ? boxChart(unit) : ''}<div class="row" style="margin-top:8px"><button class="btn ghost sm" id="again">Cram all cards in this set</button></div></div>`;
      $('#again').onclick = () => flashSession(el, {unit, mode:'all'}); keyHandler = null; return;
    }
    const c = queue[0]; const st = S.cards[c.id];
    el.innerHTML = `<div class="row small muted" style="justify-content:space-between;margin-top:10px"><span>${queue.length} left in session · Unit ${c.u}</span><span>${st ? 'Box ' + st.box : 'New card'}</span></div>
    <div class="card fc" id="fc">${flipped ? `<div><div style="font-weight:700;margin-bottom:8px">${c.f}</div><div class="back">${c.b}</div></div>` : `<div>${c.f}<div class="small muted" style="margin-top:12px">tap or press Space to flip</div></div>`}</div>
    <div class="row" style="justify-content:center">${flipped ? `<button class="btn ghost" id="miss">✗ Missed <span class="kbd">1</span></button><button class="btn" id="hit">✓ Got it <span class="kbd">2</span></button>` : `<button class="btn" id="flip">Flip <span class="kbd">Space</span></button>`}</div>`;
    $('#fc').onclick = () => { flipped = !flipped; render(); };
    if (flipped) { $('#miss').onclick = () => grade(false); $('#hit').onclick = () => grade(true); } else $('#flip').onclick = () => { flipped = true; render(); };
  }
  function grade(ok){
    const c = queue.shift(); const st = S.cards[c.id] || {box:0, miss:0};
    if (ok) { st.box = Math.min(5, Math.max(1, st.box + 1)); st.due = Date.now() + INTERVALS[st.box - 1] * DAY; st.lastMiss = false; if (!c._m) got++; }
    else { st.box = 1; st.due = Date.now(); st.miss = (st.miss || 0) + 1; st.lastMiss = true; missed++; c._m = true; queue.splice(Math.min(queue.length, 3), 0, c); }
    if (ok && st.box === 1) st.due = Date.now() + 10 * 60000; // learned today, show again later
    S.cards[c.id] = st; save(); flipped = false; render();
  }
  keyHandler = e => {
    if (!queue.length) return;
    if (e.key === ' ' || e.key === 'Enter' && !flipped) { flipped = !flipped; render(); return true; }
    if (flipped && e.key === '1') { grade(false); return true; }
    if (flipped && (e.key === '2' || e.key === 'Enter')) { grade(true); return true; }
  };
  pool.forEach(c => delete c._m);
  render();
}

/* ---------- MISTAKES ---------- */
function viewMistakes(){
  const ids = openMistakes().sort((a,b) => QMAP[a].u - QMAP[b].u);
  const fixed = Object.keys(S.mistakes).filter(id => QMAP[id] && S.mistakes[id].ok).length;
  main.innerHTML = banners() + `<h1>Mistake log</h1><p class="muted">Every question you miss in any mode lands here. In a drill, answering one correctly clears it. Fixed so far: ${fixed}.</p>
  <div class="card"><div class="row" style="justify-content:space-between"><b>${ids.length} open mistake${ids.length === 1 ? '' : 's'}</b><div class="row"><select id="mu"><option value="0">All units</option>${UNITS.map(u => `<option value="${u.n}">Unit ${u.n} (${ids.filter(id => QMAP[id].u === u.n).length})</option>`).join('')}</select><button class="btn" id="go" ${ids.length ? '' : 'disabled'}>Drill</button></div></div></div>
  ${ids.length ? `<div class="card tablewrap"><table><thead><tr><th>Unit</th><th>Question</th><th>Missed</th></tr></thead><tbody>${ids.map(id => { const q = QMAP[id]; return `<tr><td>${q.u}</td><td>${q.s.replace(/<[^>]+>/g,'').slice(0,110)}…</td><td>${S.mistakes[id].n}×</td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted">Nothing here yet. Take a quiz or the diagnostic.</p>'}`;
  const go = () => { const u = +$('#mu').value; const qs = shuffle(ids.filter(id => !u || QMAP[id].u === u).map(id => QMAP[id])); if (!qs.length) return; runQuiz({title:'Mistake drill', qs, mode:'drill', back:'#/mistakes'}); };
  $('#go').onclick = go;
}

/* ---------- PRACTICE EXAMS ---------- */
const EXAM_MIN = 90;
function viewExams(){
  const card = (k, label) => { const e = S.exams[k]; const n = QS.filter(q => q.pool === k).length; return `<div class="card"><h3 style="margin-top:0">${label}</h3><p class="small muted">${n} questions · ${EXAM_MIN} minutes · no pausing · results by unit, theme, and period at the end</p>
    ${e ? `<p>Best: <b>${pct(e.best)}</b> · Last: ${pct(e.last)} · Attempts: ${e.attempts}</p>` : '<p class="muted">Not taken.</p>'}
    ${e && e.history && e.history.length ? `<details><summary class="small">Last result breakdown</summary>${breakdownHTML(e.history[e.history.length-1])}</details>` : ''}
    <a class="btn" href="#/exam/${k}">${S.examRun && S.examRun.exam === k ? 'Resume (timer running)' : 'Start'}</a></div>`; };
  main.innerHTML = banners() + `<h1>Practice exams</h1><p>Each exam copies the real format: about 120 five-option questions in 90 minutes. The timer keeps running if you leave the page, just like test day. The two exams share no questions with each other, with the unit quizzes, or with the diagnostic. Take them in the last few days before your exam.</p>
  ${readinessCard()}<div class="grid g2">${card('A','Practice Exam 1')}${card('B','Practice Exam 2')}</div>`;
}
function viewExam(k){
  const qs = QS.filter(q => q.pool === k);
  if (!S.examRun || S.examRun.exam !== k) {
    if (S.examRun) { main.innerHTML = banners() + `<div class="card">Finish your other exam first.</div>`; return; }
    main.innerHTML = banners() + `<h1>Practice Exam ${k === 'A' ? 1 : 2}</h1><div class="card"><ul><li>${qs.length} questions, ${EXAM_MIN} minutes. That's 45 seconds per question.</li><li><b>No pausing.</b> Once you start, the clock runs even if you close the tab.</li><li>You can skip, flag, and go back. At 0:00 the exam is submitted automatically.</li><li>There's no penalty for guessing on CLEP, so never leave a question blank.</li></ul>
    <p class="kbdhint">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> answer · <span class="kbd">Enter</span>/<span class="kbd">→</span> next · <span class="kbd">←</span> back · <span class="kbd">F</span> flag</p>
    <button class="btn" id="go">Start the clock</button> <a href="#/exams" class="btn ghost">Not now</a></div>`;
    $('#go').onclick = () => { S.examRun = {exam:k, order: shuffle(qs.map(q => q.id)), ans:{}, flag:{}, start: Date.now(), cur:0}; save(); viewExam(k); };
    return;
  }
  const R = S.examRun;
  const left = () => EXAM_MIN * 60000 - (Date.now() - R.start);
  if (left() <= 0) return submitExam();
  function fmt(ms){ ms = Math.max(0, ms); const s = Math.floor(ms / 1000); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
  function render(){
    const q = QMAP[R.order[R.cur]]; const a = R.ans[q.id];
    const answered = Object.keys(R.ans).length;
    main.innerHTML = `<div class="qhead"><b>Practice Exam ${k === 'A' ? 1 : 2}</b><span class="timer" id="tm">${fmt(left())}</span></div>
    <div class="small muted">Question ${R.cur+1} of ${R.order.length} · ${answered} answered</div>
    <div class="card">${stimHTML(q)}<div class="stem">${q.s}</div><div class="opts">${q.o.map((o,j) => `<button class="opt ${a === j ? 'sel' : ''}" data-k="${j}"><span class="k">${LETTERS[j]}</span><span>${o}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:14px;justify-content:space-between"><div class="row"><button class="btn ghost sm" id="pv" ${R.cur === 0 ? 'disabled' : ''}>← Back</button><button class="btn ghost sm" id="fl">${R.flag[q.id] ? '★ Flagged' : '☆ Flag'}</button></div>
    <div class="row">${R.cur < R.order.length - 1 ? '<button class="btn sm" id="nx">Next →</button>' : ''}<button class="btn sm ${R.cur < R.order.length - 1 ? 'ghost' : ''}" id="sb">Submit exam</button></div></div></div>
    <details class="card"><summary class="small">Question navigator (flagged = gold border)</summary><div class="navgrid">${R.order.map((id,j) => `<button data-j="${j}" class="${R.ans[id] != null ? 'ans' : ''} ${j === R.cur ? 'cur' : ''} ${R.flag[id] ? 'flag' : ''}">${j+1}</button>`).join('')}</div></details>`;
    main.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
    main.querySelectorAll('.navgrid button').forEach(b => b.onclick = () => go(+b.dataset.j));
    $('#pv').onclick = () => go(R.cur - 1); if ($('#nx')) $('#nx').onclick = () => go(R.cur + 1);
    $('#fl').onclick = () => { R.flag[q.id] = !R.flag[q.id]; save(); render(); };
    $('#sb').onclick = () => { const un = R.order.length - Object.keys(R.ans).length; if (confirm(un ? `${un} question(s) unanswered. Submit anyway?` : 'Submit the exam?')) submitExam(); };
  }
  function pick(j){ R.ans[R.order[R.cur]] = j; save(); render(); }
  function go(j){ if (j < 0 || j >= R.order.length) return; R.cur = j; save(); render(); window.scrollTo(0,0); }
  timerIv = setInterval(() => { const l = left(); const t = $('#tm'); if (t) { t.textContent = fmt(l); t.classList.toggle('low', l < 5 * 60000); } if (l <= 0) { clearInterval(timerIv); timerIv = null; submitExam(true); } }, 1000);
  keyHandler = e => {
    if (/^[1-5]$/.test(e.key)) { pick(+e.key - 1); return true; }
    if (e.key === 'Enter' || e.key === 'ArrowRight') { go(R.cur + 1); return true; }
    if (e.key === 'ArrowLeft') { go(R.cur - 1); return true; }
    if (e.key === 'f' || e.key === 'F') { const id = R.order[R.cur]; R.flag[id] = !R.flag[id]; save(); render(); return true; }
  };
  render();
}
function tally(res){
  const by = (f) => { const o = {}; for (const x of res) { const q = QMAP[x.id]; const key = f(q); o[key] = o[key] || {c:0, n:0}; o[key].n++; if (x.ok) o[key].c++; } return o; };
  return {unit: by(q => q.u), theme: by(q => q.th), period: by(q => UNITS[q.u-1].period)};
}
function submitExam(timeout){
  const R = S.examRun; if (!R) return; if (timerIv) { clearInterval(timerIv); timerIv = null; }
  const res = R.order.map(id => ({id, sel: R.ans[id] != null ? R.ans[id] : null, ok: R.ans[id] === QMAP[id].a}));
  for (const x of res) recordMistake(x.id, x.ok, 'exam');
  const sc = res.filter(x => x.ok).length / res.length;
  const t = tally(res);
  const rec = {date: todayStr(), score: sc, mins: Math.min(EXAM_MIN, Math.round((Date.now() - R.start) / 60000)), ...t};
  const p = S.exams[R.exam] || {best:0, attempts:0, history:[]};
  S.exams[R.exam] = {best: Math.max(p.best, sc), last: sc, attempts: p.attempts + 1, history: (p.history || []).concat([rec]).slice(-5)};
  const k = R.exam; S.examRun = null; save();
  keyHandler = null;
  main.innerHTML = `<h1>Practice Exam ${k === 'A' ? 1 : 2}: results</h1>${timeout ? '<div class="banner">Time ran out, so the exam was submitted automatically.</div>' : ''}
  <div class="card"><div style="font-size:2.2rem;font-weight:700">${pct(sc)} <span class="muted" style="font-size:1rem">${res.filter(x => x.ok).length} / ${res.length} · ${rec.mins} min</span></div>
  <p>${sc >= 0.75 ? '<span class="pill good">Meets the 75% readiness bar</span>' : '<span class="pill bad">Below the 75% readiness bar</span>'} <span class="small muted">CLEP doesn't publish a percent-to-score conversion. The 75% bar is a deliberately safe margin above a typical passing raw score <span class="pill">unverified</span>.</span></p>
  ${breakdownHTML(rec)}<div class="row"><a class="btn" href="#/mistakes">Drill the misses</a><a class="btn ghost" href="#/exams">Back to exams</a></div></div>
  ${reviewList(res.filter(x => !x.ok))}`;
  window.scrollTo(0,0);
}
function breakdownHTML(rec){
  const rows = (obj, name) => Object.entries(obj).sort((a,b) => (isNaN(a[0]) ? 0 : a[0] - b[0])).map(([k, v]) => { const p = v.c / v.n; return `<tr><td>${name(k)}</td><td>${v.c}/${v.n}</td><td style="width:40%"><div class="bar ${p >= 0.75 ? 'good' : ''}"><span style="width:${p*100}%"></span></div></td><td>${pct(p)}</td></tr>`; }).join('');
  return `<div class="tablewrap"><table><thead><tr><th>By unit</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.unit, k => `${k}. ${esc(UNITS[k-1].title)}`)}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>By official theme</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.theme, k => esc(THEMES[k].short) + ` <span class="muted small">(${THEMES[k].percent}% of exam)</span>`)}</tbody></table>
  <table style="margin-top:10px"><thead><tr><th>By period</th><th></th><th></th><th></th></tr></thead><tbody>${rows(rec.period, k => k === 'early' ? '1865–1914' : '1915–present')}</tbody></table></div>`;
}
